<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#4f46e5">
  <link rel="icon" type="image/png" href="cultivarlogo.png">
  <title>Review — Cultivar</title>
  <link rel="stylesheet" href="style.css">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="cultivarlogo.png">
</head>
<body>

<!-- Loading -->
<div id="loading-view" class="page-center">
  <div class="spinner"></div>
  <p style="color:var(--muted);font-size:.9rem">Loading cards…</p>
</div>

<!-- All done / caught up -->
<div id="done-view" class="page-center empty-state hidden">
  <div class="empty-icon">🎉</div>
  <h2 id="done-title">Session complete!</h2>
  <p id="done-msg"></p>
  <button class="btn btn-secondary hidden" id="repeat-btn" style="margin-top:8px;width:100%;max-width:280px">Practice today's words</button>
  <button class="btn btn-secondary hidden" id="more-btn" style="margin-top:8px;width:100%;max-width:280px">Review more</button>
  <button class="btn btn-primary hidden" id="cram-reset-btn" style="margin-top:8px;width:100%;max-width:280px">Reset &amp; revise again</button>
  <a href="index.html" class="btn btn-primary" style="margin-top:8px" id="done-home">Back to Home</a>
</div>

<!-- Review UI -->
<div id="review-view" class="hidden">
  <header class="review-header">
    <a href="index.html" class="btn-icon" style="font-size:1.1rem">←</a>
    <div class="progress-track" id="prog-track"></div>
    <span id="progress-text">0/0</span>
  </header>

  <div class="review-body">
    <div class="direction-chip" id="dir-chip"></div>

    <!-- Flashcard -->
    <div class="flip-wrap" id="flip-wrap">
      <div class="flip-card" id="flip-card">
        <div class="flip-front">
          <span class="card-hint-text">Tap to reveal</span>
          <div class="card-main-word" id="front-word"></div>
          <div class="card-example" id="front-extra" style="display:none"></div>
        </div>
        <div class="flip-back">
          <div class="card-translation" id="back-answer"></div>
          <div class="card-example" id="back-example" style="display:none"></div>
          <div class="card-notes" id="back-notes" style="display:none"></div>
        </div>
      </div>
    </div>

    <!-- Answer buttons (hidden until flipped) -->
    <div class="answer-row hidden" id="answer-row">
      <button class="btn-wrong" id="btn-wrong">✗ Didn't know</button>
      <button class="btn-right" id="btn-right">✓ Got it!</button>
    </div>

    <!-- Cram-mode rating buttons (three options) -->
    <div class="answer-row three hidden" id="cram-answer-row">
      <button class="btn-wrong" id="cram-no">Don't know</button>
      <button class="btn-partial" id="cram-partial">Partially</button>
      <button class="btn-right" id="cram-yes">Know it</button>
    </div>

    <p class="tap-prompt" id="tap-prompt">Tap card to reveal answer</p>

    <!-- Level indicator -->
    <p id="level-label" style="font-size:.8rem;color:var(--muted)"></p>
  </div>
</div>

<script type="module">
import { auth } from './js/config.js';
import { updateProgress, autoIntroduceDailyForDeck, getDueCardsForDeck,
         getTodayCardsForDeck, introduceWordsForDeck, getPendingCountForDeck,
         canIntroduceMoreForDeck, getUserSettings, getCramCards,
         getCramKnown, setCramKnown, resetCram } from './js/db.js';
import { levelLabel } from './js/srs.js';
import { onAuthStateChanged } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js';

const params = new URLSearchParams(location.search);
const mode = params.get('mode');
const reviewOnly = mode === 'review';
const cramMode = mode === 'cram';
const deckId = params.get('deck');
const dirFilter  = params.get('dir'); // 'vn_en', 'en_vn', or null (both)
const cramFilter = cramMode ? JSON.parse(sessionStorage.getItem('cramFilter') || '{}') : {};
// Cram sessions read their deck list from sessionStorage (set by cram.html)
const cramDeckIds = cramMode ? JSON.parse(sessionStorage.getItem('cramDecks') || '[]') : [];
if (!cramMode && !deckId) location.href = 'index.html';
if (cramMode && cramDeckIds.length === 0) location.href = 'cram.html';

// Which set of answer buttons this session uses
const answerRowId = cramMode ? 'cram-answer-row' : 'answer-row';

const cardKey = c => `${c.word.id}_${c.direction}`;

let queue = [];
let cramCards = [];
let totalUnique = 0;
let mastered = 0;
let uid = null;
let flipped = false;
let settings = { daily_new: 12, session_max: 36 };
let wrongInSession  = new Set(); // progressIds answered wrong this session (SRS)
let cramRatings     = new Map(); // cardKey → 'known'|'partial'|'soon' (cram)
let cramFirstRating = new Map(); // cardKey → first rating given this session
let preKnownCount   = 0;         // cards already known before session started

onAuthStateChanged(auth, async user => {
  if (!user) { window.location.href = 'index.html'; return; }
  uid = user.uid;
  settings = await getUserSettings(uid);

  let cards;
  if (cramMode) {
    const [all, known] = await Promise.all([getCramCards(uid, cramDeckIds), getCramKnown(uid)]);
    // Apply subunit filter (from cram page unit/subunit picker)
    const subFiltered = Object.keys(cramFilter).length > 0
      ? all.filter(c => {
          const f = cramFilter[c.deckId];
          if (!f) return true;
          return f.includes(c.word.subunit || '');
        })
      : all;
    const pool = dirFilter ? subFiltered.filter(c => c.direction === dirFilter) : subFiltered;
    // Pre-populate ratings for already-known cards in this direction
    for (const c of pool) {
      if (known[cardKey(c)]) cramRatings.set(cardKey(c), 'known');
    }
    cramCards = pool;
    cards = pool.filter(c => !known[cardKey(c)]);
    totalUnique = pool.length;
    mastered = pool.length - cards.length;
    preKnownCount = mastered;
  } else {
    // Review-only sessions never introduce new words.
    if (!reviewOnly) await autoIntroduceDailyForDeck(uid, deckId);
    cards = await getDueCardsForDeck(uid, deckId, { reviewOnly });
  }

  document.getElementById('loading-view').classList.add('hidden');

  if (cards.length === 0) {
    if (cramMode) { showCramDone(true); return; }
    document.getElementById('done-title').textContent = 'All caught up! 🎉';
    document.getElementById('done-msg').textContent =
      reviewOnly ? 'No review words due today for this deck.' : 'No cards due today for this deck.';
    showPracticeButton();
    document.getElementById('done-view').classList.remove('hidden');
    return;
  }

  queue = shuffle([...cards]);
  if (!cramMode) { totalUnique = queue.length; mastered = 0; }  // cram set these already
  document.getElementById('review-view').classList.remove('hidden');
  showCard(queue[0]);
});

async function showPracticeButton() {
  const todayCards = await getTodayCardsForDeck(uid, deckId);
  if (todayCards.length > 0) {
    document.getElementById('repeat-btn').classList.remove('hidden');
  }
  // Review-only sessions never offer new words.
  if (reviewOnly) return;
  // Only offer more words once you've started every new word already given
  const [pending, canMore] = await Promise.all([
    getPendingCountForDeck(uid, deckId),
    canIntroduceMoreForDeck(uid, deckId)
  ]);
  if (pending > 0) {
    const btn = document.getElementById('more-btn');
    const n = settings.daily_new;
    if (canMore) {
      btn.textContent = `Add ${n} more words (${pending} pending)`;
      btn.disabled = false;
      btn.classList.remove('hidden');
    } else {
      btn.textContent = `Start today's new words to add more (${pending} pending)`;
      btn.disabled = true;
      btn.classList.remove('hidden');
    }
  }
}

document.getElementById('repeat-btn').addEventListener('click', async () => {
  const cards = await getTodayCardsForDeck(uid, deckId);
  if (!cards.length) return;
  startSession(cards);
});

document.getElementById('more-btn').addEventListener('click', async () => {
  const btn = document.getElementById('more-btn');
  if (btn.disabled) return;
  btn.disabled = true; btn.textContent = 'Adding…';
  await introduceWordsForDeck(uid, deckId, settings.daily_new);
  const cards = await getDueCardsForDeck(uid, deckId);
  startSession(cards);
});

function startSession(cards) {
  wrongInSession.clear();
  document.getElementById('done-view').classList.add('hidden');
  document.getElementById('repeat-btn').classList.add('hidden');
  document.getElementById('more-btn').classList.add('hidden');
  queue = shuffle([...cards]);
  totalUnique = queue.length;
  mastered = 0;
  document.getElementById('review-view').classList.remove('hidden');
  showCard(queue[0]);
}

function showCard(card) {
  flipped = false;
  const fc = document.getElementById('flip-card');
  fc.style.transition = 'none';
  fc.classList.remove('flipped');
  fc.getBoundingClientRect();
  fc.style.transition = '';

  document.getElementById(answerRowId).classList.add('hidden');
  document.getElementById('tap-prompt').classList.remove('hidden');

  const { word, direction, progress } = card;
  const isSubject = word.card_type === 'subject';
  document.getElementById('dir-chip').textContent = isSubject
    ? (direction === 'vn_en' ? 'Term → Definition' : 'Definition → Term')
    : (direction === 'vn_en' ? 'Word → Translation' : 'Translation → Word');

  const frontWord  = direction === 'vn_en' ? word.vietnamese : word.english;
  const backAnswer = direction === 'vn_en' ? word.english    : word.vietnamese;
  const example    = direction === 'vn_en'
    ? (word.example_vn || word.example || '')
    : (word.example_en || word.example || '');

  document.getElementById('front-word').textContent = frontWord;
  setOptional('front-extra', '');
  document.getElementById('back-answer').textContent = backAnswer;
  setOptional('back-example', example);
  setOptional('back-notes', word.notes || '');
  document.getElementById('level-label').textContent = progress ? `Level: ${levelLabel(progress.level)}` : '';
  updateBar();
}

function setOptional(id, text) {
  const el = document.getElementById(id);
  el.textContent = text;
  el.style.display = text ? '' : 'none';
}

document.getElementById('flip-wrap').addEventListener('click', () => {
  const row = document.getElementById(answerRowId);
  if (flipped) {
    flipped = false;
    document.getElementById('flip-card').classList.remove('flipped');
    row.classList.add('hidden');
    document.getElementById('tap-prompt').classList.remove('hidden');
  } else {
    flipped = true;
    document.getElementById('flip-card').classList.add('flipped');
    row.classList.remove('hidden');
    document.getElementById('tap-prompt').classList.add('hidden');
  }
});

// ── Normal (SRS) two-button answers ───────────────────────────────────────────
document.getElementById('btn-right').addEventListener('click', () => answer(true));
document.getElementById('btn-wrong').addEventListener('click', () => answer(false));

async function answer(correct) {
  document.getElementById('btn-right').disabled = true;
  document.getElementById('btn-wrong').disabled = true;

  const card = queue.shift();
  updateProgress(uid, card.progressId, correct).catch(console.error);
  if (correct) {
    mastered++;
    wrongInSession.delete(card.progressId);
  } else {
    wrongInSession.add(card.progressId);
    queue.push(card);
  }

  if (queue.length === 0) {
    document.getElementById('review-view').classList.add('hidden');
    document.getElementById('done-title').textContent = 'Session complete! 🎉';
    document.getElementById('done-msg').textContent =
      `${mastered} card${mastered !== 1 ? 's' : ''} done.`;
    showPracticeButton();
    document.getElementById('done-view').classList.remove('hidden');
    return;
  }

  setTimeout(() => {
    document.getElementById('btn-right').disabled = false;
    document.getElementById('btn-wrong').disabled = false;
    showCard(queue[0]);
  }, 160);
}

// ── Cram three-button ratings ─────────────────────────────────────────────────
const cramBtns = ['cram-no', 'cram-partial', 'cram-yes'].map(id => document.getElementById(id));
document.getElementById('cram-yes').addEventListener('click',     () => cramAnswer('known'));
document.getElementById('cram-partial').addEventListener('click', () => cramAnswer('partial'));
document.getElementById('cram-no').addEventListener('click',      () => cramAnswer('soon'));

function cramAnswer(rating) {
  cramBtns.forEach(b => b.disabled = true);
  const card = queue.shift();
  const key = cardKey(card);

  if (!cramFirstRating.has(key)) cramFirstRating.set(key, rating);

  if (rating === 'known') {
    cramRatings.set(key, 'known');
    setCramKnown(uid, key, true).catch(console.error);
    mastered++;
  } else if (rating === 'soon') {
    cramRatings.set(key, 'soon');
    queue.splice(Math.min(queue.length, 4), 0, card); // ask again fairly soon
  } else {
    cramRatings.set(key, 'partial');
    queue.push(card); // partial: ask again near the end
  }

  if (queue.length === 0) { showCramDone(false); return; }

  setTimeout(() => {
    cramBtns.forEach(b => b.disabled = false);
    showCard(queue[0]);
  }, 140);
}

function showCramDone(noneLeft) {
  document.getElementById('review-view').classList.add('hidden');
  updateBar();

  if (noneLeft) {
    document.getElementById('done-title').textContent = 'All words known! 🎉';
    document.getElementById('done-msg').textContent =
      'Every word was already marked known. Reset to go through them again.';
  } else {
    const fr = [...cramFirstRating.values()];
    const knownFirst   = fr.filter(v => v === 'known').length;
    const partialFirst = fr.filter(v => v === 'partial').length;
    const soonFirst    = fr.filter(v => v === 'soon').length;
    const parts = [];
    if (preKnownCount > 0)  parts.push(`${preKnownCount} already known`);
    if (knownFirst > 0)     parts.push(`${knownFirst} got it first try`);
    if (partialFirst > 0)   parts.push(`${partialFirst} needed a couple of goes`);
    if (soonFirst > 0)      parts.push(`${soonFirst} needed lots of practice`);
    document.getElementById('done-title').textContent = 'Session complete! 🎉';
    document.getElementById('done-msg').textContent = parts.join(' · ');
  }

  document.getElementById('cram-reset-btn').classList.remove('hidden');
  document.getElementById('done-view').classList.remove('hidden');
}

document.getElementById('cram-reset-btn').addEventListener('click', async () => {
  const btn = document.getElementById('cram-reset-btn');
  btn.disabled = true; btn.textContent = 'Resetting…';
  await resetCram(uid);
  cramFirstRating.clear();
  preKnownCount = 0;
  queue = shuffle([...cramCards]);
  totalUnique = cramCards.length;
  mastered = 0;
  document.getElementById('done-view').classList.add('hidden');
  btn.classList.add('hidden');
  btn.disabled = false; btn.textContent = 'Reset & revise again';
  document.getElementById('review-view').classList.remove('hidden');
  showCard(queue[0]);
});

function updateBar() {
  const track = document.getElementById('prog-track');
  if (cramMode) {
    const vals         = [...cramRatings.values()];
    const knownCount   = vals.filter(v => v === 'known').length;
    const partialCount = vals.filter(v => v === 'partial').length;
    const soonCount    = vals.filter(v => v === 'soon').length;
    const unseenCount  = Math.max(0, totalUnique - knownCount - partialCount - soonCount);
    track.innerHTML = segs([
      { n: knownCount,   color: 'var(--correct)'  },
      { n: partialCount, color: '#f59e0b'          },
      { n: soonCount,    color: 'var(--incorrect)' },
      { n: unseenCount,  color: 'var(--border)'    },
    ], totalUnique);
  } else {
    const wrongCount  = wrongInSession.size;
    const unseenCount = Math.max(0, totalUnique - mastered - wrongCount);
    track.innerHTML = segs([
      { n: mastered,    color: 'var(--correct)'  },
      { n: wrongCount,  color: 'var(--incorrect)' },
      { n: unseenCount, color: 'var(--border)'    },
    ], totalUnique);
  }
  document.getElementById('progress-text').textContent = `${mastered}/${totalUnique}`;
}

function segs(items, total) {
  if (!total) return '';
  return items
    .filter(s => s.n > 0)
    .map(s => `<div style="flex:${s.n};background:${s.color};height:100%"></div>`)
    .join('');
}

function shuffle(arr) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}
</script>

</body>
