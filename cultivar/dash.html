<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#4f46e5">
  <link rel="icon" type="image/png" href="cultivarlogo.png">
  <title>Dashboard — Cultivar</title>
  <link rel="stylesheet" href="style.css">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="cultivarlogo.png">
</head>
<body>

<header class="page-header">
  <div style="display:flex;align-items:center;gap:8px">
    <img src="cultivarlogo.png" alt="" style="height:22px;width:auto;opacity:.55">
    <h1>Dashboard</h1>
  </div>
  <div style="width:44px"></div>
</header>

<main class="main-pad">

  <div id="dash-deck-buttons" style="display:flex;flex-direction:column;gap:8px;margin-bottom:24px"></div>

  <div id="dash-content" class="hidden">

    <!-- Settings -->
    <div class="panel" style="margin-bottom:16px">
      <div class="panel-title">⚙️ Daily limits</div>
      <div class="panel-body">
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:6px">
          <div class="form-group">
            <label for="setting-daily-new">New words / day</label>
            <input type="number" id="setting-daily-new" min="1" max="50" value="12" style="width:100%">
          </div>
          <div class="form-group">
            <label for="setting-session-max">Session cap (total)</label>
            <input type="number" id="setting-session-max" min="12" max="200" value="36" style="width:100%">
          </div>
        </div>
        <p style="font-size:.78rem;color:var(--muted);margin-bottom:12px">
          Each new word is tested in both directions, so 12 new words = 24 cards.
          The session cap is the total including new cards — the rest are reviews.
          Default 12 new / 36 total leaves 12 slots for reviews.
        </p>
        <button class="btn btn-primary btn-full" id="save-settings-btn">Save settings</button>
      </div>
    </div>

    <!-- Word list -->
    <div id="word-list-section" style="margin-bottom:32px">
      <div class="section-heading">
        <h2 id="word-list-heading">Words</h2>
      </div>
      <div id="word-loading" style="text-align:center;padding:20px;display:none">
        <div class="spinner" style="margin:0 auto"></div>
      </div>
      <div id="word-list"></div>
    </div>

    <!-- Reset progress — always at the bottom -->
    <div style="margin-top:48px;padding-top:24px;border-top:1px solid var(--border);text-align:center">
      <button id="reset-deck-btn" style="background:none;border:none;color:var(--muted);font-size:.8rem;cursor:pointer;text-decoration:underline">
        Reset progress for this deck
      </button>
    </div>
  </div>

</main>

<!-- Selection action bar — appears above nav when words are checked -->
<div id="selection-bar" style="display:none;flex-direction:column;gap:6px;position:fixed;bottom:var(--nav-h);left:0;right:0;max-width:540px;margin:0 auto;background:var(--surface);border-top:2px solid var(--brand);padding:8px 16px;z-index:20;box-shadow:0 -2px 8px rgba(0,0,0,.08)">
  <div style="display:flex;align-items:center">
    <span id="sel-count" style="flex:1;font-size:.9rem;font-weight:600;color:var(--brand)"></span>
    <button id="sel-clear-btn" style="background:none;border:none;color:var(--muted);cursor:pointer;font-size:.8rem;padding:4px">Clear</button>
  </div>
  <div style="display:flex;gap:6px;flex-wrap:wrap">
    <button id="sel-earlier-btn" class="btn btn-secondary" style="padding:5px 11px;min-height:32px;font-size:.82rem">← Earlier</button>
    <button id="sel-later-btn" class="btn btn-secondary" style="padding:5px 11px;min-height:32px;font-size:.82rem">Later →</button>
    <button id="sel-ask-soon-btn" style="padding:5px 11px;min-height:32px;font-size:.82rem;border-radius:8px;cursor:pointer;border:1px solid var(--correct);background:none;color:var(--correct)">Ask soon</button>
    <button id="sel-skip-btn" style="padding:5px 11px;min-height:32px;font-size:.82rem;border-radius:8px;cursor:pointer;border:1px solid var(--muted);background:none;color:var(--muted)">Skip</button>
    <button id="sel-never-btn" style="padding:5px 11px;min-height:32px;font-size:.82rem;border-radius:8px;cursor:pointer;border:1px solid var(--incorrect);background:none;color:var(--incorrect)">Never</button>
  </div>
</div>

<nav class="bottom-nav">
  <a href="index.html" class="nav-item"><span class="nav-icon">📖</span><span class="nav-label">Learn</span></a>
  <a href="cram.html" class="nav-item"><span class="nav-icon">🎯</span><span class="nav-label">Cram</span></a>
  <a href="dash.html" class="nav-item active"><span class="nav-icon">📊</span><span class="nav-label">Dash</span></a>
</nav>

<div class="toast" id="toast"></div>

<script type="module">
import { auth } from './js/config.js';
import { getUser, getPublicDecks, getPersonalCards, resetDeckProgress, getUserSettings, updateUserSettings,
         getDeckWordsWithProgress, setWordStatus, bulkSetWordStatus, moveWordBox,
         bulkMoveWordBox, removeWordFromCycle, boxLabel } from './js/db.js';
import { onAuthStateChanged } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js';

let uid = null;

onAuthStateChanged(auth, async user => {
  if (!user) { window.location.href = 'index.html'; return; }
  uid = user.uid;

  let userData, decks, settings, personalCards;
  try {
    [userData, decks, settings, personalCards] = await Promise.all([
      getUser(uid), getPublicDecks(), getUserSettings(uid), getPersonalCards(uid)
    ]);
  } catch (e) {
    console.error('dash load error', e);
    document.getElementById('dash-deck-buttons').innerHTML =
      '<p style="color:var(--muted);font-size:.9rem">Failed to load. Check your connection and reload.</p>';
    return;
  }

  document.getElementById('setting-daily-new').value = settings.daily_new;
  document.getElementById('setting-session-max').value = settings.session_max;

  const subscribed = new Set(userData?.subscribed_decks || []);
  const btnContainer = document.getElementById('dash-deck-buttons');

  const addDeckBtn = (id, name) => {
    const btn = document.createElement('button');
    btn.className = 'btn btn-secondary btn-full';
    btn.style.cssText = 'text-align:left;justify-content:flex-start';
    btn.dataset.deckId = id;
    btn.textContent = name;
    btn.addEventListener('click', async () => {
      btnContainer.querySelectorAll('button').forEach(b => {
        b.className = 'btn btn-secondary btn-full';
        b.style.cssText = 'text-align:left;justify-content:flex-start';
      });
      btn.className = 'btn btn-primary btn-full';
      currentDeckId = id;
      currentDeckName = name;
      document.getElementById('dash-content').classList.remove('hidden');
      await loadWordList();
    });
    btnContainer.appendChild(btn);
  };

  if (personalCards.length > 0) addDeckBtn('personal', 'Personal cards');
  for (const d of decks.filter(d => subscribed.has(d.id))) {
    addDeckBtn(d.id, d.name);
  }
});

document.getElementById('save-settings-btn').addEventListener('click', async () => {
  const btn = document.getElementById('save-settings-btn');
  btn.disabled = true; btn.textContent = 'Saving…';
  const daily_new   = Math.max(1,  Math.min(50,  parseInt(document.getElementById('setting-daily-new').value)  || 12));
  const session_max = Math.max(12, Math.min(200, parseInt(document.getElementById('setting-session-max').value) || 36));
  try {
    await updateUserSettings(uid, { daily_new, session_max });
    showToast('Settings saved');
  } catch (e) { showToast('Save failed'); }
  btn.disabled = false; btn.textContent = 'Save settings';
});

let currentDeckId   = null;
let currentDeckName = '';
let selectedIds     = new Set();
let lastCheckedIdx  = -1;

// ── Selection bar ─────────────────────────────────────────────────────────────

function updateSelectionBar() {
  const bar = document.getElementById('selection-bar');
  const n   = selectedIds.size;
  document.getElementById('sel-count').textContent = `${n} selected`;
  bar.style.display = n > 0 ? 'flex' : 'none';
}

document.getElementById('sel-clear-btn').addEventListener('click', () => {
  selectedIds.clear();
  lastCheckedIdx = -1;
  document.querySelectorAll('.word-cb').forEach(c => c.checked = false);
  updateSelectionBar();
});

async function bulkMove(direction) {
  const eBtn = document.getElementById('sel-earlier-btn');
  const lBtn = document.getElementById('sel-later-btn');
  eBtn.disabled = lBtn.disabled = true;
  eBtn.textContent = direction === 'earlier' ? '← Moving…' : '← Earlier';
  lBtn.textContent = direction === 'later'   ? 'Moving… →' : 'Later →';

  const ids = [...selectedIds];
  await bulkMoveWordBox(uid, ids, direction);

  selectedIds.clear();
  lastCheckedIdx = -1;
  eBtn.textContent = '← Earlier'; lBtn.textContent = 'Later →';
  eBtn.disabled = lBtn.disabled = false;
  await loadWordList();
}

document.getElementById('sel-earlier-btn').addEventListener('click', () => bulkMove('earlier'));
document.getElementById('sel-later-btn').addEventListener('click',   () => bulkMove('later'));

async function bulkStatus(status) {
  const ids = [...selectedIds];
  if (!ids.length) return;
  ['sel-ask-soon-btn','sel-skip-btn','sel-never-btn','sel-earlier-btn','sel-later-btn'].forEach(id => {
    const b = document.getElementById(id); if (b) b.disabled = true;
  });
  await bulkSetWordStatus(uid, currentDeckId, ids, status);
  selectedIds.clear(); lastCheckedIdx = -1;
  ['sel-ask-soon-btn','sel-skip-btn','sel-never-btn','sel-earlier-btn','sel-later-btn'].forEach(id => {
    const b = document.getElementById(id); if (b) b.disabled = false;
  });
  await loadWordList();
}

document.getElementById('sel-ask-soon-btn').addEventListener('click', () => bulkStatus('ask_soon'));
document.getElementById('sel-skip-btn').addEventListener('click',     () => bulkStatus('skip'));
document.getElementById('sel-never-btn').addEventListener('click',    () => bulkStatus('never'));

// ── Word list ─────────────────────────────────────────────────────────────────

async function loadWordList() {
  selectedIds.clear();
  lastCheckedIdx = -1;
  updateSelectionBar();

  const loading = document.getElementById('word-loading');
  const list    = document.getElementById('word-list');
  loading.style.display = 'block';
  list.innerHTML = '';

  const words = await getDeckWordsWithProgress(uid, currentDeckId);
  const totalPending = words.filter(w => !w.introduced && w.status !== 'never').length;
  document.getElementById('word-list-heading').textContent = `Words (${words.length})`;
  loading.style.display = 'none';

  if (words.length === 0) {
    list.innerHTML = '<p style="color:var(--muted);font-size:.9rem;padding:8px 0">No words yet.</p>';
    return;
  }

  // Top-level bulk "Ask all pending" for the whole deck
  if (totalPending > 0) {
    const topBtn = document.createElement('button');
    topBtn.className = 'btn btn-secondary btn-full';
    topBtn.style.marginBottom = '16px';
    topBtn.textContent = `Ask all ${totalPending} pending words soon`;
    topBtn.addEventListener('click', async () => {
      topBtn.disabled = true; topBtn.textContent = 'Marking…';
      await bulkSetWordStatus(uid, currentDeckId, words.filter(w => !w.introduced && w.status !== 'never').map(w => w.id), 'ask_soon');
      await loadWordList();
    });
    list.appendChild(topBtn);
  }

  const byUnit = {};
  const flat   = {};
  for (const item of words) {
    if (item.word.unit) {
      const u = item.word.unit;
      const s = item.word.subunit || '';
      if (!byUnit[u]) byUnit[u] = {};
      if (!byUnit[u][s]) byUnit[u][s] = [];
      byUnit[u][s].push(item);
    } else {
      const c = item.word.subunit || item.word.category || '';
      if (!flat[c]) flat[c] = [];
      flat[c].push(item);
    }
  }

  const totalTopLevelGroups = Object.keys(byUnit).length + Object.keys(flat).length;
  const autoCollapse = words.length > 250 && totalTopLevelGroups > 1;

  let orderIdx = 0;

  function makeSelectAllCb(ids, size) {
    const cb = document.createElement('input');
    cb.type = 'checkbox';
    cb.style.cssText = `width:${size}px;height:${size}px;flex-shrink:0;cursor:pointer;accent-color:var(--brand)`;
    cb.addEventListener('click', e => {
      e.stopPropagation();
      for (const wid of ids) {
        const rowEl = list.querySelector(`[data-word-id="${wid}"]`);
        const c = rowEl?.querySelector('.word-cb');
        if (c) c.checked = cb.checked;
        if (cb.checked) selectedIds.add(wid); else selectedIds.delete(wid);
      }
      updateSelectionBar();
    });
    return cb;
  }

  function makeAskPendingBtn(pendingItems, label) {
    const btn = document.createElement('button');
    btn.textContent = label;
    btn.style.cssText = 'font-size:.72rem;padding:3px 8px;border-radius:6px;cursor:pointer;border:1px solid var(--correct);background:none;color:var(--correct)';
    btn.addEventListener('click', async e => {
      e.stopPropagation();
      btn.disabled = true; btn.textContent = 'Marking…';
      await bulkSetWordStatus(uid, currentDeckId, pendingItems.map(w => w.id), 'ask_soon');
      await loadWordList();
    });
    return btn;
  }

  function makeChevron(collapsed, color) {
    const ch = document.createElement('span');
    ch.textContent = collapsed ? '▶' : '▼';
    ch.style.cssText = `font-size:.65rem;color:${color};flex-shrink:0;width:10px;text-align:center`;
    return ch;
  }

  function wireCollapse(headerEl, bodyEl, chevronEl) {
    headerEl.style.cursor = 'pointer';
    headerEl.style.userSelect = 'none';
    headerEl.addEventListener('click', e => {
      if (e.target.type === 'checkbox') return;
      const hidden = bodyEl.style.display === 'none';
      bodyEl.style.display = hidden ? '' : 'none';
      chevronEl.textContent = hidden ? '▼' : '▶';
    });
  }

  // ── Unit-grouped ──────────────────────────────────────────────────────────
  for (const unit of Object.keys(byUnit).sort()) {
    const subMap      = byUnit[unit];
    const unitItems   = Object.values(subMap).flat();
    const unitIds     = unitItems.map(w => w.id);
    const unitPending = unitItems.filter(w => !w.introduced && w.status !== 'never');

    const uChevron = makeChevron(autoCollapse, 'var(--brand)');
    const uBody    = document.createElement('div');
    if (autoCollapse) uBody.style.display = 'none';

    const uHead = document.createElement('div');
    uHead.style.cssText = 'display:flex;align-items:center;justify-content:space-between;margin:20px 0 0;padding-bottom:6px;border-bottom:2px solid var(--brand)';
    wireCollapse(uHead, uBody, uChevron);

    const uLeft = document.createElement('div');
    uLeft.style.cssText = 'display:flex;align-items:center;gap:8px';
    uLeft.appendChild(uChevron);
    uLeft.appendChild(makeSelectAllCb(unitIds, 18));
    const uTitle = document.createElement('span');
    uTitle.textContent = unit;
    uTitle.style.cssText = 'font-size:.85rem;font-weight:700;color:var(--brand)';
    uLeft.appendChild(uTitle);
    uHead.appendChild(uLeft);
    if (unitPending.length > 0) uHead.appendChild(makeAskPendingBtn(unitPending, `Ask all ${unitPending.length} pending`));
    list.appendChild(uHead);
    list.appendChild(uBody);

    for (const sub of Object.keys(subMap).sort()) {
      const subItems   = subMap[sub];
      const subIds     = subItems.map(w => w.id);
      const subPending = subItems.filter(w => !w.introduced && w.status !== 'never');

      if (sub) {
        const sChevron      = makeChevron(autoCollapse, 'var(--muted)');
        const sWordsContainer = document.createElement('div');
        if (autoCollapse) sWordsContainer.style.display = 'none';

        const sHead = document.createElement('div');
        sHead.style.cssText = 'display:flex;align-items:center;justify-content:space-between;margin:12px 0 0 8px;padding-bottom:3px;border-bottom:1px solid var(--border)';
        wireCollapse(sHead, sWordsContainer, sChevron);

        const sLeft = document.createElement('div');
        sLeft.style.cssText = 'display:flex;align-items:center;gap:8px';
        sLeft.appendChild(sChevron);
        sLeft.appendChild(makeSelectAllCb(subIds, 16));
        const sTitle = document.createElement('span');
        sTitle.textContent = sub;
        sTitle.style.cssText = 'font-size:.75rem;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.05em';
        sLeft.appendChild(sTitle);
        sHead.appendChild(sLeft);
        if (subPending.length > 0) sHead.appendChild(makeAskPendingBtn(subPending, `Ask all ${subPending.length}`));
        uBody.appendChild(sHead);
        for (const item of subItems) sWordsContainer.appendChild(renderWordRow(item, orderIdx++));
        uBody.appendChild(sWordsContainer);
      } else {
        for (const item of subItems) uBody.appendChild(renderWordRow(item, orderIdx++));
      }
    }
  }

  // ── Flat / legacy (no unit field) ─────────────────────────────────────────
  const flatCats = Object.keys(flat).sort((a, b) => !a && b ? 1 : a && !b ? -1 : a.localeCompare(b));
  const showFlatHeaders = flatCats.length > 1 || (flatCats.length === 1 && flatCats[0] !== '') || Object.keys(byUnit).length > 0;

  for (const cat of flatCats) {
    const catItems   = flat[cat];
    const catIds     = catItems.map(w => w.id);
    const catPending = catItems.filter(w => !w.introduced && w.status !== 'never');

    if (showFlatHeaders) {
      const catChevron = makeChevron(autoCollapse, 'var(--muted)');
      const catBody    = document.createElement('div');
      if (autoCollapse) catBody.style.display = 'none';

      const header = document.createElement('div');
      header.style.cssText = 'display:flex;align-items:center;justify-content:space-between;margin:16px 0 0;padding-bottom:4px;border-bottom:2px solid var(--border)';
      wireCollapse(header, catBody, catChevron);

      const left = document.createElement('div');
      left.style.cssText = 'display:flex;align-items:center;gap:8px';
      left.appendChild(catChevron);
      left.appendChild(makeSelectAllCb(catIds, 18));
      const title = document.createElement('span');
      title.textContent = cat || 'Uncategorised';
      title.style.cssText = 'font-size:.8rem;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.05em';
      left.appendChild(title);
      header.appendChild(left);
      if (catPending.length > 0) header.appendChild(makeAskPendingBtn(catPending, `Ask all ${catPending.length} pending`));
      list.appendChild(header);
      for (const item of catItems) catBody.appendChild(renderWordRow(item, orderIdx++));
      list.appendChild(catBody);
    } else {
      for (const item of catItems) list.appendChild(renderWordRow(item, orderIdx++));
    }
  }
}

function renderWordRow(item, orderIdx = -1) {
  const { id, word, introduced, progress, status } = item;
  const front = word.vietnamese || '';
  const back  = word.english   || '';

  const row = document.createElement('div');
  row.dataset.wordId   = id;
  if (orderIdx >= 0) row.dataset.orderIdx = orderIdx;
  row.style.cssText = 'display:flex;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid var(--border)';

  // Checkbox
  const cb = document.createElement('input');
  cb.type = 'checkbox'; cb.className = 'word-cb';
  cb.style.cssText = 'width:18px;height:18px;flex-shrink:0;cursor:pointer;accent-color:var(--brand)';
  cb.addEventListener('click', e => {
    if (e.shiftKey && lastCheckedIdx >= 0 && orderIdx >= 0) {
      const lo = Math.min(orderIdx, lastCheckedIdx);
      const hi = Math.max(orderIdx, lastCheckedIdx);
      document.querySelectorAll('[data-order-idx]').forEach(r => {
        const rIdx = parseInt(r.dataset.orderIdx);
        if (rIdx >= lo && rIdx <= hi) {
          const c = r.querySelector('.word-cb');
          if (c) { c.checked = true; selectedIds.add(r.dataset.wordId); }
        }
      });
    } else {
      cb.checked ? selectedIds.add(id) : selectedIds.delete(id);
    }
    if (orderIdx >= 0) lastCheckedIdx = orderIdx;
    updateSelectionBar();
  });
  row.appendChild(cb);

  // Word text
  const label = document.createElement('div');
  label.style.cssText = 'flex:1;min-width:0;overflow:hidden';
  label.innerHTML = `<span style="font-weight:600">${esc(front)}</span><span style="color:var(--muted);margin:0 4px">→</span><span style="color:var(--muted);font-size:.9rem">${esc(back)}</span>`;
  row.appendChild(label);

  if (introduced && progress) {
    const boxWrap = document.createElement('div');
    boxWrap.style.cssText = 'display:flex;align-items:center;gap:4px;flex-shrink:0';

    const btnStyle = 'background:none;border:1px solid var(--border);border-radius:6px;padding:2px 7px;cursor:pointer;font-size:.85rem';
    const leftBtn  = Object.assign(document.createElement('button'), { textContent: '←', title: 'Earlier box' });
    const boxSpan  = document.createElement('span');
    const rightBtn = Object.assign(document.createElement('button'), { textContent: '→', title: 'Later box'   });
    [leftBtn, rightBtn].forEach(b => b.style.cssText = btnStyle);
    leftBtn.disabled  = progress.level === 0;
    rightBtn.disabled = progress.level === 6;
    boxSpan.textContent = boxLabel(progress.level);
    boxSpan.style.cssText = 'font-size:.8rem;color:var(--muted);min-width:58px;text-align:center';

    const moveOne = async direction => {
      leftBtn.disabled = rightBtn.disabled = true;
      selectedIds.delete(id); updateSelectionBar();
      await moveWordBox(uid, id, direction);
      const newLevel = direction === 'earlier' ? Math.max(0, progress.level-1) : Math.min(6, progress.level+1);
      row.replaceWith(renderWordRow({ ...item, progress: { ...progress, level: newLevel } }, orderIdx));
    };
    leftBtn.addEventListener('click',  () => moveOne('earlier'));
    rightBtn.addEventListener('click', () => moveOne('later'));
    boxWrap.append(leftBtn, boxSpan, rightBtn);
    row.appendChild(boxWrap);

    const neverBtn = document.createElement('button');
    neverBtn.textContent = 'Never';
    neverBtn.style.cssText = 'background:none;border:none;font-size:.72rem;color:var(--muted);cursor:pointer;text-decoration:underline;flex-shrink:0';
    neverBtn.addEventListener('click', async () => {
      if (!confirm(`Remove "${front}" from your review cycle?`)) return;
      neverBtn.disabled = true;
      await removeWordFromCycle(uid, currentDeckId, id);
      selectedIds.delete(id); updateSelectionBar();
      row.remove();
    });
    row.appendChild(neverBtn);

  } else {
    const btnWrap = document.createElement('div');
    btnWrap.style.cssText = 'display:flex;gap:4px;flex-shrink:0;flex-wrap:wrap';
    for (const { key, label, color } of [
      { key: 'ask_soon', label: 'Ask soon',    color: 'var(--correct)'   },
      { key: 'skip',     label: 'Skip',        color: 'var(--muted)'     },
      { key: 'never',    label: 'Never',       color: 'var(--incorrect)' },
    ]) {
      const isActive = status === key;
      const btn = document.createElement('button');
      btn.textContent = label;
      btn.style.cssText = `font-size:.72rem;padding:3px 8px;border-radius:6px;cursor:pointer;border:1px solid ${color};background:${isActive ? color : 'none'};color:${isActive ? '#fff' : color}`;
      btn.addEventListener('click', async () => {
        btn.disabled = true;
        await setWordStatus(uid, currentDeckId, id, isActive ? 'normal' : key);
        row.replaceWith(renderWordRow({ ...item, status: isActive ? 'normal' : key }, orderIdx));
      });
      btnWrap.appendChild(btn);
    }
    row.appendChild(btnWrap);
  }

  return row;
}

function esc(str) {
  return (str || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

document.getElementById('reset-deck-btn').addEventListener('click', async () => {
  const deckName = currentDeckName || 'this deck';

  const first = confirm(`Reset progress for "${deckName}"?\n\nYour SRS history for all words in this deck will be permanently deleted. You'll start from scratch with this deck.`);
  if (!first) return;
  const second = confirm(`Are you absolutely sure?\n\nThis cannot be undone.`);
  if (!second) return;

  const btn = document.getElementById('reset-deck-btn');
  btn.textContent = 'Resetting…';
  btn.disabled = true;

  try {
    await resetDeckProgress(uid, currentDeckId);
    showToast(`Progress reset for "${deckName}"`);
    btn.textContent = 'Progress reset';
  } catch (err) {
    console.error(err);
    showToast('Reset failed. Try again.');
    btn.textContent = 'Reset progress for this deck';
    btn.disabled = false;
  }
});

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2800);
}
</script>
<script>if("serviceWorker"in navigator)navigator.serviceWorker.register("/cultivar/sw.js");</script>
