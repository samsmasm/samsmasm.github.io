<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lineup class screen</title>
<link rel="stylesheet" href="style.css?v=20261008-193745">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<style>
  main { max-width: 1400px; }
  .top-inner { max-width: 1400px; }

  .signed { color: var(--muted); font-size: 0.9rem; margin-left: auto; text-align: right; }
  .signed button { min-height: 40px; padding: 0.2rem 0.8rem; font-size: 0.85rem; margin-left: 0.5rem; }

  /* Join panel */
  .joinbar { display: flex; flex-wrap: wrap; gap: 1.2rem; align-items: center; }
  .joinbar .how { flex: 1; min-width: 16rem; font-size: 1.2rem; line-height: 1.5; }
  .joinbar .url { font-weight: 700; word-break: break-all; }
  .roomcode { font-size: 3.4rem; font-weight: 800; letter-spacing: 0.2em; line-height: 1.1; color: var(--task-ink); }
  .qr { width: 150px; height: 150px; cursor: zoom-in; border: 2px solid var(--line); border-radius: 8px; padding: 4px; background: #fff; }
  .counts { font-size: 1.1rem; font-weight: 600; }

  /* Join screen: QR code and room code, both big */
  .joinscreen {
    position: fixed; inset: 0; z-index: 100; background: #fff;
    display: grid; grid-template-columns: auto auto; align-items: center; justify-content: center; gap: 5vw;
    padding: 3vh 3vw; cursor: zoom-out;
  }
  .joinscreen .qrsvg { width: min(84vh, 48vw); height: min(84vh, 48vw); }
  .joinscreen .side { text-align: center; }
  .joinscreen .go { font-size: min(4.2vh, 2.6vw); line-height: 1.3; }
  .joinscreen .go b { word-break: break-all; }
  .joinscreen .roomcode { font-size: min(24vh, 9vw); letter-spacing: 0.12em; margin: 1vh 0; }
  .joinscreen .counts { font-size: min(3.6vh, 2.2vw); }
  .joinscreen .close { font-size: min(2.6vh, 1.6vw); color: var(--muted); margin-top: 2vh; }
  @media (orientation: portrait) {
    .joinscreen { grid-template-columns: auto; }
    .joinscreen .qrsvg { width: min(55vh, 86vw); height: min(55vh, 86vw); }
    .joinscreen .go { font-size: 4.5vw; }
    .joinscreen .roomcode { font-size: 20vw; }
    .joinscreen .counts { font-size: 4vw; }
  }

  /* Controls */
  .controls { display: flex; flex-wrap: wrap; gap: 1rem 1.6rem; align-items: center; margin: 1rem 0; }
  .seg { display: inline-flex; flex-wrap: wrap; }
  .seg button { border-radius: 0; margin-left: -2px; background: #fff; color: var(--task-edge); }
  .seg button:first-child { border-radius: 8px 0 0 8px; margin-left: 0; }
  .seg button:last-child { border-radius: 0 8px 8px 0; }
  .seg button[aria-pressed=true] { background: var(--task-edge); color: #fff; }
  .seg-label { font-weight: 700; margin-right: 0.5rem; }
  button.danger { background: #fff; color: var(--big-edge); border-color: var(--big-edge); }
  button.danger.armed { background: var(--big-edge); color: #fff; }

  .legend { display: flex; flex-wrap: wrap; gap: 0.4rem 1.2rem; align-items: center; font-weight: 600; }
  .legend .sw, .meta .sw { display: inline-block; width: 1.1em; height: 1.1em; border-radius: 4px; vertical-align: -0.15em; margin-right: 0.35em; border: 2px solid #14141f; }

  /* Stacked spectrums */
  .grid { margin-top: 1rem; }
  .row, .headrow {
    display: grid;
    grid-template-columns: 17rem 1fr;
    gap: 0 1.2rem;
    align-items: center;
  }
  .headrow {
    position: sticky; top: 0; z-index: 5; background: #fff;
    padding: 0.5rem 0; border-bottom: 2px solid #14141f;
    font-weight: 800; font-size: 1rem; line-height: 1.3;
  }
  .headrow .ends { display: flex; justify-content: space-between; gap: 1rem; }
  .headrow .ends span { max-width: 45%; }
  .headrow .ends span:last-child { text-align: right; }

  .row {
    border-left: 12px solid #bbb;
    border-bottom: 1px solid var(--line);
    padding: 0.5rem 0 0.5rem 0.8rem;
  }
  .meta .name { font-weight: 800; font-size: 1.05rem; line-height: 1.3; }
  .meta .era { font-size: 0.8rem; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: var(--task-edge); margin-right: 0.4em; }
  .meta .era:empty { display: none; }
  .meta .stat { font-size: 0.9rem; font-weight: 600; color: var(--muted); }
  .row .note { grid-column: 1 / -1; margin: 0.5rem 0 0.2rem; font-size: 1rem; white-space: pre-line; }

  .track { position: relative; height: 76px; margin: 0 18px; }
  .track .line { position: absolute; left: 0; right: 0; top: 50%; height: 4px; margin-top: -2px; background: #14141f; border-radius: 2px; }
  .track .tick { position: absolute; top: 50%; width: 3px; height: 22px; margin: -11px 0 0 -1.5px; background: #14141f; }
  /* Box plot, drawn under the dots */
  .track .bp { position: absolute; inset: 0; }
  .track .bp > div { position: absolute; transition: left 0.6s, width 0.6s, background 0.6s; }
  .track .whisker { top: 50%; height: 8px; margin-top: -4px; border: 2px solid #14141f; border-radius: 4px; box-sizing: border-box; }
  .track .cap { top: 28%; height: 44%; width: 4px !important; margin-left: -2px; background: #14141f; }
  .track .iqr { top: 18%; height: 64%; border: 3px solid #14141f; border-radius: 4px; opacity: 0.5; min-width: 6px; margin-left: -3px; box-sizing: content-box; }
  .track .median { top: 14%; height: 72%; width: 5px; margin-left: -2.5px; background: #14141f; }
  .track .dot {
    position: absolute; width: 18px; height: 18px; margin: -9px 0 0 -9px; border-radius: 50%;
    background: rgba(26, 45, 90, 0.32); transition: left 0.6s, top 0.6s;
  }
  .track .avg {
    position: absolute; top: 50%; width: 34px; height: 34px; margin: -17px 0 0 -17px; border-radius: 50%;
    border: 5px solid #14141f; z-index: 3; transition: left 0.6s, background 0.6s;
  }
  .track .was {
    position: absolute; top: 50%; width: 30px; height: 30px; margin: -15px 0 0 -15px; border-radius: 50%;
    border: 4px dashed #14141f; background: #fff; z-index: 2; transition: left 0.6s;
  }
  .track .arrow { position: absolute; top: 50%; height: 6px; margin-top: -3px; background: #14141f; z-index: 2; transition: left 0.6s, width 0.6s; }
  .track .none { position: absolute; left: 0; right: 0; top: 0; text-align: center; color: var(--muted); font-size: 0.9rem; }

  .empty-state { font-size: 1.1rem; }
  .cq-head { margin: 0 0 0.6rem; font-size: 1.5rem; }

  .only-display { display: none; }

  /* Display mode: the whole class screen fits the window, for the projector */
  body.display .top, body.display .joinbar, body.display #viewHelp,
  body.display .bottombar, body.display #notesBtn, body.display .row .note,
  body.display .seg-label, body.display .meta .stat,
  body.display .not-display { display: none !important; }
  body.display .only-display { display: inline-flex; }
  body.display main { max-width: none; padding: 0.6vh 1.2vw; }
  body.display #roomView { height: calc(100vh - 1.2vh); display: flex; flex-direction: column; }
  body.display .controls { margin: 0 0 0.6vh; gap: 0.5rem 1.2rem; font-size: min(2.4vh, 1rem); }
  body.display .controls button { min-height: 0; padding: 0.3em 0.8em; }
  body.display .legend { font-size: min(2.2vh, 0.95rem); }
  body.display .mini { font-weight: 800; font-size: min(3.4vh, 1.4rem); letter-spacing: 0.1em; color: var(--task-ink); align-items: center; gap: 0.6em; }
  body.display .mini span { font-weight: 600; letter-spacing: 0; font-size: 0.75em; color: var(--muted); }
  body.display .grid { flex: 1; min-height: 0; display: flex; flex-direction: column; margin-top: 0.4vh; }
  body.display .headrow { position: static; padding: 0.3vh 0; font-size: min(2.4vh, 1rem); }
  body.display .row { flex: 1 1 0; min-height: 0; overflow: hidden; padding: 0 0 0 0.6rem; border-left-width: 10px; grid-template-columns: minmax(12rem, 22vw) 1fr; }
  body.display .headrow { grid-template-columns: minmax(12rem, 22vw) 1fr; }
  body.display .meta .name { font-size: min(2.9vh, 1.2rem); line-height: 1.2; }
  body.display .meta .era { font-size: min(1.9vh, 0.8rem); }
  body.display .track { height: 100%; }
  body.display .track .dot { width: min(2.2vh, 18px); height: min(2.2vh, 18px); margin: calc(min(2.2vh, 18px) / -2) 0 0 calc(min(2.2vh, 18px) / -2); }
  body.display .track .avg { width: min(4.4vh, 34px); height: min(4.4vh, 34px); margin: calc(min(4.4vh, 34px) / -2) 0 0 calc(min(4.4vh, 34px) / -2); border-width: min(0.6vh, 5px); }
  body.display .track .was { width: min(4vh, 30px); height: min(4vh, 30px); margin: calc(min(4vh, 30px) / -2) 0 0 calc(min(4vh, 30px) / -2); border-width: min(0.5vh, 4px); }
  body.display .track .tick { height: 40%; margin-top: 0; transform: translateY(-50%); }

  @media (max-width: 760px) {
    .row, .headrow { grid-template-columns: 1fr; }
    .headrow > :first-child { display: none; }
    .roomcode { font-size: 2.6rem; }
  }
</style>
</head>
<body>

<header class="top">
  <div class="top-inner">
    <img src="../unisamsq.png" alt="" onerror="this.remove()">
    <div>
      <h1>Lineup</h1>
      <p id="deckTitle">Class screen</p>
    </div>
    <div class="signed hidden" id="signedBox"><span id="whoami"></span><button class="quiet" id="signOutBtn">Sign out</button></div>
  </div>
</header>

<main>

  <section id="loading"><p>Loading...</p></section>

  <!-- Signed out -->
  <section id="signInView" class="hidden">
    <div class="box info">
      <p>This is the Lineup class screen. It shows where everyone put each card, so you can talk about the cards where the class disagrees.</p>
      <p>Students do not sign in. Only teachers do, to start a session.</p>
    </div>
    <button id="signInBtn">Sign in with Google</button>
    <p id="signInMsg" class="msg"></p>
  </section>

  <!-- A room -->
  <section id="roomView" class="hidden">
    <h2 class="cq-head not-display" id="cq"></h2>
    <div class="box task joinbar">
      <div class="how">
        <div>Go to <span class="url" id="joinUrl"></span> and type</div>
        <div class="roomcode" id="roomCode"></div>
        <div class="counts" id="counts"></div>
      </div>
      <div class="qr" id="qr" title="Show the join screen"></div>
    </div>

    <div class="controls">
      <div class="only-display mini" id="miniCode"></div>
      <div><span class="seg-label">Show</span><span class="seg" id="viewSeg">
        <button data-v="now" aria-pressed="true">Now</button><button data-v="before" aria-pressed="false">First instinct</button><button data-v="shift" aria-pressed="false">How it shifted</button>
      </span></div>
      <div><span class="seg-label">Order</span><span class="seg" id="orderSeg">
        <button data-o="list" aria-pressed="true">Card list</button><button data-o="split" aria-pressed="false">Most split first</button>
      </span></div>
      <button class="quiet" id="notesBtn" aria-pressed="false">Show notes</button>
      <button id="joinScreenBtn">Join screen</button>
      <button id="displayBtn" class="not-display">Display mode</button>
      <button id="exitDisplayBtn" class="only-display quiet">Exit display</button>
    </div>

    <div class="legend" id="legend"></div>
    <div class="box info" id="viewHelp"></div>

    <div class="grid" id="grid">
      <div class="headrow"><div>Card</div><div class="ends" style="margin: 0 18px"><span id="leftEnd"></span><span id="rightEnd"></span></div></div>
    </div>

    <div class="controls bottombar">
      <button class="quiet" id="backBtn">Back to your decks</button>
      <button class="danger" id="endBtn">End session and delete</button>
    </div>
  </section>

</main>

<div class="joinscreen hidden" id="joinScreen" title="Click to close"></div>

<script type="module" src="class.js?v=20261008-193745"></script>
</body>
</html>
