<svg xmlns="http://www.w3.org/2000/svg" width="680" height="540" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <marker id="axarrow" markerWidth="10" markerHeight="10" refX="6" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#222"/></marker>
    <marker id="gap" markerWidth="9" markerHeight="9" refX="4.5" refY="4.5" orient="auto-start-reverse"><path d="M0,0 L9,4.5 L0,9 Z" fill="#222"/></marker>
  </defs>

  <!-- Axes -->
  <line x1="80" y1="440" x2="635" y2="440" stroke="#222" stroke-width="1.8" marker-end="url(#axarrow)"/>
  <line x1="80" y1="440" x2="80" y2="55" stroke="#222" stroke-width="1.8" marker-end="url(#axarrow)"/>
  <text transform="rotate(-90 30 250)" x="30" y="250" text-anchor="middle" font-size="14" fill="#222">Price level</text>
  <text x="628" y="468" text-anchor="end" font-size="14" fill="#222">Real GDP (Y)</text>
  <text x="70" y="460" text-anchor="end" font-size="13" fill="#222">0</text>

  <!-- Full-employment output (Yf) at the vertical AS section -->
  <line x1="460" y1="170" x2="460" y2="440" stroke="#777" stroke-width="1" stroke-dasharray="5,4"/>

  <!-- Keynesian AS -->
  <path d="M 120 370 L 290 370 Q 460 370 460 170 L 460 80" fill="none" stroke="#C81E5A" stroke-width="2.6"/>
  <text x="470" y="150" font-size="14" fill="#C81E5A">AS</text>

  <!-- AD -->
  <line x1="180" y1="192" x2="540" y2="408" stroke="#1F4DA1" stroke-width="2.6"/>
  <text x="546" y="410" font-size="14" fill="#1F4DA1">AD</text>

  <!-- Equilibrium -->
  <line x1="80" y1="330" x2="410" y2="330" stroke="#777" stroke-width="1" stroke-dasharray="5,4"/>
  <line x1="410" y1="330" x2="410" y2="440" stroke="#777" stroke-width="1" stroke-dasharray="5,4"/>
  <circle cx="410" cy="330" r="4.5" fill="#222"/>
  <text x="74" y="334" text-anchor="end" font-size="13" fill="#222">PL<tspan font-size="10" dy="3">e</tspan></text>
  <text x="410" y="458" text-anchor="middle" font-size="13" fill="#222">Y<tspan font-size="10" dy="3">e</tspan></text>
  <text x="460" y="458" text-anchor="middle" font-size="13" fill="#222">Y<tspan font-size="10" dy="3">f</tspan></text>

  <!-- Spare capacity (Ye to Yf) -->
  <line x1="410" y1="473" x2="460" y2="473" stroke="#222" stroke-width="1.5" marker-start="url(#gap)" marker-end="url(#gap)"/>
  <text x="435" y="491" text-anchor="middle" font-size="12" font-weight="bold" fill="#222">Spare capacity</text>
</svg>
