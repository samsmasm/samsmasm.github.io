<svg xmlns="http://www.w3.org/2000/svg" width="680" height="540" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <marker id="axarrow" markerWidth="10" markerHeight="10" refX="6" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#222"/></marker>
    <marker id="gap" markerWidth="9" markerHeight="9" refX="4.5" refY="4.5" orient="auto-start-reverse"><path d="M0,0 L9,4.5 L0,9 Z" fill="#222"/></marker>
  </defs>

  <line x1="80" y1="440" x2="635" y2="440" stroke="#222" stroke-width="1.8" marker-end="url(#axarrow)"/>
  <line x1="80" y1="440" x2="80" y2="55" stroke="#222" stroke-width="1.8" marker-end="url(#axarrow)"/>
  <text transform="rotate(-90 30 250)" x="30" y="250" text-anchor="middle" font-size="14" fill="#222">Wage</text>
  <text x="628" y="468" text-anchor="end" font-size="14" fill="#222">Employment (L)</text>
  <text x="70" y="460" text-anchor="end" font-size="13" fill="#222">0</text>

  <!-- Labour demand and supply -->
  <line x1="130" y1="120" x2="560" y2="420" stroke="#1F4DA1" stroke-width="2.6"/>
  <text x="566" y="422" font-size="13" fill="#1F4DA1">DL</text>
  <line x1="130" y1="420" x2="560" y2="120" stroke="#1F4DA1" stroke-width="2.6"/>
  <text x="566" y="122" font-size="13" fill="#1F4DA1">SL</text>

  <!-- Minimum wage (above equilibrium) -->
  <line x1="80" y1="200" x2="520" y2="200" stroke="#C81E5A" stroke-width="2.6"/>
  <text x="526" y="204" font-size="13" font-weight="bold" fill="#C81E5A">Minimum wage</text>
  <text x="74" y="204" text-anchor="end" font-size="13" fill="#222">W<tspan font-size="9" dy="3">min</tspan></text>

  <!-- Equilibrium and quantities -->
  <line x1="80" y1="270" x2="345" y2="270" stroke="#777" stroke-width="1" stroke-dasharray="5,4"/>
  <line x1="345" y1="270" x2="345" y2="440" stroke="#777" stroke-width="1" stroke-dasharray="5,4"/>
  <line x1="245" y1="200" x2="245" y2="448" stroke="#777" stroke-width="1" stroke-dasharray="5,4"/>
  <line x1="445" y1="200" x2="445" y2="448" stroke="#777" stroke-width="1" stroke-dasharray="5,4"/>
  <circle cx="245" cy="200" r="4.5" fill="#222"/>
  <circle cx="445" cy="200" r="4.5" fill="#222"/>
  <text x="74" y="274" text-anchor="end" font-size="13" fill="#222">W*</text>
  <text x="245" y="458" text-anchor="middle" font-size="12" fill="#222">DL</text>
  <text x="345" y="458" text-anchor="middle" font-size="12" fill="#222">L*</text>
  <text x="445" y="458" text-anchor="middle" font-size="12" fill="#222">SL</text>

  <!-- Unemployment (surplus of labour) -->
  <line x1="245" y1="474" x2="445" y2="474" stroke="#222" stroke-width="1.5" marker-start="url(#gap)" marker-end="url(#gap)"/>
  <text x="345" y="492" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">Unemployment (surplus)</text>
</svg>
