<svg xmlns="http://www.w3.org/2000/svg" width="680" height="540" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <marker id="axarrow" markerWidth="10" markerHeight="10" refX="6" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#222"/></marker>
    <marker id="gap" markerWidth="9" markerHeight="9" refX="4.5" refY="4.5" orient="auto-start-reverse"><path d="M0,0 L9,4.5 L0,9 Z" fill="#222"/></marker>
  </defs>

  <!-- Axes -->
  <line x1="80" y1="440" x2="635" y2="440" stroke="#222" stroke-width="1.8" marker-end="url(#axarrow)"/>
  <line x1="80" y1="440" x2="80" y2="55" stroke="#222" stroke-width="1.8" marker-end="url(#axarrow)"/>
  <text transform="rotate(-90 30 250)" x="30" y="250" text-anchor="middle" font-size="14" fill="#222">Price level</text>
  <text x="628" y="468" text-anchor="end" font-size="14" fill="#222">Real GDP (Y)</text>
  <text x="70" y="460" text-anchor="end" font-size="13" fill="#222">0</text>

  <!-- Keynesian AS -->
  <path d="M 120 370 L 290 370 Q 460 370 460 170 L 460 80" fill="none" stroke="#C81E5A" stroke-width="2.6"/>
  <text x="430" y="100" text-anchor="end" font-size="14" fill="#C81E5A">AS</text>

  <!-- AD1 (full employment) and AD2 (higher) -->
  <line x1="300" y1="74" x2="590" y2="248" stroke="#1F4DA1" stroke-width="2.6"/>
  <text x="596" y="250" font-size="14" fill="#1F4DA1">AD&#8321;</text>
  <line x1="380" y1="62" x2="600" y2="194" stroke="#1F4DA1" stroke-width="2.6"/>
  <text x="606" y="196" font-size="14" fill="#1F4DA1">AD&#8322;</text>

  <!-- Equilibria (output stays at Yfe; price rises) -->
  <line x1="80" y1="170" x2="560" y2="170" stroke="#777" stroke-width="1" stroke-dasharray="5,4"/>
  <line x1="80" y1="110" x2="460" y2="110" stroke="#777" stroke-width="1" stroke-dasharray="5,4"/>
  <line x1="460" y1="170" x2="460" y2="440" stroke="#777" stroke-width="1" stroke-dasharray="5,4"/>
  <circle cx="460" cy="170" r="4" fill="#777"/>
  <circle cx="460" cy="110" r="4.5" fill="#222"/>
  <text x="74" y="174" text-anchor="end" font-size="13" fill="#222">PL<tspan font-size="10" dy="3">1</tspan></text>
  <text x="74" y="114" text-anchor="end" font-size="13" fill="#222">PL<tspan font-size="10" dy="3">2</tspan></text>
  <text x="460" y="458" text-anchor="middle" font-size="13" fill="#222">Y<tspan font-size="10" dy="3">fe</tspan></text>

  <!-- Inflationary gap (horizontal, at PL1, from Yfe to AD2) -->
  <line x1="460" y1="170" x2="560" y2="170" stroke="#222" stroke-width="1.5" marker-start="url(#gap)" marker-end="url(#gap)"/>
  <text x="510" y="158" text-anchor="middle" font-size="12" font-weight="bold" fill="#222">Inflationary gap</text>
</svg>
