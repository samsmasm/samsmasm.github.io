<svg xmlns="http://www.w3.org/2000/svg" width="680" height="540" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <marker id="axarrow" markerWidth="10" markerHeight="10" refX="6" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#222"/></marker>
    <marker id="shift" markerWidth="9" markerHeight="9" refX="5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#222"/></marker>
  </defs>

  <line x1="80" y1="440" x2="635" y2="440" stroke="#222" stroke-width="1.8" marker-end="url(#axarrow)"/>
  <line x1="80" y1="440" x2="80" y2="55" stroke="#222" stroke-width="1.8" marker-end="url(#axarrow)"/>
  <text transform="rotate(-90 30 230)" x="30" y="230" text-anchor="middle" font-size="14" fill="#222">Inflation rate (%)</text>
  <text x="628" y="468" text-anchor="end" font-size="14" fill="#222">Unemployment rate (%)</text>
  <text x="70" y="460" text-anchor="end" font-size="13" fill="#222">0</text>

  <!-- Long-run Phillips curve (vertical at the natural rate) -->
  <line x1="370" y1="90" x2="370" y2="440" stroke="#E8A200" stroke-width="2.8"/>
  <text x="370" y="80" text-anchor="middle" font-size="14" fill="#E8A200">LRPC</text>

  <!-- Two short-run Phillips curves -->
  <line x1="200" y1="160" x2="470" y2="430" stroke="#1F4DA1" stroke-width="2.4"/>
  <text x="476" y="430" font-size="13" fill="#1F4DA1">SRPC&#8321;</text>
  <line x1="210" y1="70" x2="470" y2="330" stroke="#1F4DA1" stroke-width="2.4"/>
  <text x="476" y="332" font-size="13" fill="#1F4DA1">SRPC&#8322;</text>

  <!-- Points A -> B -> C -->
  <circle cx="370" cy="330" r="4.5" fill="#222"/>
  <text x="380" y="348" font-size="13" font-weight="bold" fill="#222">A</text>
  <circle cx="290" cy="250" r="4.5" fill="#222"/>
  <text x="276" y="246" text-anchor="end" font-size="13" font-weight="bold" fill="#222">B</text>
  <circle cx="370" cy="230" r="4.5" fill="#222"/>
  <text x="380" y="226" font-size="13" font-weight="bold" fill="#222">C</text>

  <!-- Movement arrows -->
  <line x1="350" y1="318" x2="305" y2="263" stroke="#222" stroke-width="1.4" marker-end="url(#shift)"/>
  <line x1="305" y1="248" x2="355" y2="233" stroke="#222" stroke-width="1.4" marker-end="url(#shift)"/>

  <text x="370" y="458" text-anchor="middle" font-size="12" fill="#222">NRU</text>
</svg>
