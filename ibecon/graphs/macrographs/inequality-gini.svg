<svg xmlns="http://www.w3.org/2000/svg" width="680" height="540" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <marker id="axarrow" markerWidth="10" markerHeight="10" refX="6" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#222"/></marker>
  </defs>

  <!-- Shaded areas (drawn first) -->
  <!-- Area A: between line of equality and Lorenz curve -->
  <path d="M 90 440 L 500 40 Q 430 410 90 440 Z" fill="#E8A200" fill-opacity="0.35"/>
  <!-- Area B: below the Lorenz curve -->
  <path d="M 90 440 Q 430 410 500 40 L 500 440 Z" fill="#1F4DA1" fill-opacity="0.18"/>

  <line x1="90" y1="440" x2="600" y2="440" stroke="#222" stroke-width="1.8" marker-end="url(#axarrow)"/>
  <line x1="90" y1="440" x2="90" y2="30" stroke="#222" stroke-width="1.8" marker-end="url(#axarrow)"/>
  <text transform="rotate(-90 32 235)" x="32" y="235" text-anchor="middle" font-size="13" fill="#222">Cumulative % of income</text>
  <text x="500" y="468" text-anchor="middle" font-size="13" fill="#222">Cumulative % of population</text>
  <text x="82" y="458" text-anchor="end" font-size="12" fill="#222">0</text>
  <text x="500" y="458" text-anchor="middle" font-size="12" fill="#222">100%</text>

  <!-- Gini equation -->
  <text x="160" y="80" font-size="13" font-weight="bold" fill="#9c6a00">Gini = A / (A + B)</text>

  <!-- Line of equality -->
  <line x1="90" y1="440" x2="500" y2="40" stroke="#1F4DA1" stroke-width="2.4"/>
  <text x="180" y="180" font-size="13" fill="#1F4DA1">Line of equality</text>

  <!-- Lorenz curve -->
  <path d="M 90 440 Q 430 410 500 40" fill="none" stroke="#C81E5A" stroke-width="2.6"/>
  <text x="470" y="300" font-size="13" fill="#C81E5A">Lorenz curve</text>

  <!-- Area labels -->
  <text x="305" y="290" text-anchor="middle" font-size="15" font-weight="bold" fill="#9c6a00">A</text>
  <text x="420" y="395" text-anchor="middle" font-size="15" font-weight="bold" fill="#1F4DA1">B</text>
</svg>
