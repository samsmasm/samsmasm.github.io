<svg xmlns="http://www.w3.org/2000/svg" width="680" height="540" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <marker id="axarrow" markerWidth="10" markerHeight="10" refX="6" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#222"/></marker>
    <marker id="gap" markerWidth="9" markerHeight="9" refX="4.5" refY="4.5" orient="auto-start-reverse"><path d="M0,0 L9,4.5 L0,9 Z" fill="#222"/></marker>
  </defs>

  <!-- Axes -->
  <line x1="80" y1="440" x2="635" y2="440" stroke="#222" stroke-width="1.8" marker-end="url(#axarrow)"/>
  <line x1="80" y1="440" x2="80" y2="55" stroke="#222" stroke-width="1.8" marker-end="url(#axarrow)"/>
  <text transform="rotate(-90 30 250)" x="30" y="250" text-anchor="middle" font-size="14" fill="#222">Price level</text>
  <text x="628" y="468" text-anchor="end" font-size="14" fill="#222">Real GDP (Y)</text>
  <text x="70" y="460" text-anchor="end" font-size="13" fill="#222">0</text>

  <!-- Keynesian AS -->
  <path d="M 120 370 L 290 370 Q 460 370 460 170 L 460 80" fill="none" stroke="#C81E5A" stroke-width="2.6"/>
  <text x="470" y="120" font-size="14" fill="#C81E5A">AS</text>

  <!-- AD1 (full employment) and AD2 (lower, recession) -->
  <line x1="300" y1="64" x2="560" y2="220" stroke="#1F4DA1" stroke-width="2.6"/>
  <text x="566" y="222" font-size="14" fill="#1F4DA1">AD&#8321;</text>
  <line x1="140" y1="253" x2="450" y2="439" stroke="#1F4DA1" stroke-width="2.6"/>
  <text x="456" y="438" font-size="14" fill="#1F4DA1">AD&#8322;</text>

  <!-- Equilibria -->
  <line x1="80" y1="160" x2="460" y2="160" stroke="#777" stroke-width="1" stroke-dasharray="5,4"/>
  <line x1="80" y1="367" x2="330" y2="367" stroke="#777" stroke-width="1" stroke-dasharray="5,4"/>
  <line x1="330" y1="367" x2="330" y2="448" stroke="#777" stroke-width="1" stroke-dasharray="5,4"/>
  <circle cx="460" cy="160" r="4" fill="#777"/>
  <circle cx="330" cy="367" r="4.5" fill="#222"/>
  <text x="74" y="164" text-anchor="end" font-size="13" fill="#222">PL<tspan font-size="10" dy="3">fe</tspan></text>
  <text x="74" y="371" text-anchor="end" font-size="13" fill="#222">PL<tspan font-size="10" dy="3">1</tspan></text>

  <!-- Gap annotation -->
  <text x="330" y="458" text-anchor="middle" font-size="13" fill="#222">Y<tspan font-size="10" dy="3">1</tspan></text>
  <text x="474" y="458" font-size="13" fill="#222">Y<tspan font-size="10" dy="3">fe</tspan></text>
  <line x1="330" y1="474" x2="460" y2="474" stroke="#222" stroke-width="1.5" marker-start="url(#gap)" marker-end="url(#gap)"/>
  <text x="395" y="492" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">Recessionary gap</text>
</svg>
