<svg xmlns="http://www.w3.org/2000/svg" width="680" height="540" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <marker id="axarrow" markerWidth="10" markerHeight="10" refX="6" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#222"/></marker>
  </defs>

  <line x1="80" y1="440" x2="635" y2="440" stroke="#222" stroke-width="1.8" marker-end="url(#axarrow)"/>
  <line x1="80" y1="440" x2="80" y2="55" stroke="#222" stroke-width="1.8" marker-end="url(#axarrow)"/>
  <text transform="rotate(-90 30 250)" x="30" y="250" text-anchor="middle" font-size="14" fill="#222">Government revenue</text>
  <text x="628" y="468" text-anchor="end" font-size="14" fill="#222">Tax rate (%)</text>
  <text x="70" y="460" text-anchor="end" font-size="13" fill="#222">0</text>

  <!-- Laffer curve (inverted U from 0 to 100% tax) -->
  <path d="M 90 440 Q 325 -100 560 440" fill="none" stroke="#222" stroke-width="2.6"/>

  <!-- Maximum revenue at optimal tax rate -->
  <line x1="80" y1="170" x2="325" y2="170" stroke="#777" stroke-width="1" stroke-dasharray="5,4"/>
  <line x1="325" y1="170" x2="325" y2="440" stroke="#777" stroke-width="1" stroke-dasharray="5,4"/>
  <circle cx="325" cy="170" r="4" fill="#222"/>
  <text x="74" y="174" text-anchor="end" font-size="13" fill="#222">R<tspan font-size="10" dy="3">B</tspan></text>
  <text x="325" y="458" text-anchor="middle" font-size="13" fill="#222">T*</text>
</svg>
