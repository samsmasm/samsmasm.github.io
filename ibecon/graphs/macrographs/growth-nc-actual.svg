<svg xmlns="http://www.w3.org/2000/svg" width="680" height="540" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <marker id="axarrow" markerWidth="10" markerHeight="10" refX="6" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#222"/></marker>
    <marker id="shift" markerWidth="9" markerHeight="9" refX="5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#222"/></marker>
  </defs>

  <!-- Axes -->
  <line x1="80" y1="440" x2="635" y2="440" stroke="#222" stroke-width="1.8" marker-end="url(#axarrow)"/>
  <line x1="80" y1="440" x2="80" y2="55" stroke="#222" stroke-width="1.8" marker-end="url(#axarrow)"/>
  <text transform="rotate(-90 30 250)" x="30" y="250" text-anchor="middle" font-size="14" fill="#222">Price level</text>
  <text x="628" y="468" text-anchor="end" font-size="14" fill="#222">Real GDP (Y)</text>
  <text x="70" y="460" text-anchor="end" font-size="13" fill="#222">0</text>

  <!-- Curves -->
  <line x1="370" y1="90" x2="370" y2="440" stroke="#E8A200" stroke-width="2.8"/>
  <text x="370" y="80" text-anchor="middle" font-size="14" fill="#E8A200">LRAS</text>
  <line x1="140" y1="408" x2="560" y2="156" stroke="#C81E5A" stroke-width="2.6"/>
  <text x="566" y="156" font-size="14" fill="#C81E5A">SRAS</text>
  <line x1="150" y1="222" x2="513" y2="440" stroke="#1F4DA1" stroke-width="2.6"/>
  <text x="140" y="218" text-anchor="end" font-size="14" fill="#1F4DA1">AD&#8321;</text>
  <line x1="150" y1="162" x2="560" y2="408" stroke="#1F4DA1" stroke-width="2.6"/>
  <text x="566" y="410" font-size="14" fill="#1F4DA1">AD&#8322;</text>

  <!-- Shift arrow -->
  <line x1="295" y1="300" x2="365" y2="300" stroke="#222" stroke-width="1.6" marker-end="url(#shift)"/>

  <!-- Equilibria (both below Yfe: using spare capacity) -->
  <line x1="80" y1="312" x2="300" y2="312" stroke="#777" stroke-width="1" stroke-dasharray="5,4"/>
  <line x1="80" y1="282" x2="350" y2="282" stroke="#777" stroke-width="1" stroke-dasharray="5,4"/>
  <line x1="300" y1="312" x2="300" y2="448" stroke="#777" stroke-width="1" stroke-dasharray="5,4"/>
  <line x1="350" y1="282" x2="350" y2="448" stroke="#777" stroke-width="1" stroke-dasharray="5,4"/>
  <circle cx="300" cy="312" r="4.5" fill="#222"/>
  <circle cx="350" cy="282" r="4.5" fill="#222"/>
  <text x="74" y="316" text-anchor="end" font-size="13" fill="#222">PL<tspan font-size="10" dy="3">1</tspan></text>
  <text x="74" y="286" text-anchor="end" font-size="13" fill="#222">PL<tspan font-size="10" dy="3">2</tspan></text>
  <text x="300" y="458" text-anchor="middle" font-size="13" fill="#222">Y<tspan font-size="10" dy="3">1</tspan></text>
  <text x="350" y="458" text-anchor="middle" font-size="13" fill="#222">Y<tspan font-size="10" dy="3">2</tspan></text>
  <text x="384" y="458" font-size="13" fill="#222">Y<tspan font-size="10" dy="3">fe</tspan></text>
</svg>
