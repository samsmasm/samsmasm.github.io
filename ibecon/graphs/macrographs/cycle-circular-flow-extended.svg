<svg xmlns="http://www.w3.org/2000/svg" width="700" height="540" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <marker id="ca" markerWidth="9" markerHeight="9" refX="5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#222"/></marker>
    <marker id="lk" markerWidth="9" markerHeight="9" refX="5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#C81E5A"/></marker>
    <marker id="inj" markerWidth="9" markerHeight="9" refX="5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#2E8B57"/></marker>
  </defs>

  <!-- Legend -->
  <line x1="250" y1="36" x2="280" y2="36" stroke="#C81E5A" stroke-width="2.4"/>
  <text x="286" y="40" font-size="12" fill="#222">Leakages</text>
  <line x1="380" y1="36" x2="410" y2="36" stroke="#2E8B57" stroke-width="2.4"/>
  <text x="416" y="40" font-size="12" fill="#222">Injections</text>

  <!-- Core loop: Households and Firms -->
  <rect x="70" y="140" width="160" height="78" rx="10" fill="#fff" stroke="#222" stroke-width="2"/>
  <text x="150" y="184" text-anchor="middle" font-size="15" font-weight="bold" fill="#222">Households</text>
  <rect x="470" y="140" width="160" height="78" rx="10" fill="#fff" stroke="#222" stroke-width="2"/>
  <text x="550" y="184" text-anchor="middle" font-size="15" font-weight="bold" fill="#222">Firms</text>

  <line x1="470" y1="160" x2="234" y2="160" stroke="#222" stroke-width="1.8" marker-end="url(#ca)"/>
  <text x="352" y="153" text-anchor="middle" font-size="12" fill="#222">Incomes (Y)</text>
  <line x1="230" y1="197" x2="466" y2="197" stroke="#222" stroke-width="1.8" marker-end="url(#ca)"/>
  <text x="352" y="212" text-anchor="middle" font-size="12" fill="#222">Spending</text>

  <!-- Sector boxes -->
  <rect x="90" y="372" width="160" height="62" rx="10" fill="#fff" stroke="#222" stroke-width="2"/>
  <text x="170" y="408" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">Financial</text>
  <rect x="270" y="372" width="160" height="62" rx="10" fill="#fff" stroke="#222" stroke-width="2"/>
  <text x="350" y="408" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">Government</text>
  <rect x="450" y="372" width="160" height="62" rx="10" fill="#fff" stroke="#222" stroke-width="2"/>
  <text x="530" y="408" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">Overseas</text>

  <!-- Leakages (down) and injections (up) -->
  <line x1="150" y1="220" x2="150" y2="370" stroke="#C81E5A" stroke-width="1.8" marker-end="url(#lk)"/>
  <text x="144" y="300" text-anchor="end" font-size="12" fill="#C81E5A">Savings</text>
  <line x1="190" y1="370" x2="190" y2="220" stroke="#2E8B57" stroke-width="1.8" marker-end="url(#inj)"/>
  <text x="196" y="300" font-size="12" fill="#2E8B57">Investment</text>

  <line x1="330" y1="220" x2="330" y2="370" stroke="#C81E5A" stroke-width="1.8" marker-end="url(#lk)"/>
  <text x="324" y="300" text-anchor="end" font-size="12" fill="#C81E5A">Taxes</text>
  <line x1="370" y1="370" x2="370" y2="220" stroke="#2E8B57" stroke-width="1.8" marker-end="url(#inj)"/>
  <text x="376" y="300" font-size="12" fill="#2E8B57">Govt spending</text>

  <line x1="510" y1="220" x2="510" y2="370" stroke="#C81E5A" stroke-width="1.8" marker-end="url(#lk)"/>
  <text x="504" y="300" text-anchor="end" font-size="12" fill="#C81E5A">Imports</text>
  <line x1="550" y1="370" x2="550" y2="220" stroke="#2E8B57" stroke-width="1.8" marker-end="url(#inj)"/>
  <text x="556" y="300" font-size="12" fill="#2E8B57">Exports</text>
</svg>
