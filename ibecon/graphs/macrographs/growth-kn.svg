<svg xmlns="http://www.w3.org/2000/svg" width="680" height="540" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <marker id="axarrow" markerWidth="10" markerHeight="10" refX="6" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#222"/></marker>
    <marker id="shift" markerWidth="9" markerHeight="9" refX="5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#222"/></marker>
  </defs>

  <!-- Axes -->
  <line x1="80" y1="440" x2="635" y2="440" stroke="#222" stroke-width="1.8" marker-end="url(#axarrow)"/>
  <line x1="80" y1="440" x2="80" y2="55" stroke="#222" stroke-width="1.8" marker-end="url(#axarrow)"/>
  <text transform="rotate(-90 30 250)" x="30" y="250" text-anchor="middle" font-size="14" fill="#222">Price level</text>
  <text x="628" y="468" text-anchor="end" font-size="14" fill="#222">Real GDP (Y)</text>
  <text x="70" y="460" text-anchor="end" font-size="13" fill="#222">0</text>

  <!-- Keynesian AS -->
  <path d="M 120 370 L 290 370 Q 460 370 460 170 L 460 80" fill="none" stroke="#C81E5A" stroke-width="2.6"/>
  <text x="470" y="120" font-size="14" fill="#C81E5A">AS</text>

  <!-- AD1 -> AD2 in the spare-capacity region -->
  <line x1="120" y1="322" x2="317" y2="440" stroke="#1F4DA1" stroke-width="2.6"/>
  <text x="112" y="318" text-anchor="end" font-size="14" fill="#1F4DA1">AD&#8321;</text>
  <line x1="170" y1="292" x2="397" y2="440" stroke="#1F4DA1" stroke-width="2.6"/>
  <text x="403" y="438" font-size="14" fill="#1F4DA1">AD&#8322;</text>
  <line x1="185" y1="350" x2="240" y2="350" stroke="#222" stroke-width="1.6" marker-end="url(#shift)"/>

  <!-- Equilibria: output rises, price level unchanged -->
  <line x1="80" y1="370" x2="280" y2="370" stroke="#777" stroke-width="1" stroke-dasharray="5,4"/>
  <line x1="200" y1="370" x2="200" y2="448" stroke="#777" stroke-width="1" stroke-dasharray="5,4"/>
  <line x1="280" y1="370" x2="280" y2="448" stroke="#777" stroke-width="1" stroke-dasharray="5,4"/>
  <circle cx="200" cy="370" r="4.5" fill="#222"/>
  <circle cx="280" cy="370" r="4.5" fill="#222"/>
  <text x="74" y="374" text-anchor="end" font-size="13" fill="#222">PL</text>
  <text x="200" y="458" text-anchor="middle" font-size="13" fill="#222">Y<tspan font-size="10" dy="3">1</tspan></text>
  <text x="280" y="458" text-anchor="middle" font-size="13" fill="#222">Y<tspan font-size="10" dy="3">2</tspan></text>
</svg>
