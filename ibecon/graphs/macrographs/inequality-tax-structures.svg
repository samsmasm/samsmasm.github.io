<svg xmlns="http://www.w3.org/2000/svg" width="680" height="540" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <marker id="axarrow" markerWidth="10" markerHeight="10" refX="6" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#222"/></marker>
  </defs>

  <line x1="80" y1="440" x2="635" y2="440" stroke="#222" stroke-width="1.8" marker-end="url(#axarrow)"/>
  <line x1="80" y1="440" x2="80" y2="55" stroke="#222" stroke-width="1.8" marker-end="url(#axarrow)"/>
  <text transform="rotate(-90 30 250)" x="30" y="250" text-anchor="middle" font-size="14" fill="#222">Average tax rate (%)</text>
  <text x="628" y="468" text-anchor="end" font-size="14" fill="#222">Income</text>
  <text x="70" y="460" text-anchor="end" font-size="13" fill="#222">0</text>

  <!-- Progressive (rises with income) -->
  <line x1="100" y1="400" x2="560" y2="150" stroke="#1F4DA1" stroke-width="2.6"/>
  <text x="566" y="152" font-size="13" fill="#1F4DA1">Progressive</text>

  <!-- Proportional (constant) -->
  <line x1="100" y1="275" x2="560" y2="275" stroke="#E8A200" stroke-width="2.6"/>
  <text x="566" y="278" font-size="13" fill="#cc8f00">Proportional</text>

  <!-- Regressive (falls with income) -->
  <line x1="100" y1="150" x2="560" y2="400" stroke="#C81E5A" stroke-width="2.6"/>
  <text x="566" y="402" font-size="13" fill="#C81E5A">Regressive</text>
</svg>
