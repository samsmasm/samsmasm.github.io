<svg xmlns="http://www.w3.org/2000/svg" width="680" height="540" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <marker id="amag" markerWidth="9" markerHeight="9" refX="5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#C81E5A"/></marker>
    <marker id="ablue" markerWidth="9" markerHeight="9" refX="5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#1F4DA1"/></marker>
  </defs>

  <!-- Flows (drawn first) -->
  <!-- Top outer (red money): households -> firms (spending) -->
  <path d="M 175 235 C 175 95 525 95 525 235" fill="none" stroke="#C81E5A" stroke-width="2.2" marker-end="url(#amag)"/>
  <text x="350" y="86" text-anchor="middle" font-size="12" fill="#C81E5A">Consumer spending ($)</text>
  <!-- Top inner (blue real): firms -> households (goods) -->
  <path d="M 505 235 C 505 150 215 150 215 235" fill="none" stroke="#1F4DA1" stroke-width="2.2" marker-end="url(#ablue)"/>
  <text x="350" y="142" text-anchor="middle" font-size="12" fill="#1F4DA1">Goods &amp; services</text>

  <!-- Bottom outer (red money): firms -> households (income) -->
  <path d="M 525 325 C 525 465 175 465 175 325" fill="none" stroke="#C81E5A" stroke-width="2.2" marker-end="url(#amag)"/>
  <text x="350" y="481" text-anchor="middle" font-size="12" fill="#C81E5A">Wages, rent, interest, profit ($)</text>
  <!-- Bottom inner (blue real): households -> firms (factors) -->
  <path d="M 215 325 C 215 410 505 410 505 325" fill="none" stroke="#1F4DA1" stroke-width="2.2" marker-end="url(#ablue)"/>
  <text x="350" y="402" text-anchor="middle" font-size="12" fill="#1F4DA1">Factors of production</text>

  <!-- Sector boxes -->
  <rect x="120" y="235" width="170" height="90" rx="10" fill="#fff" stroke="#222" stroke-width="2"/>
  <text x="205" y="285" text-anchor="middle" font-size="15" font-weight="bold" fill="#222">Households</text>
  <rect x="410" y="235" width="170" height="90" rx="10" fill="#fff" stroke="#222" stroke-width="2"/>
  <text x="495" y="285" text-anchor="middle" font-size="15" font-weight="bold" fill="#222">Firms</text>

  <!-- Legend -->
  <line x1="120" y1="40" x2="150" y2="40" stroke="#C81E5A" stroke-width="2.4"/>
  <text x="156" y="44" font-size="12" fill="#222">Money flows</text>
  <line x1="270" y1="40" x2="300" y2="40" stroke="#1F4DA1" stroke-width="2.4"/>
  <text x="306" y="44" font-size="12" fill="#222">Real flows</text>
</svg>
