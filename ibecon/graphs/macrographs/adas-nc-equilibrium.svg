<svg xmlns="http://www.w3.org/2000/svg" width="680" height="540" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <marker id="axarrow" markerWidth="10" markerHeight="10" refX="6" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#222"/></marker>
  </defs>

  <!-- Axes -->
  <line x1="80" y1="440" x2="635" y2="440" stroke="#222" stroke-width="1.8" marker-end="url(#axarrow)"/>
  <line x1="80" y1="440" x2="80" y2="55" stroke="#222" stroke-width="1.8" marker-end="url(#axarrow)"/>
  <text transform="rotate(-90 30 250)" x="30" y="250" text-anchor="middle" font-size="14" fill="#222">Price level</text>
  <text x="628" y="468" text-anchor="end" font-size="14" fill="#222">Real GDP (Y)</text>
  <text x="70" y="460" text-anchor="end" font-size="13" fill="#222">0</text>

  <!-- Curves -->
  <line x1="370" y1="90" x2="370" y2="440" stroke="#E8A200" stroke-width="2.8"/>
  <text x="370" y="80" text-anchor="middle" font-size="14" fill="#E8A200">LRAS</text>
  <line x1="150" y1="138" x2="590" y2="402" stroke="#1F4DA1" stroke-width="2.6"/>
  <text x="596" y="404" font-size="14" fill="#1F4DA1">AD</text>
  <line x1="150" y1="402" x2="590" y2="138" stroke="#C81E5A" stroke-width="2.6"/>
  <text x="596" y="140" font-size="14" fill="#C81E5A">SRAS</text>

  <!-- Equilibrium -->
  <line x1="80" y1="270" x2="370" y2="270" stroke="#777" stroke-width="1" stroke-dasharray="5,4"/>
  <circle cx="370" cy="270" r="4.5" fill="#222"/>
  <text x="74" y="274" text-anchor="end" font-size="13" fill="#222">PL<tspan font-size="10" dy="3">e</tspan></text>
  <text x="384" y="460" font-size="13" fill="#222">Y<tspan font-size="10" dy="3">fe</tspan></text>
</svg>
