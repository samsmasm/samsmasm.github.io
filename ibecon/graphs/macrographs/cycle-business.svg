<svg xmlns="http://www.w3.org/2000/svg" width="680" height="540" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <marker id="axarrow" markerWidth="10" markerHeight="10" refX="6" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#222"/></marker>
    <marker id="trendarrow" markerWidth="10" markerHeight="10" refX="6" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#C81E5A"/></marker>
  </defs>

  <line x1="80" y1="440" x2="635" y2="440" stroke="#222" stroke-width="1.8" marker-end="url(#axarrow)"/>
  <line x1="80" y1="440" x2="80" y2="55" stroke="#222" stroke-width="1.8" marker-end="url(#axarrow)"/>
  <text transform="rotate(-90 30 250)" x="30" y="250" text-anchor="middle" font-size="14" fill="#222">Real GDP</text>
  <text x="628" y="468" text-anchor="end" font-size="14" fill="#222">Time</text>
  <text x="70" y="460" text-anchor="end" font-size="13" fill="#222">0</text>

  <!-- Long-term (potential output) trend -->
  <line x1="110" y1="405" x2="595" y2="215" stroke="#C81E5A" stroke-width="2.4"/>
  <text x="560" y="180" font-size="13" fill="#C81E5A">Long-term trend</text>

  <!-- Real GDP cycle -->
  <path d="M 110 405 C 150 405 175 330 205 330 C 240 330 245 380 275 380 C 315 380 330 280 365 280 C 400 280 410 335 440 335 C 480 335 505 220 540 220 C 565 220 580 240 600 240"
        fill="none" stroke="#1F4DA1" stroke-width="2.6"/>
  <text x="124" y="360" font-size="13" fill="#1F4DA1">Real GDP</text>

  <!-- Phase labels -->
  <text x="365" y="268" text-anchor="middle" font-size="12" fill="#222">Peak</text>
  <text x="275" y="398" text-anchor="middle" font-size="12" fill="#222">Trough</text>
  <text x="318" y="318" text-anchor="middle" font-size="11" fill="#555">Recovery</text>
  <text x="408" y="312" text-anchor="middle" font-size="11" fill="#555">Recession</text>
</svg>
