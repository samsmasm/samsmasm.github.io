<svg xmlns="http://www.w3.org/2000/svg" width="680" height="540" font-family="Georgia, serif">
  <text x="340" y="36" text-anchor="middle" font-size="16" font-weight="bold" fill="#222">Consumer and producer surplus</text>

  <!-- Surplus fills (drawn first) -->
  <polygon points="90,90 90,260 325,260" fill="#2E86C1" fill-opacity="0.22"/>
  <polygon points="90,260 90,430 325,260" fill="#E67E22" fill-opacity="0.22"/>

  <!-- Axes -->
  <line x1="90" y1="60" x2="90" y2="470" stroke="#333" stroke-width="2"/>
  <line x1="90" y1="470" x2="610" y2="470" stroke="#333" stroke-width="2"/>

  <!-- Axis labels at the ends -->
  <text transform="rotate(-90 30 140)" x="30" y="140" text-anchor="middle" font-size="13" fill="#333">Price ($/unit)</text>
  <text x="608" y="492" text-anchor="end" font-size="13" fill="#333">Quantity (units/week)</text>

  <!-- Demand and supply -->
  <line x1="90" y1="90" x2="560" y2="430" stroke="#14746F" stroke-width="2.5"/>
  <text x="566" y="432" font-size="14" fill="#14746F">Demand</text>
  <line x1="90" y1="430" x2="560" y2="90" stroke="#0D5C57" stroke-width="2.5"/>
  <text x="566" y="92" font-size="14" fill="#0D5C57">Supply</text>

  <!-- Equilibrium reference lines -->
  <line x1="90" y1="260" x2="325" y2="260" stroke="#888" stroke-width="1.1" stroke-dasharray="5,4"/>
  <line x1="325" y1="260" x2="325" y2="470" stroke="#888" stroke-width="1.1" stroke-dasharray="5,4"/>
  <circle cx="325" cy="260" r="4.5" fill="#333"/>

  <text x="78" y="264" text-anchor="end" font-size="13" fill="#333">Pe</text>
  <text x="325" y="492" text-anchor="middle" font-size="13" fill="#333">Qe</text>

  <!-- Surplus labels -->
  <text x="165" y="195" text-anchor="middle" font-size="13" font-weight="bold" fill="#21618C">Consumer</text>
  <text x="165" y="212" text-anchor="middle" font-size="13" font-weight="bold" fill="#21618C">surplus</text>
  <text x="165" y="330" text-anchor="middle" font-size="13" font-weight="bold" fill="#B9591A">Producer</text>
  <text x="165" y="347" text-anchor="middle" font-size="13" font-weight="bold" fill="#B9591A">surplus</text>
</svg>
