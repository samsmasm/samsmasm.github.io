<svg xmlns="http://www.w3.org/2000/svg" width="680" height="540" font-family="Georgia, serif">
  <text x="340" y="36" text-anchor="middle" font-size="16" font-weight="bold" fill="#222">Market equilibrium</text>

  <!-- Axes -->
  <line x1="90" y1="60" x2="90" y2="470" stroke="#333" stroke-width="2"/>
  <line x1="90" y1="470" x2="610" y2="470" stroke="#333" stroke-width="2"/>

  <!-- Axis labels at the ends -->
  <text transform="rotate(-90 30 140)" x="30" y="140" text-anchor="middle" font-size="13" fill="#333">Price ($/unit)</text>
  <text x="608" y="492" text-anchor="end" font-size="13" fill="#333">Quantity (units/week)</text>

  <!-- Demand and supply -->
  <line x1="140" y1="100" x2="560" y2="440" stroke="#14746F" stroke-width="2.5"/>
  <text x="566" y="442" font-size="14" fill="#14746F">Demand</text>
  <line x1="140" y1="440" x2="560" y2="100" stroke="#0D5C57" stroke-width="2.5"/>
  <text x="566" y="102" font-size="14" fill="#0D5C57">Supply</text>

  <!-- Equilibrium reference lines -->
  <line x1="90" y1="270" x2="350" y2="270" stroke="#888" stroke-width="1.1" stroke-dasharray="5,4"/>
  <line x1="350" y1="270" x2="350" y2="470" stroke="#888" stroke-width="1.1" stroke-dasharray="5,4"/>
  <circle cx="350" cy="270" r="4.5" fill="#333"/>

  <text x="78" y="274" text-anchor="end" font-size="13" fill="#333">Pe</text>
  <text x="350" y="492" text-anchor="middle" font-size="13" fill="#333">Qe</text>
</svg>
