<svg xmlns="http://www.w3.org/2000/svg" width="680" height="540" font-family="Georgia, serif">
  <text x="340" y="36" text-anchor="middle" font-size="16" font-weight="bold" fill="#222">Production possibilities curve (PPC)</text>

  <!-- Axes -->
  <line x1="90" y1="60" x2="90" y2="470" stroke="#333" stroke-width="2"/>
  <line x1="90" y1="470" x2="610" y2="470" stroke="#333" stroke-width="2"/>
  <text transform="rotate(-90 30 200)" x="30" y="200" text-anchor="middle" font-size="13" fill="#333">Capital goods</text>
  <text x="608" y="492" text-anchor="end" font-size="13" fill="#333">Consumer goods</text>

  <!-- The frontier (concave to the origin) -->
  <path d="M 90 110 Q 480 165 560 470" fill="none" stroke="#14746F" stroke-width="2.5"/>
  <text x="566" y="466" font-size="13" fill="#14746F">PPC</text>

  <!-- Points A and B on the curve (the trade-off) -->
  <line x1="90" y1="166" x2="296" y2="166" stroke="#aaa" stroke-width="1" stroke-dasharray="4,4"/>
  <line x1="296" y1="166" x2="296" y2="470" stroke="#aaa" stroke-width="1" stroke-dasharray="4,4"/>
  <line x1="90" y1="310" x2="484" y2="310" stroke="#aaa" stroke-width="1" stroke-dasharray="4,4"/>
  <line x1="484" y1="310" x2="484" y2="470" stroke="#aaa" stroke-width="1" stroke-dasharray="4,4"/>

  <circle cx="296" cy="166" r="4.5" fill="#0D5C57"/>
  <circle cx="484" cy="310" r="4.5" fill="#0D5C57"/>
  <text x="284" y="158" text-anchor="end" font-size="13" font-weight="bold" fill="#0D5C57">A</text>
  <text x="496" y="306" font-size="13" font-weight="bold" fill="#0D5C57">B</text>

  <!-- Inefficient point inside -->
  <circle cx="260" cy="345" r="4.5" fill="#C0392B"/>
  <text x="272" y="349" font-size="13" font-weight="bold" fill="#C0392B">X</text>

  <!-- Unattainable point outside -->
  <circle cx="500" cy="180" r="4.5" fill="#7D3C98"/>
  <text x="512" y="184" font-size="13" font-weight="bold" fill="#7D3C98">Z</text>

  <!-- Key -->
  <text x="150" y="430" font-size="12" fill="#0D5C57">A, B: efficient (on the curve)</text>
  <text x="150" y="448" font-size="12" fill="#C0392B">X: inefficient (unemployed resources)</text>
  <text x="150" y="466" font-size="12" fill="#7D3C98">Z: unattainable (beyond current capacity)</text>
</svg>
