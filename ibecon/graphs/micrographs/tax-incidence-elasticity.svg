<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" font-family="Georgia, serif">
  <text x="480" y="28" text-anchor="middle" font-size="16" font-weight="bold" fill="#222">Tax incidence: inelastic vs elastic demand</text>

  <!-- Legend -->
  <rect x="300" y="42" width="14" height="11" fill="#2E86C1" fill-opacity="0.35"/>
  <text x="320" y="52" font-size="12" fill="#21618C">Consumer burden</text>
  <rect x="470" y="42" width="14" height="11" fill="#E67E22" fill-opacity="0.35"/>
  <text x="490" y="52" font-size="12" fill="#B9591A">Producer burden</text>

  <!-- ============ LEFT PANEL: inelastic demand ============ -->
  <g transform="translate(10,40)">
    <text x="265" y="46" text-anchor="middle" font-size="14" font-weight="bold" fill="#333">Inelastic demand</text>

    <!-- Incidence boxes (Qt = 242) -->
    <rect x="70" y="206" width="172" height="70" fill="#2E86C1" fill-opacity="0.22"/>
    <rect x="70" y="276" width="172" height="10" fill="#E67E22" fill-opacity="0.35"/>

    <!-- Axes -->
    <line x1="70" y1="70" x2="70" y2="440" stroke="#333" stroke-width="2"/>
    <line x1="70" y1="440" x2="470" y2="440" stroke="#333" stroke-width="2"/>
    <text transform="rotate(-90 36 250)" x="36" y="250" text-anchor="middle" font-size="11" fill="#333">Price ($/unit)</text>
    <text x="468" y="460" text-anchor="end" font-size="11" fill="#333">Quantity</text>

    <!-- Curves -->
    <line x1="220" y1="80" x2="280" y2="430" stroke="#14746F" stroke-width="2.5"/>
    <text x="210" y="76" font-size="12" font-style="italic" fill="#14746F">D</text>
    <line x1="95" y1="416" x2="460" y2="94" stroke="#0D5C57" stroke-width="2.5"/>
    <text x="463" y="92" font-size="12" fill="#0D5C57">S</text>
    <line x1="95" y1="336" x2="396" y2="70" stroke="#0D5C57" stroke-width="2.2" stroke-dasharray="7,4"/>
    <text x="399" y="74" font-size="11" fill="#0D5C57">S + tax</text>

    <!-- Reference lines -->
    <line x1="70" y1="206" x2="242" y2="206" stroke="#888" stroke-width="1" stroke-dasharray="4,4"/>
    <line x1="70" y1="276" x2="254" y2="276" stroke="#aaa" stroke-width="1" stroke-dasharray="4,4"/>
    <line x1="70" y1="286" x2="242" y2="286" stroke="#888" stroke-width="1" stroke-dasharray="4,4"/>
    <line x1="242" y1="206" x2="242" y2="440" stroke="#888" stroke-width="1" stroke-dasharray="4,4"/>

    <circle cx="242" cy="206" r="3.5" fill="#333"/>
    <circle cx="254" cy="276" r="3.5" fill="#777"/>

    <text x="66" y="210" text-anchor="end" font-size="11" fill="#21618C">Pc</text>
    <text x="66" y="272" text-anchor="end" font-size="11" fill="#555">Pe</text>
    <text x="66" y="296" text-anchor="end" font-size="11" fill="#B9591A">Pp</text>
    <text x="242" y="456" text-anchor="middle" font-size="11" fill="#333">Qt</text>

    <text x="265" y="500" text-anchor="middle" font-size="12" font-style="italic" fill="#444">Steep D: consumers bear most of the tax</text>
  </g>

  <!-- ============ RIGHT PANEL: elastic demand ============ -->
  <g transform="translate(480,40)">
    <text x="265" y="46" text-anchor="middle" font-size="14" font-weight="bold" fill="#333">Elastic demand</text>

    <!-- Incidence boxes (Qt = 204) -->
    <rect x="70" y="239" width="134" height="23" fill="#2E86C1" fill-opacity="0.22"/>
    <rect x="70" y="262" width="134" height="58" fill="#E67E22" fill-opacity="0.35"/>

    <!-- Axes -->
    <line x1="70" y1="70" x2="70" y2="440" stroke="#333" stroke-width="2"/>
    <line x1="70" y1="440" x2="470" y2="440" stroke="#333" stroke-width="2"/>
    <text transform="rotate(-90 36 250)" x="36" y="250" text-anchor="middle" font-size="11" fill="#333">Price ($/unit)</text>
    <text x="468" y="460" text-anchor="end" font-size="11" fill="#333">Quantity</text>

    <!-- Curves -->
    <line x1="90" y1="200" x2="440" y2="320" stroke="#14746F" stroke-width="2.5"/>
    <text x="444" y="322" font-size="12" font-style="italic" fill="#14746F">D</text>
    <line x1="95" y1="416" x2="460" y2="94" stroke="#0D5C57" stroke-width="2.5"/>
    <text x="463" y="92" font-size="12" fill="#0D5C57">S</text>
    <line x1="95" y1="336" x2="396" y2="70" stroke="#0D5C57" stroke-width="2.2" stroke-dasharray="7,4"/>
    <text x="399" y="74" font-size="11" fill="#0D5C57">S + tax</text>

    <!-- Reference lines -->
    <line x1="70" y1="239" x2="204" y2="239" stroke="#888" stroke-width="1" stroke-dasharray="4,4"/>
    <line x1="70" y1="262" x2="270" y2="262" stroke="#aaa" stroke-width="1" stroke-dasharray="4,4"/>
    <line x1="70" y1="320" x2="204" y2="320" stroke="#888" stroke-width="1" stroke-dasharray="4,4"/>
    <line x1="204" y1="239" x2="204" y2="440" stroke="#888" stroke-width="1" stroke-dasharray="4,4"/>

    <circle cx="204" cy="239" r="3.5" fill="#333"/>
    <circle cx="270" cy="262" r="3.5" fill="#777"/>

    <text x="66" y="243" text-anchor="end" font-size="11" fill="#21618C">Pc</text>
    <text x="66" y="266" text-anchor="end" font-size="11" fill="#555">Pe</text>
    <text x="66" y="324" text-anchor="end" font-size="11" fill="#B9591A">Pp</text>
    <text x="204" y="456" text-anchor="middle" font-size="11" fill="#333">Qt</text>

    <text x="265" y="500" text-anchor="middle" font-size="12" font-style="italic" fill="#444">Flat D: producers bear most of the tax</text>
  </g>
</svg>
