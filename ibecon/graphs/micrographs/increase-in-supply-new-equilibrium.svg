<svg xmlns="http://www.w3.org/2000/svg" width="680" height="540" font-family="Georgia, serif">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="8.5" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#14746F"/>
    </marker>
  </defs>

  <text x="340" y="36" text-anchor="middle" font-size="16" font-weight="bold" fill="#222">Increase in supply: adjusting to a new equilibrium</text>

  <!-- Axes -->
  <line x1="90" y1="60" x2="90" y2="470" stroke="#333" stroke-width="2"/>
  <line x1="90" y1="470" x2="610" y2="470" stroke="#333" stroke-width="2"/>

  <!-- Axis labels at the ends -->
  <text transform="rotate(-90 30 140)" x="30" y="140" text-anchor="middle" font-size="13" fill="#333">Price ($/unit)</text>
  <text x="608" y="492" text-anchor="end" font-size="13" fill="#333">Quantity (units/week)</text>

  <!-- Reference lines: original equilibrium E1 -->
  <line x1="90" y1="253.5" x2="299" y2="253.5" stroke="#888" stroke-width="1.2" stroke-dasharray="5,4"/>
  <line x1="299" y1="253.5" x2="299" y2="470" stroke="#888" stroke-width="1.2" stroke-dasharray="5,4"/>

  <!-- Reference lines: new equilibrium E2 -->
  <line x1="90" y1="313.5" x2="378" y2="313.5" stroke="#aaa" stroke-width="1.2" stroke-dasharray="5,4"/>
  <line x1="378" y1="313.5" x2="378" y2="470" stroke="#aaa" stroke-width="1.2" stroke-dasharray="5,4"/>

  <!-- Demand -->
  <line x1="150" y1="140" x2="560" y2="452" stroke="#14746F" stroke-width="2.5"/>
  <text x="568" y="450" font-size="14" fill="#14746F">D</text>

  <!-- S1 (original, dashed) -->
  <line x1="140" y1="440" x2="430" y2="100" stroke="#0D5C57" stroke-width="2.5" stroke-dasharray="6,4"/>
  <text x="424" y="90" text-anchor="middle" font-size="14" fill="#0D5C57">S&#8321;</text>

  <!-- S2 (new, solid) -->
  <line x1="270" y1="440" x2="560" y2="100" stroke="#0D5C57" stroke-width="2.5"/>
  <text x="560" y="90" text-anchor="middle" font-size="14" fill="#0D5C57">S&#8322;</text>

  <!-- Shift arrow -->
  <line x1="382" y1="170" x2="490" y2="170" stroke="#14746F" stroke-width="1.8" marker-end="url(#arrowhead)"/>

  <!-- Surplus at the original price P1, measured across to S2 -->
  <line x1="299" y1="253.5" x2="429" y2="253.5" stroke="#C0392B" stroke-width="3"/>
  <text x="364" y="242" text-anchor="middle" font-size="13" fill="#C0392B">Surplus at P&#8321;</text>

  <!-- Equilibrium points -->
  <circle cx="299" cy="253.5" r="4.5" fill="#333"/>
  <circle cx="378" cy="313.5" r="4.5" fill="#333"/>
  <circle cx="429" cy="253.5" r="4" fill="#C0392B"/>

  <!-- Axis value labels -->
  <text x="78" y="258" text-anchor="end" font-size="14" fill="#333">P&#8321;</text>
  <text x="78" y="318" text-anchor="end" font-size="14" fill="#333">P&#8322;</text>
  <text x="299" y="490" text-anchor="middle" font-size="14" fill="#333">Q&#8321;</text>
  <text x="378" y="490" text-anchor="middle" font-size="14" fill="#333">Q&#8322;</text>
</svg>
