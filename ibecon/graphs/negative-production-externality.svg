<svg xmlns="http://www.w3.org/2000/svg" width="680" height="540" font-family="Georgia, serif">
  <text x="340" y="36" text-anchor="middle" font-size="16" font-weight="bold" fill="#222">Negative externality of production</text>

  <!-- DWL triangle (drawn first) -->
  <polygon points="330,275 450,210 450,340" fill="#C0392B" fill-opacity="0.15"/>

  <!-- Axes -->
  <line x1="90" y1="60" x2="90" y2="470" stroke="#333" stroke-width="2"/>
  <line x1="90" y1="470" x2="610" y2="470" stroke="#333" stroke-width="2"/>
  <text transform="rotate(-90 30 175)" x="30" y="175" text-anchor="middle" font-size="13" fill="#333">Price / Cost / Benefit</text>
  <text x="608" y="492" text-anchor="end" font-size="13" fill="#333">Quantity (units/week)</text>

  <!-- Curves -->
  <line x1="90" y1="145" x2="570" y2="405" stroke="#14746F" stroke-width="2.5"/>
  <text x="576" y="409" font-size="12" font-style="italic" fill="#14746F">MSB = demand</text>
  <line x1="210" y1="470" x2="570" y2="275" stroke="#0D5C57" stroke-width="2.5"/>
  <text x="576" y="279" font-size="12" font-style="italic" fill="#0D5C57">MPC = supply</text>
  <line x1="90" y1="405" x2="570" y2="145" stroke="#C0392B" stroke-width="2.5"/>
  <text x="576" y="149" font-size="12" font-style="italic" fill="#C0392B">MSC</text>

  <!-- Social optimum reference lines -->
  <line x1="90" y1="275" x2="330" y2="275" stroke="#888" stroke-width="1.1" stroke-dasharray="5,4"/>
  <line x1="330" y1="275" x2="330" y2="470" stroke="#888" stroke-width="1.1" stroke-dasharray="5,4"/>
  <!-- Market equilibrium reference lines -->
  <line x1="90" y1="340" x2="450" y2="340" stroke="#aaa" stroke-width="1.1" stroke-dasharray="5,4"/>
  <line x1="450" y1="340" x2="450" y2="470" stroke="#aaa" stroke-width="1.1" stroke-dasharray="5,4"/>

  <circle cx="330" cy="275" r="4.5" fill="#0D5C57"/>
  <circle cx="450" cy="340" r="4.5" fill="#555"/>

  <text x="78" y="279" text-anchor="end" font-size="12" fill="#0D5C57">P*</text>
  <text x="78" y="344" text-anchor="end" font-size="12" fill="#555">Pm</text>
  <text x="330" y="492" text-anchor="middle" font-size="12" fill="#0D5C57">Q*</text>
  <text x="450" y="492" text-anchor="middle" font-size="12" fill="#555">Qm</text>

  <text x="412" y="278" text-anchor="middle" font-size="11" font-weight="bold" fill="#C0392B">DWL</text>
</svg>
