<svg xmlns="http://www.w3.org/2000/svg" width="680" height="540" font-family="Georgia, serif">
  <defs>
    <marker id="ah" markerWidth="9" markerHeight="9" refX="4.5" refY="4.5" orient="auto-start-reverse">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#333"/>
    </marker>
  </defs>
  <text x="340" y="36" text-anchor="middle" font-size="16" font-weight="bold" fill="#222">Price ceiling</text>

  <!-- Axes -->
  <line x1="90" y1="60" x2="90" y2="470" stroke="#333" stroke-width="2"/>
  <line x1="90" y1="470" x2="610" y2="470" stroke="#333" stroke-width="2"/>
  <text transform="rotate(-90 30 140)" x="30" y="140" text-anchor="middle" font-size="13" fill="#333">Price ($/unit)</text>
  <text x="608" y="492" text-anchor="end" font-size="13" fill="#333">Quantity (units/week)</text>

  <!-- Demand and supply -->
  <line x1="90" y1="90" x2="560" y2="430" stroke="#14746F" stroke-width="2.5"/>
  <text x="566" y="432" font-size="14" fill="#14746F">Demand</text>
  <line x1="90" y1="430" x2="560" y2="90" stroke="#0D5C57" stroke-width="2.5"/>
  <text x="566" y="92" font-size="14" fill="#0D5C57">Supply</text>

  <!-- Equilibrium reference -->
  <line x1="90" y1="260" x2="325" y2="260" stroke="#aaa" stroke-width="1" stroke-dasharray="4,4"/>
  <line x1="325" y1="260" x2="325" y2="470" stroke="#aaa" stroke-width="1" stroke-dasharray="4,4"/>
  <circle cx="325" cy="260" r="4" fill="#333"/>
  <text x="78" y="264" text-anchor="end" font-size="12" fill="#555">Pe</text>
  <text x="325" y="492" text-anchor="middle" font-size="12" fill="#555">Qe</text>

  <!-- Price ceiling (binding, below equilibrium) -->
  <line x1="90" y1="320" x2="470" y2="320" stroke="#7D3C98" stroke-width="2.5"/>
  <text x="476" y="324" font-size="13" font-weight="bold" fill="#7D3C98">Price ceiling</text>
  <text x="78" y="324" text-anchor="end" font-size="12" font-weight="bold" fill="#7D3C98">Pc</text>

  <!-- Qs and Qd at the ceiling -->
  <line x1="242" y1="320" x2="242" y2="470" stroke="#888" stroke-width="1.1" stroke-dasharray="5,4"/>
  <line x1="408" y1="320" x2="408" y2="470" stroke="#888" stroke-width="1.1" stroke-dasharray="5,4"/>
  <circle cx="242" cy="320" r="4" fill="#0D5C57"/>
  <circle cx="408" cy="320" r="4" fill="#14746F"/>
  <text x="242" y="492" text-anchor="middle" font-size="12" fill="#0D5C57">Qs</text>
  <text x="408" y="492" text-anchor="middle" font-size="12" fill="#14746F">Qd</text>

  <!-- Shortage gap -->
  <line x1="242" y1="513" x2="408" y2="513" stroke="#333" stroke-width="1.5" marker-start="url(#ah)" marker-end="url(#ah)"/>
  <text x="325" y="531" text-anchor="middle" font-size="12" font-weight="bold" fill="#333">Shortage</text>
</svg>
