<svg xmlns="http://www.w3.org/2000/svg" width="680" height="540" font-family="Georgia, serif">
  <text x="340" y="36" text-anchor="middle" font-size="16" font-weight="bold" fill="#222">Indirect (specific) tax</text>

  <!-- Tax revenue rectangle (drawn first) -->
  <rect x="90" y="250" width="172" height="80" fill="#14746F" fill-opacity="0.15" stroke="#14746F" stroke-width="1"/>
  <!-- DWL triangle -->
  <polygon points="262,250 262,330 330,290" fill="#C0392B" fill-opacity="0.2"/>

  <!-- Axes -->
  <line x1="90" y1="60" x2="90" y2="470" stroke="#333" stroke-width="2"/>
  <line x1="90" y1="470" x2="610" y2="470" stroke="#333" stroke-width="2"/>
  <text transform="rotate(-90 30 140)" x="30" y="140" text-anchor="middle" font-size="13" fill="#333">Price ($/unit)</text>
  <text x="608" y="492" text-anchor="end" font-size="13" fill="#333">Quantity (units/week)</text>

  <!-- Curves -->
  <line x1="90" y1="150" x2="570" y2="430" stroke="#14746F" stroke-width="2.5"/>
  <text x="576" y="432" font-size="13" fill="#14746F">Demand</text>
  <line x1="90" y1="430" x2="570" y2="150" stroke="#0D5C57" stroke-width="2.5"/>
  <text x="576" y="152" font-size="13" fill="#0D5C57">Supply</text>
  <line x1="90" y1="350" x2="570" y2="70" stroke="#0D5C57" stroke-width="2.2" stroke-dasharray="7,4"/>
  <text x="576" y="74" font-size="12" fill="#0D5C57">S + tax</text>

  <!-- Reference lines -->
  <line x1="90" y1="290" x2="330" y2="290" stroke="#aaa" stroke-width="1" stroke-dasharray="4,4"/>
  <line x1="90" y1="250" x2="262" y2="250" stroke="#888" stroke-width="1.1" stroke-dasharray="5,4"/>
  <line x1="90" y1="330" x2="262" y2="330" stroke="#888" stroke-width="1.1" stroke-dasharray="5,4"/>
  <line x1="262" y1="250" x2="262" y2="470" stroke="#888" stroke-width="1.1" stroke-dasharray="5,4"/>
  <line x1="330" y1="290" x2="330" y2="470" stroke="#aaa" stroke-width="1" stroke-dasharray="4,4"/>

  <circle cx="330" cy="290" r="4" fill="#333"/>
  <circle cx="262" cy="250" r="4" fill="#0D5C57"/>
  <circle cx="262" cy="330" r="4" fill="#0D5C57"/>

  <text x="78" y="254" text-anchor="end" font-size="12" fill="#333">Pc</text>
  <text x="78" y="294" text-anchor="end" font-size="12" fill="#555">Pe</text>
  <text x="78" y="334" text-anchor="end" font-size="12" fill="#333">Pp</text>
  <text x="262" y="492" text-anchor="middle" font-size="12" fill="#333">Qt</text>
  <text x="330" y="492" text-anchor="middle" font-size="12" fill="#555">Qe</text>

  <text x="176" y="294" text-anchor="middle" font-size="11" font-weight="bold" fill="#0D5C57">Tax revenue</text>
  <text x="289" y="292" text-anchor="middle" font-size="11" font-weight="bold" fill="#C0392B">DWL</text>
</svg>
