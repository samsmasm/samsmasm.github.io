<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Plainspeak</title>
<style>
  :root {
    --purple: #4a1a7a;
    --purple-dark: #3a1361;
    --purple-mid: #6b4a9a;
    --purple-soft: #d0b6f5;
    --purple-pale: #f5f0ff;
    --border: #e4ddef;
    --divider: #f0e8ff;
    --ink: #1d1430;
    --muted: #6b5f80;
    --flag-bg: #fff0f6;
    --flag-border: #f5b6d4;
    --flag-text: #7a1a4a;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
    color: var(--ink);
    background: #fff;
    line-height: 1.55;
  }

  /* ---- header ---- */
  header {
    background:
      radial-gradient(ellipse at 12% 50%, #e8d6ff 0%, transparent 50%),
      radial-gradient(ellipse at 35% 18%, #d6f0ff 0%, transparent 45%),
      radial-gradient(ellipse at 60% 80%, #ffd6e7 0%, transparent 42%),
      radial-gradient(ellipse at 82% 28%, #f5e8ff 0%, transparent 45%),
      radial-gradient(ellipse at 92% 72%, #fff3d6 0%, transparent 40%),
      #f5f0ff;
    border-bottom: 1px solid var(--divider);
    padding: 22px 24px;
  }
  .header-inner {
    max-width: 920px; margin: 0 auto;
    display: flex; align-items: center; gap: 14px;
  }
  .header-inner img {
    width: 60px; height: 60px; border-radius: 14px;
    background: rgba(255,255,255,0.45);
  }
  .wordmark { font-family: Georgia, serif; font-weight: 700; font-size: 30px; color: var(--purple); }
  .tagline { font-size: 13px; color: var(--muted); margin-top: 2px; }
  .back { margin-left: auto; font-size: 13px; color: var(--purple); text-decoration: none; }
  .back:hover { text-decoration: underline; }

  main { max-width: 920px; margin: 0 auto; padding: 24px; }

  /* ---- controls ---- */
  .panel {
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 20px 22px;
    margin-bottom: 22px;
    background: #fff;
  }
  .label {
    display: block;
    font-size: 11px; font-weight: 700; letter-spacing: 0.08em;
    text-transform: uppercase; color: var(--muted);
    margin-bottom: 8px;
  }
  .field { margin-bottom: 18px; }
  .field:last-child { margin-bottom: 0; }

  input[type="text"], textarea {
    width: 100%; padding: 11px 13px; font-size: 15px;
    border: 1.5px solid #e0d8ee; border-radius: 9px; outline: none;
    font-family: inherit; color: var(--ink); background: #fff;
  }
  input[type="text"]:focus, textarea:focus { border-color: var(--purple); }
  textarea { resize: vertical; min-height: 200px; line-height: 1.55; }

  .input-tabs { display: flex; gap: 6px; margin-bottom: 12px; }
  .input-tab {
    padding: 7px 14px; font-size: 13px; font-weight: 500;
    color: var(--muted); background: none; border: 0;
    border-bottom: 3px solid transparent; cursor: pointer;
  }
  .input-tab.active { color: var(--purple); border-bottom-color: var(--purple); }

  .drop {
    border: 1.5px dashed var(--purple-soft); border-radius: 10px;
    padding: 32px 20px; text-align: center; color: var(--muted);
    font-size: 14px; cursor: pointer; background: var(--purple-pale);
  }
  .drop.drag { background: #ece0ff; border-color: var(--purple); }
  .drop strong { color: var(--purple); }
  .pdf-status { font-size: 13px; color: var(--muted); margin-top: 8px; }

  .row { display: flex; gap: 28px; flex-wrap: wrap; align-items: flex-start; }
  .row > .field { flex: 1; min-width: 220px; }

  .level-row { display: flex; align-items: center; gap: 14px; }
  input[type="range"] { flex: 1; accent-color: var(--purple); }
  .level-val {
    font-family: Georgia, serif; font-size: 22px; font-weight: 700;
    color: var(--purple); min-width: 28px; text-align: center;
  }
  .level-hint { font-size: 12px; color: var(--muted); margin-top: 6px; }

  .effort { display: flex; gap: 8px; }
  .effort label {
    flex: 1; text-align: center; padding: 9px 6px; font-size: 13px;
    border: 1.5px solid #e0d8ee; border-radius: 9px; cursor: pointer;
    color: var(--muted); background: #fff;
  }
  .effort input { position: absolute; opacity: 0; pointer-events: none; }
  .effort label.sel { border-color: var(--purple); color: var(--purple); background: var(--purple-pale); font-weight: 600; }
  .effort .sub { display: block; font-size: 11px; font-weight: 400; color: var(--muted); margin-top: 2px; }

  .actions { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
  button.primary {
    background: var(--purple); color: #fff; border: 0;
    font-size: 15px; font-weight: 700; padding: 12px 26px;
    border-radius: 10px; cursor: pointer;
  }
  button.primary:hover { background: var(--purple-dark); }
  button.primary:disabled { background: #c9bbe0; cursor: default; }
  button.ghost {
    background: #fff; color: var(--purple); border: 1.5px solid var(--purple-soft);
    font-size: 14px; font-weight: 600; padding: 10px 18px; border-radius: 9px; cursor: pointer;
  }
  button.ghost:hover { background: var(--purple-pale); }
  button.ghost:disabled { color: #c9bbe0; border-color: #ece4f7; cursor: default; }

  .progress { font-size: 14px; color: var(--muted); }
  .progress .count { color: var(--purple); font-weight: 600; }
  .warn { color: var(--flag-text); font-size: 13px; margin-top: 10px; }
  .err { color: #c62a30; font-size: 13px; margin-top: 10px; }

  /* ---- output ---- */
  #output { margin-top: 8px; }
  .para {
    position: relative;
    padding: 14px 16px 14px 18px;
    margin-bottom: 10px;
    border-radius: 9px;
    border: 1px solid transparent;
  }
  .para:hover { background: #fbfaff; }
  .para.flagged { background: var(--flag-bg); border-color: var(--flag-border); }
  .para.pending { color: var(--muted); font-style: italic; }
  .para-text {
    font-size: 16px; line-height: 1.65; white-space: pre-wrap;
    outline: none;
  }
  .para-text[contenteditable="true"] { cursor: text; }
  .para.edited .para-text { /* nothing loud, just track in state */ }
  .flag-note {
    display: block; margin-top: 8px;
    font-size: 12px; font-weight: 700; letter-spacing: 0.04em;
    color: var(--flag-text);
  }
  .para-tools {
    display: flex; gap: 10px; align-items: center;
    margin-top: 8px; opacity: 0; transition: opacity 0.12s;
  }
  .para:hover .para-tools, .para.flagged .para-tools { opacity: 1; }
  .para-tools button {
    background: none; border: 0; color: var(--purple-mid);
    font-size: 12px; font-weight: 600; cursor: pointer; padding: 0;
  }
  .para-tools button:hover { color: var(--purple); text-decoration: underline; }
  .para-tools .verifying { color: var(--muted); font-weight: 400; font-style: italic; }
  .para-tools .edited-tag { color: var(--muted); font-weight: 400; }

  .download-bar {
    display: none; gap: 12px; margin-top: 20px; padding-top: 18px;
    border-top: 1px solid var(--divider);
  }
  .download-bar.show { display: flex; }

  footer {
    max-width: 920px; margin: 40px auto 24px; padding: 16px 24px 0;
    border-top: 1px solid var(--divider);
    font-size: 11px; color: #bbb;
  }
  .hidden { display: none !important; }
</style>
</head>
<body>
<header>
  <div class="header-inner">
    <img src="/unisamsq.png" alt="unisam.nz">
    <div>
      <div class="wordmark">Plainspeak</div>
      <div class="tagline">Classic texts, translated into plain modern English</div>
    </div>
    <a class="back" href="/">← unisam.nz</a>
  </div>
</header>

<main>
  <!-- Controls -->
  <section class="panel" id="controls">
    <div class="field">
      <label class="label" for="work-summary">What is this text? (optional, helps continuity)</label>
      <input type="text" id="work-summary" placeholder="e.g. Mill's On Liberty, defending individual freedom against social and political control">
    </div>

    <div class="field">
      <label class="label">Source text</label>
      <div class="input-tabs">
        <button class="input-tab active" data-mode="paste" type="button">Paste text</button>
        <button class="input-tab" data-mode="pdf" type="button">Upload PDF</button>
      </div>
      <div id="paste-pane">
        <textarea id="source-text" placeholder="Paste the passage you want translated. Separate paragraphs with a blank line."></textarea>
      </div>
      <div id="pdf-pane" class="hidden">
        <div class="drop" id="drop">
          <strong>Choose a PDF</strong> or drop one here. Text is extracted in your browser.
          <input type="file" id="pdf-input" accept="application/pdf" class="hidden">
        </div>
        <div class="pdf-status" id="pdf-status"></div>
      </div>
    </div>

    <div class="row">
      <div class="field">
        <label class="label" for="level">Reading level</label>
        <div class="level-row">
          <input type="range" id="level" min="8" max="18" value="8" step="1">
          <span class="level-val" id="level-val">8</span>
        </div>
        <div class="level-hint" id="level-hint"></div>
      </div>
      <div class="field">
        <label class="label">Effort (chunk size)</label>
        <div class="effort" id="effort">
          <label class="sel"><input type="radio" name="effort" value="high" checked>High<span class="sub">~1 paragraph</span></label>
          <label><input type="radio" name="effort" value="standard">Standard<span class="sub">~2–3 paras</span></label>
          <label><input type="radio" name="effort" value="low">Low<span class="sub">~5–6 paras</span></label>
        </div>
      </div>
    </div>

    <div class="field" style="margin-top:4px">
      <div class="actions">
        <button class="primary" id="translate-btn">Translate</button>
        <span class="progress" id="progress"></span>
      </div>
      <div class="warn hidden" id="warn"></div>
      <div class="err hidden" id="error"></div>
    </div>
  </section>

  <!-- Output -->
  <section id="output"></section>

  <div class="download-bar" id="download-bar">
    <button class="ghost" id="dl-md">Download .md</button>
    <button class="ghost" id="dl-txt">Download .txt</button>
  </div>
</main>

<footer>
  Built by Sam G · SSIS Ho Chi Minh City · all vibe coded · found a problem? tell Sam.
</footer>

<script type="module">
import * as pdfjsLib from 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.0.379/pdf.min.mjs';
pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.0.379/pdf.worker.min.mjs';

// ====================================================================
// Config
// ====================================================================
const TRANSLATE_URL = '/moderntranslation/api/translate';
const VERIFY_URL = '/moderntranslation/api/verify';
const EFFORT_MIN_WORDS = { high: 150, standard: 400, low: 800 };
const WORD_WARN_LIMIT = 60000;

// ====================================================================
// State (the source of truth for display + export)
// ====================================================================
// paragraphs: [{ id, original, translation, flag, edited, summaryBefore }]
let paragraphs = [];
let running = false;

// ====================================================================
// Text + chunking (pure, unit-testable)
// ====================================================================
function splitParagraphs(text) {
  return text
    .replace(/\r\n/g, '\n')
    .split(/\n\s*\n+/)
    .map(p => p.trim())
    .filter(p => p.length > 0);
}

function wordCount(s) {
  const m = s.trim().match(/\S+/g);
  return m ? m.length : 0;
}

// Group paragraphs into chunks by minimum word count. Paragraphs are never
// split. A trailing chunk that is too small is merged into the previous one.
function buildChunks(paras, targetMinWords) {
  const chunks = [];
  let current = [];
  let currentWords = 0;
  for (const p of paras) {
    current.push(p);
    currentWords += wordCount(p.original);
    if (currentWords >= targetMinWords) {
      chunks.push(current);
      current = [];
      currentWords = 0;
    }
  }
  if (current.length) {
    if (chunks.length && currentWords < targetMinWords * 0.5) {
      chunks[chunks.length - 1].push(...current);
    } else {
      chunks.push(current);
    }
  }
  return chunks;
}

// ====================================================================
// Prompts
// ====================================================================
function buildSystemPrompt(readingLevel) {
  return `You are translating a classic English text into modern, accessible English for a reader at approximately a ${readingLevel} year old reading level. This is translation, not summarization: every idea in the original must appear in the translation, in the same order. Nothing is cut for brevity, and nothing is added that wasn't implied by the original.

Principles:
1. Sentence length and structure. Break long, multi-clause sentences into shorter ones. Where a sentence does several jobs, split it. Use colons to introduce lists or structure rather than long subordinate clauses.
2. Lead with the main idea. Where the original buries the key point inside a long sentence, restructure so the core claim comes first.
3. Preserve rhetorical force, don't flatten it. Vivid words and strong claims should usually survive translation, not be softened into something academic or neutral.
4. Metaphors and extended images: keep whole or drop entirely. Don't modernize a metaphor halfway. If an image needs specialist or classical knowledge to land, drop it. If it's intuitive without context, keep it intact across the whole passage.
5. Avoid anachronism. Don't impose modern categories or institutions onto historical concepts that don't quite map.
6. No em dashes. Use commas, periods, or colons instead.
7. Vocabulary: simple, not simplistic. Strong, precise words are fine if a reader at this level would know them or could infer them from context. Avoid academic register or jargon. At lower reading levels, where a word has no true simple equivalent and a substitute would lose real meaning, you may add a brief inline gloss in parentheses (e.g. "tyranny (cruel, unfair rule)"). Use this sparingly, only when needed.
8. Paragraphs may be split internally where a single original paragraph is doing too much for the target reader. If you split one, keep both halves inside that paragraph's entry, separated by a blank line. Do NOT change the number of entries you return.

You will be given: a short summary of the work as a whole, a rolling summary of everything translated so far in this session, the immediately preceding paragraph's finished translation (for tone and continuity), and a numbered list of source paragraphs to translate now.

OUTPUT CONTRACT. Respond ONLY with valid JSON, no markdown fences, in this exact shape:
{"paragraphs": ["translation of paragraph 1", "translation of paragraph 2", ...], "rolling_summary": "..."}
The "paragraphs" array must have EXACTLY the same number of entries as the numbered source paragraphs, aligned one-to-one and in order. The "rolling_summary" must be the complete, replacement summary (not just what's new), kept to roughly 400 to 500 words by compressing older material as needed.

Worked examples (calibrated around reading level 13; follow their mechanics, but match the requested level above):

EXAMPLE 1 — narrative/historical (Mill, On Liberty)
Original: "The struggle between Liberty and Authority is the most conspicuous feature in the portions of history with which we are earliest familiar, particularly in that of Greece, Rome, and England. But in old times this contest was between subjects, or some classes of subjects, and the Government. By liberty, was meant protection against the tyranny of the political rulers. The rulers were conceived (except in some of the popular governments of Greece) as in a necessarily antagonistic position to the people whom they ruled. They consisted of a governing One, or a governing tribe or caste, who derived their authority from inheritance or conquest, who, at all events, did not hold it at the pleasure of the governed, and whose supremacy men did not venture, perhaps did not desire, to contest, whatever precautions might be taken against its oppressive exercise. Their power was regarded as necessary, but also as highly dangerous; as a weapon which they would attempt to use against their subjects, no less than against external enemies."
Translation: "Throughout history, the conflict between Liberty and Authority has been one of the most important and visible struggles, especially in Greece, Rome, and England. But in earlier times, this was a struggle between ordinary people, or certain groups, and their rulers. Liberty simply meant protection from those rulers' tyranny. With a few exceptions in ancient Greece, rulers were seen as natural enemies of the people they governed. Power was held by a single leader, or by a ruling group or class, who got their authority through inheritance or conquest. They did not rule because the people chose them, and almost nobody dared challenge their power, or perhaps even wanted to. Whatever limits people tried to place on how that power was used, the power itself was never really in question. Rulers were seen as necessary, but also as dangerous: a weapon that could be turned against their own people just as easily as against foreign enemies."

EXAMPLE 2 — extended metaphor (Mill, On Liberty)
Original: "To prevent the weaker members of the community from being preyed on by innumerable vultures, it was needful that there should be an animal of prey stronger than the rest, commissioned to keep them down. But as the king of the vultures would be no less bent upon preying upon the flock than any of the minor harpies, it was indispensable to be in a perpetual attitude of defence against his beak and claws. The aim, therefore, of patriots was to set limits to the power which the ruler should be suffered to exercise over the community; and this limitation was what they meant by liberty. It was attempted in two ways. First, by obtaining a recognition of certain immunities, called political liberties or rights, which it was to be regarded as a breach of duty in the ruler to infringe, and which, if he did infringe, specific resistance, or general rebellion, was held to be justifiable. A second, and generally a later expedient, was the establishment of constitutional checks, by which the consent of the community, or of a body of some sort, supposed to represent its interests, was made a necessary condition to some of the more important acts of the governing power."
Translation: "To protect the weaker members of society from being picked apart by countless vultures, people believed they needed a stronger predator to keep the others in check. But the king of the vultures would be just as hungry for prey as the lesser ones, so it was vital to stay constantly on guard against his claws too. The goal of those who fought for liberty was therefore to set limits on how much power a ruler could have over the people. This is what they meant by liberty. They tried to achieve this in two ways. The first was to establish certain rights, known as political liberties, which rulers were expected to respect. If a ruler broke these rights, resistance or even rebellion was seen as justified. The second method, which came later, was to create constitutional checks: rules that meant a ruler could not take major decisions without the agreement of the community, or of some body representing its interests."

EXAMPLE 3 — plain logical sequence (Adam Smith, The Wealth of Nations)
Original: "When the division of labour has been once thoroughly established, it is but a very small part of a man's wants which the produce of his own labour can supply. He supplies the far greater part of them by exchanging that surplus part of the produce of his own labour, which is over and above his own consumption, for such parts of the produce of other men's labour as he has occasion for. Every man thus lives by exchanging, or becomes, in some measure, a merchant, and the society itself grows to be what is properly a commercial society."
Translation: "Once the division of labour is fully established, a person can no longer make everything they need by their own work alone. Instead, they get most of what they need a different way. They produce more than they use themselves, and they trade that extra amount for the things other people have made that they actually need. In this way, everyone lives by trading with everyone else. Each person becomes, in a sense, a kind of merchant, and society as a whole becomes what we can properly call a commercial society."`;
}

function buildUserMessage({ workSummary, rollingSummary, prevTranslation, chunkParas }) {
  const numbered = chunkParas.map((p, i) => `[${i + 1}] ${p.original}`).join('\n\n');
  return [
    `WORK SUMMARY: ${workSummary || '(none provided)'}`,
    ``,
    `ROLLING SUMMARY SO FAR: ${rollingSummary || '(nothing translated yet)'}`,
    ``,
    `PREVIOUS TRANSLATED PARAGRAPH (for tone and continuity): ${prevTranslation || '(this is the first passage)'}`,
    ``,
    `SOURCE PARAGRAPHS TO TRANSLATE NOW (return exactly ${chunkParas.length}, aligned one-to-one, in order):`,
    numbered,
  ].join('\n');
}

function buildVerifyPrompt(original, translation) {
  return `You are checking a plain-English translation of a classic text for fidelity of MEANING only. Compare the original passage with its translation. Flag ONLY genuine losses or distortions of meaning: a dropped idea, a reversed or weakened claim, an added idea that wasn't in the original, or a factual change. Do NOT flag style, sentence length, vocabulary simplicity, or reading-level choices. Do NOT rewrite anything.

Respond ONLY with valid JSON, no markdown fences:
{"flag": null}   if the meaning is faithfully preserved
{"flag": "SHORT COMMENT IN CAPITALS"}   if there is a genuine problem

ORIGINAL:
${original}

TRANSLATION:
${translation}`;
}

// ====================================================================
// API helpers
// ====================================================================
function extractJson(text) {
  if (!text) throw new Error('Empty response');
  const m = text.match(/\{[\s\S]*\}/);
  if (!m) throw new Error('No JSON in response');
  return JSON.parse(m[0]);
}

async function callTranslate(system, user) {
  const res = await fetch(TRANSLATE_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ system, user }),
  });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || `Translate failed (${res.status})`);
  return extractJson(data.text);
}

async function callVerify(prompt) {
  const res = await fetch(VERIFY_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ prompt }),
  });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || `Verify failed (${res.status})`);
  return extractJson(data.text);
}

// ====================================================================
// Rendering
// ====================================================================
const output = document.getElementById('output');

function paraEl(id) { return document.getElementById('para-' + id); }

function renderParagraph(p) {
  let el = paraEl(p.id);
  if (!el) {
    el = document.createElement('div');
    el.className = 'para';
    el.id = 'para-' + p.id;
    output.appendChild(el);
  }
  el.classList.toggle('flagged', !!p.flag);
  el.classList.toggle('edited', !!p.edited);
  el.classList.toggle('pending', p.translation === null);

  const text = p.translation === null ? 'translating…' : p.translation;
  el.innerHTML = '';

  const textEl = document.createElement('div');
  textEl.className = 'para-text';
  textEl.textContent = text;
  if (p.translation !== null) {
    textEl.setAttribute('contenteditable', 'true');
    textEl.spellcheck = false;
    textEl.addEventListener('blur', () => {
      const v = textEl.innerText.trim();
      if (v !== p.translation) {
        p.translation = v;
        p.edited = true;
        p.flag = null; // user took responsibility
        renderParagraph(p);
      }
    });
  }
  el.appendChild(textEl);

  if (p.flag) {
    const note = document.createElement('span');
    note.className = 'flag-note';
    note.textContent = '[' + p.flag + ']';
    el.appendChild(note);
  }

  if (p.translation !== null) {
    const tools = document.createElement('div');
    tools.className = 'para-tools';
    const regen = document.createElement('button');
    regen.textContent = 'Regenerate';
    regen.addEventListener('click', () => regenerateParagraph(p));
    tools.appendChild(regen);
    if (p.edited) {
      const tag = document.createElement('span');
      tag.className = 'edited-tag';
      tag.textContent = 'edited';
      tools.appendChild(tag);
    }
    el.appendChild(tools);
  }
}

function setVerifying(p, on) {
  const el = paraEl(p.id);
  if (!el) return;
  let tools = el.querySelector('.para-tools');
  if (!tools) return;
  let v = tools.querySelector('.verifying');
  if (on && !v) {
    v = document.createElement('span');
    v.className = 'verifying';
    v.textContent = 'checking…';
    tools.appendChild(v);
  } else if (!on && v) {
    v.remove();
  }
}

// ====================================================================
// Verification (async, non-blocking)
// ====================================================================
async function verifyParagraph(p) {
  setVerifying(p, true);
  try {
    const result = await callVerify(buildVerifyPrompt(p.original, p.translation));
    p.flag = result.flag || null;
    renderParagraph(p);
  } catch (e) {
    // A failed verification shouldn't block or alarm; just skip the flag.
    console.warn('verify failed for', p.id, e);
    renderParagraph(p);
  } finally {
    setVerifying(p, false);
  }
}

// ====================================================================
// Regeneration (single paragraph)
// ====================================================================
async function regenerateParagraph(p) {
  const el = paraEl(p.id);
  const btn = el && el.querySelector('.para-tools button');
  if (btn) { btn.disabled = true; btn.textContent = 'Regenerating…'; }
  const prev = paragraphs.find(q => q.id === p.id - 1);
  try {
    const system = buildSystemPrompt(currentReadingLevel());
    const user = buildUserMessage({
      workSummary: document.getElementById('work-summary').value.trim(),
      rollingSummary: p.summaryBefore || '',
      prevTranslation: prev ? prev.translation : '',
      chunkParas: [p],
    });
    const result = await callTranslate(system, user);
    const arr = result.paragraphs || [];
    p.translation = (arr[0] || '').trim();
    p.edited = false;
    p.flag = null;
    renderParagraph(p);
    verifyParagraph(p);
  } catch (e) {
    if (btn) { btn.disabled = false; btn.textContent = 'Regenerate'; }
    showError('Regenerate failed: ' + e.message);
  }
}

// ====================================================================
// Main translation pass
// ====================================================================
function currentReadingLevel() {
  return parseInt(document.getElementById('level').value, 10);
}
function currentEffort() {
  return document.querySelector('input[name="effort"]:checked').value;
}

const progressEl = document.getElementById('progress');
const errorEl = document.getElementById('error');
const warnEl = document.getElementById('warn');
const translateBtn = document.getElementById('translate-btn');
const downloadBar = document.getElementById('download-bar');

function showError(msg) { errorEl.textContent = msg; errorEl.classList.remove('hidden'); }
function clearError() { errorEl.classList.add('hidden'); errorEl.textContent = ''; }

async function runTranslation() {
  if (running) return;
  clearError();
  warnEl.classList.add('hidden');

  const text = getSourceText();
  if (!text.trim()) { showError('Add some text to translate first.'); return; }

  const rawParas = splitParagraphs(text);
  if (!rawParas.length) { showError('Could not find any paragraphs in that text.'); return; }

  const totalWords = rawParas.reduce((n, p) => n + wordCount(p), 0);
  if (totalWords > WORD_WARN_LIMIT) {
    warnEl.textContent = `Heads up: that's about ${totalWords.toLocaleString()} words. This will use a lot of API credit and take a while.`;
    warnEl.classList.remove('hidden');
  }

  // Build state
  paragraphs = rawParas.map((original, i) => ({
    id: i, original, translation: null, flag: null, edited: false, summaryBefore: '',
  }));
  output.innerHTML = '';
  downloadBar.classList.remove('show');
  paragraphs.forEach(renderParagraph);

  const chunks = buildChunks(paragraphs, EFFORT_MIN_WORDS[currentEffort()]);
  const system = buildSystemPrompt(currentReadingLevel());
  const workSummary = document.getElementById('work-summary').value.trim();

  running = true;
  translateBtn.disabled = true;
  translateBtn.textContent = 'Translating…';

  let rollingSummary = '';
  let prevTranslation = '';
  let done = 0;

  try {
    for (const chunk of chunks) {
      progressEl.innerHTML = `<span class="count">${done}</span> of ${paragraphs.length} paragraphs`;
      // record the summary state each paragraph in this chunk starts from
      chunk.forEach(p => { p.summaryBefore = rollingSummary; });

      const user = buildUserMessage({ workSummary, rollingSummary, prevTranslation, chunkParas: chunk });
      const result = await callTranslate(system, user);

      let arr = result.paragraphs;
      if (!Array.isArray(arr)) throw new Error('Model did not return a paragraphs array.');
      // Defensive: align lengths if the model miscounts.
      if (arr.length !== chunk.length) {
        arr = reconcile(arr, chunk.length);
      }

      chunk.forEach((p, i) => {
        p.translation = (arr[i] || '').trim();
        renderParagraph(p);
        verifyParagraph(p); // fire and forget
      });

      rollingSummary = result.rolling_summary || rollingSummary;
      prevTranslation = chunk[chunk.length - 1].translation;
      done += chunk.length;
      progressEl.innerHTML = `<span class="count">${done}</span> of ${paragraphs.length} paragraphs`;
    }
    progressEl.innerHTML = `Done. <span class="count">${paragraphs.length}</span> paragraphs translated.`;
    downloadBar.classList.add('show');
  } catch (e) {
    showError('Translation stopped: ' + e.message);
  } finally {
    running = false;
    translateBtn.disabled = false;
    translateBtn.textContent = 'Translate';
  }
}

// If the model returns the wrong number of paragraphs, fit the array to the
// expected count rather than throwing away a whole chunk's work.
function reconcile(arr, n) {
  if (arr.length > n) {
    // merge the surplus tail into the last expected slot
    const head = arr.slice(0, n - 1);
    const tail = arr.slice(n - 1).join('\n\n');
    return [...head, tail];
  }
  // pad short arrays so indices line up; missing ones can be regenerated
  return [...arr, ...Array(n - arr.length).fill('')];
}

// ====================================================================
// Input handling (paste / PDF)
// ====================================================================
let pdfText = '';
let inputMode = 'paste';

function getSourceText() {
  return inputMode === 'pdf' ? pdfText : document.getElementById('source-text').value;
}

document.querySelectorAll('.input-tab').forEach(tab => {
  tab.addEventListener('click', () => {
    document.querySelectorAll('.input-tab').forEach(t => t.classList.remove('active'));
    tab.classList.add('active');
    inputMode = tab.dataset.mode;
    document.getElementById('paste-pane').classList.toggle('hidden', inputMode !== 'paste');
    document.getElementById('pdf-pane').classList.toggle('hidden', inputMode !== 'pdf');
  });
});

const drop = document.getElementById('drop');
const pdfInput = document.getElementById('pdf-input');
const pdfStatus = document.getElementById('pdf-status');

drop.addEventListener('click', () => pdfInput.click());
drop.addEventListener('dragover', e => { e.preventDefault(); drop.classList.add('drag'); });
drop.addEventListener('dragleave', () => drop.classList.remove('drag'));
drop.addEventListener('drop', e => {
  e.preventDefault(); drop.classList.remove('drag');
  if (e.dataTransfer.files[0]) handlePdf(e.dataTransfer.files[0]);
});
pdfInput.addEventListener('change', () => { if (pdfInput.files[0]) handlePdf(pdfInput.files[0]); });

async function handlePdf(file) {
  if (file.type !== 'application/pdf') { pdfStatus.textContent = 'That is not a PDF.'; return; }
  pdfStatus.textContent = 'Extracting text…';
  try {
    const buf = await file.arrayBuffer();
    const pdf = await pdfjsLib.getDocument({ data: buf }).promise;
    const pages = [];
    for (let i = 1; i <= pdf.numPages; i++) {
      const page = await pdf.getPage(i);
      const content = await page.getTextContent();
      pages.push(linesFromItems(content.items));
      pdfStatus.textContent = `Extracting text… page ${i} of ${pdf.numPages}`;
    }
    pdfText = cleanupPdf(pages);
    const words = wordCount(pdfText);
    const paras = splitParagraphs(pdfText).length;
    pdfStatus.textContent = `Extracted ${pdf.numPages} pages, ${words.toLocaleString()} words, ${paras} paragraphs. Ready to translate.`;
  } catch (e) {
    pdfStatus.textContent = 'Could not read that PDF: ' + e.message;
    pdfText = '';
  }
}

// Reconstruct lines from pdf.js text items using their y-position.
function linesFromItems(items) {
  const lines = [];
  let lastY = null, cur = '';
  for (const it of items) {
    const y = Math.round(it.transform[5]);
    if (lastY !== null && Math.abs(y - lastY) > 2) {
      lines.push(cur); cur = '';
    }
    cur += it.str;
    if (it.hasEOL) { lines.push(cur); cur = ''; lastY = null; continue; }
    lastY = y;
  }
  if (cur.trim()) lines.push(cur);
  return lines.map(l => l.replace(/\s+/g, ' ').trim());
}

// Non-AI cleanup: strip headers/footers/page numbers, de-hyphenate, rejoin
// wrapped lines, preserve paragraph breaks (blank lines).
function cleanupPdf(pages) {
  // 1. Find repeated short lines (likely running headers/footers) across pages.
  const freq = {};
  for (const lines of pages) {
    const seen = new Set();
    for (const l of lines) {
      const k = l.trim();
      if (k && k.length < 70 && !seen.has(k)) { seen.add(k); freq[k] = (freq[k] || 0) + 1; }
    }
  }
  const threshold = Math.max(3, Math.ceil(pages.length * 0.5));
  const headers = new Set(Object.keys(freq).filter(k => freq[k] >= threshold));

  // 2. Flatten, dropping page numbers and detected headers.
  const kept = [];
  for (const lines of pages) {
    for (const l of lines) {
      const t = l.trim();
      if (!t) { kept.push(''); continue; }
      if (/^\d{1,4}$/.test(t)) continue;            // bare page number
      if (/^[ivxlcdm]+$/i.test(t) && t.length <= 6) continue; // roman numeral page no.
      if (headers.has(t)) continue;                 // running header/footer
      kept.push(t);
    }
    kept.push(''); // page break acts as a soft paragraph boundary
  }

  // 3. Join into paragraphs. Blank line = paragraph break; otherwise join lines
  //    with spaces, healing hyphenation at line ends.
  const paras = [];
  let cur = '';
  for (const line of kept) {
    if (line === '') {
      if (cur.trim()) { paras.push(cur.trim()); cur = ''; }
      continue;
    }
    if (!cur) { cur = line; continue; }
    if (/[A-Za-z]-$/.test(cur)) {
      cur = cur.slice(0, -1) + line; // de-hyphenate across line break
    } else {
      cur += ' ' + line;
    }
  }
  if (cur.trim()) paras.push(cur.trim());

  return paras.join('\n\n');
}

// ====================================================================
// Reading-level hint
// ====================================================================
const levelEl = document.getElementById('level');
const levelVal = document.getElementById('level-val');
const levelHint = document.getElementById('level-hint');
function describeLevel(n) {
  if (n <= 9) return 'Simple, direct words and short sentences. Brief glosses allowed for hard ideas.';
  if (n <= 11) return 'Plain and clear, a little more vocabulary. Glosses only when truly needed.';
  if (n <= 14) return 'Accessible but can use precise words a teenager would know.';
  return 'Plain modern English, but keeps richer vocabulary and structure.';
}
function updateLevel() {
  levelVal.textContent = levelEl.value;
  levelHint.textContent = describeLevel(parseInt(levelEl.value, 10));
}
levelEl.addEventListener('input', updateLevel);
updateLevel();

// effort selection styling
document.getElementById('effort').addEventListener('change', () => {
  document.querySelectorAll('#effort label').forEach(l => {
    l.classList.toggle('sel', l.querySelector('input').checked);
  });
});

// ====================================================================
// Download
// ====================================================================
function assembleDoc() {
  return paragraphs.map(p => p.translation || p.original).join('\n\n').trim() + '\n';
}
function download(filename, text) {
  const blob = new Blob([text], { type: 'text/plain;charset=utf-8' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = filename;
  a.click();
  URL.revokeObjectURL(a.href);
}
document.getElementById('dl-md').addEventListener('click', () => download('plainspeak.md', assembleDoc()));
document.getElementById('dl-txt').addEventListener('click', () => download('plainspeak.txt', assembleDoc()));

translateBtn.addEventListener('click', runTranslation);
</script>
