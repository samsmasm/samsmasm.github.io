<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Responses - Concept Check</title>
<link rel="stylesheet" href="css/style.css">
<link rel="icon" href="/unisamsq.png">
</head>
<body>

<div class="masthead">
  <div class="masthead-in">
    <img src="/unisamsq.png" alt="">
    <a class="wordmark" href="home.html">Concept Check<span>unisam.nz</span></a>
    <div class="masthead-right" id="user-chip"></div>
  </div>
</div>

<div class="page">
  <div id="page-error"></div>
  <p class="tiny"><a id="back" href="home.html">Back to the class</a></p>

  <div class="spread">
    <div>
      <h1 id="set-title">Loading</h1>
      <p class="sub" id="set-sub"></p>
    </div>
    <span class="row">
      <a class="btn btn-quiet" id="edit-link">Edit questions</a>
      <button id="export" class="btn-quiet">Download CSV</button>
    </span>
  </div>

  <div class="panel mt" id="controls"></div>

  <div class="tabs">
    <button class="tab active" data-view="scores">How they did</button>
    <button class="tab" data-view="answers">What they wrote</button>
  </div>

  <div id="body"><p class="tiny">Loading.</p></div>
</div>

<footer>Built by Sam G &middot; all vibe coded &middot; found a problem? tell Sam.</footer>

<script type="module" src="js/results.js"></script>
</body>
</html>
