<svg xmlns="http://www.w3.org/2000/svg" viewBox="49 40 440 440" width="440" height="440" role="img">
  <title>Book Cover Printer: a book whose cover opens like a door</title>
  <!-- Pages behind the cover -->
  <rect x="146" y="68" width="266" height="392" rx="10" fill="#fffdf8" stroke="#1e2a4a" stroke-width="10"/>
  <g stroke="#1e2a4a" stroke-width="3" opacity="0.35">
    <line x1="398" y1="80" x2="398" y2="448"/>
    <line x1="388" y1="80" x2="388" y2="448"/>
  </g>
  <!-- Lit first page, seen through the gap -->
  <polygon points="334,88 376,82 376,446 334,436" fill="#f4a629"/>
  <!-- The cover, swung slightly inward on its spine like a door -->
  <polygon points="126,56 336,86 336,434 126,464" fill="#26355e" stroke="#1e2a4a" stroke-width="10" stroke-linejoin="round"/>
  <polygon points="126,56 158,60.5 158,459.5 126,464" fill="#121a30"/>
  <!-- Door panels -->
  <polygon points="186,99 302,115 302,239 186,236" fill="none" stroke="#f4a629" stroke-width="8" stroke-linejoin="round"/>
  <polygon points="186,262 302,262 302,405 186,421" fill="none" stroke="#f4a629" stroke-width="8" stroke-linejoin="round"/>
  <!-- Title on the cover -->
  <line x1="210" y1="152" x2="278" y2="160" stroke="#fffdf8" stroke-width="10" stroke-linecap="round"/>
  <line x1="222" y1="185" x2="264" y2="189" stroke="#c9d2ea" stroke-width="7" stroke-linecap="round"/>
  <!-- Knob -->
  <circle cx="318" cy="250" r="13" fill="#f4a629"/>
</svg>
