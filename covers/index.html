<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Covers · unisam.nz</title>
<link rel="icon" href="/geocornsmall.png">
<style>
  /* unisam.nz Tools sub-page (see AESTHETIC.md). Search box with live suggestions, cover options, one click prints. */
  :root {
    --ink: #1a1a1a;
    --muted: #6b6b6b;
    --accent: #4a1a7a;
    --accent-dark: #2d1a4a;
    --tint: #f5f0ff;
    --border: #d0b6f5;
    --rule: #f0e8ff;
    --warn: #8a4a00;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; background: #fff; }
  body {
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    font-size: 16px;
    line-height: 1.45;
  }
  .wrap { max-width: 960px; margin-inline: auto; padding-inline: 24px; }
  a { color: inherit; }
  button { font: inherit; cursor: pointer; }
  :focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

  /* Header: watercolour gradient, lilac-leaning for tools */
  .site-header {
    background:
      radial-gradient(ellipse at 14% 40%, #e8d6ff 0%, transparent 50%),
      radial-gradient(ellipse at 36% 85%, #ffd6e7 0%, transparent 42%),
      radial-gradient(ellipse at 55% 15%, #d6f0ff 0%, transparent 45%),
      radial-gradient(ellipse at 80% 60%, #f0d6ff 0%, transparent 45%),
      radial-gradient(ellipse at 95% 20%, #fff3d6 0%, transparent 38%),
      radial-gradient(ellipse at 50% 50%, #ece0ff 0%, transparent 60%),
      #f5f0ff;
  }
  .site-header .wrap { padding-block: 20px 18px; display: flex; align-items: center; justify-content: space-between; gap: 16px 24px; flex-wrap: wrap; }
  .logo { display: flex; align-items: center; gap: 14px; text-decoration: none; }
  .logo img { width: 60px; height: 60px; border-radius: 14px; object-fit: cover; flex-shrink: 0; background: rgba(255,255,255,0.55); border: 1.5px solid rgba(255,255,255,0.85); }
  .logo__name { display: block; font-family: Georgia, 'Times New Roman', serif; font-size: 25px; letter-spacing: -0.5px; color: var(--accent-dark); line-height: 1.1; }
  .logo__tagline { display: block; font-size: 12.5px; color: #6b4d8a; margin-top: 3px; }
  .back { font-size: 13px; font-weight: 500; color: var(--accent); text-decoration: none; }
  .back:hover { text-decoration: underline; }

  main.wrap { padding-block: 32px 56px; display: flex; flex-direction: column; gap: 22px; }
  .page-label { align-self: flex-start; border-top: 3px solid var(--accent); padding-top: 8px; margin-bottom: -16px; font-size: 10px; font-weight: 600; letter-spacing: 0.16em; text-transform: uppercase; color: var(--accent); }
  .page-title { font-family: Georgia, 'Times New Roman', serif; font-weight: normal; font-size: clamp(1.9rem, 5vw, 2.4rem); color: var(--accent-dark); margin: 0 0 4px; }
  .page-intro { margin: 0; color: var(--muted); font-size: 1rem; }

  form.search { display: flex; gap: 10px; flex-wrap: wrap; }
  .combo { position: relative; flex: 1 1 280px; min-width: 0; }
  .combo input {
    width: 100%; height: 56px; padding: 0 16px;
    font: inherit; font-size: 1.2rem;
    color: var(--ink); background: #fff;
    border: 1.5px solid var(--border); border-radius: 8px;
  }
  .combo input::placeholder { color: #999; }
  .combo input:focus-visible { outline: 2px solid var(--accent); outline-offset: 0; border-color: var(--accent); }
  .search > button, .printbtn {
    height: 56px; padding: 0 24px;
    font-weight: 600; font-size: 1rem;
    color: #fff; background: var(--accent);
    border: 0; border-radius: 8px;
  }
  .search > button:hover, .printbtn:hover { background: var(--accent-dark); }

  .sug {
    position: absolute; z-index: 10; left: 0; right: 0; top: calc(100% + 6px);
    margin: 0; padding: 6px; list-style: none;
    background: #fff; border: 1.5px solid var(--border); border-radius: 8px;
    max-height: min(70vh, 560px); overflow-y: auto;
  }
  .sug li[role="option"] {
    display: flex; gap: 14px; align-items: center; padding: 8px 10px; border-radius: 6px; cursor: pointer;
    border-bottom: 1px solid var(--rule);
  }
  .sug li[role="option"]:last-child { border-bottom: 0; }
  .sug li[role="option"]:hover, .sug li[aria-selected="true"] { background: var(--tint); }
  .sug li[aria-selected="true"] { outline: 2px solid var(--accent); outline-offset: -2px; }
  .sug .thumb {
    flex: none; width: 44px; height: 64px; display: grid; place-items: center; overflow: hidden;
    background: var(--tint); border-radius: 2px;
  }
  .sug .thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .sug .info { min-width: 0; display: flex; flex-direction: column; }
  .sug .t { font-family: Georgia, 'Times New Roman', serif; font-size: 1.08rem; color: var(--accent-dark); line-height: 1.25; overflow-wrap: anywhere; }
  .sug .a { color: var(--muted); font-size: .9rem; overflow-wrap: anywhere; }
  .sug .note { padding: 12px 10px; color: var(--muted); }

  .status { color: var(--muted); min-height: 1.5em; margin-block: -10px; }
  .chips { color: var(--muted); font-size: .95rem; }
  .chips .label { font-size: 10px; font-weight: 600; letter-spacing: 0.14em; text-transform: uppercase; color: var(--accent); margin-right: 8px; }
  .chips .dot { margin-inline: 6px; color: var(--border); }
  .chip, .linkbtn {
    padding: 0; background: none; border: 0;
    color: var(--accent); text-decoration: underline; text-decoration-color: var(--border); text-underline-offset: 3px;
  }
  .chip:hover, .linkbtn:hover { text-decoration-color: var(--accent); }

  .covers { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 20px; }
  @media (max-width: 640px) { .covers { grid-template-columns: minmax(0, 1fr); } }
  .card {
    background: var(--tint); border: 1.5px solid var(--border); border-radius: 10px;
    display: flex; flex-direction: column; min-width: 0; overflow: hidden;
  }
  .card .stage {
    display: grid; place-items: center;
    padding: 24px; min-height: 280px;
    background: transparent; border: 0; width: 100%; color: var(--muted);
  }
  .card .stage img {
    display: block; max-width: 100%; max-height: 440px; width: auto; height: auto;
    border: 1px solid rgba(45,26,74,.18);
  }
  .card .meta { padding: 14px 18px 18px; display: flex; flex-direction: column; gap: 10px; border-top: 1px solid var(--border); background: #fff; }
  .card .row { display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; align-items: baseline; }
  .card .opt { font-weight: 600; color: var(--accent-dark); }
  .card .src { font-size: 10px; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; color: var(--accent); }
  .card .q { font-size: .9rem; color: var(--muted); }
  .card .q.good { color: #145c34; }
  .card .q.warn { color: var(--warn); }
  .printrow { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
  .printrow .pl { font-weight: 600; color: var(--accent-dark); margin-right: 4px; }
  .fracbtn {
    flex: 1 1 0; min-width: 52px; height: 44px; font-weight: 600; font-size: 1rem;
    color: #fff; background: var(--accent); border: 0; border-radius: 8px;
  }
  .fracbtn:hover { background: var(--accent-dark); }
  .fracbtn:disabled { opacity: .45; cursor: default; }
  .fracbtn.soft { background: #fff; color: var(--warn); border: 1.5px solid #e8c79a; }

  .book-head { margin-bottom: 16px; }
  .book-title { font-family: Georgia, 'Times New Roman', serif; font-weight: normal; font-size: 1.5rem; line-height: 1.2; color: var(--accent-dark); margin: 0; text-wrap: balance; }
  .book-by { color: var(--muted); }
  .below { display: flex; flex-wrap: wrap; gap: 14px 28px; align-items: center; margin-top: 20px; }
  .morebtn {
    padding: 10px 18px; font-weight: 600; color: var(--accent);
    background: #fff; border: 1.5px solid var(--border); border-radius: 8px;
  }
  .morebtn:hover { border-color: var(--accent); }
  .more { margin-top: 20px; }

  /* Tabs (underline style) with the paper setting alongside, always visible */
  .bar { display: flex; justify-content: space-between; align-items: flex-end; gap: 10px 24px; flex-wrap: wrap; border-bottom: 1px solid var(--rule); }
  .tabs { display: flex; }
  .tabs button {
    padding: .7rem 1.05rem; font-size: 15px; font-weight: 500; color: #666;
    background: none; border: 0; border-bottom: 3px solid transparent; margin-bottom: -1px;
  }
  .tabs button:hover { color: var(--accent-dark); }
  .tabs button[aria-selected="true"] { color: var(--accent); border-bottom-color: var(--accent); }
  .bar .paper { padding-bottom: 8px; color: var(--muted); }
  .view { display: flex; flex-direction: column; gap: 22px; }
  .view[hidden] { display: none; }
  .group { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .group .gl { font-size: .92rem; }
  .seg { display: inline-flex; flex-wrap: wrap; border: 1.5px solid var(--border); border-radius: 6px; overflow: hidden; background: #fff; }
  .seg button { padding: 7px 14px; border: 0; background: transparent; color: var(--ink); font-size: .95rem; }
  .seg button[aria-pressed="true"] { background: var(--accent); color: #fff; }
  .seg button + button { border-left: 1.5px solid var(--border); }
  .seg button.soft { color: var(--warn); }
  .seg button.soft[aria-pressed="true"] { background: var(--warn); color: #fff; }

  .site-footer { border-top: 1px solid var(--rule); }
  .site-footer .wrap { padding-block: 16px 22px; font-size: 11px; color: #bbb; }

  .addbtn {
    width: 100%; height: 44px; font-weight: 600; color: var(--accent);
    background: #fff; border: 1.5px solid var(--border); border-radius: 8px;
  }
  .addbtn:hover { border-color: var(--accent); }
  .addbtn[aria-pressed="true"] { background: var(--tint); border-color: var(--accent); }

  /* The sheet view: big page previews on the left, the list of covers with their sizes on the right */
  .sheet-empty { color: var(--muted); margin: 0; }
  .sheet-top { display: flex; align-items: center; gap: 12px 24px; flex-wrap: wrap; margin-bottom: 20px; }
  .sheet-top .txt { flex: 1 1 260px; color: var(--muted); }
  .sheet-top .txt strong { color: var(--accent-dark); font-weight: 600; }
  .sheet-top .txt .warn { color: var(--warn); }
  .sheet-top .printbtn { height: 48px; }
  .sheet-grid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(280px, 340px); gap: 28px; align-items: start; }
  @media (max-width: 820px) { .sheet-grid { grid-template-columns: minmax(0, 1fr); } }
  .sheet-pages { display: flex; flex-wrap: wrap; gap: 24px; min-width: 0; }
  .page-fig { margin: 0; }
  .page-fig figcaption { font-size: 10px; font-weight: 600; letter-spacing: 0.14em; text-transform: uppercase; color: var(--accent); margin-top: 6px; }
  .big-page { position: relative; background: #fff; border: 1.5px solid var(--border); border-radius: 2px; }
  .page-inner { position: absolute; }
  .gcell { position: absolute; border: 1px dashed var(--border); border-radius: 2px; }
  .pcover { position: absolute; cursor: grab; touch-action: none; user-select: none; }
  .pcover img { display: block; width: 100%; height: 100%; border: 1px solid rgba(45,26,74,.18); pointer-events: none; }
  .pcover .num, .srow .num {
    font-size: 12px; font-weight: 600; color: var(--accent-dark);
    min-width: 22px; height: 22px; display: inline-grid; place-items: center;
    background: #fff; border: 1.5px solid var(--border); border-radius: 4px;
  }
  .pcover .num { position: absolute; left: 4px; top: 4px; }
  .pcover:hover img { outline: 2px solid var(--accent); }
  .pcover.is-soft img { outline: 2px solid #e8a04a; }
  .pcover.is-over img { outline: 3px solid var(--accent); outline-offset: 2px; }
  .pcover.is-dragging { opacity: .3; }
  .ghost { position: fixed !important; z-index: 50; pointer-events: none; opacity: .85; margin: 0; }
  .srow.ghost { background: #fff; border: 1.5px solid var(--accent); border-radius: 8px; padding-inline: 8px; }
  body.dragging, body.dragging * { cursor: grabbing !important; user-select: none; }
  .gcell.is-over { border: 2px solid var(--accent); background: var(--tint); }
  .srow { cursor: grab; touch-action: none; }
  .srow.is-over { background: var(--tint); outline: 2px solid var(--accent); outline-offset: -2px; }
  .srow.is-dragging { opacity: .35; }
  .sheet-list { list-style: none; margin: 0; padding: 0; }
  .srow { display: grid; grid-template-columns: auto 40px minmax(0, 1fr); gap: 4px 12px; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--rule); }
  .srow .sthumb { width: 40px; height: 58px; object-fit: cover; border: 1px solid rgba(45,26,74,.18); }
  .srow .sinfo { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
  .srow .stitle { font-family: Georgia, 'Times New Roman', serif; color: var(--accent-dark); overflow-wrap: anywhere; }
  .srow .sizes { align-self: flex-start; }
  .srow .sizes button { padding: 5px 10px; font-size: .9rem; }
  .srow .sacts { grid-column: 3; display: flex; gap: 10px; align-items: center; }
  .iconbtn { width: 30px; height: 28px; padding: 0; color: var(--accent); background: #fff; border: 1.5px solid var(--border); border-radius: 6px; }
  .iconbtn:disabled { opacity: .35; cursor: default; }
  .sheet-side .below { margin-top: 14px; }

  /* Print: only the pages. Every size and position is set in mm from script. */
  #printSheet { display: none; }
  @media print {
    body { background: #fff; padding: 0 !important; }
    .site-header, main, .site-footer { display: none !important; }
    #printSheet { display: block; }
    .sheet-page { position: relative; overflow: hidden; break-after: page; }
    .sheet-page:last-child { break-after: auto; }
    #printSheet img { position: absolute; display: block; max-width: none; }
  }
</style>
</head>
<body>
<header class="site-header">
  <div class="wrap">
    <a class="logo" href="/">
      <img src="/geocornsmall.png" alt="unisam logo">
      <span>
        <span class="logo__name">unisam.nz</span>
        <span class="logo__tagline">Classroom tools</span>
      </span>
    </a>
    <a class="back" href="/tools">&larr; All tools</a>
  </div>
</header>

<main class="wrap">
  <span class="page-label">Tools</span>
  <div>
    <h1 class="page-title">Covers</h1>
    <p class="page-intro">Start typing the book. Pick it from the list. Print.</p>
  </div>

  <div class="bar">
    <nav class="tabs" role="tablist">
      <button type="button" role="tab" data-view="find" aria-selected="true">Find covers</button>
      <button type="button" role="tab" data-view="sheet" aria-selected="false">Sheet <span id="sheetCount"></span></button>
    </nav>
    <div class="group paper">
      <span class="gl">Paper</span>
      <span class="seg" id="paperSeg">
        <button type="button" data-v="A4" aria-pressed="true">A4</button>
        <button type="button" data-v="Letter" aria-pressed="false">Letter</button>
      </span>
    </div>
  </div>

  <section id="findView" class="view">
    <form class="search" id="searchForm" autocomplete="off">
      <div class="combo">
        <input id="q" type="text" role="combobox" aria-autocomplete="list" aria-expanded="false" aria-controls="sug"
               placeholder="Book title, and author if you know it" aria-label="Book title" autofocus
               autocapitalize="off" autocorrect="off" spellcheck="false">
        <ul class="sug" id="sug" role="listbox" hidden></ul>
      </div>
      <button type="submit">Find</button>
    </form>

    <div id="status" class="status" role="status" aria-live="polite"></div>
    <div id="results"></div>
  </section>

  <section id="sheetView" class="view" hidden>
    <p id="sheetEmpty" class="sheet-empty">Nothing on the sheet yet. Find a book and press <strong>Add to sheet</strong> under a cover.</p>
    <div id="sheetBody" hidden>
      <div class="sheet-top">
        <div class="txt" id="sheetTxt" role="status" aria-live="polite"></div>
        <div class="group">
          <span class="gl">Pages</span>
          <span class="seg" id="orientSeg">
            <button type="button" data-v="auto" aria-pressed="true">Auto</button>
            <button type="button" data-v="portrait" aria-pressed="false">Portrait</button>
            <button type="button" data-v="landscape" aria-pressed="false">Landscape</button>
          </span>
        </div>
        <button type="button" class="printbtn" id="sheetPrint">Print</button>
      </div>
      <div class="sheet-grid">
        <div class="sheet-pages" id="sheetPages" aria-label="Page preview. Drag a cover onto another to swap them, or onto an empty slot to move it there."></div>
        <div class="sheet-side">
          <ol class="sheet-list" id="sheetList"></ol>
          <div class="below">
            <button type="button" class="linkbtn" id="sheetTidy" hidden>Tidy up (auto arrange)</button>
            <button type="button" class="linkbtn" id="sheetBack">Find more covers</button>
            <button type="button" class="linkbtn" id="sheetClear">Clear the sheet</button>
          </div>
        </div>
      </div>
    </div>
  </section>
</main>

<footer class="site-footer">
  <div class="wrap">Built by Sam G &middot; all vibe coded &middot; found a problem? tell Sam.</div>
</footer>


<div id="printSheet"></div>
<style id="pageRule"></style>

<script>
(function () {
  var $ = function (s) { return document.querySelector(s); };
  var PAPER = { A4: [210, 297], Letter: [215.9, 279.4] };
  var MARGIN = 8;                       // mm margin on every side
  var GAP = 4;                          // mm between covers sharing a page
  var SIZES = [1, 2, 4, 8];             // full, half, quarter, eighth of a page
  var FRAC = { 1: '1/1', 2: '1/2', 4: '1/4', 8: '1/8' };
  var CAP_NAME = { 1: 'full page', 2: 'half page', 4: 'quarter page', 8: 'eighth page' };
  var EXAMPLES = ['The Kite Runner', 'Things Fall Apart', 'Animal Farm', 'The Hunger Games'];

  var settings = { paper: 'A4', orient: 'auto' };
  try {
    var saved = JSON.parse(localStorage.getItem('doorcover') || '{}');
    if (PAPER[saved.paper]) settings.paper = saved.paper;
    if (['auto', 'portrait', 'landscape'].indexOf(saved.orient) > -1) settings.orient = saved.orient;
  } catch (e) {}

  // Covers collected to print together, in order: { url, w, h, alt, title, size }, kept between visits.
  var sheet = [];
  try {
    sheet = (JSON.parse(localStorage.getItem('doorcover-sheet') || '[]') || []).filter(function (s) {
      return s && typeof s.url === 'string' && s.w > 0 && s.h > 0;
    });
  } catch (e) { sheet = []; }

  var matches = [];        // suggestions for the current query
  var suggestQ = '';       // the query those suggestions belong to
  var loading = false;
  var hi = -1;             // highlighted suggestion
  var shown = null;        // the book whose covers are on screen
  var runId = 0;
  var timer = null;
  var qualityEls = [];

  /* ---------- helpers ---------- */
  function norm(s) {
    return (s || '').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '')
      .replace(/[^\p{L}\p{N} ]/gu, ' ').replace(/\s+/g, ' ').trim();
  }
  function sameTitle(a, b) {
    if (!a || !b) return false;
    return a === b || a.indexOf(b + ' ') === 0 || b.indexOf(a + ' ') === 0;
  }
  function sameAuthor(a, b) {
    var x = norm(a), y = norm(b);
    if (!x || !y) return true;
    if (x.indexOf(y) > -1 || y.indexOf(x) > -1) return true;
    return x.split(' ').pop() === y.split(' ').pop();
  }
  function el(tag, cls, text) {
    var n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text != null) n.textContent = text;
    return n;
  }
  function setStatus(t) { $('#status').textContent = t || ''; }
  function olCover(id, size) { return 'https://covers.openlibrary.org/b/id/' + id + (size ? '-' + size : '') + '.jpg?default=false'; }
  // Smaller copy of a cover URL, for thumbnails and as a fallback if the big one fails.
  function smaller(url, size) {
    if (url.indexOf('covers.openlibrary.org') > -1) return url.replace(/(\/b\/id\/\d+)(-[SML])?\.jpg/, '$1-' + size + '.jpg');
    if (url.indexOf('mzstatic.com') > -1) return url.replace(/\/\d+x\d+bb\.jpg$/, size === 'M' ? '/200x200bb.jpg' : '/600x600bb.jpg');
    return '';
  }

  /* ---------- data sources ---------- */
  function searchOL(q) {
    var url = 'https://openlibrary.org/search.json?limit=14&fields=key,title,author_name,cover_i,first_publish_year,edition_count&q=' + encodeURIComponent(q);
    return fetch(url).then(function (r) {
      if (!r.ok) throw new Error('openlibrary ' + r.status);
      return r.json();
    }).then(function (j) {
      return (j.docs || []).filter(function (d) { return d.cover_i; }).map(function (d, i) {
        return {
          source: 'Open Library', key: d.key, title: d.title || '',
          author: (d.author_name || [])[0] || '', year: d.first_publish_year || '',
          ec: d.edition_count || 0, idx: i,
          url: olCover(d.cover_i), coverId: d.cover_i
        };
      });
    });
  }

  function gbImage(links) {
    var u = links.extraLarge || links.large || links.medium || links.thumbnail || links.smallThumbnail;
    if (!u) return '';
    u = u.replace(/^http:/, 'https:').replace(/&edge=curl/g, '');
    if (/zoom=\d/.test(u)) u = u.replace(/zoom=\d/, 'zoom=0'); else u += '&zoom=0';
    return u;
  }
  function searchGB(q) {
    var url = 'https://www.googleapis.com/books/v1/volumes?maxResults=12&printType=books&q=' + encodeURIComponent(q);
    return fetch(url).then(function (r) {
      if (!r.ok) throw new Error('google ' + r.status);
      return r.json();
    }).then(function (j) {
      return (j.items || []).filter(function (i) {
        return i.volumeInfo && i.volumeInfo.imageLinks;
      }).map(function (i, n) {
        var v = i.volumeInfo;
        return {
          source: 'Google Books', title: v.title || '',
          author: (v.authors || [])[0] || '', year: (v.publishedDate || '').slice(0, 4),
          ec: 0, idx: n, url: gbImage(v.imageLinks)
        };
      }).filter(function (c) { return c.url; });
    });
  }

  // Apple Books: publisher artwork, usually 1500px+ tall.
  function searchApple(q) {
    var url = 'https://itunes.apple.com/search?media=ebook&entity=ebook&limit=20&term=' + encodeURIComponent(q);
    return fetch(url).then(function (r) {
      if (!r.ok) throw new Error('apple ' + r.status);
      return r.json();
    }).then(function (j) {
      return (j.results || []).filter(function (r) { return r.artworkUrl100; }).map(function (r, n) {
        return {
          source: 'Apple Books', title: r.trackName || '',
          author: r.artistName || '', year: (r.releaseDate || '').slice(0, 4),
          ec: 0, idx: n, url: r.artworkUrl100.replace(/\/\d+x\d+bb\.(jpg|png)$/, '/2400x2400bb.jpg')
        };
      });
    });
  }

  // Books whose title contains every word typed come first; within that, the most widely published first.
  function rank(list, q) {
    var qt = norm(q).split(' ').filter(Boolean);
    function tier(c) {
      var h = ' ' + norm(c.title) + ' ';
      return qt.every(function (t) { return h.indexOf(t) > -1; }) ? 0 : 1;
    }
    return list.slice().sort(function (a, b) {
      return (tier(a) - tier(b)) || (b.ec - a.ec) || (a.idx - b.idx);
    });
  }

  function buildMatches(list, fromGB) {
    var out = [];
    list.forEach(function (b) {
      if (out.length >= 8) return;
      var nt = norm(b.title), na = norm(b.author);
      var dup = out.some(function (o) {
        return (o.na === na || !o.na || !na) && sameTitle(o.nt, nt);
      });
      if (dup) return;
      out.push({ nt: nt, na: na, title: b.title, author: b.author, year: b.year, key: b.key || '',
                 coverId: b.coverId || 0, fromGB: !!fromGB, pool: [b], altsState: '', showMore: false });
    });
    if (fromGB) {
      out.forEach(function (m) {
        list.forEach(function (c) {
          if (c !== m.pool[0] && sameTitle(norm(c.title), m.nt) && sameAuthor(c.author, m.author)) m.pool.push(c);
        });
        m.altsState = 'done';
      });
    }
    return out;
  }

  // Looks up more covers for one chosen book: Google Books, and other Open Library editions.
  function loadAlts(m) {
    if (m.altsState) return;
    m.altsState = 'loading';
    var gbP = searchGB('intitle:' + m.title + (m.author ? ' inauthor:' + m.author : '')).catch(function () { return []; });
    var edP = (m.key && m.key.indexOf('/works/') === 0)
      ? fetch('https://openlibrary.org' + m.key + '/editions.json?limit=60')
          .then(function (r) { return r.ok ? r.json() : { entries: [] }; })
          .then(function (j) {
            var ids = [];
            (j.entries || []).forEach(function (e) {
              var id = (e.covers || []).filter(function (c) { return c > 0; })[0];
              if (id && id !== m.coverId && ids.indexOf(id) < 0) ids.push(id);
            });
            return ids;
          }).catch(function () { return []; })
      : Promise.resolve([]);
    var apP = searchApple(m.title + (m.author ? ' ' + m.author : '')).catch(function () { return []; });
    Promise.all([gbP, edP, apP]).then(function (r) {
      var seen = {};
      m.pool.forEach(function (c) { seen[c.url] = 1; });
      function add(c) { if (!seen[c.url]) { seen[c.url] = 1; m.pool.push(c); } }
      var apple = r[2].filter(function (a) {
        return !seen[a.url] && sameTitle(norm(a.title), m.nt) && sameAuthor(a.author, m.author);
      }).slice(0, 4);
      apple.forEach(function (a) { seen[a.url] = 1; });
      m.pool.splice.apply(m.pool, [1, 0].concat(apple));
      r[0].forEach(function (g) {
        if (sameTitle(norm(g.title), m.nt) && sameAuthor(g.author, m.author)) add(g);
      });
      r[1].forEach(function (id) {
        add({ source: 'Open Library', title: m.title, author: m.author, url: olCover(id) });
      });
      m.altsState = 'done';
      if (shown === m) renderCovers(m);
    });
  }

  /* ---------- suggestions ---------- */
  function isConfident(q) {
    if (matches.length <= 1) return true;
    var qt = norm(q).split(' ').filter(Boolean);
    function covers(m) {
      var h = ' ' + norm(m.title + ' ' + m.author) + ' ';
      return qt.every(function (t) { return h.indexOf(t) > -1; });
    }
    if (!covers(matches[0])) return false;
    return !matches.slice(1).some(covers);
  }

  function suggest(q, enter) {
    q = q.trim();
    var myRun = ++runId;
    if (q.length < 2) {
      hideSug(); matches = []; suggestQ = ''; loading = false;
      if (!shown) showIdle();
      return;
    }
    loading = true;
    if ($('#sug').hidden) showNote('Searching...');
    function fallback() {
      return searchGB(q).catch(function () { return []; }).then(function (gb) {
        if (gb.length) return buildMatches(gb, true);
        return searchApple(q).then(function (ap) { return buildMatches(ap, true); });
      });
    }
    searchOL(q).then(function (ol) {
      if (ol.length) return buildMatches(rank(ol, q), false);
      return fallback();
    }, fallback)
    .then(function (m) {
      if (myRun !== runId) return;
      loading = false; matches = m; suggestQ = q; hi = -1;
      if (enter) { applyEnter(q); return; }
      showSug();
    }, function () {
      if (myRun !== runId) return;
      loading = false; matches = []; suggestQ = '';
      showNote('Could not reach the book databases. Check the internet connection.');
    });
  }

  function showNote(text) {
    var ul = $('#sug');
    ul.textContent = '';
    ul.appendChild(el('li', 'note', text));
    ul.hidden = false;
    $('#q').setAttribute('aria-expanded', 'true');
  }
  function hideSug() {
    $('#sug').hidden = true;
    $('#q').setAttribute('aria-expanded', 'false');
    $('#q').removeAttribute('aria-activedescendant');
  }

  function showSug() {
    var ul = $('#sug');
    ul.textContent = '';
    if (!matches.length) { showNote('No matching books. Try adding the author, or check the spelling.'); return; }
    matches.forEach(function (m, i) {
      var li = el('li');
      li.id = 'opt' + i;
      li.setAttribute('role', 'option');
      li.setAttribute('aria-selected', 'false');
      var th = el('span', 'thumb');
      var im = new Image();
      im.alt = ''; im.loading = 'lazy';
      im.onerror = function () { im.remove(); };
      im.src = smaller(m.pool[0].url, 'M') || m.pool[0].url;
      th.appendChild(im);
      var info = el('span', 'info');
      info.appendChild(el('span', 't', m.title));
      var by = m.author || 'Author unknown';
      if (m.year) by += ', first published ' + m.year;
      info.appendChild(el('span', 'a', by));
      li.appendChild(th); li.appendChild(info);
      li.addEventListener('mousedown', function (e) { e.preventDefault(); });
      li.addEventListener('click', function () { choose(i); });
      ul.appendChild(li);
    });
    ul.hidden = false;
    $('#q').setAttribute('aria-expanded', 'true');
    setHi(hi);
  }

  function setHi(i) {
    hi = i;
    var items = $('#sug').querySelectorAll('[role="option"]');
    Array.prototype.forEach.call(items, function (n, k) {
      n.setAttribute('aria-selected', String(k === hi));
      if (k === hi) { n.scrollIntoView({ block: 'nearest' }); $('#q').setAttribute('aria-activedescendant', n.id); }
    });
    if (hi < 0) $('#q').removeAttribute('aria-activedescendant');
  }

  function applyEnter(q) {
    if (!matches.length) { showSug(); return; }
    if (hi >= 0) { choose(hi); return; }
    if (isConfident(q)) { choose(0); return; }
    showSug();
    setHi(0);
    setStatus('Several books match. Pick the right one.');
  }

  function choose(i) {
    var m = matches[i];
    if (!m) return;
    hideSug();
    setStatus('');
    $('#q').value = m.title;
    shown = m;
    renderCovers(m);
    loadAlts(m);
    $('#q').blur();
  }

  /* ---------- rendering ---------- */
  function showIdle() {
    shown = null;
    qualityEls = [];
    var res = $('#results');
    res.textContent = '';
    var wrap = el('div', 'chips');
    wrap.appendChild(el('span', 'label', 'Try one:'));
    EXAMPLES.forEach(function (t, i) {
      if (i) wrap.appendChild(el('span', 'dot', '\u00b7'));
      var b = el('button', 'chip', t);
      b.type = 'button';
      b.addEventListener('click', function () {
        $('#q').value = t;
        suggest(t, true);
      });
      wrap.appendChild(b);
    });
    res.appendChild(wrap);
    setStatus('');
  }

  /* ---------- arranging covers on pages ----------
     A page is a grid of eighths: 4 x 2 cells on a landscape page, 2 x 4 on a portrait one.
     Each size is a block of those cells, so mixed sizes snap together. Covers are never rotated. */
  var GRID = {
    landscape: { cols: 4, rows: 2, blk: { 1: [4, 2], 2: [2, 2], 4: [2, 1], 8: [1, 1] } },
    portrait:  { cols: 2, rows: 4, blk: { 1: [2, 4], 2: [2, 2], 4: [1, 2], 8: [1, 1] } }
  };
  function itemOf(img, title) {
    return { url: img.src, w: img.naturalWidth, h: img.naturalHeight, alt: img.alt, title: title || img.alt };
  }
  function ratioOf(it) { return it.w / it.h; }
  // Printable area in mm (1mm spare in height so a page never spills onto a second).
  function pageBox(orient) {
    var d = PAPER[settings.paper], w = d[0] - 2 * MARGIN, h = d[1] - 2 * MARGIN;
    return orient === 'landscape' ? { w: h, h: w - 1 } : { w: w, h: h - 1 };
  }
  function cellSize(orient) {
    var b = pageBox(orient), g = GRID[orient];
    return { w: (b.w - (g.cols - 1) * GAP) / g.cols, h: (b.h - (g.rows - 1) * GAP) / g.rows };
  }
  // The block a size takes up, in mm, at grid position (x, y).
  function blockBox(orient, size, x, y) {
    var cs = cellSize(orient), b = GRID[orient].blk[size];
    return {
      left: x * (cs.w + GAP), top: y * (cs.h + GAP),
      w: b[0] * cs.w + (b[0] - 1) * GAP, h: b[1] * cs.h + (b[1] - 1) * GAP
    };
  }
  // The cover scaled to fit a box and centred in it.
  function fitIn(it, box) {
    var r = ratioOf(it), w = Math.min(box.w, box.h * r), h = w / r;
    return { left: box.left + (box.w - w) / 2, top: box.top + (box.h - h) / 2, w: w, h: h };
  }
  function dpiOf(it, fit) { return it.w / (fit.w / 25.4); }
  // Which way round a page suits one cover of this size best.
  function bestOrient(it, size) {
    var p = fitIn(it, blockBox('portrait', size, 0, 0)).w;
    var l = fitIn(it, blockBox('landscape', size, 0, 0)).w;
    return l > p + 0.01 ? 'landscape' : 'portrait';
  }
  function dpiAtSize(it, size) { return dpiOf(it, fitIn(it, blockBox(bestOrient(it, size), size, 0, 0))); }
  // Auto: the largest size that prints sharp, else the largest that prints well, else an eighth.
  function autoSize(it) {
    var t, i;
    for (t = 0; t < 2; t++) for (i = 0; i < SIZES.length; i++) {
      if (dpiAtSize(it, SIZES[i]) >= [150, 100][t]) return SIZES[i];
    }
    return 8;
  }

  // Covers dragged into a slot are pinned there ({ orient, page, x, y }) and placed first.
  // Then the rest fill pages in sheet order: each goes in the first free spot that holds its block,
  // on the earliest page with room, scanning left to right, top to bottom. Empty pages are dropped.
  function pack(items, orient) {
    var g = GRID[orient], pages = [];
    function fits(used, x, y, b) {
      if (x < 0 || y < 0 || x + b[0] > g.cols || y + b[1] > g.rows) return false;
      for (var j = y; j < y + b[1]; j++) for (var i = x; i < x + b[0]; i++) if (used[j][i]) return false;
      return true;
    }
    function page(n) {
      while (pages.length <= n) {
        var used = [];
        for (var r = 0; r < g.rows; r++) { used.push([]); for (var c = 0; c < g.cols; c++) used[r].push(false); }
        pages.push({ used: used, spots: [] });
      }
      return pages[n];
    }
    function take(p, x, y, b, it, idx) {
      var pg = page(p);
      for (var j = y; j < y + b[1]; j++) for (var i = x; i < x + b[0]; i++) pg.used[j][i] = true;
      var fit = fitIn(it, blockBox(orient, it.size, x, y));
      pg.spots.push({ item: it, idx: idx, fit: fit, dpi: dpiOf(it, fit), page: p, x: x, y: y, bw: b[0], bh: b[1] });
    }
    var loose = [];
    items.forEach(function (it, idx) {
      var b = g.blk[it.size], pin = it.pin;
      if (pin && pin.orient === orient && pin.page < 50 && fits(page(pin.page).used, pin.x, pin.y, b)) take(pin.page, pin.x, pin.y, b, it, idx);
      else loose.push(idx);
    });
    loose.forEach(function (idx) {
      var it = items[idx], b = g.blk[it.size];
      for (var p = 0; ; p++) {
        for (var y = 0; y < g.rows; y++) for (var x = 0; x < g.cols; x++) {
          if (fits(page(p).used, x, y, b)) { take(p, x, y, b, it, idx); return; }
        }
      }
    });
    pages = pages.filter(function (p) { return p.spots.length; });
    var area = 0;
    pages.forEach(function (p, n) {
      p.spots.forEach(function (s) { s.page = n; area += s.fit.w * s.fit.h; });
      p.spots.sort(function (a, b) { return a.idx - b.idx; });
    });
    return { orient: orient, pages: pages, area: area };
  }
  function pinOrient() {
    for (var i = 0; i < sheet.length; i++) if (sheet[i].pin) return sheet[i].pin.orient;
    return '';
  }
  // Every page the same way round. Auto keeps the way pinned covers were placed,
  // otherwise picks fewer pages, then bigger covers.
  function arrange(items) {
    if (settings.orient !== 'auto') return pack(items, settings.orient);
    var po = items === sheet && pinOrient();
    if (po) return pack(items, po);
    var p = pack(items, 'portrait'), l = pack(items, 'landscape');
    if (l.pages.length !== p.pages.length) return l.pages.length < p.pages.length ? l : p;
    return l.area > p.area * 1.02 ? l : p;
  }

  function qualityWord(dpi) { return dpi >= 150 ? 'sharp' : (dpi >= 100 ? 'good quality' : 'a little soft'); }
  function quality(it, node) {
    var sharp = 0, good = 0;
    SIZES.forEach(function (s) {
      var d = dpiAtSize(it, s);
      if (!sharp && d >= 150) sharp = s;
      if (!good && d >= 100) good = s;
    });
    node.className = 'q ' + (good ? 'good' : 'warn');
    if (sharp === 1) node.textContent = 'Sharp at every size';
    else if (sharp) node.textContent = 'Sharp up to ' + FRAC[sharp] + ' page' + (good === 1 ? ', fine at full page' : '');
    else if (good) node.textContent = 'Good quality up to ' + FRAC[good] + ' page';
    else node.textContent = 'Low resolution: prints a little soft at any size';
  }
  function markSoft(btn, it, size) {
    var soft = dpiAtSize(it, size) < 100;
    btn.classList.toggle('soft', soft);
    btn.title = soft ? 'Prints a little soft at this size' : '';
  }

  function makeCard(m, c, n) {
    var card = el('div', 'card');
    var stage = el('div', 'stage');
    var img = new Image();
    img.alt = 'Cover of ' + m.title + ', option ' + n;
    var meta = el('div', 'meta');
    var row = el('div', 'row');
    row.appendChild(el('span', 'opt', 'Option ' + n));
    row.appendChild(el('span', 'src', c.source));
    var q = el('div', 'q', 'Checking size...');
    var prow = el('div', 'printrow');
    prow.appendChild(el('span', 'pl', 'Print'));
    var fracs = SIZES.map(function (s) {
      var b = el('button', 'fracbtn', FRAC[s]);
      b.type = 'button';
      b.disabled = true;
      b.setAttribute('aria-label', 'Print at ' + CAP_NAME[s]);
      b.addEventListener('click', function () { if (img.naturalWidth) printOne(itemOf(img, m.title), s); });
      prow.appendChild(b);
      return b;
    });
    var add = el('button', 'addbtn', 'Add to sheet');
    add.type = 'button';
    add.disabled = true;
    meta.appendChild(row); meta.appendChild(q); meta.appendChild(prow); meta.appendChild(add);
    img.onload = function () {
      if (img.naturalWidth < 60) { card.remove(); checkEmpty(); return; }   // placeholder image
      stage.textContent = '';
      stage.appendChild(img);
      var it = itemOf(img, m.title);
      quality(it, q);
      qualityEls.push({ img: img, node: q, fracs: fracs });
      fracs.forEach(function (b, i) { b.disabled = false; markSoft(b, it, SIZES[i]); });
      add.disabled = false;
      add.setAttribute('data-url', img.src);
      syncAddButtons();
    };
    var fallbackUrl = smaller(c.url, 'L');
    img.onerror = function () {
      if (fallbackUrl && img.src !== fallbackUrl) { img.src = fallbackUrl; return; }
      card.remove(); checkEmpty();
    };
    stage.textContent = 'Loading cover...';
    img.src = c.url;
    add.addEventListener('click', function () { if (img.naturalWidth) toggleSheet(itemOf(img, m.title)); });
    card.appendChild(stage); card.appendChild(meta);
    return card;
  }
  function refreshQuality() {
    qualityEls.forEach(function (x) {
      var it = itemOf(x.img);
      quality(it, x.node);
      x.fracs.forEach(function (b, i) { markSoft(b, it, SIZES[i]); });
    });
  }

  function renderCovers(m) {
    var res = $('#results');
    res.textContent = '';
    qualityEls = [];

    var head = el('div', 'book-head');
    head.appendChild(el('h2', 'book-title', m.title));
    var by = m.author || '';
    if (m.year) by += (by ? ', ' : '') + m.year;
    if (by) head.appendChild(el('div', 'book-by', by));
    res.appendChild(head);

    var grid = el('div', 'covers');
    var firstTwo = m.pool.slice(0, 2);
    firstTwo.forEach(function (c, i) { grid.appendChild(makeCard(m, c, i + 1)); });
    if (firstTwo.length < 2 && m.altsState === 'loading') {
      var wait = el('div', 'card');
      wait.appendChild(el('div', 'stage', 'Looking for another cover...'));
      grid.appendChild(wait);
    }
    res.appendChild(grid);

    if (m.showMore && m.pool.length > 2) {
      var more = el('div', 'covers more');
      m.pool.slice(2, 10).forEach(function (c, i) { more.appendChild(makeCard(m, c, i + 3)); });
      res.appendChild(more);
    }

    var below = el('div', 'below');
    if (!m.showMore && m.altsState === 'done' && m.pool.length > 2) {
      var mb = el('button', 'morebtn', 'More covers (' + (Math.min(m.pool.length, 10) - 2) + ')');
      mb.type = 'button';
      mb.addEventListener('click', function () { m.showMore = true; renderCovers(m); });
      below.appendChild(mb);
    }
    if (matches.length > 1) {
      var lb = el('button', 'linkbtn', 'Not this book? See the other matches');
      lb.type = 'button';
      lb.addEventListener('click', function () {
        window.scrollTo(0, 0);
        $('#q').focus();
        hi = -1;
        showSug();
      });
      below.appendChild(lb);
    }
    if (below.children.length) res.appendChild(below);
  }

  function checkEmpty() {
    var g = document.querySelector('.covers');
    if (g && !g.children.length && shown && shown.altsState === 'done') {
      setStatus('That book has no usable cover image. Try another match, or add the author to your search.');
    }
  }

  /* ---------- the sheet ---------- */
  function sheetIndex(url) {
    for (var i = 0; i < sheet.length; i++) if (sheet[i].url === url) return i;
    return -1;
  }
  function saveSheet() {
    try { localStorage.setItem('doorcover-sheet', JSON.stringify(sheet)); } catch (e) {}
  }
  function toggleSheet(it) {
    var i = sheetIndex(it.url);
    if (i > -1) sheet.splice(i, 1);
    else { it.size = autoSize(it); sheet.push(it); }
    saveSheet();
    renderSheet();
  }
  function syncAddButtons() {
    Array.prototype.forEach.call(document.querySelectorAll('.addbtn[data-url]'), function (b) {
      var on = sheetIndex(b.getAttribute('data-url')) > -1;
      b.setAttribute('aria-pressed', String(on));
      b.textContent = on ? 'On the sheet ✓ (tap to remove)' : 'Add to sheet';
    });
  }
  function plural(n, word) { return n + ' ' + word + (n === 1 ? '' : 's'); }
  var shownLayout = null;   // the arrangement currently in the preview
  function moveTo(from, to) {
    if (from === to || to < 0 || to >= sheet.length) return;
    var a = sheet[from], b = sheet[to];
    var pa = a.pin, pb = b.pin;
    // Pinned covers trade slots; a loose one takes the other's place in the order.
    if (pa || pb) {
      var spots = {};
      shownLayout.pages.forEach(function (pg) { pg.spots.forEach(function (sp) { spots[sp.idx] = sp; }); });
      var o = shownLayout.orient, sa = spots[from], sb = spots[to];
      a.pin = sb ? { orient: o, page: sb.page, x: sb.x, y: sb.y } : pb;
      b.pin = sa ? { orient: o, page: sa.page, x: sa.x, y: sa.y } : pa;
    }
    sheet[from] = b; sheet[to] = a;
    saveSheet();
    renderSheet();
  }
  function tidy() {
    sheet.forEach(function (it) { delete it.pin; });
    saveSheet();
    renderSheet();
  }

  function renderSheet() {
    syncAddButtons();
    $('#sheetCount').textContent = sheet.length ? '(' + sheet.length + ')' : '';
    var has = sheet.length > 0;
    $('#sheetEmpty').hidden = has;
    $('#sheetBody').hidden = !has;
    if (!has) return;

    var L = arrange(sheet);
    shownLayout = L;
    var box = pageBox(L.orient), cs = cellSize(L.orient), g = GRID[L.orient];
    var wrap = $('#sheetPages');
    // Preview scale: pages as large as the column allows, two across when landscape fits.
    var avail = Math.max(240, wrap.clientWidth || 600);
    var pageW = box.w + 2 * MARGIN;
    var s = Math.min(avail, L.orient === 'landscape' ? 640 : 460) / pageW;
    wrap.textContent = '';
    var soft = 0;
    L.pages.forEach(function (p, pi) {
      var fig = el('figure', 'page-fig');
      var pg = el('div', 'big-page');
      pg.style.width = (pageW * s) + 'px';
      pg.style.height = ((box.h + 1 + 2 * MARGIN) * s) + 'px';
      var inner = el('div', 'page-inner');
      inner.style.left = inner.style.top = (MARGIN * s) + 'px';
      inner.style.width = (box.w * s) + 'px';
      inner.style.height = (box.h * s) + 'px';
      // Faint eighth-page cells, so the snapping is visible.
      for (var y = 0; y < g.rows; y++) for (var x = 0; x < g.cols; x++) {
        var c = el('div', 'gcell');
        c.setAttribute('data-page', pi);
        c.setAttribute('data-x', x);
        c.setAttribute('data-y', y);
        c.style.left = (x * (cs.w + GAP) * s) + 'px';
        c.style.top = (y * (cs.h + GAP) * s) + 'px';
        c.style.width = (cs.w * s) + 'px';
        c.style.height = (cs.h * s) + 'px';
        inner.appendChild(c);
      }
      p.spots.forEach(function (sp) {
        var it = sp.item, f = sp.fit;
        var holder = el('div', 'pcover');
        holder.setAttribute('data-idx', sp.idx);
        holder.style.left = (f.left * s) + 'px';
        holder.style.top = (f.top * s) + 'px';
        holder.style.width = (f.w * s) + 'px';
        holder.style.height = (f.h * s) + 'px';
        var im = new Image();
        im.src = smaller(it.url, 'L') || it.url;
        im.alt = it.alt;
        im.draggable = false;
        holder.appendChild(im);
        holder.appendChild(el('span', 'num', String(sp.idx + 1)));
        if (sp.dpi < 100) { holder.classList.add('is-soft'); soft++; }
        holder.title = 'Drag onto another cover to swap, or onto an empty slot to move it';
        inner.appendChild(holder);
      });
      pg.appendChild(inner);
      fig.appendChild(pg);
      fig.appendChild(el('figcaption', '', 'Page ' + (pi + 1)));
      wrap.appendChild(fig);
    });

    // The list: one row per cover, with its size and position controls.
    var list = $('#sheetList');
    list.textContent = '';
    sheet.forEach(function (it, i) {
      var li = el('li', 'srow');
      li.setAttribute('data-idx', i);
      li.appendChild(el('span', 'num', String(i + 1)));
      var th = new Image();
      th.className = 'sthumb';
      th.src = smaller(it.url, 'M') || it.url;
      th.alt = '';
      li.appendChild(th);
      var info = el('div', 'sinfo');
      info.appendChild(el('span', 'stitle', it.title || it.alt));
      var seg = el('span', 'seg sizes');
      seg.setAttribute('role', 'group');
      seg.setAttribute('aria-label', 'Size');
      SIZES.forEach(function (sz) {
        var b = el('button', '', FRAC[sz]);
        b.type = 'button';
        b.setAttribute('aria-pressed', String(it.size === sz));
        b.setAttribute('aria-label', CAP_NAME[sz]);
        markSoft(b, it, sz);
        b.addEventListener('click', function () { it.size = sz; delete it.pin; saveSheet(); renderSheet(); });
        seg.appendChild(b);
      });
      info.appendChild(seg);
      li.appendChild(info);
      var acts = el('div', 'sacts');
      [['↑', 'Move up', -1], ['↓', 'Move down', 1]].forEach(function (a) {
        var b = el('button', 'iconbtn', a[0]);
        b.type = 'button';
        b.setAttribute('aria-label', a[1]);
        b.disabled = i + a[2] < 0 || i + a[2] >= sheet.length;
        b.addEventListener('click', function () { moveTo(i, i + a[2]); });
        acts.appendChild(b);
      });
      var rm = el('button', 'linkbtn', 'Remove');
      rm.type = 'button';
      rm.addEventListener('click', function () { sheet.splice(i, 1); saveSheet(); renderSheet(); });
      acts.appendChild(rm);
      li.appendChild(acts);
      list.appendChild(li);
    });

    var txt = $('#sheetTxt');
    txt.textContent = '';
    txt.appendChild(el('strong', '', plural(sheet.length, 'cover')));
    txt.appendChild(document.createTextNode(' on ' + plural(L.pages.length, 'page') + ', ' + L.orient + '. Drag covers to rearrange them.'));
    if (soft) txt.appendChild(el('span', 'warn', ' ' + plural(soft, 'cover') + ' will print a little soft (outlined in orange).'));
    $('#sheetTidy').hidden = !sheet.some(function (it) { return it.pin; });
    $('#sheetPrint').textContent = 'Print ' + plural(L.pages.length, 'page');
  }

  /* ---------- dragging ----------
     Pick up a cover in the preview, or a row in the list, and drop it:
     on another cover to swap them, on an empty slot to move it there (as near as the sizes allow),
     or on a row in the list to move it to that place in the order. Pointer events, so touch works too. */
  function spotAt(page, x, y) {
    var hit = null;
    shownLayout.pages[page].spots.forEach(function (sp) {
      if (x >= sp.x && x < sp.x + sp.bw && y >= sp.y && y < sp.y + sp.bh) hit = sp;
    });
    return hit;
  }
  // Pins cover `from` to grid cell (x, y) of page `page`, nudged back if its block would hang off the page.
  // Covers it lands on are unpinned and flow around it.
  function moveToCell(from, page, x, y) {
    var o = shownLayout.orient, g = GRID[o], it = sheet[from], b = g.blk[it.size];
    x = Math.min(x, g.cols - b[0]); y = Math.min(y, g.rows - b[1]);
    // Other pinned covers keep the slot they are shown in (page numbers may have shifted).
    shownLayout.pages.forEach(function (pg) {
      pg.spots.forEach(function (sp) {
        if (sp.idx !== from && sheet[sp.idx].pin) sheet[sp.idx].pin = { orient: o, page: sp.page, x: sp.x, y: sp.y };
      });
    });
    shownLayout.pages[page].spots.forEach(function (sp) {
      if (sp.idx !== from && sp.x < x + b[0] && x < sp.x + sp.bw && sp.y < y + b[1] && y < sp.y + sp.bh) delete sheet[sp.idx].pin;
    });
    it.pin = { orient: o, page: page, x: x, y: y };
    saveSheet();
    renderSheet();
  }
  function moveInList(from, to) {
    if (from === to) return;
    var it = sheet.splice(from, 1)[0];
    sheet.splice(to, 0, it);
    saveSheet();
    renderSheet();
  }

  (function () {
    var drag = null;
    // What is under the pointer: { kind: 'cover'|'cell'|'row', idx, node, page, x, y }
    function targetAt(px, py) {
      var n = document.elementFromPoint(px, py);
      if (!n) return null;
      var c = n.closest('#sheetPages .pcover');
      if (c) return { kind: 'cover', idx: +c.getAttribute('data-idx'), node: c };
      var g = n.closest('#sheetPages .gcell');
      if (g) {
        var p = +g.getAttribute('data-page'), x = +g.getAttribute('data-x'), y = +g.getAttribute('data-y');
        var sp = spotAt(p, x, y);
        if (sp) return { kind: 'cover', idx: sp.idx, node: document.querySelector('#sheetPages .pcover[data-idx="' + sp.idx + '"]') };
        return { kind: 'cell', node: g, page: p, x: x, y: y };
      }
      var r = n.closest('#sheetList .srow');
      if (r) return { kind: 'row', idx: +r.getAttribute('data-idx'), node: r };
      return null;
    }
    function clearOver() {
      Array.prototype.forEach.call(document.querySelectorAll('.is-over'), function (n) { n.classList.remove('is-over'); });
    }
    function start(e, node, from) {
      if (e.button > 0) return;
      e.preventDefault();
      drag = { from: from, src: node, x: e.clientX, y: e.clientY, ghost: null };
    }
    $('#sheetPages').addEventListener('pointerdown', function (e) {
      var h = e.target.closest('.pcover');
      if (h) start(e, h, +h.getAttribute('data-idx'));
    });
    $('#sheetList').addEventListener('pointerdown', function (e) {
      if (e.target.closest('button')) return;
      var r = e.target.closest('.srow');
      if (r) start(e, r, +r.getAttribute('data-idx'));
    });
    // Scrolls the window while a drag is held near the top or bottom edge, so later pages can be reached.
    function autoScroll() {
      if (!drag || !drag.ghost) return;
      var edge = 70, y = drag.cy, v = 0;
      if (y < edge) v = -Math.ceil((edge - y) / 4);
      else if (y > innerHeight - edge) v = Math.ceil((y - (innerHeight - edge)) / 4);
      if (v) { window.scrollBy(0, v); hover(drag.cx, drag.cy); }
      requestAnimationFrame(autoScroll);
    }
    function hover(px, py) {
      var t = targetAt(px, py);
      clearOver();
      if (t && !(t.idx === drag.from && t.kind !== 'cell') && t.node) t.node.classList.add('is-over');
    }
    window.addEventListener('pointermove', function (e) {
      if (!drag) return;
      drag.cx = e.clientX; drag.cy = e.clientY;
      if (!drag.ghost) {
        if (Math.abs(e.clientX - drag.x) + Math.abs(e.clientY - drag.y) < 5) return;
        var r = drag.src.getBoundingClientRect();
        drag.ghost = drag.src.cloneNode(true);
        drag.ghost.classList.add('ghost');
        drag.ghost.style.width = r.width + 'px';
        drag.ghost.style.height = r.height + 'px';
        drag.dx = drag.x - r.left; drag.dy = drag.y - r.top;
        document.body.appendChild(drag.ghost);
        drag.src.classList.add('is-dragging');
        document.body.classList.add('dragging');
        requestAnimationFrame(autoScroll);
      }
      drag.ghost.style.left = (e.clientX - drag.dx) + 'px';
      drag.ghost.style.top = (e.clientY - drag.dy) + 'px';
      hover(e.clientX, e.clientY);
    });
    function end(e) {
      if (!drag) return;
      var d = drag;
      drag = null;
      clearOver();
      document.body.classList.remove('dragging');
      if (!d.ghost) return;
      d.ghost.remove();
      d.src.classList.remove('is-dragging');
      var t = e.type === 'pointerup' ? targetAt(e.clientX, e.clientY) : null;
      if (!t) return;
      if (t.kind === 'cover') moveTo(d.from, t.idx);
      else if (t.kind === 'cell') moveToCell(d.from, t.page, t.x, t.y);
      else if (t.kind === 'row') moveInList(d.from, t.idx);
    }
    window.addEventListener('pointerup', end);
    window.addEventListener('pointercancel', end);
  })();

  /* ---------- views ---------- */
  function showView(v) {
    $('#findView').hidden = v !== 'find';
    $('#sheetView').hidden = v !== 'sheet';
    Array.prototype.forEach.call(document.querySelectorAll('.tabs [data-view]'), function (b) {
      b.setAttribute('aria-selected', String(b.getAttribute('data-view') === v));
    });
    if (v === 'sheet') renderSheet();
  }

  /* ---------- printing ---------- */
  // pages: [{ spots: [{ item, fit }] }], all the same orientation.
  function printPages(pages, orient) {
    var box = pageBox(orient);
    $('#pageRule').textContent = '@page { size: ' + settings.paper + ' ' + orient + '; margin: ' + MARGIN + 'mm; }';
    var out = $('#printSheet');
    out.textContent = '';
    var imgs = [];
    pages.forEach(function (p) {
      var pg = el('div', 'sheet-page');
      pg.style.width = box.w.toFixed(2) + 'mm';
      pg.style.height = box.h.toFixed(2) + 'mm';
      p.spots.forEach(function (sp) {
        var f = sp.fit, im = new Image();
        im.style.left = f.left.toFixed(2) + 'mm';
        im.style.top = f.top.toFixed(2) + 'mm';
        im.style.width = f.w.toFixed(2) + 'mm';
        im.style.height = f.h.toFixed(2) + 'mm';
        im.alt = sp.item.alt;
        im.src = sp.item.url;
        pg.appendChild(im);
        imgs.push(im);
      });
      out.appendChild(pg);
    });
    Promise.all(imgs.map(function (im) {
      return im.decode ? im.decode().catch(function () {}) : Promise.resolve();
    })).then(function () { setTimeout(function () { window.print(); }, 50); });
  }
  // One cover at a chosen size, centred on a page turned whichever way suits it.
  function printOne(it, size) {
    var o = bestOrient(it, size), box = pageBox(o);
    var b = blockBox(o, size, 0, 0);
    b.left = (box.w - b.w) / 2; b.top = (box.h - b.h) / 2;
    printPages([{ spots: [{ item: it, fit: fitIn(it, b) }] }], o);
  }
  function printSheet() {
    if (!sheet.length) return;
    var L = arrange(sheet);
    printPages(L.pages, L.orient);
  }

  /* ---------- controls ---------- */
  function syncSeg(id, value) {
    Array.prototype.forEach.call($(id).querySelectorAll('button'), function (b) {
      b.setAttribute('aria-pressed', String(b.getAttribute('data-v') === value));
    });
  }
  function bindSeg(id, key) {
    $(id).addEventListener('click', function (e) {
      var b = e.target.closest('button');
      if (!b) return;
      settings[key] = b.getAttribute('data-v');
      syncSeg(id, settings[key]);
      try { localStorage.setItem('doorcover', JSON.stringify(settings)); } catch (err) {}
      refreshQuality();
      renderSheet();
    });
  }
  syncSeg('#paperSeg', settings.paper);
  syncSeg('#orientSeg', settings.orient);
  bindSeg('#paperSeg', 'paper');
  bindSeg('#orientSeg', 'orient');
  sheet.forEach(function (it) { if (SIZES.indexOf(it.size) < 0) it.size = autoSize(it); });
  $('#sheetPrint').addEventListener('click', printSheet);
  $('#sheetClear').addEventListener('click', function () { sheet = []; saveSheet(); renderSheet(); });
  $('#sheetBack').addEventListener('click', function () { showView('find'); });
  $('#sheetTidy').addEventListener('click', tidy);
  document.querySelector('.tabs').addEventListener('click', function (e) {
    var b = e.target.closest('[data-view]');
    if (b) showView(b.getAttribute('data-view'));
  });
  var resizeT = null;
  window.addEventListener('resize', function () {
    clearTimeout(resizeT);
    resizeT = setTimeout(function () { if (!$('#sheetView').hidden) renderSheet(); }, 150);
  });
  renderSheet();

  var input = $('#q');
  input.addEventListener('input', function () {
    clearTimeout(timer);
    hi = -1;
    var v = input.value;
    setStatus('');
    timer = setTimeout(function () { suggest(v, false); }, 250);
  });
  input.addEventListener('focus', function () {
    if (matches.length && input.value.trim() === suggestQ && !shown) showSug();
  });
  input.addEventListener('keydown', function (e) {
    var open = !$('#sug').hidden && matches.length;
    if (e.key === 'ArrowDown') {
      e.preventDefault();
      if (!open && matches.length) { showSug(); setHi(0); }
      else if (open) setHi(Math.min(hi + 1, matches.length - 1));
    } else if (e.key === 'ArrowUp') {
      if (open) { e.preventDefault(); setHi(Math.max(hi - 1, -1)); }
    } else if (e.key === 'Escape') {
      hideSug();
    }
  });
  document.addEventListener('click', function (e) {
    if (!e.target.closest('.combo')) hideSug();
  });
  $('#searchForm').addEventListener('submit', function (e) {
    e.preventDefault();
    clearTimeout(timer);
    var v = input.value.trim();
    if (!$('#sug').hidden && hi >= 0 && matches[hi]) { choose(hi); return; }
    if (!loading && v === suggestQ && matches.length) applyEnter(v);
    else suggest(v, true);
  });

  showIdle();
})();
</script>
</body>
</html>
