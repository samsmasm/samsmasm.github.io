<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Spin unrelated words and build a business case out of what lands.">
<title>Newbiz</title>
<link rel="icon" type="image/jpeg" href="/unisamicon.jpg">
<style>
  /* newbiz — bare spinner. No site chrome by request.
     Each reel is a real 3D drum: cells sit on the surface of a cylinder, so
     perspective does the work a flat scrolling strip never can.

     Layering matters here. `filter` and `mask` are grouping properties: they
     force transform-style:flat on the element that carries them. So the blur
     and the fade live on .veil, and .drum (a child) opens its own 3D context
     with perspective() inside its own transform. Putting the filter on .drum
     collapses the cylinder into flipped 2D. */

  * { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --item: clamp(58px, 9.5vh, 104px);
    --con-item: clamp(34px, 5.2vh, 56px);
    --paper: #fdfdfe;
    --ghost: #c3c7d4;
  }

  html, body { height: 100%; }

  body {
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    gap: clamp(14px, 3.4vh, 40px);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    color: #1b1b22;
    background:
      radial-gradient(ellipse 62% 52% at 14% 18%, #fdeff7 0%, transparent 62%),
      radial-gradient(ellipse 58% 46% at 86% 24%, #ecf3ff 0%, transparent 62%),
      radial-gradient(ellipse 54% 44% at 50% 88%, #edfff5 0%, transparent 62%),
      radial-gradient(ellipse 40% 34% at 74% 74%, #fffaea 0%, transparent 62%),
      var(--paper);
    overflow: hidden;
    cursor: pointer;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
  }

  /* ── Stage ────────────────────────────────────────────────────────── */

  .stage { position: relative; display: flex; justify-content: center; width: 100%; }

  /* Hairlines mark the landing slot. No boxes — the curve is the frame. */
  .stage::before, .stage::after {
    content: ''; position: absolute; left: 0; right: 0; height: 1px; z-index: 4;
    pointer-events: none;
    background: linear-gradient(90deg, transparent, rgba(120,128,150,0.22) 16%,
      rgba(120,128,150,0.22) 84%, transparent);
  }
  .stage::before { top: calc(50% - var(--item) / 2); }
  .stage::after  { top: calc(50% + var(--item) / 2); }

  .reels {
    display: flex; align-items: center; justify-content: center;
    width: min(96vw, 1280px);
    gap: clamp(8px, 3vw, 56px);
  }

  /* max-width keeps two reels as a pair rather than flinging them to the
     far edges of a wide screen. */
  .reel {
    position: relative; flex: 1 1 0; min-width: 0; max-width: 400px;
    height: calc(var(--item) * 3.7);
  }

  /* Carries the blur and the soft top/bottom fade. Masking beats clipping:
     no hard edge, and it fades over the page wash rather than painting a
     solid rectangle on top of it. */
  .veil {
    position: absolute; inset: 0;
    -webkit-mask-image: linear-gradient(180deg, transparent 2%, #000 27%, #000 73%, transparent 98%);
            mask-image: linear-gradient(180deg, transparent 2%, #000 27%, #000 73%, transparent 98%);
    -webkit-mask-repeat: no-repeat; mask-repeat: no-repeat;
    -webkit-mask-size: 100% 100%; mask-size: 100% 100%;
    will-change: filter;
  }

  .drum { position: absolute; inset: 0; transform-style: preserve-3d; will-change: transform; }

  .cell {
    position: absolute; left: 0; right: 0; top: 50%;
    height: var(--item); margin-top: calc(var(--item) / -2);
    display: flex; align-items: center; justify-content: center;
    backface-visibility: hidden;
    font-family: Georgia, 'Times New Roman', serif;
    font-size: clamp(22px, 4vw, 54px);
    letter-spacing: -0.015em;
    white-space: nowrap;
  }

  /* Order must match placeCells(): rotateX, then translateZ. */
  .reel.is-settled .cell.is-front,
  .constraint.is-settled .cell.is-front {
    animation: land 700ms cubic-bezier(0.18, 1.6, 0.3, 1) both;
  }
  @keyframes land {
    0%   { transform: rotateX(var(--rx)) translateZ(var(--z)) scale(1.09); }
    100% { transform: rotateX(var(--rx)) translateZ(var(--z)) scale(1); }
  }

  /* ── Constraint ───────────────────────────────────────────────────── */

  /* display:none rather than opacity, so it reserves no space when off and
     the reels stay optically centred. */
  .constraint {
    display: none;
    position: relative;
    width: min(94vw, 900px);
    height: calc(var(--con-item) * 2.8);
  }
  .constraint.is-on { display: block; animation: rise 460ms ease both; }
  @keyframes rise {
    from { opacity: 0; transform: translateY(-6px); }
    to   { opacity: 1; transform: none; }
  }
  .constraint .cell {
    height: var(--con-item); margin-top: calc(var(--con-item) / -2);
    font-size: clamp(13px, 2.1vw, 25px);
    font-style: italic;
    color: #79809a;
  }

  /* ── Controls ─────────────────────────────────────────────────────── */

  /* Spin sits above its options, close to them, as one block. */
  .deck { display: flex; flex-direction: column; align-items: center; gap: 2px; }

  .controls {
    display: flex; align-items: center; gap: clamp(14px, 2.6vw, 30px);
    font-size: 11px; letter-spacing: 0.18em; text-transform: uppercase;
  }
  .controls button {
    font: inherit; letter-spacing: inherit; text-transform: inherit;
    background: none; border: none; padding: 6px 2px; cursor: pointer;
    color: var(--ghost); transition: color 200ms;
  }
  .controls button:hover { color: #6c7288; }
  .count { display: flex; gap: 12px; }
  .count button[aria-pressed="true"], #con-btn[aria-pressed="true"] { color: #4a5068; }

  /* Spin is the primary action, so it gets its own line above the options
     and enough size to read as the thing you press. */
  .spin {
    position: relative;
    font-family: inherit;
    font-size: clamp(15px, 1.9vw, 21px);
    font-weight: 500;
    letter-spacing: 0.42em;
    text-indent: 0.42em;          /* re-centre: tracking pads the right side */
    text-transform: uppercase;
    color: #2f3547;
    background: none; border: none; cursor: pointer;
    padding: 14px clamp(26px, 5vw, 52px);
    transition: color 200ms, transform 200ms;
  }
  .spin::after {
    content: ''; position: absolute; left: clamp(26px, 5vw, 52px); right: clamp(26px, 5vw, 52px);
    bottom: 8px; height: 1px; background: currentColor;
    transform: scaleX(0.2); transform-origin: 50%;
    transition: transform 340ms cubic-bezier(0.2, 0.9, 0.2, 1), opacity 200ms;
  }
  .spin:hover { color: #11141d; }
  .spin:hover::after { transform: scaleX(1); }
  .spin:active { transform: translateY(1px); }
  .spin:disabled { color: #c8ccd8; cursor: default; transform: none; }
  .spin:disabled::after { transform: scaleX(0.2); opacity: 0.4; }

  @media (max-width: 620px) {
    :root { --item: clamp(46px, 7.6vh, 70px); }
  }

  @media (prefers-reduced-motion: reduce) {
    .reel.is-settled .cell.is-front,
    .constraint.is-settled .cell.is-front { animation: none; }
  }
</style>
</head>
<body>

  <div class="stage"><div class="reels" id="reels"></div></div>

  <div class="constraint" id="constraint">
    <div class="veil"><div class="drum" id="con-drum"></div></div>
  </div>

  <div class="deck">
    <button type="button" class="spin" id="spin">Spin</button>
    <div class="controls" id="controls">
      <span class="count" id="count">
        <button type="button" data-count="2" aria-pressed="true">Two</button>
        <button type="button" data-count="3" aria-pressed="false">Three</button>
      </span>
      <button type="button" id="con-btn" aria-pressed="false">Constraint</button>
    </div>
  </div>

<script src="words.js"></script>
<script>
(() => {
  'use strict';

  const CELLS = 18, STEP = 360 / CELLS;
  const CON_CELLS = 14, CON_STEP = 360 / CON_CELLS;
  const DEPTH = 1500;               // perspective, in px

  const reelsEl = document.getElementById('reels');
  const spinBtn = document.getElementById('spin');
  const countEl = document.getElementById('count');
  const conBtn  = document.getElementById('con-btn');
  const conEl   = document.getElementById('constraint');
  const conDrum = document.getElementById('con-drum');

  const bucketKeys = Object.keys(BUCKETS);
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const rand = a => a[Math.floor(Math.random() * a.length)];
  const mod360 = d => ((d % 360) + 360) % 360;

  let count = 2, spinning = false;

  const reels = Array.from({ length: 3 }, () => ({
    bucket: null, word: null,
    el: null, veil: null, drum: null, cells: [], angle: 0, hue: Math.random() * 360
  }));
  const con = { el: conEl, veil: conEl.querySelector('.veil'), drum: conDrum, cells: [], angle: 0, text: null };

  /* ── Text fitting ────────────────────────────────────────────────────
     Words run from "bee" to "recycled plastic". Rather than clip the long
     ones, measure each once and shrink only what does not fit. Cached, so a
     relabel mid-spin costs nothing. */
  const gauge = document.createElement('canvas').getContext('2d');
  const fitCache = new Map();

  function fit(cell, text, box, base, family) {
    cell.textContent = text;
    if (!box || !base) return;
    const key = text + '|' + base + '|' + box;
    let px = fitCache.get(key);
    if (px === undefined) {
      gauge.font = `${base}px ${family}`;
      const w = gauge.measureText(text).width;
      const room = box * 0.94;
      px = w > room ? Math.max(11, base * room / w) : base;
      fitCache.set(key, px);
    }
    cell.style.fontSize = px === base ? '' : px.toFixed(1) + 'px';
  }

  /* Base font size and available width, read back from real layout.
     The front cell is pushed toward the camera by translateZ, so perspective
     scales it up by DEPTH/(DEPTH-r). Shrink the usable box by that factor or
     the longest words render wider than the reel and the mask clips them. */
  function metrics(cells, el, r) {
    const cs = getComputedStyle(cells[0]);
    const frontScale = DEPTH / (DEPTH - r);
    return {
      base: parseFloat(cs.fontSize),
      family: cs.fontFamily,
      box: el.clientWidth / frontScale
    };
  }

  /* ── Drum geometry ───────────────────────────────────────────────────
     Cells sit on a cylinder of radius R. For faces to meet edge to edge,
     R is half a cell height over tan(half the angular step).

     Note: measure a real cell rather than reading --item. An unregistered
     custom property computes to its raw token stream, so getPropertyValue
     hands back the literal "clamp(...)" text and parseFloat gives NaN. */
  const radius = (px, cells) => (px / 2) / Math.tan(Math.PI / cells);
  const cellPx = (cells, fb) => (cells[0] && cells[0].offsetHeight) || fb;
  const reelRadius = () => radius(cellPx(reels[0].cells, 90), CELLS);
  const conRadius  = () => radius(cellPx(con.cells, 46), CON_CELLS);

  function placeCells(cells, step, r) {
    cells.forEach((c, i) => {
      const rx = i * step;
      c.style.setProperty('--rx', rx + 'deg');
      c.style.setProperty('--z', r + 'px');
      c.style.transform = `rotateX(${rx}deg) translateZ(${r}px)`;
    });
  }

  const spin3d = (drum, a) => { drum.style.transform = `perspective(${DEPTH}px) rotateX(${a}deg)`; };

  function layout() {
    const r = reelRadius();
    for (let i = 0; i < count; i++) {
      placeCells(reels[i].cells, STEP, r);
      spin3d(reels[i].drum, reels[i].angle);
      refit(reels[i]);
    }
    placeCells(con.cells, CON_STEP, conRadius());
    spin3d(con.drum, con.angle);
  }

  function refit(r) {
    const m = metrics(r.cells, r.el, reelRadius());
    r.cells.forEach(c => fit(c, c.textContent, m.box, m.base, m.family));
  }

  /* ── Build ───────────────────────────────────────────────────────────── */

  function buildReel(r) {
    const el = document.createElement('div'); el.className = 'reel';
    const veil = document.createElement('div'); veil.className = 'veil';
    const drum = document.createElement('div'); drum.className = 'drum';

    r.cells = [];
    for (let i = 0; i < CELLS; i++) {
      const c = document.createElement('div'); c.className = 'cell';
      drum.appendChild(c); r.cells.push(c);
    }
    veil.appendChild(drum);
    el.appendChild(veil);
    r.el = el; r.veil = veil; r.drum = drum;

    // No handler here on purpose: clicks bubble to the body, which spins.
    // Every reel goes on every spin.
    return el;
  }

  function buildCon() {
    con.cells = []; conDrum.innerHTML = '';
    for (let i = 0; i < CON_CELLS; i++) {
      const c = document.createElement('div'); c.className = 'cell';
      conDrum.appendChild(c); con.cells.push(c);
    }
  }

  function buildAll() {
    reelsEl.innerHTML = '';
    for (let i = 0; i < count; i++) reelsEl.appendChild(buildReel(reels[i]));
    for (let i = 0; i < count; i++) dress(reels[i]);
    layout();
  }

  /* Each cell takes its own slice of the spectrum, so a spinning drum reads
     as a rainbow flowing past rather than a block of one colour. */
  function paint(r) {
    r.cells.forEach((c, i) => {
      c.style.color = `hsl(${mod360(r.hue + (i / CELLS) * 360)} 64% 51%)`;
    });
  }

  /* Fill a drum with words that are all different. Two cells showing the same
     word are visible at once (the drum only hides its far side), so plain
     random selection produces obvious twins. */
  function fillUnique(cells, first, pool) {
    const used = new Set([first]);
    cells.forEach((c, i) => {
      if (i === 0) { c.textContent = first; return; }
      let w; do { w = rand(pool); } while (used.has(w));
      used.add(w); c.textContent = w;
    });
    return used;
  }

  function dress(r) {
    fillUnique(r.cells, r.word, BUCKETS[r.bucket].words);
    r.cells.forEach(c => c.classList.remove('is-front'));
    r.cells[0].classList.add('is-front');
    paint(r);
    r.angle = 0;
    spin3d(r.drum, 0);
  }

  function dressCon(text) {
    fillUnique(con.cells, text, CONSTRAINTS);
    con.cells.forEach(c => c.classList.remove('is-front'));
    con.cells[0].classList.add('is-front');
    con.angle = 0;
    // Cells could not be measured while the block was display:none, so place
    // them now that it is visible.
    placeCells(con.cells, CON_STEP, conRadius());
    spin3d(con.drum, 0);
    const m = metrics(con.cells, con.el, conRadius());
    con.cells.forEach(c => fit(c, c.textContent, m.box, m.base, m.family));
  }

  /* ── Buckets: never two of the same category on screen ──────────────── */

  /* reassign=true  (a spin) deals fresh buckets to every reel.
     reassign=false (revealing a third reel) fills only the gaps, so a reel
     already showing a word keeps the category that word came from. */
  function assignBuckets(reassign) {
    const taken = new Set();
    if (!reassign) {
      for (let i = 0; i < count; i++) if (reels[i].bucket) taken.add(reels[i].bucket);
    }
    const pool = bucketKeys.filter(k => !taken.has(k));
    for (let i = pool.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [pool[i], pool[j]] = [pool[j], pool[i]];
    }
    let n = 0;
    for (let i = 0; i < count; i++) {
      if (!reassign && reels[i].bucket) continue;
      reels[i].bucket = pool[n++];
    }
  }

  function pickWord(bucket, avoid) {
    const pool = BUCKETS[bucket].words;
    let w; do { w = rand(pool); } while (w === avoid && pool.length > 1);
    return w;
  }

  /* ── Easing ──────────────────────────────────────────────────────────
     Quart ease-out for the body of the spin, a fast-decaying ripple so the
     drum rocks into place instead of stopping dead, and a small backward
     flick at the start for wind-up. */
  function ease(t) {
    const body   = 1 - Math.pow(1 - t, 4);
    const windup = t < 0.14 ? -Math.sin((t / 0.14) * Math.PI) * 0.015 : 0;
    return body + windup;   // must be exactly 1 at t=1
  }

  /* The settle rides on top, in degrees rather than as a fraction of the
     spin, so the rock is the same size however far the drum travelled. One
     smooth excursion past the stop and back: zero at both ends, so it cannot
     move where the drum finally lands. */
  const OVERSHOOT = 6, SETTLE_FROM = 0.78;
  function settleDeg(t) {
    if (t < SETTLE_FROM) return 0;
    return OVERSHOOT * Math.sin(Math.PI * (t - SETTLE_FROM) / (1 - SETTLE_FROM));
  }

  /* ── The spin ────────────────────────────────────────────────────────── */

  function launch(o) {
    const { target, veil, drum, cells, step, n, angle, turns, duration, r, pick, fitOpts, onEnd } = o;

    // Everything currently on the drum, so recycling never creates a twin.
    const used = new Set(cells.map(c => c.textContent));
    const swap = (cell, text) => {
      used.delete(cell.textContent);
      used.add(text);
      fit(cell, text, fitOpts.box, fitOpts.base, fitOpts.family);
    };

    // Which cell to stop on. The caller supplies it when it wants to control
    // the landing colour; otherwise pick freely.
    const k = o.landOn != null ? o.landOn : Math.floor(Math.random() * n);
    cells.forEach(c => c.classList.remove('is-front'));
    swap(cells[k], target);
    cells[k].classList.add('is-front');

    /* The whole-number rotations MUST be a whole number. `total` has to be
       congruent to (angle - want) modulo 360, or the animation finishes a
       fraction of a turn away from the cell it is aiming at and the final
       snap to `want` visibly jumps the drum by several words. */
    const want = -k * step;
    const spins = Math.max(2, Math.round(turns));
    const total = spins * 360 + mod360(angle - want);

    if (reduce) { spin3d(drum, want); onEnd(mod360(want)); return; }

    const dirty = new Set();
    const t0 = performance.now();
    let prev = 0;

    requestAnimationFrame(function frame(now) {
      const t = Math.min(1, (now - t0) / duration);
      const p = ease(t);
      const a = angle - total * p - settleDeg(t);
      spin3d(drum, a);

      // Blur tracks real surface speed, so it builds and bleeds off naturally.
      const px = (Math.abs(p - prev) * total * Math.PI / 180) * r;
      prev = p;
      veil.style.filter = px > 0.7 ? `blur(${Math.min(px * 0.4, 12).toFixed(2)}px)` : '';

      // Cells on the far side are invisible, so recycle them into new words.
      if (t < 0.8) {
        for (let i = 0; i < n; i++) {
          if (i === k) continue;
          const world = mod360(i * step + a);
          if (world > 106 && world < 254) {
            if (!dirty.has(i)) {
              dirty.add(i);
              let w; do { w = pick(); } while (used.has(w));
              swap(cells[i], w);
            }
          } else dirty.delete(i);
        }
      }

      if (t < 1) requestAnimationFrame(frame);
      else { veil.style.filter = ''; spin3d(drum, want); onEnd(mod360(want)); }
    });
  }

  function spin() {
    if (spinning) return;
    const live = reels.slice(0, count);
    const conOn = conBtn.getAttribute('aria-pressed') === 'true';

    spinning = true;
    spinBtn.disabled = true;
    live.forEach(r => r.el.classList.remove('is-settled'));
    conEl.classList.remove('is-settled');

    assignBuckets(true);
    const r18 = reelRadius();
    let pending = 0, order = 0;
    const done = () => { if (--pending === 0) { spinning = false; spinBtn.disabled = false; } };

    /* Spread the landing colours around the wheel rather than leaving them to
       chance, or three reels can all come up much the same purple. Each drum
       still carries the full spectrum; this only fixes where each one stops
       relative to the others. */
    const baseHue = Math.random() * 360;

    live.forEach(r => {
      pending++;
      const word = pickWord(r.bucket, r.word);

      // Choose the stopping cell first, then set the drum's hue offset so that
      // this cell lands on the colour this reel has been allotted.
      const landOn = Math.floor(Math.random() * CELLS);
      r.hue = mod360(baseHue + order * (360 / live.length) - (landOn / CELLS) * 360);
      paint(r);

      launch({
        target: word, veil: r.veil, drum: r.drum, cells: r.cells,
        step: STEP, n: CELLS, angle: r.angle, r: r18, landOn,
        turns: 5 + order * 1.1 + Math.random() * 0.7,
        duration: 2600 + order * 640,
        pick: () => rand(BUCKETS[r.bucket].words),
        fitOpts: metrics(r.cells, r.el, r18),
        onEnd: a => { r.angle = a; r.word = word; r.el.classList.add('is-settled'); done(); }
      });
      order++;
    });

    if (conOn) {
      pending++;
      let text; do { text = rand(CONSTRAINTS); } while (text === con.text && CONSTRAINTS.length > 1);
      launch({
        target: text, veil: con.veil, drum: con.drum, cells: con.cells,
        step: CON_STEP, n: CON_CELLS, angle: con.angle, r: conRadius(),
        turns: 5 + order * 1.1 + Math.random() * 0.7,
        duration: 2600 + order * 640,
        pick: () => rand(CONSTRAINTS),
        fitOpts: metrics(con.cells, con.el, conRadius()),
        onEnd: a => { con.angle = a; con.text = text; conEl.classList.add('is-settled'); done(); }
      });
    }

    if (pending === 0) { spinning = false; spinBtn.disabled = false; }
  }

  /* ── Controls ────────────────────────────────────────────────────────── */

  countEl.addEventListener('click', e => {
    const b = e.target.closest('button');
    if (!b || spinning) return;
    e.stopPropagation();
    const n = Number(b.dataset.count);
    if (n === count) return;
    count = n;
    [...countEl.children].forEach(x =>
      x.setAttribute('aria-pressed', String(Number(x.dataset.count) === count)));
    assignBuckets(false);
    for (let i = 0; i < count; i++) if (!reels[i].word) reels[i].word = pickWord(reels[i].bucket, null);
    buildAll();
  });

  conBtn.addEventListener('click', e => {
    e.stopPropagation();
    const on = conBtn.getAttribute('aria-pressed') !== 'true';
    conBtn.setAttribute('aria-pressed', String(on));
    conEl.classList.toggle('is-on', on);
    if (on && !con.text) { con.text = rand(CONSTRAINTS); dressCon(con.text); }
  });

  spinBtn.addEventListener('click', e => { e.stopPropagation(); spin(); });

  // The whole page is the lever.
  document.body.addEventListener('click', spin);
  addEventListener('keydown', e => {
    if (e.code !== 'Space' && e.code !== 'Enter') return;
    if (document.activeElement && document.activeElement.tagName === 'BUTTON') return;
    e.preventDefault(); spin();
  });

  let rt;
  addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(() => { fitCache.clear(); layout(); }, 120); });

  /* ── Boot ────────────────────────────────────────────────────────────── */

  assignBuckets(false);
  for (let i = 0; i < count; i++) reels[i].word = pickWord(reels[i].bucket, null);
  buildCon();
  buildAll();
})();
</script>
</body>
</html>
