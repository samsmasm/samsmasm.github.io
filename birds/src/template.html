<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Birds of a Feather</title>
<meta name="description" content="A classroom puzzle: sixteen cards hide four groups. Sets for IB Business Management, IB Economics and young kids.">
<link rel="icon" href="/geocornsmall.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Fraunces:opsz,wght@9..144,500;9..144,700&display=swap" rel="stylesheet">
<style>
/* Plan: warm paper, navy ink (unisam Option B colours), and the four tier colours as the one loud element.
   Tiers run amber, coral, teal, navy, so the hardest group is the darkest.
   Layout: one column of big, projector-friendly cards; controls above and below. */
:root {
  --bg: #f7f6f2;
  --surface: #fffdf8;
  --ink: #1e2a4a;
  --muted: #5b6680;
  --line: #e3e0d8;
  --accent: #1e2a4a;
  --accent-ink: #ffffff;
  --focus: #f4a629;
  --t1: #f4a629;
  --t2: #e8836b;
  --t3: #3fb0a3;
  --t4: #1e2a4a;
  --on-group: #1e2a4a;
  --on-t4: #ffffff;
  --card-line: #c4c6d0; /* darker than --line so unrevealed cards still show on a projector */
  --sel: #dde4f3;
  --display: "Fraunces", Georgia, serif;
  --body: "Atkinson Hyperlegible", -apple-system, "Segoe UI", sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #141c33; --surface: #1e2a4a; --ink: #f2efe6; --muted: #a9b3cc; --line: #37446b;
    --accent: #f4a629; --accent-ink: #141c33;
    --t4: #e9e4d6; --on-group: #141c33; --on-t4: #141c33; --card-line: #4a5880; --sel: #3a4b7a;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #141c33; --surface: #1e2a4a; --ink: #f2efe6; --muted: #a9b3cc; --line: #37446b;
  --accent: #f4a629; --accent-ink: #141c33;
  --t4: #e9e4d6; --on-group: #141c33; --on-t4: #141c33; --card-line: #4a5880; --sel: #3a4b7a;
  color-scheme: dark;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: var(--body);
  font-size: 17px;
  line-height: 1.45;
  min-height: 100%;
}
.app { max-width: 1240px; margin: 0 auto; padding: 20px 16px 40px; }

/* The four-stripe motif */
.stripes { display: flex; gap: 6px; }
.stripes i { display: block; height: 10px; flex: 1; border-radius: 3px; }
.stripes i:nth-child(1) { background: var(--t1); }
.stripes i:nth-child(2) { background: var(--t2); }
.stripes i:nth-child(3) { background: var(--t3); }
.stripes i:nth-child(4) { background: var(--t4); }
.stripes.small { width: 88px; }
.stripes.small i { height: 8px; }

/* Menu */
.masthead { background: #1e2a4a; border-bottom: 4px solid #f4a629; color: #fff; }
.masthead-in { max-width: 1240px; margin: 0 auto; padding: 12px 16px; display: flex; align-items: center; gap: 14px; }
.masthead img { width: 48px; height: 48px; display: block; }
.masthead h1 { font-family: var(--display); font-weight: 700; font-size: clamp(24px, 3.4vw, 34px); line-height: 1.1; margin: 0; flex: 1; }
.masthead a { color: #fff; }
.lead { font-size: clamp(18px, 2.2vw, 22px); max-width: 52ch; color: var(--muted); margin: 18px 0 32px; }
.choices { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 16px; max-width: 880px; }
.choice {
  text-align: left; font: inherit; color: inherit; cursor: pointer;
  background: var(--surface);
  border: 1px solid var(--card-line);
  border-radius: 12px;
  padding: 22px 22px 20px;
  display: flex; flex-direction: column; gap: 8px;
  transition: border-color .15s ease;
}
.choice:hover { border-color: var(--ink); }
.choice-title { font-family: var(--display); font-weight: 700; font-size: clamp(26px, 3.4vw, 34px); line-height: 1.05; }
.choice-desc { color: var(--muted); }
.choice-meta { font-size: 14px; font-weight: 700; letter-spacing: .02em; color: var(--ink); }
.choice .stripes { margin-top: 10px; }
.fine { color: var(--muted); font-size: 15px; margin-top: 32px; }
.foot { color: var(--muted); font-size: 13px; margin-top: 28px; padding-top: 10px; border-top: 1px solid var(--line); }

/* Game header */
.bar { display: flex; align-items: center; gap: 16px; margin-bottom: 14px; flex-wrap: wrap; }
.bar h2 { font-family: var(--display); font-weight: 700; font-size: clamp(24px, 3vw, 34px); margin: 0; flex: 1; line-height: 1.05; }

.btn {
  font: inherit; font-weight: 700; cursor: pointer;
  background: var(--surface); color: var(--ink);
  border: 1px solid var(--card-line); border-radius: 10px;
  padding: 10px 16px; min-height: 44px;
  transition: transform .12s ease, background .12s ease;
}
.btn:hover { transform: translateY(-1px); }
.btn:active { transform: translateY(1px); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.quiet { border-color: var(--line); }
.btn[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
.btn:disabled { opacity: .45; cursor: default; transform: none; }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 3px; }

/* Topics panel */
details#topics { background: var(--surface); border: 1.5px solid var(--line); border-radius: 12px; margin-bottom: 14px; }
details#topics summary {
  cursor: pointer; padding: 12px 16px; font-weight: 700; display: flex; gap: 12px; align-items: baseline; list-style: none;
}
details#topics summary::-webkit-details-marker { display: none; }
details#topics summary::before { content: "+"; font-weight: 700; width: 1ch; }
details#topics[open] summary::before { content: "\2212"; }
.count { color: var(--muted); font-weight: 600; font-size: 15px; }
#topicBody { padding: 4px 16px 16px; display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 18px 24px; }
.tgroup h3 { font-family: var(--display); font-size: 17px; margin: 0 0 6px; display: flex; gap: 8px; align-items: center; justify-content: space-between; }
.tgroup h3 span { flex: 1; }
.mini { font: inherit; font-size: 13px; font-weight: 700; background: none; border: 1.5px solid var(--line); border-radius: 6px; padding: 3px 8px; cursor: pointer; color: var(--ink); }
.titem { display: flex; gap: 10px; align-items: flex-start; padding: 5px 0; cursor: pointer; font-size: 16px; }
.titem input { width: 20px; height: 20px; margin: 2px 0 0; accent-color: var(--accent); flex: none; }

.opts { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-bottom: 14px; }
.opts .label { font-weight: 700; color: var(--muted); margin-right: 4px; }

.toolbar { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-bottom: 16px; }
#status { color: var(--muted); font-weight: 700; font-size: 20px; margin-left: 4px; }
#lives { display: flex; align-items: center; gap: 4px; margin-left: auto; font-weight: 700; }
#lives svg { width: 30px; height: 30px; fill: var(--t1); stroke: var(--ink); stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
#lives svg.gone { fill: none; stroke: var(--card-line); }

/* Board */
.board {
  --cols: 4;
  display: grid;
  grid-template-columns: repeat(var(--cols), minmax(0, 1fr));
  gap: 10px;
  user-select: none; -webkit-user-select: none;
}
.card {
  position: relative;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px;
  min-height: clamp(76px, 12.5vh, 132px);
  padding: 8px 10px;
  background: var(--surface);
  color: var(--ink);
  border: 1.5px solid var(--card-line);
  border-radius: 10px;
  font-family: var(--body);
  font-weight: 700;
  font-size: clamp(14px, 1.7vw + .3vh, 26px);
  line-height: 1.12;
  text-align: center;
  text-wrap: balance;
  overflow-wrap: anywhere;
  cursor: pointer;
  touch-action: manipulation;
  transition: transform .38s cubic-bezier(.2,.8,.2,1), background .3s ease, outline-color .1s;
  -webkit-tap-highlight-color: transparent;
}
.card .emoji { font-size: 1.9em; line-height: 1; font-family: system-ui, "Apple Color Emoji", "Segoe UI Emoji", "Noto Color Emoji", sans-serif; }
.kids .card { font-size: clamp(20px, 2.5vw + .4vh, 40px); min-height: clamp(84px, 13vh, 150px); }
.kids .card .emoji { font-size: 1.7em; }
.card.sel { background: var(--sel); outline: 4px solid var(--accent); outline-offset: 2px; transform: translateY(-3px); }
.card.no { animation: shake .4s ease; }
/* Found groups are shorter than live cards, so what is left stays on screen */
.card.rev { cursor: default; min-height: clamp(44px, 6vh, 64px); font-size: clamp(13px, 1.4vw, 20px); background: var(--c); color: var(--on-group); border-color: transparent; animation: rise .45s ease both; }
.kids .card.rev { flex-direction: row; gap: 8px; font-size: clamp(15px, 1.7vw, 24px); }
.kids .card.rev .emoji { font-size: 1.3em; }
.c-t1 { --c: var(--t1); } .c-t2 { --c: var(--t2); } .c-t3 { --c: var(--t3); } .c-t4 { --c: var(--t4); --on-group: var(--on-t4); }

.banner {
  grid-column: 1 / -1;
  display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap;
  background: var(--c); color: var(--on-group);
  border-radius: 10px;
  padding: 10px 16px;
  font-family: var(--display); font-weight: 700;
  font-size: clamp(18px, 2.2vw, 30px);
  margin-top: 6px;
  animation: rise .45s ease both;
}
.banner:first-child { margin-top: 0; }
.banner small { font-family: var(--body); font-weight: 700; font-size: 15px; opacity: .8; }
@keyframes rise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
@keyframes shake { 0%, 100% { translate: 0; } 25% { translate: -7px; } 50% { translate: 7px; } 75% { translate: -4px; } }

.msg { background: var(--surface); border: 1.5px solid var(--ink); border-radius: 10px; padding: 14px 16px; margin-top: 16px; font-weight: 600; }

@media (max-width: 560px) {
  body { font-size: 16px; }
  .board { gap: 6px; }
  .card { padding: 6px 4px; border-radius: 8px; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { transition: none !important; animation: none !important; }
}
</style>
</head>
<body>
<header class="masthead">
  <div class="masthead-in">
    <img src="/geocornsmall.png" alt="">
    <h1>Birds of a Feather</h1>
    <a href="/">unisam.nz</a>
  </div>
</header>
<div class="app">

  <section id="menu" class="screen">
    <p class="lead">Sixteen cards hide four groups. Pick four that belong together, then check. You have four lives.</p>
    <div class="choices">
      <button class="choice" id="pickBm" type="button">
        <span class="choice-title">Business Management</span>
        <span class="choice-desc">IB SL, Units 1 to 5, with a tick box for every topic.</span>
        <span class="choice-meta" id="bmCount"></span>
        <span class="stripes" aria-hidden="true"><i></i><i></i><i></i><i></i></span>
      </button>
      <button class="choice" id="pickEcon" type="button">
        <span class="choice-title">Economics</span>
        <span class="choice-desc">IB Economics, Units 1 to 4, with a tick box for every topic. HL-only topics start unticked.</span>
        <span class="choice-meta" id="econCount"></span>
        <span class="stripes" aria-hidden="true"><i></i><i></i><i></i><i></i></span>
      </button>
      <button class="choice" id="pickKids" type="button">
        <span class="choice-title">Kids</span>
        <span class="choice-desc">Ages 5 to 7. Every card has a picture, and words can be read aloud.</span>
        <span class="choice-meta" id="kidsCount"></span>
        <span class="stripes" aria-hidden="true"><i></i><i></i><i></i><i></i></span>
      </button>
    </div>
    <p class="fine">Puzzles are made in your browser. Nothing is saved or sent anywhere.</p>
    <p class="foot">Built by Sam G · all vibe coded · found a problem? tell Sam.</p>
  </section>

  <section id="game" class="screen" hidden>
    <header class="bar">
      <button id="backBtn" class="btn quiet" type="button">Menu</button>
      <h2 id="gameTitle"></h2>
      <div class="stripes small" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
    </header>

    <details id="topics">
      <summary><span id="topicLabel">Topics</span><span id="topicCount" class="count"></span></summary>
      <div id="topicBody"></div>
    </details>

    <div id="kidsOpts" class="opts" hidden>
      <button class="btn" id="readBtn" type="button" aria-pressed="false">Read aloud when tapped: off</button>
    </div>

    <div class="toolbar">
      <button id="checkBtn" class="btn primary" type="button">Check</button>
      <button id="clearBtn" class="btn" type="button">Clear</button>
      <button id="shuffleBtn" class="btn" type="button">Shuffle</button>
      <button id="newBtn" class="btn" type="button">New puzzle</button>
      <span id="status" role="status" aria-live="polite"></span>
      <span id="lives" role="img"></span>
    </div>

    <div id="board" class="board" aria-label="Puzzle cards"></div>
    <p id="msg" class="msg" hidden></p>
  </section>

</div>

<script>
const BANKS = { bm: __BM_JSON__, econ: __ECON_JSON__, kids: __KIDS_JSON__ };

/*LOGIC_START*/
function shuffle(a) {
  a = a.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function prepare(bank) {
  bank.categories.forEach(c => { c._lw = new Set(c.words.map(w => w.toLowerCase())); });
}

function eligibleFor(bank, ticked, per) {
  return bank.categories.filter(c => c.words.length >= per && c.topics.every(t => ticked.has(t)));
}

function compatible(c, chosen) {
  for (const o of chosen) {
    if (c.clashesWith.includes(o.id) || o.clashesWith.includes(c.id)) return false;
    for (const w of c._lw) if (o._lw.has(w)) return false;
  }
  return true;
}

function buildPuzzle(bank, ticked, cfg) {
  const eligible = eligibleFor(bank, ticked, cfg.per);
  if (eligible.length < cfg.tiers.length) return null;
  for (let attempt = 0; attempt < 400; attempt++) {
    const chosen = [];
    let ok = true;
    for (const tier of cfg.tiers) {
      const pool = shuffle(eligible.filter(c => !chosen.includes(c)))
        .sort((a, b) => Math.abs(a.tier - tier) - Math.abs(b.tier - tier));
      const pick = pool.find(c => compatible(c, chosen));
      if (!pick) { ok = false; break; }
      chosen.push(pick);
    }
    if (!ok) continue;
    return {
      groups: chosen.map((c, slot) => {
        const idx = shuffle(c.words.map((_, i) => i)).slice(0, cfg.per);
        return {
          slot,
          name: c.name,
          ref: c.ref || '',
          words: idx.map(i => ({ w: c.words[i], e: c.emoji ? (c.emoji[i] || '') : '' }))
        };
      })
    };
  }
  return null;
}

/* Card ids are "group-word". Returns the group index if every card is from one group, otherwise -1. */
function guessResult(ids) {
  const groups = new Set(ids.map(id => id.split('-')[0]));
  return groups.size === 1 ? Number([...groups][0]) : -1;
}
/*LOGIC_END*/

const $ = id => document.getElementById(id);
const COLORS = ['t1', 't2', 't3', 't4'];
const CFG = { n: 4, per: 4, tiers: [1, 2, 3, 4] };
const LIVES = 4;
const FEATHER = '<path d="M12.67 19a2 2 0 0 0 1.416-.588l6.154-6.172a6 6 0 0 0-8.49-8.49L5.586 9.914A2 2 0 0 0 5 11.328V18a1 1 0 0 0 1 1z"/><path d="M16 8 2 22"/><path d="M17.5 15H9"/>';
const UNIT_NAMES = {
  bm: {
    'Unit 1': 'Unit 1: Introduction to business management',
    'Unit 2': 'Unit 2: Human resource management',
    'Unit 3': 'Unit 3: Finance and accounts',
    'Unit 4': 'Unit 4: Marketing',
    'Unit 5': 'Unit 5: Operations management'
  },
  econ: {
    'Unit 1': 'Unit 1: Introduction to economics',
    'Unit 2': 'Unit 2: Microeconomics',
    'Unit 3': 'Unit 3: Macroeconomics',
    'Unit 4': 'Unit 4: The global economy'
  }
};
const TITLES = { bm: 'Business Management', econ: 'Economics', kids: 'Kids' };
const S = {
  screen: 'menu', set: null, read: false,
  ticked: { bm: new Set(), econ: new Set(), kids: new Set() },
  puzzle: null, order: [], revealed: [], selected: [], lives: LIVES, over: null, note: '', busy: false
};
const els = new Map();

prepare(BANKS.bm); prepare(BANKS.econ); prepare(BANKS.kids);

/* ---------- screens ---------- */
function showScreen(name) {
  S.screen = name;
  $('menu').hidden = name !== 'menu';
  $('game').hidden = name !== 'game';
  window.scrollTo(0, 0);
}

function openSet(set) {
  S.set = set;
  $('gameTitle').textContent = TITLES[set];
  $('topicLabel').textContent = set === 'kids' ? 'Themes' : 'Topics';
  $('kidsOpts').hidden = set !== 'kids';
  document.body.classList.toggle('kids', set === 'kids');
  syncKidsButtons();
  buildTopics();
  showScreen('game');
  newPuzzle();
}

/* ---------- topic tick boxes ---------- */
function buildTopics() {
  const bank = BANKS[S.set];
  const body = $('topicBody');
  body.innerHTML = '';
  const groups = [];
  bank.meta.topics.forEach(t => {
    let g = groups.find(x => x.name === t.group);
    if (!g) { g = { name: t.group, items: [] }; groups.push(g); }
    g.items.push(t);
  });
  groups.forEach(g => {
    const wrap = document.createElement('div');
    wrap.className = 'tgroup';
    const h = document.createElement('h3');
    const title = document.createElement('span');
    title.textContent = (UNIT_NAMES[S.set] || {})[g.name] || g.name;
    const all = document.createElement('button');
    all.type = 'button'; all.className = 'mini'; all.textContent = 'All';
    const none = document.createElement('button');
    none.type = 'button'; none.className = 'mini'; none.textContent = 'None';
    h.append(title, all, none);
    wrap.appendChild(h);
    g.items.forEach(t => {
      const lab = document.createElement('label');
      lab.className = 'titem';
      const cb = document.createElement('input');
      cb.type = 'checkbox';
      cb.id = 'topic-' + S.set + '-' + t.code.replace(/[^\w]/g, '_');
      cb.dataset.code = t.code;
      cb.checked = S.ticked[S.set].has(t.code);
      cb.addEventListener('change', () => {
        cb.checked ? S.ticked[S.set].add(t.code) : S.ticked[S.set].delete(t.code);
        updateTopicCount();
      });
      const txt = document.createElement('span');
      txt.textContent = /^\d/.test(t.code) ? t.code + ' ' + t.label : t.label;
      lab.append(cb, txt);
      wrap.appendChild(lab);
    });
    const setGroup = on => {
      wrap.querySelectorAll('input').forEach(cb => {
        cb.checked = on;
        on ? S.ticked[S.set].add(cb.dataset.code) : S.ticked[S.set].delete(cb.dataset.code);
      });
      updateTopicCount();
    };
    all.addEventListener('click', () => setGroup(true));
    none.addEventListener('click', () => setGroup(false));
    body.appendChild(wrap);
  });
  updateTopicCount();
}

function updateTopicCount() {
  const bank = BANKS[S.set];
  const total = bank.meta.topics.length;
  const on = bank.meta.topics.filter(t => S.ticked[S.set].has(t.code)).length;
  const avail = eligibleFor(bank, S.ticked[S.set], CFG.per).length;
  $('topicCount').textContent = on + ' of ' + total + ' ticked, ' + avail + ' categories available. Choose New puzzle to apply.';
}

/* ---------- puzzle ---------- */
function newPuzzle() {
  const p = buildPuzzle(BANKS[S.set], S.ticked[S.set], CFG);
  const msg = $('msg');
  S.selected = []; S.lives = LIVES; S.over = null; S.note = ''; S.busy = false;
  if (!p) {
    msg.hidden = false;
    msg.textContent = 'There are not enough categories for a puzzle with these ticks. Tick more topics and choose New puzzle.';
    S.puzzle = null; S.order = []; S.revealed = [];
    els.clear(); $('board').innerHTML = '';
    updateButtons(); renderLives(); $('status').textContent = '';
    return;
  }
  msg.hidden = true;
  S.puzzle = p;
  const ids = [];
  p.groups.forEach((g, gi) => g.words.forEach((_, wi) => ids.push(gi + '-' + wi)));
  S.order = shuffle(ids);
  S.revealed = [];
  els.clear();
  $('board').innerHTML = '';
  render();
}

function updateButtons() {
  const playing = !!S.puzzle && !S.over;
  const free = playing && !S.busy;
  $('checkBtn').disabled = !free || S.selected.length !== CFG.per;
  $('clearBtn').disabled = !free || !S.selected.length;
  $('shuffleBtn').disabled = !free;
  $('checkBtn').classList.toggle('primary', playing);
  $('newBtn').classList.toggle('primary', !playing);
}

function renderLives() {
  const box = $('lives');
  box.hidden = !S.puzzle;
  box.setAttribute('aria-label', 'Lives left: ' + S.lives);
  box.innerHTML = Array.from({ length: LIVES }, (_, i) =>
    '<svg viewBox="0 0 24 24" aria-hidden="true"' + (i < S.lives ? '' : ' class="gone"') + '>' + FEATHER + '</svg>').join('');
}

function layout() {
  const list = [];
  const P = S.puzzle;
  S.revealed.forEach(gi => {
    list.push({ type: 'banner', gi, key: 'b' + gi });
    P.groups[gi].words.forEach((_, wi) => list.push({ type: 'card', gi, wi, id: gi + '-' + wi, key: gi + '-' + wi, rev: true }));
  });
  S.order.forEach(id => {
    const [gi, wi] = id.split('-').map(Number);
    if (!S.revealed.includes(gi)) list.push({ type: 'card', gi, wi, id, key: id, rev: false });
  });
  return list;
}

function makeEl(d) {
  const P = S.puzzle;
  if (d.type === 'banner') {
    const el = document.createElement('div');
    el.className = 'banner c-' + COLORS[d.gi];
    el.dataset.key = d.key;
    const t = document.createElement('span');
    t.textContent = P.groups[d.gi].name;
    el.appendChild(t);
    if (P.groups[d.gi].ref) {
      const s = document.createElement('small');
      s.textContent = P.groups[d.gi].ref;
      el.appendChild(s);
    }
    return el;
  }
  const w = P.groups[d.gi].words[d.wi];
  const el = document.createElement('button');
  el.type = 'button';
  el.className = 'card';
  el.dataset.key = d.key;
  if (w.e) {
    const e = document.createElement('span');
    e.className = 'emoji'; e.textContent = w.e; e.setAttribute('aria-hidden', 'true');
    el.appendChild(e);
  }
  const t = document.createElement('span');
  t.className = 'word'; t.textContent = w.w;
  el.appendChild(t);
  return el;
}

function render() {
  const board = $('board');
  const first = new Map();
  board.querySelectorAll('[data-key]').forEach(el => first.set(el.dataset.key, el.getBoundingClientRect()));

  const list = layout();
  const keep = new Set();
  list.forEach(d => {
    keep.add(d.key);
    let el = els.get(d.key);
    if (!el) { el = makeEl(d); els.set(d.key, el); }
    if (d.type === 'card') {
      el.classList.toggle('rev', d.rev);
      ['c-t1', 'c-t2', 'c-t3', 'c-t4'].forEach(k => el.classList.remove(k));
      if (d.rev) el.classList.add('c-' + COLORS[d.gi]);
      el.classList.toggle('sel', S.selected.includes(d.id));
    }
    board.appendChild(el);
  });
  for (const [k, el] of els) if (!keep.has(k)) { el.remove(); els.delete(k); }

  board.querySelectorAll('.card').forEach(el => {
    const f = first.get(el.dataset.key);
    if (!f) return;
    const l = el.getBoundingClientRect();
    const dx = f.left - l.left, dy = f.top - l.top;
    if (dx || dy) {
      el.style.transition = 'none';
      el.style.transform = 'translate(' + dx + 'px,' + dy + 'px)';
      requestAnimationFrame(() => requestAnimationFrame(() => { el.style.transition = ''; el.style.transform = ''; }));
    }
  });

  $('status').textContent = !S.puzzle ? ''
    : S.over === 'won' ? 'All four found!'
    : S.over === 'lost' ? 'Out of lives.'
    : S.note;
  updateButtons();
  renderLives();
}

function check() {
  if (S.busy || S.over || S.selected.length !== CFG.per) return;
  const gi = guessResult(S.selected);
  S.note = '';
  if (gi >= 0) {
    S.revealed = S.revealed.concat(gi);
    S.selected = [];
    if (S.revealed.length === CFG.n) S.over = 'won';
    render();
    return;
  }
  const p = S.puzzle, wrong = S.selected;
  S.lives--;
  S.note = 'Not quite.';
  S.busy = true;
  wrong.forEach(id => els.get(id).classList.add('no'));
  render();
  setTimeout(() => {
    if (S.puzzle !== p) return;
    wrong.forEach(id => els.get(id).classList.remove('no'));
    S.busy = false;
    S.selected = [];
    if (S.lives === 0) {
      S.over = 'lost';
      S.revealed = S.revealed.concat(p.groups.map((_, i) => i).filter(i => !S.revealed.includes(i)));
    }
    render();
  }, 500);
}

/* ---------- selecting ---------- */
function speak(word) {
  try {
    if (!S.read || !window.speechSynthesis) return;
    window.speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(word);
    u.rate = 0.8;
    window.speechSynthesis.speak(u);
  } catch (e) { /* speech is optional */ }
}

$('board').addEventListener('click', e => {
  const el = e.target.closest('.card');
  if (!el || el.classList.contains('rev') || S.busy || S.over) return;
  const id = el.dataset.key;
  speak(el.querySelector('.word').textContent);
  if (S.selected.includes(id)) S.selected = S.selected.filter(x => x !== id);
  else if (S.selected.length < CFG.per) S.selected = S.selected.concat(id);
  S.note = '';
  render();
});

/* ---------- controls ---------- */
function syncKidsButtons() {
  $('readBtn').setAttribute('aria-pressed', String(S.read));
  $('readBtn').textContent = 'Read aloud when tapped: ' + (S.read ? 'on' : 'off');
}

$('pickBm').addEventListener('click', () => openSet('bm'));
$('pickEcon').addEventListener('click', () => openSet('econ'));
$('pickKids').addEventListener('click', () => openSet('kids'));
$('backBtn').addEventListener('click', () => { showScreen('menu'); });
$('newBtn').addEventListener('click', newPuzzle);
$('checkBtn').addEventListener('click', check);
$('clearBtn').addEventListener('click', () => { S.selected = []; S.note = ''; render(); });
$('shuffleBtn').addEventListener('click', () => { S.order = shuffle(S.order); render(); });
$('readBtn').addEventListener('click', () => { S.read = !S.read; syncKidsButtons(); });

/* ---------- start-up and republish snapshot ---------- */
function snapshot() {
  return {
    screen: S.screen, set: S.set, read: S.read, lives: S.lives, over: S.over,
    ticked: { bm: [...S.ticked.bm], econ: [...S.ticked.econ], kids: [...S.ticked.kids] },
    puzzle: S.puzzle, order: S.order, revealed: S.revealed
  };
}

function start(data) {
  data = data || {};
  ['bm', 'econ', 'kids'].forEach(k => {
    BANKS[k].meta.topics.forEach(t => { if (t.defaultOn !== false) S.ticked[k].add(t.code); });
  });
  $('bmCount').textContent = BANKS.bm.categories.length + ' categories';
  $('econCount').textContent = BANKS.econ.categories.length + ' categories';
  $('kidsCount').textContent = BANKS.kids.categories.length + ' categories';
  if (data.set && data.ticked) {
    S.ticked.bm = new Set(data.ticked.bm || [...S.ticked.bm]);
    S.ticked.econ = new Set(data.ticked.econ || [...S.ticked.econ]);
    S.ticked.kids = new Set(data.ticked.kids || [...S.ticked.kids]);
    S.set = data.set; S.read = !!data.read;
    S.lives = data.lives ?? LIVES; S.over = data.over || null;
    $('gameTitle').textContent = TITLES[S.set];
    $('topicLabel').textContent = S.set === 'kids' ? 'Themes' : 'Topics';
    $('kidsOpts').hidden = S.set !== 'kids';
    document.body.classList.toggle('kids', S.set === 'kids');
    syncKidsButtons();
    buildTopics();
    if (data.puzzle) {
      S.puzzle = data.puzzle; S.order = data.order || []; S.revealed = data.revealed || [];
      render();
    }
    showScreen(data.screen === 'game' ? 'game' : 'menu');
  }
}
try { window.claude?.hot?.snapshot?.(snapshot); } catch (e) { /* not in the viewer */ }
try {
  if (window.claude?.hot?.ready) window.claude.hot.ready(start);
  else start(window.claude?.hot?.data ?? {});
} catch (e) { start({}); }
</script>
