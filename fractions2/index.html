<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="icon" type="image/png" href="/unisamicon2.png">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>Pizza Fractions</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <!-- ============ LIVING SCENE (backdrop) ============ -->
  <div id="scene">
    <div id="sun"><div class="sun-core"></div></div>
    <div class="cloud cloud-1"></div>
    <div class="cloud cloud-2"></div>
    <div class="cloud cloud-3"></div>
    <div class="cloud cloud-4"></div>

    <div class="parallax" id="hills-back">
      <svg class="tile" viewBox="0 0 800 200" preserveAspectRatio="none">
        <path d="M0 200 L0 110 Q100 40 220 110 Q320 165 430 90 Q540 25 660 100 Q730 150 800 110 L800 200 Z" fill="var(--hill-back)"/>
      </svg>
    </div>
    <div class="parallax" id="hills-front">
      <svg class="tile" viewBox="0 0 800 140" preserveAspectRatio="none">
        <path d="M0 140 L0 80 Q90 30 200 80 Q290 120 400 70 Q500 25 610 80 Q700 120 800 80 L800 140 Z" fill="var(--hill-front)"/>
      </svg>
    </div>
    <div class="parallax" id="ground">
      <svg class="tile" viewBox="0 0 400 90" preserveAspectRatio="none">
        <rect x="0" y="14" width="400" height="76" fill="var(--dirt)"/>
        <rect x="0" y="0" width="400" height="22" fill="var(--grass)"/>
        <path d="M30 2 q3 -10 6 0 M37 3 q3 -8 6 0" stroke="var(--grass)" stroke-width="3" fill="none" stroke-linecap="round"/>
        <path d="M150 2 q3 -10 6 0 M157 3 q3 -8 6 0" stroke="var(--grass)" stroke-width="3" fill="none" stroke-linecap="round"/>
        <path d="M300 2 q3 -10 6 0 M307 3 q3 -8 6 0" stroke="var(--grass)" stroke-width="3" fill="none" stroke-linecap="round"/>
        <circle cx="90" cy="-3" r="5" fill="#ff9ec4"/><circle cx="90" cy="-3" r="2" fill="#fff3b0"/>
        <circle cx="230" cy="-3" r="5" fill="#fff"/><circle cx="230" cy="-3" r="2" fill="#ffd166"/>
        <circle cx="350" cy="-3" r="5" fill="#ffd166"/><circle cx="350" cy="-3" r="2" fill="#ff8fab"/>
      </svg>
    </div>

    <!-- Ty the cat (mascot, borrowed from Typurr) -->
    <div id="cat">
      <svg id="cat-svg" viewBox="0 0 130 110">
        <path class="tail" d="M16 60 Q-4 54 4 36 Q8 26 18 30" stroke="#f4a259" stroke-width="11" fill="none" stroke-linecap="round"/>
        <rect class="leg leg-bf" x="32" y="66" width="11" height="28" rx="5.5" fill="#e0883e"/>
        <rect class="leg leg-ff" x="74" y="66" width="11" height="28" rx="5.5" fill="#e0883e"/>
        <ellipse cx="58" cy="60" rx="38" ry="27" fill="#f4a259"/>
        <ellipse cx="62" cy="70" rx="22" ry="14" fill="#ffe8c7"/>
        <path d="M34 40 q5 9 0 17" stroke="#e07a3f" stroke-width="5" fill="none" stroke-linecap="round"/>
        <path d="M48 36 q5 9 0 17" stroke="#e07a3f" stroke-width="5" fill="none" stroke-linecap="round"/>
        <rect class="leg leg-bn" x="42" y="68" width="12" height="30" rx="6" fill="#f4a259"/>
        <rect class="leg leg-fn" x="84" y="68" width="12" height="30" rx="6" fill="#f4a259"/>
        <g id="head">
          <path d="M78 22 L84 2 L98 16 Z" fill="#f4a259"/>
          <path d="M118 22 L124 4 L106 14 Z" fill="#f4a259"/>
          <path d="M82 17 L85 8 L92 15 Z" fill="#ffb3c6"/>
          <path d="M116 18 L119 10 L110 14 Z" fill="#ffb3c6"/>
          <circle cx="99" cy="36" r="25" fill="#f4a259"/>
          <path d="M88 18 q5 8 0 15" stroke="#e07a3f" stroke-width="4" fill="none" stroke-linecap="round"/>
          <g class="face-normal">
            <g class="eye"><circle cx="91" cy="33" r="4.6" fill="#3a2c20"/><circle cx="92.6" cy="31.4" r="1.6" fill="#fff"/></g>
            <g class="eye"><circle cx="108" cy="33" r="4.6" fill="#3a2c20"/><circle cx="109.6" cy="31.4" r="1.6" fill="#fff"/></g>
            <path d="M95 45 q4 4 8 0" stroke="#3a2c20" stroke-width="2.4" fill="none" stroke-linecap="round"/>
          </g>
          <path d="M97 40 L101 40 L99 43 Z" fill="#ff8fab"/>
          <circle cx="85" cy="41" r="4" fill="#ffb3c6" opacity="0.7"/>
          <circle cx="113" cy="41" r="4" fill="#ffb3c6" opacity="0.7"/>
          <path d="M76 38 L62 35 M76 42 L63 44" stroke="#e07a3f" stroke-width="1.8" stroke-linecap="round"/>
          <path d="M122 38 L130 36 M122 42 L130 44" stroke="#e07a3f" stroke-width="1.8" stroke-linecap="round"/>
        </g>
      </svg>
    </div>
  </div>

  <!-- floating mute toggle -->
  <button id="mute-btn" class="corner-btn" aria-label="Mute sound">🔊</button>

  <!-- ============ GAME UI ============ -->
  <div id="app">

    <!-- PICKER SCREEN -->
    <section id="picker-screen" class="screen">
      <h1 id="title"></h1>
      <p class="greeting">Ty is hungry for pizza! Pick a game.</p>

      <div class="user-bar" id="user-bar"></div>

      <div class="picker-card">
        <p class="picker-label">How tricky?</p>
        <div class="pill-group" id="tier-group">
          <button class="pill-btn" data-tier="A">🟢 Easy</button>
          <button class="pill-btn" data-tier="B">🟡 Medium</button>
          <button class="pill-btn" data-tier="C">🔴 Challenge</button>
        </div>

        <p class="picker-label">Which game?</p>
        <div class="mode-group" id="mode-group">
          <button class="mode-card" data-mode="order">
            <span class="mode-emoji">🍕</span>
            <span class="mode-name">Order the Pizzas</span>
            <span class="mode-desc">Line up slices smallest to biggest.</span>
          </button>
          <button class="mode-card" data-mode="match">
            <span class="mode-emoji">🧩</span>
            <span class="mode-name">Match the Equivalents</span>
            <span class="mode-desc">Find two that are the same amount.</span>
          </button>
          <button class="mode-card" data-mode="build">
            <span class="mode-emoji">✏️</span>
            <span class="mode-name">Build the Fraction</span>
            <span class="mode-desc">Tap slices to shade the fraction.</span>
          </button>
        </div>
      </div>

      <button id="play-btn" class="big-btn">Let's Play!</button>
    </section>

    <!-- GAME SCREEN -->
    <section id="game-screen" class="screen hidden">
      <div class="game-header">
        <button id="back-btn" class="corner-btn" aria-label="Back to menu">↩</button>
        <span id="game-title" class="game-title"></span>
        <span id="star-count" class="star-count"></span>
      </div>

      <!-- Order the Pizzas -->
      <div id="order-board" class="mode-board hidden">
        <div class="fraction-container" id="fraction-container"></div>
        <div class="control-buttons">
          <button id="checkPizzasButton" class="mid-btn hidden">Check the Pizzas!</button>
          <button id="checkAnswersButton" class="mid-btn">Check the Order</button>
        </div>
        <div class="feed-row">
          <span class="feed-label">Ty's dinner:</span>
          <div id="progressRow" class="progress-row"></div>
        </div>
      </div>

      <!-- Match the Equivalents -->
      <div id="match-board" class="mode-board hidden">
        <p class="board-hint">Tap two cards that show the same amount of pizza!</p>
        <div id="match-grid" class="match-grid"></div>
      </div>

      <!-- Build the Fraction -->
      <div id="build-board" class="mode-board hidden">
        <p class="board-hint">Tap slices to shade <span id="build-target">this much</span> pizza!</p>
        <div class="build-pizza-wrap">
          <div id="build-pizza" class="build-pizza"></div>
        </div>
        <button id="checkBuildButton" class="mid-btn">Check My Pizza!</button>
      </div>

      <div id="message"></div>
    </section>

    <!-- WIN OVERLAY (transparent so Ty dances behind it) -->
    <div class="overlay win-overlay hidden" id="win-screen">
      <div class="card">
        <h2>🎉 Great job!</h2>
        <p id="win-text"></p>
        <div class="win-btns">
          <button class="big-btn" id="win-again-btn">Play Again</button>
          <button class="big-btn alt" id="win-menu-btn">New Game</button>
        </div>
      </div>
    </div>

    <!-- ADD PLAYER DIALOG -->
    <div class="overlay dark-overlay hidden" id="user-dialog">
      <div class="card">
        <h2>New player</h2>
        <input id="user-name" type="text" maxlength="12" placeholder="Type your name" autocomplete="off">
        <p class="pick-icon-label">Pick your face</p>
        <div class="icon-grid" id="icon-grid"></div>
        <div class="win-btns">
          <button class="big-btn" id="user-save">Add me</button>
          <button class="big-btn alt" id="user-cancel">Cancel</button>
        </div>
      </div>
    </div>

  </div>

  <script src="script.js"></script>
</body>
</html>
