<svg xmlns="http://www.w3.org/2000/svg" width="680" height="540" font-family="Georgia, serif">
  <text x="340" y="36" text-anchor="middle" font-size="16" font-weight="bold" fill="#222">Positive externality of consumption</text>

  <!-- DWL triangle (drawn first) -->
  <polygon points="360,282 360,212 430,246" fill="#C0392B" fill-opacity="0.15"/>

  <!-- Axes -->
  <line x1="90" y1="60" x2="90" y2="470" stroke="#333" stroke-width="2"/>
  <line x1="90" y1="470" x2="610" y2="470" stroke="#333" stroke-width="2"/>
  <text transform="rotate(-90 30 175)" x="30" y="175" text-anchor="middle" font-size="13" fill="#333">Price / Cost / Benefit</text>
  <text x="608" y="492" text-anchor="end" font-size="13" fill="#333">Quantity (units/week)</text>

  <!-- Curves -->
  <line x1="90" y1="150" x2="560" y2="380" stroke="#14746F" stroke-width="2.5"/>
  <text x="566" y="384" font-size="12" font-style="italic" fill="#14746F">MPB = demand</text>
  <line x1="90" y1="420" x2="560" y2="180" stroke="#0D5C57" stroke-width="2.5"/>
  <text x="566" y="184" font-size="12" font-style="italic" fill="#0D5C57">MSC = supply</text>
  <line x1="90" y1="80" x2="560" y2="310" stroke="#C0392B" stroke-width="2.5"/>
  <text x="566" y="314" font-size="12" font-style="italic" fill="#C0392B">MSB</text>

  <!-- Social optimum reference lines -->
  <line x1="90" y1="246" x2="430" y2="246" stroke="#888" stroke-width="1.1" stroke-dasharray="5,4"/>
  <line x1="430" y1="246" x2="430" y2="470" stroke="#888" stroke-width="1.1" stroke-dasharray="5,4"/>
  <!-- Market equilibrium reference lines -->
  <line x1="90" y1="282" x2="360" y2="282" stroke="#aaa" stroke-width="1.1" stroke-dasharray="5,4"/>
  <line x1="360" y1="282" x2="360" y2="470" stroke="#aaa" stroke-width="1.1" stroke-dasharray="5,4"/>

  <circle cx="430" cy="246" r="4.5" fill="#0D5C57"/>
  <circle cx="360" cy="282" r="4.5" fill="#555"/>

  <text x="78" y="250" text-anchor="end" font-size="12" fill="#0D5C57">P*</text>
  <text x="78" y="286" text-anchor="end" font-size="12" fill="#555">Pm</text>
  <text x="430" y="492" text-anchor="middle" font-size="12" fill="#0D5C57">Q*</text>
  <text x="360" y="492" text-anchor="middle" font-size="12" fill="#555">Qm</text>

  <text x="385" y="250" text-anchor="middle" font-size="11" font-weight="bold" fill="#C0392B">DWL</text>
</svg>
