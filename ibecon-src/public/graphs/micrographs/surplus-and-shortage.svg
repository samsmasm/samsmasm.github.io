<svg xmlns="http://www.w3.org/2000/svg" width="680" height="540" font-family="Georgia, serif">
  <defs>
    <marker id="redL" markerWidth="10" markerHeight="7" refX="1" refY="3.5" orient="auto">
      <polygon points="10 0, 0 3.5, 10 7" fill="#C0392B"/>
    </marker>
    <marker id="redR" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#C0392B"/>
    </marker>
    <marker id="tealL" markerWidth="10" markerHeight="7" refX="1" refY="3.5" orient="auto">
      <polygon points="10 0, 0 3.5, 10 7" fill="#0D5C57"/>
    </marker>
    <marker id="tealR" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#0D5C57"/>
    </marker>
  </defs>

  <text x="340" y="36" text-anchor="middle" font-size="16" font-weight="bold" fill="#222">Surplus and shortage</text>

  <!-- Axes -->
  <line x1="90" y1="60" x2="90" y2="470" stroke="#333" stroke-width="2"/>
  <line x1="90" y1="470" x2="610" y2="470" stroke="#333" stroke-width="2"/>
  <text transform="rotate(-90 30 140)" x="30" y="140" text-anchor="middle" font-size="13" fill="#333">Price ($/unit)</text>
  <text x="608" y="492" text-anchor="end" font-size="13" fill="#333">Quantity (units/week)</text>

  <!-- Demand and supply -->
  <line x1="90" y1="90" x2="560" y2="430" stroke="#14746F" stroke-width="2.5"/>
  <text x="566" y="432" font-size="14" fill="#14746F">Demand</text>
  <line x1="90" y1="430" x2="560" y2="90" stroke="#0D5C57" stroke-width="2.5"/>
  <text x="566" y="92" font-size="14" fill="#0D5C57">Supply</text>

  <!-- Equilibrium -->
  <line x1="90" y1="260" x2="325" y2="260" stroke="#888" stroke-width="1.1" stroke-dasharray="5,4"/>
  <line x1="325" y1="260" x2="325" y2="470" stroke="#888" stroke-width="1.1" stroke-dasharray="5,4"/>
  <circle cx="325" cy="260" r="4" fill="#333"/>
  <text x="78" y="264" text-anchor="end" font-size="12" fill="#333">Pe</text>
  <text x="325" y="492" text-anchor="middle" font-size="12" fill="#333">Qe</text>

  <!-- SURPLUS: price above equilibrium (y=170) -->
  <line x1="90" y1="170" x2="449" y2="170" stroke="#C0392B" stroke-width="1.3" stroke-dasharray="5,4"/>
  <text x="78" y="174" text-anchor="end" font-size="12" fill="#C0392B">P&#8321;</text>
  <circle cx="201" cy="170" r="3" fill="#C0392B"/>
  <circle cx="449" cy="170" r="3" fill="#C0392B"/>
  <line x1="201" y1="155" x2="449" y2="155" stroke="#C0392B" stroke-width="1.5" marker-start="url(#redL)" marker-end="url(#redR)"/>
  <text x="325" y="148" text-anchor="middle" font-size="12" font-weight="bold" fill="#C0392B">Surplus</text>
  <line x1="201" y1="170" x2="201" y2="470" stroke="#C0392B" stroke-width="1" stroke-dasharray="3,4"/>
  <line x1="449" y1="170" x2="449" y2="470" stroke="#C0392B" stroke-width="1" stroke-dasharray="3,4"/>
  <text x="201" y="492" text-anchor="middle" font-size="11" fill="#C0392B">Qd</text>
  <text x="449" y="492" text-anchor="middle" font-size="11" fill="#C0392B">Qs</text>

  <!-- SHORTAGE: price below equilibrium (y=350) -->
  <line x1="90" y1="350" x2="449" y2="350" stroke="#0D5C57" stroke-width="1.3" stroke-dasharray="5,4"/>
  <text x="78" y="354" text-anchor="end" font-size="12" fill="#0D5C57">P&#8322;</text>
  <circle cx="201" cy="350" r="3" fill="#0D5C57"/>
  <circle cx="449" cy="350" r="3" fill="#0D5C57"/>
  <line x1="201" y1="365" x2="449" y2="365" stroke="#0D5C57" stroke-width="1.5" marker-start="url(#tealL)" marker-end="url(#tealR)"/>
  <text x="325" y="382" text-anchor="middle" font-size="12" font-weight="bold" fill="#0D5C57">Shortage</text>
</svg>
