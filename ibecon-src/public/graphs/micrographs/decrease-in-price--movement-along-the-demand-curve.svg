<svg xmlns="http://www.w3.org/2000/svg" width="680" height="540" font-family="Georgia, serif">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="8.5" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#0D5C57"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="340" y="36" text-anchor="middle" font-size="16" font-weight="bold" fill="#222">Decrease in price; movement along the demand curve</text>

  <!-- Axes -->
  <line x1="90" y1="60" x2="90" y2="470" stroke="#333" stroke-width="2"/>
  <line x1="90" y1="470" x2="610" y2="470" stroke="#333" stroke-width="2"/>

  <!-- Axis labels at the ends -->
  <text transform="rotate(-90 30 140)" x="30" y="140" text-anchor="middle" font-size="13" fill="#333">Price ($/unit)</text>
  <text x="608" y="492" text-anchor="end" font-size="13" fill="#333">Quantity (units/week)</text>

  <!-- Demand curve -->
  <line x1="130" y1="90" x2="560" y2="430" stroke="#14746F" stroke-width="2.5"/>
  <text x="566" y="434" font-size="14" fill="#14746F">Demand</text>

  <!-- Reference lines, point A = (P1, Q1) -->
  <line x1="90" y1="169" x2="230" y2="169" stroke="#888" stroke-width="1.1" stroke-dasharray="5,4"/>
  <line x1="230" y1="169" x2="230" y2="470" stroke="#888" stroke-width="1.1" stroke-dasharray="5,4"/>

  <!-- Reference lines, point B = (P2, Q2) -->
  <line x1="90" y1="367" x2="480" y2="367" stroke="#888" stroke-width="1.1" stroke-dasharray="5,4"/>
  <line x1="480" y1="367" x2="480" y2="470" stroke="#888" stroke-width="1.1" stroke-dasharray="5,4"/>

  <!-- Price labels -->
  <text x="78" y="173" text-anchor="end" font-size="13" fill="#333">P&#8321;</text>
  <text x="78" y="371" text-anchor="end" font-size="13" fill="#333">P&#8322;</text>

  <!-- Quantity labels -->
  <text x="230" y="504" text-anchor="middle" font-size="13" fill="#333">Q&#8321;</text>
  <text x="480" y="504" text-anchor="middle" font-size="13" fill="#333">Q&#8322;</text>

  <!-- Direction arrows: price falls, quantity demanded rises -->
  <line x1="46" y1="185" x2="46" y2="352" stroke="#0D5C57" stroke-width="1.8" marker-end="url(#arrowhead)"/>
  <line x1="255" y1="500" x2="455" y2="500" stroke="#0D5C57" stroke-width="1.8" marker-end="url(#arrowhead)"/>
</svg>
