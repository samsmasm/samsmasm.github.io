<svg xmlns="http://www.w3.org/2000/svg" width="680" height="540" font-family="Georgia, serif">
  <text x="340" y="36" text-anchor="middle" font-size="16" font-weight="bold" fill="#222">Subsidy</text>

  <!-- Subsidy cost rectangle (drawn first) -->
  <rect x="90" y="249" width="310" height="82" fill="#14746F" fill-opacity="0.15" stroke="#14746F" stroke-width="1"/>
  <!-- DWL triangle -->
  <polygon points="330,290 400,249 400,331" fill="#C0392B" fill-opacity="0.2"/>

  <!-- Axes -->
  <line x1="90" y1="60" x2="90" y2="470" stroke="#333" stroke-width="2"/>
  <line x1="90" y1="470" x2="610" y2="470" stroke="#333" stroke-width="2"/>
  <text transform="rotate(-90 30 140)" x="30" y="140" text-anchor="middle" font-size="13" fill="#333">Price ($/unit)</text>
  <text x="608" y="492" text-anchor="end" font-size="13" fill="#333">Quantity (units/week)</text>

  <!-- Curves -->
  <line x1="90" y1="150" x2="570" y2="430" stroke="#14746F" stroke-width="2.5"/>
  <text x="576" y="432" font-size="13" fill="#14746F">Demand</text>
  <line x1="90" y1="430" x2="570" y2="150" stroke="#0D5C57" stroke-width="2.5"/>
  <text x="576" y="152" font-size="13" fill="#0D5C57">Supply</text>
  <line x1="159" y1="470" x2="570" y2="231" stroke="#0D5C57" stroke-width="2.2" stroke-dasharray="7,4"/>
  <text x="576" y="235" font-size="12" fill="#0D5C57">S + subsidy</text>

  <!-- Reference lines -->
  <line x1="90" y1="290" x2="330" y2="290" stroke="#aaa" stroke-width="1" stroke-dasharray="4,4"/>
  <line x1="90" y1="249" x2="400" y2="249" stroke="#888" stroke-width="1.1" stroke-dasharray="5,4"/>
  <line x1="90" y1="331" x2="400" y2="331" stroke="#888" stroke-width="1.1" stroke-dasharray="5,4"/>
  <line x1="400" y1="249" x2="400" y2="470" stroke="#888" stroke-width="1.1" stroke-dasharray="5,4"/>
  <line x1="330" y1="290" x2="330" y2="470" stroke="#aaa" stroke-width="1" stroke-dasharray="4,4"/>

  <circle cx="330" cy="290" r="4" fill="#333"/>
  <circle cx="400" cy="249" r="4" fill="#0D5C57"/>
  <circle cx="400" cy="331" r="4" fill="#0D5C57"/>

  <text x="78" y="253" text-anchor="end" font-size="12" fill="#333">Pp</text>
  <text x="78" y="294" text-anchor="end" font-size="12" fill="#555">Pe</text>
  <text x="78" y="335" text-anchor="end" font-size="12" fill="#333">Pc</text>
  <text x="330" y="492" text-anchor="middle" font-size="12" fill="#555">Qe</text>
  <text x="400" y="492" text-anchor="middle" font-size="12" fill="#333">Qs</text>

  <text x="232" y="294" text-anchor="middle" font-size="11" font-weight="bold" fill="#0D5C57">Subsidy cost</text>
  <text x="372" y="292" text-anchor="middle" font-size="11" font-weight="bold" fill="#C0392B">DWL</text>
</svg>
