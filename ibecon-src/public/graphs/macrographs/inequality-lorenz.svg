<svg xmlns="http://www.w3.org/2000/svg" width="680" height="540" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <marker id="axarrow" markerWidth="10" markerHeight="10" refX="6" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#222"/></marker>
  </defs>

  <line x1="90" y1="440" x2="600" y2="440" stroke="#222" stroke-width="1.8" marker-end="url(#axarrow)"/>
  <line x1="90" y1="440" x2="90" y2="30" stroke="#222" stroke-width="1.8" marker-end="url(#axarrow)"/>
  <text transform="rotate(-90 32 235)" x="32" y="235" text-anchor="middle" font-size="13" fill="#222">Cumulative % of income</text>
  <text x="500" y="468" text-anchor="middle" font-size="13" fill="#222">Cumulative % of population</text>
  <text x="82" y="458" text-anchor="end" font-size="12" fill="#222">0</text>
  <text x="500" y="458" text-anchor="middle" font-size="12" fill="#222">100</text>
  <text x="80" y="48" text-anchor="end" font-size="12" fill="#222">100</text>

  <!-- Line of equality -->
  <line x1="90" y1="440" x2="500" y2="40" stroke="#888" stroke-width="2"/>
  <text x="250" y="150" font-size="13" fill="#555">Line of equality</text>

  <!-- Lorenz curve (piecewise through quintile points) -->
  <polyline points="90,440 172,428 254,391 336,338 418,256 500,40" fill="none" stroke="#1F4DA1" stroke-width="2.6"/>
  <circle cx="172" cy="428" r="4" fill="#1F4DA1"/><text x="180" y="424" font-size="12" font-weight="bold" fill="#1F4DA1">A</text>
  <circle cx="254" cy="391" r="4" fill="#1F4DA1"/><text x="262" y="387" font-size="12" font-weight="bold" fill="#1F4DA1">B</text>
  <circle cx="336" cy="338" r="4" fill="#1F4DA1"/><text x="344" y="334" font-size="12" font-weight="bold" fill="#1F4DA1">C</text>
  <circle cx="418" cy="256" r="4" fill="#1F4DA1"/><text x="426" y="252" font-size="12" font-weight="bold" fill="#1F4DA1">D</text>
  <circle cx="500" cy="40" r="4" fill="#1F4DA1"/><text x="508" y="44" font-size="12" font-weight="bold" fill="#1F4DA1">E</text>

  <text x="300" y="300" font-size="13" fill="#1F4DA1">Lorenz curve</text>
</svg>
