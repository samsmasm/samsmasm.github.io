<svg xmlns="http://www.w3.org/2000/svg" width="680" height="540" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <marker id="axarrow" markerWidth="10" markerHeight="10" refX="6" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#222"/></marker>
    <marker id="shift" markerWidth="9" markerHeight="9" refX="5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#222"/></marker>
  </defs>

  <line x1="80" y1="440" x2="635" y2="440" stroke="#222" stroke-width="1.8" marker-end="url(#axarrow)"/>
  <line x1="80" y1="440" x2="80" y2="55" stroke="#222" stroke-width="1.8" marker-end="url(#axarrow)"/>
  <text transform="rotate(-90 30 250)" x="30" y="250" text-anchor="middle" font-size="14" fill="#222">Price level</text>
  <text x="628" y="468" text-anchor="end" font-size="14" fill="#222">Real GDP (Y)</text>
  <text x="70" y="460" text-anchor="end" font-size="13" fill="#222">0</text>

  <!-- Keynesian AS shifts right -->
  <path d="M 120 370 L 290 370 Q 460 370 460 170 L 460 80" fill="none" stroke="#C81E5A" stroke-width="2.6"/>
  <text x="446" y="100" text-anchor="end" font-size="13" fill="#C81E5A">AS&#8321;</text>
  <path d="M 200 370 L 370 370 Q 540 370 540 170 L 540 80" fill="none" stroke="#C81E5A" stroke-width="2.6"/>
  <text x="548" y="120" font-size="13" fill="#C81E5A">AS&#8322;</text>
  <line x1="470" y1="150" x2="530" y2="150" stroke="#222" stroke-width="1.6" marker-end="url(#shift)"/>

  <!-- AD (constant) -->
  <line x1="150" y1="200" x2="560" y2="405" stroke="#1F4DA1" stroke-width="2.6"/>
  <text x="566" y="407" font-size="14" fill="#1F4DA1">AD</text>

  <!-- Equilibria -->
  <line x1="80" y1="325" x2="415" y2="325" stroke="#777" stroke-width="1" stroke-dasharray="5,4"/>
  <line x1="80" y1="345" x2="470" y2="345" stroke="#777" stroke-width="1" stroke-dasharray="5,4"/>
  <line x1="415" y1="325" x2="415" y2="448" stroke="#777" stroke-width="1" stroke-dasharray="5,4"/>
  <line x1="470" y1="345" x2="470" y2="448" stroke="#777" stroke-width="1" stroke-dasharray="5,4"/>
  <circle cx="415" cy="325" r="4.5" fill="#222"/>
  <circle cx="470" cy="345" r="4.5" fill="#222"/>
  <text x="74" y="329" text-anchor="end" font-size="13" fill="#222">PL<tspan font-size="10" dy="3">1</tspan></text>
  <text x="74" y="349" text-anchor="end" font-size="13" fill="#222">PL<tspan font-size="10" dy="3">2</tspan></text>
  <text x="409" y="458" text-anchor="end" font-size="13" fill="#222">Y<tspan font-size="10" dy="3">1</tspan></text>
  <text x="476" y="458" font-size="13" fill="#222">Y<tspan font-size="10" dy="3">2</tspan></text>
</svg>
