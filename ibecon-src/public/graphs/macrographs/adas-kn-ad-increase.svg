<svg xmlns="http://www.w3.org/2000/svg" width="680" height="540" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <marker id="axarrow" markerWidth="10" markerHeight="10" refX="6" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#222"/></marker>
  </defs>

  <!-- Axes -->
  <line x1="80" y1="440" x2="635" y2="440" stroke="#222" stroke-width="1.8" marker-end="url(#axarrow)"/>
  <line x1="80" y1="440" x2="80" y2="55" stroke="#222" stroke-width="1.8" marker-end="url(#axarrow)"/>
  <text transform="rotate(-90 30 250)" x="30" y="250" text-anchor="middle" font-size="14" fill="#222">Price level</text>
  <text x="628" y="468" text-anchor="end" font-size="14" fill="#222">Real GDP (Y)</text>
  <text x="70" y="460" text-anchor="end" font-size="13" fill="#222">0</text>

  <!-- Keynesian AS -->
  <path d="M 120 370 L 290 370 Q 460 370 460 170 L 460 80" fill="none" stroke="#C81E5A" stroke-width="2.6"/>
  <text x="470" y="120" font-size="14" fill="#C81E5A">AS</text>

  <!-- Three AD curves marching right -->
  <line x1="120" y1="310" x2="337" y2="440" stroke="#1F4DA1" stroke-width="2.4"/>
  <text x="120" y="300" font-size="13" fill="#1F4DA1">AD&#8321;</text>
  <line x1="180" y1="192" x2="470" y2="366" stroke="#1F4DA1" stroke-width="2.4"/>
  <text x="476" y="368" font-size="13" fill="#1F4DA1">AD&#8322;</text>
  <line x1="310" y1="60" x2="560" y2="210" stroke="#1F4DA1" stroke-width="2.4"/>
  <text x="566" y="212" font-size="13" fill="#1F4DA1">AD&#8323;</text>

  <!-- Equilibrium points -->
  <circle cx="220" cy="370" r="4" fill="#222"/>
  <circle cx="410" cy="330" r="4" fill="#222"/>
  <circle cx="460" cy="150" r="4" fill="#222"/>

  <!-- Price-level projections -->
  <line x1="80" y1="370" x2="220" y2="370" stroke="#777" stroke-width="1" stroke-dasharray="5,4"/>
  <line x1="80" y1="330" x2="410" y2="330" stroke="#777" stroke-width="1" stroke-dasharray="5,4"/>
  <line x1="80" y1="150" x2="460" y2="150" stroke="#777" stroke-width="1" stroke-dasharray="5,4"/>
  <text x="74" y="374" text-anchor="end" font-size="12" fill="#222">PL<tspan font-size="9" dy="3">1</tspan></text>
  <text x="74" y="334" text-anchor="end" font-size="12" fill="#222">PL<tspan font-size="9" dy="3">2</tspan></text>
  <text x="74" y="154" text-anchor="end" font-size="12" fill="#222">PL<tspan font-size="9" dy="3">3</tspan></text>

  <!-- Output projections -->
  <line x1="220" y1="370" x2="220" y2="440" stroke="#777" stroke-width="1" stroke-dasharray="5,4"/>
  <line x1="410" y1="330" x2="410" y2="440" stroke="#777" stroke-width="1" stroke-dasharray="5,4"/>
  <line x1="460" y1="150" x2="460" y2="440" stroke="#777" stroke-width="1" stroke-dasharray="5,4"/>
  <text x="220" y="458" text-anchor="middle" font-size="12" fill="#222">Y<tspan font-size="9" dy="3">1</tspan></text>
  <text x="404" y="458" text-anchor="end" font-size="12" fill="#222">Y<tspan font-size="9" dy="3">2</tspan></text>
  <text x="468" y="458" font-size="12" fill="#222">Y<tspan font-size="9" dy="3">fe</tspan></text>
</svg>
