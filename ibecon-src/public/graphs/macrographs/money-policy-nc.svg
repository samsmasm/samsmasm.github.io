<svg xmlns="http://www.w3.org/2000/svg" width="680" height="540" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <marker id="axarrow" markerWidth="10" markerHeight="10" refX="6" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#222"/></marker>
    <marker id="shift" markerWidth="9" markerHeight="9" refX="5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#222"/></marker>
  </defs>

  <line x1="80" y1="440" x2="635" y2="440" stroke="#222" stroke-width="1.8" marker-end="url(#axarrow)"/>
  <line x1="80" y1="440" x2="80" y2="55" stroke="#222" stroke-width="1.8" marker-end="url(#axarrow)"/>
  <text transform="rotate(-90 30 250)" x="30" y="250" text-anchor="middle" font-size="14" fill="#222">Interest rate (%)</text>
  <text x="628" y="468" text-anchor="end" font-size="14" fill="#222">Quantity of money</text>
  <text x="70" y="460" text-anchor="end" font-size="13" fill="#222">0</text>

  <!-- Money supply increases (expansionary): MS1 -> MS2 -->
  <line x1="300" y1="90" x2="300" y2="440" stroke="#C81E5A" stroke-width="2.6"/>
  <text x="300" y="80" text-anchor="middle" font-size="13" fill="#C81E5A">MS&#8321;</text>
  <line x1="400" y1="90" x2="400" y2="440" stroke="#C81E5A" stroke-width="2.6"/>
  <text x="400" y="80" text-anchor="middle" font-size="13" fill="#C81E5A">MS&#8322;</text>
  <line x1="312" y1="120" x2="388" y2="120" stroke="#222" stroke-width="1.6" marker-end="url(#shift)"/>

  <!-- Money demand -->
  <line x1="130" y1="120" x2="560" y2="420" stroke="#1F4DA1" stroke-width="2.6"/>
  <text x="566" y="422" font-size="14" fill="#1F4DA1">MD</text>

  <!-- Interest rate falls r1 -> r2 -->
  <line x1="80" y1="239" x2="300" y2="239" stroke="#777" stroke-width="1" stroke-dasharray="5,4"/>
  <line x1="80" y1="308" x2="400" y2="308" stroke="#777" stroke-width="1" stroke-dasharray="5,4"/>
  <circle cx="300" cy="239" r="4.5" fill="#222"/>
  <circle cx="400" cy="308" r="4.5" fill="#222"/>
  <text x="74" y="243" text-anchor="end" font-size="13" fill="#222">r<tspan font-size="10" dy="3">1</tspan></text>
  <text x="74" y="312" text-anchor="end" font-size="13" fill="#222">r<tspan font-size="10" dy="3">2</tspan></text>
</svg>
