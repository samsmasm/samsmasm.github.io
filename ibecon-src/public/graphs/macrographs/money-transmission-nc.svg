<svg xmlns="http://www.w3.org/2000/svg" width="1020" height="540" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <marker id="axarrow" markerWidth="10" markerHeight="10" refX="6" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#222"/></marker>
    <marker id="shift" markerWidth="9" markerHeight="9" refX="5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#222"/></marker>
  </defs>

  <!-- ===== LEFT: money market ===== -->
  <g transform="translate(0,30)">
    <text x="270" y="40" text-anchor="middle" font-size="15" font-weight="bold" fill="#333">Money market</text>
    <line x1="70" y1="430" x2="470" y2="430" stroke="#222" stroke-width="1.8" marker-end="url(#axarrow)"/>
    <line x1="70" y1="430" x2="70" y2="60" stroke="#222" stroke-width="1.8" marker-end="url(#axarrow)"/>
    <text transform="rotate(-90 34 250)" x="34" y="250" text-anchor="middle" font-size="12" fill="#222">Interest rate</text>
    <text x="468" y="450" text-anchor="end" font-size="12" fill="#222">Quantity of money</text>
    <text x="62" y="448" text-anchor="end" font-size="12" fill="#222">0</text>

    <line x1="230" y1="90" x2="230" y2="430" stroke="#C81E5A" stroke-width="2.4"/>
    <text x="230" y="80" text-anchor="middle" font-size="12" fill="#C81E5A">MS&#8321;</text>
    <line x1="310" y1="90" x2="310" y2="430" stroke="#C81E5A" stroke-width="2.4"/>
    <text x="310" y="80" text-anchor="middle" font-size="12" fill="#C81E5A">MS&#8322;</text>
    <line x1="242" y1="120" x2="298" y2="120" stroke="#222" stroke-width="1.5" marker-end="url(#shift)"/>

    <line x1="110" y1="110" x2="430" y2="400" stroke="#1F4DA1" stroke-width="2.4"/>
    <text x="434" y="402" font-size="12" fill="#1F4DA1">MD</text>

    <line x1="70" y1="222" x2="230" y2="222" stroke="#777" stroke-width="1" stroke-dasharray="5,4"/>
    <line x1="70" y1="297" x2="310" y2="297" stroke="#777" stroke-width="1" stroke-dasharray="5,4"/>
    <circle cx="230" cy="222" r="4" fill="#222"/>
    <circle cx="310" cy="297" r="4" fill="#222"/>
    <text x="64" y="226" text-anchor="end" font-size="12" fill="#222">r<tspan font-size="9" dy="3">1</tspan></text>
    <text x="64" y="301" text-anchor="end" font-size="12" fill="#222">r<tspan font-size="9" dy="3">2</tspan></text>
  </g>

  <!-- Connector -->
  <text x="510" y="250" text-anchor="middle" font-size="12" fill="#444">lower r &#8594;</text>
  <text x="510" y="268" text-anchor="middle" font-size="12" fill="#444">investment &amp;</text>
  <text x="510" y="284" text-anchor="middle" font-size="12" fill="#444">consumption &#8593;</text>
  <line x1="478" y1="300" x2="540" y2="300" stroke="#222" stroke-width="1.6" marker-end="url(#shift)"/>

  <!-- ===== RIGHT: goods market AD/AS ===== -->
  <g transform="translate(550,30)">
    <text x="265" y="40" text-anchor="middle" font-size="15" font-weight="bold" fill="#333">Goods market (AD/AS)</text>
    <line x1="70" y1="430" x2="470" y2="430" stroke="#222" stroke-width="1.8" marker-end="url(#axarrow)"/>
    <line x1="70" y1="430" x2="70" y2="60" stroke="#222" stroke-width="1.8" marker-end="url(#axarrow)"/>
    <text transform="rotate(-90 34 250)" x="34" y="250" text-anchor="middle" font-size="12" fill="#222">Price level</text>
    <text x="468" y="450" text-anchor="end" font-size="12" fill="#222">Real GDP (Y)</text>
    <text x="62" y="448" text-anchor="end" font-size="12" fill="#222">0</text>

    <line x1="100" y1="400" x2="430" y2="140" stroke="#C81E5A" stroke-width="2.4"/>
    <text x="434" y="140" font-size="12" fill="#C81E5A">SRAS</text>
    <line x1="110" y1="212" x2="380" y2="374" stroke="#1F4DA1" stroke-width="2.4"/>
    <text x="100" y="208" text-anchor="end" font-size="12" fill="#1F4DA1">AD&#8321;</text>
    <line x1="170" y1="151" x2="450" y2="319" stroke="#1F4DA1" stroke-width="2.4"/>
    <text x="454" y="321" font-size="12" fill="#1F4DA1">AD&#8322;</text>
    <line x1="320" y1="306" x2="385" y2="306" stroke="#222" stroke-width="1.5" marker-end="url(#shift)"/>

    <line x1="240" y1="290" x2="240" y2="430" stroke="#777" stroke-width="1" stroke-dasharray="5,4"/>
    <line x1="310" y1="235" x2="310" y2="430" stroke="#777" stroke-width="1" stroke-dasharray="5,4"/>
    <circle cx="240" cy="290" r="4" fill="#222"/>
    <circle cx="310" cy="235" r="4" fill="#222"/>
    <text x="240" y="448" text-anchor="middle" font-size="12" fill="#222">Y<tspan font-size="9" dy="3">1</tspan></text>
    <text x="310" y="448" text-anchor="middle" font-size="12" fill="#222">Y<tspan font-size="9" dy="3">2</tspan></text>
  </g>
</svg>
