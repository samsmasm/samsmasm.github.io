<svg xmlns="http://www.w3.org/2000/svg" width="680" height="540" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <marker id="axarrow" markerWidth="10" markerHeight="10" refX="6" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#222"/></marker>
    <marker id="shift" markerWidth="9" markerHeight="9" refX="5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#222"/></marker>
  </defs>

  <line x1="80" y1="440" x2="635" y2="440" stroke="#222" stroke-width="1.8" marker-end="url(#axarrow)"/>
  <line x1="80" y1="440" x2="80" y2="55" stroke="#222" stroke-width="1.8" marker-end="url(#axarrow)"/>
  <text transform="rotate(-90 30 250)" x="30" y="250" text-anchor="middle" font-size="14" fill="#222">Real interest rate (%)</text>
  <text x="628" y="468" text-anchor="end" font-size="14" fill="#222">Loanable funds</text>
  <text x="70" y="460" text-anchor="end" font-size="13" fill="#222">0</text>

  <!-- Supply of loanable funds -->
  <line x1="130" y1="420" x2="560" y2="120" stroke="#C81E5A" stroke-width="2.6"/>
  <text x="566" y="120" font-size="13" fill="#C81E5A">S</text>

  <!-- Demand: D1 and D2 (= D1 + government borrowing) -->
  <line x1="130" y1="150" x2="500" y2="400" stroke="#1F4DA1" stroke-width="2.6"/>
  <text x="500" y="416" font-size="13" fill="#1F4DA1">D&#8321;</text>
  <line x1="210" y1="150" x2="580" y2="400" stroke="#1F4DA1" stroke-width="2.6"/>
  <text x="586" y="402" font-size="13" fill="#1F4DA1">D&#8322;</text>
  <line x1="190" y1="180" x2="245" y2="180" stroke="#222" stroke-width="1.6" marker-end="url(#shift)"/>

  <!-- Equilibria: interest rate rises r1 -> r2 -->
  <line x1="80" y1="283" x2="327" y2="283" stroke="#777" stroke-width="1" stroke-dasharray="5,4"/>
  <line x1="80" y1="255" x2="366" y2="255" stroke="#777" stroke-width="1" stroke-dasharray="5,4"/>
  <circle cx="327" cy="283" r="4.5" fill="#222"/>
  <circle cx="366" cy="255" r="4.5" fill="#222"/>
  <text x="74" y="287" text-anchor="end" font-size="13" fill="#222">r<tspan font-size="10" dy="3">1</tspan></text>
  <text x="74" y="259" text-anchor="end" font-size="13" fill="#222">r<tspan font-size="10" dy="3">2</tspan></text>
  <text x="300" y="488" text-anchor="middle" font-size="12" fill="#444">Government borrowing raises r, crowding out private investment</text>
</svg>
