<svg xmlns="http://www.w3.org/2000/svg" width="680" height="540" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <marker id="axarrow" markerWidth="10" markerHeight="10" refX="6" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#222"/></marker>
  </defs>

  <line x1="80" y1="440" x2="635" y2="440" stroke="#222" stroke-width="1.8" marker-end="url(#axarrow)"/>
  <line x1="80" y1="440" x2="80" y2="55" stroke="#222" stroke-width="1.8" marker-end="url(#axarrow)"/>
  <text transform="rotate(-90 30 250)" x="30" y="250" text-anchor="middle" font-size="14" fill="#222">Capital goods</text>
  <text x="628" y="468" text-anchor="end" font-size="14" fill="#222">Consumer goods</text>
  <text x="70" y="460" text-anchor="end" font-size="13" fill="#222">0</text>

  <!-- PPC -->
  <path d="M 80 150 Q 400 200 540 440" fill="none" stroke="#1F4DA1" stroke-width="2.6"/>
  <text x="150" y="200" font-size="13" font-weight="bold" fill="#1F4DA1">PPC</text>

  <!-- Allocations: a, b, c on the curve; d outside (unattainable); e inside (inefficient) -->
  <circle cx="229" cy="187" r="4.5" fill="#222"/><text x="222" y="178" text-anchor="end" font-size="13" font-weight="bold" fill="#222">a</text>
  <circle cx="355" cy="247" r="4.5" fill="#222"/><text x="348" y="240" text-anchor="end" font-size="13" font-weight="bold" fill="#222">b</text>
  <circle cx="448" cy="320" r="4.5" fill="#222"/><text x="441" y="314" text-anchor="end" font-size="13" font-weight="bold" fill="#222">c</text>
  <circle cx="478" cy="205" r="4.5" fill="#C0392B"/><text x="488" y="201" font-size="13" font-weight="bold" fill="#C0392B">d</text>
  <circle cx="250" cy="330" r="4.5" fill="#C0392B"/><text x="260" y="334" font-size="13" font-weight="bold" fill="#C0392B">e</text>

  <text x="488" y="221" font-size="11" fill="#C0392B">unattainable</text>
  <text x="260" y="350" font-size="11" fill="#C0392B">inefficient</text>
</svg>
