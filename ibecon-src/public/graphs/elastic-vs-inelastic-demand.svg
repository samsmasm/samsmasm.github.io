<svg xmlns="http://www.w3.org/2000/svg" width="680" height="560" font-family="Georgia, serif">
  <text x="340" y="36" text-anchor="middle" font-size="16" font-weight="bold" fill="#222">Elastic vs inelastic demand</text>

  <!-- Axes -->
  <line x1="90" y1="60" x2="90" y2="470" stroke="#333" stroke-width="2"/>
  <line x1="90" y1="470" x2="610" y2="470" stroke="#333" stroke-width="2"/>
  <text transform="rotate(-90 30 140)" x="30" y="140" text-anchor="middle" font-size="13" fill="#333">Price ($/unit)</text>
  <text x="608" y="492" text-anchor="end" font-size="13" fill="#333">Quantity (units/week)</text>

  <!-- Inelastic (steep) demand -->
  <line x1="340" y1="90" x2="390" y2="440" stroke="#0D5C57" stroke-width="2.5"/>
  <text x="348" y="86" font-size="12" font-style="italic" fill="#0D5C57">D (inelastic)</text>

  <!-- Elastic (flat) demand -->
  <line x1="110" y1="200" x2="580" y2="330" stroke="#14746F" stroke-width="2.5"/>
  <text x="586" y="330" font-size="12" font-style="italic" fill="#14746F">D (elastic)</text>

  <!-- Price change reference lines (P1 high, P2 low) -->
  <line x1="90" y1="230" x2="472" y2="230" stroke="#888" stroke-width="1" stroke-dasharray="5,4"/>
  <line x1="90" y1="300" x2="472" y2="300" stroke="#888" stroke-width="1" stroke-dasharray="5,4"/>
  <text x="78" y="234" text-anchor="end" font-size="11" fill="#333">P&#8321;</text>
  <text x="78" y="304" text-anchor="end" font-size="11" fill="#333">P&#8322;</text>

  <!-- Delta P bracket -->
  <line x1="52" y1="230" x2="52" y2="300" stroke="#888" stroke-width="1.2"/>
  <text transform="rotate(-90 42 265)" x="42" y="265" text-anchor="middle" font-size="10" fill="#888">&#916;P</text>

  <!-- Dots -->
  <circle cx="360" cy="230" r="3" fill="#0D5C57"/>
  <circle cx="370" cy="300" r="3" fill="#0D5C57"/>
  <circle cx="219" cy="230" r="3" fill="#14746F"/>
  <circle cx="472" cy="300" r="3" fill="#14746F"/>

  <!-- Vertical drop lines -->
  <line x1="360" y1="230" x2="360" y2="470" stroke="#0D5C57" stroke-width="1" stroke-dasharray="3,4"/>
  <line x1="370" y1="300" x2="370" y2="470" stroke="#0D5C57" stroke-width="1" stroke-dasharray="3,4"/>
  <line x1="219" y1="230" x2="219" y2="470" stroke="#14746F" stroke-width="1" stroke-dasharray="3,4"/>
  <line x1="472" y1="300" x2="472" y2="470" stroke="#14746F" stroke-width="1" stroke-dasharray="3,4"/>

  <!-- Delta Q small (inelastic) -->
  <line x1="360" y1="486" x2="370" y2="486" stroke="#0D5C57" stroke-width="1.5"/>
  <line x1="360" y1="482" x2="360" y2="490" stroke="#0D5C57" stroke-width="1.5"/>
  <line x1="370" y1="482" x2="370" y2="490" stroke="#0D5C57" stroke-width="1.5"/>
  <text x="365" y="503" text-anchor="middle" font-size="10" fill="#0D5C57">&#916;Q small</text>

  <!-- Delta Q large (elastic) -->
  <line x1="219" y1="520" x2="472" y2="520" stroke="#14746F" stroke-width="1.5"/>
  <line x1="219" y1="516" x2="219" y2="524" stroke="#14746F" stroke-width="1.5"/>
  <line x1="472" y1="516" x2="472" y2="524" stroke="#14746F" stroke-width="1.5"/>
  <text x="345" y="537" text-anchor="middle" font-size="10" fill="#14746F">&#916;Q large</text>
</svg>
