<svg xmlns="http://www.w3.org/2000/svg" width="680" height="540" font-family="Georgia, serif">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="8.5" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#0D5C57"/>
    </marker>
  </defs>

  <text x="340" y="36" text-anchor="middle" font-size="16" font-weight="bold" fill="#222">Increase in demand (rightward shift)</text>

  <!-- Axes -->
  <line x1="90" y1="60" x2="90" y2="470" stroke="#333" stroke-width="2"/>
  <line x1="90" y1="470" x2="610" y2="470" stroke="#333" stroke-width="2"/>

  <!-- Axis labels at the ends -->
  <text transform="rotate(-90 30 140)" x="30" y="140" text-anchor="middle" font-size="13" fill="#333">Price ($/unit)</text>
  <text x="608" y="492" text-anchor="end" font-size="13" fill="#333">Quantity (units/week)</text>

  <!-- D1 (original, dashed) -->
  <line x1="140" y1="100" x2="430" y2="440" stroke="#14746F" stroke-width="2.5" stroke-dasharray="6,4"/>
  <text x="424" y="458" text-anchor="middle" font-size="14" fill="#14746F">D&#8321;</text>

  <!-- D2 (new, solid) -->
  <line x1="270" y1="100" x2="560" y2="440" stroke="#14746F" stroke-width="2.5"/>
  <text x="560" y="458" text-anchor="middle" font-size="14" fill="#14746F">D&#8322;</text>

  <!-- Shift arrow -->
  <line x1="295" y1="270" x2="395" y2="270" stroke="#0D5C57" stroke-width="1.8" marker-end="url(#arrowhead)"/>
</svg>
