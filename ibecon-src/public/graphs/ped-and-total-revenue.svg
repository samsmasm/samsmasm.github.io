<svg xmlns="http://www.w3.org/2000/svg" width="680" height="540" font-family="Georgia, serif">
  <text x="340" y="36" text-anchor="middle" font-size="16" font-weight="bold" fill="#222">PED and total revenue</text>

  <!-- TR rectangles (TR2 larger, drawn first; TR1 on top) -->
  <rect x="90" y="300" width="430" height="170" fill="#2E86C1" fill-opacity="0.22" stroke="#2E86C1" stroke-width="1"/>
  <rect x="90" y="170" width="90" height="300" fill="#E67E22" fill-opacity="0.30" stroke="#E67E22" stroke-width="1"/>

  <!-- Axes -->
  <line x1="90" y1="60" x2="90" y2="470" stroke="#333" stroke-width="2"/>
  <line x1="90" y1="470" x2="610" y2="470" stroke="#333" stroke-width="2"/>

  <!-- Axis labels at the ends -->
  <text transform="rotate(-90 30 140)" x="30" y="140" text-anchor="middle" font-size="13" fill="#333">Price ($/unit)</text>
  <text x="608" y="512" text-anchor="end" font-size="13" fill="#333">Quantity (units/week)</text>

  <!-- Demand curve (flat = elastic) -->
  <line x1="110" y1="143" x2="590" y2="327" stroke="#14746F" stroke-width="2.5"/>
  <text x="596" y="329" font-size="14" fill="#14746F">D</text>

  <!-- Reference lines for point A (P1, Q1) -->
  <line x1="90" y1="170" x2="180" y2="170" stroke="#888" stroke-width="1.1" stroke-dasharray="5,4"/>
  <line x1="180" y1="170" x2="180" y2="470" stroke="#888" stroke-width="1.1" stroke-dasharray="5,4"/>
  <!-- Reference lines for point B (P2, Q2) -->
  <line x1="90" y1="300" x2="520" y2="300" stroke="#888" stroke-width="1.1" stroke-dasharray="5,4"/>
  <line x1="520" y1="300" x2="520" y2="470" stroke="#888" stroke-width="1.1" stroke-dasharray="5,4"/>

  <circle cx="180" cy="170" r="4" fill="#333"/>
  <circle cx="520" cy="300" r="4" fill="#333"/>

  <text x="78" y="174" text-anchor="end" font-size="13" fill="#333">P&#8321;</text>
  <text x="78" y="304" text-anchor="end" font-size="13" fill="#333">P&#8322;</text>
  <text x="180" y="492" text-anchor="middle" font-size="13" fill="#333">Q&#8321;</text>
  <text x="520" y="492" text-anchor="middle" font-size="13" fill="#333">Q&#8322;</text>

  <!-- TR labels -->
  <text x="135" y="240" text-anchor="middle" font-size="13" font-weight="bold" fill="#B9591A">TR&#8321;</text>
  <text x="445" y="395" text-anchor="middle" font-size="13" font-weight="bold" fill="#21618C">TR&#8322;</text>

  <!-- Caption -->
  <text x="600" y="96" text-anchor="end" font-size="12" fill="#555">Price falls, TR rises</text>
  <text x="600" y="112" text-anchor="end" font-size="12" fill="#555">(elastic demand)</text>
</svg>
