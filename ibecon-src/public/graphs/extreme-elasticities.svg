<svg xmlns="http://www.w3.org/2000/svg" width="780" height="620" font-family="Georgia, serif">
  <text x="390" y="30" text-anchor="middle" font-size="16" font-weight="bold" fill="#222">Extreme elasticities</text>

  <!-- ===== Perfectly inelastic demand ===== -->
  <g transform="translate(20,55)">
    <line x1="60" y1="30" x2="60" y2="220" stroke="#333" stroke-width="1.8"/>
    <line x1="60" y1="220" x2="320" y2="220" stroke="#333" stroke-width="1.8"/>
    <text x="52" y="34" text-anchor="end" font-size="11" fill="#333">P</text>
    <text x="324" y="236" font-size="11" fill="#333">Q</text>
    <line x1="180" y1="40" x2="180" y2="220" stroke="#14746F" stroke-width="2.5"/>
    <text x="186" y="48" font-size="12" font-style="italic" fill="#14746F">D</text>
    <text x="190" y="252" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#333">Perfectly inelastic demand (PED = 0)</text>
  </g>

  <!-- ===== Perfectly elastic demand ===== -->
  <g transform="translate(400,55)">
    <line x1="60" y1="30" x2="60" y2="220" stroke="#333" stroke-width="1.8"/>
    <line x1="60" y1="220" x2="320" y2="220" stroke="#333" stroke-width="1.8"/>
    <text x="52" y="34" text-anchor="end" font-size="11" fill="#333">P</text>
    <text x="324" y="236" font-size="11" fill="#333">Q</text>
    <line x1="60" y1="120" x2="300" y2="120" stroke="#14746F" stroke-width="2.5"/>
    <text x="304" y="116" font-size="12" font-style="italic" fill="#14746F">D</text>
    <text x="190" y="252" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#333">Perfectly elastic demand (PED = &#8734;)</text>
  </g>

  <!-- ===== Perfectly inelastic supply ===== -->
  <g transform="translate(20,335)">
    <line x1="60" y1="30" x2="60" y2="220" stroke="#333" stroke-width="1.8"/>
    <line x1="60" y1="220" x2="320" y2="220" stroke="#333" stroke-width="1.8"/>
    <text x="52" y="34" text-anchor="end" font-size="11" fill="#333">P</text>
    <text x="324" y="236" font-size="11" fill="#333">Q</text>
    <line x1="180" y1="40" x2="180" y2="220" stroke="#0D5C57" stroke-width="2.5"/>
    <text x="186" y="48" font-size="12" font-style="italic" fill="#0D5C57">S</text>
    <text x="190" y="252" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#333">Perfectly inelastic supply (PES = 0)</text>
  </g>

  <!-- ===== Perfectly elastic supply ===== -->
  <g transform="translate(400,335)">
    <line x1="60" y1="30" x2="60" y2="220" stroke="#333" stroke-width="1.8"/>
    <line x1="60" y1="220" x2="320" y2="220" stroke="#333" stroke-width="1.8"/>
    <text x="52" y="34" text-anchor="end" font-size="11" fill="#333">P</text>
    <text x="324" y="236" font-size="11" fill="#333">Q</text>
    <line x1="60" y1="120" x2="300" y2="120" stroke="#0D5C57" stroke-width="2.5"/>
    <text x="304" y="116" font-size="12" font-style="italic" fill="#0D5C57">S</text>
    <text x="190" y="252" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#333">Perfectly elastic supply (PES = &#8734;)</text>
  </g>
</svg>
