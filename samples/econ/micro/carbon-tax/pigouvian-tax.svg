<svg xmlns="http://www.w3.org/2000/svg" width="680" height="540" font-family="Georgia, serif">
  <defs>
    <marker id="ah" markerWidth="9" markerHeight="9" refX="4.5" refY="4.5" orient="auto-start-reverse">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#333"/>
    </marker>
  </defs>
  <text x="340" y="36" text-anchor="middle" font-size="16" font-weight="bold" fill="#222">Pigouvian tax on a negative production externality</text>

  <!-- Tax revenue box (drawn first) -->
  <rect x="90" y="275" width="240" height="130" fill="#14746F" fill-opacity="0.15"/>
  <text x="160" y="298" text-anchor="middle" font-size="12" font-weight="bold" fill="#0D5C57">Tax revenue</text>
  <text x="160" y="314" text-anchor="middle" font-size="11" fill="#0D5C57">= tax × Q*</text>

  <!-- Axes -->
  <line x1="90" y1="60" x2="90" y2="470" stroke="#333" stroke-width="2"/>
  <line x1="90" y1="470" x2="610" y2="470" stroke="#333" stroke-width="2"/>
  <text transform="rotate(-90 30 175)" x="30" y="175" text-anchor="middle" font-size="13" fill="#333">Price / Cost / Benefit</text>
  <text x="608" y="492" text-anchor="end" font-size="13" fill="#333">Quantity (units/week)</text>

  <!-- Curves -->
  <line x1="90" y1="145" x2="570" y2="405" stroke="#14746F" stroke-width="2.5"/>
  <text x="576" y="409" font-size="12" font-style="italic" fill="#14746F">MSB = demand</text>
  <line x1="210" y1="470" x2="570" y2="275" stroke="#0D5C57" stroke-width="2.5"/>
  <text x="576" y="279" font-size="12" font-style="italic" fill="#0D5C57">MPC = supply</text>
  <line x1="90" y1="405" x2="570" y2="145" stroke="#C0392B" stroke-width="2.5"/>
  <line x1="90" y1="405" x2="570" y2="145" stroke="#0D5C57" stroke-width="1.2" stroke-dasharray="7,6"/>
  <text x="576" y="142" font-size="12" font-style="italic" fill="#C0392B">MSC =</text>
  <text x="576" y="157" font-size="12" font-style="italic" fill="#0D5C57">MPC + tax</text>

  <!-- Size of tax = external cost -->
  <line x1="520" y1="178" x2="520" y2="296" stroke="#333" stroke-width="1.4" marker-start="url(#ah)" marker-end="url(#ah)"/>
  <text x="528" y="232" font-size="11" fill="#333">tax =</text>
  <text x="528" y="246" font-size="11" fill="#333">external cost</text>

  <!-- Market equilibrium (before tax) -->
  <line x1="90" y1="340" x2="450" y2="340" stroke="#bbb" stroke-width="1.1" stroke-dasharray="5,4"/>
  <line x1="450" y1="340" x2="450" y2="470" stroke="#bbb" stroke-width="1.1" stroke-dasharray="5,4"/>
  <circle cx="450" cy="340" r="4.5" fill="#888"/>
  <text x="78" y="344" text-anchor="end" font-size="12" fill="#777">Pm</text>
  <text x="450" y="492" text-anchor="middle" font-size="12" fill="#777">Qm</text>

  <!-- Social optimum (after tax) -->
  <line x1="90" y1="275" x2="330" y2="275" stroke="#888" stroke-width="1.1" stroke-dasharray="5,4"/>
  <line x1="330" y1="275" x2="330" y2="470" stroke="#888" stroke-width="1.1" stroke-dasharray="5,4"/>
  <line x1="90" y1="405" x2="330" y2="405" stroke="#888" stroke-width="1.1" stroke-dasharray="5,4"/>
  <circle cx="330" cy="275" r="4.5" fill="#0D5C57"/>
  <circle cx="330" cy="405" r="4" fill="#0D5C57"/>
  <text x="78" y="279" text-anchor="end" font-size="12" fill="#0D5C57">P* = Pc</text>
  <text x="78" y="409" text-anchor="end" font-size="12" fill="#0D5C57">Pp</text>
  <text x="330" y="492" text-anchor="middle" font-size="12" fill="#0D5C57">Q*</text>

  <!-- Output falls to the social optimum -->
  <line x1="438" y1="513" x2="342" y2="513" stroke="#333" stroke-width="1.5" marker-end="url(#ah)"/>
  <text x="390" y="531" text-anchor="middle" font-size="12" font-weight="bold" fill="#333">Overproduction removed</text>
</svg>
