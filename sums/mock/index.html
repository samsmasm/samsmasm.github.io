<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Sums map (mock)</title>
<style>
  :root { --ink: #111; --paper: #fff; --line: #d4d4d4; --faint: #888; --right: #1d6b35; --head: 52px; }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body { background: var(--paper); color: var(--ink); font: 16px/1.3 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
         -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; }
  button { font: inherit; color: var(--ink); background: var(--paper); border: 1.5px solid var(--ink); border-radius: 4px;
           padding: 6px 12px; cursor: pointer; touch-action: manipulation; }
  button:active { background: #eee; }
  [hidden] { display: none !important; }
  header { position: sticky; top: 0; z-index: 3; background: var(--paper); height: var(--head); display: flex; align-items: center; gap: 8px;
           padding: 0 12px; border-bottom: 1.5px solid var(--ink); }
  header h1 { font-size: 20px; margin: 0 0 0 4px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .spacer { margin-left: auto; }
  .mocknote { background: #f3f3f3; color: #555; font-size: 14px; padding: 6px 12px; text-align: center; }
  main { padding: 22px 16px 60px; }
  .inner { max-width: 760px; margin: 0 auto; }
  .ask { font-size: 26px; font-weight: 700; margin: 4px 0 14px; }
  h2 { font-size: 18px; margin: 28px 0 10px; color: var(--faint); font-weight: 600; }

  /* year chips: which column of the map home is showing */
  .years { display: flex; gap: 8px; margin: 0 0 18px; align-items: center; flex-wrap: wrap; }
  .years span { color: var(--faint); margin-right: 2px; }
  .chip { width: 44px; height: 44px; padding: 0; border-radius: 50%; font-size: 20px; font-weight: 700; }
  .chip[aria-pressed="true"] { background: var(--ink); color: var(--paper); }

  .tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 14px; }
  .tile { border: 1.5px solid var(--ink); border-radius: 14px; padding: 14px 10px 10px; display: flex; flex-direction: column;
          align-items: center; gap: 6px; text-align: center; cursor: pointer; }
  .tile .pic { width: 100%; max-width: 150px; height: 84px; display: flex; align-items: center; justify-content: center; }
  .tile .pic svg { width: 100% !important; height: 100% !important; }
  .tile .nm { font-size: 20px; font-weight: 700; }
  .tile .lv { font-size: 15px; min-height: 1.2em; }
  .tile .sub { font-size: 14px; color: var(--faint); min-height: 1.2em; font-variant-numeric: tabular-nums; }

  /* steps on a tile: one dot per year this skill has */
  .steps { display: flex; gap: 6px; margin-top: 2px; }
  .step { width: 34px; height: 34px; padding: 0; border-radius: 50%; font-size: 15px; font-weight: 700; position: relative; }
  .step.gap { visibility: hidden; }
  .step[aria-pressed="true"] { background: var(--ink); color: var(--paper); }
  .step.done::after { content: ""; position: absolute; right: -3px; top: -3px; width: 12px; height: 12px; border-radius: 50%;
                      background: var(--right); border: 2px solid var(--paper); }

  /* the map */
  .mapwrap { overflow-x: auto; margin: 0 -16px; padding: 0 16px; }
  table.map { border-collapse: separate; border-spacing: 6px; min-width: 600px; width: 100%; }
  .map th { font-size: 15px; font-weight: 700; padding: 4px; }
  .map th.col { width: 16%; }
  .map th.col.mine { background: var(--ink); color: var(--paper); border-radius: 8px; }
  .map th.row { text-align: left; font-size: 15px; white-space: nowrap; position: sticky; left: 0; background: var(--paper); z-index: 1; }  .map th.row .rp { display: inline-block; width: 46px; height: 32px; vertical-align: middle; margin-right: 8px; }
  .map th.row .rp svg { width: 100% !important; height: 100% !important; }
  .cell { width: 100%; min-height: 58px; padding: 6px 4px; border-radius: 8px; font-size: 13px; line-height: 1.2;
          display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; position: relative; }
  .cell .t { font-variant-numeric: tabular-nums; color: var(--faint); font-size: 12px; }
  .cell.done { border-color: var(--right); border-width: 2.5px; }
  .cell.done .t { color: var(--right); font-weight: 700; }
  .cell.now { background: var(--ink); color: var(--paper); }
  .cell.now .t { color: #ccc; }
  .cell.todo { border-style: dashed; border-color: var(--faint); color: var(--faint); cursor: default; }
  .key { display: flex; flex-wrap: wrap; gap: 14px; font-size: 14px; color: var(--faint); margin-top: 12px; }
  .key i { display: inline-block; width: 18px; height: 14px; border-radius: 4px; border: 1.5px solid var(--ink); vertical-align: -2px; margin-right: 4px; }
  .key i.d { border: 2.5px solid var(--right); }
  .key i.n { background: var(--ink); }
  .key i.x { border-style: dashed; border-color: var(--faint); }

  #toast { position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%); background: var(--ink); color: var(--paper);
           padding: 10px 16px; border-radius: 8px; font-size: 15px; max-width: calc(100vw - 32px); text-align: center; z-index: 9; }
  @media (max-width: 600px) { .map th.row { white-space: normal; width: 90px; font-size: 13px; } .map th.row .rp { display: none; } }
</style>
</head>
<body>
<div class="mocknote">Mock-up: not wired to the real Sums. Sample player, sample times.</div>
<header>
  <button id="toNames">‹ Names</button>
  <h1 id="title">Ana · Year 3</h1>
  <span class="spacer"></span>
  <button id="toMap">Map</button>
</header>

<main>
  <section id="home" class="inner">
    <div class="ask">What do you want to do today?</div>
    <div class="years" id="years"><span>Year</span></div>
    <div class="tiles" id="tiles"></div>
    <h2 id="keepH">Keep going</h2>
    <div class="tiles" id="keep"></div>
  </section>

  <section id="map" class="inner" hidden>
    <div class="ask">Map</div>
    <div class="mapwrap"><table class="map" id="mapT"></table></div>
    <div class="key"><span><i class="d"></i>done (best time)</span><span><i class="n"></i>where she is</span><span><i></i>not tried</span><span><i class="x"></i>not built yet</span></div>
  </section>
</main>
<div id="toast" hidden></div>

<script>
// Years 1-4, then 5 = "More" (past Year 4).
const COLS = [1, 2, 3, 4, 5];
const colName = y => y === 5 ? 'More' : 'Year ' + y;
const chipName = y => y === 5 ? '+' : String(y);

// Each activity's level for each year (from sums/CURRICULUM.md). todo = not built yet.
const LEVELS = {
  addsub:  { 1: 'within 20', 2: 'within 100', 3: 'within 1,000', 4: 'four digits' },
  muldiv:  { 1: 'groups to 20', 2: '2s, 5s, 10s', 3: '3s, 4s, 8s too', 4: 'all tables, bigger' },
  howmany: { 1: 'up to 20' },
  bonds:   { 1: 'to 10', 2: 'to 20' },
  teens:   { 1: '11 to 19' },
  make10:  { 1: 'make 10' },
  missing: { 1: '4 + ☐ = 9', 2: 'to 100', 3: '+ − × ÷', 4: 'to 10,000' },
  arrays:  { 1: 'to 20', 2: 'to 50', 3: 'to 100' },
  pv:      { 1: 'tens and ones', 2: 'to 120', 3: 'to 1,000', 4: { t: 'to 10,000', todo: true } },
  nline:   { 1: '2s and 10s', 2: '5s', 3: '100s' },
  area:    { 2: 'perimeter', 3: 'count squares', 4: 'multiply sides' },
  tbond:   { 2: '2, 5, 10', 3: '3, 4, 8', 4: '2 to 10', 5: '11 and 12' },
  frac:    { 1: 'halves, quarters', 2: 'thirds', 3: '5ths to 12ths', 4: 'equal fractions' },
  clock:   { 1: "o'clock", 2: 'half, quarter', 3: '5 minutes', 4: 'any minute' },
  money:   { 1: 'dollars to $10', 2: 'coins or notes', 3: 'dollars and cents' },
  seq:     { 1: '1s, 2s, 10s', 2: '3s, 5s, to 120', 3: '4s, 8s, 100s' },
  dbl:     { 1: 'to 10, dots', 2: 'to 20', 3: 'bigger numbers' },
  story:   { 1: 'within 20', 2: 'within 100', 3: 'within 1,000' },
  graph:   { 1: 'picture graphs', 2: 'tally charts', 3: 'bar graphs' },
  shape:   { 1: 'triangles, squares', 2: 'to 6 sides, 3D', 3: 'to 10 sides, symmetry' },
  ruler:   { 1: 'blocks', 2: 'cm from 0', 3: 'cm, not from 0' },
  tgrid:   { 3: '2, 3, 4, 5, 8, 10', 4: '2 to 10', 5: '12 × 12' },
};
const lv = (a, y) => { const v = LEVELS[a][y]; return v == null ? null : typeof v === 'string' ? { t: v } : v; };
const yearsOf = a => COLS.filter(y => lv(a, y));

// Sample player: Year 3, a few done, a couple stretched up.
const P = {
  year: 3,
  at: { addsub: 3, muldiv: 3, seq: 3, dbl: 3, story: 2, graph: 3, shape: 3, ruler: 3, missing: 4, arrays: 3, pv: 3, nline: 3, area: 3, tbond: 3, frac: 3, clock: 3, money: 3, tgrid: 3, bonds: 2 },
  best: { 'addsub|2': '2:41', 'addsub|3': '4:05', 'story|1': '3:30', 'missing|3': '3:12', 'bonds|2': '1:58', 'arrays|2': '1:30', 'tbond|2': '1:22', 'frac|2': '2:10', 'nline|2': '1:47' },
  recent: ['bonds'],   // played lately, from other years: stays under Keep going
};
let view = P.year;   // which year column home is showing
let PICS = {};

const $ = id => document.getElementById(id);
const toast = msg => { const t = $('toast'); t.textContent = msg; t.hidden = false; clearTimeout(toast.h); toast.h = setTimeout(() => t.hidden = true, 2200); };

function stepsHtml(a, sel) {
  return '<div class="steps">' + yearsOf(a).map(y => {
    const L = lv(a, y);
    const done = P.best[a + '|' + y] ? ' done' : '';
    return `<button class="step${done}" data-a="${a}" data-y="${y}" aria-pressed="${y === sel}" ${L.todo ? 'disabled' : ''}>${chipName(y)}</button>`;
  }).join('') + '</div>';
}

function tile(a, y) {
  const L = lv(a, y), best = P.best[a + '|' + y];
  return `<div class="tile" data-a="${a}" data-y="${y}">
    <div class="pic">${PICS[a].pic}</div>
    <div class="nm">${PICS[a].name}</div>
    <div class="lv">${L.t}</div>
    <div class="sub">${best ? 'Best ' + best : '&nbsp;'}</div>
    ${stepsHtml(a, y)}
  </div>`;
}

function drawHome() {
  $('years').innerHTML = '<span>Year</span>' + COLS.map(y =>
    `<button class="chip" data-y="${y}" aria-pressed="${y === view}">${chipName(y)}</button>`).join('');
  const here = Object.keys(LEVELS).filter(a => lv(a, view) && !lv(a, view).todo);
  // her own level in a skill wins if she has moved it, otherwise the year shown
  $('tiles').innerHTML = here.map(a => tile(a, view === P.year && P.at[a] && lv(a, P.at[a]) ? P.at[a] : view)).join('');
  const keep = P.recent.filter(a => !here.includes(a));
  $('keep').innerHTML = keep.map(a => tile(a, P.at[a] || yearsOf(a).pop())).join('');
  $('keepH').hidden = !keep.length;
}

function drawMap() {
  let h = '<tr><th></th>' + COLS.map(y => `<th class="col${y === P.year ? ' mine' : ''}">${colName(y)}</th>`).join('') + '</tr>';
  for (const a of Object.keys(LEVELS)) {
    h += `<tr><th class="row"><span class="rp">${PICS[a].pic}</span>${PICS[a].name}</th>`;
    for (const y of COLS) {
      const L = lv(a, y);
      if (!L) { h += '<td></td>'; continue; }
      const best = P.best[a + '|' + y];
      const cls = L.todo ? 'todo' : P.at[a] === y ? 'now' : best ? 'done' : '';
      h += `<td><button class="cell ${cls}" data-a="${a}" data-y="${y}" ${L.todo ? 'disabled' : ''}>${L.t}${best ? `<span class="t">${best}</span>` : ''}${L.todo ? '<span class="t">not built</span>' : ''}</button></td>`;
    }
    h += '</tr>';
  }
  $('mapT').innerHTML = h;
}

function show(which) {
  $('home').hidden = which !== 'home';
  $('map').hidden = which !== 'map';
  $('toMap').textContent = which === 'map' ? '‹ Home' : 'Map';
  if (which === 'map') drawMap(); else drawHome();
  scrollTo(0, 0);
}

document.addEventListener('click', e => {
  const t = e.target.closest('button, .tile');
  if (!t) return;
  if (t.id === 'toMap') return show($('map').hidden ? 'map' : 'home');
  if (t.id === 'toNames') return toast('Back to the names screen');
  if (t.classList.contains('chip')) { view = +t.dataset.y; return drawHome(); }
  const a = t.dataset.a, y = +t.dataset.y;
  if (t.classList.contains('step')) { P.at[a] = y; return drawHome(); }
  if (t.classList.contains('cell')) { P.at[a] = y; drawMap(); return toast(`Would start ${PICS[a].name}, ${colName(y)}: ${lv(a, y).t}`); }
  if (t.classList.contains('tile')) return toast(`Would open ${PICS[a].name} choices, set to ${colName(y)}: ${lv(a, y).t}`);
});

fetch('pics.json').then(r => r.json()).then(p => { PICS = p; show('home'); });
</script>
</body>
</html>
