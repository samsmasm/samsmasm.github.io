<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Sums</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23fff'/%3E%3Cpath d='M16 7v18M7 16h18' stroke='%23000' stroke-width='4'/%3E%3C/svg%3E">
<style>
  :root {
    --ink: #111; --paper: #fff; --line: #d4d4d4; --faint: #888;
    --right: #1d6b35; --wrong: #a3201b;
    --head: 52px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--paper); color: var(--ink);
    font: 16px/1.3 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    -webkit-user-select: none; user-select: none;
    -webkit-tap-highlight-color: transparent;
    min-height: 100dvh;
  }
  /* the front screens scroll the page itself (Sam: Firefox would not scroll
     the home tiles inside a fixed panel); sheets and the grid lock it */
  body.lock { overflow: hidden; height: 100dvh; }
  button {
    font: inherit; color: var(--ink); background: var(--paper);
    border: 1.5px solid var(--ink); border-radius: 4px;
    padding: 6px 12px; cursor: pointer; touch-action: manipulation;
  }
  button:active { background: #eee; }
  button.primary { background: var(--ink); color: var(--paper); }
  button.primary:active { background: #333; }
  button:disabled { opacity: .35; cursor: default; }
  [hidden] { display: none !important; }

  header {
    position: sticky; top: 0; z-index: 10; background: var(--paper);
    height: var(--head); display: flex; align-items: center; gap: 8px;
    padding: 0 max(12px, env(safe-area-inset-right)) 0 max(12px, env(safe-area-inset-left));
    border-bottom: 1.5px solid var(--ink);
  }
  header h1 { font-size: 20px; margin: 0 0 0 4px; font-weight: 700; letter-spacing: .02em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #score { margin-left: auto; font-variant-numeric: tabular-nums; white-space: nowrap; text-align: right; }
  #score b { font-size: 20px; }
  #sayBtn { padding: 4px 10px; line-height: 0; }
  #sayBtn svg { width: 24px; height: 24px; }
  .spacer { margin-left: auto; }
  .hint.linkHint { font-size: 16px; color: var(--ink); margin: -6px 0 16px; }
  /* phones: a sheet's header is already full, so the report flag only shows on the other screens */
  @media (max-width: 600px) { body.lock header .rptBtn { display: none; } }
  @media (max-width: 600px) { .wide { display: none; } header h1.sheetTitle { display: none; } }

  /* full-page screens under the header */
  .panel { background: var(--paper); padding: 22px 16px 40px; }
  .inner { max-width: 760px; margin: 0 auto; }
  .ask { font-size: 26px; font-weight: 700; margin: 4px 0 18px; }
  .tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 14px; }
  .tile {
    border: 1.5px solid var(--ink); border-radius: 14px; padding: 14px 12px 12px;
    display: flex; flex-direction: column; align-items: center; gap: 8px; min-height: 150px;
    justify-content: center; text-align: center;
  }
  .tile .pic { width: 100%; max-width: 150px; height: 84px; display: flex; align-items: center; justify-content: center; }
  .tile .pic svg { width: 100% !important; height: 100% !important; }
  .tile .nm { font-size: 20px; font-weight: 700; }
  .tile .sub { font-size: 14px; color: var(--faint); font-variant-numeric: tabular-nums; min-height: 1.2em; }
  .tile.person .nm { font-size: 28px; }
  .tile.add { border-style: dashed; border-color: var(--faint); color: var(--faint); }
  .tile.add .nm { font-size: 20px; font-weight: 600; }
  .addRow { display: flex; gap: 8px; margin-top: 16px; }
  .addRow input { font: inherit; font-size: 20px; padding: 10px 12px; border: 1.5px solid var(--ink); border-radius: 6px; width: 14em; max-width: 60vw; }
  .addRow button { font-size: 18px; padding: 0 18px; }
  .ages { display: grid; grid-template-columns: repeat(5, minmax(0, 130px)); gap: 14px; }
  .ages .tile { min-height: 120px; gap: 2px; }
  .ages .tile .sub { font-size: 16px; color: inherit; }
  .ages .tile .nm { font-size: 48px; line-height: 1; }
  .ages.small { grid-template-columns: repeat(9, minmax(0, 76px)); gap: 8px; }
  .ages.small .tile { min-height: 0; padding: 8px 4px; }
  .ages.small .tile .nm { font-size: 28px; }
  .ages.small .tile .sub { font-size: 12px; }
  @media (max-width: 700px) { .ages.small { grid-template-columns: repeat(5, minmax(0, 76px)); } }
  /* home: which year's activities, ‹ Year 3 › (swipe works too, and must not be the browser's back swipe) */
  html, body { overscroll-behavior-x: none; }
  #homeS { touch-action: pan-y; }
  .yswitch { display: flex; align-items: center; gap: 12px; margin: -4px 0 18px; }
  .yswitch button { width: 56px; height: 56px; font-size: 30px; line-height: 1; padding: 0; }
  .yswitch button:disabled { opacity: 0.25; }
  .yswitch .yv { font-size: 30px; font-weight: 700; min-width: 4.2em; text-align: center; }
  .yswitch .ymine { font-size: 15px; color: var(--faint); }
  .ydots { display: flex; gap: 6px; }
  .ydots i { width: 10px; height: 10px; border-radius: 50%; border: 1.5px solid var(--ink); }
  .ydots i.on { background: var(--ink); }
  .tile[aria-pressed="true"] { background: var(--ink); color: var(--paper); }
  .tile[aria-pressed="true"] .sub { color: #ccc; }

  .set { margin: 0 0 24px; }
  .set h2 { font-size: 15px; font-weight: 600; margin: 0 0 8px; }
  .opts { display: flex; gap: 8px; flex-wrap: wrap; }
  .opts button { min-width: 56px; min-height: 48px; font-size: 20px; }
  .opts button[aria-pressed="true"] { background: var(--ink); color: var(--paper); }
  .opts button.yrb { display: inline-flex; flex-direction: column; align-items: flex-start; justify-content: center; gap: 1px; padding: 6px 14px; text-align: left; line-height: 1.15; }
  .yrb .yn { font-size: 17px; font-weight: 800; letter-spacing: .01em; }
  .yrb .yx { font-size: 15px; font-weight: 400; opacity: .8; }
  .opts button.sug { position: relative; }
  .opts button.sug::after { content: ""; position: absolute; top: -5px; right: -5px; width: 12px; height: 12px; border-radius: 50%; background: var(--right); border: 2px solid var(--paper); }
  .sughint::before { content: ""; display: inline-block; width: 10px; height: 10px; border-radius: 50%; background: var(--right); margin-right: 6px; }
  .hint { color: var(--faint); font-size: 14px; margin: 6px 0 0; }
  .go { display: flex; gap: 10px; flex-wrap: wrap; }
  .go button { min-height: 48px; padding: 0 22px; font-size: 18px; }
  table { border-collapse: collapse; width: 100%; font-variant-numeric: tabular-nums; }
  td, th { text-align: left; padding: 6px 8px 6px 0; border-bottom: 1px solid var(--line); vertical-align: top; }
  th { font-size: 13px; font-weight: 600; color: var(--faint); }
  td.t { font-weight: 700; white-space: nowrap; }
  .empty { color: var(--faint); }
  #removeBtn, .del { border-color: var(--line); color: var(--faint); font-size: 14px; }
  .del { padding: 2px 8px; }
  .del[data-armed="1"] { color: var(--ink); border-color: var(--ink); }
  #confirmRemoveBtn { border-color: var(--wrong); color: var(--wrong); border-width: 2px; min-height: 48px; padding: 0 18px; }

  /* setup page, laid out like a sum */
  .builder { max-width: 460px; margin: 0 auto; }
  .bline { display: grid; grid-template-columns: 52px auto auto; column-gap: 14px; row-gap: 6px; justify-content: start; margin-bottom: 18px; }
  .lab { font-size: 14px; font-weight: 600; margin-bottom: 2px; }
  .faint { color: var(--faint); font-weight: 400; }
  .kp { display: grid; grid-template-columns: repeat(3, 52px); grid-auto-rows: 52px; gap: 6px; touch-action: none; }
  .kp button, .signs button, .big button { padding: 0; border-color: var(--line); border-radius: 8px; }
  .kp button { font-size: 24px; font-variant-numeric: tabular-nums; }
  .kp .allk { grid-column: span 2; font-size: 16px; }
  .signs { display: grid; grid-auto-rows: 52px; gap: 6px; align-self: end; }
  .signs button { font-size: 30px; line-height: 1; }
  .big { display: grid; grid-auto-rows: 52px; gap: 6px; align-content: start; }
  .big button { padding: 0 12px; font-size: 16px; font-variant-numeric: tabular-nums; }
  .kp button[aria-pressed="true"], .signs button[aria-pressed="true"], .big button[aria-pressed="true"] {
    background: var(--ink); color: var(--paper); border-color: var(--ink);
  }
  /* arrays use the keypads for rows and columns: no signs, no bigger numbers */
  #kpBlock[data-mode="grid"] .signs, #kpBlock[data-mode="grid"] .big, #kpBlock[data-mode="grid"] .biglab { visibility: hidden; }
  #optBlock .set { margin-bottom: 18px; }
  #optBlock .opts button { padding: 0 14px; }
  .brule { border-top: 2px solid var(--ink); margin: 4px 0 16px; }
  .bfoot { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; flex-wrap: wrap; margin-bottom: 18px; }
  .bfoot .opts button { min-width: 52px; min-height: 48px; font-size: 20px; }
  .warn { color: var(--wrong); margin: 0 0 12px; font-size: 15px; }
  .warn:empty { display: none; }
  #preview { display: flex; flex-wrap: wrap; gap: 10px; margin: 6px 0 10px; cursor: pointer; }
  .mini { border: 1.5px solid var(--line); border-radius: 6px; padding: 10px 16px 30px; min-width: 96px; display: flex; justify-content: center; }
  .mini .qv { position: relative !important; inset: auto !important; transform: none !important; font-size: 22px !important; margin-top: .6em; }
  .mini .qv.div { margin-top: 1.4em; }
  .mini .tap .tiles { --tw: 40px; gap: 6px; }
  .mini .tap .tiles.cells { --tw: 16px; }

  /* times grid */
  #gridS { position: fixed; inset: var(--head) 0 0 0; z-index: 5; padding: 12px; overflow: hidden; }
  .gwrap { display: flex; gap: 14px; align-items: flex-start; justify-content: center; height: 100%; }
  @media (orientation: portrait) { .gwrap { flex-direction: column; align-items: center; } .gside { flex-direction: row; } }
  .gside { display: flex; flex-direction: column; align-items: center; gap: 10px; }
  .gtile {
    min-width: 84px; height: 84px; padding: 0 12px; border: 2.5px solid var(--ink); border-radius: 10px;
    display: flex; align-items: center; justify-content: center; font-size: 40px; font-weight: 700;
    font-variant-numeric: tabular-nums; background: var(--paper); touch-action: none; cursor: grab; user-select: none;
  }
  .gtile.dragging { position: fixed; z-index: 20; pointer-events: none; cursor: grabbing; box-shadow: none; opacity: .9; }
  .ghint { color: var(--faint); font-size: 14px; text-align: center; max-width: 9em; }
  .gcount { font-variant-numeric: tabular-nums; font-size: 15px; }
  .tgrid { display: grid; grid-template-columns: repeat(var(--n), var(--cell)); grid-auto-rows: var(--cell); font-variant-numeric: tabular-nums; }
  .tgrid > div { display: flex; align-items: center; justify-content: center; font-size: calc(var(--cell) * .42); }
  .tgrid .gh { font-weight: 700; }
  .tgrid .gh.lit { background: var(--ink); color: var(--paper); border-radius: 4px; }
  .tgrid .gc { border: 1px solid var(--line); margin: -.5px; background: var(--paper); cursor: pointer; }
  .tgrid .gc.off { background: #eee; cursor: default; }
  .tgrid .gc.hover { outline: 2.5px solid var(--ink); outline-offset: -2px; position: relative; z-index: 1; }
  .tgrid .gc.done { font-weight: 700; }
  .tgrid .gc.bad { outline: 3px solid var(--wrong); outline-offset: -2px; position: relative; z-index: 1; }

  /* finished */
  #doneS { position: fixed; inset: var(--head) 0 0 0; z-index: 8; background: rgba(255, 255, 255, .9); display: flex; align-items: center; justify-content: center; padding: 16px; }
  #doneS[hidden] { display: none; }
  .dCard { background: var(--paper); border: 2px solid var(--ink); border-radius: 18px; padding: 26px 24px 16px; width: min(420px, 100%); text-align: center; display: flex; flex-direction: column; align-items: center; gap: 10px; }
  .dTick { position: relative; width: 110px; height: 110px; }
  .dTick svg { position: relative; width: 100%; height: 100%; animation: dPop .5s cubic-bezier(.3, 1.6, .5, 1) both; }
  #dBurst i { position: absolute; left: 50%; top: 50%; width: 12px; height: 12px; margin: -6px; opacity: 0; animation: dBurst .8s ease-out .15s both; }
  @keyframes dPop { 0% { transform: scale(0); } 100% { transform: scale(1); } }
  @keyframes dBurst { 0% { transform: translate(0, 0) scale(.4); opacity: 1; } 70% { opacity: 1; } 100% { transform: translate(var(--x), var(--y)) scale(1); opacity: 0; } }
  @media (prefers-reduced-motion: reduce) { .dTick svg, #dBurst i { animation: none; } }
  #dTitle { font-size: 40px; font-weight: 800; line-height: 1.1; }
  #dStats { font-size: 18px; line-height: 1.5; font-variant-numeric: tabular-nums; }
  #dStats .dTime { font-size: 30px; font-weight: 700; }
  #dStats .dBest { font-weight: 800; color: var(--right); font-size: 22px; }
  .dBtns { display: flex; flex-direction: column; gap: 10px; width: 100%; margin-top: 8px; }
  .dBtns button { min-height: 56px; font-size: 20px; font-weight: 600; border-radius: 10px; }
  #dLook { border: none; background: none; color: var(--faint); text-decoration: underline; font-size: 15px; margin-top: 2px; }

  /* working area: a third of the screen, below the sheet (portrait) or beside it (landscape) */
  #workBtn[aria-pressed="true"] { background: var(--ink); color: var(--paper); }
  #workPanel { position: fixed; z-index: 6; background: var(--paper); display: flex; flex-direction: column; }
  #workPanel .wbar { display: flex; gap: 6px; align-items: center; padding: 4px 8px; border-bottom: 1px solid var(--line); }
  #workPanel .wtitle { font-weight: 700; margin-right: auto; }
  #workPanel .wbar button { border-color: var(--line); padding: 3px 10px; font-size: 14px; }
  #wCanvas { flex: 1; width: 100%; min-height: 0; display: block; touch-action: none; }
  @media (orientation: portrait) {
    #workPanel { left: 0; right: 0; bottom: 0; height: calc((100dvh - var(--head)) / 3); border-top: 2px solid var(--ink); }
    body.working #sheet { height: calc((100dvh - var(--head)) * 2 / 3); }
  }
  @media (orientation: landscape) {
    #workPanel { top: var(--head); right: 0; bottom: 0; width: 33.333vw; border-left: 2px solid var(--ink); }
    body.working #sheet { width: 66.667vw; }
  }

  /* sheet */
  #sheet {
    height: calc(100dvh - var(--head)); overflow: auto;
    display: grid; gap: 10px; padding: 10px;
    padding-bottom: max(10px, env(safe-area-inset-bottom));
    grid-template-columns: repeat(var(--cols), minmax(0, 1fr));
    grid-auto-rows: minmax(190px, 1fr);
  }
  /* how many questions: 4 and 6 (Story sums), 6 and 12 (most), 20 (the keypad Sums only) */
  #sheet[data-n="4"], #sheet[data-n="6"]  { --cols: 2; }
  #sheet[data-n="12"] { --cols: 3; }
  #sheet[data-n="20"] { --cols: 4; }
  @media (orientation: landscape) {
    #sheet[data-n="4"]  { --cols: 2; }
    #sheet[data-n="6"]  { --cols: 3; }
    #sheet[data-n="12"] { --cols: 4; }
    #sheet[data-n="20"] { --cols: 5; }
  }
  @media (orientation: portrait) and (max-width: 560px) {
    #sheet[data-n] { --cols: 2; }
    #sheet.tall { grid-auto-rows: minmax(270px, 1fr); }
  }

  .card {
    border: 1.5px solid var(--line); border-radius: 6px;
    display: flex; flex-direction: column; min-width: 0;
  }
  .work { flex: 1; position: relative; container-type: size; touch-action: none; overflow: hidden; }
  .work canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }

  /* the printed question; --h and --c (height and width in em) are set per card */
  .qv {
    position: absolute; font-weight: 600; line-height: 1.1; pointer-events: none;
    font-variant-numeric: tabular-nums; white-space: nowrap;
    font-size: min(calc(100cqh / var(--h)), calc(100cqw / var(--c)), 64px);
  }
  .qv.col { top: 1.2em; left: 50%; transform: translateX(-50%); width: calc((var(--d) + 1.2) * 1ch); }
  .col .row { display: flex; justify-content: space-between; }
  .col .rule { border-top: .07em solid var(--ink); margin-top: .12em; }
  .qv.div { top: 50%; left: 50%; transform: translate(-50%, -50%); display: flex; align-items: flex-end; }
  .div .dd { position: relative; border-top: .07em solid var(--ink); padding: .1em .15em 0 .5em; margin-left: .12em; }
  .div .br { position: absolute; left: 0; top: -.07em; width: .38em; height: calc(100% + .07em); overflow: visible; }
  /* Year 5: a remainder, "__ r __" written on the bar */
  .qv.div.rem { flex-direction: column; align-items: flex-end; top: .5em; transform: translateX(-50%); }
  .div .dvr { display: flex; align-items: flex-end; }
  .div .rq { display: flex; align-items: flex-end; gap: .1em; margin-bottom: .25em; }
  .div .rq .ln { display: inline-block; height: 1em; border-bottom: .06em solid var(--ink); }
  .div .rq .sep { font-size: .8em; line-height: 1.1; padding: 0 .15em; }
  .pic2 .bx { display: inline-block; width: .95em; height: 1em; border: .07em solid var(--ink); vertical-align: -.12em; border-radius: .08em; }
  .pic2 .ans .bx { margin-right: .2em; }
  .qv.frame { top: .6em; left: 50%; transform: translateX(-50%); display: flex; flex-direction: column; align-items: center; }
  .frame svg { display: block; width: 5.5em; height: 2.2em; margin-bottom: .25em; }
  .frame .cap { font-size: .75em; font-weight: 700; margin-bottom: .35em; }
  .frame .cap b { font-size: 2.2em; line-height: 1; margin-right: .1em; vertical-align: -.08em; }
  .qv.frac { top: .5em; left: 50%; transform: translateX(-50%); display: flex; flex-direction: column; align-items: center; }
  .frac svg { display: block; }
  .frac .fbar { width: 2.4em; border-top: .08em solid var(--ink); margin-top: 1.9em; }
  .qv.bond { top: .4em; left: 50%; transform: translateX(-50%); }
  .bond svg { display: block; width: 6em; height: 5.4em; }
  .flipd { display: inline-block; transform: scaleX(-1); font-weight: 700; }
  .foot .cardsay { padding: 2px 6px; line-height: 0; border-color: var(--line); }
  .foot .cardsay svg { width: 20px; height: 20px; }
  .qv.miss { top: .7em; left: 50%; transform: translateX(-50%); display: flex; flex-direction: column; align-items: center; }
  /* tap cards: the question, then tiles to tap (no writing) */
  .qv.tap { top: .5em; left: 50%; transform: translateX(-50%); display: flex; flex-direction: column; align-items: center; }
  .card.tapc .qv { pointer-events: auto; }
  .card.tapc canvas, .card.tapc .undo, .card.tapc .clear { display: none; }
  .tap .tq { min-height: 1.3em; display: flex; align-items: center; justify-content: center; gap: .3em; }
  .tap .tq svg { display: block; }
  /* tiles are sized from the card, not the text, so every card on a sheet has the same big tiles:
     --n tiles across, --rows rows; the words above keep to the top 45% (30% over a grid) */
  .tap .tiles { --tw: max(40px, min(38cqh, calc(86cqw / var(--n)), 84px)); display: flex; gap: 3cqw; margin-top: .7em; }
  .tap .tt {
    min-width: var(--tw); height: var(--tw); padding: 0 .2em; font-size: calc(var(--tw) * .5); font-weight: 700; line-height: 1;
    border: 2px solid var(--ink); border-radius: calc(var(--tw) * .12); display: flex; align-items: center; justify-content: center;
  }
  .tap .tt[aria-pressed="true"] { box-shadow: inset 0 0 0 calc(var(--tw) * .08) var(--ink); background: #eee; }
  .tap .tiles.cells { --tw: max(30px, min(calc(56cqh / var(--rows)), calc(88cqw / var(--n)), 60px)); display: grid; grid-template-columns: repeat(var(--n), auto); gap: 0; }
  .tap .cells .tt { padding: 0; border-radius: 0; border-width: 1.5px; margin: -.75px; }
  /* a grid with its labels (Map): only a short line of words above it, so the grid may take more of the card */
  .tap .tiles.cells.axes { --tw: max(30px, min(calc(72cqh / var(--rows)), calc(94cqw / var(--n)), 60px)); }
  .tap .cells .ax { font-size: calc(var(--tw) * .4); font-weight: 700; display: flex; align-items: center; justify-content: center; width: calc(var(--tw) * .5); height: var(--tw); }
  .tap .cells .ax:not(.ay) { height: calc(var(--tw) * .5); }
  /* Money, Make it: the tray she drops coins and notes into (two rows of room) */
  .tap .tray { width: 9.4em; min-height: 3em; margin-top: .3em; border: .06em solid var(--line); border-radius: .2em; display: flex; flex-wrap: wrap; align-content: center; justify-content: center; gap: .1em .15em; font-size: .8em; padding: .1em; }
  .tap .tray .tri { line-height: 0; padding: 0; border: 0; background: none; }
  .tap .tiles.cells.coins { gap: 4px; --tw: max(30px, min(calc(42cqh / var(--rows)), calc(84cqw / var(--n)), 60px)); }
  .tap .coins .tt { border-radius: calc(var(--tw) * .12); border-width: 2px; margin: 0; }
  .tap .tray .tri svg { display: block; }
  .tap .tw.twl { display: flex; align-items: center; gap: .2em; white-space: nowrap; }
  .tap .cells .axx { width: var(--tw); }
  /* Year 1 (B2): a sentence with dots under each side; "same" and digital-clock tiles */
  .tap .tfd { display: flex; align-items: flex-start; gap: .35em; }
  .tap .tfc { display: flex; flex-direction: column; align-items: center; gap: .1em; }
  .tap .tsm { font-size: .55em; }
  /* word tiles in rows of q.wrap (Angles names, Year 5): wider than tall, smaller words */

<script src="model.js"></script>
<script src="digits.js"></script>
<script src="report.js"></script>
<script>
'use strict';
const $ = s => document.querySelector(s);
const SIGN = { '+': '+', '-': '−', '*': '×', '/': '÷' };
const OP_ORDER = ['+', '-', '*', '/'];
const ONE_TO_NINE = [1, 2, 3, 4, 5, 6, 7, 8, 9];
const ALL_DIGITS = [0, ...ONE_TO_NINE];
// NZ school years 0–8 (Sam: ask the year, never the age). `year` is hers (saved on
// the player, up one every 1 January); `view` is the year page home is showing
// (‹ › or swipe). Activities list ages [5] / [8] / [5, 8], meaning the younger
// tile set (Years 0–2, read aloud) and the older set (Year 3 up).
const YEARS = [0, 1, 2, 3, 4, 5, 6, 7, 8];
const group = () => year <= 2 ? 5 : 8;
const reads = () => year <= 2;                   // cards and screens read aloud
const yearsOf = a => { const o = (ACTS[a].options || []).find(o => o.key === 'yr'); return o ? o.values.map(v => Array.isArray(v) ? v[0] : v) : []; };
const maxYear = a => Math.max(0, ...yearsOf(a));
// the nearest year an activity has to w; a tie goes to the lower year (Years 1 and 4 only: 2 → 1, 3 → 4)
const nearestOf = (ys, w) => ys.reduce((b, y) => Math.abs(y - w) < Math.abs(b - w) || (Math.abs(y - w) === Math.abs(b - w) && y < b) ? y : b);
const suggestedYear = a => nearestOf(yearsOf(a), view);
// year pages: every year some activity has (Years 1–4 so far). An activity with a
// Year row is on exactly its own years; one without is on the pages of its tile set
// (younger: Years 1–2, older: 3 up), and the original Sums is on every page.
const pageYears = () => [...new Set(Object.keys(ACTS).flatMap(yearsOf))].sort((x, y) => x - y);
const onPage = (a, v) => maxYear(a) ? yearsOf(a).includes(v) : ACTS[a].ages.includes(v <= 2 ? 5 : 8);
// 1 January: everyone goes up a year (Sam). `yy` is the calendar year her year is for.
function rollYears(list, now = new Date()) {
  const cy = now.getFullYear();
  let changed = false;
  for (const p of list) {
    // names from before years were ages: 5 → Year 1, 8 → Year 4
    if (p.year == null && p.age) { p.year = Math.min(8, Math.max(0, p.age - 4)); p.yy = cy; delete p.age; changed = true; }
    if (p.year != null && p.yy < cy) { p.year = Math.min(13, p.year + cy - p.yy); p.yy = cy; changed = true; }
  }
  return changed;
}
const store = {
  get(k, d) { try { const v = JSON.parse(localStorage.getItem(k)); return v == null ? d : v; } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} },
};
const esc = s => String(s).replace(/[&<>"]/g, ch => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[ch]);
const rnd = (lo, hi) => lo + Math.floor(Math.random() * (hi - lo + 1));
const pickOne = arr => arr[rnd(0, arr.length - 1)];
const range = (lo, hi) => Array.from({ length: hi - lo + 1 }, (_, i) => lo + i);

// read aloud (the 5-year-old can't read yet)
function say(text) {
  try { speechSynthesis.cancel(); const u = new SpeechSynthesisUtterance(text); u.rate = 0.9; speechSynthesis.speak(u); } catch (e) {}
}

// ---------- numbers ----------
// A "line" is one of the two numbers: { d: digits, p: picked digits }.
// d = 1 means a single digit chosen from p (the keypad); d = 2..4 means any
// number with that many digits.
const lineOf = (d, p) => typeof d === 'object' ? d : { d, p: p || ALL_DIGITS };
const num = L => L.d === 1 ? pickOne(L.p) : rnd(10 ** (L.d - 1), 10 ** L.d - 1);
// For ÷ the second number is the divisor and the answer comes from the first
// number's choices (keypad), or the first number sets the dividend's digits.
function makeQ(op, A, B) {
  A = lineOf(A); B = lineOf(B);
  let a, b;
  if (op === '+') { a = num(A); b = num(B); return { a, b, op, ans: a + b }; }
  if (op === '*') { a = num(A); b = num(B); return { a, b, op, ans: a * b }; }
  if (op === '-') {
    for (let t = 0; t < 20; t++) { a = num(A); b = num(B); if (a >= b) break; }
    if (b > a) [a, b] = [b, a];
    return { a, b, op, ans: a - b };
  }
  if (B.d === 1) { const nz = B.p.filter(x => x > 0); if (!nz.length) return null; b = pickOne(nz); }
  else b = rnd(10 ** (B.d - 1), 10 ** B.d - 1);
  if (A.d === 1) { const q = num(A); return { a: b * q, b, op, ans: q }; }
  const alo = 10 ** (A.d - 1), ahi = 10 ** A.d - 1;
  let qlo = Math.max(2, Math.ceil(alo / b)), qhi = Math.floor(ahi / b);
  if (qlo > qhi) { qlo = Math.min(qlo, 9); qhi = Math.max(qlo, Math.min(qhi, 9)); if (qhi < qlo) qhi = qlo; }
  const q = rnd(qlo, qhi);
  return { a: b * q, b, op, ans: q };
}
const cfgA = c => lineOf(c.a, c.pa), cfgB = c => lineOf(c.b, c.pb);
// signs that can actually make a question (÷ needs a non-zero divisor)
const usableOps = c => c.ops.filter(op => op !== '/' || cfgB(c).d > 1 || cfgB(c).p.some(x => x > 0));

function digitsLabel(ds) { // [0,1,2,3,5,7] -> "0–3, 5, 7"
  const out = [];
  for (let i = 0; i < ds.length; i++) {
    let j = i; while (j + 1 < ds.length && ds[j + 1] === ds[j] + 1) j++;
    out.push(j - i >= 2 ? `${ds[i]}–${ds[j]}` : j > i ? `${ds[i]}, ${ds[j]}` : `${ds[i]}`);
    i = j;
  }
  return out.join(', ');
}
// sums key: signs | first | second | count, where a keypad line is "1:" + its digits
function kpKey(c) {
  const part = L => L.d === 1 ? '1:' + [...L.p].sort((x, y) => x - y).join('') : String(L.d);
  return OP_ORDER.filter(o => c.ops.includes(o)).join('') + '|' + part(cfgA(c)) + '|' + part(cfgB(c)) + '|' + c.n;
}
function kpLabel(k) {
  const [ops, a, b, n] = k.split('|');
  const part = p => p.includes(':') ? digitsLabel([...p.split(':')[1]].map(Number)) : p === '1' ? '1-digit' : `${p}-digit`;
  return `${[...ops].map(o => SIGN[o]).join(' ')} · ${part(a)} and ${part(b)} · ${n} questions`;
}

// ---------- activities ----------
// Each activity: which ages see it, its starting settings, how to make a
// question, the setup it uses, what to say aloud, and its tile picture.
const frameSvg = (dots, empty) => `<svg viewBox="-1 -1 52 22">${frameInner(dots, empty)}</svg>`;
const frameInner = (dots, empty) => {
  let s = `<rect x="0" y="0" width="50" height="20" fill="none" stroke="currentColor" stroke-width="1"/>`;
  for (let i = 1; i < 5; i++) s += `<line x1="${i * 10}" y1="0" x2="${i * 10}" y2="20" stroke="currentColor" stroke-width=".7"/>`;
  s += `<line x1="0" y1="10" x2="50" y2="10" stroke="currentColor" stroke-width=".7"/>`;
  for (let i = 0; i < 10; i++) {
    const x = (i % 5) * 10 + 5, y = Math.floor(i / 5) * 10 + 5;
    if (i < dots) s += `<circle cx="${x}" cy="${y}" r="3.5" fill="currentColor"/>`;
    else if (empty) s += `<circle cx="${x}" cy="${y}" r="3.3" fill="none" stroke="currentColor" stroke-width=".6" stroke-dasharray="1.4 1.1"/>`;
  }
  return s;
};
// How many?, Groups: two dice patterns side by side, each its own block colour
const PIPS = { 1: [[1, 1]], 2: [[0, 0], [2, 2]], 3: [[0, 0], [1, 1], [2, 2]], 4: [[0, 0], [2, 0], [0, 2], [2, 2]], 5: [[0, 0], [2, 0], [1, 1], [0, 2], [2, 2]], 6: [[0, 0], [2, 0], [0, 1], [2, 1], [0, 2], [2, 2]] };
const clustersSvg = (parts, cols) => {
  // each part on its own die (a thin rounded square), so the two parts never run together
  let s = '';
  parts.forEach((n, j) => {
    const x0 = j * 40;
    s += `<rect x="${x0}" y="0" width="30" height="30" rx="5" fill="none" stroke="#111" stroke-width=".8"/>`;
    PIPS[n].forEach(([cx, cy]) => { s += `<circle cx="${x0 + 6.5 + cx * 8.5}" cy="${6.5 + cy * 8.5}" r="3.5" fill="${BLOCK[cols[j]]}" stroke="#111" stroke-width=".6"/>`; });
  });
  return `<svg viewBox="-1 -1 72 32" style="width:5.6em;height:2.5em">${s}</svg>`;
};
// number bond: the whole in the top circle, joined to the two parts below; the
// hidden one is an empty circle (class "hole") she writes in
const bondSvg = q => {
  const C = { w: [30, 11], p: [12, 41], q2: [48, 41] };
  let s = `<svg viewBox="0 -1 60 54" fill="none" stroke="currentColor"><line x1="30" y1="11" x2="12" y2="41" stroke-width="1"/><line x1="30" y1="11" x2="48" y2="41" stroke-width="1"/>`;
  for (const k of ['w', 'p', 'q2']) {
    const [x, y] = C[k];
    s += `<circle cx="${x}" cy="${y}" r="10" fill="white" stroke-width="1.1"${k === q.hide ? ' class="hole"' : ''}/>`;
    if (k !== q.hide) s += `<text x="${x}" y="${y}" text-anchor="middle" dominant-baseline="central" font-size="${String(q[k]).length > 2 ? 8.5 : 11}" font-weight="700" fill="currentColor" stroke="none" font-family="system-ui, sans-serif">${q[k]}</text>`;
  }
  return s + '</svg>';
};
// rectangle for Area: side lengths written on (top and right), "?" on a hidden
// side, a grid of unit squares for counting. s = em per unit of length.
function areaSvg(q) {
  if (q.mode === 'odd') return oddSvg(q);
  if (q.mode === 'cubes' || q.mode === 'layers') return cubesSvg(q);
  if (q.mode === 'lperim') return lshapeSvg(q);
  const { w, h } = q, s = Math.min(0.42, 5.2 / Math.max(w, h)), u = 10;
  const fs = 7.2 / s; // label font, in viewBox units, about 0.72em on screen
  const L = 1.5 * fs, T = 1.4 * fs, R = 2.2 * fs, B = 4;
  let o = `<svg viewBox="${-L} ${-T} ${w * u + L + R} ${h * u + T + B}" style="width:${(w * u + L + R) * s / u}em;height:${(h * u + T + B) * s / u}em" fill="none" stroke="currentColor">`;

    blocked: c => c.max > 9999 && c.kinds.every(k => k === 'blocks') ? 'Blocks only go up to 9,999. Choose another kind too.' : '',
    defaults: () => ({ kinds: ['blocks', 'expanded', 'more'], max: 999, n: 12 }),
    make: c => {
      const kinds = c.max > 9999 ? c.kinds.filter(k => k !== 'blocks') : c.kinds, kind = pickOne(kinds.length ? kinds : ['expanded']);
      if (kind === 'more') {
        const amt = pickOne(c.max > 9999 ? [1000, 10000, 100000] : c.max > 999 ? [1, 10, 100, 1000] : c.max > 99 ? [1, 10, 100] : [1, 10]), more = Math.random() < 0.5;
        const v = more ? rnd(0, c.max - amt) : rnd(amt, c.max);
        return { kind: 'expr', text: `${amt} ${more ? 'more' : 'less'} than ${v}`, ans: more ? v + amt : v - amt };
      }
      if (c.max > 9999) { // six digits: 400000 + 20000 + 3000 + 500 + 7, zero parts left out, sometimes shuffled
        const v = rnd(100000, 999999);
        let parts = String(v).split('').map((d, i) => +d * 10 ** (5 - i)).filter(x => x > 0);
        if (Math.random() < 0.35) parts = parts.sort(() => Math.random() - 0.5);
        return { kind: 'expr', text: parts.join(' + '), ans: v };

// [2,3,4,5,9,12] -> "2–5, 9, 12" for numbers that may have two digits
function digitsLabelNums(ns) { return digitsLabel([...ns].sort((x, y) => x - y)); }
function labelFor(k) {
  const i = k.indexOf('~');
  return i < 0 ? ACTS.sums.label(k) : ACTS[k.slice(0, i)] ? ACTS[k.slice(0, i)].label(k.slice(i + 1)) : k;
}

// ---------- players ----------
// Everyone (guest, picks a year each time) plus named players, each with a year.
let players = store.get('sums-players', []);
if (rollYears(players)) store.set('sums-players', players);
let current = null, year = null, view = null, act = null;
const allPlayers = () => [{ id: 'guest', name: 'Everyone' }, ...players];
const player = id => allPlayers().find(p => p.id === id) || { id: 'guest', name: 'Everyone' };
const recKey = id => 'sums-rec-' + id;
const loadRec = id => store.get(recKey(id), { best: {}, history: [] });

// settings per player, per activity (Everyone also per year)
const cfgStoreKey = a => `sums-cfg-${current}${current === 'guest' ? '-y' + year : ''}-${a}`;
function loadCfg(a) {
  const d = ACTS[a].defaults(group());
  if (maxYear(a)) d.yr = suggestedYear(a); // start at the year page she is on
  // (the one-device settings from before names existed are NOT used: they
  // belonged to whoever used it last, and gave the 8-year-old her sister's)
  const s = store.get(cfgStoreKey(a), null);
  const c = { ...d, ...(s || {}) };
  for (const k of ['pa', 'pb']) if (k in d && (!Array.isArray(c[k]) || !c[k].length)) c[k] = d[k];
  if (c.ops) c.ops = [...c.ops];
  // a saved count this activity no longer offers (20, from before) goes to the nearest one it has
  const cs = countsOf(a);
  if (!ACTS[a].noCount && !cs.includes(c.n)) c.n = cs.reduce((b, x) => Math.abs(x - c.n) < Math.abs(b - c.n) ? x : b);
  return c;
}
// how many questions an activity offers (Sam: 20 is too many almost everywhere)
const countsOf = a => ACTS[a].counts || [6, 12];
function fmtTime(ms) { const s = Math.round(ms / 1000); return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); }
function fmtDate(t) { return new Date(t).toLocaleDateString(undefined, { day: 'numeric', month: 'short' }); }

function saveResult(key, ms, first, n) {
  const r = loadRec(current);
  const prev = r.best[key];
  const isBest = !prev || ms < prev.ms;
  r.best[key] = { ms: isBest ? ms : prev.ms, count: (prev ? prev.count : 0) + 1, t: Date.now() };
  const t = Date.now();
  r.history.unshift({ k: key, ms, first, n, t });
  r.history = r.history.slice(0, 100);
  store.set(recKey(current), r);
  return { isBest, best: r.best[key].ms, hadPrev: !!prev, first, t, player: current };
}

// ---------- screens ----------
let screen = 'names';
function show(s) {
  if (s !== screen) { scrollTo(0, 0); hideDone(); }
  screen = s;
  for (const id of ['names', 'year', 'home', 'setup', 'me', 'grid']) $('#' + id + 'S').hidden = id !== s;
  $('#sheet').hidden = s !== 'sheet';
  const play = s === 'sheet' || s === 'grid';
  document.body.classList.toggle('lock', play);
  // on the grid, Mark only appears (as "New grid") once it is finished
  const vis = { backBtn: s !== 'names', setupBtn: play, sayBtn: play || s === 'home' || s === 'year', workBtn: s === 'sheet', markBtn: s === 'sheet' || (s === 'grid' && G && G.done), score: play, meBtn: s === 'home' };
  for (const id in vis) $('#' + id).hidden = !vis[id];
  applyWorking();
  const p = current ? player(current) : null;
  $('#title').textContent = { names: 'Sums', year: p ? p.name : '', home: p ? `${p.name} · Year ${year}` : '', setup: act && p ? `${p.name} · ${ACTS[act].name}` : '', me: p ? p.name : '', sheet: act ? ACTS[act].name : '', grid: act ? ACTS[act].name : '' }[s];
  $('#title').className = play ? 'sheetTitle' : '';
  $('#backBtn').textContent = { year: '‹ Names', home: '‹ Names', setup: '‹ Back', me: '‹ Back', sheet: '‹ Home', grid: '‹ Home' }[s] || '‹ Back';
}
$('#backBtn').onclick = () => {
  if (screen === 'year' || screen === 'home') goNames();
  else if (screen === 'setup') setupFrom === 'sheet' && sheetAct === act && (playScreen === 'grid' ? G : cards.length) ? show(playScreen) : goHome();
  else goHome();
};
$('#sayBtn').onclick = () => {
  if (screen === 'sheet') say(ACTS[act].say);
  else if (screen === 'home') say(`Year ${view}. What do you want to do today? ` + ACTS_FOR().map(a => ACTS[a].name).join('. '));
  else if (screen === 'year') say('What year are you in?');
};

// names
function goNames() {
  current = null; year = null; view = null;
  // a new person never lands on the last person's sheet
  for (const k of cards) ro.unobserve(k.work);
  cards = []; sheetAct = null; $('#sheet').innerHTML = ''; G = null;
  $('#nameTiles').innerHTML = allPlayers().map(p =>
    `<button class="tile person" data-id="${esc(p.id)}"><span class="nm">${esc(p.name)}</span><span class="sub">${p.id === 'guest' ? 'any year' : p.year != null ? 'Year ' + p.year : ''}</span></button>`).join('')
    + `<button class="tile add" id="addTile"><span class="nm">+ Add a name</span></button>`;
  $('#addRow').hidden = true;
  $('#linkHint').hidden = !LINK;
  if (LINK) $('#linkHint').textContent = `Next: ${ACTS[LINK.act].name}${LINK.over.yr ? ', Year ' + LINK.over.yr : ''}. Pick who is trying it.`;
  show('names');
}
$('#nameTiles').addEventListener('click', e => {
  const t = e.target.closest('.tile'); if (!t) return;
  if (t.id === 'addTile') { $('#addRow').hidden = false; $('#newName').focus(); return; }
  current = t.dataset.id;
  const p = player(current);
  if (current !== 'guest' && p.year != null) { setYear(p.year); goHome(); }
  // a link from /sums/review/ with a year: Everyone gets that year, no need to ask
  else if (current === 'guest' && LINK && LINK.over.yr) { setYear(LINK.over.yr); goHome(); }
  else goYear();
});
function addPlayer() {
  const name = $('#newName').value.trim().slice(0, 20); if (!name) return;
  const p = { id: Date.now().toString(36), name };
  players.push(p); store.set('sums-players', players);
  $('#newName').value = '';
  current = p.id; goYear();
}
$('#addBtn').onclick = addPlayer;
$('#newName').addEventListener('keydown', e => { if (e.key === 'Enter') addPlayer(); });

// year at school
const yearTiles = () => YEARS.map(y => `<button class="tile" data-year="${y}" aria-pressed="${y === year}"><span class="sub">Year</span><span class="nm">${y}</span></button>`).join('');
function goYear() { $('#yearTiles').innerHTML = yearTiles(); show('year'); say('What year are you in?'); }
// her year, and home opens on that year's page (or the nearest one built)
function setYear(y, save) {
  year = y; view = nearestOf(pageYears(), y);
  if (save && current !== 'guest') { const p = players.find(x => x.id === current); if (p) { p.year = y; p.yy = new Date().getFullYear(); store.set('sums-players', players); } }
}
$('#yearTiles').addEventListener('click', e => { const t = e.target.closest('[data-year]'); if (!t) return; setYear(+t.dataset.year, true); goHome(); });

// home: one page per year, her own first; ‹ › or a swipe goes to the next year down or up
const ACTS_FOR = () => Object.keys(ACTS).filter(a => onPage(a, view));
function goHome() {
  if (LINK) return openLink();
  drawHome();
  show('home');
  if (reads()) say(view === year ? 'What do you want to do today?' : `Year ${view}. What do you want to do today?`);
}
function drawHome() {
  const r = loadRec(current), ys = pageYears(), i = ys.indexOf(view);
  $('#yView').textContent = 'Year ' + view;
  $('#yPrev').disabled = i <= 0; $('#yNext').disabled = i >= ys.length - 1;
  $('#yDots').innerHTML = ys.map(y => `<i class="${y === view ? 'on' : ''}"></i>`).join('');
  $('#yMine').textContent = view === year ? 'your year' : year > ys[ys.length - 1] && view === ys[ys.length - 1] ? `the highest so far (you're in Year ${year})` : year < ys[0] && view === ys[0] ? `you're in Year ${year}` : '';
  $('#actTiles').innerHTML = ACTS_FOR().map(a => {
    const c = loadCfg(a); if (maxYear(a)) c.yr = view;   // best time at this page's year
    const best = r.best[ACTS[a].key(c)];
    return `<button class="tile" data-act="${a}"><span class="pic">${ACTS[a].pic}</span><span class="nm">${ACTS[a].name}</span><span class="sub">${best ? 'Best ' + fmtTime(best.ms) : ''}</span></button>`;
  }).join('');
}
function turnPage(d) {
  const ys = pageYears(), i = ys.indexOf(view) + d;
  if (i < 0 || i >= ys.length) return;
  view = ys[i]; drawHome(); scrollTo(0, 0);
  if (reads()) say('Year ' + view);
}
$('#yPrev').onclick = () => turnPage(-1);
$('#yNext').onclick = () => turnPage(1);
// swipe: a mostly sideways drag of 60 px or more anywhere on home
(() => {
  let sx = null, sy = 0;
  const h = $('#homeS');
  h.addEventListener('touchstart', e => { if (e.touches.length === 1) { sx = e.touches[0].clientX; sy = e.touches[0].clientY; } else sx = null; }, { passive: true });
  h.addEventListener('touchend', e => {
    if (sx == null) return;
    const t = e.changedTouches[0], dx = t.clientX - sx, dy = t.clientY - sy; sx = null;
    if (Math.abs(dx) >= 60 && Math.abs(dx) > 2 * Math.abs(dy)) turnPage(dx < 0 ? 1 : -1);
  });
})();
$('#actTiles').addEventListener('click', e => {

// records, year, remove
let confirmShownAt = 0, pending = null;
function goMe() {
  const p = player(current), r = loadRec(current);
  pending = null;
  $('#meYears').innerHTML = yearTiles();
  $('#meYearNote').textContent = current === 'guest' ? '' : '(goes up by itself every 1 January)';
  $('#recTitle').textContent = `Best times for ${p.name}`;
  const best = Object.entries(r.best).sort((x, y) => y[1].t - x[1].t);
  $('#records').innerHTML = best.length
    ? `<table><tr><th>Sheet</th><th>Best</th><th>Done</th><th></th></tr>${best.map(([k, v]) =>
        `<tr><td>${esc(labelFor(k))}</td><td class="t">${fmtTime(v.ms)}</td><td>${v.count}×</td><td><button class="del" data-k="${esc(k)}">Delete</button></td></tr>`).join('')}</table>`
    : '<p class="empty">No finished sheets yet. A sheet counts when every answer is right.</p>';
  $('#history').innerHTML = r.history.length
    ? `<table><tr><th>Day</th><th>Sheet</th><th>Time</th><th>First try</th><th></th></tr>${r.history.slice(0, 15).map(h =>
        `<tr><td>${fmtDate(h.t)}</td><td>${esc(labelFor(h.k))}</td><td class="t">${fmtTime(h.ms)}</td><td>${h.first}/${h.n}</td><td><button class="del" data-t="${h.t}">Delete</button></td></tr>`).join('')}</table>`
    : '<p class="empty">Nothing yet.</p>';
  const rm = $('#removeBtn');
  rm.hidden = current === 'guest'; rm.dataset.armed = ''; rm.textContent = `Remove ${p.name}`;
  $('#confirmBox').hidden = true;
  show('me');
}
$('#meBtn').onclick = goMe;
$('#meYears').addEventListener('click', e => { const t = e.target.closest('[data-year]'); if (!t) return; setYear(+t.dataset.year, true); goHome(); });
// Removing anything (a person, a sheet's records, one sheet): the first tap turns
// that button into "Keep", and the real confirm appears far away at the top of
// the page, ignoring taps for half a second, so a double tap can't remove anything.
function cancelArm() {
  for (const b of document.querySelectorAll('#meS [data-armed="1"]')) { b.dataset.armed = ''; b.textContent = b.dataset.was; }
  pending = null; $('#confirmBox').hidden = true;
}
function arm(btn, keep, confirmText, action) {
  if (btn.dataset.armed) { cancelArm(); return; } // "Keep": cancel
  cancelArm();
  btn.dataset.armed = '1'; btn.dataset.was = btn.textContent; btn.textContent = keep;
  pending = action;
  $('#confirmRemoveBtn').textContent = confirmText;
  $('#confirmBox').hidden = false; confirmShownAt = Date.now();
  scrollTo(0, 0);
}
$('#confirmRemoveBtn').onclick = () => {
  if (Date.now() - confirmShownAt < 500 || !pending) return;
  const f = pending; pending = null; f();
};
$('#removeBtn').onclick = () => {
  const name = player(current).name;
  arm($('#removeBtn'), `Keep ${name}`, `Tap here to remove ${name} and their records`, () => {
    players = players.filter(p => p.id !== current); store.set('sums-players', players);
    try { localStorage.removeItem(recKey(current)); } catch (e) {}
    for (const a in ACTS) try { localStorage.removeItem(`sums-cfg-${current}-${a}`); } catch (e) {}
    goNames();
  });
};
// Sam: someone else did a sheet on her name. Delete one sheet (its best time
// is worked out again from what is left), or all of one kind of sheet.
function deleteSheet(t) {
  const r = loadRec(current), h = r.history.find(x => x.t === t); if (!h) return;
  r.history = r.history.filter(x => x !== h);
  const b = r.best[h.k];
  if (b) {
    const rest = r.history.filter(x => x.k === h.k);
    b.count = Math.max(0, b.count - 1);
    if (!b.count || (b.ms === h.ms && !rest.length)) delete r.best[h.k];
    else if (b.ms === h.ms) b.ms = Math.min(...rest.map(x => x.ms));
  }
  store.set(recKey(current), r);
}
function deleteKind(k) {
  const r = loadRec(current);
  delete r.best[k]; r.history = r.history.filter(x => x.k !== k);
  store.set(recKey(current), r);
}
$('#meS').addEventListener('click', e => {
  const b = e.target.closest('.del'); if (!b) return;
  const name = player(current).name, r = loadRec(current);
  if (b.dataset.t) {
    const h = r.history.find(x => x.t === +b.dataset.t); if (!h) return;
    arm(b, 'Keep', `Tap here to delete ${labelFor(h.k)} (${fmtTime(h.ms)}, ${fmtDate(h.t)}) from ${name}`, () => { deleteSheet(h.t); goMe(); });
  } else {
    const k = b.dataset.k;
    arm(b, 'Keep', `Tap here to delete every ${labelFor(k)} from ${name}`, () => { deleteKind(k); goMe(); });
  }
});

// ---------- setup ----------
// The setup page is laid out like a sum: first number's keypad on top, signs
// beside the second number's keypad, a line, then how many and Start.
let draft = null, setupFrom = 'home';
const KEYS = [7, 8, 9, 4, 5, 6, 1, 2, 3, 0];
for (const kp of document.querySelectorAll('.kp')) {
  kp.innerHTML = KEYS.map(k => `<button data-k="${k}">${k}</button>`).join('') + '<button data-k="all" class="allk">All</button>';
}
function goSetup(from = 'home') {
  setupFrom = from;
  draft = loadCfg(act);
  const kind = ACTS[act].setup;
  $('#kpBlock').hidden = kind !== 'keypad' && kind !== 'grid';
  $('#kpBlock').dataset.mode = kind;
  $('#labA').textContent = kind === 'grid' ? 'Rows' : 'First number';
  $('#labB').textContent = kind === 'grid' ? 'Columns' : 'Second number';
  // simple choices (Up to, Kind, Counting in...) as rows of buttons
  // the Year row marks the year of the page she came from (a green dot), and says so
  const sug = maxYear(act) ? suggestedYear(act) : 0, want = view;
  $('#optBlock').innerHTML = (ACTS[act].options || []).map(o =>
    `<div class="set"><div class="lab">${o.label}</div><div class="opts" data-key="${o.key}"${o.multi ? ' data-multi="1"' : ''}>${
      o.values.map(v => {
        const [val, txt] = Array.isArray(v) ? v : [v, v];
        // Year buttons: "Year 1" on its own line, the example under it (Sam: the 1 looked like part of the example)
        if (o.key === 'yr') return `<button data-v="${val}" class="yrb${val === sug ? ' sug' : ''}"><span class="yn">Year ${val}</span><span class="yx">${String(txt).split(' · ').slice(1).join(' · ')}</span></button>`;
        return `<button data-v="${val}">${txt}</button>`;
      }).join('')}</div>${
      o.key === 'yr' ? `<p class="hint sughint">${want === year ? 'Your year' : 'From the page for'}: Year ${want}${want === sug ? '' : ` (Year ${sug} is the ${want > sug && sug === maxYear(act) ? 'highest' : want < sug && sug === Math.min(...yearsOf(act)) ? 'lowest' : 'nearest'} here so far)`}</p>` : ''}</div>`).join('');
  $('#nOpts').parentElement.hidden = !!ACTS[act].noCount; // the grid sets its own count
  $('#nOpts').innerHTML = countsOf(act).map(v => `<button data-v="${v}">${v}</button>`).join('');
  $('#setupHint').textContent = kind === 'keypad' ? 'Takeaways never go below zero. Division always comes out exactly: you divide by the second number.' : '';
  syncOpts();
  show('setup');
}
$('#setupBtn').onclick = () => goSetup('sheet');
// option values are numbers where they look like numbers ("10" → 10, "blocks" stays)
const optVal = v => /^\d+$/.test(v) ? +v : v;
function syncOpts() {
  if (draft.ops) for (const b of $('#opsOpts').children) b.setAttribute('aria-pressed', draft.ops.includes(b.dataset.v));
  for (const g of document.querySelectorAll('#optBlock .opts')) {
    const cur = draft[g.dataset.key];
    for (const b of g.children) b.setAttribute('aria-pressed', Array.isArray(cur) ? cur.includes(optVal(b.dataset.v)) : cur === optVal(b.dataset.v));
  }
  if (draft.pa) {
    for (const line of ['a', 'b']) {
      const d = draft[line], p = draft['p' + line];
      for (const k of document.querySelectorAll(`.kp[data-line="${line}"] [data-k]`))
        k.setAttribute('aria-pressed', d === 1 && (k.dataset.k === 'all' ? p.length === 10 : p.includes(+k.dataset.k)));
      for (const k of document.querySelectorAll(`.big[data-line="${line}"] [data-d]`))
        k.setAttribute('aria-pressed', +k.dataset.d === d);
    }
  }
  for (const b of $('#nOpts').children) b.setAttribute('aria-pressed', +b.dataset.v === draft.n);
  renderPreview();
}
$('#opsOpts').addEventListener('click', e => {
  const v = e.target.dataset && e.target.dataset.v; if (!v) return;
  const i = draft.ops.indexOf(v);
  if (i >= 0) { if (draft.ops.length > 1) draft.ops.splice(i, 1); }
  else draft.ops.push(v);
  syncOpts();
});
$('#nOpts').addEventListener('click', e => { const v = e.target.dataset && e.target.dataset.v; if (!v) return; draft.n = +v; syncOpts(); });
// multi-choice rows toggle (at least one stays on); single-choice rows pick one
$('#optBlock').addEventListener('click', e => {
  const b = e.target.closest('[data-v]'); if (!b) return;
  const g = b.parentElement, key = g.dataset.key, v = optVal(b.dataset.v);
  if (g.dataset.multi) {
    const cur = draft[key];
    if (cur.includes(v)) { if (cur.length > 1) draft[key] = cur.filter(x => x !== v); }
    else draft[key] = [...cur, v];
  } else draft[key] = v;
  syncOpts();
});
for (const big of document.querySelectorAll('.big')) big.addEventListener('click', e => {
  const d = e.target.closest('[data-d]'); if (!d) return;
  draft[big.dataset.line] = +d.dataset.d; syncOpts();
});
// keypad: tap to toggle a digit, or drag across keys to set them all the same way
function setKey(line, k, on) {
  const pk = 'p' + line;
  if (k === 'all') { draft[line] = 1; draft[pk] = [...ALL_DIGITS]; return; }
  k = +k;
  if (draft[line] !== 1) { draft[line] = 1; draft[pk] = [k]; return; } // fresh pick
  const has = draft[pk].includes(k);
  if (on && !has) draft[pk] = [...draft[pk], k].sort((x, y) => x - y);
  if (!on && has && draft[pk].length > 1) draft[pk] = draft[pk].filter(x => x !== k);
}
for (const kp of document.querySelectorAll('.kp')) {
  let sweep = null;
  const keyAt = e => { const el = document.elementFromPoint(e.clientX, e.clientY); const k = el && el.closest('[data-k]'); return k && kp.contains(k) ? k : null; };
  kp.addEventListener('pointerdown', e => {
    const k = keyAt(e); if (!k) return;
    e.preventDefault();
    const line = kp.dataset.line;
    const on = !(draft[line] === 1 && k.dataset.k !== 'all' && draft['p' + line].includes(+k.dataset.k));
    sweep = { line, on, done: new Set([k.dataset.k]) };
    setKey(line, k.dataset.k, on); syncOpts();
  });
  kp.addEventListener('pointermove', e => {
    if (!sweep) return;
    const k = keyAt(e);
    if (!k || k.dataset.k === 'all' || sweep.done.has(k.dataset.k)) return;
    sweep.done.add(k.dataset.k); setKey(sweep.line, k.dataset.k, sweep.on); syncOpts();
  });
  for (const ev of ['pointerup', 'pointercancel', 'pointerleave']) kp.addEventListener(ev, () => { sweep = null; });
}
// a few sample questions in the printed style
function renderPreview() {
  const box = $('#preview'), blocked = ACTS[act].blocked ? ACTS[act].blocked(draft) : '';
  const ok = !blocked && (!draft.ops || usableOps(draft).length > 0);
  $('#warn').textContent = blocked || (draft.ops && usableOps(draft).length < draft.ops.length ? 'To divide, choose a second number other than 0.' : '');
  $('#newBtn').disabled = !ok;
  $('#previewLab').hidden = !ACTS[act].make;
  if (!ok || !ACTS[act].make) { box.innerHTML = ''; return; }
  const seen = new Set(), qs = [];
  for (let t = 0; t < 40 && qs.length < 4; t++) {
    const q = ACTS[act].make(draft), id = qId(q);
    if (!seen.has(id)) { seen.add(id); qs.push(q); }
  }
  box.innerHTML = qs.map(q => {
    const m = qMarkup(q), style = Object.entries(m.vars).map(([k, v]) => `${k}:${v}`).join(';');
    return `<div class="mini"><div class="qv ${m.cls}" style="${style}">${m.html}</div></div>`;
  }).join('');
}
$('#preview').addEventListener('click', renderPreview);
$('#newBtn').onclick = () => {
  store.set(cfgStoreKey(act), draft);
  if (ACTS[act].grid) { show('grid'); startGrid(loadCfg(act)); }
  else { buildSheet(loadCfg(act)); show('sheet'); }
  if (reads()) say(ACTS[act].say);
};

// ---------- the printed question ----------
// + − × stacked with a line (space above for carrying, answer under the line);
// ÷ as a long-division bracket (answer on the bar); missing number as an
// equation with a box and a line to write on; ten frames with a line under.
// --h / --c are the height / width the layout needs, in em.
const qId = q => JSON.stringify({ ...q, ans: undefined });
function qMarkup(q) {
  const len = n => String(n).length;
  if (q.kind === 'div') {
    const brk = `<span class="dv">${q.b}</span><span class="dd"><svg class="br" viewBox="0 0 10 40" preserveAspectRatio="none"><path d="M1 0 Q 13 20 1 40" fill="none" stroke="currentColor" stroke-width="2.6" vector-effect="non-scaling-stroke" style="stroke-width:.07em"/></svg>${q.a}</span>`;
    if (!q.rem) return { cls: 'div', html: brk, vars: { '--h': 5.2, '--c': (len(q.a) + len(q.b)) * 0.62 + 2.4 } };
    // Year 5: "__ r __" on the bar, the answer's lines sized for its number of digits so they give nothing away beyond the dividend
    const qd = len(q.a);
    return {
      cls: 'div rem', anchor: '.sep',
      html: `<div class="rq"><span class="ln" style="width:${(qd * 0.62 + 0.5).toFixed(2)}em"></span><span class="sep">r</span><span class="ln" style="width:${(len(q.b) * 0.62 + 0.9).toFixed(2)}em"></span></div><div class="dvr">${brk}</div>`,
      vars: { '--h': 6.4, '--c': Math.max((qd + len(q.b)) * 0.62 + 2.4, qd * 0.62 + len(q.b) * 0.62 + 2.6) + 0.4 },
    };
  }
  if (q.kind === 'miss') {
    const box = '<span class="bx"></span>';
    const A = q.hide === 'a' ? box : q.a, B = q.hide === 'b' ? box : q.b;
    return {
      cls: 'miss',
      html: `<div class="eq">${A} ${SIGN[q.op]} ${B} = ${q.c}</div><div class="al">${box}<span>=</span><span class="wl"></span></div>`,
      // line length from the longest number shown, so it doesn't hint at the answer's size
      vars: { '--d': Math.max(len(q.a), len(q.b), len(q.c)), '--h': 5.4, '--c': (len(q.a) + len(q.b) + len(q.c)) * 0.62 + 5 },
    };
  }
  if (q.kind === 'bond') return { cls: 'bond', html: bondSvg(q), vars: { '--h': 6.4, '--c': 6.8 } };
  // pictures with the answer written anywhere below them (like ten frames)
  if (q.kind === 'array') return { cls: 'frame', html: arraySvg(q.r, q.c), vars: { '--h': q.r * 0.55 + 3.3, '--c': Math.max(q.c * 0.55, 4) + 1.4 } };
  // tap card: the question, then a row (or a grid) of tiles to tap
  if (q.kind === 'tap') {
    const n = q.tiles.length, across = q.cells || q.wrap || n, rows = Math.ceil(n / across); // q.wrap: word tiles in rows of that many (Angles names)
    const btn = (t, i) => `<button class="tt" data-i="${i}" aria-pressed="false">${t.html}</button>`;
    // q.axes (Map): a label before each row and a row of labels under the grid; the labels take 0.6 of a tile
    const grid = !q.axes ? q.tiles.map(btn).join('')
      : q.tiles.map((t, i) => (i % across ? '' : `<span class="ax ay">${q.axes.y[i / across]}</span>`) + btn(t, i)).join('') + `<span class="ax"></span>` + q.axes.x.map(l => `<span class="ax axx">${l}</span>`).join('');
    const size = q.axes ? `--n:${across + 0.5};--rows:${rows + 0.5};grid-template-columns:auto repeat(${across}, auto)` : `--n:${across};--rows:${rows}`;
    return {
      cls: 'tap', anchor: '.tiles',
      html: `<div class="tq">${q.top}</div>${q.tray ? '<div class="tray"></div>' : ''}<div class="tiles${q.cells ? ' cells' : ''}${q.wrap ? ' wrap' : ''}${q.axes ? ' axes' : ''}${q.tray ? ' coins' : ''}${q.big ? ' bigt' : ''}" style="${size}">${grid}</div>`,
      // the tiles take their size from the card (see the CSS); the words keep to the top 45% (30% over a grid)
      // (q.topf: a picture question may take more of the card, as Angles does)
      vars: { '--h': ((q.th || 1.3) + 1.9) / (q.topf || (q.cells ? 0.3 : 0.45)), '--c': Math.max(q.tc || 0, 4) + 1.4 },
    };
  }
  if (q.kind === 'pv') {
    const L = pvLayout(q.h, q.t, q.o, q.k || 0);
    return { cls: 'frame', html: pvSvg(q.h, q.t, q.o, q.k || 0), vars: { '--h': (L.H + 1) * PV_EM + 3.3, '--c': Math.max((L.W + 1) * PV_EM, 4) + 1.4 } };
  }
  if (q.kind === 'nline') return { cls: 'frame', html: nlineSvg(q), vars: { '--h': 3.33 + 3.3, '--c': 11.7 } };
  if (q.kind === 'area') {
    // caption (what to find), then the rectangle; answer below it
    const svg = areaSvg(q), [, wEm, hEm] = svg.match(/width:([\d.]+)em;height:([\d.]+)em/).map(Number);
    return { cls: 'frame', html: `<div class="cap">${q.cap}</div>${svg}`, vars: { '--h': hEm + 1.1 + 3.2, '--c': Math.max(wEm, 5, q.cap.length * 0.44) + 1.2 } };
  }
  if (q.kind === 'frac') {
    if (q.form === 'add') { // each fraction with its picture over it, signs between, then the answer bar
      const k = q.terms.length, w = k === 3 ? 2.4 : 3.2;
      const ds = q.ds || q.terms.map(() => q.d); // Add different: each its own bottom number, pictures cut to the bigger
      const row = q.terms.map((x, i) => `<span class="ft">${fracMini(x, ds[i], w, q.d)}${frHtml(x, ds[i])}</span>`).join(`<span class="op">${q.op}</span>`) + '<span class="op">=</span>';
      return { cls: 'frac', html: `<div class="fsum">${row}</div><div class="fbar"></div>`, vars: { '--h': w * 16 / 62 + 1.95 + 0.5 + 1.9 + 2.3, '--c': k * w + (k + 0.3) * 0.95 + 1.4 } };
    }
    // the picture, then a short printed bar: top number above it, bottom number below
    const svg = fracSvg(q), [, wEm, hEm] = svg.match(/width:([\d.]+)em;height:([\d.]+)em/).map(Number);
    const cap = q.cap ? `<div class="cap">${q.cap}</div>` : '';
    return { cls: 'frac', html: `${cap}${svg}<div class="fbar"></div>`, vars: { '--h': hEm + (cap ? 1.15 : 0) + 0.5 + 1.9 + 2.3, '--c': Math.max(wEm, q.cap ? q.cap.length * 0.42 : 0, 4) + 1.4 } };
  }
  if (q.kind === 'fof') { // what to find, then the bar model; answer anywhere below
    const n = q.n || 1, f = q.pct ? `${q.pct}%` : frHtml(n, q.d), svg = fofSvg(q), ph = +svg.match(/height:([\d.]+)em/)[1];
    const cap = q.part ? `${f} of ${q.whole}` : `${f} of the set is ${n * q.k}`;
    return { cls: 'frame', html: `<div class="cap">${cap}</div>${svg}`, vars: { '--h': 1.75 + 0.35 + ph + 3.2, '--c': 9.4 + 1.4 } };
  }
  // clocks and money: a picture (or the time in words), then the blank(s) to
  // write on: "__ o'clock", "__ : __", "$ __", "__ c" or "$ __ and __ c"
  if (q.kind === 'clock' || q.kind === 'money') {
    let pic, cap = '', capW = 0;
    if (q.kind === 'clock') {
      // Year 5: "24-hour time" above, the part of the day under the words, or above the face too
      pic = q.words ? `<div class="words">${q.period ? `<span>${q.words}<br>${q.period}</span>` : q.words}</div>` : clockSvg(q);
      if (q.period) { const c2 = q.words ? '24-hour time' : `${q.period}<br>24-hour time`; cap = `<div class="cap">${c2}</div>`; capW = Math.max(...c2.split('<br>').map(l => l.length)) * 0.42; }
    }
    else if (q.change) {
      const txt = q.qty ? `Buy ${q.qty}. Change?` : q.total ? 'How much altogether?' : q.tags || q.ctags ? 'Buy them all. Change?' : 'Change?';
      cap = `<div class="cap">${txt}</div>`; capW = txt.length * 0.42; pic = changeSvg(q);
    }
    else pic = moneySvg(q.items);
    const sz = pic.match(/width:([\d.]+)em;height:([\d.]+)em/);
    // words get the same room as a clock face, so every card prints the same size
    const [pw, ph] = sz ? [+sz[1], +sz[2]] : [Math.max(Math.max(q.words.length, (q.period || '').length) * 0.56, 4.4), 3.2];
    const capH = cap ? 1.1 + (cap.split('<br>').length - 1) * 0.85 : 0;
    const ln = '<span class="ln"></span>', u = t => `<span class="u">${t}</span>`;
    const [row, rw] = q.kind === 'clock'
      ? (q.two ? [ln + '<span class="sep">:</span>' + ln, 4.6] : [ln + u("o'clock"), 5.2])
      : q.unit === '$c' ? [u('$') + ln + '<span class="sep">and</span>' + ln + u('c'), 7.4]

// cells as big as the screen allows, tile beside (landscape) or above (portrait)
function sizeGrid() {
  if (!G) return;
  const p = $('#gridS'), portrait = innerHeight > innerWidth;
  const w = p.clientWidth - 24 - (portrait ? 0 : 130), h = p.clientHeight - 24 - (portrait ? 110 : 0);
  $('#tGrid').style.setProperty('--cell', Math.max(18, Math.floor(Math.min(w, h) / (G.N + 1))) + 'px');
}
addEventListener('resize', () => { if (screen === 'grid') sizeGrid(); });
function nextNumber() {
  const empty = [...document.querySelectorAll('#tGrid .gc:not(.off):not(.done)')];
  if (G.placed >= G.total || !empty.length) return finishGrid();
  const t = pickOne(empty);
  G.value = +t.dataset.r * +t.dataset.c; G.tries = 0;
  $('#gTile').textContent = G.value;
}
function updateGridScore() {
  $('#gCount').textContent = `${G.placed} of ${G.total}`;
  let html = G.placed ? `<span class="wide">First try </span><b>${G.first}</b>/${G.total}` : '';
  if (G.done && G.result) {
    const L = G.result;
    html += ` · <b>${fmtTime(L.ms)}</b>` + (L.isBest && L.hadPrev ? ' New best!' : L.isBest ? '' : ` <span class="wide">(best ${fmtTime(L.best)})</span>`);
  }
  $('#score').innerHTML = html;
}
function dropOn(cell) {
  if (!G || G.done || !cell || !cell.classList.contains('gc') || cell.classList.contains('off') || cell.classList.contains('done')) return false;
  if (G.start === null) G.start = Date.now();
  if (+cell.dataset.r * +cell.dataset.c === G.value) {
    cell.textContent = G.value; cell.classList.add('done');
    if (G.tries === 0) G.first++;
    G.placed++; updateGridScore(); nextNumber();
    return true;
  }
  G.tries++;
  cell.classList.add('bad'); setTimeout(() => cell.classList.remove('bad'), 600);
  return false;
}
function finishGrid() {
  G.done = true;
  const ms = Date.now() - (G.start || Date.now());
  G.result = { ms, ...saveResult(sheetKey, ms, G.first, G.total) };
  $('#gTile').hidden = true; $('#gHint').hidden = true;
  $('#markBtn').textContent = 'New grid';
  updateGridScore(); show('grid');
  queueDone(G.result, G.first, G.total);
}

// ---------- finished: a kapow and an obvious next step (Sam) ----------
// Shown a moment after the last card turns green, over the sheet (the header
// stays usable). Another sheet / Harder: Year N (where there is one) / Choose
// something else, and "Look at my sheet" to close it and see the marks.
let doneTimer = 0;
function queueDone(res, first, n) {
  clearTimeout(doneTimer);
  const forAct = act, forPlay = playScreen;
  doneTimer = setTimeout(() => { if (act === forAct && screen === forPlay) showDone(res, first, n); }, 700);
}
function showDone(res, first, n) {
  const perfect = first === n;
  $('#dTitle').textContent = perfect ? 'Perfect!' : 'All done!';
  $('#dStats').innerHTML = `<div class="dTime">${fmtTime(res.ms)}</div>`
    + `<div>First try <b>${first}</b> of ${n}</div>`
    + (res.isBest && res.hadPrev ? '<div class="dBest">New best!</div>' : !res.isBest ? `<div class="faint">Best ${fmtTime(res.best)}</div>` : '');
  const up = (cfg && yearsOf(act).filter(y => y > cfg.yr).sort((a, b) => a - b)[0]) || 0; // the next year it has (Years 1 and 4 only: 1 → 4)
  $('#dUp').hidden = !up; $('#dUp').dataset.yr = up; $('#dUp').textContent = `Harder: Year ${up}`;
  $('#dAgain').textContent = playScreen === 'grid' ? 'Another grid' : 'Another sheet';
  // a little burst of block colours from behind the tick
  $('#dBurst').innerHTML = range(0, 11).map(i => {
    const a = i * Math.PI / 6, d = 70 + (i % 3) * 18;
    return `<i style="--x:${(Math.cos(a) * d).toFixed(0)}px;--y:${(Math.sin(a) * d).toFixed(0)}px;background:${Object.values(BLOCK)[i % 5]};border-radius:${i % 2 ? '50%' : '2px'}"></i>`;
  }).join('');
  $('#doneS').hidden = false;
  if (reads()) say(perfect ? 'Perfect! Well done.' : 'All done! Well done.');
}
const hideDone = () => { clearTimeout(doneTimer); $('#doneS').hidden = true; };
$('#dAgain').onclick = () => { hideDone(); if (playScreen === 'grid') startGrid(cfg); else { buildSheet(cfg); show('sheet'); } };
$('#dUp').onclick = () => {
  const c = { ...loadCfg(act), yr: +$('#dUp').dataset.yr };
  store.set(cfgStoreKey(act), c); hideDone();
  if (ACTS[act].grid) startGrid(loadCfg(act)); else { buildSheet(loadCfg(act)); show('sheet'); }
};
$('#dHome').onclick = () => { hideDone(); goHome(); };
$('#dLook').onclick = hideDone;
// tap a cell
$('#tGrid').addEventListener('click', e => dropOn(e.target.closest('.gc')));
// drag the tile; the row and column under it light up
(() => {
  const tile = $('#gTile');
  let drag = null, hover = null;
  const light = cell => {
    for (const el of document.querySelectorAll('#tGrid .lit, #tGrid .hover')) el.classList.remove('lit', 'hover');
    hover = cell && cell.classList.contains('gc') && !cell.classList.contains('off') ? cell : null;
    if (!hover) return;
    hover.classList.add('hover');
    for (const el of document.querySelectorAll(`#tGrid [data-row="${hover.dataset.r}"], #tGrid [data-col="${hover.dataset.c}"]`)) el.classList.add('lit');
  };
  tile.addEventListener('pointerdown', e => {
    if (!G || G.done) return;
    e.preventDefault();
    if (G.start === null) G.start = Date.now();
    const r = tile.getBoundingClientRect();
    drag = { id: e.pointerId, dx: e.clientX - r.left, dy: e.clientY - r.top };
    tile.setPointerCapture(e.pointerId);
    tile.classList.add('dragging');
    tile.style.left = r.left + 'px'; tile.style.top = r.top + 'px';
  });
  tile.addEventListener('pointermove', e => {
    if (!drag || e.pointerId !== drag.id) return;
    tile.style.left = (e.clientX - drag.dx) + 'px'; tile.style.top = (e.clientY - drag.dy) + 'px';
    const el = document.elementFromPoint(e.clientX, e.clientY);
    light(el && el.closest('.gc'));
  });
  const end = e => {
    if (!drag || e.pointerId !== drag.id) return;
    drag = null;
    tile.classList.remove('dragging'); tile.style.left = tile.style.top = '';
    const target = hover; light(null);
    if (target) dropOn(target);
  };
  tile.addEventListener('pointerup', end);
  tile.addEventListener('pointercancel', end);
})();

// ---------- links from /sums/review/ ----------
// ?act=ruler&yr=4&kinds=thermo opens that activity's setup with those choices picked
// (not saved until Start), after a name is chosen. Unknown keys and values are ignored.
let LINK = (() => {
  const p = new URLSearchParams(location.search), a = p.get('act');
  if (!a || !Object.hasOwn(ACTS, a)) return null;
  const over = {};
  for (const [k, v] of p) if (k !== 'act') over[k] = v.includes(',') || k === 'kinds' ? v.split(',').map(optVal) : optVal(v);
  return { act: a, over };
})();
function openLink() {
  const L = LINK; LINK = null;
  try { history.replaceState(null, '', location.pathname); } catch (e) {}
  act = L.act;
  if (pageYears().includes(L.over.yr)) view = L.over.yr;
  if (ACTS[act].setup === 'none') { buildSheet(loadCfg(act)); show('sheet'); if (reads()) say(ACTS[act].say); return; }
  goSetup();
  for (const o of ACTS[act].options || []) {
    if (!(o.key in L.over)) continue;
    const ok = o.values.map(v => Array.isArray(v) ? v[0] : v), want = [].concat(L.over[o.key]).filter(v => ok.includes(v));
    if (want.length) draft[o.key] = o.multi ? want : want[0];
  }
  if (countsOf(act).includes(L.over.n)) draft.n = L.over.n;
  syncOpts();
  if (reads()) say('Choose, then press Start.');
}

// ---------- what a problem report sends (report.js) ----------
// No names: year, activity, settings, and on a sheet each card's question, what was read and the writing.
window.sumsReportContext = () => {
  const round = s => s.map(p => [Math.round(p[0] * 100) / 100, Math.round(p[1] * 100) / 100]);
  const playing = screen === 'sheet' || screen === 'grid';
  const out = { where: `Sums: ${screen}${act && screen !== 'home' && screen !== 'names' ? ' · ' + ACTS[act].name : ''}`, screen, year, view, act };
  if (screen === 'setup' && draft) out.settings = draft;
  if (playing) out.settings = cfg;
  if (screen === 'sheet') out.cards = cards.map((k, i) => ({
    n: i + 1, q: k.q, state: k.el.dataset.state, read: k.el.querySelector('.read').textContent, tries: k.tries, first: k.first,
    pick: k.pick, strokes: k.q.kind === 'tap' ? undefined : k.strokes.map(round),
  }));
  if (screen === 'grid' && G) out.grid = G;
  return out;
};

goNames();
</script>
