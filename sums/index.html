<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Sums</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23fff'/%3E%3Cpath d='M16 7v18M7 16h18' stroke='%23000' stroke-width='4'/%3E%3C/svg%3E">
<style>
  :root {
    --ink: #111; --paper: #fff; --line: #d4d4d4; --faint: #888;
    --right: #1d6b35; --wrong: #a3201b;
    --head: 52px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--paper); color: var(--ink);
    font: 16px/1.3 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    -webkit-user-select: none; user-select: none;
    -webkit-tap-highlight-color: transparent;
    overflow: hidden;
  }
  button {
    font: inherit; color: var(--ink); background: var(--paper);
    border: 1.5px solid var(--ink); border-radius: 4px;
    padding: 6px 12px; cursor: pointer; touch-action: manipulation;
  }
  button:active { background: #eee; }
  button.primary { background: var(--ink); color: var(--paper); }
  button.primary:active { background: #333; }
  [hidden] { display: none !important; }

  header {
    height: var(--head); display: flex; align-items: center; gap: 8px;
    padding: 0 max(12px, env(safe-area-inset-right)) 0 max(12px, env(safe-area-inset-left));
    border-bottom: 1.5px solid var(--ink);
  }
  header h1 { font-size: 20px; margin: 0 0 0 4px; font-weight: 700; letter-spacing: .02em; }
  #whoBtn { max-width: 34vw; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 600; }
  #score { margin-left: auto; font-variant-numeric: tabular-nums; white-space: nowrap; text-align: right; }
  #score b { font-size: 20px; }
  @media (max-width: 600px) { header h1, .wide { display: none; } }

  /* panels (settings, who) */
  .panel {
    position: fixed; inset: var(--head) 0 0 0; background: var(--paper);
    overflow: auto; padding: 20px 16px 40px; z-index: 5; -webkit-user-select: text; user-select: text;
  }
  .set { max-width: 560px; margin: 0 auto 22px; }
  .set h2 { font-size: 15px; font-weight: 600; margin: 0 0 8px; }
  .opts { display: flex; gap: 8px; flex-wrap: wrap; }
  .opts button { min-width: 56px; min-height: 48px; font-size: 20px; }
  /* choices page, laid out like a sum */
  .builder { max-width: 460px; margin: 0 auto; }
  .bline { display: grid; grid-template-columns: 52px auto auto; column-gap: 14px; row-gap: 6px; justify-content: start; margin-bottom: 18px; }
  .lab { font-size: 14px; font-weight: 600; margin-bottom: 2px; }
  .faint { color: var(--faint); font-weight: 400; }
  .kp { display: grid; grid-template-columns: repeat(3, 52px); grid-auto-rows: 52px; gap: 6px; touch-action: none; }
  .kp button, .signs button, .big button { padding: 0; border-color: var(--line); border-radius: 8px; }
  .kp button { font-size: 24px; font-variant-numeric: tabular-nums; }
  .kp .allk { grid-column: span 2; font-size: 16px; }
  .signs { display: grid; grid-auto-rows: 52px; gap: 6px; align-self: end; }
  .signs button { font-size: 30px; line-height: 1; }
  .big { display: grid; grid-auto-rows: 52px; gap: 6px; align-content: start; }
  .big button { padding: 0 12px; font-size: 16px; font-variant-numeric: tabular-nums; }
  .kp button[aria-pressed="true"], .signs button[aria-pressed="true"], .big button[aria-pressed="true"] {
    background: var(--ink); color: var(--paper); border-color: var(--ink);
  }
  .brule { border-top: 2px solid var(--ink); margin: 4px 0 16px; }
  .bfoot { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; flex-wrap: wrap; margin-bottom: 18px; }
  .bfoot .go { margin: 0; }
  .bfoot .opts button { min-width: 52px; min-height: 48px; font-size: 20px; }
  button:disabled { opacity: .35; cursor: default; }
  .warn { color: var(--wrong); margin: 0 0 12px; font-size: 15px; }
  .warn:empty { display: none; }
  #preview { display: flex; flex-wrap: wrap; gap: 10px; margin: 6px 0 10px; cursor: pointer; }
  .mini { border: 1.5px solid var(--line); border-radius: 6px; padding: 10px 16px 30px; min-width: 96px; display: flex; justify-content: center; }
  .mini .qv.col, .mini .qv.div { position: relative; inset: auto; transform: none; font-size: 24px; }
  .mini .qv.col { margin-top: .6em; }
  .mini .qv.div { margin-top: 1.4em; }
  .opts button[aria-pressed="true"] { background: var(--ink); color: var(--paper); }
  .set .hint { color: var(--faint); font-size: 14px; margin: 6px 0 0; }
  .go { max-width: 560px; margin: 0 auto; display: flex; gap: 10px; }
  .go button { min-height: 48px; padding: 0 22px; font-size: 18px; }
  .add { display: flex; gap: 8px; margin-top: 10px; }
  .add input { font: inherit; font-size: 18px; padding: 8px 10px; border: 1.5px solid var(--ink); border-radius: 4px; width: 12em; max-width: 60vw; }
  table { border-collapse: collapse; width: 100%; font-variant-numeric: tabular-nums; }
  td, th { text-align: left; padding: 6px 8px 6px 0; border-bottom: 1px solid var(--line); vertical-align: top; }
  th { font-size: 13px; font-weight: 600; color: var(--faint); }
  td.t { font-weight: 700; white-space: nowrap; }
  .empty { color: var(--faint); }
  #removeBtn { border-color: var(--line); color: var(--faint); font-size: 14px; }
  .whonext { margin-bottom: 34px; }
  header button[aria-pressed="true"] { background: var(--ink); color: var(--paper); }

  /* sheet */
  #sheet {
    height: calc(100dvh - var(--head)); overflow: auto;
    display: grid; gap: 10px; padding: 10px;
    padding-bottom: max(10px, env(safe-area-inset-bottom));
    grid-template-columns: repeat(var(--cols), minmax(0, 1fr));
    grid-auto-rows: minmax(190px, 1fr);
  }
  #sheet[data-n="6"]  { --cols: 2; }
  #sheet[data-n="12"] { --cols: 3; }
  #sheet[data-n="20"] { --cols: 4; }
  @media (orientation: landscape) {
    #sheet[data-n="6"]  { --cols: 3; }
    #sheet[data-n="12"] { --cols: 4; }
    #sheet[data-n="20"] { --cols: 5; }
  }
  @media (orientation: portrait) and (max-width: 560px) {
    #sheet[data-n] { --cols: 2; }
  }

  .card {
    border: 1.5px solid var(--line); border-radius: 6px;
    display: flex; flex-direction: column; min-width: 0;
  }
  .work { flex: 1; position: relative; container-type: size; touch-action: none; overflow: hidden; }
  .work canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }

  /* the printed question; --h and --c (height and width in em) are set per card */
  .qv {
    position: absolute; font-weight: 600; line-height: 1.1; pointer-events: none;
    font-variant-numeric: tabular-nums; white-space: nowrap;
    font-size: min(calc(100cqh / var(--h)), calc(100cqw / var(--c)), 64px);
  }
  .qv.col { top: 1.2em; left: 50%; transform: translateX(-50%); width: calc((var(--d) + 1.2) * 1ch); }
  .col .row { display: flex; justify-content: space-between; }
  .col .rule { border-top: .07em solid var(--ink); margin-top: .12em; }
  .qv.div { top: 50%; left: 50%; transform: translate(-50%, -50%); display: flex; align-items: flex-end; }
  .div .dd { position: relative; border-top: .07em solid var(--ink); padding: .1em .15em 0 .5em; margin-left: .12em; }
  .div .br { position: absolute; left: 0; top: -.07em; width: .38em; height: calc(100% + .07em); overflow: visible; }

  .foot { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; min-height: 36px; padding: 2px 8px 5px; }
  .read { color: var(--faint); font-variant-numeric: tabular-nums; font-size: 15px; }
  .mark { font-size: 24px; font-weight: 700; line-height: 1; }
  .foot button { padding: 3px 9px; font-size: 14px; white-space: nowrap; }
  .foot .undo { margin-left: auto; }
  .foot .undo, .foot .clear { border-color: var(--line); color: var(--faint); }
  .retry, .override, .mark { display: none; }

  .card[data-state="right"] { border-color: var(--right); border-width: 2.5px; }
  .card[data-state="right"] .mark { display: inline; color: var(--right); }
  .card[data-state="wrong"] { border-color: var(--wrong); border-width: 2.5px; }
  .card[data-state="wrong"] .mark { display: inline; color: var(--wrong); }
  .card[data-state="wrong"] .retry { display: inline-block; margin-left: auto; }
  .card[data-state="right"][data-claim="1"] .override { display: inline-block; margin-left: auto; }
  .card[data-state="right"] .undo, .card[data-state="right"] .clear,
  .card[data-state="wrong"] .undo, .card[data-state="wrong"] .clear { display: none; }
  .card[data-state="right"] .work, .card[data-state="wrong"] .work { pointer-events: none; }
  .fixed { color: var(--faint); font-size: 13px; }
</style>
</head>
<body>
<header>
  <button id="whoBtn">Everyone</button>
  <button id="settingsBtn">Start again</button>
  <h1>Sums</h1>
  <span id="score"></span>
  <button id="markBtn" class="primary">Mark</button>
</header>

<section id="settings" class="panel" hidden>
  <div class="builder">
    <div class="bline">
      <div></div>
      <div class="lab">First number</div>
      <div class="lab">Or bigger</div>
      <div></div>
      <div class="kp" data-line="a"></div>
      <div class="big" data-line="a"><button data-d="2">10–99</button><button data-d="3">100–999</button><button data-d="4">1000–9999</button></div>
    </div>
    <div class="bline">
      <div></div>
      <div class="lab">Second number</div>
      <div></div>
      <div class="signs" id="opsOpts">
        <button data-v="+">+</button><button data-v="-">−</button><button data-v="*">×</button><button data-v="/">÷</button>
      </div>
      <div class="kp" data-line="b"></div>
      <div class="big" data-line="b"><button data-d="2">10–99</button><button data-d="3">100–999</button><button data-d="4">1000–9999</button></div>
    </div>
    <div class="brule"></div>
    <div class="bfoot">
      <div>
        <div class="lab">Questions</div>
        <div class="opts" id="nOpts"><button data-v="6">6</button><button data-v="12">12</button><button data-v="20">20</button></div>
      </div>
      <div class="go"><button id="newBtn" class="primary">Start</button><button class="back">Back</button></div>
    </div>
    <p class="warn" id="warn"></p>
    <div class="lab">Like these <span class="faint">(tap for more)</span></div>
    <div id="preview"></div>
    <p class="hint">Takeaways never go below zero. Division always comes out exactly: you divide by the second number.</p>
  </div>
</section>

<section id="who" class="panel" hidden>
  <div class="set">
    <h2>Who's doing sums?</h2>
    <div class="opts" id="playerList"></div>
    <div class="add"><input id="newName" placeholder="New name" maxlength="20" autocomplete="off"><button id="addBtn">Add</button></div>
  </div>
  <div class="go whonext"><button id="toSetupBtn" class="primary">Choose sums</button><button class="back">Back to the sheet</button></div>
  <div class="set">
    <h2 id="recTitle">Best times</h2>
    <div id="records"></div>
  </div>
  <div class="set">
    <h2>Recent sheets</h2>
    <div id="history"></div>
  </div>
  <div class="go"><button id="removeBtn" hidden></button></div>
</section>

<main id="sheet" data-n="12"></main>

<template id="cardT">
  <div class="card" data-state="writing">
    <div class="work"><div class="qv"></div><canvas></canvas></div>
    <div class="foot">
      <span class="mark"></span><span class="read"></span>
      <button class="retry">Try again</button>
      <button class="override">I was right the first time</button>
      <button class="undo">Undo</button>
      <button class="clear">Clear</button>
    </div>
  </div>
</template>

<script src="model.js"></script>
<script src="digits.js"></script>
<script>
'use strict';
const $ = s => document.querySelector(s);
const SIGN = { '+': '+', '-': '−', '*': '×', '/': '÷' };
const OP_ORDER = ['+', '-', '*', '/'];
const store = {
  get(k, d) { try { const v = JSON.parse(localStorage.getItem(k)); return v == null ? d : v; } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} },
};

// ---------- settings ----------
const ONE_TO_NINE = [1, 2, 3, 4, 5, 6, 7, 8, 9];
const DEFAULTS = { ops: ['+'], a: 1, b: 1, pa: ONE_TO_NINE, pb: ONE_TO_NINE, n: 12 };
function loadSettings() {
  const s = store.get('sums-settings', null);
  if (!(s && Array.isArray(s.ops) && s.ops.length)) return null;
  const out = { ...DEFAULTS, ...s };
  for (const k of ['pa', 'pb']) if (!Array.isArray(out[k]) || !out[k].length) out[k] = ONE_TO_NINE;
  return out;
}
let settings = loadSettings();
const firstVisit = !settings;
if (!settings) settings = { ...DEFAULTS };
settings.pa = [...settings.pa]; settings.pb = [...settings.pb];

// The choices page is laid out like a sum: first number's keypad on top, signs
// beside the second number's keypad, a line, then how many and Start.
const KEYS = [7, 8, 9, 4, 5, 6, 1, 2, 3, 0];
for (const kp of document.querySelectorAll('.kp')) {
  kp.innerHTML = KEYS.map(k => `<button data-k="${k}">${k}</button>`).join('') + '<button data-k="all" class="allk">All</button>';
}
function syncOpts() {
  for (const b of $('#opsOpts').children) b.setAttribute('aria-pressed', settings.ops.includes(b.dataset.v));
  for (const line of ['a', 'b']) {
    const d = settings[line], p = settings['p' + line];
    for (const k of document.querySelectorAll(`.kp[data-line="${line}"] [data-k]`))
      k.setAttribute('aria-pressed', d === 1 && (k.dataset.k === 'all' ? p.length === 10 : p.includes(+k.dataset.k)));
    for (const k of document.querySelectorAll(`.big[data-line="${line}"] [data-d]`))
      k.setAttribute('aria-pressed', +k.dataset.d === d);
  }
  for (const b of $('#nOpts').children) b.setAttribute('aria-pressed', +b.dataset.v === settings.n);
  renderPreview();
}
$('#opsOpts').addEventListener('click', e => {
  const v = e.target.dataset && e.target.dataset.v; if (!v) return;
  const i = settings.ops.indexOf(v);
  if (i >= 0) { if (settings.ops.length > 1) settings.ops.splice(i, 1); }
  else settings.ops.push(v);
  syncOpts();
});
$('#nOpts').addEventListener('click', e => {
  const v = e.target.dataset && e.target.dataset.v; if (!v) return;
  settings.n = +v; syncOpts();
});
for (const big of document.querySelectorAll('.big')) big.addEventListener('click', e => {
  const d = e.target.closest('[data-d]'); if (!d) return;
  settings[big.dataset.line] = +d.dataset.d; syncOpts();
});
// keypad: tap to toggle a digit, or drag across keys to set them all the same way
function setKey(line, k, on) {
  const pk = 'p' + line;
  if (k === 'all') { settings[line] = 1; settings[pk] = [0, ...ONE_TO_NINE]; return; }
  k = +k;
  if (settings[line] !== 1) { settings[line] = 1; settings[pk] = [k]; return; } // fresh pick
  const has = settings[pk].includes(k);
  if (on && !has) settings[pk] = [...settings[pk], k].sort((x, y) => x - y);
  if (!on && has && settings[pk].length > 1) settings[pk] = settings[pk].filter(x => x !== k);
}
for (const kp of document.querySelectorAll('.kp')) {
  let sweep = null;
  const keyAt = e => { const el = document.elementFromPoint(e.clientX, e.clientY); const k = el && el.closest('[data-k]'); return k && kp.contains(k) ? k : null; };
  kp.addEventListener('pointerdown', e => {
    const k = keyAt(e); if (!k) return;
    e.preventDefault();
    const line = kp.dataset.line;
    const on = !(settings[line] === 1 && k.dataset.k !== 'all' && settings['p' + line].includes(+k.dataset.k));
    sweep = { line, on, done: new Set([k.dataset.k]) };
    setKey(line, k.dataset.k, on); syncOpts();
  });
  kp.addEventListener('pointermove', e => {
    if (!sweep) return;
    const k = keyAt(e);
    if (!k || k.dataset.k === 'all' || sweep.done.has(k.dataset.k)) return;
    sweep.done.add(k.dataset.k); setKey(sweep.line, k.dataset.k, sweep.on); syncOpts();
  });
  for (const ev of ['pointerup', 'pointercancel', 'pointerleave']) kp.addEventListener(ev, () => { sweep = null; });
}
// a few sample sums in the printed style, so you can see what she will get
function renderPreview() {
  const ops = usableOps(), box = $('#preview');
  $('#warn').textContent = ops.length < settings.ops.length ? 'To divide, choose a second number other than 0.' : '';
  $('#newBtn').disabled = !ops.length;
  if (!ops.length) { box.innerHTML = ''; return; }
  const seen = new Set(), qs = [];
  for (let t = 0; t < 40 && qs.length < 4; t++) {
    const q = makeQ(ops[qs.length % ops.length], lineA(), lineB());
    const id = q.a + q.op + q.b; if (!seen.has(id)) { seen.add(id); qs.push(q); }
  }
  box.innerHTML = qs.map(q => {
    const m = qMarkup(q), style = Object.entries(m.vars).map(([k, v]) => `${k}:${v}`).join(';');
    return `<div class="mini"><div class="qv ${m.cls}" style="${style}">${m.html}</div></div>`;
  }).join('');
}
$('#preview').addEventListener('click', renderPreview);

// ---------- players and records ----------
// Everyone (guest) plus named players, as in Typurr. Records are per player:
// best time to get a whole sheet right, for each combination of settings.
let players = store.get('sums-players', []);
let current = store.get('sums-current', 'guest');
if (current !== 'guest' && !players.some(p => p.id === current)) current = 'guest';
const allPlayers = () => [{ id: 'guest', name: 'Everyone' }, ...players];
const playerName = id => (allPlayers().find(p => p.id === id) || { name: 'Everyone' }).name;
const recKey = id => 'sums-rec-' + id;
const loadRec = id => store.get(recKey(id), { best: {}, history: [] });

// key: signs | first | second | count, where a keypad line is "1:" + its digits
function comboKey(s) {
  const part = L => L.d === 1 ? '1:' + [...L.p].sort((x, y) => x - y).join('') : String(L.d);
  return OP_ORDER.filter(o => s.ops.includes(o)).join('') + '|' + part(lineOf(s.a, s.pa)) + '|' + part(lineOf(s.b, s.pb)) + '|' + s.n;
}
function digitsLabel(ds) { // [0,1,2,3,5,7] -> "0–3, 5, 7"
  const out = [];
  for (let i = 0; i < ds.length; i++) {
    let j = i; while (j + 1 < ds.length && ds[j + 1] === ds[j] + 1) j++;
    out.push(j - i >= 2 ? `${ds[i]}–${ds[j]}` : j > i ? `${ds[i]}, ${ds[j]}` : `${ds[i]}`);
    i = j;
  }
  return out.join(', ');
}
function partLabel(p) {
  if (p.includes(':')) return digitsLabel([...p.split(':')[1]].map(Number));
  return p === '1' ? '1-digit' : `${p}-digit`;
}
function comboLabel(k) {
  const [ops, a, b, n] = k.split('|');
  return `${[...ops].map(o => SIGN[o]).join(' ')} · ${partLabel(a)} and ${partLabel(b)} · ${n} questions`;
}
function fmtTime(ms) { const s = Math.round(ms / 1000); return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); }
function fmtDate(t) { return new Date(t).toLocaleDateString(undefined, { day: 'numeric', month: 'short' }); }
const esc = s => String(s).replace(/[&<>"]/g, ch => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[ch]);

function saveResult(key, ms, first, n) {
  const r = loadRec(current);
  const prev = r.best[key];
  const isBest = !prev || ms < prev.ms;
  r.best[key] = { ms: isBest ? ms : prev.ms, count: (prev ? prev.count : 0) + 1, t: Date.now() };
  const t = Date.now();
  r.history.unshift({ k: key, ms, first, n, t });
  r.history = r.history.slice(0, 100);
  store.set(recKey(current), r);
  return { isBest, best: r.best[key].ms, hadPrev: !!prev, first, t, player: current };
}

function renderWho() {
  $('#whoBtn').textContent = playerName(current);
  $('#playerList').innerHTML = allPlayers().map(p =>
    `<button data-id="${esc(p.id)}" aria-pressed="${p.id === current}">${esc(p.name)}</button>`).join('');
  const r = loadRec(current);
  $('#recTitle').textContent = `Best times for ${playerName(current)}`;
  const best = Object.entries(r.best).sort((x, y) => y[1].t - x[1].t);
  $('#records').innerHTML = best.length
    ? `<table><tr><th>Sheet</th><th>Best</th><th>Done</th></tr>${best.map(([k, v]) =>
        `<tr><td>${comboLabel(k)}</td><td class="t">${fmtTime(v.ms)}</td><td>${v.count}×</td></tr>`).join('')}</table>`
    : '<p class="empty">No finished sheets yet. A sheet counts when every answer is right.</p>';
  $('#history').innerHTML = r.history.length
    ? `<table><tr><th>Day</th><th>Sheet</th><th>Time</th><th>First try</th></tr>${r.history.slice(0, 15).map(h =>
        `<tr><td>${fmtDate(h.t)}</td><td>${comboLabel(h.k)}</td><td class="t">${fmtTime(h.ms)}</td><td>${h.first}/${h.n}</td></tr>`).join('')}</table>`
    : '<p class="empty">Nothing yet.</p>';
  const rm = $('#removeBtn');
  rm.hidden = current === 'guest'; rm.dataset.armed = ''; rm.textContent = `Remove ${playerName(current)}`;
}
$('#playerList').addEventListener('click', e => {
  const id = e.target.dataset && e.target.dataset.id; if (!id) return;
  current = id; store.set('sums-current', id); renderWho();
});
function addPlayer() {
  const name = $('#newName').value.trim().slice(0, 20); if (!name) return;
  const p = { id: Date.now().toString(36), name };
  players.push(p); store.set('sums-players', players);
  current = p.id; store.set('sums-current', p.id);
  $('#newName').value = ''; renderWho();
}
$('#addBtn').onclick = addPlayer;
$('#newName').addEventListener('keydown', e => { if (e.key === 'Enter') addPlayer(); });
$('#removeBtn').onclick = () => {
  const rm = $('#removeBtn');
  if (!rm.dataset.armed) { rm.dataset.armed = '1'; rm.textContent = `Tap again to remove ${playerName(current)} and their records`; return; }
  players = players.filter(p => p.id !== current); store.set('sums-players', players);
  try { localStorage.removeItem(recKey(current)); } catch (e) {}
  current = 'guest'; store.set('sums-current', current); renderWho();
};

// ---------- questions ----------
// A "line" is one of the two numbers: { d: digits, p: picked digits }.
// d = 1 means a single digit chosen from p (the keypad); d = 2..4 means any
// number with that many digits.
const rnd = (lo, hi) => lo + Math.floor(Math.random() * (hi - lo + 1));
const pickOne = arr => arr[rnd(0, arr.length - 1)];
const lineOf = (d, p) => typeof d === 'object' ? d : { d, p: p || [1, 2, 3, 4, 5, 6, 7, 8, 9] };
const lineA = () => lineOf(settings.a, settings.pa), lineB = () => lineOf(settings.b, settings.pb);
const num = L => L.d === 1 ? pickOne(L.p) : rnd(10 ** (L.d - 1), 10 ** L.d - 1);
// For ÷ the second number is the divisor and the answer comes from the first
// number's choices (keypad), or the first number sets the dividend's digits.
function makeQ(op, A, B) {
  A = lineOf(A); B = lineOf(B);
  let a, b;
  if (op === '+') { a = num(A); b = num(B); return { a, b, op, ans: a + b }; }
  if (op === '*') { a = num(A); b = num(B); return { a, b, op, ans: a * b }; }
  if (op === '-') {
    for (let t = 0; t < 20; t++) { a = num(A); b = num(B); if (a >= b) break; }
    if (b > a) [a, b] = [b, a];
    return { a, b, op, ans: a - b };
  }
  if (B.d === 1) { const nz = B.p.filter(x => x > 0); if (!nz.length) return null; b = pickOne(nz); }
  else b = rnd(10 ** (B.d - 1), 10 ** B.d - 1);
  if (A.d === 1) { const q = num(A); return { a: b * q, b, op, ans: q }; }
  // dividend has A.d digits where possible
  const alo = 10 ** (A.d - 1), ahi = 10 ** A.d - 1;
  let qlo = Math.max(2, Math.ceil(alo / b)), qhi = Math.floor(ahi / b);
  if (qlo > qhi) { qlo = Math.min(qlo, 9); qhi = Math.max(qlo, Math.min(qhi, 9)); if (qhi < qlo) qhi = qlo; }
  const q = rnd(qlo, qhi);
  return { a: b * q, b, op, ans: q };
}
// signs that can actually make a question with these choices (÷ needs a non-zero divisor)
const usableOps = () => settings.ops.filter(op => op !== '/' || lineB().d > 1 || lineB().p.some(x => x > 0));
function makeSheet() {
  const seen = new Set(), qs = [], ops = usableOps();
  for (let i = 0; i < settings.n; i++) {
    let q;
    for (let t = 0; t < 30; t++) {
      q = makeQ(pickOne(ops), lineA(), lineB());
      if (!seen.has(q.a + q.op + q.b)) break;
    }
    seen.add(q.a + q.op + q.b); qs.push(q);
  }
  return qs;
}

// The printed question. + − × are stacked and right-aligned with a line under
// them (space above for carrying, answer goes under the line). ÷ is a long
// division bracket in the middle: divisor ) dividend with a bar over it, answer
// goes on the bar. --h / --c are the height / width the layout needs, in em.
function qMarkup(q) {
  const { a, b, op, ans } = q, len = n => String(n).length;
  if (op === '/') return {
    cls: 'div',
    html: `<span class="dv">${b}</span><span class="dd"><svg class="br" viewBox="0 0 10 40" preserveAspectRatio="none"><path d="M1 0 Q 13 20 1 40" fill="none" stroke="currentColor" stroke-width="2.6" vector-effect="non-scaling-stroke" style="stroke-width:.07em"/></svg>${a}</span>`,
    vars: { '--h': 5.2, '--c': (len(a) + len(b)) * 0.62 + 2.4 },
  };
  const d = Math.max(len(a), len(b), len(ans));
  const below = op === '*' && len(b) > 1 ? 1.1 * (len(b) + 1) + 0.3 : 1.7;
  return {
    cls: 'col',
    html: `<div class="row"><span></span><span>${a}</span></div><div class="row"><span>${SIGN[op]}</span><span>${b}</span></div><div class="rule"></div>`,
    vars: { '--d': d, '--h': 3.6 + below, '--c': (d + 1.2) * 0.62 + 1.6 },
  };
}
function layout(c) {
  const qv = c.el.querySelector('.qv'), m = qMarkup(c.q);
  qv.className = 'qv ' + m.cls; qv.innerHTML = m.html;
  for (const k in m.vars) qv.style.setProperty(k, m.vars[k]);
  c.anchorEl = qv.querySelector(m.cls === 'div' ? '.dd' : '.rule');
}

// ---------- cards and writing ----------
let cards = [], sheetKey = '', sheetStart = null, sheetDone = false;
let penSeen = false; // once a stylus is used, ignore fingers and palms
const ro = new ResizeObserver(entries => { for (const en of entries) en.target._card && sizeCanvas(en.target._card); });

function buildSheet() {
  const sheet = $('#sheet');
  for (const c of cards) ro.unobserve(c.work);
  sheet.innerHTML = ''; sheet.dataset.n = settings.n; sheet.scrollTop = 0;
  sheetKey = comboKey(settings); sheetStart = null; sheetDone = false;
  cards = makeSheet().map(q => {
    const el = $('#cardT').content.firstElementChild.cloneNode(true);
    const c = { q, el, work: el.querySelector('.work'), cv: el.querySelector('canvas'), strokes: [], tries: 0, first: null, timer: 0, ax: 0, ay: 0, F: 20 };
    layout(c);
    c.work._card = c;
    wirePad(c);
    el.querySelector('.undo').onclick = () => { c.strokes.pop(); draw(c); scheduleRead(c, 0); };
    el.querySelector('.clear').onclick = () => { c.strokes = []; draw(c); showRead(c, ''); };
    el.querySelector('.retry').onclick = () => {
      // keep the working, take away only the answer that was read
      const used = new Set(answerStrokes(c));
      c.strokes = c.strokes.filter(s => !used.has(s));
      draw(c); showRead(c, ''); setState(c, 'writing');
    };
    // She only finds out her first answer was right once she has the right
    // answer, so the claim is offered after a later try is marked right.
    el.querySelector('.override').onclick = () => {
      c.first = true; c.el.dataset.claim = '';
      c.el.querySelector('.read').innerHTML = `${c.q.ans} <span class="fixed">· right first time</span>`;
      updateScore();
    };
    sheet.appendChild(el); ro.observe(c.work);
    return c;
  });
  updateScore();
}

// Strokes are stored relative to the question: origin at the right end of the
// answer line (or the division bar), in units of the printed font size. So the
// writing stays lined up with the numbers when the screen rotates.
function sizeCanvas(c) {
  const r = c.work.getBoundingClientRect(), dpr = window.devicePixelRatio || 1;
  const ar = c.anchorEl.getBoundingClientRect();
  c.w = r.width; c.h = r.height;
  c.F = parseFloat(getComputedStyle(c.el.querySelector('.qv')).fontSize) || 20;
  c.ax = ar.right - r.left;
  c.ay = (c.q.op === '/' ? ar.top : ar.bottom) - r.top;
  c.cv.width = Math.round(r.width * dpr); c.cv.height = Math.round(r.height * dpr);
  draw(c);
}
function draw(c) {
  const g = c.cv.getContext('2d'), dpr = window.devicePixelRatio || 1, F = c.F;
  const X = x => c.ax + x * F, Y = y => c.ay + y * F;
  g.setTransform(dpr, 0, 0, dpr, 0, 0);
  g.clearRect(0, 0, c.w, c.h);
  g.lineCap = g.lineJoin = 'round'; g.strokeStyle = '#111'; g.fillStyle = '#111';
  g.lineWidth = Math.max(2.5, F * 0.085);
  for (const s of c.strokes) {
    if (s.length === 1) { g.beginPath(); g.arc(X(s[0][0]), Y(s[0][1]), g.lineWidth / 2, 0, 7); g.fill(); continue; }
    g.beginPath(); g.moveTo(X(s[0][0]), Y(s[0][1]));
    for (let i = 1; i < s.length; i++) g.lineTo(X(s[i][0]), Y(s[i][1]));
    g.stroke();
  }
}
function wirePad(c) {
  let active = null, cur = null;
  const pt = e => { const r = c.work.getBoundingClientRect(); return [(e.clientX - r.left - c.ax) / c.F, (e.clientY - r.top - c.ay) / c.F]; };
  c.work.addEventListener('pointerdown', e => {
    if (e.pointerType === 'pen') penSeen = true;
    if (penSeen && e.pointerType === 'touch') return;
    if (active !== null || c.el.dataset.state !== 'writing') return;
    e.preventDefault();
    if (sheetStart === null) sheetStart = Date.now();
    active = e.pointerId; c.work.setPointerCapture(e.pointerId);
    cur = [pt(e)]; c.strokes.push(cur); clearTimeout(c.timer); draw(c);
  });
  c.work.addEventListener('pointermove', e => {
    if (e.pointerId !== active) return;
    const evs = e.getCoalescedEvents ? e.getCoalescedEvents() : [e];
    for (const ev of (evs.length ? evs : [e])) cur.push(pt(ev));
    draw(c);
  });
  const end = e => {
    if (e.pointerId !== active) return;
    active = null; cur = null;
    scheduleRead(c, 500);
  };
  c.work.addEventListener('pointerup', end);
  c.work.addEventListener('pointercancel', end);
}

// Which strokes are the answer? Below the line for + − × (above the bar for ÷).
// Ruled lines are ignored, and if there are several rows (long multiplication
// working) only the row nearest the bottom is the answer.
function answerStrokes(c) {
  const below = c.q.op !== '/';
  const items = [];
  for (const s of c.strokes) {
    let x0 = Infinity, x1 = -Infinity, y0 = Infinity, y1 = -Infinity;
    for (const [x, y] of s) { x0 = Math.min(x0, x); x1 = Math.max(x1, x); y0 = Math.min(y0, y); y1 = Math.max(y1, y); }
    const cy = (y0 + y1) / 2;
    if (below ? cy <= 0 : cy >= 0) continue;
    if (x1 - x0 > 1.4 && y1 - y0 < (x1 - x0) * 0.25) continue; // a ruled line
    items.push({ s, y0, y1 });
  }
  items.sort((p, q) => p.y0 - q.y0);
  const rows = [];
  for (const it of items) {
    const r = rows[rows.length - 1];
    if (r && it.y0 < r.y1 - 0.05) { r.y1 = Math.max(r.y1, it.y1); r.s.push(it.s); }
    else rows.push({ y1: it.y1, s: [it.s] });
  }
  return rows.length ? rows[rows.length - 1].s : [];
}
function read(c) { return SumsDigits.readNumber(answerStrokes(c), 1.1).text; }
function scheduleRead(c, ms) { clearTimeout(c.timer); c.timer = setTimeout(() => showRead(c, read(c)), ms); }
function showRead(c, t) { c.el.querySelector('.read').textContent = t; }
function setState(c, s) { c.el.dataset.state = s; c.el.querySelector('.mark').textContent = s === 'right' ? '✓' : s === 'wrong' ? '✗' : ''; }

// ---------- marking ----------
let lastResult = null;
function mark() {
  if (sheetDone) { buildSheet(); return; }
  for (const c of cards) {
    if (c.el.dataset.state !== 'writing') continue;
    clearTimeout(c.timer);
    const t = read(c);
    showRead(c, t);
    if (!t) continue;
    c.tries++;
    const ok = +t === c.q.ans;
    if (c.tries === 1) { c.first = ok; c.firstRead = t; }
    setState(c, ok ? 'right' : 'wrong');
    if (ok && c.first === false) {
      c.el.dataset.claim = '1';
      c.el.querySelector('.read').innerHTML = `${t} <span class="fixed">· first read ${c.firstRead}</span>`;
    }
  }
  updateScore();
}
function updateScore() {
  const done = cards.filter(c => c.first !== null).length;
  const right = cards.filter(c => c.first === true).length;
  const all = cards.length > 0 && cards.every(c => c.el.dataset.state === 'right');
  if (all && !sheetDone) {
    sheetDone = true;
    const ms = Date.now() - (sheetStart || Date.now());
    lastResult = { ms, ...saveResult(sheetKey, ms, right, cards.length) };
  } else if (sheetDone && lastResult && lastResult.first !== right) {
    // "I was right the first time" tapped after the sheet was finished
    const r = loadRec(lastResult.player), h = r.history.find(x => x.t === lastResult.t);
    if (h) { h.first = right; store.set(recKey(lastResult.player), r); }
    lastResult.first = right;
  }
  let html = done ? `<span class="wide">First try </span><b>${right}</b>/${cards.length}` : '';
  if (sheetDone && lastResult) {
    const L = lastResult;
    html += ` · <b>${fmtTime(L.ms)}</b>` + (L.isBest && L.hadPrev ? ' New best!' : L.isBest ? '' : ` <span class="wide">(best ${fmtTime(L.best)})</span>`);
  }
  $('#score').innerHTML = html;
  $('#markBtn').textContent = sheetDone ? 'New sheet' : 'Mark';
}

// ---------- wiring ----------
// The two pages (who's playing, choose sums) work like tabs: both header
// buttons stay visible and the open one is filled in. Moving between them keeps
// unsaved choices; Back (or tapping the open tab) returns to the sheet.
const TABS = { who: '#whoBtn', settings: '#settingsBtn' };
function openPanel(id) {
  for (const p of document.querySelectorAll('.panel')) p.hidden = p.id !== id;
  if (id === 'settings') syncOpts(); else renderWho();
  for (const [p, b] of Object.entries(TABS)) $(b).setAttribute('aria-pressed', p === id);
  for (const b of ['#markBtn', '#score']) $(b).hidden = true;
}
function closePanels() {
  for (const p of document.querySelectorAll('.panel')) p.hidden = true;
  for (const b of Object.values(TABS)) $(b).setAttribute('aria-pressed', false);
  for (const b of ['#markBtn', '#score']) $(b).hidden = false;
  settings = loadSettings() || settings;
  settings.pa = [...settings.pa]; settings.pb = [...settings.pb];
  renderWho();
}
$('#settingsBtn').onclick = () => $('#settings').hidden ? openPanel('settings') : closePanels();
$('#whoBtn').onclick = () => $('#who').hidden ? openPanel('who') : closePanels();
$('#toSetupBtn').onclick = () => openPanel('settings');
for (const b of document.querySelectorAll('.panel .back')) b.onclick = closePanels;
$('#newBtn').onclick = () => { store.set('sums-settings', settings); closePanels(); buildSheet(); };
$('#markBtn').onclick = mark;

renderWho();
buildSheet();
if (firstVisit) openPanel('settings');
</script>
</body>
</html>
