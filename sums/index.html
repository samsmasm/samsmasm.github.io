<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Sums</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23fff'/%3E%3Cpath d='M16 7v18M7 16h18' stroke='%23000' stroke-width='4'/%3E%3C/svg%3E">
<style>
  :root {
    --ink: #111; --paper: #fff; --line: #d4d4d4; --faint: #888;
    --right: #1d6b35; --wrong: #a3201b;
    --head: 52px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--paper); color: var(--ink);
    font: 16px/1.3 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    -webkit-user-select: none; user-select: none;
    -webkit-tap-highlight-color: transparent;
    overflow: hidden;
  }
  button {
    font: inherit; color: var(--ink); background: var(--paper);
    border: 1.5px solid var(--ink); border-radius: 4px;
    padding: 6px 12px; cursor: pointer; touch-action: manipulation;
  }
  button:active { background: #eee; }
  button.primary { background: var(--ink); color: var(--paper); }
  button.primary:active { background: #333; }
  button:disabled { opacity: .35; cursor: default; }
  [hidden] { display: none !important; }

  header {
    height: var(--head); display: flex; align-items: center; gap: 8px;
    padding: 0 max(12px, env(safe-area-inset-right)) 0 max(12px, env(safe-area-inset-left));
    border-bottom: 1.5px solid var(--ink);
  }
  header h1 { font-size: 20px; margin: 0 0 0 4px; font-weight: 700; letter-spacing: .02em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #score { margin-left: auto; font-variant-numeric: tabular-nums; white-space: nowrap; text-align: right; }
  #score b { font-size: 20px; }
  #sayBtn { padding: 4px 10px; line-height: 0; }
  #sayBtn svg { width: 24px; height: 24px; }
  .spacer { margin-left: auto; }
  @media (max-width: 600px) { .wide { display: none; } header h1.sheetTitle { display: none; } }

  /* full-page screens under the header */
  .panel {
    position: fixed; inset: var(--head) 0 0 0; background: var(--paper);
    overflow: auto; padding: 22px 16px 40px; z-index: 5;
  }
  .inner { max-width: 760px; margin: 0 auto; }
  .ask { font-size: 26px; font-weight: 700; margin: 4px 0 18px; }
  .tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 14px; }
  .tile {
    border: 1.5px solid var(--ink); border-radius: 14px; padding: 14px 12px 12px;
    display: flex; flex-direction: column; align-items: center; gap: 8px; min-height: 150px;
    justify-content: center; text-align: center;
  }
  .tile .pic { width: 100%; max-width: 150px; height: 84px; display: flex; align-items: center; justify-content: center; }
  .tile .pic svg { width: 100% !important; height: 100% !important; }
  .tile .nm { font-size: 20px; font-weight: 700; }
  .tile .sub { font-size: 14px; color: var(--faint); font-variant-numeric: tabular-nums; min-height: 1.2em; }
  .tile.person .nm { font-size: 28px; }
  .tile.add { border-style: dashed; border-color: var(--faint); color: var(--faint); }
  .tile.add .nm { font-size: 20px; font-weight: 600; }
  .addRow { display: flex; gap: 8px; margin-top: 16px; }
  .addRow input { font: inherit; font-size: 20px; padding: 10px 12px; border: 1.5px solid var(--ink); border-radius: 6px; width: 14em; max-width: 60vw; }
  .addRow button { font-size: 18px; padding: 0 18px; }
  .ages { display: grid; grid-template-columns: repeat(2, minmax(0, 220px)); gap: 16px; }
  .ages .tile { min-height: 190px; }
  .ages .tile .pic { height: 110px; }
  .ages .tile .nm { font-size: 40px; line-height: 1; }
  .ages.small { grid-template-columns: repeat(2, 130px); gap: 10px; }
  .ages.small .tile { min-height: 0; padding: 8px; }
  .ages.small .tile .pic { height: 56px; }
  .ages.small .tile .nm { font-size: 24px; }
  .tile[aria-pressed="true"] { background: var(--ink); color: var(--paper); }
  .tile[aria-pressed="true"] .sub { color: #ccc; }

  .set { margin: 0 0 24px; }
  .set h2 { font-size: 15px; font-weight: 600; margin: 0 0 8px; }
  .opts { display: flex; gap: 8px; flex-wrap: wrap; }
  .opts button { min-width: 56px; min-height: 48px; font-size: 20px; }
  .opts button[aria-pressed="true"] { background: var(--ink); color: var(--paper); }
  .hint { color: var(--faint); font-size: 14px; margin: 6px 0 0; }
  .go { display: flex; gap: 10px; flex-wrap: wrap; }
  .go button { min-height: 48px; padding: 0 22px; font-size: 18px; }
  table { border-collapse: collapse; width: 100%; font-variant-numeric: tabular-nums; }
  td, th { text-align: left; padding: 6px 8px 6px 0; border-bottom: 1px solid var(--line); vertical-align: top; }
  th { font-size: 13px; font-weight: 600; color: var(--faint); }
  td.t { font-weight: 700; white-space: nowrap; }
  .empty { color: var(--faint); }
  #removeBtn { border-color: var(--line); color: var(--faint); font-size: 14px; }
  #confirmRemoveBtn { border-color: var(--wrong); color: var(--wrong); border-width: 2px; min-height: 48px; padding: 0 18px; }

  /* setup page, laid out like a sum */
  .builder { max-width: 460px; margin: 0 auto; }
  .bline { display: grid; grid-template-columns: 52px auto auto; column-gap: 14px; row-gap: 6px; justify-content: start; margin-bottom: 18px; }
  .lab { font-size: 14px; font-weight: 600; margin-bottom: 2px; }
  .faint { color: var(--faint); font-weight: 400; }
  .kp { display: grid; grid-template-columns: repeat(3, 52px); grid-auto-rows: 52px; gap: 6px; touch-action: none; }
  .kp button, .signs button, .big button { padding: 0; border-color: var(--line); border-radius: 8px; }
  .kp button { font-size: 24px; font-variant-numeric: tabular-nums; }
  .kp .allk { grid-column: span 2; font-size: 16px; }
  .signs { display: grid; grid-auto-rows: 52px; gap: 6px; align-self: end; }
  .signs button { font-size: 30px; line-height: 1; }
  .big { display: grid; grid-auto-rows: 52px; gap: 6px; align-content: start; }
  .big button { padding: 0 12px; font-size: 16px; font-variant-numeric: tabular-nums; }
  .kp button[aria-pressed="true"], .signs button[aria-pressed="true"], .big button[aria-pressed="true"] {
    background: var(--ink); color: var(--paper); border-color: var(--ink);
  }
  /* arrays use the keypads for rows and columns: no signs, no bigger numbers */
  #kpBlock[data-mode="grid"] .signs, #kpBlock[data-mode="grid"] .big, #kpBlock[data-mode="grid"] .biglab { visibility: hidden; }
  #optBlock .set { margin-bottom: 18px; }
  #optBlock .opts button { padding: 0 14px; }
  .brule { border-top: 2px solid var(--ink); margin: 4px 0 16px; }
  .bfoot { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; flex-wrap: wrap; margin-bottom: 18px; }
  .bfoot .opts button { min-width: 52px; min-height: 48px; font-size: 20px; }
  .warn { color: var(--wrong); margin: 0 0 12px; font-size: 15px; }
  .warn:empty { display: none; }
  #preview { display: flex; flex-wrap: wrap; gap: 10px; margin: 6px 0 10px; cursor: pointer; }
  .mini { border: 1.5px solid var(--line); border-radius: 6px; padding: 10px 16px 30px; min-width: 96px; display: flex; justify-content: center; }
  .mini .qv { position: relative !important; inset: auto !important; transform: none !important; font-size: 22px !important; margin-top: .6em; }
  .mini .qv.div { margin-top: 1.4em; }

  /* sheet */
  #sheet {
    height: calc(100dvh - var(--head)); overflow: auto;
    display: grid; gap: 10px; padding: 10px;
    padding-bottom: max(10px, env(safe-area-inset-bottom));
    grid-template-columns: repeat(var(--cols), minmax(0, 1fr));
    grid-auto-rows: minmax(190px, 1fr);
  }
  #sheet[data-n="6"]  { --cols: 2; }
  #sheet[data-n="12"] { --cols: 3; }
  #sheet[data-n="20"] { --cols: 4; }
  @media (orientation: landscape) {
    #sheet[data-n="6"]  { --cols: 3; }
    #sheet[data-n="12"] { --cols: 4; }
    #sheet[data-n="20"] { --cols: 5; }
  }
  @media (orientation: portrait) and (max-width: 560px) {
    #sheet[data-n] { --cols: 2; }
  }

  .card {
    border: 1.5px solid var(--line); border-radius: 6px;
    display: flex; flex-direction: column; min-width: 0;
  }
  .work { flex: 1; position: relative; container-type: size; touch-action: none; overflow: hidden; }
  .work canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }

  /* the printed question; --h and --c (height and width in em) are set per card */
  .qv {
    position: absolute; font-weight: 600; line-height: 1.1; pointer-events: none;
    font-variant-numeric: tabular-nums; white-space: nowrap;
    font-size: min(calc(100cqh / var(--h)), calc(100cqw / var(--c)), 64px);
  }
  .qv.col { top: 1.2em; left: 50%; transform: translateX(-50%); width: calc((var(--d) + 1.2) * 1ch); }
  .col .row { display: flex; justify-content: space-between; }
  .col .rule { border-top: .07em solid var(--ink); margin-top: .12em; }
  .qv.div { top: 50%; left: 50%; transform: translate(-50%, -50%); display: flex; align-items: flex-end; }
  .div .dd { position: relative; border-top: .07em solid var(--ink); padding: .1em .15em 0 .5em; margin-left: .12em; }
  .div .br { position: absolute; left: 0; top: -.07em; width: .38em; height: calc(100% + .07em); overflow: visible; }
  .qv.frame { top: .6em; left: 50%; transform: translateX(-50%); display: flex; flex-direction: column; align-items: center; }
  .frame svg { display: block; width: 5.5em; height: 2.2em; margin-bottom: .25em; }
  .frame .cap { font-size: .75em; font-weight: 700; margin-bottom: .35em; }
  .qv.frac { top: .5em; left: 50%; transform: translateX(-50%); display: flex; flex-direction: column; align-items: center; }
  .frac svg { display: block; }
  .frac .fbar { width: 2.4em; border-top: .08em solid var(--ink); margin-top: 1.9em; }
  .qv.bond { top: .4em; left: 50%; transform: translateX(-50%); }
  .bond svg { display: block; width: 6em; height: 5.4em; }
  .flipd { display: inline-block; transform: scaleX(-1); font-weight: 700; }
  .foot .cardsay { padding: 2px 6px; line-height: 0; border-color: var(--line); }
  .foot .cardsay svg { width: 20px; height: 20px; }
  .qv.miss { top: .7em; left: 50%; transform: translateX(-50%); display: flex; flex-direction: column; align-items: center; }
  .miss .bx { display: inline-block; width: .95em; height: 1em; border: .07em solid var(--ink); vertical-align: -.12em; border-radius: .08em; }
  .miss .al { display: flex; align-items: flex-end; gap: .3em; margin-top: 2.1em; }
  .miss .wl { display: inline-block; width: calc((var(--d) + .8) * .7em); border-bottom: .07em solid var(--ink); height: 1em; }

  .foot { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; min-height: 40px; padding: 2px 8px 5px; }
  .read { color: #666; font-variant-numeric: tabular-nums; font-size: 26px; font-weight: 600; line-height: 1.1; }
  .mark { font-size: 28px; font-weight: 700; line-height: 1; }
  .foot button { padding: 3px 9px; font-size: 14px; white-space: nowrap; }
  .foot .undo { margin-left: auto; }
  .foot .undo, .foot .clear { border-color: var(--line); color: var(--faint); }
  .retry, .override, .mark { display: none; }

  .card[data-state="right"] { border-color: var(--right); border-width: 2.5px; }
  .card[data-state="right"] .mark { display: inline; color: var(--right); }
  .card[data-state="wrong"] { border-color: var(--wrong); border-width: 2.5px; }
  .card[data-state="wrong"] .mark { display: inline; color: var(--wrong); }
  .card[data-state="wrong"] .retry { display: inline-block; margin-left: auto; }
  .card[data-state="right"][data-claim="1"] .override { display: inline-block; margin-left: auto; }
  .card[data-state="right"] .undo, .card[data-state="right"] .clear,
  .card[data-state="wrong"] .undo, .card[data-state="wrong"] .clear { display: none; }
  .card[data-state="right"] .work, .card[data-state="wrong"] .work { pointer-events: none; }
  .fixed { color: var(--faint); font-size: 15px; font-weight: 400; }
</style>
</head>
<body>
<header>
  <button id="backBtn">‹ Back</button>
  <button id="setupBtn">Start again</button>
  <button id="sayBtn" aria-label="Read it to me" title="Read it to me"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"><path d="M4 9h4l5-4v14l-5-4H4z" fill="currentColor"/><path d="M16 9a4 4 0 0 1 0 6M18.5 6.5a7.5 7.5 0 0 1 0 11"/></svg></button>
  <h1 id="title">Sums</h1>
  <span id="score"></span>
  <button id="markBtn" class="primary">Mark</button>
  <button id="meBtn" class="spacer">Records</button>
</header>

<!-- who is it? -->
<section id="namesS" class="panel">
  <div class="inner">
    <div class="ask">Who's doing sums?</div>
    <div class="tiles" id="nameTiles"></div>
    <div class="addRow" id="addRow" hidden><input id="newName" placeholder="Name" maxlength="20" autocomplete="off"><button id="addBtn" class="primary">Add</button></div>
  </div>
</section>

<!-- how old? -->
<section id="ageS" class="panel" hidden>
  <div class="inner">
    <div class="ask">How old are you?</div>
    <div class="ages" id="ageTiles"></div>
  </div>
</section>

<!-- what today? -->
<section id="homeS" class="panel" hidden>
  <div class="inner">
    <div class="ask">What do you want to do today?</div>
    <div class="tiles" id="actTiles"></div>
  </div>
</section>

<!-- records, age, remove -->
<section id="meS" class="panel" hidden>
  <div class="inner">
    <div class="set" id="confirmBox" hidden><button id="confirmRemoveBtn"></button></div>
    <div class="set" id="meAgeSet">
      <h2>Age</h2>
      <div class="ages small" id="meAges"></div>
    </div>
    <div class="set"><h2 id="recTitle">Best times</h2><div id="records"></div></div>
    <div class="set"><h2>Recent sheets</h2><div id="history"></div></div>
    <div class="go"><button id="removeBtn" hidden></button></div>
  </div>
</section>

<!-- choose the sums for an activity -->
<section id="setupS" class="panel" hidden>
  <div class="builder">
    <div id="kpBlock">
      <div class="bline">
        <div></div>
        <div class="lab" id="labA">First number</div>
        <div class="lab biglab">Or bigger</div>
        <div></div>
        <div class="kp" data-line="a"></div>
        <div class="big" data-line="a"><button data-d="2">10–99</button><button data-d="3">100–999</button><button data-d="4">1000–9999</button></div>
      </div>
      <div class="bline">
        <div></div>
        <div class="lab" id="labB">Second number</div>
        <div></div>
        <div class="signs" id="opsOpts">
          <button data-v="+">+</button><button data-v="-">−</button><button data-v="*">×</button><button data-v="/">÷</button>
        </div>
        <div class="kp" data-line="b"></div>
        <div class="big" data-line="b"><button data-d="2">10–99</button><button data-d="3">100–999</button><button data-d="4">1000–9999</button></div>
      </div>
    </div>
    <div id="optBlock"></div>
    <div class="brule"></div>
    <div class="bfoot">
      <div>
        <div class="lab">Questions</div>
        <div class="opts" id="nOpts"><button data-v="6">6</button><button data-v="12">12</button><button data-v="20">20</button></div>
      </div>
      <div class="go"><button id="newBtn" class="primary">Start</button></div>
    </div>
    <p class="warn" id="warn"></p>
    <div class="lab">Like these <span class="faint">(tap for more)</span></div>
    <div id="preview"></div>
    <p class="hint" id="setupHint"></p>
  </div>
</section>

<main id="sheet" data-n="12" hidden></main>

<template id="cardT">
  <div class="card" data-state="writing">
    <div class="work"><div class="qv"></div><canvas></canvas></div>
    <div class="foot">
      <button class="cardsay" aria-label="Read it to me"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"><path d="M4 9h4l5-4v14l-5-4H4z" fill="currentColor"/><path d="M16 9a4 4 0 0 1 0 6M18.5 6.5a7.5 7.5 0 0 1 0 11"/></svg></button>
      <span class="mark"></span><span class="read"></span>
      <button class="retry">Try again</button>
      <button class="override">I was right the first time</button>
      <button class="undo">Undo</button>
      <button class="clear">Clear</button>
    </div>
  </div>
</template>

<script src="model.js"></script>
<script src="digits.js"></script>
<script>
'use strict';
const $ = s => document.querySelector(s);
const SIGN = { '+': '+', '-': '−', '*': '×', '/': '÷' };
const OP_ORDER = ['+', '-', '*', '/'];
const ONE_TO_NINE = [1, 2, 3, 4, 5, 6, 7, 8, 9];
const ALL_DIGITS = [0, ...ONE_TO_NINE];
const AGES = [5, 8];
const store = {
  get(k, d) { try { const v = JSON.parse(localStorage.getItem(k)); return v == null ? d : v; } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} },
};
const esc = s => String(s).replace(/[&<>"]/g, ch => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[ch]);
const rnd = (lo, hi) => lo + Math.floor(Math.random() * (hi - lo + 1));
const pickOne = arr => arr[rnd(0, arr.length - 1)];
const range = (lo, hi) => Array.from({ length: hi - lo + 1 }, (_, i) => lo + i);

// read aloud (the 5-year-old can't read yet)
function say(text) {
  try { speechSynthesis.cancel(); const u = new SpeechSynthesisUtterance(text); u.rate = 0.9; speechSynthesis.speak(u); } catch (e) {}
}

// ---------- numbers ----------
// A "line" is one of the two numbers: { d: digits, p: picked digits }.
// d = 1 means a single digit chosen from p (the keypad); d = 2..4 means any
// number with that many digits.
const lineOf = (d, p) => typeof d === 'object' ? d : { d, p: p || ALL_DIGITS };
const num = L => L.d === 1 ? pickOne(L.p) : rnd(10 ** (L.d - 1), 10 ** L.d - 1);
// For ÷ the second number is the divisor and the answer comes from the first
// number's choices (keypad), or the first number sets the dividend's digits.
function makeQ(op, A, B) {
  A = lineOf(A); B = lineOf(B);
  let a, b;
  if (op === '+') { a = num(A); b = num(B); return { a, b, op, ans: a + b }; }
  if (op === '*') { a = num(A); b = num(B); return { a, b, op, ans: a * b }; }
  if (op === '-') {
    for (let t = 0; t < 20; t++) { a = num(A); b = num(B); if (a >= b) break; }
    if (b > a) [a, b] = [b, a];
    return { a, b, op, ans: a - b };
  }
  if (B.d === 1) { const nz = B.p.filter(x => x > 0); if (!nz.length) return null; b = pickOne(nz); }
  else b = rnd(10 ** (B.d - 1), 10 ** B.d - 1);
  if (A.d === 1) { const q = num(A); return { a: b * q, b, op, ans: q }; }
  const alo = 10 ** (A.d - 1), ahi = 10 ** A.d - 1;
  let qlo = Math.max(2, Math.ceil(alo / b)), qhi = Math.floor(ahi / b);
  if (qlo > qhi) { qlo = Math.min(qlo, 9); qhi = Math.max(qlo, Math.min(qhi, 9)); if (qhi < qlo) qhi = qlo; }
  const q = rnd(qlo, qhi);
  return { a: b * q, b, op, ans: q };
}
const cfgA = c => lineOf(c.a, c.pa), cfgB = c => lineOf(c.b, c.pb);
// signs that can actually make a question (÷ needs a non-zero divisor)
const usableOps = c => c.ops.filter(op => op !== '/' || cfgB(c).d > 1 || cfgB(c).p.some(x => x > 0));

function digitsLabel(ds) { // [0,1,2,3,5,7] -> "0–3, 5, 7"
  const out = [];
  for (let i = 0; i < ds.length; i++) {
    let j = i; while (j + 1 < ds.length && ds[j + 1] === ds[j] + 1) j++;
    out.push(j - i >= 2 ? `${ds[i]}–${ds[j]}` : j > i ? `${ds[i]}, ${ds[j]}` : `${ds[i]}`);
    i = j;
  }
  return out.join(', ');
}
// sums key: signs | first | second | count, where a keypad line is "1:" + its digits
function kpKey(c) {
  const part = L => L.d === 1 ? '1:' + [...L.p].sort((x, y) => x - y).join('') : String(L.d);
  return OP_ORDER.filter(o => c.ops.includes(o)).join('') + '|' + part(cfgA(c)) + '|' + part(cfgB(c)) + '|' + c.n;
}
function kpLabel(k) {
  const [ops, a, b, n] = k.split('|');
  const part = p => p.includes(':') ? digitsLabel([...p.split(':')[1]].map(Number)) : p === '1' ? '1-digit' : `${p}-digit`;
  return `${[...ops].map(o => SIGN[o]).join(' ')} · ${part(a)} and ${part(b)} · ${n} questions`;
}

// ---------- activities ----------
// Each activity: which ages see it, its starting settings, how to make a
// question, the setup it uses, what to say aloud, and its tile picture.
const frameSvg = (dots, empty) => `<svg viewBox="-1 -1 52 22">${frameInner(dots, empty)}</svg>`;
const frameInner = (dots, empty) => {
  let s = `<rect x="0" y="0" width="50" height="20" fill="none" stroke="currentColor" stroke-width="1"/>`;
  for (let i = 1; i < 5; i++) s += `<line x1="${i * 10}" y1="0" x2="${i * 10}" y2="20" stroke="currentColor" stroke-width=".7"/>`;
  s += `<line x1="0" y1="10" x2="50" y2="10" stroke="currentColor" stroke-width=".7"/>`;
  for (let i = 0; i < 10; i++) {

// ---------- players ----------
// Everyone (guest, picks an age each time) plus named players, each with an age.
let players = store.get('sums-players', []);
let current = null, age = null, act = null;
const allPlayers = () => [{ id: 'guest', name: 'Everyone' }, ...players];
const player = id => allPlayers().find(p => p.id === id) || { id: 'guest', name: 'Everyone' };
const recKey = id => 'sums-rec-' + id;
const loadRec = id => store.get(recKey(id), { best: {}, history: [] });

// settings per player, per activity (Everyone also per age)
const cfgStoreKey = a => `sums-cfg-${current}${current === 'guest' ? '-' + age : ''}-${a}`;
function loadCfg(a) {
  const d = ACTS[a].defaults(age);
  // (the one-device settings from before names existed are NOT used: they
  // belonged to whoever used it last, and gave the 8-year-old her sister's)
  const s = store.get(cfgStoreKey(a), null);
  const c = { ...d, ...(s || {}) };
  for (const k of ['pa', 'pb']) if (k in d && (!Array.isArray(c[k]) || !c[k].length)) c[k] = d[k];
  if (c.ops) c.ops = [...c.ops];
  return c;
}
function fmtTime(ms) { const s = Math.round(ms / 1000); return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); }
function fmtDate(t) { return new Date(t).toLocaleDateString(undefined, { day: 'numeric', month: 'short' }); }

function saveResult(key, ms, first, n) {
  const r = loadRec(current);
  const prev = r.best[key];
  const isBest = !prev || ms < prev.ms;
  r.best[key] = { ms: isBest ? ms : prev.ms, count: (prev ? prev.count : 0) + 1, t: Date.now() };
  const t = Date.now();
  r.history.unshift({ k: key, ms, first, n, t });
  r.history = r.history.slice(0, 100);
  store.set(recKey(current), r);
  return { isBest, best: r.best[key].ms, hadPrev: !!prev, first, t, player: current };
}

// ---------- screens ----------
let screen = 'names';
const cakeSvg = n => {
  let s = `<svg viewBox="0 0 120 100" fill="none" stroke="currentColor" stroke-width="3" stroke-linejoin="round"><rect x="14" y="54" width="92" height="38" rx="5"/><path d="M14 68 q11 8 23 0 t23 0 t23 0 t23 0"/>`;
  for (let i = 0; i < n; i++) {
    const x = 14 + (92 / (n + 1)) * (i + 1);
    s += `<line x1="${x}" y1="54" x2="${x}" y2="34"/><path d="M${x} 22 q4 5 0 9 q-4 -4 0 -9z" fill="currentColor" stroke-width="1.5"/>`;
  }
  return s + '</svg>';
};
function show(s) {
  screen = s;
  for (const id of ['names', 'age', 'home', 'setup', 'me']) $('#' + id + 'S').hidden = id !== s;
  $('#sheet').hidden = s !== 'sheet';
  const vis = { backBtn: s !== 'names', setupBtn: s === 'sheet', sayBtn: s === 'sheet' || s === 'home' || s === 'age', markBtn: s === 'sheet', score: s === 'sheet', meBtn: s === 'home' };
  for (const id in vis) $('#' + id).hidden = !vis[id];
  const p = current ? player(current) : null;
  $('#title').textContent = { names: 'Sums', age: p ? p.name : '', home: p ? `${p.name} · ${age}` : '', setup: act && p ? `${p.name} · ${ACTS[act].name}` : '', me: p ? p.name : '', sheet: act ? ACTS[act].name : '' }[s];
  $('#title').className = s === 'sheet' ? 'sheetTitle' : '';
  $('#backBtn').textContent = { age: '‹ Names', home: '‹ Names', setup: '‹ Back', me: '‹ Back', sheet: '‹ Home' }[s] || '‹ Back';
  $('#score').hidden = s !== 'sheet';
}
$('#backBtn').onclick = () => {
  if (screen === 'age' || screen === 'home') goNames();
  else if (screen === 'setup') setupFrom === 'sheet' && sheetAct === act && cards.length ? show('sheet') : goHome();
  else goHome();
};
$('#sayBtn').onclick = () => {
  if (screen === 'sheet') say(ACTS[act].say);
  else if (screen === 'home') say('What do you want to do today? ' + ACTS_FOR().map(a => ACTS[a].name).join('. '));
  else if (screen === 'age') say('How old are you?');
};

// names
function goNames() {
  current = null; age = null;
  // a new person never lands on the last person's sheet
  for (const k of cards) ro.unobserve(k.work);
  cards = []; sheetAct = null; $('#sheet').innerHTML = '';
  $('#nameTiles').innerHTML = allPlayers().map(p =>
    `<button class="tile person" data-id="${esc(p.id)}"><span class="nm">${esc(p.name)}</span><span class="sub">${p.id === 'guest' ? 'any age' : p.age ? 'age ' + p.age : ''}</span></button>`).join('')
    + `<button class="tile add" id="addTile"><span class="nm">+ Add a name</span></button>`;
  $('#addRow').hidden = true;
  show('names');
}
$('#nameTiles').addEventListener('click', e => {
  const t = e.target.closest('.tile'); if (!t) return;
  if (t.id === 'addTile') { $('#addRow').hidden = false; $('#newName').focus(); return; }
  current = t.dataset.id;
  const p = player(current);
  if (current !== 'guest' && AGES.includes(p.age)) { age = p.age; goHome(); } else goAge();
});
function addPlayer() {
  const name = $('#newName').value.trim().slice(0, 20); if (!name) return;
  const p = { id: Date.now().toString(36), name };
  players.push(p); store.set('sums-players', players);
  $('#newName').value = '';
  current = p.id; goAge();
}
$('#addBtn').onclick = addPlayer;
$('#newName').addEventListener('keydown', e => { if (e.key === 'Enter') addPlayer(); });

// age
const ageTiles = sel => AGES.map(a => `<button class="tile" data-age="${a}" aria-pressed="${a === age}"><span class="pic">${cakeSvg(a)}</span><span class="nm">${a}</span></button>`).join('');
function goAge() { $('#ageTiles').innerHTML = ageTiles(); show('age'); say('How old are you?'); }
function setAge(a) {
  age = a;
  if (current !== 'guest') { const p = players.find(x => x.id === current); if (p) { p.age = a; store.set('sums-players', players); } }
}
$('#ageTiles').addEventListener('click', e => { const t = e.target.closest('[data-age]'); if (!t) return; setAge(+t.dataset.age); goHome(); });

// home: activities for this age
const ACTS_FOR = () => Object.keys(ACTS).filter(a => ACTS[a].ages.includes(age));
function goHome() {
  const r = loadRec(current);
  $('#actTiles').innerHTML = ACTS_FOR().map(a => {
    const best = r.best[ACTS[a].key(loadCfg(a))];
    return `<button class="tile" data-act="${a}"><span class="pic">${ACTS[a].pic}</span><span class="nm">${ACTS[a].name}</span><span class="sub">${best ? 'Best ' + fmtTime(best.ms) : ''}</span></button>`;
  }).join('');
  show('home');
  if (age === 5) say('What do you want to do today?');
}
$('#actTiles').addEventListener('click', e => {
  const t = e.target.closest('[data-act]'); if (!t) return;
  act = t.dataset.act;
  // anything with choices asks first, with her own last choices ready to go
  if (ACTS[act].setup !== 'none') { goSetup(); if (age === 5) say('Choose, then press Start.'); return; }
  buildSheet(loadCfg(act));
  show('sheet');
  if (age === 5) say(ACTS[act].say);
});

// records, age, remove
let confirmShownAt = 0;
function goMe() {
  const p = player(current), r = loadRec(current);
  $('#meAges').innerHTML = ageTiles();
  $('#recTitle').textContent = `Best times for ${p.name}`;
  const best = Object.entries(r.best).sort((x, y) => y[1].t - x[1].t);
  $('#records').innerHTML = best.length
    ? `<table><tr><th>Sheet</th><th>Best</th><th>Done</th></tr>${best.map(([k, v]) =>
        `<tr><td>${esc(labelFor(k))}</td><td class="t">${fmtTime(v.ms)}</td><td>${v.count}×</td></tr>`).join('')}</table>`
    : '<p class="empty">No finished sheets yet. A sheet counts when every answer is right.</p>';
  $('#history').innerHTML = r.history.length
    ? `<table><tr><th>Day</th><th>Sheet</th><th>Time</th><th>First try</th></tr>${r.history.slice(0, 15).map(h =>
        `<tr><td>${fmtDate(h.t)}</td><td>${esc(labelFor(h.k))}</td><td class="t">${fmtTime(h.ms)}</td><td>${h.first}/${h.n}</td></tr>`).join('')}</table>`
    : '<p class="empty">Nothing yet.</p>';
  const rm = $('#removeBtn');
  rm.hidden = current === 'guest'; rm.dataset.armed = ''; rm.textContent = `Remove ${p.name}`;
  $('#confirmBox').hidden = true;
  show('me');
}
$('#meBtn').onclick = goMe;
$('#meAges').addEventListener('click', e => { const t = e.target.closest('[data-age]'); if (!t) return; setAge(+t.dataset.age); goHome(); });
// Removing: the first tap turns this button into "Keep", and the real confirm
// appears far away at the top of the page, so a double tap can't remove anyone.
$('#removeBtn').onclick = () => {
  const rm = $('#removeBtn'), name = player(current).name;
  if (rm.dataset.armed) { goMe(); return; } // "Keep": cancel
  rm.dataset.armed = '1'; rm.textContent = `Keep ${name}`;
  $('#confirmRemoveBtn').textContent = `Tap here to remove ${name} and their records`;
  $('#confirmBox').hidden = false; confirmShownAt = Date.now();
  $('#meS').scrollTop = 0;
};
$('#confirmRemoveBtn').onclick = () => {
  if (Date.now() - confirmShownAt < 500) return;
  players = players.filter(p => p.id !== current); store.set('sums-players', players);
  try { localStorage.removeItem(recKey(current)); } catch (e) {}
  for (const a in ACTS) try { localStorage.removeItem(`sums-cfg-${current}-${a}`); } catch (e) {}
  goNames();
};

// ---------- setup ----------
// The setup page is laid out like a sum: first number's keypad on top, signs
// beside the second number's keypad, a line, then how many and Start.
let draft = null, setupFrom = 'home';
const KEYS = [7, 8, 9, 4, 5, 6, 1, 2, 3, 0];
for (const kp of document.querySelectorAll('.kp')) {
  kp.innerHTML = KEYS.map(k => `<button data-k="${k}">${k}</button>`).join('') + '<button data-k="all" class="allk">All</button>';
}
function goSetup(from = 'home') {
  setupFrom = from;
  draft = loadCfg(act);
  const kind = ACTS[act].setup;
  $('#kpBlock').hidden = kind !== 'keypad' && kind !== 'grid';
  $('#kpBlock').dataset.mode = kind;
  $('#labA').textContent = kind === 'grid' ? 'Rows' : 'First number';
  $('#labB').textContent = kind === 'grid' ? 'Columns' : 'Second number';
  // simple choices (Up to, Kind, Counting in...) as rows of buttons
  $('#optBlock').innerHTML = (ACTS[act].options || []).map(o =>
    `<div class="set"><div class="lab">${o.label}</div><div class="opts" data-key="${o.key}"${o.multi ? ' data-multi="1"' : ''}>${
      o.values.map(v => { const [val, txt] = Array.isArray(v) ? v : [v, v]; return `<button data-v="${val}">${txt}</button>`; }).join('')}</div></div>`).join('');
  $('#setupHint').textContent = kind === 'keypad' ? 'Takeaways never go below zero. Division always comes out exactly: you divide by the second number.' : '';
  syncOpts();
  show('setup');
}
$('#setupBtn').onclick = () => goSetup('sheet');
// option values are numbers where they look like numbers ("10" → 10, "blocks" stays)
const optVal = v => /^\d+$/.test(v) ? +v : v;
function syncOpts() {
  if (draft.ops) for (const b of $('#opsOpts').children) b.setAttribute('aria-pressed', draft.ops.includes(b.dataset.v));
  for (const g of document.querySelectorAll('#optBlock .opts')) {
    const cur = draft[g.dataset.key];
    for (const b of g.children) b.setAttribute('aria-pressed', Array.isArray(cur) ? cur.includes(optVal(b.dataset.v)) : cur === optVal(b.dataset.v));
  }
  if (draft.pa) {
    for (const line of ['a', 'b']) {
      const d = draft[line], p = draft['p' + line];
      for (const k of document.querySelectorAll(`.kp[data-line="${line}"] [data-k]`))
        k.setAttribute('aria-pressed', d === 1 && (k.dataset.k === 'all' ? p.length === 10 : p.includes(+k.dataset.k)));
      for (const k of document.querySelectorAll(`.big[data-line="${line}"] [data-d]`))
        k.setAttribute('aria-pressed', +k.dataset.d === d);
    }
  }
  for (const b of $('#nOpts').children) b.setAttribute('aria-pressed', +b.dataset.v === draft.n);
  renderPreview();
}
$('#opsOpts').addEventListener('click', e => {
  const v = e.target.dataset && e.target.dataset.v; if (!v) return;
  const i = draft.ops.indexOf(v);
  if (i >= 0) { if (draft.ops.length > 1) draft.ops.splice(i, 1); }
  else draft.ops.push(v);
  syncOpts();
});
$('#nOpts').addEventListener('click', e => { const v = e.target.dataset && e.target.dataset.v; if (!v) return; draft.n = +v; syncOpts(); });
// multi-choice rows toggle (at least one stays on); single-choice rows pick one
$('#optBlock').addEventListener('click', e => {
  const b = e.target.closest('[data-v]'); if (!b) return;
  const g = b.parentElement, key = g.dataset.key, v = optVal(b.dataset.v);
  if (g.dataset.multi) {
    const cur = draft[key];
    if (cur.includes(v)) { if (cur.length > 1) draft[key] = cur.filter(x => x !== v); }
    else draft[key] = [...cur, v];
  } else draft[key] = v;
  syncOpts();
});
for (const big of document.querySelectorAll('.big')) big.addEventListener('click', e => {
  const d = e.target.closest('[data-d]'); if (!d) return;
  draft[big.dataset.line] = +d.dataset.d; syncOpts();
});
// keypad: tap to toggle a digit, or drag across keys to set them all the same way
function setKey(line, k, on) {
  const pk = 'p' + line;
  if (k === 'all') { draft[line] = 1; draft[pk] = [...ALL_DIGITS]; return; }
  k = +k;
  if (draft[line] !== 1) { draft[line] = 1; draft[pk] = [k]; return; } // fresh pick
  const has = draft[pk].includes(k);
  if (on && !has) draft[pk] = [...draft[pk], k].sort((x, y) => x - y);
  if (!on && has && draft[pk].length > 1) draft[pk] = draft[pk].filter(x => x !== k);
}
for (const kp of document.querySelectorAll('.kp')) {
  let sweep = null;
  const keyAt = e => { const el = document.elementFromPoint(e.clientX, e.clientY); const k = el && el.closest('[data-k]'); return k && kp.contains(k) ? k : null; };
  kp.addEventListener('pointerdown', e => {
    const k = keyAt(e); if (!k) return;
    e.preventDefault();
    const line = kp.dataset.line;
    const on = !(draft[line] === 1 && k.dataset.k !== 'all' && draft['p' + line].includes(+k.dataset.k));
    sweep = { line, on, done: new Set([k.dataset.k]) };
    setKey(line, k.dataset.k, on); syncOpts();
  });
  kp.addEventListener('pointermove', e => {
    if (!sweep) return;
    const k = keyAt(e);
    if (!k || k.dataset.k === 'all' || sweep.done.has(k.dataset.k)) return;
    sweep.done.add(k.dataset.k); setKey(sweep.line, k.dataset.k, sweep.on); syncOpts();
  });
  for (const ev of ['pointerup', 'pointercancel', 'pointerleave']) kp.addEventListener(ev, () => { sweep = null; });
}
// a few sample questions in the printed style
function renderPreview() {
  const box = $('#preview'), blocked = ACTS[act].blocked ? ACTS[act].blocked(draft) : '';
  const ok = !blocked && (!draft.ops || usableOps(draft).length > 0);
  $('#warn').textContent = blocked || (draft.ops && usableOps(draft).length < draft.ops.length ? 'To divide, choose a second number other than 0.' : '');
  $('#newBtn').disabled = !ok;
  if (!ok) { box.innerHTML = ''; return; }
  const seen = new Set(), qs = [];
  for (let t = 0; t < 40 && qs.length < 4; t++) {
    const q = ACTS[act].make(draft), id = qId(q);
    if (!seen.has(id)) { seen.add(id); qs.push(q); }
  }
  box.innerHTML = qs.map(q => {
    const m = qMarkup(q), style = Object.entries(m.vars).map(([k, v]) => `${k}:${v}`).join(';');
    return `<div class="mini"><div class="qv ${m.cls}" style="${style}">${m.html}</div></div>`;
  }).join('');
}
$('#preview').addEventListener('click', renderPreview);
$('#newBtn').onclick = () => {
  store.set(cfgStoreKey(act), draft); buildSheet(loadCfg(act)); show('sheet');
  if (age === 5) say(ACTS[act].say);
};

// ---------- the printed question ----------
// + − × stacked with a line (space above for carrying, answer under the line);
// ÷ as a long-division bracket (answer on the bar); missing number as an
// equation with a box and a line to write on; ten frames with a line under.
// --h / --c are the height / width the layout needs, in em.
const qId = q => JSON.stringify({ ...q, ans: undefined });
function qMarkup(q) {
  const len = n => String(n).length;
  if (q.kind === 'div') return {
    cls: 'div',
    html: `<span class="dv">${q.b}</span><span class="dd"><svg class="br" viewBox="0 0 10 40" preserveAspectRatio="none"><path d="M1 0 Q 13 20 1 40" fill="none" stroke="currentColor" stroke-width="2.6" vector-effect="non-scaling-stroke" style="stroke-width:.07em"/></svg>${q.a}</span>`,
    vars: { '--h': 5.2, '--c': (len(q.a) + len(q.b)) * 0.62 + 2.4 },
  };
  if (q.kind === 'miss') {
    const box = '<span class="bx"></span>';
    const A = q.hide === 'a' ? box : q.a, B = q.hide === 'b' ? box : q.b;
    return {
      cls: 'miss',
      html: `<div class="eq">${A} ${SIGN[q.op]} ${B} = ${q.c}</div><div class="al">${box}<span>=</span><span class="wl"></span></div>`,
      // line length from the longest number shown, so it doesn't hint at the answer's size
      vars: { '--d': Math.max(len(q.a), len(q.b), len(q.c)), '--h': 5.4, '--c': (len(q.a) + len(q.b) + len(q.c)) * 0.62 + 5 },
    };
  }
  if (q.kind === 'bond') return { cls: 'bond', html: bondSvg(q), vars: { '--h': 6.4, '--c': 6.8 } };
  // pictures with the answer written anywhere below them (like ten frames)
  if (q.kind === 'array') return { cls: 'frame', html: arraySvg(q.r, q.c), vars: { '--h': q.r * 0.55 + 3.3, '--c': Math.max(q.c * 0.55, 4) + 1.4 } };
  if (q.kind === 'pv') {
    const L = pvLayout(q.h, q.t, q.o);
    return { cls: 'frame', html: pvSvg(q.h, q.t, q.o), vars: { '--h': (L.H + 1) * PV_EM + 3.3, '--c': Math.max((L.W + 1) * PV_EM, 4) + 1.4 } };
  }
  if (q.kind === 'nline') return { cls: 'frame', html: nlineSvg(q), vars: { '--h': 3.33 + 3.3, '--c': 11 } };
  if (q.kind === 'area') {
    // caption (what to find), then the rectangle; answer below it
    const svg = areaSvg(q), [, wEm, hEm] = svg.match(/width:([\d.]+)em;height:([\d.]+)em/).map(Number);
    return { cls: 'frame', html: `<div class="cap">${q.cap}</div>${svg}`, vars: { '--h': hEm + 1.1 + 3.2, '--c': Math.max(wEm, 5) + 1.2 } };
  }
  if (q.kind === 'frac') {
    // the picture, then a short printed bar: top number above it, bottom number below
    const svg = fracSvg(q), [, wEm, hEm] = svg.match(/width:([\d.]+)em;height:([\d.]+)em/).map(Number);
    return { cls: 'frac', html: `${svg}<div class="fbar"></div>`, vars: { '--h': hEm + 0.5 + 1.9 + 2.3, '--c': Math.max(wEm, 4) + 1.4 } };
  }
  // a line of words or numbers, then "= ___" to write on
  if (q.kind === 'expr') return {
    cls: 'miss',
    html: `<div class="eq">${q.text}</div><div class="al"><span>=</span><span class="wl"></span></div>`,
    vars: { '--d': 3, '--h': 5.4, '--c': q.text.length * 0.56 + 1.6 },
  };
  if (q.kind === 'frame') {
    const svgs = q.frames === 2 ? frameSvg(Math.min(q.dots, 10), false) + frameSvg(Math.max(0, q.dots - 10), false) : frameSvg(q.dots, q.empty);
    // no line under the frames (Sam): she writes anywhere below them
    return { cls: 'frame', html: svgs, vars: { '--h': q.frames * 2.45 + 3.2, '--c': 7 } };
  }
  const d = Math.max(len(q.a), len(q.b), len(q.ans));
  const below = q.op === '*' && len(q.b) > 1 ? 1.1 * (len(q.b) + 1) + 0.3 : 1.7;
  return {
    cls: 'col',
    html: `<div class="row"><span></span><span>${q.a}</span></div><div class="row"><span>${SIGN[q.op]}</span><span>${q.b}</span></div><div class="rule"></div>`,
    vars: { '--d': d, '--h': 3.6 + below, '--c': (d + 1.2) * 0.62 + 1.6 },
  };
}
// what the card's speaker says
const WORD = { '+': 'plus', '-': 'take away', '*': 'times', '/': 'divided by' };
function cardSay(q) {
  if (q.kind === 'col' || q.kind === 'div') return `${q.a} ${WORD[q.op]} ${q.b}`;
  if (q.kind === 'miss') return `${q.hide === 'a' ? 'what' : q.a} ${WORD[q.op]} ${q.hide === 'b' ? 'what' : q.b} makes ${q.c}?`;
  if (q.kind === 'bond') return q.hide === 'w' ? `${q.p} and ${q.q2} make what?` : `${q.w} is ${q.hide === 'p' ? q.q2 : q.p} and what?`;
  return ACTS[act].say;
}
function layout(c) {
  const qv = c.el.querySelector('.qv'), m = qMarkup(c.q);
  qv.className = 'qv ' + m.cls; qv.innerHTML = m.html;
  for (const k in m.vars) qv.style.setProperty(k, m.vars[k]);
  c.anchorEl = m.cls === 'frame' ? qv.lastElementChild // bottom of the last ten frame
    : qv.querySelector({ div: '.dd', miss: '.wl', bond: '.hole', frac: '.fbar' }[m.cls] || '.rule');
}

// ---------- cards and writing ----------
let cards = [], cfg = null, sheetAct = null, sheetKey = '', sheetStart = null, sheetDone = false;
let penSeen = false; // once a stylus is used, ignore fingers and palms
const ro = new ResizeObserver(entries => { for (const en of entries) en.target._card && sizeCanvas(en.target._card); });

function makeSheet(c) {
  const seen = new Set(), qs = [];
  for (let i = 0; i < c.n; i++) {
    let q;
    for (let t = 0; t < 30; t++) { q = ACTS[act].make(c); if (!seen.has(qId(q))) break; }
    seen.add(qId(q)); qs.push(q);
  }
  return qs;
}
function buildSheet(c) {
  cfg = c; sheetAct = act;
  const sheet = $('#sheet');
  for (const k of cards) ro.unobserve(k.work);
  sheet.innerHTML = ''; sheet.dataset.n = c.n; sheet.scrollTop = 0;
  sheetKey = ACTS[act].key(c); sheetStart = null; sheetDone = false; lastResult = null;
  sheet.hidden = false; // measured while laying out
  cards = makeSheet(c).map(q => {
    const el = $('#cardT').content.firstElementChild.cloneNode(true);
    const k = { q, el, work: el.querySelector('.work'), cv: el.querySelector('canvas'), strokes: [], tries: 0, first: null, timer: 0, ax: 0, ay: 0, F: 20 };
    layout(k);
    k.work._card = k;
    wirePad(k);
    // age 5: every card has a speaker that reads that card's question
    const cs = el.querySelector('.cardsay');
    if (age === 5) cs.onclick = () => say(cardSay(k.q)); else cs.remove();
    el.querySelector('.undo').onclick = () => { k.strokes.pop(); draw(k); scheduleRead(k, 0); };
    el.querySelector('.clear').onclick = () => { k.strokes = []; draw(k); showRead(k, ''); };
    el.querySelector('.retry').onclick = () => {
      // keep the working, take away only the answer that was read
      const used = new Set(answerStrokes(k));
      k.strokes = k.strokes.filter(s => !used.has(s));
      draw(k); showRead(k, ''); setState(k, 'writing');
    };
    // She only finds out her first answer was right once she has the right
    // answer, so the claim is offered after a later try is marked right.
    el.querySelector('.override').onclick = () => {
      k.first = true; k.el.dataset.claim = '';
      k.el.querySelector('.read').innerHTML = `${k.q.ans} <span class="fixed">· right first time</span>`;
      updateScore();
    };
    sheet.appendChild(el); ro.observe(k.work);
    return k;
  });
  updateScore();
}

// Strokes are stored relative to the question: origin at the right end of the
// answer line (or the division bar), in units of the printed font size. So the
// writing stays lined up with the numbers when the screen rotates.
function sizeCanvas(c) {
  const r = c.work.getBoundingClientRect(), dpr = window.devicePixelRatio || 1;
  if (!r.width) return;
  const ar = c.anchorEl.getBoundingClientRect();
  c.w = r.width; c.h = r.height;
  c.F = parseFloat(getComputedStyle(c.el.querySelector('.qv')).fontSize) || 20;
  if (c.q.kind === 'bond') { c.ax = (ar.left + ar.right) / 2 - r.left; c.ay = (ar.top + ar.bottom) / 2 - r.top; } // centre of the empty circle
  else { c.ax = ar.right - r.left; c.ay = (c.q.kind === 'div' ? ar.top : ar.bottom) - r.top; }
  c.cv.width = Math.round(r.width * dpr); c.cv.height = Math.round(r.height * dpr);
  draw(c);
}
function draw(c) {
  if (!c.w) return;
  const g = c.cv.getContext('2d'), dpr = window.devicePixelRatio || 1, F = c.F;
  const X = x => c.ax + x * F, Y = y => c.ay + y * F;
  g.setTransform(dpr, 0, 0, dpr, 0, 0);
  g.clearRect(0, 0, c.w, c.h);
  g.lineCap = g.lineJoin = 'round'; g.strokeStyle = '#111'; g.fillStyle = '#111';
  g.lineWidth = Math.max(2.5, F * 0.085);
  for (const s of c.strokes) {
    if (s.length === 1) { g.beginPath(); g.arc(X(s[0][0]), Y(s[0][1]), g.lineWidth / 2, 0, 7); g.fill(); continue; }
    g.beginPath(); g.moveTo(X(s[0][0]), Y(s[0][1]));
    for (let i = 1; i < s.length; i++) g.lineTo(X(s[i][0]), Y(s[i][1]));
    g.stroke();
  }
}
function wirePad(c) {
  let active = null, cur = null;
  const pt = e => { const r = c.work.getBoundingClientRect(); return [(e.clientX - r.left - c.ax) / c.F, (e.clientY - r.top - c.ay) / c.F]; };
  c.work.addEventListener('pointerdown', e => {
    if (e.pointerType === 'pen') penSeen = true;
    if (penSeen && e.pointerType === 'touch') return;
    if (active !== null || c.el.dataset.state !== 'writing') return;
    e.preventDefault();
    if (sheetStart === null) sheetStart = Date.now();
    active = e.pointerId; c.work.setPointerCapture(e.pointerId);
    cur = [pt(e)]; c.strokes.push(cur); clearTimeout(c.timer); draw(c);
  });
  c.work.addEventListener('pointermove', e => {
    if (e.pointerId !== active) return;
    const evs = e.getCoalescedEvents ? e.getCoalescedEvents() : [e];
    for (const ev of (evs.length ? evs : [e])) cur.push(pt(ev));
    draw(c);
  });
  const end = e => {
    if (e.pointerId !== active) return;
    active = null; cur = null;
    scheduleRead(c, 500);
  };
  c.work.addEventListener('pointerup', end);
  c.work.addEventListener('pointercancel', end);
}

// Which strokes are the answer? Below the line for + − × and ten frames, above
// the bar for ÷, on the line (or in the box) for missing numbers. Ruled lines are ignored, and
// if there are several rows (long multiplication working) only the row
// nearest the bottom counts.
function inZone(kind, cx, cy) {
  if (kind === 'bond') return Math.hypot(cx, cy) < 1.9; // in (or spilling out of) the empty circle, radius 1
  if (kind === 'div') return cy < 0;
  // on the line, in the box in the sum, or a bit low under the line: all of it
  // is hers (the bottom row wins if there is more than one)
  if (kind === 'miss' || kind === 'expr') return true;
  return cy > 0;
}
// Any card with writing on it gets marked (Sam): if nothing is in the answer
// place, read whatever she wrote rather than skipping the card.
function answerStrokes(c) {
  if (c.q.kind === 'frac') return fracParts(c).flat();
  const all = [], items = [];
  for (const s of c.strokes) {
    let x0 = Infinity, x1 = -Infinity, y0 = Infinity, y1 = -Infinity;
    for (const [x, y] of s) { x0 = Math.min(x0, x); x1 = Math.max(x1, x); y0 = Math.min(y0, y); y1 = Math.max(y1, y); }
    if (x1 - x0 > 1.4 && y1 - y0 < (x1 - x0) * 0.25) continue; // a ruled line
    const it = { s, y0, y1 };
    all.push(it);
    if (inZone(c.q.kind, (x0 + x1) / 2, (y0 + y1) / 2)) items.push(it);
  }
  if (!items.length) items.push(...all);
  items.sort((p, q) => p.y0 - q.y0);
  const rows = [];
  for (const it of items) {
    const r = rows[rows.length - 1];
    if (r && it.y0 < r.y1 - 0.05) { r.y1 = Math.max(r.y1, it.y1); r.s.push(it.s); }
    else rows.push({ y1: it.y1, s: [it.s] });
  }
  return rows.length ? rows[rows.length - 1].s : [];
}
// Fractions have two answers: the top number above the printed bar and the
// bottom number below it. Writing high up on the picture (counting marks) is ignored.
function fracParts(c) {
  const top = [], bot = [];
  for (const s of c.strokes) {
    let x0 = Infinity, x1 = -Infinity, y0 = Infinity, y1 = -Infinity;
    for (const [x, y] of s) { x0 = Math.min(x0, x); x1 = Math.max(x1, x); y0 = Math.min(y0, y); y1 = Math.max(y1, y); }
    if (x1 - x0 > 1.4 && y1 - y0 < (x1 - x0) * 0.25) continue; // a line she drew
    const cy = (y0 + y1) / 2;
    if (cy < 0 && cy > -2.1) top.push(s); else if (cy >= 0) bot.push(s);
  }
  return [top, bot];
}
// Read a card and check it: { text shown under the card, ok, backwards digits }
function readAnswer(c) {
  if (c.q.kind === 'frac') {
    const [t, b] = fracParts(c);
    if (!t.length && !b.length) return { text: '', ok: false, backwards: [] };
    const rn = SumsDigits.readNumber(t, 1.1), rd = SumsDigits.readNumber(b, 1.1);
    const N = +rn.text, D = +rd.text;
    // any equal fraction counts: 1/2 for two quarters shaded
    const ok = rn.text !== '' && rd.text !== '' && D > 0 && N * c.q.d === c.q.n * D;
    return { text: `${rn.text || '?'}/${rd.text || '?'}`, ok, backwards: [...rn.backwards, ...rd.backwards] };
  }
  const r = SumsDigits.readNumber(answerStrokes(c), 1.1);
  return { text: r.text, ok: r.text !== '' && +r.text === c.q.ans, backwards: r.backwards };
}
function read(c) { return readAnswer(c).text; }
function scheduleRead(c, ms) { clearTimeout(c.timer); c.timer = setTimeout(() => showRead(c, read(c)), ms); }
function showRead(c, t) { c.el.querySelector('.read').textContent = t; }
function setState(c, s) { c.el.dataset.state = s; c.el.querySelector('.mark').textContent = s === 'right' ? '✓' : s === 'wrong' ? '✗' : ''; }

// ---------- marking ----------
let lastResult = null;
function mark() {
  if (sheetDone) { buildSheet(cfg); return; }
  const backwards = new Set();
  for (const c of cards) {
    if (c.el.dataset.state !== 'writing') continue;
    clearTimeout(c.timer);
    const r = readAnswer(c), t = r.text;
    showRead(c, t);
    if (!t) continue;
    c.tries++;
    const ok = r.ok;
    if (c.tries === 1) { c.first = ok; c.firstRead = t; }
    setState(c, ok ? 'right' : 'wrong');
    let note = '';
    if (ok && c.first === false) { c.el.dataset.claim = '1'; note += ` · first read ${c.firstRead}`; }
    // a backwards digit still counts: show it mirrored next to the right way round
    if (ok && r.backwards.length) {
      const ds = [...new Set(r.backwards)];
      ds.forEach(d => backwards.add(d));
      note += ' · ' + ds.map(d => `<span class="flipd">${d}</span>→${d}`).join(' ');
    }
    if (note) c.el.querySelector('.read').innerHTML = `${t} <span class="fixed">${note}</span>`;
  }
  if (backwards.size && age === 5) {
    const ds = [...backwards];
    say(`Well done. Watch out, your ${ds.join(' and your ')} ${ds.length > 1 ? 'are' : 'is'} backwards.`);
  }
  updateScore();
}
function updateScore() {
  const done = cards.filter(c => c.first !== null).length;
  const right = cards.filter(c => c.first === true).length;
  const all = cards.length > 0 && cards.every(c => c.el.dataset.state === 'right');
  if (all && !sheetDone) {
    sheetDone = true;
    const ms = Date.now() - (sheetStart || Date.now());
    lastResult = { ms, ...saveResult(sheetKey, ms, right, cards.length) };
  } else if (sheetDone && lastResult && lastResult.first !== right) {
    // "I was right the first time" tapped after the sheet was finished
    const r = loadRec(lastResult.player), h = r.history.find(x => x.t === lastResult.t);
    if (h) { h.first = right; store.set(recKey(lastResult.player), r); }
    lastResult.first = right;
  }
  let html = done ? `<span class="wide">First try </span><b>${right}</b>/${cards.length}` : '';
  if (sheetDone && lastResult) {
    const L = lastResult;
    html += ` · <b>${fmtTime(L.ms)}</b>` + (L.isBest && L.hadPrev ? ' New best!' : L.isBest ? '' : ` <span class="wide">(best ${fmtTime(L.best)})</span>`);
  }
  $('#score').innerHTML = html;
  $('#markBtn').textContent = sheetDone ? 'New sheet' : 'Mark';
}
$('#markBtn').onclick = mark;

goNames();
</script>
</body>
