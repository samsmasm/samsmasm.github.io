secondary research to judge opportunities and threats."]},{"term":"Market research","unit":4,"topic":"4.4 Market research","hl":false,"p":["the process of collecting and analysing information about customers, competitors and the market","to reduce risk and help a firm make better marketing decisions."]},{"term":"Observation","unit":4,"topic":"4.4 Market research","hl":false,"p":["research that watches and records how people actually behave","without asking them questions, such as how they move around a store or use a product."]},{"term":"Primary market research","unit":4,"topic":"4.4 Market research","hl":false,"p":["collecting new, first-hand data directly from customers or potential customers","for the firm's own specific purpose."]},{"term":"Qualitative research","unit":4,"topic":"4.4 Market research","hl":false,"p":["research that gathers opinions, attitudes and motives in non-numerical form","to understand why customers think and behave as they do."]},{"term":"Quantitative research","unit":4,"topic":"4.4 Market research","hl":false,"p":["research that gathers numerical data from many respondents","which can be statistically analysed to show how many people think or act in a certain way."]},{"term":"Quota sampling","unit":4,"topic":"4.4 Market research","hl":false,"p":["a non-random method that sets a target number of respondents for each subgroup","so that the sample mirrors the make-up of the target population."]},{"term":"Random sampling","unit":4,"topic":"4.4 Market research","hl":false,"p":["selecting respondents so that every member of the target population has an equal chance of being chosen","which reduces bias and makes the results more representative."]},{"term":"Sampling","unit":4,"topic":"4.4 Market research","hl":false,"p":["surveying a small, selected part of a target population instead of everyone","to save time and cost while still estimating the views of the whole group."]},{"term":"Secondary market research","unit":4,"topic":"4.4 Market research","hl":false,"p":["using existing information that was collected earlier by others","which is usually quicker and cheaper to obtain but may be out of date or poorly suited to the firm's needs."]},{"term":"Survey","unit":4,"topic":"4.4 Market research","hl":false,"p":["a research method that collects data from many respondents","by asking them the same set of questions, usually in a questionnaire."]},{"term":"Above-the-line promotion","unit":4,"topic":"4.5 The seven Ps of the marketing mix","hl":false,"p":["paid advertising placed in mass media channels","to reach a large, broad audience rather than selected individuals."]},{"term":"Below-the-line promotion","unit":4,"topic":"4.5 The seven Ps of the marketing mix","hl":false,"p":["promotion run directly by the firm rather than through mass media","and aimed at specific customers or groups to encourage purchases."]},{"term":"Brand awareness","unit":4,"topic":"4.5 The seven Ps of the marketing mix","hl":false,"p":["the extent to which customers know a brand exists","and can recognise or recall it when thinking about a type of product."]},{"term":"Brand development","unit":4,"topic":"4.5 The seven Ps of the marketing mix","hl":false,"p":["building and strengthening a brand's identity and image over time","through its name, design, quality and marketing so that customers connect with it."]},{"term":"Brand loyalty","unit":4,"topic":"4.5 The seven Ps of the marketing mix","hl":false,"p":["a customer's habit of choosing the same brand again and again","and resisting rival products even when they are cheaper or easy to find."]},{"term":"Brand value","unit":4,"topic":"4.5 The seven Ps of the marketing mix","hl":false,"p":["the estimated financial worth of a brand as an asset","reflecting the extra sales or higher prices that its reputation can earn."]},{"term":"Branding","unit":4,"topic":"4.5 The seven Ps of the marketing mix","hl":false,"p":["creating a distinct name, logo, image and identity for a product or business","so that customers can recognise it and tell it apart from competitors."]},{"term":"Competitive pricing","unit":4,"topic":"4.5 The seven Ps of the marketing mix","hl":true,"p":["setting prices at or close to those charged by rivals","so that price is not the deciding factor and the firm competes on other features."]},{"term":"Contribution pricing","unit":4,"topic":"4.5 The seven Ps of the marketing mix","hl":true,"p":["setting a price that covers the variable cost of each unit","so that every sale contributes towards fixed costs and profit, even if the price is below total cost."]},{"term":"Cost-plus (mark-up) pricing","unit":4,"topic":"4.5 The seven Ps of the marketing mix","hl":false,"p":["setting a price by working out the cost of each unit","and adding a fixed percentage mark-up to secure a profit margin."]},{"term":"Decline stage","unit":4,"topic":"4.5 The seven Ps of the marketing mix","hl":false,"p":["the product life cycle stage in which sales and profits fall","because demand is shrinking, so the firm must decide whether to withdraw or revive the product."],"review":true},{"term":"Digital marketing","unit":4,"topic":"4.5 The seven Ps of the marketing mix","hl":false,"p":["promoting products and brands through online and electronic channels","which allows precise targeting of customers and easy tracking of results."],"review":true},{"term":"Direct distribution","unit":4,"topic":"4.5 The seven Ps of the marketing mix","hl":false,"p":["selling goods or services straight from the producer to the consumer","without any intermediary, giving the firm control over the sale and the full margin."],"review":true},{"term":"Distribution channel","unit":4,"topic":"4.5 The seven Ps of the marketing mix","hl":false,"p":["the route a product takes from the producer to the final consumer","which may or may not involve intermediaries along the way."]},{"term":"Dynamic pricing","unit":4,"topic":"4.5 The seven Ps of the marketing mix","hl":true,"p":["adjusting prices frequently, often automatically,","in response to real-time changes in demand, supply or customer behaviour."]},{"term":"E-commerce","unit":4,"topic":"4.5 The seven Ps of the marketing mix","hl":false,"p":["buying and selling goods or services over the internet","with the order, and usually the payment, completed online."],"review":true},{"term":"Extension strategy","unit":4,"topic":"4.5 The seven Ps of the marketing mix","hl":false,"p":["a marketing action used to lengthen a product's life cycle","by delaying or reversing a fall in sales through changes to the product, price, promotion or market."]},{"term":"Growth stage","unit":4,"topic":"4.5 The seven Ps of the marketing mix","hl":false,"p":["the product life cycle stage in which sales rise rapidly","as the product becomes known, and profits begin to grow."],"review":true},{"term":"Indirect distribution","unit":4,"topic":"4.5 The seven Ps of the marketing mix","hl":false,"p":["selling to consumers through one or more intermediaries","located between the producer and the final buyer."],"review":true},{"term":"Intermediary","unit":4,"topic":"4.5 The seven Ps of the marketing mix","hl":false,"p":["a business that sits between the producer and the consumer in a distribution channel","and helps move products to market, usually earning a margin for doing so."],"review":true},{"term":"Introduction stage","unit":4,"topic":"4.5 The seven Ps of the marketing mix","hl":false,"p":["the opening phase of a product's life, starting at its launch,","with low sales, heavy development and promotion costs, and usually losses."],"review":true},{"term":"Loss leader","unit":4,"topic":"4.5 The seven Ps of the marketing mix","hl":false,"p":["a product deliberately priced below the cost of supplying it","so that it draws shoppers in and encourages them to buy more profitable goods too."]},{"term":"Marketing mix","unit":4,"topic":"4.5 The seven Ps of the marketing mix","hl":false,"p":["the combination of product, price, place and promotion decisions, extended for services with physical evidence, processes and people","that a firm blends to satisfy customer needs and meet its objectives."]},{"term":"Maturity stage","unit":4,"topic":"4.5 The seven Ps of the marketing mix","hl":false,"p":["the product life cycle stage in which sales growth levels off","because the market is saturated and many competitors are present."],"review":true},{"term":"Penetration pricing","unit":4,"topic":"4.5 The seven Ps of the marketing mix","hl":false,"p":["launching a new product at a deliberately low price","to win market share quickly, with the price usually raised later."]},{"term":"People (marketing mix)","unit":4,"topic":"4.5 The seven Ps of the marketing mix","hl":false,"p":["the employees and staff who deliver a service","whose skills, attitudes and behaviour shape the customer's experience and view of the business."]},{"term":"Physical evidence (marketing mix)","unit":4,"topic":"4.5 The seven Ps of the marketing mix","hl":false,"p":["the tangible items and surroundings that customers see","which give them evidence of a service's quality, since the service itself cannot be touched."]},{"term":"Place (marketing mix)","unit":4,"topic":"4.5 The seven Ps of the marketing mix","hl":false,"p":["decisions about how and where a product is made available to customers","including the distribution channels and locations used."]},{"term":"Predatory pricing","unit":4,"topic":"4.5 The seven Ps of the marketing mix","hl":false,"p":["setting prices very low, often below cost","to force competitors out of the market, after which prices may be raised."]},{"term":"Premium pricing","unit":4,"topic":"4.5 The seven Ps of the marketing mix","hl":false,"p":["setting a high price for a product","to signal exclusivity or superior quality to customers who are willing to pay more."]},{"term":"Price (marketing mix)","unit":4,"topic":"4.5 The seven Ps of the marketing mix","hl":false,"p":["the amount customers pay for a product","set to cover costs and earn profit, while also reflecting its perceived value and image."]},{"term":"Price elastic demand","unit":4,"topic":"4.5 The seven Ps of the marketing mix","hl":true,"p":["demand that is very responsive to a change in price","so that a 1% price change causes a bigger than 1% change in quantity demanded."],"review":true},{"term":"Price elasticity of demand","unit":4,"topic":"4.5 The seven Ps of the marketing mix","hl":true,"p":["a measure of how responsive the quantity demanded is to a change in price","calculated as the percentage change in quantity demanded divided by the percentage change in price."]},{"term":"Price inelastic demand","unit":4,"topic":"4.5 The seven Ps of the marketing mix","hl":true,"p":["demand that changes little when the price changes","so that the percentage change in quantity demanded is smaller than the percentage change in price."],"review":true},{"term":"Processes (marketing mix)","unit":4,"topic":"4.5 The seven Ps of the marketing mix","hl":false,"p":["the procedures and systems used to deliver a service to customers","which affect how smooth, fast and consistent the customer experience is."]},{"term":"Product (marketing mix)","unit":4,"topic":"4.5 The seven Ps of the marketing mix","hl":false,"p":["what a business offers to satisfy customer needs","including its features, quality, design, branding and packaging."]},{"term":"Product life cycle","unit":4,"topic":"4.5 The seven Ps of the marketing mix","hl":false,"p":["the stages a product passes through from launch to withdrawal","namely introduction, growth, maturity and decline, shown by changes in its sales over time."]},{"term":"Product portfolio","unit":4,"topic":"4.5 The seven Ps of the marketing mix","hl":false,"p":["the full range of products that a business sells","managed as a set so that risk is spread across items at different life cycle stages."]},{"term":"Promotion","unit":4,"topic":"4.5 The seven Ps of the marketing mix","hl":false,"p":["the methods a firm uses to communicate with customers","to make them aware of its products and persuade them to buy."]},{"term":"Retailer","unit":4,"topic":"4.5 The seven Ps of the marketing mix","hl":false,"p":["a business that buys goods in bulk from producers or wholesalers","and sells them in small quantities directly to final consumers."],"review":true},{"term":"Seven Ps","unit":4,"topic":"4.5 The seven Ps of the marketing mix","hl":false,"p":["the seven elements of the extended marketing mix: product, price, promotion, place, physical evidence, processes and people","which a firm combines to plan how it will meet customer needs, especially in services."]},{"term":"Social media marketing","unit":4,"topic":"4.5 The seven Ps of the marketing mix","hl":false,"p":["promoting products using social networking platforms","to engage customers directly, build brand awareness and encourage them to share content."]},{"term":"Through-the-line promotion","unit":4,"topic":"4.5 The seven Ps of the marketing mix","hl":false,"p":["a promotional approach that uses both mass-media and direct, targeted methods","in one integrated campaign with a consistent message."]},{"term":"Wholesaler","unit":4,"topic":"4.5 The seven Ps of the marketing mix","hl":false,"p":["an intermediary that buys large quantities from producers","and sells smaller lots to retailers, often storing goods and breaking up bulk orders."],"review":true},{"term":"Exporting","unit":4,"topic":"4.6 International marketing","hl":true,"p":["selling goods or services produced in one country to customers in another","which is a lower-risk way to enter foreign markets without investing in overseas production."],"review":true},{"term":"Global localization strategy","unit":4,"topic":"4.6 International marketing","hl":true,"p":["an approach that keeps a core product and brand consistent across countries","while adapting parts of the marketing mix to suit local tastes and culture."],"review":true},{"term":"Globalization","unit":4,"topic":"4.6 International marketing","hl":true,"p":["the growing integration of national economies","through increased trade, investment, technology and movement of people, so that markets and competition become worldwide."]},{"term":"International marketing","unit":4,"topic":"4.6 International marketing","hl":true,"p":["marketing a product in countries beyond the firm's home market","while adapting the marketing mix to differences in culture, laws, income and competition."]},{"term":"Operations management","unit":5,"topic":"5.1 Introduction to operations management","hl":false,"p":["the planning, organising and controlling of the activities that turn inputs into goods or services","so that customers receive what they want at an acceptable quality and cost."]},{"term":"Batch production","unit":5,"topic":"5.2 Operations methods","hl":false,"p":["making a product in groups of identical items","where the whole group completes one stage together before moving on to the next stage."]},{"term":"Capital intensive","unit":5,"topic":"5.2 Operations methods","hl":false,"p":["a way of producing that relies mainly on machinery and technology","so that capital makes up a larger share of the costs than labour does."],"review":true},{"term":"Job production","unit":5,"topic":"5.2 Operations methods","hl":false,"p":["making a single, one-off item built to the customer's own specification","with each job finished before the next one is started."]},{"term":"Labour intensive","unit":5,"topic":"5.2 Operations methods","hl":false,"p":["a way of producing that relies mainly on human workers","so that wages make up a larger share of the costs than machinery does."],"review":true},{"term":"Mass customization","unit":5,"topic":"5.2 Operations methods","hl":false,"p":["producing standardised parts on a large scale","and then adapting the final product to suit each customer's individual wishes."]},{"term":"Mass/flow production","unit":5,"topic":"5.2 Operations methods","hl":false,"p":["making very large quantities of identical products","on a continuous line where every item passes through the same stages in sequence."]},{"term":"Benchmarking","unit":5,"topic":"5.3 Lean production and quality management","hl":true,"p":["comparing a business's own processes and results","with those of the best performers, in order to find the gaps it needs to close."]},{"term":"Continuous improvement (kaizen)","unit":5,"topic":"5.3 Lean production and quality management","hl":true,"p":["a philosophy of making many small, ongoing changes to processes","led by employees at every level, which add up to large gains over time."]},{"term":"Cradle-to-cradle design","unit":5,"topic":"5.3 Lean production and quality management","hl":true,"p":["designing products so that their materials can be fully recovered","and used again as inputs for new products, leaving no waste."]},{"term":"Just-in-time (JIT)","unit":5,"topic":"5.3 Lean production and quality management","hl":true,"p":["a system in which materials and components arrive only when they are needed for production","so that little or no stock has to be held."]},{"term":"Lean production","unit":5,"topic":"5.3 Lean production and quality management","hl":true,"p":["an approach that removes every form of waste from production","so that goods are made with the fewest resources of time, materials, space and effort."]},{"term":"Quality assurance","unit":5,"topic":"5.3 Lean production and quality management","hl":true,"p":["a system of preventing defects by building quality into every stage of the process","rather than relying on inspecting the finished output."]},{"term":"Quality circle","unit":5,"topic":"5.3 Lean production and quality management","hl":true,"p":["a team of employees doing similar jobs who meet on a regular basis","to spot quality problems in their area and work out solutions for them."]},{"term":"Quality control","unit":5,"topic":"5.3 Lean production and quality management","hl":true,"p":["checking and testing products or processes at set points","to find and remove items that fall short of the required standard."]},{"term":"Quality standards","unit":5,"topic":"5.3 Lean production and quality management","hl":true,"p":["agreed, measurable requirements that a product or process must meet","which customers, regulators or the business itself use to judge whether quality is acceptable."]},{"term":"Total quality management (TQM)","unit":5,"topic":"5.3 Lean production and quality management","hl":true,"p":["a philosophy that makes everyone in the organisation responsible for quality","with the aim of meeting customer needs through constant improvement of what the business does."]},{"term":"Insourcing","unit":5,"topic":"5.4 Location","hl":false,"p":["bringing activities back to be done by the business's own staff","when they were previously carried out by an outside organisation."]},{"term":"Location","unit":5,"topic":"5.4 Location","hl":false,"p":["the geographical site where a business sets up its operations","chosen by weighing the costs and benefits of that site against the alternatives."]},{"term":"Offshoring","unit":5,"topic":"5.4 Location","hl":false,"p":["relocating some or all of a firm's production or services overseas","usually to gain lower costs or access to resources."]},{"term":"Outsourcing","unit":5,"topic":"5.4 Location","hl":false,"p":["paying an external business to carry out a function","that would otherwise be done within the firm."]},{"term":"Reshoring","unit":5,"topic":"5.4 Location","hl":false,"p":["moving operations that were being carried out abroad","back to the business's home country, often to gain more control or cut supply risks."]},{"term":"Subcontracting","unit":5,"topic":"5.4 Location","hl":false,"p":["hiring another business to produce part of a product or complete part of a job","under an agreement, instead of the firm doing that work itself."]},{"term":"Break-even analysis","unit":5,"topic":"5.5 Break-even analysis","hl":false,"p":["a technique that finds the level of output or sales at which total revenue equals total costs","to show the point from which a business starts to make a profit."]},{"term":"Break-even chart","unit":5,"topic":"5.5 Break-even analysis","hl":false,"p":["a graph plotting revenue and costs against output","where the lines cross at the break-even point, with profit or loss shown on either side."]},{"term":"Break-even quantity","unit":5,"topic":"5.5 Break-even analysis","hl":false,"p":["the number of units a business must sell","for its total revenue to just cover its total costs, giving neither profit nor loss."]},{"term":"Contribution per unit","unit":5,"topic":"5.5 Break-even analysis","hl":false,"p":["the amount each unit sold adds towards covering fixed costs and then profit","found by subtracting the variable cost per unit from the selling price."]},{"term":"Margin of safety","unit":5,"topic":"5.5 Break-even analysis","hl":false,"p":["the amount by which actual or planned sales exceed the break-even level","showing how far sales could fall before the business begins to make a loss."]},{"term":"Target price","unit":5,"topic":"5.5 Break-even analysis","hl":false,"p":["the selling price a business must charge","to reach its desired profit at a given level of output."]},{"term":"Target profit","unit":5,"topic":"5.5 Break-even analysis","hl":false,"p":["the amount of profit a business aims to earn in a given period","which is used to work out the output or price needed to achieve it."]},{"term":"Target profit output","unit":5,"topic":"5.5 Break-even analysis","hl":false,"p":["the number of units a business must make and sell","to earn its chosen profit once its fixed costs have been covered."]},{"term":"Total contribution","unit":5,"topic":"5.5 Break-even analysis","hl":false,"p":["the combined amount that all units sold add towards fixed costs and profit","found by multiplying the contribution per unit by the quantity sold."]},{"term":"Buffer stock","unit":5,"topic":"5.6 Production planning","hl":true,"p":["a reserve of extra inventory held above normal needs","to protect the business against late deliveries or unexpected rises in demand."]},{"term":"Capacity utilization rate","unit":5,"topic":"5.6 Production planning","hl":true,"p":["the percentage of a business's maximum possible output","that it is actually producing, found by dividing current output by capacity."]},{"term":"Capital productivity","unit":5,"topic":"5.6 Production planning","hl":true,"p":["the amount of output produced for each unit of capital invested","showing how effectively the business is using its machinery and equipment."]},{"term":"Cost to buy (CTB)","unit":5,"topic":"5.6 Production planning","hl":true,"p":["the total cost of purchasing a product from an external supplier","found by multiplying the price per unit by the quantity bought."]},{"term":"Cost to make (CTM)","unit":5,"topic":"5.6 Production planning","hl":true,"p":["the total cost of producing a product within the business","made up of fixed costs plus the variable cost per unit multiplied by the quantity."]},{"term":"Defect rate","unit":5,"topic":"5.6 Production planning","hl":true,"p":["the percentage of output that is faulty or below the required quality","found by dividing the number of defective units by the total number produced."]},{"term":"Just-in-case (JIC)","unit":5,"topic":"5.6 Production planning","hl":true,"p":["a stock approach in which a business holds large inventories","as protection against supply disruptions or sudden rises in demand, accepting higher storage costs."]},{"term":"Labour productivity","unit":5,"topic":"5.6 Production planning","hl":true,"p":["the amount of output produced per worker","over a set period, found by dividing total output by the number of employees."]},{"term":"Lead time","unit":5,"topic":"5.6 Production planning","hl":true,"p":["the delay between placing an order with a supplier","and receiving the goods, which must be allowed for when deciding when to reorder."]},{"term":"Operating leverage","unit":5,"topic":"5.6 Production planning","hl":true,"p":["the proportion of a firm's total costs that are fixed rather than variable","which determines how strongly a change in sales revenue changes its profit."]},{"term":"Productivity","unit":5,"topic":"5.6 Production planning","hl":true,"p":["the relationship between the output a business produces","and the inputs it uses to produce it, so that higher productivity means more efficient production."]},{"term":"Productivity rate","unit":5,"topic":"5.6 Production planning","hl":true,"p":["a measure of average efficiency","found by dividing the total output by the total inputs used in the production process."]},{"term":"Reorder level","unit":5,"topic":"5.6 Production planning","hl":true,"p":["the level of stock at which a new order is placed","set high enough to cover the usage expected during the lead time plus any buffer stock."]},{"term":"Reorder quantity","unit":5,"topic":"5.6 Production planning","hl":true,"p":["the number of units ordered from a supplier","each time stock falls to the reorder level."]},{"term":"Stock control chart","unit":5,"topic":"5.6 Production planning","hl":true,"p":["a graph that tracks stock levels over time","showing deliveries and usage, with the maximum, buffer and reorder levels and lead time used to decide when to order."]},{"term":"Supply chain","unit":5,"topic":"5.6 Production planning","hl":true,"p":["the sequence of businesses and stages","through which a product passes from raw materials to the final customer."]},{"term":"Contingency planning","unit":5,"topic":"5.7 Crisis management and contingency planning","hl":true,"p":["preparing in advance a set of responses to possible disruptive events","so that the business can act quickly and with less damage if one occurs."]},{"term":"Crisis management","unit":5,"topic":"5.7 Crisis management and contingency planning","hl":true,"p":["the actions taken to deal with a sudden and serious event","in order to limit the damage to the business and its stakeholders and return to normal operations."]},{"term":"Copyright","unit":5,"topic":"5.8 Research and development","hl":true,"p":["a legal right giving the creators of original works","sole control over copying and distributing them for a limited period of time."]},{"term":"Disruptive innovation","unit":5,"topic":"5.8 Research and development","hl":true,"p":["a new idea or product that creates an entirely new market","and, in doing so, displaces established products and firms in an existing market."]},{"term":"Incremental innovation","unit":5,"topic":"5.8 Research and development","hl":true,"p":["small, step-by-step changes that improve what a business already offers or how it makes it","instead of introducing something wholly new."]},{"term":"Innovation","unit":5,"topic":"5.8 Research and development","hl":true,"p":["creating a new product, service or process","that delivers value to customers or to the business."]},{"term":"Intellectual property","unit":5,"topic":"5.8 Research and development","hl":true,"p":["legal ownership of intangible creations of the mind","which gives the owner control over their use and the right to stop others copying them."]},{"term":"Patent","unit":5,"topic":"5.8 Research and development","hl":true,"p":["a legal right granted to the inventor of a new product or process","giving them the sole right to produce, use and sell it for a fixed period."]},{"term":"Research and development (R&D)","unit":5,"topic":"5.8 Research and development","hl":true,"p":["activities a business carries out to discover new knowledge","and turn it into new or improved products and processes."]},{"term":"Trademark","unit":5,"topic":"5.8 Research and development","hl":true,"p":["a registered word, symbol or logo used to identify one business's products","which legally prevents competitors from using the same or a confusingly similar mark."]},{"term":"Algorithm","unit":5,"topic":"5.9 Management information systems","hl":true,"p":["a sequence of step-by-step rules or instructions","that a computer follows to carry out a task or reach a result."],"review":true},{"term":"Artificial intelligence (AI)","unit":5,"topic":"5.9 Management information systems","hl":true,"p":["the ability of computer systems to carry out tasks that normally need human intelligence","by learning from data, reasoning and making decisions."]},{"term":"Artificial neural network","unit":5,"topic":"5.9 Management information systems","hl":true,"p":["a computer system made of layers of connected nodes","that is loosely modelled on the human brain and learns to recognise patterns in data."]},{"term":"Big data","unit":5,"topic":"5.9 Management information systems","hl":true,"p":["extremely large and complex sets of data","gathered quickly from many sources, which need specialist tools to store and analyse."]},{"term":"Cloud computing","unit":5,"topic":"5.9 Management information systems","hl":true,"p":["using remote servers accessed over the internet","to store, manage and process data and software instead of relying on the firm's own computers."]},{"term":"Critical infrastructure","unit":5,"topic":"5.9 Management information systems","hl":true,"p":["the essential systems and facilities that a country or economy depends on to function","whose failure or damage would cause serious disruption to society and business."]},{"term":"Customer loyalty programme","unit":5,"topic":"5.9 Management information systems","hl":true,"p":["a scheme that rewards customers for repeat purchases","with the aim of encouraging them to keep buying from the same business."]},{"term":"Cybercrime","unit":5,"topic":"5.9 Management information systems","hl":true,"p":["criminal activity that targets or uses computer systems and networks","to steal, damage or disrupt data, money or services."]},{"term":"Cybersecurity","unit":5,"topic":"5.9 Management information systems","hl":true,"p":["the protection of computers, networks and data","from unauthorised access, attack and damage, using technology, processes and staff practices."]},{"term":"Data analytics","unit":5,"topic":"5.9 Management information systems","hl":true,"p":["examining collected data with statistical and computer-based techniques","to find patterns and insights that help a business answer questions and make decisions."]},{"term":"Data centre","unit":5,"topic":"5.9 Management information systems","hl":true,"p":["a facility housing large numbers of computer servers","that store, process and distribute an organisation's data and applications."]},{"term":"Data mining","unit":5,"topic":"5.9 Management information systems","hl":true,"p":["searching very large data sets by computer","to uncover hidden patterns and relationships and use them to predict future behaviour."]},{"term":"Database","unit":5,"topic":"5.9 Management information systems","hl":true,"p":["an organised collection of electronic data","stored so that it can be quickly searched, retrieved and updated."]},{"term":"Digital Taylorism","unit":5,"topic":"5.9 Management information systems","hl":true,"p":["the use of digital technology to monitor and measure employees' work in fine detail","in order to break tasks down and push for greater efficiency, following Taylor's scientific management."]},{"term":"Internet of things (IoT)","unit":5,"topic":"5.9 Management information systems","hl":true,"p":["a network of physical devices fitted with sensors and internet connections","that collect and exchange data automatically with each other without human involvement."]},{"term":"Machine learning","unit":5,"topic":"5.9 Management information systems","hl":true,"p":["a form of AI in which computers improve at a task","by finding patterns in data, rather than following fixed instructions written by a programmer."],"review":true},{"term":"Management information system (MIS)","unit":5,"topic":"5.9 Management information systems","hl":true,"p":["a computer-based system that collects, stores and processes data","and presents it as information that managers use to plan, monitor and make decisions."]},{"term":"Virtual reality","unit":5,"topic":"5.9 Management information systems","hl":true,"p":["computer-generated 3D environments","that users experience as though they were present in them, usually through a headset."]},{"term":"Absorption costing","unit":6,"topic":"Toolkit","hl":true,"p":["a costing method that assigns all costs, fixed and variable, to products","so that the cost of each unit includes a share of the overheads."]},{"term":"Ansoff matrix","unit":6,"topic":"Toolkit","hl":false,"p":["a tool that sets out four growth strategies","by combining existing or new products with existing or new markets."]},{"term":"Bar chart","unit":6,"topic":"Toolkit","hl":false,"p":["a chart that uses bars whose length shows the value of each category","making it easy to compare quantities across categories."]},{"term":"Boston Consulting Group (BCG) matrix","unit":6,"topic":"Toolkit","hl":false,"p":["a tool that classifies a business's products by their market share and the growth rate of their market","to guide decisions about where to invest or withdraw."]},{"term":"Business plan","unit":6,"topic":"Toolkit","hl":false,"p":["a written document setting out a business's objectives","and how it intends to achieve them through its marketing, operations, people and financial forecasts."]},{"term":"Cash cow","unit":6,"topic":"Toolkit","hl":false,"p":["a product with a high market share in a slow-growth market","that earns more cash than it needs and so helps fund other products."]},{"term":"Circular business model","unit":6,"topic":"Toolkit","hl":false,"p":["a way of operating that keeps materials and products in use for as long as possible","by reusing, repairing and recycling them instead of throwing them away after one use."]},{"term":"Circular supply model","unit":6,"topic":"Toolkit","hl":false,"p":["replacing finite, single-use inputs with renewable, recycled or biodegradable ones","so that production draws on fewer new raw materials."]},{"term":"Contribution costing","unit":6,"topic":"Toolkit","hl":true,"p":["a costing method that assigns only variable costs to products","and treats fixed costs as a lump sum to be covered by total contribution."]},{"term":"Correlation","unit":6,"topic":"Toolkit","hl":true,"p":["the strength and direction of the relationship between two sets of data","showing whether they tend to move together or in opposite directions."]},{"term":"Cost leadership","unit":6,"topic":"Toolkit","hl":true,"p":["a strategy of becoming the lowest-cost producer in an industry","so that the firm can charge lower prices or earn higher margins than its rivals."]},{"term":"Critical path","unit":6,"topic":"Toolkit","hl":true,"p":["the longest sequence of dependent activities in a project","which sets the shortest possible completion time, because any delay to these activities delays the whole project."]},{"term":"Critical path analysis","unit":6,"topic":"Toolkit","hl":true,"p":["a technique that maps a project's activities, their order and their durations","to find the critical path and the shortest time in which the project can be completed."]},{"term":"Decision tree","unit":6,"topic":"Toolkit","hl":false,"p":["a diagram that maps possible choices, their outcomes and the chance of each outcome","so that the expected value of each option can be compared."]},{"term":"Dependent variable","unit":6,"topic":"Toolkit","hl":true,"p":["the variable whose value is being predicted or explained","because it is assumed to change in response to another variable."],"review":true},{"term":"Descriptive statistics","unit":6,"topic":"Toolkit","hl":false,"p":["numerical measures that summarise a data set","by showing its central tendency and spread without drawing conclusions beyond the data."]},{"term":"Differentiation strategy","unit":6,"topic":"Toolkit","hl":true,"p":["a strategy of offering products that customers see as unique or superior","so that they are willing to pay a higher price than for rivals' products."]},{"term":"Diversification","unit":6,"topic":"Toolkit","hl":false,"p":["a growth strategy of moving into unfamiliar markets with unfamiliar products","which spreads risk but is the most uncertain Ansoff option because the business lacks experience of both."]},{"term":"Dog (BCG matrix)","unit":6,"topic":"Toolkit","hl":false,"p":["a product with a low market share in a slow-growth market","that earns little cash and is often considered for withdrawal."]},{"term":"Driving forces","unit":6,"topic":"Toolkit","hl":true,"p":["factors in force field analysis that push a proposed change forward","by increasing the pressure for it to happen."]},{"term":"Dummy activity","unit":6,"topic":"Toolkit","hl":true,"p":["an activity on a network diagram, shown as a dotted arrow, with no duration and no resources","that exists only to show that one activity depends on another."],"review":true},{"term":"Expected value","unit":6,"topic":"Toolkit","hl":false,"p":["the average payoff of a decision, found by multiplying each possible outcome by its probability","and adding the results together."],"review":true},{"term":"Extrapolation","unit":6,"topic":"Toolkit","hl":true,"p":["extending a trend found in past data into the future","by assuming that the same pattern will continue, in order to forecast later values."]},{"term":"Float (critical path analysis)","unit":6,"topic":"Toolkit","hl":true,"p":["the spare time available to an activity that is not on the critical path","meaning it can start late or take longer without delaying the end of the project."]},{"term":"Focus strategy","unit":6,"topic":"Toolkit","hl":true,"p":["a strategy of concentrating on one narrow market segment","and serving it better than rivals through either lower costs or differentiation."]},{"term":"Force field analysis","unit":6,"topic":"Toolkit","hl":true,"p":["a tool that weighs the forces pushing for a change","against the forces resisting it, to judge whether the change is likely to succeed."]},{"term":"Free float","unit":6,"topic":"Toolkit","hl":true,"p":["the time an activity can be delayed","without delaying the earliest start of the next activity, so that no other activity is affected."]},{"term":"Gantt chart","unit":6,"topic":"Toolkit","hl":true,"p":["a bar chart that shows project tasks against a timeline","displaying when each task starts and finishes and how the tasks overlap."]},{"term":"Hofstede's cultural dimensions","unit":6,"topic":"Toolkit","hl":true,"p":["a framework that compares national cultures using several scored dimensions of values","to help businesses understand differences in behaviour and expectations between countries."]},{"term":"Independent variable","unit":6,"topic":"Toolkit","hl":true,"p":["the variable assumed to influence another variable","and whose values are used to predict the dependent variable."],"review":true},{"term":"Individualism versus collectivism","unit":6,"topic":"Toolkit","hl":true,"p":["a cultural dimension showing whether people put personal goals and independence first","or give priority to loyalty to the wider group and its interests."]},{"term":"Indulgence versus restraint","unit":6,"topic":"Toolkit","hl":true,"p":["a cultural dimension showing how freely a society lets people enjoy life and satisfy their desires","as opposed to controlling them through strict social norms."]},{"term":"Infographic","unit":6,"topic":"Toolkit","hl":false,"p":["a visual display that combines images, charts and short pieces of text","to present information or data in a form that is quick and easy to understand."]},{"term":"Line of best fit","unit":6,"topic":"Toolkit","hl":true,"p":["a straight line drawn through the points on a scatter diagram","that follows the general trend of the data and can be used to make predictions."]},{"term":"Long-term versus short-term orientation","unit":6,"topic":"Toolkit","hl":true,"p":["a cultural dimension contrasting societies that plan and invest for the future","with those that focus on tradition and immediate results."]},{"term":"Make or buy analysis","unit":6,"topic":"Toolkit","hl":true,"p":["a comparison of the costs and other factors of producing in-house","with those of purchasing from an external supplier, to decide which option is better."]},{"term":"Market development","unit":6,"topic":"Toolkit","hl":false,"p":["a growth strategy of taking current products into markets the business has not yet served","such as new areas, countries or customer groups."]},{"term":"Market penetration","unit":6,"topic":"Toolkit","hl":false,"p":["a growth strategy of increasing sales of existing products","in existing markets by winning more customers or encouraging current ones to buy more."]},{"term":"Masculinity versus femininity","unit":6,"topic":"Toolkit","hl":true,"p":["a cultural dimension contrasting societies that value achievement, competition and success","with those that value cooperation, caring and quality of life."]},{"term":"Mean","unit":6,"topic":"Toolkit","hl":false,"p":["the average of a data set","calculated by totalling the values and then dividing that total by how many values there are."]},{"term":"Median","unit":6,"topic":"Toolkit","hl":false,"p":["the middle value of a data set when the values are arranged in order","which is less affected by extreme values than the mean."]},{"term":"Mode","unit":6,"topic":"Toolkit","hl":false,"p":["the value that occurs most often in a data set","so it shows the most typical outcome, although a set can have more than one."]},{"term":"Opportunities (SWOT)","unit":6,"topic":"Toolkit","hl":false,"p":["external factors or trends that a business could take advantage of","to gain an advantage, which lie outside its control."]},{"term":"Pie chart","unit":6,"topic":"Toolkit","hl":false,"p":["a circular chart divided into slices","whose sizes show the share that each category makes up of the whole."]},{"term":"Porter's generic strategies","unit":6,"topic":"Toolkit","hl":true,"p":["a framework identifying the broad ways a business can gain a competitive advantage","through low cost, differentiation or a narrow focus."]},{"term":"Power distance","unit":6,"topic":"Toolkit","hl":true,"p":["a cultural dimension showing how far the less powerful members of a society","accept and expect that power is shared unequally."]},{"term":"Product development","unit":6,"topic":"Toolkit","hl":false,"p":["a growth strategy of creating new or improved products","to sell to the business's existing markets."]},{"term":"Product life extension model","unit":6,"topic":"Toolkit","hl":false,"p":["a circular approach that keeps products in use for longer","through maintenance, repair and upgrading instead of replacing them."]},{"term":"Product service system model","unit":6,"topic":"Toolkit","hl":false,"p":["a circular approach in which a business sells the use or service of a product","rather than the product itself, so it keeps ownership and responsibility for it."]},{"term":"Quartiles","unit":6,"topic":"Toolkit","hl":false,"p":["values that divide ordered data into four equal parts","so that the lower and upper quartiles mark the points below which 25% and 75% of the values fall."]},{"term":"Question mark (problem child)","unit":6,"topic":"Toolkit","hl":false,"p":["a product with a low market share in a fast-growing market","that uses up a lot of cash and could develop into either a star or a dog."]},{"term":"Resource recovery model","unit":6,"topic":"Toolkit","hl":false,"p":["a circular approach that turns waste and by-products","into new inputs or materials so that less has to be thrown away."]},{"term":"Restraining forces","unit":6,"topic":"Toolkit","hl":true,"p":["factors in force field analysis that resist or block a proposed change","and so reduce the chance that it will happen."]},{"term":"Scatter diagram","unit":6,"topic":"Toolkit","hl":true,"p":["a graph that plots pairs of values for two variables as points","to show whether a relationship exists between them."]},{"term":"Sharing model","unit":6,"topic":"Toolkit","hl":false,"p":["a circular approach in which an asset is used by many people in turn","rather than being owned by one, which increases how intensively each asset is used."]},{"term":"Simple linear regression","unit":6,"topic":"Toolkit","hl":true,"p":["a statistical technique that finds the straight line which best describes the relationship","between one independent and one dependent variable, so that values can be predicted."]},{"term":"Standard deviation","unit":6,"topic":"Toolkit","hl":false,"p":["a measure of how widely the values in a data set are spread around the mean","with a larger figure meaning there is more variation."]},{"term":"Star (BCG matrix)","unit":6,"topic":"Toolkit","hl":false,"p":["a product with a high market share in a fast-growing market","that earns well but needs heavy investment to defend its position."]},{"term":"STEEPLE analysis","unit":6,"topic":"Toolkit","hl":false,"p":["a tool for scanning the external environment","across social, technological, economic, environmental, political, legal and ethical factors that could affect the business."]},{"term":"Strengths (SWOT)","unit":6,"topic":"Toolkit","hl":false,"p":["internal factors that give a business an advantage over its competitors","and that the business can control."]},{"term":"SWOT analysis","unit":6,"topic":"Toolkit","hl":false,"p":["a tool that assesses a business's internal strengths and weaknesses","together with the opportunities and threats in its external environment."]},{"term":"Threats (SWOT)","unit":6,"topic":"Toolkit","hl":false,"p":["external factors that could harm a business or its performance","and that lie outside the business's control."]},{"term":"Total float","unit":6,"topic":"Toolkit","hl":true,"p":["the total delay an activity can absorb without delaying the end of the project","calculated as latest finish time minus earliest start time minus the activity's duration."]},{"term":"Uncertainty avoidance","unit":6,"topic":"Toolkit","hl":true,"p":["a cultural dimension showing how uncomfortable people in a society are with ambiguity","and how strongly they prefer rules and structure to reduce risk."]},{"term":"Weaknesses (SWOT)","unit":6,"topic":"Toolkit","hl":false,"p":["internal factors that put a business at a disadvantage compared with competitors","and that the business has some control over improving."]}];

const $ = id => document.getElementById(id);
const LENGTHS = [6, 12, 'All'];
const PER_BOARD = 3;
const state = {
  picks: new Set(), length: 6, pool: [],
  boards: [], b: 0, score: 0, scored: 0, missed: [],
  frags: [], placed: {}, sel: null, locked: false,
};

function shuffle(a) { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
const clean = s => s.replace(/[,.;:]\s*$/, '');
function esc(s) { return s.replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]); }
function fullHTML(d) {
  const rest = [d.p[0].charAt(0).toUpperCase() + d.p[0].slice(1), ...d.p.slice(1)];
  return `<strong>${esc(d.term)}</strong>${revTag(d)}: ${rest.map(esc).join(' <span class="sep">|</span> ')}`;
}
// ---------- review again ----------
// Per-student lists kept in this browser per subject (a Google sign-in may replace this later:
// only loadSet and saveSet touch storage).
//   again: terms the student marked "Review again"
//   seen:  terms already asked this cycle, so every picked term comes up before any repeats
const SUBJECT = 'business';
const keyOf = d => `${d.unit}|${d.term}`;
function loadSet(name) { try { return new Set(JSON.parse(localStorage.getItem(`dd-${name}-${SUBJECT}`)) || []); } catch { return new Set(); } }
function saveSet(name, set) { try { localStorage.setItem(`dd-${name}-${SUBJECT}`, JSON.stringify([...set])); } catch {} }
const again = loadSet('again'), seen = loadSet('seen');
const saveAgain = () => saveSet('again', again);
// n terms from the pick, never-asked first; once every picked term has been asked, those start a fresh cycle
function choose(pool, n) {
  const fresh = shuffle(pool.filter(d => !seen.has(keyOf(d))));
  if (fresh.length >= n) return fresh.slice(0, n);
  for (const d of pool) seen.delete(keyOf(d));
  saveSet('seen', seen);
  const rest = shuffle(pool.filter(d => !fresh.includes(d)));
  return shuffle([...fresh, ...rest.slice(0, n - fresh.length)]);
}
function againBtn(d) {
  const on = again.has(keyOf(d));
  return `<button type="button" class="again" data-k="${esc(keyOf(d))}" aria-pressed="${on}">${on ? '★' : '☆'} Review again</button>`;
}
document.addEventListener('click', e => {
  const b = e.target.closest('.again');
  if (!b) return;
  const k = b.dataset.k;
  again.has(k) ? again.delete(k) : again.add(k);
  saveAgain();
  for (const x of document.querySelectorAll('.again')) if (x.dataset.k === k) x.outerHTML = againBtn(DEFS.find(d => keyOf(d) === k));
  if (!$('setup').hidden) { renderAgain(); syncSetup(); }
});
// start page: Whole course plus one button per unit (no subtopics), and a fold-out list
function renderAgain() {
  const saved = DEFS.filter(d => again.has(keyOf(d)));
  $('againBlock').hidden = !saved.length;
  const wrap = $('againChips'), list = $('againList');
  wrap.innerHTML = '';
  if (!saved.length) { list.hidden = true; return; }
  const groups = [['Whole course', saved]];
  for (const u of [...new Set(saved.map(d => d.unit))].sort((a, b) => a - b)) groups.push([UNITS[u].split(':')[0], saved.filter(d => d.unit === u)]);
  for (const [name, g] of groups) {
    const b = chip('whole againpick', `${esc(name)}<span class="n">${g.length}</span>`, () => pickAll(g, !isFull(g)));
    b._g = g; wrap.append(b);
  }
  const fold = document.createElement('button'); fold.className = 'fold'; fold.setAttribute('aria-expanded', !list.hidden);
  fold.innerHTML = 'List <span class="chev" aria-hidden="true">▾</span>';
  fold.onclick = () => { list.hidden = !list.hidden; fold.setAttribute('aria-expanded', !list.hidden); };
  wrap.append(fold);
  list.innerHTML = saved.map(d => `<li>${fullHTML(d)}<br>${againBtn(d)}</li>`).join('');
}

// flagged in the bank for Sam to double-check: still played, with a small note for students
const revTag = d => d.review ? '<span class="rev" title="This definition is still being checked, so it may change.">subject to review</span>' : '';
// split a list of terms into boards of 3 (a leftover of 1 or 2 is spread over the last boards)
function chunk(list) {
  const n = Math.max(1, Math.floor(list.length / PER_BOARD));
  const out = Array.from({ length: n }, () => []);
  list.forEach((x, i) => out[i < n * PER_BOARD ? Math.floor(i / PER_BOARD) : n - 1 - (i - n * PER_BOARD) % n].push(x));
  return out;
}

// ---------- setup ----------
function topicsByUnit() {
  const m = new Map();
  for (const d of DEFS) {
    if (!m.has(d.unit)) m.set(d.unit, new Map());
    const t = m.get(d.unit); t.set(d.topic, (t.get(d.topic) || 0) + 1);
  }
  return [...m.entries()].sort((a, b) => a[0] - b[0]);
}
const HL_TOPICS = new Set([...new Set(DEFS.map(d => d.topic))].filter(t => DEFS.every(d => d.topic !== t || d.hl)));
// Picks are single terms, because some HL terms sit inside SL subtopics.
// A group (unit or subtopic) is "full" when every term is picked, "SL" when every SL term is picked and no HL one.
const isFull = g => g.every(d => state.picks.has(d));
const isSL = g => g.some(d => !d.hl) && g.every(d => state.picks.has(d) === !d.hl);
const pickAll = (g, on) => { for (const d of g) on ? state.picks.add(d) : state.picks.delete(d); };
state.level = {};   // per unit: 'SL' after Whole unit SL, so subtopics tapped after it add SL terms only
function chip(cls, html, onclick) {
  const b = document.createElement('button'); b.className = 'chip ' + cls; b.innerHTML = html;
  b.onclick = () => { onclick(); syncSetup(); }; return b;
}
function buildPicker() {
  const wrap = $('units'); wrap.innerHTML = '';
  for (const [u, topics] of topicsByUnit()) {
    const unit = DEFS.filter(d => d.unit === u), sl = unit.filter(d => !d.hl);
    const div = document.createElement('div'); div.className = 'unit'; div.dataset.u = u;
    div.innerHTML = `<h3>${esc(UNITS[u])}</h3><div class="wholes"></div><div class="chips" hidden></div>`;
    const wholes = div.querySelector('.wholes'), subs = div.querySelector('.chips');
    const mixed = sl.length < unit.length;   // no HL terms (Unit 1): one plain Whole unit button
    if (mixed) wholes.append(chip('whole sl', `Whole unit SL<span class="n">${sl.length}</span>`, () => {
      const on = isSL(unit); pickAll(unit, false); if (!on) pickAll(sl, true); state.level[u] = 'SL';
    }));
    wholes.append(chip('whole hl', `Whole unit${mixed ? ' HL' : ''}<span class="n">${unit.length}</span>`, () => {
      pickAll(unit, !isFull(unit)); state.level[u] = 'HL';
    }));
    const fold = document.createElement('button'); fold.className = 'fold'; fold.setAttribute('aria-expanded', 'false');
    fold.innerHTML = 'Subtopics <span class="chev" aria-hidden="true">▾</span>';
    fold.onclick = () => { const open = subs.hidden; subs.hidden = !open; fold.setAttribute('aria-expanded', open); };
    wholes.append(fold);
    for (const t of [...topics.keys()].sort((a, b) => a.localeCompare(b, undefined, { numeric: true }))) {
      const g = unit.filter(d => d.topic === t);
      const b = chip('sub', `${esc(t)}${HL_TOPICS.has(t) ? '<span class="hl">HL</span>' : ''}<span class="n"></span>`, () => {
        if (isFull(g) || isSL(g)) return pickAll(g, false);
        pickAll(state.level[u] === 'SL' && g.some(d => !d.hl) ? g.filter(d => !d.hl) : g, true);
      });
      b._g = g; subs.append(b);
    }
    div._unit = unit; wrap.append(div);
  }
}
function syncSetup() {
  for (const div of $('units').querySelectorAll('.unit')) {
    const unit = div._unit;
    div.querySelector('.whole.hl').setAttribute('aria-pressed', isFull(unit));
    div.querySelector('.whole.sl')?.setAttribute('aria-pressed', isSL(unit) && !isFull(unit));
    for (const b of div.querySelectorAll('.chip.sub')) {
      const on = isFull(b._g) || isSL(b._g);
      b.setAttribute('aria-pressed', on);
      b.querySelector('.n').textContent = on ? b._g.filter(d => state.picks.has(d)).length : b._g.length;
    }
  }
  for (const b of $('againChips').querySelectorAll('.chip')) b.setAttribute('aria-pressed', isFull(b._g));
  const picked = state.picks.size;
  $('picked').textContent = picked ? `${picked} term${picked === 1 ? '' : 's'} picked` : 'Pick a unit or some topics';
  const fresh = [...state.picks].filter(d => !seen.has(keyOf(d))).length;
  $('fresh').textContent = !picked || fresh === picked ? '' : fresh ? `· ${fresh} not asked yet` : '· all asked, starting again';
  $('start').disabled = picked === 0;
}
function renderSetup() {
  if (!$('units').firstChild) buildPicker();
  renderAgain();
  syncSetup();
  const seg = $('lengths'); seg.innerHTML = '';
  for (const L of LENGTHS) {
    const b = document.createElement('button'); b.textContent = L;
    b.setAttribute('aria-pressed', state.length === L);
    b.onclick = () => { state.length = L; renderSetup(); };
    seg.appendChild(b);
  }
}
function show(id) { for (const s of ['setup', 'play', 'end']) $(s).hidden = s !== id; window.scrollTo(0, 0); }

// items: [{d, extra}] ; extra terms fill a board but are not scored
function startRound(items) {
  state.boards = chunk(items); state.b = 0; state.score = 0; state.missed = [];
  state.scored = items.filter(x => !x.extra).length;
  show('play'); renderBoard();
}
$('start').onclick = () => {
  state.pool = DEFS.filter(d => state.picks.has(d));
  const items = choose(state.pool, state.length === 'All' ? state.pool.length : state.length).map(d => ({ d }));
  startRound(padBoard(items));
};
// a board needs 3 terms: if too few were picked, borrow unscored ones from the same unit
function padBoard(items) {
  if (items.length >= PER_BOARD) return items;
  const units = new Set(items.map(x => x.d.unit)), have = new Set(items.map(x => x.d));
  const fill = shuffle(DEFS.filter(d => !have.has(d) && units.has(d.unit)));
  const out = items.slice();
  while (out.length < PER_BOARD && fill.length) out.push({ d: fill.pop(), extra: true });
  return shuffle(out);
}

// ---------- board ----------
function renderBoard() {
  const items = state.boards[state.b];
  state.frags = shuffle(items.flatMap((it, t) => it.d.p.map((p, part) => ({ t, part, text: clean(p) })))).map((f, id) => ({ ...f, id }));
  state.placed = {}; state.sel = null; state.locked = false;
  $('progress').textContent = `${state.b + 1} of ${state.boards.length}`;
  const topics = [...new Set(items.map(it => it.d.topic))];
  $('qtopic').textContent = topics.join(' · ');
  $('board').classList.remove('locked');
  $('check').hidden = false; $('next').hidden = true;
  $('terms').innerHTML = items.map((it, t) => `<div class="term" data-t="${t}"><div class="head"><h3>${esc(it.d.term)}${revTag(it.d)}</h3>${againBtn(it.d)}</div>${
    it.d.p.map((_, i) => `<button type="button" class="slot" data-slot="${t}-${i}" aria-label="${esc(it.d.term)}, piece ${i + 1}"></button>`).join('')
  }<p class="fix" hidden></p></div>`).join('');
  renderPieces();
}
function fragHTML(f) {
  return `<button type="button" class="frag" data-f="${f.id}"><span class="grip" aria-hidden="true">&#8942;&#8942;</span><span class="txt">${esc(f.text)}</span><span class="mark"></span></button>`;
}
const slotOf = fid => Object.keys(state.placed).find(k => state.placed[k] === fid);
function renderPieces() {
  document.querySelectorAll('#terms .slot').forEach(s => {
    const fid = state.placed[s.dataset.slot];
    s.innerHTML = fid === undefined ? '' : fragHTML(state.frags[fid]);
    s.classList.toggle('filled', fid !== undefined);
    s.classList.toggle('sel', state.sel === s.dataset.slot);
  });
  const loose = state.frags.filter(f => slotOf(f.id) === undefined);
  $('pool').innerHTML = loose.map(fragHTML).join('');
  if (typeof state.sel === 'number') document.querySelector(`.frag[data-f="${state.sel}"]`)?.classList.add('sel');
  $('left').textContent = loose.length ? `${loose.length} left` : '';
  $('score').textContent = `${state.score} right`;
  $('check').disabled = loose.length > 0 || state.locked;
}
// put piece fid into slot; whatever was there goes where fid came from
function place(fid, slot) {
  const from = slotOf(fid), occupant = state.placed[slot];
  if (from === slot) return;
  state.placed[slot] = fid;
  if (from !== undefined) { if (occupant !== undefined) state.placed[from] = occupant; else delete state.placed[from]; }
}
function unplace(fid) { const from = slotOf(fid); if (from !== undefined) delete state.placed[from]; }

// tap to select, tap to place (works in either order).
// Pointer taps on pieces are handled in endDrag; the click listener covers keyboard and taps on boxes and the pool.
let suppressClick = false, lastTap = { f: -1, t: 0 };
$('board').addEventListener('click', e => {
  if (state.locked) return;
  if (suppressClick) { suppressClick = false; return; }
  const f = e.target.closest('.frag');
  if (f && +f.dataset.f === lastTap.f && Date.now() - lastTap.t < 600) return; // already handled on pointerup
  tap(e.target);
});
function tap(target) {
  const fragEl = target.closest('.frag'), slotEl = target.closest('.slot');
  const sel = state.sel;
  if (fragEl) {
    const fid = +fragEl.dataset.f;
    const inSlot = slotEl ? slotEl.dataset.slot : null;
    if (typeof sel === 'string' && !inSlot) { place(fid, sel); state.sel = null; }
    else if (typeof sel === 'number' && sel !== fid && inSlot) { place(sel, inSlot); state.sel = null; }
    else if (typeof sel === 'number' && sel !== fid && !inSlot && slotOf(sel) !== undefined) {
      // a placed piece is selected and a loose one tapped: swap them
      place(fid, slotOf(sel)); state.sel = null;
    }
    else state.sel = sel === fid ? null : fid;
  } else if (slotEl) {
    const slot = slotEl.dataset.slot;
    if (typeof sel === 'number') { place(sel, slot); state.sel = null; }
    else state.sel = sel === slot ? null : slot;
  } else if (target.closest('.poolwrap') && typeof sel === 'number') {
    unplace(sel); state.sel = null;
  } else return;
  renderPieces();
}

// drag: mouse from anywhere on a piece, touch only from its grip (so the page still scrolls)
let drag = null;
$('board').addEventListener('pointerdown', e => {
  const fragEl = e.target.closest('.frag');
  if (!fragEl || state.locked || e.button > 0) return;
  if (e.pointerType !== 'mouse' && !e.target.closest('.grip')) return;
  drag = { fid: +fragEl.dataset.f, el: fragEl, x: e.clientX, y: e.clientY, id: e.pointerId, on: false, ghost: null, over: null };
  fragEl.setPointerCapture(e.pointerId);
});
function startDrag(e) {
  const r = drag.el.getBoundingClientRect();
  const g = drag.el.cloneNode(true); g.classList.add('ghost'); g.classList.remove('sel');
  g.style.width = r.width + 'px'; g.style.left = r.left + 'px'; g.style.top = r.top + 'px';
  drag.dx = e.clientX - r.left; drag.dy = e.clientY - r.top;
  document.body.appendChild(g);
  drag.ghost = g; drag.on = true; drag.el.classList.add('lifted');
  autoScroll();
}
function targetAt(x, y) {
  const el = document.elementFromPoint(x, y);
  if (!el) return null;
  return el.closest('.slot') || el.closest('.poolwrap');
}
document.addEventListener('pointermove', e => {
  if (!drag || e.pointerId !== drag.id) return;
  if (!drag.on) { if (Math.hypot(e.clientX - drag.x, e.clientY - drag.y) < 6) return; startDrag(e); }
  drag.lastY = e.clientY; drag.lastX = e.clientX;
  drag.ghost.style.left = (e.clientX - drag.dx) + 'px';
  drag.ghost.style.top = (e.clientY - drag.dy) + 'px';
  const t = targetAt(e.clientX, e.clientY);
  if (t !== drag.over) {
    drag.over?.classList.remove('over'); (t?.classList.contains('poolwrap') ? $('pool') : t)?.classList.add('over');
    $('pool').classList.toggle('over', !!t?.classList.contains('poolwrap'));
    drag.over = t;
  }
});
function endDrag(e, cancel) {
  if (!drag || e.pointerId !== drag.id) return;
  const d = drag; drag = null;
  if (!d.on) { if (!cancel) { lastTap = { f: d.fid, t: Date.now() }; tap(d.el); } return; }
  d.ghost.remove(); d.el.classList.remove('lifted');
  document.querySelectorAll('.over').forEach(x => x.classList.remove('over'));
  suppressClick = true; setTimeout(() => { suppressClick = false; }, 0);
  if (cancel) return renderPieces();
  const t = targetAt(e.clientX, e.clientY);
  if (t?.classList.contains('slot')) place(d.fid, t.dataset.slot);
  else if (t) unplace(d.fid);
  state.sel = null;
  renderPieces();
}
document.addEventListener('pointerup', e => endDrag(e, false));
document.addEventListener('pointercancel', e => endDrag(e, true));
// scroll the page while a piece is held near the top or bottom edge
function autoScroll() {
  if (!drag || !drag.on) return;
  const y = drag.lastY ?? drag.y, edge = 70;
  const v = y < edge ? -(edge - y) / 4 : y > innerHeight - edge ? (y - (innerHeight - edge)) / 4 : 0;
  if (v) window.scrollBy(0, v);
  requestAnimationFrame(autoScroll);
}

$('check').onclick = () => {
  const items = state.boards[state.b];
  state.locked = true; state.sel = null;
  renderPieces();
  $('board').classList.add('locked');
  items.forEach((it, t) => {
    let right = true;
    it.d.p.forEach((_, i) => {
      const slot = `${t}-${i}`, f = state.frags[state.placed[slot]];
      const ok = f.t === t && f.part === i;
      if (!ok) right = false;
      const el = document.querySelector(`.slot[data-slot="${slot}"] .frag`);
      el.classList.add(ok ? 'ok' : 'bad');
      el.querySelector('.mark').textContent = ok ? '✓' : '✗';
      el.querySelector('.mark').setAttribute('aria-label', ok ? 'Right' : 'Wrong');
    });
    const card = document.querySelector(`.term[data-t="${t}"]`);
    card.classList.add(right ? 'right' : 'wrong');
    if (!right) { const fx = card.querySelector('.fix'); fx.innerHTML = fullHTML(it.d); fx.hidden = false; }
    if (!it.extra) { if (right) state.score++; else state.missed.push(it.d); }
    seen.add(keyOf(it.d));
  });
  saveSet('seen', seen);
  $('score').textContent = `${state.score} right`;
  $('check').hidden = true; $('next').hidden = false;
  $('next').textContent = state.b === state.boards.length - 1 ? 'See score' : 'Next';
  $('next').focus({ preventScroll: true });
};
$('next').onclick = () => {
  state.b++;
  if (state.b < state.boards.length) { renderBoard(); window.scrollTo(0, 0); } else renderEnd();
};

// ---------- end ----------
function renderEnd() {
  show('end');
  $('final').textContent = `${state.score} / ${state.scored}`;
  const m = state.missed;
  $('missedWrap').hidden = m.length === 0;
  $('retry').hidden = m.length === 0;
  $('missed').innerHTML = m.map(d => `<li>${fullHTML(d)}<br>${againBtn(d)}</li>`).join('');
}
// retry missed: if fewer than 3 were missed, other terms from the same topics fill the board (not scored)
$('retry').onclick = () => {
  startRound(padBoard(shuffle(state.missed).map(d => ({ d }))));
};
$('again').onclick = () => $('start').onclick();
$('change').onclick = () => { show('setup'); renderSetup(); };

renderSetup();
</script>
</body>
</html>
