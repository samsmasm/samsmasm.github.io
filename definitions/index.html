<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Definition Drill</title>
<meta name="description" content="Rebuild IB Business Management definitions piece by piece.">
<link rel="icon" href="/geocornsmall.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Fraunces:opsz,wght@9..144,500;9..144,700&display=swap" rel="stylesheet">
<style>
:root {
  --masthead: #1e2a4a; --masthead-ink: #fff; --masthead-sub: #c9d2ea;
  --amber: #f4a629; --amber-ink: #8a5a00; --amber-soft: #fdf0d8;
  --bg: #f7f6f2; --surface: #fffdf8; --surface-2: #efede6; --line: #e3e0d8;
  --ink: #1e2a4a; --muted: #5b6680; --bm: #1a3a7a;
  --ok: #18634f; --ok-soft: #d9eee6; --bad: #8a1c1c; --bad-soft: #f8e1e1;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink);
  font: 18px/1.5 'Atkinson Hyperlegible', -apple-system, 'Segoe UI', sans-serif; }
h1, h2, h3 { font-family: 'Fraunces', Georgia, serif; font-weight: 600; font-variant-numeric: lining-nums; margin: 0; }
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 3px solid var(--amber); outline-offset: 2px; }

header { background: var(--masthead); color: var(--masthead-ink); border-bottom: 4px solid var(--amber); }
.mast { max-width: 1100px; margin: 0 auto; padding: 12px 16px; display: flex; align-items: center; gap: 12px; }
.mast img { width: 48px; height: 48px; }
.mast h1 { font-size: 1.5rem; line-height: 1.1; }
.mast .sub { font-size: 0.72rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--masthead-sub); }
.mast a.home { margin-left: auto; color: var(--masthead-ink); font-size: 0.9rem; text-decoration: none; }
.mast a.home:hover { text-decoration: underline; }

main { max-width: 1100px; margin: 0 auto; padding: 20px 16px 40px; }
#setup, #end { max-width: 760px; }
.label { font-size: 0.75rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); margin: 0 0 8px; }
.lede { margin: 0 0 20px; color: var(--muted); }
section.block { margin-bottom: 24px; }

.btn { border-radius: 10px; padding: 12px 20px; min-height: 48px; border: 1px solid var(--line); background: var(--surface); }
.btn.primary { background: var(--masthead); color: #fff; border-color: var(--masthead); font-weight: 700; }
.btn:disabled { opacity: 0.45; cursor: default; }
.row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }

/* topic picker */
.unit { margin-bottom: 22px; }
.unit h3 { font-size: 1.1rem; color: var(--bm); margin-bottom: 8px; }
.wholes { display: grid; grid-template-columns: repeat(2, minmax(0, 220px)) auto; justify-content: start; gap: 8px; }
@media (max-width: 560px) { .wholes { grid-template-columns: 1fr 1fr; } .wholes .fold { grid-column: 1 / -1; justify-self: start; } .chip.whole { padding: 10px; white-space: nowrap; } }
.chips { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 8px; margin-top: 8px; }
.chip { border-radius: 8px; padding: 10px 14px; min-height: 48px; border: 1px solid var(--line); background: var(--surface); text-align: left;
  display: flex; align-items: center; gap: 8px; }
.chip.whole { font-weight: 700; }
.chip .hl { font-size: 0.72rem; letter-spacing: 0.08em; color: var(--amber-ink); font-weight: 700; }
.chip .n { color: var(--muted); font-size: 0.85rem; margin-left: auto; padding-left: 6px; }
.chip[aria-pressed="true"] { background: var(--bm); border-color: var(--bm); color: #fff; }
.chip[aria-pressed="true"] .hl { color: var(--amber); }
.chip[aria-pressed="true"] .n { color: var(--masthead-sub); }
.fold { border: 0; background: none; color: var(--bm); min-height: 48px; padding: 10px 6px; display: flex; align-items: center; gap: 6px; }
.fold .chev { display: inline-block; transition: transform 0.15s; }
.fold[aria-expanded="true"] .chev { transform: rotate(180deg); }
.picked { color: var(--muted); }
.seg { display: flex; }
.seg button { border: 1px solid var(--line); background: var(--surface); padding: 10px 18px; min-height: 48px; min-width: 64px; margin-left: -1px; }
.seg button:first-child { border-radius: 10px 0 0 10px; margin-left: 0; }
.seg button:last-child { border-radius: 0 10px 10px 0; }
.seg button[aria-pressed="true"] { background: var(--masthead); border-color: var(--masthead); color: #fff; position: relative; }

/* board */
.top { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 4px; }
.top .score { font-weight: 700; }
.topic { color: var(--bm); margin: 0 0 14px; font-size: 0.9rem; }
.board { display: grid; gap: 20px; margin-bottom: 16px; }
@media (min-width: 900px) {
  .board { grid-template-columns: 1fr 1fr; align-items: start; }
  .poolwrap { position: sticky; top: 12px; }
}
.terms { display: flex; flex-direction: column; gap: 14px; }
.term { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px; }
.term h3 { font-size: 1.15rem; color: var(--bm); margin: 0 0 8px; }
.slot { display: block; width: 100%; min-height: 56px; border: 2px dashed var(--line); border-radius: 10px;
  background: var(--bg); margin-top: 8px; padding: 0; text-align: left; }
.slot:empty::after { content: ''; display: block; min-height: 52px; }
.slot.sel, .slot.over { border-color: var(--amber); background: var(--amber-soft); }
.slot.filled { border-style: solid; border-color: transparent; background: none; }
.fix { margin: 10px 0 0; font-size: 0.95rem; color: var(--ink); border-top: 1px solid var(--line); padding-top: 8px; }
.fix b { color: var(--ok); }
.term.right { border-color: var(--ok); }
.term.wrong { border-color: var(--bad); }

.poolwrap .label { display: flex; justify-content: space-between; }
.pool { display: flex; flex-direction: column; gap: 10px; min-height: 64px; border-radius: 12px; padding: 4px; }
.pool.over { background: var(--amber-soft); }
.pool:empty::after { content: 'All placed'; color: var(--muted); padding: 16px 8px; }

.frag { display: flex; width: 100%; align-items: stretch; gap: 0; text-align: left; background: #fff;
  border: 1px solid var(--line); border-radius: 10px; padding: 0; line-height: 1.4; user-select: none; -webkit-user-select: none; }
.frag .grip { flex: none; width: 34px; display: flex; align-items: center; justify-content: center; color: var(--muted);
  touch-action: none; cursor: grab; font-size: 1.1rem; border-right: 1px solid var(--line); border-radius: 10px 0 0 10px; background: var(--surface-2); }
.frag .txt { flex: 1; padding: 10px 12px; }
.frag .mark { flex: none; width: 30px; display: none; align-items: center; justify-content: center; font-weight: 700; }
.frag.sel { border-color: var(--amber); outline: 2px solid var(--amber); outline-offset: -2px; background: var(--amber-soft); }
.frag.lifted { opacity: 0.35; }
@media (pointer: fine) { .frag { cursor: grab; } }
.ghost { position: fixed; z-index: 50; pointer-events: none; margin: 0; border-color: var(--masthead); opacity: 0.95; }
.locked .frag { cursor: default; }
.locked .frag .grip { display: none; }
.locked .frag .mark { display: flex; }
.frag.ok { background: var(--ok-soft); border-color: var(--ok); }
.frag.ok .mark { color: var(--ok); }
.frag.bad { background: var(--bad-soft); border-color: var(--bad); }
.frag.bad .mark { color: var(--bad); }

/* end */
.big { font-family: 'Fraunces', Georgia, serif; font-size: 3rem; font-weight: 700; line-height: 1; margin: 4px 0 16px; }
.missed { list-style: none; padding: 0; margin: 0 0 20px; }
.missed li { border-top: 1px solid var(--line); padding: 12px 0; }
.missed li:last-child { border-bottom: 1px solid var(--line); }
.sep { color: var(--amber-ink); font-weight: 700; padding: 0 2px; }

footer { max-width: 1100px; margin: 0 auto; padding: 16px; font-size: 0.75rem; color: var(--muted); border-top: 1px solid var(--line); }
[hidden] { display: none !important; }
@media (max-width: 480px) {
  body { font-size: 17px; }
  .mast h1 { font-size: 1.25rem; }
  .mast img { width: 40px; height: 40px; }
}
</style>
</head>
<body>
<header>
  <div class="mast">
    <img src="/geocorn.png" alt="">
    <div><h1>Definition Drill</h1><div class="sub">IB Business Management</div></div>
    <a class="home" href="/">unisam.nz</a>
  </div>
</header>

<main>
  <div id="setup">
    <p class="lede">Three terms, six pieces. Put two pieces under each term, in order.</p>
    <section class="block">
      <p class="label">Topics</p>
      <div id="units"></div>
    </section>
    <section class="block">
      <p class="label">How many terms</p>
      <div class="seg" id="lengths"></div>
    </section>
    <div class="row"><button class="btn primary" id="start">Start</button><span class="picked" id="picked"></span></div>
  </div>

  <div id="play" hidden>
    <div class="top"><span class="label" id="progress"></span><span class="score" id="score"></span></div>
    <p class="topic" id="qtopic"></p>
    <div class="board" id="board">
      <div class="terms" id="terms"></div>
      <div class="poolwrap"><p class="label"><span>Pieces</span><span id="left"></span></p><div class="pool" id="pool"></div></div>
    </div>
    <div class="row"><button class="btn primary" id="check" disabled>Check</button><button class="btn primary" id="next" hidden>Next</button></div>
  </div>

  <div id="end" hidden>
    <p class="label">Score</p>
    <div class="big" id="final"></div>
    <div id="missedWrap">
      <h2 style="font-size:1.2rem;margin-bottom:8px">To go over</h2>
      <ul class="missed" id="missed"></ul>
    </div>
    <div class="row">
      <button class="btn primary" id="retry">Retry missed</button>
      <button class="btn" id="again">Play again</button>
      <button class="btn" id="change">Change topics</button>
    </div>
  </div>
</main>
<footer>Built by Sam G · found a problem? tell Sam.</footer>

<script>
// BEGIN DATA (generated by build.mjs from data/defs.json, do not edit by hand)
const UNITS = {"1":"Unit 1: Introduction to business management","2":"Unit 2: Human resource management","3":"Unit 3: Finance and accounts","4":"Unit 4: Marketing","5":"Unit 5: Operations management"};
const DEFS = [{"term":"Demographic change","unit":2,"topic":"2.1 Introduction to human resource management","hl":false,"p":["a shift over time in the size, age profile or location of a population,","which changes the pool of workers and the pattern of customers that businesses can draw on."]},{"term":"Flexi-time","unit":2,"topic":"2.1 Introduction to human resource management","hl":false,"p":["a working arrangement in which employees choose their own start and finish times","as long as they complete an agreed total number of hours."]},{"term":"Gig economy","unit":2,"topic":"2.1 Introduction to human resource management","hl":false,"p":["a labour market in which people take on short-term, task-by-task or freelance work","rather than holding permanent employment with one employer."]},{"term":"Human resource management","unit":2,"topic":"2.1 Introduction to human resource management","hl":false,"p":["the strategic management of an organisation's people, covering recruiting, developing, motivating and retaining them,","so that the workforce helps the organisation achieve its objectives."]},{"term":"Human resource planning","unit":2,"topic":"2.1 Introduction to human resource management","hl":false,"p":["forecasting the number and type of workers a business will need in future","and planning how to recruit, train or reduce staff to match that demand."]},{"term":"Immigration","unit":2,"topic":"2.1 Introduction to human resource management","hl":false,"p":["the movement of people into a country from elsewhere in order to live or work there,","which adds to the labour supply available to its businesses."]},{"term":"Labour mobility","unit":2,"topic":"2.1 Introduction to human resource management","hl":false,"p":["the ease with which workers can move between different jobs or industries","or between different geographical areas to take up employment."]},{"term":"Resistance to change","unit":2,"topic":"2.1 Introduction to human resource management","hl":false,"p":["the reluctance of employees or managers to accept new ways of working,","usually because they fear losing job security, status or familiar routines."]},{"term":"Bureaucracy","unit":2,"topic":"2.2 Organizational structure","hl":false,"p":["an organisational system that relies on strict rules and formal procedures","with clearly defined roles and decisions passed through many levels of officials."]},{"term":"Centralization","unit":2,"topic":"2.2 Organizational structure","hl":false,"p":["authority to make key decisions is held by a small number of senior managers or head office,","so lower-level staff and branches have little say in them."]},{"term":"Chain of command","unit":2,"topic":"2.2 Organizational structure","hl":false,"p":["the line of formal authority running from the top of an organisation to its lowest level,","showing who gives instructions to, and is accountable to, whom."]},{"term":"Decentralization","unit":2,"topic":"2.2 Organizational structure","hl":false,"p":["decision-making authority is passed down to lower levels, branches or departments,","so managers closer to customers and operations can act without head office approval."]},{"term":"Delayering","unit":2,"topic":"2.2 Organizational structure","hl":false,"p":["removing one or more levels of the management hierarchy,","so the organisation becomes flatter and the remaining managers' spans of control widen."]},{"term":"Delegation","unit":2,"topic":"2.2 Organizational structure","hl":false,"p":["passing authority for a task or decision down to a subordinate","while the manager remains accountable for the final outcome."]},{"term":"Flat (horizontal) organizational chart","unit":2,"topic":"2.2 Organizational structure","hl":false,"p":["an organisational structure with only a few layers of management","and wide spans of control, which shortens lines of communication."]},{"term":"Levels of hierarchy","unit":2,"topic":"2.2 Organizational structure","hl":false,"p":["the count of separate ranks of management and staff","stacked between the top decision maker and the front-line workers."]},{"term":"Matrix structure","unit":2,"topic":"2.2 Organizational structure","hl":false,"p":["a structure in which employees belong to both a functional department and a project or product team,","so they answer to two or more managers at the same time."]},{"term":"Organization by function","unit":2,"topic":"2.2 Organizational structure","hl":false,"p":["grouping employees into departments based on the specialist task they perform,","so that people with similar skills work together under one manager."]},{"term":"Organization by product","unit":2,"topic":"2.2 Organizational structure","hl":false,"p":["grouping employees into divisions according to the product or product line they make or sell,","with each division having its own staff for the functions it needs."]},{"term":"Organization by region","unit":2,"topic":"2.2 Organizational structure","hl":false,"p":["grouping employees into units based on the geographical area in which they operate,","so each area can respond to its own customers and local conditions."]},{"term":"Organizational chart","unit":2,"topic":"2.2 Organizational structure","hl":false,"p":["a diagram of an organisation's structure","showing job roles, levels of hierarchy and who is accountable to whom."]},{"term":"Organizational structure","unit":2,"topic":"2.2 Organizational structure","hl":false,"p":["the formal arrangement of roles, authority and reporting relationships within a business,","which determines how tasks are allocated and how information flows."]},{"term":"Project-based organization","unit":2,"topic":"2.2 Organizational structure","hl":true,"p":["a structure in which staff are grouped into temporary teams formed to complete a specific project","and are disbanded or reassigned once it ends."]},{"term":"Shamrock organization","unit":2,"topic":"2.2 Organizational structure","hl":true,"p":["a structure built on three groups: a small core of permanent key staff, outside contractors, and part-time or temporary workers,","which lets the business flex its labour force as demand changes."]},{"term":"Span of control","unit":2,"topic":"2.2 Organizational structure","hl":false,"p":["the number of employees a manager directly supervises,","which affects how many levels of hierarchy are needed and how closely staff are managed."]},{"term":"Tall (vertical) organizational chart","unit":2,"topic":"2.2 Organizational structure","hl":false,"p":["an organisational structure with many layers of management","and narrow spans of control, which allows close supervision but slows communication."]},{"term":"Autocratic leadership","unit":2,"topic":"2.3 Leadership and management","hl":false,"p":["a leadership style in which the leader makes decisions alone","and does not seek or value input from subordinates."]},{"term":"Democratic leadership","unit":2,"topic":"2.3 Leadership and management","hl":false,"p":["a leadership style in which the leader invites employees to contribute to decisions","and takes their views into account before deciding."]},{"term":"Intuitive thinking","unit":2,"topic":"2.3 Leadership and management","hl":true,"p":["making decisions quickly using gut feeling, instinct and past experience","rather than a lengthy analysis of data."]},{"term":"Laissez-faire leadership","unit":2,"topic":"2.3 Leadership and management","hl":false,"p":["a leadership style in which the leader gives employees the freedom to make their own decisions","and provides little direction or supervision."]},{"term":"Leadership","unit":2,"topic":"2.3 Leadership and management","hl":false,"p":["the ability to influence, guide and inspire others","to work willingly towards the achievement of shared goals."]},{"term":"Management","unit":2,"topic":"2.3 Leadership and management","hl":false,"p":["the process of planning, organising, coordinating and controlling resources","in order to achieve organisational objectives efficiently."]},{"term":"Paternalistic leadership","unit":2,"topic":"2.3 Leadership and management","hl":false,"p":["a leadership style in which the leader makes the decisions but acts in what they see as the employees' best interests,","explaining their reasons and showing concern for staff welfare."]},{"term":"Scientific thinking","unit":2,"topic":"2.3 Leadership and management","hl":true,"p":["a decision-making approach based on systematic analysis, evidence and testing of data","in order to reach logical, objective conclusions."]},{"term":"Situational leadership","unit":2,"topic":"2.3 Leadership and management","hl":false,"p":["a view that no single leadership style is best,","so the leader adapts their style to the task, the employees and the circumstances."]},{"term":"360-degree feedback","unit":2,"topic":"2.4 Motivation and demotivation","hl":true,"p":["an appraisal method that gathers opinions on an employee's performance from the many different people they deal with","including managers, colleagues, subordinates and customers, rather than from one supervisor alone."]},{"term":"Appraisal","unit":2,"topic":"2.4 Motivation and demotivation","hl":true,"p":["a formal process of assessing an employee's performance and potential","so that strengths and weaknesses can be identified and decisions on training, rewards or promotion made."]},{"term":"Commission","unit":2,"topic":"2.4 Motivation and demotivation","hl":false,"p":["a payment to a worker calculated as a share of the value of the sales they make,","paid in addition to, or instead of, a basic wage."]},{"term":"Deci and Ryan's self-determination theory","unit":2,"topic":"2.4 Motivation and demotivation","hl":true,"p":["a theory that people are motivated by three innate psychological needs: autonomy, competence and relatedness,","and that meeting these needs builds intrinsic motivation."]},{"term":"Demotivation","unit":2,"topic":"2.4 Motivation and demotivation","hl":false,"p":["a fall in an employee's enthusiasm and willingness to put effort into their work","which tends to reduce productivity and raise absenteeism."]},{"term":"Dismissal","unit":2,"topic":"2.4 Motivation and demotivation","hl":true,"p":["the ending of an employee's contract by the employer","because of unsatisfactory conduct or performance, rather than because the job is no longer needed."]},{"term":"Employee share ownership scheme","unit":2,"topic":"2.4 Motivation and demotivation","hl":false,"p":["a scheme that gives employees, or lets them buy, shares in the company they work for,","so they receive a share of its profits through dividends and gain a stake in its success."]},{"term":"Empowerment","unit":2,"topic":"2.4 Motivation and demotivation","hl":false,"p":["giving employees greater authority and freedom to make decisions about their own work","and trusting them to take responsibility for the results."]},{"term":"Equity theory","unit":2,"topic":"2.4 Motivation and demotivation","hl":true,"p":["a theory that employees compare their own effort and rewards with those of colleagues","and become demotivated if they judge the balance to be unfair."]},{"term":"Expectancy theory","unit":2,"topic":"2.4 Motivation and demotivation","hl":true,"p":["a theory that people are motivated to act when they expect that effort will lead to good performance","and that this performance will lead to an outcome they value."]},{"term":"External recruitment","unit":2,"topic":"2.4 Motivation and demotivation","hl":true,"p":["filling a job vacancy with someone from outside the business,","which brings in new skills and ideas but usually costs more and takes longer than promoting from within."]},{"term":"Extrinsic motivation","unit":2,"topic":"2.4 Motivation and demotivation","hl":false,"p":["motivation that comes from outside the individual, through rewards or punishments given by others,","rather than from enjoyment or satisfaction in the work itself."]},{"term":"Financial rewards","unit":2,"topic":"2.4 Motivation and demotivation","hl":false,"p":["monetary payments and benefits that employees receive in return for their work,","which are used to attract, motivate and keep staff."]},{"term":"Formative appraisal","unit":2,"topic":"2.4 Motivation and demotivation","hl":true,"p":["ongoing review of an employee's performance throughout the year,","aimed at giving feedback so they can develop and improve."]},{"term":"Fringe payments","unit":2,"topic":"2.4 Motivation and demotivation","hl":false,"p":["benefits that employees receive on top of their basic pay,","given in kind or as perks, which add to the overall value of their employment package."]},{"term":"Herzberg's motivation-hygiene theory","unit":2,"topic":"2.4 Motivation and demotivation","hl":false,"p":["a theory that job satisfaction and dissatisfaction come from two separate sets of factors:","motivators, which increase satisfaction, and hygiene factors, which prevent dissatisfaction."]},{"term":"Hygiene factors","unit":2,"topic":"2.4 Motivation and demotivation","hl":false,"p":["in Herzberg's theory, job conditions that do not motivate when they are present","but cause dissatisfaction when they are inadequate."]},{"term":"Induction training","unit":2,"topic":"2.4 Motivation and demotivation","hl":false,"p":["training given to new employees when they join,","to introduce them to the organisation, their role, their colleagues and its procedures."]},{"term":"Internal recruitment","unit":2,"topic":"2.4 Motivation and demotivation","hl":true,"p":["filling a vacancy with someone who already works for the organisation, by promotion or transfer,","which is cheaper and faster but limits the range of applicants."]},{"term":"Intrinsic motivation","unit":2,"topic":"2.4 Motivation and demotivation","hl":false,"p":["motivation that comes from within a person,","through interest, enjoyment or a sense of achievement in the work itself rather than from external rewards."]},{"term":"Job enlargement","unit":2,"topic":"2.4 Motivation and demotivation","hl":false,"p":["adding extra tasks of a similar level to an employee's existing job","so that the work becomes less repetitive."]},{"term":"Job enrichment","unit":2,"topic":"2.4 Motivation and demotivation","hl":false,"p":["giving employees more challenging tasks with greater responsibility and decision making,","so that the job becomes more meaningful and motivating."]},{"term":"Job rotation","unit":2,"topic":"2.4 Motivation and demotivation","hl":false,"p":["moving employees between different jobs or tasks at the same level on a regular basis","to reduce boredom and develop a wider range of skills."]},{"term":"Labour turnover","unit":2,"topic":"2.4 Motivation and demotivation","hl":true,"p":["the rate at which employees leave an organisation during a given year or other period,","usually measured as the number of leavers divided by the average number employed, as a percentage."]},{"term":"Maslow's hierarchy of needs","unit":2,"topic":"2.4 Motivation and demotivation","hl":false,"p":["a theory that human needs form a five-level hierarchy, from physiological needs up to self-actualisation,","and that people are motivated to satisfy lower needs before higher ones."]},{"term":"McClelland's acquired needs theory","unit":2,"topic":"2.4 Motivation and demotivation","hl":true,"p":["a theory that people develop, through life experience, a dominant need for achievement, affiliation or power,","and that this need shapes what motivates them."]},{"term":"Motivation","unit":2,"topic":"2.4 Motivation and demotivation","hl":false,"p":["the desire and willingness of a person to put effort into their work,","driven by needs and incentives that determine how hard and for how long they keep trying."]},{"term":"Motivators","unit":2,"topic":"2.4 Motivation and demotivation","hl":false,"p":["in Herzberg's theory, factors in the job itself that increase satisfaction and encourage employees to work harder,","but whose absence leaves employees neutral rather than dissatisfied."]},{"term":"Non-financial rewards","unit":2,"topic":"2.4 Motivation and demotivation","hl":false,"p":["benefits given to employees that are not direct payments of money","and instead satisfy needs such as recognition, development, status or enjoyment of the work."]},{"term":"Off-the-job training","unit":2,"topic":"2.4 Motivation and demotivation","hl":false,"p":["training that takes place away from the employee's normal place of work, usually run by outside specialists,","which gives focused learning but means the employee is not producing in the meantime."]},{"term":"On-the-job training","unit":2,"topic":"2.4 Motivation and demotivation","hl":false,"p":["training carried out at the employee's own workplace while they perform their normal tasks,","usually guided by an experienced colleague."]},{"term":"Performance-related pay (PRP)","unit":2,"topic":"2.4 Motivation and demotivation","hl":false,"p":["pay that varies according to how well an employee or team performs,","measured against agreed targets."]},{"term":"Piece rate","unit":2,"topic":"2.4 Motivation and demotivation","hl":false,"p":["a payment method in which workers are paid for each unit they produce,","so their earnings rise directly with output."]},{"term":"Profit-related pay","unit":2,"topic":"2.4 Motivation and demotivation","hl":false,"p":["a payment in which part of an employee's pay depends on the profit the business makes,","so staff gain when the firm does well."]},{"term":"Recruitment","unit":2,"topic":"2.4 Motivation and demotivation","hl":true,"p":["the process of attracting suitable applicants for a job vacancy","and selecting the most appropriate candidate to fill it."]},{"term":"Salary","unit":2,"topic":"2.4 Motivation and demotivation","hl":false,"p":["a fixed amount paid to an employee for their work, usually quoted annually and paid monthly,","regardless of the exact number of hours worked or output produced."]},{"term":"Self-appraisal","unit":2,"topic":"2.4 Motivation and demotivation","hl":true,"p":["an appraisal method in which employees rate their own work against agreed objectives","and identify their own strengths and areas needing development."]},{"term":"Summative appraisal","unit":2,"topic":"2.4 Motivation and demotivation","hl":true,"p":["a formal review of an employee's performance over a set period,","used to make judgements for decisions on pay, promotion or retention."]},{"term":"Taylor's scientific management","unit":2,"topic":"2.4 Motivation and demotivation","hl":false,"p":["an approach that seeks to raise productivity by breaking jobs into simple, timed tasks and training workers to do them in the most efficient way,","while motivating them mainly through piece-rate pay."]},{"term":"Teamwork","unit":2,"topic":"2.4 Motivation and demotivation","hl":false,"p":["employees cooperating and combining their different skills and efforts","to achieve a shared goal that individuals might not reach alone."]},{"term":"Time rate","unit":2,"topic":"2.4 Motivation and demotivation","hl":false,"p":["a payment method in which employees are paid according to the hours they work,","regardless of how much they produce."]},{"term":"Training","unit":2,"topic":"2.4 Motivation and demotivation","hl":false,"p":["the process of developing an employee's skills, knowledge and abilities","so that they can perform their current or future job more effectively."]},{"term":"Wages","unit":2,"topic":"2.4 Motivation and demotivation","hl":false,"p":["payment to workers calculated from the hours they work or the units they produce,","typically paid weekly or fortnightly."]},{"term":"Handy's gods of management","unit":2,"topic":"2.5 Organizational (corporate) culture","hl":true,"p":["charles Handy's classification of organisational cultures into four types named after Greek gods:","Zeus (power), Apollo (role), Athena (task) and Dionysus (person)."]},{"term":"Organizational (corporate) culture","unit":2,"topic":"2.5 Organizational (corporate) culture","hl":true,"p":["the shared beliefs, values and behaviours of the people in an organisation,","which influence how decisions are made and how people act at work."]},{"term":"Person culture (Dionysus)","unit":2,"topic":"2.5 Organizational (corporate) culture","hl":true,"p":["a culture in which the organisation exists to serve the individuals within it,","who are usually experts working with a high degree of independence."]},{"term":"Power culture (Zeus)","unit":2,"topic":"2.5 Organizational (corporate) culture","hl":true,"p":["a culture in which power and decision making are concentrated in a single leader or a small inner circle at the centre,","with few rules and control exercised through personal influence."]},{"term":"Role culture (Apollo)","unit":2,"topic":"2.5 Organizational (corporate) culture","hl":true,"p":["a culture built on clearly defined roles, rules and procedures,","where authority comes from a person's position in the hierarchy."]},{"term":"Task culture (Athena)","unit":2,"topic":"2.5 Organizational (corporate) culture","hl":true,"p":["a culture focused on completing specific projects or solving problems","using flexible teams of experts whose influence comes from their expertise rather than their position."]},{"term":"Barriers to communication","unit":2,"topic":"2.6 Communication","hl":false,"p":["factors that block, distort or delay a message passing between sender and receiver","and so reduce the chance that it is understood as intended."]},{"term":"Bottom-up communication","unit":2,"topic":"2.6 Communication","hl":false,"p":["communication that flows upward from employees to managers,","passing on feedback, ideas and information from the front line."]},{"term":"Communication","unit":2,"topic":"2.6 Communication","hl":false,"p":["the process of exchanging information, ideas or instructions between a sender and a receiver","through a medium, with feedback confirming that the message has been understood."]},{"term":"Formal communication","unit":2,"topic":"2.6 Communication","hl":false,"p":["communication that passes along the official channels set out in the organisation's structure","and is usually documented."]},{"term":"Informal communication","unit":2,"topic":"2.6 Communication","hl":false,"p":["communication that takes place outside the official channels,","through casual conversation between employees at any level, and is not usually recorded."]},{"term":"Top-down communication","unit":2,"topic":"2.6 Communication","hl":false,"p":["communication that flows downward from senior managers to lower levels,","passing on instructions, decisions and information."]},{"term":"Arbitration","unit":2,"topic":"2.7 Industrial/employee relations","hl":true,"p":["a way of settling a dispute in which an independent third party examines both sides' cases and makes a decision","that the two sides are usually bound to accept."]},{"term":"Collective bargaining","unit":2,"topic":"2.7 Industrial/employee relations","hl":true,"p":["negotiation between employer representatives and employee representatives, usually a trade union,","to agree pay, hours and working conditions for a group of workers."]},{"term":"Conciliation","unit":2,"topic":"2.7 Industrial/employee relations","hl":true,"p":["a procedure in which an independent third party helps employers and employees reach agreement","by encouraging discussion and suggesting compromises, without imposing a decision."]},{"term":"Employee participation","unit":2,"topic":"2.7 Industrial/employee relations","hl":true,"p":["the involvement of workers in making decisions or shaping how the organisation operates,","ranging from being consulted to having a formal voice at board level."]},{"term":"Industrial action","unit":2,"topic":"2.7 Industrial/employee relations","hl":true,"p":["collective measures taken by employees to put pressure on their employer in a dispute","which disrupt or restrict normal production or service."]},{"term":"Industrial democracy","unit":2,"topic":"2.7 Industrial/employee relations","hl":true,"p":["a system that gives employees formal representation in how the business is governed,","so that decisions are shared with, rather than imposed on, the workforce."]},{"term":"Industrial relations","unit":2,"topic":"2.7 Industrial/employee relations","hl":true,"p":["the relationship between employers and employees or their representatives,","including how disputes, pay and working conditions are negotiated and resolved."]},{"term":"Lockout","unit":2,"topic":"2.7 Industrial/employee relations","hl":true,"p":["when an employer prevents employees from entering the workplace","to pressure them into accepting the employer's terms in a dispute."]},{"term":"No-strike agreement","unit":2,"topic":"2.7 Industrial/employee relations","hl":true,"p":["a clause in an agreement in which employees or their union promise not to take strike action for a set period,","usually in return for agreed pay or conditions."]},{"term":"Overtime ban","unit":2,"topic":"2.7 Industrial/employee relations","hl":true,"p":["employees refusing to work any hours beyond their contracted hours","while carrying on with their normal hours, to pressure the employer in a dispute."]},{"term":"Redundancy","unit":2,"topic":"2.7 Industrial/employee relations","hl":true,"p":["the loss of a job because the employer no longer needs the position,","not because of the employee's conduct or performance."]},{"term":"Single-union agreement","unit":2,"topic":"2.7 Industrial/employee relations","hl":true,"p":["an agreement in which an employer recognises only one trade union to represent all its employees","in negotiations over pay and conditions."]},{"term":"Strike action","unit":2,"topic":"2.7 Industrial/employee relations","hl":true,"p":["a collective refusal by employees to carry out their work","to pressure an employer over a dispute."]},{"term":"Trade union","unit":2,"topic":"2.7 Industrial/employee relations","hl":true,"p":["an organisation of workers formed to represent their collective interests","by negotiating with employers over pay, conditions and job security."]},{"term":"Work-to-rule","unit":2,"topic":"2.7 Industrial/employee relations","hl":true,"p":["employees carrying out only the duties set out in their contracts and following every rule strictly,","which slows output without a full strike."]},{"term":"Capital expenditure","unit":3,"topic":"3.1 Introduction to finance","hl":false,"p":["spending on buying or improving non-current assets","that will keep being useful for longer than twelve months."]},{"term":"Revenue expenditure","unit":3,"topic":"3.1 Introduction to finance","hl":false,"p":["spending on the everyday running costs of the business","which are used up within the current year, such as wages and utilities."]},{"term":"Business angel","unit":3,"topic":"3.2 Sources of finance","hl":false,"p":["a wealthy individual who invests their own money in a start-up or small business","in return for part ownership, and often offers advice and contacts as well."]},{"term":"Crowdfunding","unit":3,"topic":"3.2 Sources of finance","hl":false,"p":["raising finance by collecting small amounts of money from a large number of people","usually through an online platform."]},{"term":"External source of finance","unit":3,"topic":"3.2 Sources of finance","hl":false,"p":["funds obtained from parties outside the firm, such as lenders, investors or suppliers","rather than generated by the business itself."]},{"term":"Initial public offering (IPO)","unit":3,"topic":"3.2 Sources of finance","hl":false,"p":["the first time a company sells its shares to the general public on a stock exchange","which raises share capital and allows the shares to be traded."]},{"term":"Internal source of finance","unit":3,"topic":"3.2 Sources of finance","hl":false,"p":["money raised from within the business itself","such as the owner's savings, profits kept back or the sale of assets, so no outside party is involved."]},{"term":"Leasing","unit":3,"topic":"3.2 Sources of finance","hl":false,"p":["paying regular fees to use an asset for an agreed period","while the owner of the asset keeps ownership and the business avoids a large upfront purchase."]},{"term":"Loan capital","unit":3,"topic":"3.2 Sources of finance","hl":false,"p":["money borrowed from a lender such as a bank","which must be repaid with interest over an agreed period."]},{"term":"Long-term source of finance","unit":3,"topic":"3.2 Sources of finance","hl":false,"p":["funds that are repaid over a period longer than a year","and are mostly used to buy non-current assets or pay for expansion."]},{"term":"Microfinance provider","unit":3,"topic":"3.2 Sources of finance","hl":false,"p":["an organisation that gives very small loans and other financial services","to people and tiny businesses that cannot get finance from traditional banks."]},{"term":"Mortgage","unit":3,"topic":"3.2 Sources of finance","hl":false,"p":["a long-term loan used to buy property","where the property is held as security, so the lender can claim it if repayments are not made."]},{"term":"Overdraft","unit":3,"topic":"3.2 Sources of finance","hl":false,"p":["an arrangement with a bank that lets a business spend more than it has in its account","up to an agreed limit, with interest charged on the amount used."]},{"term":"Personal funds","unit":3,"topic":"3.2 Sources of finance","hl":false,"p":["the owner's own savings put into the business","which is the main starting source of finance for a sole trader."]},{"term":"Retained profit","unit":3,"topic":"3.2 Sources of finance","hl":false,"p":["profit after tax and dividends that the business keeps rather than pays out","so that it can be reinvested in the business."]},{"term":"Sale of assets","unit":3,"topic":"3.2 Sources of finance","hl":false,"p":["selling non-current assets the business no longer needs","to raise cash without having to borrow or find new investors."]},{"term":"Share capital","unit":3,"topic":"3.2 Sources of finance","hl":false,"p":["money raised by selling shares in the company","which gives buyers part ownership and a claim to dividends, and does not have to be repaid."]},{"term":"Short-term source of finance","unit":3,"topic":"3.2 Sources of finance","hl":false,"p":["money raised that is repaid within a year","and is mainly used to cover day-to-day costs and temporary shortages of cash."]},{"term":"Trade credit","unit":3,"topic":"3.2 Sources of finance","hl":false,"p":["an arrangement where a supplier delivers goods now","and allows the business to pay for them later, often after 30 to 90 days."]},{"term":"Venture capital","unit":3,"topic":"3.2 Sources of finance","hl":false,"p":["finance provided by specialist investors to new or fast-growing businesses with high risk and high potential","in exchange for a share of ownership in the business."]},{"term":"Direct costs","unit":3,"topic":"3.3 Costs and revenues","hl":false,"p":["costs that can be clearly linked to making a particular product or serving a particular cost centre","such as raw materials and the wages of production workers."]},{"term":"Fixed costs","unit":3,"topic":"3.3 Costs and revenues","hl":false,"p":["costs that stay the same in total","whatever the level of output, such as rent, in the short run."]},{"term":"Indirect costs (overheads)","unit":3,"topic":"3.3 Costs and revenues","hl":false,"p":["costs of running the whole business that cannot be traced to one product","so they are shared across the business, such as management salaries and insurance."]},{"term":"Revenue","unit":3,"topic":"3.3 Costs and revenues","hl":false,"p":["the income a business earns from selling its goods or services","before any costs are taken away."]},{"term":"Revenue stream","unit":3,"topic":"3.3 Costs and revenues","hl":false,"p":["a separate source of income for a business","such as a product line, a service, a subscription or advertising."]},{"term":"Total costs","unit":3,"topic":"3.3 Costs and revenues","hl":false,"p":["all the costs a business has when producing a given level of output","found by adding together its fixed costs and variable costs."]},{"term":"Total revenue","unit":3,"topic":"3.3 Costs and revenues","hl":false,"p":["the full sales income a business earns in a period","found by multiplying the selling price by the quantity sold."]},{"term":"Variable costs","unit":3,"topic":"3.3 Costs and revenues","hl":false,"p":["costs that change in total","in direct proportion to the level of output, such as raw materials."]},{"term":"Assets","unit":3,"topic":"3.4 Final accounts","hl":false,"p":["resources that a business owns or controls","which have a money value and are expected to bring benefits in the future."]},{"term":"Balance sheet (statement of financial position)","unit":3,"topic":"3.4 Final accounts","hl":false,"p":["a financial statement showing what a business owns, owes and is worth","on one particular date, which makes it a snapshot rather than a record over time."]},{"term":"Cost of sales","unit":3,"topic":"3.4 Final accounts","hl":false,"p":["the direct costs of producing the goods or services that were sold in a period","such as materials and production wages, taken from revenue to find gross profit."]},{"term":"Current assets","unit":3,"topic":"3.4 Final accounts","hl":false,"p":["cash and items the business expects to convert into cash or consume within twelve months","such as inventory and amounts owed by customers."]},{"term":"Current liabilities","unit":3,"topic":"3.4 Final accounts","hl":false,"p":["debts and other amounts the business owes","that must be paid within a year, such as overdrafts and money owed to suppliers."]},{"term":"Depreciation","unit":3,"topic":"3.4 Final accounts","hl":true,"p":["the fall in the value of a non-current asset over time","caused by wear, use or becoming out of date, and spread across its useful life as an expense."]},{"term":"Dividend","unit":3,"topic":"3.4 Final accounts","hl":false,"p":["a share of a company's profit that is paid out to its shareholders","usually in proportion to the number of shares each person owns."]},{"term":"Equity","unit":3,"topic":"3.4 Final accounts","hl":false,"p":["the part of the business that belongs to its owners","found by taking total liabilities away from total assets."]},{"term":"Final accounts","unit":3,"topic":"3.4 Final accounts","hl":false,"p":["the set of financial statements a business produces at the end of a period","which includes the profit and loss account and the balance sheet."]},{"term":"Gross profit","unit":3,"topic":"3.4 Final accounts","hl":false,"p":["the profit left after the cost of sales is taken away from revenue","before other expenses such as rent, wages and marketing are paid."]},{"term":"Intangible assets","unit":3,"topic":"3.4 Final accounts","hl":false,"p":["assets that have value to a business but have no physical form","such as patents, trademarks, copyright and goodwill."]},{"term":"Liabilities","unit":3,"topic":"3.4 Final accounts","hl":false,"p":["amounts a business owes to other people or organisations","which it will have to pay in cash or in goods and services in the future."]},{"term":"Net profit","unit":3,"topic":"3.4 Final accounts","hl":false,"p":["the profit left after all expenses, including overheads, interest and tax, are taken from revenue","which is the amount available to owners or to be kept in the business."]},{"term":"Non-current assets","unit":3,"topic":"3.4 Final accounts","hl":false,"p":["assets that the business plans to keep and use for more than a year","such as buildings, machinery and patents."]},{"term":"Non-current liabilities","unit":3,"topic":"3.4 Final accounts","hl":false,"p":["debts that the business does not have to repay for more than a year","such as long-term bank loans and mortgages."]},{"term":"Profit","unit":3,"topic":"3.4 Final accounts","hl":false,"p":["the surplus left when a business's total costs are taken away from its total revenue","which rewards owners for the risk of running the business."]},{"term":"Profit and loss account (statement of profit or loss)","unit":3,"topic":"3.4 Final accounts","hl":false,"p":["a financial statement setting out a business's revenue, costs and resulting profit","for a trading year or other set accounting period."]},{"term":"Retained profit (accounts)","unit":3,"topic":"3.4 Final accounts","hl":false,"p":["the total profit that has been kept in the business over its life","rather than paid out as dividends, shown in the equity section of the balance sheet."]},{"term":"Straight-line method of depreciation","unit":3,"topic":"3.4 Final accounts","hl":true,"p":["depreciation calculated by taking the same amount off an asset's value every year","found by dividing the cost minus the expected residual value by the asset's useful life."]},{"term":"Units of production method of depreciation","unit":3,"topic":"3.4 Final accounts","hl":true,"p":["depreciation calculated from how much an asset is used","so the cost minus residual value is shared across the total units it is expected to produce."]},{"term":"Acid test (quick) ratio","unit":3,"topic":"3.5 Profitability and liquidity ratio analysis","hl":false,"p":["a liquidity ratio that compares current assets, leaving out inventory, with current liabilities","to show whether a business can pay its short-term debts without having to sell its stock."]},{"term":"Capital employed","unit":3,"topic":"3.5 Profitability and liquidity ratio analysis","hl":false,"p":["the total long-term finance used to run a business","found by adding equity and non-current liabilities."]},{"term":"Current ratio","unit":3,"topic":"3.5 Profitability and liquidity ratio analysis","hl":false,"p":["a liquidity ratio that compares a business's current assets with its current liabilities","to show whether it can pay its short-term debts."]},{"term":"Gross profit margin","unit":3,"topic":"3.5 Profitability and liquidity ratio analysis","hl":false,"p":["gross profit shown as a percentage of revenue","which shows how much is made from each dollar of sales after the direct costs of making them."]},{"term":"Liquidity","unit":3,"topic":"3.5 Profitability and liquidity ratio analysis","hl":false,"p":["how easily an asset can be turned into cash without losing value","which decides whether a business can pay its short-term debts when they fall due."]},{"term":"Liquidity ratios","unit":3,"topic":"3.5 Profitability and liquidity ratio analysis","hl":false,"p":["ratios that compare a business's short-term assets with its short-term debts","to show whether it can meet payments as they fall due."]},{"term":"Profit margin","unit":3,"topic":"3.5 Profitability and liquidity ratio analysis","hl":false,"p":["net profit shown as a percentage of revenue","which shows how much profit is kept from each dollar of sales after all costs."]},{"term":"Profitability","unit":3,"topic":"3.5 Profitability and liquidity ratio analysis","hl":false,"p":["how successful a business is at earning profit","when compared with its sales or with the resources it has used."]},{"term":"Profitability ratios","unit":3,"topic":"3.5 Profitability and liquidity ratio analysis","hl":false,"p":["ratios that compare a business's profit with its sales or its capital","to show how well it turns its activity into profit."]},{"term":"Ratio analysis","unit":3,"topic":"3.5 Profitability and liquidity ratio analysis","hl":false,"p":["a method of comparing figures from the final accounts as ratios","so that performance can be judged over time or against competitors."]},{"term":"Return on capital employed (ROCE)","unit":3,"topic":"3.5 Profitability and liquidity ratio analysis","hl":false,"p":["operating profit, found before interest and tax are deducted, divided by capital employed and written as a percentage","which shows how well the finance invested in the business earns a profit."]},{"term":"Bankruptcy","unit":3,"topic":"3.6 Efficiency ratio analysis","hl":true,"p":["a legal process that a person or business enters when it can no longer pay its debts","in which a court oversees how assets are used to repay creditors."]},{"term":"Creditor days","unit":3,"topic":"3.6 Efficiency ratio analysis","hl":true,"p":["how many days, on average, a business takes to pay its suppliers","which shows how long it makes use of supplier credit before cash leaves the business."]},{"term":"Debtor days","unit":3,"topic":"3.6 Efficiency ratio analysis","hl":true,"p":["how many days, on average, customers take to settle what they owe the business","which shows how fast credit sales become cash."]},{"term":"Efficiency ratios","unit":3,"topic":"3.6 Efficiency ratio analysis","hl":true,"p":["ratios that show how well a business uses its resources","such as its stock, its borrowing, and the credit it gives and receives."]},{"term":"Gearing ratio","unit":3,"topic":"3.6 Efficiency ratio analysis","hl":true,"p":["the share of a firm's long-term finance that comes from borrowing","which shows how heavily it relies on debt instead of owners' funds."]},{"term":"Insolvency","unit":3,"topic":"3.6 Efficiency ratio analysis","hl":true,"p":["the position of being unable to pay debts on time","because liabilities exceed assets or there is too little cash available."]},{"term":"Stock turnover","unit":3,"topic":"3.6 Efficiency ratio analysis","hl":true,"p":["the number of times a business sells and replaces its average stock in a period","which shows how quickly inventory is moving."]},{"term":"Cash flow","unit":3,"topic":"3.7 Cash flow","hl":false,"p":["money coming into and going out of a business during an accounting period","which decides whether it can pay its bills when they are due."]},{"term":"Cash flow forecast","unit":3,"topic":"3.7 Cash flow","hl":false,"p":["a prediction of the cash a business expects to receive and pay out","over a future period, which shows the expected cash balance at the end of each period."]},{"term":"Cash inflows","unit":3,"topic":"3.7 Cash flow","hl":false,"p":["money received by a business","from sources such as sales, loans and investment."]},{"term":"Cash outflows","unit":3,"topic":"3.7 Cash flow","hl":false,"p":["money paid out by a business","for items such as wages, supplies, rent and loan repayments."]},{"term":"Closing balance","unit":3,"topic":"3.7 Cash flow","hl":false,"p":["the cash a business has at the end of a period","found by adding net cash flow to the opening balance."]},{"term":"Liquidity position","unit":3,"topic":"3.7 Cash flow","hl":false,"p":["how much cash and near-cash assets a business has available","compared with the short-term payments it has to make."]},{"term":"Net cash flow","unit":3,"topic":"3.7 Cash flow","hl":false,"p":["the difference between cash inflows and cash outflows in a period","which is positive when more cash comes in than goes out."]},{"term":"Opening balance","unit":3,"topic":"3.7 Cash flow","hl":false,"p":["the cash a business has at the start of a period","which is the same as the closing balance of the previous period."]},{"term":"Working capital","unit":3,"topic":"3.7 Cash flow","hl":false,"p":["the funds available for the business's day-to-day running","found by taking current liabilities away from current assets."]},{"term":"Average rate of return (ARR)","unit":3,"topic":"3.8 Investment appraisal","hl":false,"p":["the average annual profit from an investment divided by its initial cost and expressed as a percentage","which lets projects be compared with each other or with a target return."]},{"term":"Discount rate","unit":3,"topic":"3.8 Investment appraisal","hl":true,"p":["the interest rate used to convert future cash flows into their value today","which reflects the return the business could earn elsewhere and the risk involved."]},{"term":"Investment appraisal","unit":3,"topic":"3.8 Investment appraisal","hl":false,"p":["the use of quantitative and qualitative techniques to judge an investment project","to help a business decide whether to go ahead with it."]},{"term":"Net present value (NPV)","unit":3,"topic":"3.8 Investment appraisal","hl":true,"p":["the total of a project's future cash flows after they have been discounted to today's value","minus the initial cost, so a positive result suggests the project adds value."]},{"term":"Payback period","unit":3,"topic":"3.8 Investment appraisal","hl":false,"p":["the length of time it takes for a project's net cash inflows","to repay the money first invested in it."]},{"term":"Time value of money","unit":3,"topic":"3.8 Investment appraisal","hl":true,"p":["the idea that a sum of money is worth more now than the same sum in the future","because it can be invested to earn a return and inflation reduces its buying power."]},{"term":"Adverse variance","unit":3,"topic":"3.9 Budgets","hl":true,"p":["a difference between actual and budgeted figures that reduces profit","because costs are higher than planned or revenue is lower than planned."]},{"term":"Budget","unit":3,"topic":"3.9 Budgets","hl":true,"p":["a financial plan that sets out the income and spending expected for a future period","which is used to guide decisions and to measure actual results."]},{"term":"Cost centre","unit":3,"topic":"3.9 Budgets","hl":true,"p":["a part of a business, such as a department, where costs can be identified and recorded","but which does not earn revenue itself."]},{"term":"Favourable variance","unit":3,"topic":"3.9 Budgets","hl":true,"p":["a difference between actual and budgeted figures that increases profit","because costs are lower than planned or revenue is higher than planned."]},{"term":"Profit centre","unit":3,"topic":"3.9 Budgets","hl":true,"p":["a part of a business for which both costs and revenue can be identified","so that its profit or loss can be measured."]},{"term":"Variance","unit":3,"topic":"3.9 Budgets","hl":true,"p":["the difference between a budgeted figure and the actual figure","which is investigated to find out why results did not go to plan."]}];

function shuffle(a) { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
const clean = s => s.replace(/[,.;:]\s*$/, '');
function esc(s) { return s.replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]); }
function fullHTML(d) {
  const rest = [d.p[0].charAt(0).toUpperCase() + d.p[0].slice(1), ...d.p.slice(1)];
  return `<strong>${esc(d.term)}</strong>: ${rest.map(esc).join(' <span class="sep">|</span> ')}`;
}
// split a list of terms into boards of 3 (a leftover of 1 or 2 is spread over the last boards)
function chunk(list) {
  const n = Math.max(1, Math.floor(list.length / PER_BOARD));
  const out = Array.from({ length: n }, () => []);
  list.forEach((x, i) => out[i < n * PER_BOARD ? Math.floor(i / PER_BOARD) : n - 1 - (i - n * PER_BOARD) % n].push(x));
  return out;
}

// ---------- setup ----------
function topicsByUnit() {
  const m = new Map();
  for (const d of DEFS) {
    if (!m.has(d.unit)) m.set(d.unit, new Map());
    const t = m.get(d.unit); t.set(d.topic, (t.get(d.topic) || 0) + 1);
  }
  return [...m.entries()].sort((a, b) => a[0] - b[0]);
}
const HL_TOPICS = new Set([...new Set(DEFS.map(d => d.topic))].filter(t => DEFS.every(d => d.topic !== t || d.hl)));
// Picks are single terms, because some HL terms sit inside SL subtopics.
// A group (unit or subtopic) is "full" when every term is picked, "SL" when every SL term is picked and no HL one.
const isFull = g => g.every(d => state.picks.has(d));
const isSL = g => g.some(d => !d.hl) && g.every(d => state.picks.has(d) === !d.hl);
const pickAll = (g, on) => { for (const d of g) on ? state.picks.add(d) : state.picks.delete(d); };
state.level = {};   // per unit: 'SL' after Whole unit SL, so subtopics tapped after it add SL terms only
function chip(cls, html, onclick) {
  const b = document.createElement('button'); b.className = 'chip ' + cls; b.innerHTML = html;
  b.onclick = () => { onclick(); syncSetup(); }; return b;
}
function buildPicker() {
  const wrap = $('units'); wrap.innerHTML = '';
  for (const [u, topics] of topicsByUnit()) {
    const unit = DEFS.filter(d => d.unit === u), sl = unit.filter(d => !d.hl);
    const div = document.createElement('div'); div.className = 'unit'; div.dataset.u = u;
    div.innerHTML = `<h3>${esc(UNITS[u])}</h3><div class="wholes"></div><div class="chips" hidden></div>`;
    const wholes = div.querySelector('.wholes'), subs = div.querySelector('.chips');
    wholes.append(
      chip('whole sl', `Whole unit SL<span class="n">${sl.length}</span>`, () => {
        const on = isSL(unit); pickAll(unit, false); if (!on) pickAll(sl, true); state.level[u] = 'SL';
      }),
      chip('whole hl', `Whole unit HL<span class="n">${unit.length}</span>`, () => {
        pickAll(unit, !isFull(unit)); state.level[u] = 'HL';
      }));
    const fold = document.createElement('button'); fold.className = 'fold'; fold.setAttribute('aria-expanded', 'false');
    fold.innerHTML = 'Subtopics <span class="chev" aria-hidden="true">▾</span>';
    fold.onclick = () => { const open = subs.hidden; subs.hidden = !open; fold.setAttribute('aria-expanded', open); };
    wholes.append(fold);
    for (const t of [...topics.keys()].sort((a, b) => a.localeCompare(b, undefined, { numeric: true }))) {
      const g = unit.filter(d => d.topic === t);
      const b = chip('sub', `${esc(t)}${HL_TOPICS.has(t) ? '<span class="hl">HL</span>' : ''}<span class="n"></span>`, () => {
        if (isFull(g) || isSL(g)) return pickAll(g, false);
        pickAll(state.level[u] === 'SL' && g.some(d => !d.hl) ? g.filter(d => !d.hl) : g, true);
      });
      b._g = g; subs.append(b);
    }
    div._unit = unit; wrap.append(div);
  }
}
function syncSetup() {
  for (const div of $('units').querySelectorAll('.unit')) {
    const unit = div._unit;
    div.querySelector('.whole.hl').setAttribute('aria-pressed', isFull(unit));
    div.querySelector('.whole.sl').setAttribute('aria-pressed', isSL(unit) && !isFull(unit));
    for (const b of div.querySelectorAll('.chip.sub')) {
      const on = isFull(b._g) || isSL(b._g);
      b.setAttribute('aria-pressed', on);
      b.querySelector('.n').textContent = on ? b._g.filter(d => state.picks.has(d)).length : b._g.length;
    }
  }
  const picked = state.picks.size;
  $('picked').textContent = picked ? `${picked} term${picked === 1 ? '' : 's'} picked` : 'Pick a unit or some topics';
  $('start').disabled = picked === 0;
}
function renderSetup() {
  if (!$('units').firstChild) buildPicker();
  syncSetup();
  const seg = $('lengths'); seg.innerHTML = '';
  for (const L of LENGTHS) {
    const b = document.createElement('button'); b.textContent = L;
    b.setAttribute('aria-pressed', state.length === L);
    b.onclick = () => { state.length = L; renderSetup(); };
    seg.appendChild(b);
  }
}
function show(id) { for (const s of ['setup', 'play', 'end']) $(s).hidden = s !== id; window.scrollTo(0, 0); }

// items: [{d, extra}] ; extra terms fill a board but are not scored
function startRound(items) {
  state.boards = chunk(items); state.b = 0; state.score = 0; state.missed = [];
  state.scored = items.filter(x => !x.extra).length;
  show('play'); renderBoard();
}
$('start').onclick = () => {
  state.pool = DEFS.filter(d => state.picks.has(d));
  const list = shuffle(state.pool);
  const items = (state.length === 'All' ? list : list.slice(0, state.length)).map(d => ({ d }));
  startRound(padBoard(items));
};
// a board needs 3 terms: if too few were picked, borrow unscored ones from the same unit
function padBoard(items) {
  if (items.length >= PER_BOARD) return items;
  const units = new Set(items.map(x => x.d.unit)), have = new Set(items.map(x => x.d));
  const fill = shuffle(DEFS.filter(d => !have.has(d) && units.has(d.unit)));
  const out = items.slice();
  while (out.length < PER_BOARD && fill.length) out.push({ d: fill.pop(), extra: true });
  return shuffle(out);
}

// ---------- board ----------
function renderBoard() {
  const items = state.boards[state.b];
  state.frags = shuffle(items.flatMap((it, t) => it.d.p.map((p, part) => ({ t, part, text: clean(p) })))).map((f, id) => ({ ...f, id }));
  state.placed = {}; state.sel = null; state.locked = false;
  $('progress').textContent = `${state.b + 1} of ${state.boards.length}`;
  const topics = [...new Set(items.map(it => it.d.topic))];
  $('qtopic').textContent = topics.join(' · ');
  $('board').classList.remove('locked');
  $('check').hidden = false; $('next').hidden = true;
  $('terms').innerHTML = items.map((it, t) => `<div class="term" data-t="${t}"><h3>${esc(it.d.term)}</h3>${
    it.d.p.map((_, i) => `<button type="button" class="slot" data-slot="${t}-${i}" aria-label="${esc(it.d.term)}, piece ${i + 1}"></button>`).join('')
  }<p class="fix" hidden></p></div>`).join('');
  renderPieces();
}
function fragHTML(f) {
  return `<button type="button" class="frag" data-f="${f.id}"><span class="grip" aria-hidden="true">&#8942;&#8942;</span><span class="txt">${esc(f.text)}</span><span class="mark"></span></button>`;
}
const slotOf = fid => Object.keys(state.placed).find(k => state.placed[k] === fid);
function renderPieces() {
  document.querySelectorAll('#terms .slot').forEach(s => {
    const fid = state.placed[s.dataset.slot];
    s.innerHTML = fid === undefined ? '' : fragHTML(state.frags[fid]);
    s.classList.toggle('filled', fid !== undefined);
    s.classList.toggle('sel', state.sel === s.dataset.slot);
  });
  const loose = state.frags.filter(f => slotOf(f.id) === undefined);
  $('pool').innerHTML = loose.map(fragHTML).join('');
  if (typeof state.sel === 'number') document.querySelector(`.frag[data-f="${state.sel}"]`)?.classList.add('sel');
  $('left').textContent = loose.length ? `${loose.length} left` : '';
  $('score').textContent = `${state.score} right`;
  $('check').disabled = loose.length > 0 || state.locked;
}
// put piece fid into slot; whatever was there goes where fid came from
function place(fid, slot) {
  const from = slotOf(fid), occupant = state.placed[slot];
  if (from === slot) return;
  state.placed[slot] = fid;
  if (from !== undefined) { if (occupant !== undefined) state.placed[from] = occupant; else delete state.placed[from]; }
}
function unplace(fid) { const from = slotOf(fid); if (from !== undefined) delete state.placed[from]; }

// tap to select, tap to place (works in either order).
// Pointer taps on pieces are handled in endDrag; the click listener covers keyboard and taps on boxes and the pool.
let suppressClick = false, lastTap = { f: -1, t: 0 };
$('board').addEventListener('click', e => {
  if (state.locked) return;
  if (suppressClick) { suppressClick = false; return; }
  const f = e.target.closest('.frag');
  if (f && +f.dataset.f === lastTap.f && Date.now() - lastTap.t < 600) return; // already handled on pointerup
  tap(e.target);
});
function tap(target) {
  const fragEl = target.closest('.frag'), slotEl = target.closest('.slot');
  const sel = state.sel;
  if (fragEl) {
    const fid = +fragEl.dataset.f;
    const inSlot = slotEl ? slotEl.dataset.slot : null;
    if (typeof sel === 'string' && !inSlot) { place(fid, sel); state.sel = null; }
    else if (typeof sel === 'number' && sel !== fid && inSlot) { place(sel, inSlot); state.sel = null; }
    else if (typeof sel === 'number' && sel !== fid && !inSlot && slotOf(sel) !== undefined) {
      // a placed piece is selected and a loose one tapped: swap them
      place(fid, slotOf(sel)); state.sel = null;
    }
    else state.sel = sel === fid ? null : fid;
  } else if (slotEl) {
    const slot = slotEl.dataset.slot;
    if (typeof sel === 'number') { place(sel, slot); state.sel = null; }
    else state.sel = sel === slot ? null : slot;
  } else if (target.closest('.poolwrap') && typeof sel === 'number') {
    unplace(sel); state.sel = null;
  } else return;
  renderPieces();
}

// drag: mouse from anywhere on a piece, touch only from its grip (so the page still scrolls)
let drag = null;
$('board').addEventListener('pointerdown', e => {
  const fragEl = e.target.closest('.frag');
  if (!fragEl || state.locked || e.button > 0) return;
  if (e.pointerType !== 'mouse' && !e.target.closest('.grip')) return;
  drag = { fid: +fragEl.dataset.f, el: fragEl, x: e.clientX, y: e.clientY, id: e.pointerId, on: false, ghost: null, over: null };
  fragEl.setPointerCapture(e.pointerId);
});
function startDrag(e) {
  const r = drag.el.getBoundingClientRect();
  const g = drag.el.cloneNode(true); g.classList.add('ghost'); g.classList.remove('sel');
  g.style.width = r.width + 'px'; g.style.left = r.left + 'px'; g.style.top = r.top + 'px';
  drag.dx = e.clientX - r.left; drag.dy = e.clientY - r.top;
  document.body.appendChild(g);
  drag.ghost = g; drag.on = true; drag.el.classList.add('lifted');
  autoScroll();
}
function targetAt(x, y) {
  const el = document.elementFromPoint(x, y);
  if (!el) return null;
  return el.closest('.slot') || el.closest('.poolwrap');
}
document.addEventListener('pointermove', e => {
  if (!drag || e.pointerId !== drag.id) return;
  if (!drag.on) { if (Math.hypot(e.clientX - drag.x, e.clientY - drag.y) < 6) return; startDrag(e); }
  drag.lastY = e.clientY; drag.lastX = e.clientX;
  drag.ghost.style.left = (e.clientX - drag.dx) + 'px';
  drag.ghost.style.top = (e.clientY - drag.dy) + 'px';
  const t = targetAt(e.clientX, e.clientY);
  if (t !== drag.over) {
    drag.over?.classList.remove('over'); (t?.classList.contains('poolwrap') ? $('pool') : t)?.classList.add('over');
    $('pool').classList.toggle('over', !!t?.classList.contains('poolwrap'));
    drag.over = t;
  }
});
function endDrag(e, cancel) {
  if (!drag || e.pointerId !== drag.id) return;
  const d = drag; drag = null;
  if (!d.on) { if (!cancel) { lastTap = { f: d.fid, t: Date.now() }; tap(d.el); } return; }
  d.ghost.remove(); d.el.classList.remove('lifted');
  document.querySelectorAll('.over').forEach(x => x.classList.remove('over'));
  suppressClick = true; setTimeout(() => { suppressClick = false; }, 0);
  if (cancel) return renderPieces();
  const t = targetAt(e.clientX, e.clientY);
  if (t?.classList.contains('slot')) place(d.fid, t.dataset.slot);
  else if (t) unplace(d.fid);
  state.sel = null;
  renderPieces();
}
document.addEventListener('pointerup', e => endDrag(e, false));
document.addEventListener('pointercancel', e => endDrag(e, true));
// scroll the page while a piece is held near the top or bottom edge
function autoScroll() {
  if (!drag || !drag.on) return;
  const y = drag.lastY ?? drag.y, edge = 70;
  const v = y < edge ? -(edge - y) / 4 : y > innerHeight - edge ? (y - (innerHeight - edge)) / 4 : 0;
  if (v) window.scrollBy(0, v);
  requestAnimationFrame(autoScroll);
}

$('check').onclick = () => {
  const items = state.boards[state.b];
  state.locked = true; state.sel = null;
  renderPieces();
  $('board').classList.add('locked');
  items.forEach((it, t) => {
    let right = true;
    it.d.p.forEach((_, i) => {
      const slot = `${t}-${i}`, f = state.frags[state.placed[slot]];
      const ok = f.t === t && f.part === i;
      if (!ok) right = false;
      const el = document.querySelector(`.slot[data-slot="${slot}"] .frag`);
      el.classList.add(ok ? 'ok' : 'bad');
      el.querySelector('.mark').textContent = ok ? '✓' : '✗';
      el.querySelector('.mark').setAttribute('aria-label', ok ? 'Right' : 'Wrong');
    });
    const card = document.querySelector(`.term[data-t="${t}"]`);
    card.classList.add(right ? 'right' : 'wrong');
    if (!right) { const fx = card.querySelector('.fix'); fx.innerHTML = fullHTML(it.d); fx.hidden = false; }
    if (!it.extra) { if (right) state.score++; else state.missed.push(it.d); }
  });
  $('score').textContent = `${state.score} right`;
  $('check').hidden = true; $('next').hidden = false;
  $('next').textContent = state.b === state.boards.length - 1 ? 'See score' : 'Next';
  $('next').focus({ preventScroll: true });
};
$('next').onclick = () => {
  state.b++;
  if (state.b < state.boards.length) { renderBoard(); window.scrollTo(0, 0); } else renderEnd();
};

// ---------- end ----------
function renderEnd() {
  show('end');
  $('final').textContent = `${state.score} / ${state.scored}`;
  const m = state.missed;
  $('missedWrap').hidden = m.length === 0;
  $('retry').hidden = m.length === 0;
  $('missed').innerHTML = m.map(d => `<li>${fullHTML(d)}</li>`).join('');
}
// retry missed: if fewer than 3 were missed, other terms from the same topics fill the board (not scored)
$('retry').onclick = () => {
  startRound(padBoard(shuffle(state.missed).map(d => ({ d }))));
};
$('again').onclick = () => $('start').onclick();
$('change').onclick = () => { show('setup'); renderSetup(); };

renderSetup();
</script>
</body>
</html>
