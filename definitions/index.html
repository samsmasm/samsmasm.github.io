<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Definition Drill</title>
<meta name="description" content="Rebuild IB Business Management definitions piece by piece.">
<link rel="icon" href="/geocornsmall.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Fraunces:opsz,wght@9..144,500;9..144,700&display=swap" rel="stylesheet">
<style>
:root {
  --masthead: #1e2a4a; --masthead-ink: #fff; --masthead-sub: #c9d2ea;
  --amber: #f4a629; --amber-ink: #8a5a00; --amber-soft: #fdf0d8;
  --bg: #f7f6f2; --surface: #fffdf8; --surface-2: #efede6; --line: #e3e0d8;
  --ink: #1e2a4a; --muted: #5b6680; --bm: #1a3a7a;
  --ok: #18634f; --ok-soft: #d9eee6; --bad: #8a1c1c; --bad-soft: #f8e1e1;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink);
  font: 18px/1.5 'Atkinson Hyperlegible', -apple-system, 'Segoe UI', sans-serif; }
h1, h2, h3 { font-family: 'Fraunces', Georgia, serif; font-weight: 600; font-variant-numeric: lining-nums; margin: 0; }
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 3px solid var(--amber); outline-offset: 2px; }

header { background: var(--masthead); color: var(--masthead-ink); border-bottom: 4px solid var(--amber); }
.mast { max-width: 1100px; margin: 0 auto; padding: 12px 16px; display: flex; align-items: center; gap: 12px; }
.mast img { width: 48px; height: 48px; }
.mast h1 { font-size: 1.5rem; line-height: 1.1; }
.mast .sub { font-size: 0.72rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--masthead-sub); }
.mast a.home { margin-left: auto; color: var(--masthead-ink); font-size: 0.9rem; text-decoration: none; }
.mast a.home:hover { text-decoration: underline; }

main { max-width: 1100px; margin: 0 auto; padding: 20px 16px 40px; }
#setup, #end { max-width: 760px; }
.label { font-size: 0.75rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); margin: 0 0 8px; }
.lede { margin: 0 0 20px; color: var(--muted); }
section.block { margin-bottom: 24px; }

.btn { border-radius: 10px; padding: 12px 20px; min-height: 48px; border: 1px solid var(--line); background: var(--surface); }
.btn.primary { background: var(--masthead); color: #fff; border-color: var(--masthead); font-weight: 700; }
.btn:disabled { opacity: 0.45; cursor: default; }
.row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }

/* topic picker */
.unit { margin-bottom: 14px; }
.unit h3 { font-size: 1rem; color: var(--bm); margin-bottom: 8px; }
.chip { border-radius: 8px; padding: 10px 14px; min-height: 48px; border: 1px solid var(--line); background: var(--surface); text-align: left; }
.chip[aria-pressed="true"] { background: var(--bm); border-color: var(--bm); color: #fff; }
.chip .n { color: var(--muted); font-size: 0.85rem; margin-left: 6px; }
.chip[aria-pressed="true"] .n { color: var(--masthead-sub); }
.seg { display: flex; }
.seg button { border: 1px solid var(--line); background: var(--surface); padding: 10px 18px; min-height: 48px; min-width: 64px; margin-left: -1px; }
.seg button:first-child { border-radius: 10px 0 0 10px; margin-left: 0; }
.seg button:last-child { border-radius: 0 10px 10px 0; }
.seg button[aria-pressed="true"] { background: var(--masthead); border-color: var(--masthead); color: #fff; position: relative; }

/* board */
.top { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 4px; }
.top .score { font-weight: 700; }
.topic { color: var(--bm); margin: 0 0 14px; font-size: 0.9rem; }
.board { display: grid; gap: 20px; margin-bottom: 16px; }
@media (min-width: 900px) {
  .board { grid-template-columns: 1fr 1fr; align-items: start; }
  .poolwrap { position: sticky; top: 12px; }
}
.terms { display: flex; flex-direction: column; gap: 14px; }
.term { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px; }
.term h3 { font-size: 1.15rem; color: var(--bm); margin: 0 0 8px; }
.slot { display: block; width: 100%; min-height: 56px; border: 2px dashed var(--line); border-radius: 10px;
  background: var(--bg); margin-top: 8px; padding: 0; text-align: left; }
.slot:empty::after { content: ''; display: block; min-height: 52px; }
.slot.sel, .slot.over { border-color: var(--amber); background: var(--amber-soft); }
.slot.filled { border-style: solid; border-color: transparent; background: none; }
.fix { margin: 10px 0 0; font-size: 0.95rem; color: var(--ink); border-top: 1px solid var(--line); padding-top: 8px; }
.fix b { color: var(--ok); }
.term.right { border-color: var(--ok); }
.term.wrong { border-color: var(--bad); }

.poolwrap .label { display: flex; justify-content: space-between; }
.pool { display: flex; flex-direction: column; gap: 10px; min-height: 64px; border-radius: 12px; padding: 4px; }
.pool.over { background: var(--amber-soft); }
.pool:empty::after { content: 'All placed'; color: var(--muted); padding: 16px 8px; }

.frag { display: flex; width: 100%; align-items: stretch; gap: 0; text-align: left; background: #fff;
  border: 1px solid var(--line); border-radius: 10px; padding: 0; line-height: 1.4; user-select: none; -webkit-user-select: none; }
.frag .grip { flex: none; width: 34px; display: flex; align-items: center; justify-content: center; color: var(--muted);
  touch-action: none; cursor: grab; font-size: 1.1rem; border-right: 1px solid var(--line); border-radius: 10px 0 0 10px; background: var(--surface-2); }
.frag .txt { flex: 1; padding: 10px 12px; }
.frag .mark { flex: none; width: 30px; display: none; align-items: center; justify-content: center; font-weight: 700; }
.frag.sel { border-color: var(--amber); outline: 2px solid var(--amber); outline-offset: -2px; background: var(--amber-soft); }
.frag.lifted { opacity: 0.35; }
@media (pointer: fine) { .frag { cursor: grab; } }
.ghost { position: fixed; z-index: 50; pointer-events: none; margin: 0; border-color: var(--masthead); opacity: 0.95; }
.locked .frag { cursor: default; }
.locked .frag .grip { display: none; }
.locked .frag .mark { display: flex; }
.frag.ok { background: var(--ok-soft); border-color: var(--ok); }
.frag.ok .mark { color: var(--ok); }
.frag.bad { background: var(--bad-soft); border-color: var(--bad); }
.frag.bad .mark { color: var(--bad); }

/* end */
.big { font-family: 'Fraunces', Georgia, serif; font-size: 3rem; font-weight: 700; line-height: 1; margin: 4px 0 16px; }
.missed { list-style: none; padding: 0; margin: 0 0 20px; }
.missed li { border-top: 1px solid var(--line); padding: 12px 0; }
.missed li:last-child { border-bottom: 1px solid var(--line); }
.sep { color: var(--amber-ink); font-weight: 700; padding: 0 2px; }

footer { max-width: 1100px; margin: 0 auto; padding: 16px; font-size: 0.75rem; color: var(--muted); border-top: 1px solid var(--line); }
[hidden] { display: none !important; }
@media (max-width: 480px) {
  body { font-size: 17px; }
  .mast h1 { font-size: 1.25rem; }
  .mast img { width: 40px; height: 40px; }
}
</style>
</head>
<body>
<header>
  <div class="mast">
    <img src="/geocorn.png" alt="">
    <div><h1>Definition Drill</h1><div class="sub">IB Business Management</div></div>
    <a class="home" href="/">unisam.nz</a>
  </div>
</header>

<main>
  <div id="setup">
    <p class="lede">Three terms, six pieces. Put two pieces under each term, in order.</p>
    <section class="block">
      <p class="label">Topics</p>
      <div id="units"></div>
    </section>
    <section class="block">
      <p class="label">How many terms</p>
      <div class="seg" id="lengths"></div>
    </section>
    <button class="btn primary" id="start">Start</button>
  </div>

  <div id="play" hidden>
    <div class="top"><span class="label" id="progress"></span><span class="score" id="score"></span></div>
    <p class="topic" id="qtopic"></p>
    <div class="board" id="board">
      <div class="terms" id="terms"></div>
      <div class="poolwrap"><p class="label"><span>Pieces</span><span id="left"></span></p><div class="pool" id="pool"></div></div>
    </div>
    <div class="row"><button class="btn primary" id="check" disabled>Check</button><button class="btn primary" id="next" hidden>Next</button></div>
  </div>

  <div id="end" hidden>
    <p class="label">Score</p>
    <div class="big" id="final"></div>
    <div id="missedWrap">
      <h2 style="font-size:1.2rem;margin-bottom:8px">To go over</h2>
      <ul class="missed" id="missed"></ul>
    </div>
    <div class="row">
      <button class="btn primary" id="retry">Retry missed</button>
      <button class="btn" id="again">Play again</button>
      <button class="btn" id="change">Change topics</button>
    </div>
  </div>
</main>
<footer>Built by Sam G · found a problem? tell Sam.</footer>

<script>
// BEGIN DATA (generated by build.mjs from data/defs.json, do not edit by hand)
const UNITS = {"1":"Unit 1: Introduction to business management","2":"Unit 2: Human resource management","3":"Unit 3: Finance and accounts","4":"Unit 4: Marketing","5":"Unit 5: Operations management"};
const DEFS = [{"term":"Arbitration","unit":2,"topic":"2.7 Industrial/employee relations","hl":true,"p":["a way of settling a dispute in which an independent third party examines both sides' cases and makes a decision","that the two sides are usually bound to accept."]},{"term":"Collective bargaining","unit":2,"topic":"2.7 Industrial/employee relations","hl":true,"p":["negotiation between employer representatives and employee representatives, usually a trade union,","to agree pay, hours and working conditions for a group of workers."]},{"term":"Conciliation","unit":2,"topic":"2.7 Industrial/employee relations","hl":true,"p":["a procedure in which an independent third party helps employers and employees reach agreement","by encouraging discussion and suggesting compromises, without imposing a decision."]},{"term":"Employee participation","unit":2,"topic":"2.7 Industrial/employee relations","hl":true,"p":["the involvement of workers in making decisions or shaping how the organisation operates,","ranging from being consulted to having a formal voice at board level."]},{"term":"Industrial action","unit":2,"topic":"2.7 Industrial/employee relations","hl":true,"p":["collective measures taken by employees to put pressure on their employer in a dispute","which disrupt or restrict normal production or service."]},{"term":"Industrial democracy","unit":2,"topic":"2.7 Industrial/employee relations","hl":true,"p":["a system that gives employees formal representation in how the business is governed,","so that decisions are shared with, rather than imposed on, the workforce."]},{"term":"Industrial relations","unit":2,"topic":"2.7 Industrial/employee relations","hl":true,"p":["the relationship between employers and employees or their representatives,","including how disputes, pay and working conditions are negotiated and resolved."]},{"term":"Lockout","unit":2,"topic":"2.7 Industrial/employee relations","hl":true,"p":["when an employer prevents employees from entering the workplace","to pressure them into accepting the employer's terms in a dispute."]},{"term":"No-strike agreement","unit":2,"topic":"2.7 Industrial/employee relations","hl":true,"p":["a clause in an agreement in which employees or their union promise not to take strike action for a set period,","usually in return for agreed pay or conditions."]},{"term":"Overtime ban","unit":2,"topic":"2.7 Industrial/employee relations","hl":true,"p":["employees refusing to work any hours beyond their contracted hours","while carrying on with their normal hours, to pressure the employer in a dispute."]},{"term":"Redundancy","unit":2,"topic":"2.7 Industrial/employee relations","hl":true,"p":["the loss of a job because the employer no longer needs the position,","not because of the employee's conduct or performance."]},{"term":"Single-union agreement","unit":2,"topic":"2.7 Industrial/employee relations","hl":true,"p":["an agreement in which an employer recognises only one trade union to represent all its employees","in negotiations over pay and conditions."]},{"term":"Strike action","unit":2,"topic":"2.7 Industrial/employee relations","hl":true,"p":["a collective refusal by employees to carry out their work","to pressure an employer over a dispute."]},{"term":"Trade union","unit":2,"topic":"2.7 Industrial/employee relations","hl":true,"p":["an organisation of workers formed to represent their collective interests","by negotiating with employers over pay, conditions and job security."]},{"term":"Work-to-rule","unit":2,"topic":"2.7 Industrial/employee relations","hl":true,"p":["employees carrying out only the duties set out in their contracts and following every rule strictly,","which slows output without a full strike."]}];
// END DATA

const $ = id => document.getElementById(id);
const LENGTHS = [6, 12, 'All'];
const PER_BOARD = 3;
const state = {
  topics: new Set(), length: 6, pool: [],
  boards: [], b: 0, score: 0, scored: 0, missed: [],
  frags: [], placed: {}, sel: null, locked: false,
};

function shuffle(a) { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
const clean = s => s.replace(/[,.;:]\s*$/, '');
function esc(s) { return s.replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]); }
function fullHTML(d) {
  const rest = [d.p[0].charAt(0).toUpperCase() + d.p[0].slice(1), ...d.p.slice(1)];
  return `<strong>${esc(d.term)}</strong>: ${rest.map(esc).join(' <span class="sep">|</span> ')}`;
}
// split a list of terms into boards of 3 (a leftover of 1 or 2 is spread over the last boards)
function chunk(list) {
  const n = Math.max(1, Math.floor(list.length / PER_BOARD));
  const out = Array.from({ length: n }, () => []);
  list.forEach((x, i) => out[i < n * PER_BOARD ? Math.floor(i / PER_BOARD) : n - 1 - (i - n * PER_BOARD) % n].push(x));
  return out;
}

// ---------- setup ----------
function topicsByUnit() {
  const m = new Map();
  for (const d of DEFS) {
    if (!m.has(d.unit)) m.set(d.unit, new Map());
    const t = m.get(d.unit); t.set(d.topic, (t.get(d.topic) || 0) + 1);
  }
  return [...m.entries()].sort((a, b) => a[0] - b[0]);
}
function renderSetup() {
  const wrap = $('units'); wrap.innerHTML = '';
  for (const [u, topics] of topicsByUnit()) {
    const div = document.createElement('div'); div.className = 'unit';
    div.innerHTML = `<h3>${esc(UNITS[u])}</h3><div class="row"></div>`;
    for (const [t, n] of [...topics.entries()].sort((a, b) => a[0].localeCompare(b[0], undefined, { numeric: true }))) {
      const b = document.createElement('button'); b.className = 'chip';
      b.setAttribute('aria-pressed', state.topics.has(t));
      b.innerHTML = `${esc(t)}<span class="n">${n}</span>`;
      b.onclick = () => { state.topics.has(t) ? state.topics.delete(t) : state.topics.add(t); renderSetup(); };
      div.querySelector('.row').appendChild(b);
    }
    wrap.appendChild(div);
  }
  const seg = $('lengths'); seg.innerHTML = '';
  for (const L of LENGTHS) {
    const b = document.createElement('button'); b.textContent = L;
    b.setAttribute('aria-pressed', state.length === L);
    b.onclick = () => { state.length = L; renderSetup(); };
    seg.appendChild(b);
  }
  $('start').disabled = state.topics.size === 0;
}
function show(id) { for (const s of ['setup', 'play', 'end']) $(s).hidden = s !== id; window.scrollTo(0, 0); }

// items: [{d, extra}] ; extra terms fill a board but are not scored
function startRound(items) {
  state.boards = chunk(items); state.b = 0; state.score = 0; state.missed = [];
  state.scored = items.filter(x => !x.extra).length;
  show('play'); renderBoard();
}
$('start').onclick = () => {
  state.pool = DEFS.filter(d => state.topics.has(d.topic));
  const list = shuffle(state.pool);
  startRound((state.length === 'All' ? list : list.slice(0, state.length)).map(d => ({ d })));
};

// ---------- board ----------
function renderBoard() {
  const items = state.boards[state.b];
  state.frags = shuffle(items.flatMap((it, t) => it.d.p.map((p, part) => ({ t, part, text: clean(p) })))).map((f, id) => ({ ...f, id }));
  state.placed = {}; state.sel = null; state.locked = false;
  $('progress').textContent = `${state.b + 1} of ${state.boards.length}`;
  const topics = [...new Set(items.map(it => it.d.topic))];
  $('qtopic').textContent = topics.join(' · ');
  $('board').classList.remove('locked');
  $('check').hidden = false; $('next').hidden = true;
  $('terms').innerHTML = items.map((it, t) => `<div class="term" data-t="${t}"><h3>${esc(it.d.term)}</h3>${
    it.d.p.map((_, i) => `<button type="button" class="slot" data-slot="${t}-${i}" aria-label="${esc(it.d.term)}, piece ${i + 1}"></button>`).join('')
  }<p class="fix" hidden></p></div>`).join('');
  renderPieces();
}
function fragHTML(f) {
  return `<button type="button" class="frag" data-f="${f.id}"><span class="grip" aria-hidden="true">&#8942;&#8942;</span><span class="txt">${esc(f.text)}</span><span class="mark"></span></button>`;
}
const slotOf = fid => Object.keys(state.placed).find(k => state.placed[k] === fid);
function renderPieces() {
  document.querySelectorAll('#terms .slot').forEach(s => {
    const fid = state.placed[s.dataset.slot];
    s.innerHTML = fid === undefined ? '' : fragHTML(state.frags[fid]);
    s.classList.toggle('filled', fid !== undefined);
    s.classList.toggle('sel', state.sel === s.dataset.slot);
  });
  const loose = state.frags.filter(f => slotOf(f.id) === undefined);
  $('pool').innerHTML = loose.map(fragHTML).join('');
  if (typeof state.sel === 'number') document.querySelector(`.frag[data-f="${state.sel}"]`)?.classList.add('sel');
  $('left').textContent = loose.length ? `${loose.length} left` : '';
  $('score').textContent = `${state.score} right`;
  $('check').disabled = loose.length > 0 || state.locked;
}
// put piece fid into slot; whatever was there goes where fid came from
function place(fid, slot) {
  const from = slotOf(fid), occupant = state.placed[slot];
  if (from === slot) return;
  state.placed[slot] = fid;
  if (from !== undefined) { if (occupant !== undefined) state.placed[from] = occupant; else delete state.placed[from]; }
}
function unplace(fid) { const from = slotOf(fid); if (from !== undefined) delete state.placed[from]; }

// tap to select, tap to place (works in either order).
// Pointer taps on pieces are handled in endDrag; the click listener covers keyboard and taps on boxes and the pool.
let suppressClick = false, lastTap = { f: -1, t: 0 };
$('board').addEventListener('click', e => {
  if (state.locked) return;
  if (suppressClick) { suppressClick = false; return; }
  const f = e.target.closest('.frag');
  if (f && +f.dataset.f === lastTap.f && Date.now() - lastTap.t < 600) return; // already handled on pointerup
  tap(e.target);
});
function tap(target) {
  const fragEl = target.closest('.frag'), slotEl = target.closest('.slot');
  const sel = state.sel;
  if (fragEl) {
    const fid = +fragEl.dataset.f;
    const inSlot = slotEl ? slotEl.dataset.slot : null;
    if (typeof sel === 'string' && !inSlot) { place(fid, sel); state.sel = null; }
    else if (typeof sel === 'number' && sel !== fid && inSlot) { place(sel, inSlot); state.sel = null; }
    else if (typeof sel === 'number' && sel !== fid && !inSlot && slotOf(sel) !== undefined) {
      // a placed piece is selected and a loose one tapped: swap them
      place(fid, slotOf(sel)); state.sel = null;
    }
    else state.sel = sel === fid ? null : fid;
  } else if (slotEl) {
    const slot = slotEl.dataset.slot;
    if (typeof sel === 'number') { place(sel, slot); state.sel = null; }
    else state.sel = sel === slot ? null : slot;
  } else if (target.closest('.poolwrap') && typeof sel === 'number') {
    unplace(sel); state.sel = null;
  } else return;
  renderPieces();
}

// drag: mouse from anywhere on a piece, touch only from its grip (so the page still scrolls)
let drag = null;
$('board').addEventListener('pointerdown', e => {
  const fragEl = e.target.closest('.frag');
  if (!fragEl || state.locked || e.button > 0) return;
  if (e.pointerType !== 'mouse' && !e.target.closest('.grip')) return;
  drag = { fid: +fragEl.dataset.f, el: fragEl, x: e.clientX, y: e.clientY, id: e.pointerId, on: false, ghost: null, over: null };
  fragEl.setPointerCapture(e.pointerId);
});
function startDrag(e) {
  const r = drag.el.getBoundingClientRect();
  const g = drag.el.cloneNode(true); g.classList.add('ghost'); g.classList.remove('sel');
  g.style.width = r.width + 'px'; g.style.left = r.left + 'px'; g.style.top = r.top + 'px';
  drag.dx = e.clientX - r.left; drag.dy = e.clientY - r.top;
  document.body.appendChild(g);
  drag.ghost = g; drag.on = true; drag.el.classList.add('lifted');
  autoScroll();
}
function targetAt(x, y) {
  const el = document.elementFromPoint(x, y);
  if (!el) return null;
  return el.closest('.slot') || el.closest('.poolwrap');
}
document.addEventListener('pointermove', e => {
  if (!drag || e.pointerId !== drag.id) return;
  if (!drag.on) { if (Math.hypot(e.clientX - drag.x, e.clientY - drag.y) < 6) return; startDrag(e); }
  drag.lastY = e.clientY; drag.lastX = e.clientX;
  drag.ghost.style.left = (e.clientX - drag.dx) + 'px';
  drag.ghost.style.top = (e.clientY - drag.dy) + 'px';
  const t = targetAt(e.clientX, e.clientY);
  if (t !== drag.over) {
    drag.over?.classList.remove('over'); (t?.classList.contains('poolwrap') ? $('pool') : t)?.classList.add('over');
    $('pool').classList.toggle('over', !!t?.classList.contains('poolwrap'));
    drag.over = t;
  }
});
function endDrag(e, cancel) {
  if (!drag || e.pointerId !== drag.id) return;
  const d = drag; drag = null;
  if (!d.on) { if (!cancel) { lastTap = { f: d.fid, t: Date.now() }; tap(d.el); } return; }
  d.ghost.remove(); d.el.classList.remove('lifted');
  document.querySelectorAll('.over').forEach(x => x.classList.remove('over'));
  suppressClick = true; setTimeout(() => { suppressClick = false; }, 0);
  if (cancel) return renderPieces();
  const t = targetAt(e.clientX, e.clientY);
  if (t?.classList.contains('slot')) place(d.fid, t.dataset.slot);
  else if (t) unplace(d.fid);
  state.sel = null;
  renderPieces();
}
document.addEventListener('pointerup', e => endDrag(e, false));
document.addEventListener('pointercancel', e => endDrag(e, true));
// scroll the page while a piece is held near the top or bottom edge
function autoScroll() {
  if (!drag || !drag.on) return;
  const y = drag.lastY ?? drag.y, edge = 70;
  const v = y < edge ? -(edge - y) / 4 : y > innerHeight - edge ? (y - (innerHeight - edge)) / 4 : 0;
  if (v) window.scrollBy(0, v);
  requestAnimationFrame(autoScroll);
}

$('check').onclick = () => {
  const items = state.boards[state.b];
  state.locked = true; state.sel = null;
  renderPieces();
  $('board').classList.add('locked');
  items.forEach((it, t) => {
    let right = true;
    it.d.p.forEach((_, i) => {
      const slot = `${t}-${i}`, f = state.frags[state.placed[slot]];
      const ok = f.t === t && f.part === i;
      if (!ok) right = false;
      const el = document.querySelector(`.slot[data-slot="${slot}"] .frag`);
      el.classList.add(ok ? 'ok' : 'bad');
      el.querySelector('.mark').textContent = ok ? '✓' : '✗';
      el.querySelector('.mark').setAttribute('aria-label', ok ? 'Right' : 'Wrong');
    });
    const card = document.querySelector(`.term[data-t="${t}"]`);
    card.classList.add(right ? 'right' : 'wrong');
    if (!right) { const fx = card.querySelector('.fix'); fx.innerHTML = fullHTML(it.d); fx.hidden = false; }
    if (!it.extra) { if (right) state.score++; else state.missed.push(it.d); }
  });
  $('score').textContent = `${state.score} right`;
  $('check').hidden = true; $('next').hidden = false;
  $('next').textContent = state.b === state.boards.length - 1 ? 'See score' : 'Next';
  $('next').focus({ preventScroll: true });
};
$('next').onclick = () => {
  state.b++;
  if (state.b < state.boards.length) { renderBoard(); window.scrollTo(0, 0); } else renderEnd();
};

// ---------- end ----------
function renderEnd() {
  show('end');
  $('final').textContent = `${state.score} / ${state.scored}`;
  const m = state.missed;
  $('missedWrap').hidden = m.length === 0;
  $('retry').hidden = m.length === 0;
  $('missed').innerHTML = m.map(d => `<li>${fullHTML(d)}</li>`).join('');
}
// retry missed: if fewer than 3 were missed, other terms from the same topics fill the board (not scored)
$('retry').onclick = () => {
  const items = shuffle(state.missed).map(d => ({ d }));
  const others = shuffle(state.pool.filter(d => !state.missed.includes(d)));
  while (items.length < PER_BOARD && others.length) items.push({ d: others.pop(), extra: true });
  startRound(shuffle(items));
};
$('again').onclick = () => $('start').onclick();
$('change').onclick = () => { show('setup'); renderSetup(); };

// start with every topic picked when there is only one
if (new Set(DEFS.map(d => d.topic)).size === 1) state.topics.add(DEFS[0].topic);
renderSetup();
</script>
