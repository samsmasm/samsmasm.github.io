<style>
:root {
  --masthead: #1e2a4a; --masthead-ink: #fff; --masthead-sub: #c9d2ea;
  --amber: #f4a629; --amber-ink: #8a5a00; --amber-soft: #fdf0d8;

  --ink: #1e2a4a; --muted: #5b6680; --bm: #145c34;

}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink);
  font: 18px/1.5 'Atkinson Hyperlegible', -apple-system, 'Segoe UI', sans-serif; }
h1, h2, h3 { font-family: 'Fraunces', Georgia, serif; font-weight: 600; font-variant-numeric: lining-nums; margin: 0; }
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 3px solid var(--amber); outline-offset: 2px; }

header { background: var(--masthead); color: var(--masthead-ink); border-bottom: 4px solid var(--amber); }
.mast { max-width: 1100px; margin: 0 auto; padding: 12px 16px; display: flex; align-items: center; gap: 12px; }
.mast img { width: 48px; height: 48px; }
.mast h1 { font-size: 1.5rem; line-height: 1.1; }
.mast .sub { font-size: 0.72rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--masthead-sub); }
.mast nav { margin-left: auto; display: flex; gap: 16px; }
.mast nav a { color: var(--masthead-ink); font-size: 0.9rem; text-decoration: none; }
.mast nav a:hover { text-decoration: underline; }

main { max-width: 1100px; margin: 0 auto; padding: 20px 16px 40px; }
#setup, #end { max-width: 760px; }
.label { font-size: 0.75rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); margin: 0 0 8px; }
.lede { margin: 0 0 20px; color: var(--muted); }
section.block { margin-bottom: 24px; }

.btn { border-radius: 10px; padding: 12px 20px; min-height: 48px; border: 1px solid var(--line); background: var(--surface); }
.btn.primary { background: var(--masthead); color: #fff; border-color: var(--masthead); font-weight: 700; }
.btn:disabled { opacity: 0.45; cursor: default; }
.row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }

/* topic picker */
.unit { margin-bottom: 22px; }
.unit h3 { font-size: 1.1rem; color: var(--bm); margin-bottom: 8px; }
.wholes { display: grid; grid-template-columns: repeat(2, minmax(0, 220px)) auto; justify-content: start; gap: 8px; }
@media (max-width: 560px) { .wholes { grid-template-columns: 1fr 1fr; } .wholes .fold { grid-column: 1 / -1; justify-self: start; } .chip.whole { padding: 10px; white-space: nowrap; } }
.chips { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 8px; margin-top: 8px; }
.chip { border-radius: 8px; padding: 10px 14px; min-height: 48px; border: 1px solid var(--line); background: var(--surface); text-align: left;
  display: flex; align-items: center; gap: 8px; }
.chip.whole { font-weight: 700; }
.chip .hl { font-size: 0.72rem; letter-spacing: 0.08em; color: var(--amber-ink); font-weight: 700; }
.chip .n { color: var(--muted); font-size: 0.85rem; margin-left: auto; padding-left: 6px; }
.chip[aria-pressed="true"] { background: var(--bm); border-color: var(--bm); color: #fff; }
.chip[aria-pressed="true"] .hl { color: var(--amber); }
.chip[aria-pressed="true"] .n { color: var(--masthead-sub); }
.fold { border: 0; background: none; color: var(--bm); min-height: 48px; padding: 10px 6px; display: flex; align-items: center; gap: 6px; }
.fold .chev { display: inline-block; transition: transform 0.15s; }
.fold[aria-expanded="true"] .chev { transform: rotate(180deg); }
.picked { color: var(--muted); }
.seg { display: flex; }
.seg button { border: 1px solid var(--line); background: var(--surface); padding: 10px 18px; min-height: 48px; min-width: 64px; margin-left: -1px; }
.seg button:first-child { border-radius: 10px 0 0 10px; margin-left: 0; }
.seg button:last-child { border-radius: 0 10px 10px 0; }
.seg button[aria-pressed="true"] { background: var(--masthead); border-color: var(--masthead); color: #fff; position: relative; }

/* board */
.top { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 4px; }
.top .score { font-weight: 700; }
.topic { color: var(--bm); margin: 0 0 14px; font-size: 0.9rem; }
.board { display: grid; gap: 20px; margin-bottom: 16px; }
@media (min-width: 900px) {
  .board { grid-template-columns: 1fr 1fr; align-items: start; }
  .poolwrap { position: sticky; top: 12px; }
}
.terms { display: flex; flex-direction: column; gap: 14px; }
.term { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px; }
.term h3 { font-size: 1.15rem; color: var(--bm); margin: 0 0 8px; }
.slot { display: block; width: 100%; min-height: 56px; border: 2px dashed var(--line); border-radius: 10px;
  background: var(--bg); margin-top: 8px; padding: 0; text-align: left; }
.slot:empty::after { content: ''; display: block; min-height: 52px; }
.slot.sel, .slot.over { border-color: var(--amber); background: var(--amber-soft); }
.slot.filled { border-style: solid; border-color: transparent; background: none; }
.fix { margin: 10px 0 0; font-size: 0.95rem; color: var(--ink); border-top: 1px solid var(--line); padding-top: 8px; }
.fix b { color: var(--ok); }
.term.right { border-color: var(--ok); }
.term.wrong { border-color: var(--bad); }

.poolwrap .label { display: flex; justify-content: space-between; }
.pool { display: flex; flex-direction: column; gap: 10px; min-height: 64px; border-radius: 12px; padding: 4px; }
.pool.over { background: var(--amber-soft); }
.pool:empty::after { content: 'All placed'; color: var(--muted); padding: 16px 8px; }

.frag { display: flex; width: 100%; align-items: stretch; gap: 0; text-align: left; background: #fff;
  border: 1px solid var(--line); border-radius: 10px; padding: 0; line-height: 1.4; user-select: none; -webkit-user-select: none; }
.frag .grip { flex: none; width: 34px; display: flex; align-items: center; justify-content: center; color: var(--muted);
  touch-action: none; cursor: grab; font-size: 1.1rem; border-right: 1px solid var(--line); border-radius: 10px 0 0 10px; background: var(--surface-2); }
.frag .txt { flex: 1; padding: 10px 12px; }
.frag .mark { flex: none; width: 30px; display: none; align-items: center; justify-content: center; font-weight: 700; }
.frag.sel { border-color: var(--amber); outline: 2px solid var(--amber); outline-offset: -2px; background: var(--amber-soft); }
.frag.lifted { opacity: 0.35; }
@media (pointer: fine) { .frag { cursor: grab; } }
.ghost { position: fixed; z-index: 50; pointer-events: none; margin: 0; border-color: var(--masthead); opacity: 0.95; }
.locked .frag { cursor: default; }
.locked .frag .grip { display: none; }
.locked .frag .mark { display: flex; }
.frag.ok { background: var(--ok-soft); border-color: var(--ok); }
.frag.ok .mark { color: var(--ok); }
.frag.bad { background: var(--bad-soft); border-color: var(--bad); }
.frag.bad .mark { color: var(--bad); }

/* end */
.big { font-family: 'Fraunces', Georgia, serif; font-size: 3rem; font-weight: 700; line-height: 1; margin: 4px 0 16px; }
.missed { list-style: none; padding: 0; margin: 0 0 20px; }
.missed li { border-top: 1px solid var(--line); padding: 12px 0; }
.missed li:last-child { border-bottom: 1px solid var(--line); }
.sep { color: var(--amber-ink); font-weight: 700; padding: 0 2px; }
/* review again: per-student saved terms */
.head { display: flex; align-items: flex-start; gap: 8px; margin: 0 0 8px; }
.head h3 { margin: 0; flex: 1; }
.again { flex: none; border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 4px 10px; min-height: 36px;
  font-size: 0.82rem; color: var(--muted); white-space: nowrap; }
.again[aria-pressed="true"] { background: var(--amber-soft); border-color: var(--amber); color: var(--amber-ink); font-weight: 700; }
.missed li .again { margin-top: 6px; }
.againchips { display: flex; flex-wrap: wrap; gap: 8px; }
.againchips .chip { min-width: 150px; }
#againList { margin-top: 10px; }
.rev { display: inline-block; font-family: 'Atkinson Hyperlegible', sans-serif; font-size: 0.72rem; font-weight: 400; letter-spacing: 0.04em;
  color: var(--amber-ink); background: var(--amber-soft); border-radius: 4px; padding: 1px 6px; margin-left: 6px; vertical-align: middle; }

footer { max-width: 1100px; margin: 0 auto; padding: 16px; font-size: 0.75rem; color: var(--muted); border-top: 1px solid var(--line); }
[hidden] { display: none !important; }
@media (max-width: 480px) {
  body { font-size: 17px; }
  .mast h1 { font-size: 1.25rem; }
  .mast img { width: 40px; height: 40px; }
}
</style>

  </div>

<main>

    <section class="block">

      <div id="units"></div>
    </section>
    <section class="block">

      <div class="seg" id="lengths"></div>

    <div class="row"><button class="btn primary" id="start">Start</button><span class="picked" id="picked"></span></div>

  <div id="play" hidden>
    <div class="top"><span class="label" id="progress"></span><span class="score" id="score"></span></div>
    <p class="topic" id="qtopic"></p>
    <div class="board" id="board">
      <div class="terms" id="terms"></div>
      <div class="poolwrap"><p class="label"><span>Pieces</span><span id="left"></span></p><div class="pool" id="pool"></div></div>
    </div>
    <div class="row"><button class="btn primary" id="check" disabled>Check</button><button class="btn primary" id="next" hidden>Next</button></div>
  </div>

  <div id="end" hidden>
    <p class="label">Score</p>
    <div class="big" id="final"></div>
    <div id="missedWrap">
      <h2 style="font-size:1.2rem;margin-bottom:8px">To go over</h2>
      <ul class="missed" id="missed"></ul>
    </div>
    <div class="row">
      <button class="btn primary" id="retry">Retry missed</button>
      <button class="btn" id="again">Play again</button>
      <button class="btn" id="change">Change topics</button>
    </div>
  </div>
</main>
<footer>Built by Sam G · found a problem? tell Sam.</footer>

 and groups."]},{"term":"Experimental economics","unit":1,"topic":"1.2 How do economists approach the world?","hl":false,"p":["the testing of theories about economic behaviour","by running experiments on people in a laboratory or in real life."]},{"term":"Homo economicus","unit":1,"topic":"1.2 How do economists approach the world?","hl":false,"p":["the model of a person who is fully rational","and always acts to maximise their own utility."]},{"term":"Hypothesis","unit":1,"topic":"1.2 How do economists approach the world?","hl":false,"p":["a testable statement about how economic variables are related,","which is then checked against evidence."],"review":true},{"term":"Invisible hand","unit":1,"topic":"1.2 How do economists approach the world?","hl":false,"p":["the idea, from Adam Smith, that people pursuing their own self-interest in free markets","end up allocating resources in a way that benefits society as a whole."]},{"term":"Keynesian economics","unit":1,"topic":"1.2 How do economists approach the world?","hl":false,"p":["the school of thought that an economy can settle below full employment,","so the government should manage aggregate demand to fix this."]},{"term":"Keynesian revolution","unit":1,"topic":"1.2 How do economists approach the world?","hl":false,"p":["the shift in economic thinking led by John Maynard Keynes away from laissez faire,","arguing that governments should actively manage aggregate demand."]},{"term":"Laissez faire","unit":1,"topic":"1.2 How do economists approach the world?","hl":false,"p":["the view that markets work best when left alone,","with as little government intervention as possible."]},{"term":"Linear economy","unit":1,"topic":"1.2 How do economists approach the world?","hl":false,"p":["an economic system in which raw materials are turned into products,","which people use once and then throw away as waste."]},{"term":"Marginal utility","unit":1,"topic":"1.2 How do economists approach the world?","hl":false,"p":["the change in ic":"1.2 How do economists approach the world?","hl":false,"p":["economic statements based on facts","that can be tested and proved true or false using evidence."]},{"term":"Randomised control trials","unit":1,"topic":"1.2 How do economists approach the world?","hl":false,"p":["experiments that randomly split people into a group that gets a treatment and a control group that does not,","then compare the results to measure the effect."]},{"term":"Say's Law","unit":1,"topic":"1.2 How do economists approach the world?","hl":false,"p":["the idea that supply creates its own demand,","because producing goods generates the incomes needed to buy them."]},{"term":"Scientific method","unit":1,"topic":"1.2 How do economists approach the world?","hl":false,"p":["a way of building theories by forming a hypothesis from observed data","and testing it against new evidence."]},{"term":"Utility","unit":1,"topic":"1.2 How do economists approach the world?","hl":false,"p":["the satisfaction or benefit a consumer gets","from consuming goods and services."]},{"term":"Value judgement","unit":1,"topic":"1.2 How do economists approach the world?","hl":false,"p":["an opinion about what is good or bad, or what should happen,","based on personal beliefs rather than facts."],"review":true},{"term":"Close complements","unit":2,"topic":"2.1 Demand","hl":false,"p":["goods that are normally used together,","so that one is hardly useful on its own."]},{"term":"Close substitutes","unit":2,"topic":"2.1 Demand","hl":false,"p":["goods that are so alike in what they do","that consumers readily swap one for the other."]},{"term":"Complements","unit":2,"topic":"2.1 Demand","hl":false,"p":["goods that consumers use together,","so when one gets dearer, demand for the other falls."]},{"term":"Demand","unit":2,"topic":"2.1 Demand","hl":false,"p":["the quantity of a good or service that consumers are willing and able to buy","at each price in a given period."]},{"term":"Demand curve","unit":2,"topic":"2.1 Demand","hl":false,"p":["a line on a graph linking each price to the amount consumers would buy,","which usually slopes down from left to right."]},{"term":"Demand schedule","unit":2,"topic":"2.1 Demand","hl":false,"p":["a table listing the quantity demanded","at each of a range of prices."]},{"term":"Determinants of demand","unit":2,"topic":"2.1 Demand","hl":false,"p":["the factors that affect how much of a good consumers demand, apart from its own price,","which cause the demand curve to shift."]},{"term":"Disposable income","unit":2,"topic":"2.1 Demand","hl":false,"p":["the income left after direct taxes have been paid,","which people can spend or save."]},{"term":"Effective demand","unit":2,"topic":"2.1 Demand","hl":false,"p":["demand for a good that is backed by the ability to pay,","not just the wish to buy it."]},{"term":"Income effect","unit":2,"topic":"2.1 Demand","hl":true,"p":["the change in quantity demanded caused by a price change","altering how much consumers' income can buy."]},{"term":"Inferior goods","unit":2,"topic":"2.1 Demand","hl":false,"p":["goods for which demand falls","when consumers' incomes rise."]},{"term":"Law of demand","unit":2,"topic":"2.1 Demand","hl":false,"p":["the rule that when a good's price falls, quantity demanded rises,","and when its price rises, quantity demanded falls, ceteris paribus."]},{"term":"Law of diminishing marginal utility","unit":2,"topic":"2.1 Demand","hl":true,"p":["the rule that as a consumer has more units of a good,","the extra satisfaction from each additional unit falls."]},{"term":"Luxury good","unit":2,"topic":"2.1 Demand","hl":false,"p":["a normal good for which demand rises by a larger percentage than income,","so it has an income elasticity of demand greater than one."],"review":true},{"term":"Market demand","unit":2,"topic":"2.1 Demand","hl":false,"p":["the total demand for a good from all consumers in a market,","found by adding up individual demand at each price."]},{"term":"Non-price determinants of demand","unit":2,"topic":"2.1 Demand","hl":false,"p":["the influences on demand apart from the good's own price,","which shift the demand curve left or right."]},{"term":"Normal goods","unit":2,"topic":"2.1 Demand","hl":false,"p":["goods for which demand rises","when consumers' incomes rise."]},{"term":"Price expectations","unit":2,"topic":"2.1 Demand","hl":false,"p":["what consumers believe will happen to prices in the future,","which affects how much they demand now."]},{"term":"Quantity demanded","unit":2,"topic":"2.1 Demand","hl":false,"p":["how much of a good consumers are willing and able to buy","at one particular price in a given period."]},{"term":"Remote complements","unit":2,"topic":"2.1 Demand","hl":false,"p":["goods that people sometimes buy together","but can easily use separately."]},{"term":"Remote substitutes","unit":2,"topic":"2.1 Demand","hl":false,"p":["goods that can replace each other only to a limited degree,","so consumers do not switch between them easily."]},{"term":"Substitutes","unit":2,"topic":"2.1 Demand","hl":false,"p":["goods that consumers can use instead of one another,","so when one gets dearer, demand for the other rises."]},{"term":"Substitution effect","unit":2,"topic":"2.1 Demand","hl":true,"p":["the change in quantity demanded caused by a change in a good's price relative to other goods,","as consumers switch towards whichever good is now relatively cheaper."]},{"term":"Superior goods","unit":2,"topic":"2.1 Demand","hl":false,"p":["normal goods for which demand rises by a bigger percentage than income,","giving an income elasticity of demand above one."]},{"term":"Tastes","unit":2,"topic":"2.1 Demand","hl":false,"p":["consumers' personal preferences for goods and services,","which affect how much they demand."]},{"term":"Total utility","unit":2,"topic":"2.1 Demand","hl":true,"p":["the overall satisfaction a consumer gets","from consuming a given quantity of a good."]},{"term":"Average product","unit":2,"topic":"2.2 Supply","hl":true,"p":["total output divided by how many units of the variable factor are used,","giving the output for each unit of that factor."]},{"term":"By-product","unit":2,"topic":"2.2 Supply","hl":false,"p":["a second product that comes out of a production process","whose main purpose is to make something else."]},{"term":"Competitive supply","unit":2,"topic":"2.2 Supply","hl":false,"p":["when two goods can be made with the same resources,","so a firm that makes more of one has to make less of the other."]},{"term":"Effective supply","unit":2,"topic":"2.2 Supply","hl":false,"p":["the amount that producers really offer for sale at each price,","because they have the means to produce it."]},{"term":"Indirect taxes","unit":2,"topic":"2.2 Supply","hl":false,"p":["taxes on spending","that are added to the price of goods and services."]},{"term":"Individual supply","unit":2,"topic":"2.2 Supply","hl":false,"p":["how much of a product one firm would offer for sale","at each possible price."]},{"term":"Innovation","unit":2,"topic":"2.2 Supply","hl":false,"p":["turning a new idea into a better product","or a better way of producing."]},{"term":"Joint supply","unit":2,"topic":"2.2 Supply","hl":false,"p":["when two goods come from the same production process,","so making more of one automatically means making more of the other."]},{"term":"Law of diminishing marginal returns","unit":2,"topic":"2.2 Supply","hl":true,"p":["the idea that as more of a variable factor is added to a fixed factor,","each extra unit eventually adds less to output than the one before."]},{"term":"Law of supply","unit":2,"topic":"2.2 Supply","hl":false,"p":["the idea that when price rises,","producers offer a larger quantity for sale, ceteris paribus."]},{"term":"Marginal costs","unit":2,"topic":"2.2 Supply","hl":false,"p":["the rise in total cost","from producing one extra unit."]},{"term":"Marginal product","unit":2,"topic":"2.2 Supply","hl":true,"p":["the change in total output","when the firm adds one extra unit of a variable factor, usually labour."]},{"term":"Marginal returns","unit":2,"topic":"2.2 Supply","hl":true,"p":["the change in output","when one more unit of an input is added while others stay fixed."]},{"term":"Market supply","unit":2,"topic":"2.2 Supply","hl":false,"p":["the total supply of a product from all the firms in a market,","found by adding up what each firm offers at each price."]},{"term":"Non-price determinants of supply","unit":2,"topic":"2.2 Supply","hl":false,"p":["the factors apart from a good's own price that affect how much firms supply,","which shift the whole supply curve."]},{"term":"Productivity","unit":2,"topic":"2.2 Supply","hl":false,"p":["the amount of output produced","from each unit of input."]},{"term":"Quantity supplied","unit":2,"topic":"2.2 Supply","hl":false,"p":["the quantity of a good or service that producers are willing and able to sell","at one particular price."]},{"term":"Subsidies","unit":2,"topic":"2.2 Supply","hl":false,"p":["payments by the state to producers,","often a set amount per unit, to encourage output."]},{"term":"Supply","unit":2,"topic":"2.2 Supply","hl":false,"p":["the quantity of a good or service that producers are willing and able to sell","at each price in a given period."]},{"term":"Supply curve","unit":2,"topic":"2.2 Supply","hl":false,"p":["a line on a graph linking each price to the amount producers would sell,","which usually slopes up from left to right."]},{"term":"Supply schedule","unit":2,"topic":"2.2 Supply","hl":false,"p":["a table listing the quantity supplied","at each of a range of prices."]},{"term":"Total product","unit":2,"topic":"2.2 Supply","hl":true,"p":["the whole amount of output a firm makes","using all of its variable and fixed factors."]},{"term":"Allocative efficiency","unit":2,"topic":"2.3 Competitive market equilibrium","hl":false,"p":["the output at which marginal social benefit equals marginal social cost,","so resources make the mix of goods society values most."]},{"term":"Allocative inefficiency","unit":2,"topic":"2.3 Competitive market equilibrium","hl":false,"p":["a situation where marginal social benefit and marginal social cost are not equal,","so society gets too much or too little of a good."]},{"term":"Competition","unit":2,"topic":"2.3 Competitive market equilibrium","hl":false,"p":["rivalry between many buyers and sellers acting on their own,","so that no single seller can control the price."]},{"term":"Consumer surplus","unit":2,"topic":"2.3 Competitive market equilibrium","hl":false,"p":["the gain to buyers from paying less than the most they would have paid,","shown as the area under the demand curve and above the price."]},{"term":"Disequilibrium","unit":2,"topic":"2.3 Competitive market equilibrium","hl":false,"p":["a situation where the amounts buyers want and sellers offer differ,","leaving a surplus or a shortage."]},{"term":"Equilibrium","unit":2,"topic":"2.3 Competitive market equilibrium","hl":false,"p":["a state of balance in which nothing tends to change","unless an outside force disturbs it."]},{"term":"Equilibrium price","unit":2,"topic":"2.3 Competitive market equilibrium","hl":false,"p":["the price at which the amount buyers want equals the amount sellers offer,","so the market clears with no surplus or shortage."]},{"term":"Equilibrium quantity","unit":2,"topic":"2.3 Competitive market equilibrium","hl":false,"p":["the amount bought and sold","at the price where buyers want exactly what sellers offer."]},{"term":"Excess demand","unit":2,"topic":"2.3 Competitive market equilibrium","hl":false,"p":["when buyers want more of a good than sellers offer,","because the price is below its equilibrium level."]},{"term":"Excess supply","unit":2,"topic":"2.3 Competitive market equilibrium","hl":false,"p":["when sellers offer more of a good than buyers want,","because the price is above its equilibrium level."]},{"term":"Incentive effect","unit":2,"topic":"2.3 Competitive market equilibrium","hl":false,"p":["the role of prices in motivating firms,","as a higher price encourages them to supply more and a lower price to supply less."]},{"term":"Marginal private benefits","unit":2,"topic":"2.3 Competitive market equilibrium","hl":false,"p":["the extra benefit a consumer gets","from one more unit consumed."],"review":true},{"term":"Marginal private costs","unit":2,"topic":"2.3 Competitive market equilibrium","hl":false,"p":["the extra cost to a producer","of making an additional unit."],"review":true},{"term":"Market disequilibrium","unit":2,"topic":"2.3 Competitive market equilibrium","hl":false,"p":["when the market price is above or below equilibrium,","so the amount demanded does not match the amount supplied."]},{"term":"Market equilibrium","unit":2,"topic":"2.3 Competitive market equilibrium","hl":false,"p":["the point where demand and supply curves cross,","so buyers want exactly the amount sellers offer."]},{"term":"Market forces","unit":2,"topic":"2.3 Competitive market equilibrium","hl":false,"p":["the pressures of demand and supply","that push prices and quantities towards equilibrium."]},{"term":"Market mechanism","unit":2,"topic":"2.3 Competitive market equilibrium","hl":false,"p":["the system in which demand and supply set prices,","which then decide how resources are allocated."]},{"term":"Market price","unit":2,"topic":"2.3 Competitive market equilibrium","hl":false,"p":["the price that a product is currently selling for in a market."],"review":true},{"term":"Misallocation of resources","unit":2,"topic":"2.3 Competitive market equilibrium","hl":false,"p":["when resources are not used where society values them most,","so too much of some goods and too little of others is produced."]},{"term":"Pareto optimality","unit":2,"topic":"2.3 Competitive market equilibrium","hl":false,"p":["an allocation of resources where any change that helps one person","would harm someone else."]},{"term":"Price mechanism","unit":2,"topic":"2.3 Competitive market equilibrium","hl":false,"p":["the way changes in prices, set by demand and supply,","send signals and incentives that decide how resources are allocated."]},{"term":"Producer surplus","unit":2,"topic":"2.3 Competitive market equilibrium","hl":false,"p":["the gain to sellers from getting more than the least they would have accepted,","shown as the area above the supply curve and below the price."]},{"term":"Rationing","unit":2,"topic":"2.3 Competitive market equilibrium","hl":false,"p":["a deliberate limit on how much of a scarce good","each person is allowed to have."]},{"term":"Rationing function","unit":2,"topic":"2.3 Competitive market equilibrium","hl":false,"p":["the role of prices in sharing out scarce goods","among those who can and will pay, deciding 'for whom' to produce."]},{"term":"Shortage","unit":2,"topic":"2.3 Competitive market equilibrium","hl":false,"p":["when the amount buyers want at the current price is more than the amount on offer,","because the price is set below equilibrium."]},{"term":"Signalling effect","unit":2,"topic":"2.3 Competitive market equilibrium","hl":false,"p":["the role of prices in passing information to buyers and sellers,","as a rising price tells firms to make more and consumers to buy less."]},{"term":"Social/community surplus","unit":2,"topic":"2.3 Competitive market equilibrium","hl":false,"p":["consumer surplus plus producer surplus,","which is largest at the competitive equilibrium."]},{"term":"Surplus","unit":2,"topic":"2.3 Competitive market equilibrium","hl":false,"p":["when the amount on offer at the current price is more than the amount buyers want,","because the price is set above equilibrium."]},{"term":"Anchoring","unit":2,"topic":"2.4 Critique of the maximizing behaviour of consumers and producers","hl":true,"p":["a bias where people lean too heavily on a starting number or idea","and judge later choices against it."]},{"term":"Availability heuristic","unit":2,"topic":"2.4 Critique of the maximizing behaviour of consumers and  two kinds of thinking,","one fast and automatic and the other slow and deliberate."]},{"term":"Environmental, social and governance (ESG) policies","unit":2,"topic":"2.4 Critique of the maximizing behaviour of consumers and producers","hl":true,"p":["policies that firms adopt to improve their impact on the environment and society","and how well they are run."]},{"term":"Framing","unit":2,"topic":"2.4 Critique of the maximizing behaviour of consumers and producers","hl":true,"p":["when the way a choice is described or presented","changes the decision people make."]},{"term":"Heuristic","unit":2,"topic":"2.4 Critique of the maximizing behaviour of consumers and producers","hl":true,"p":["a mental shortcut that people use to solve a problem or make a choice quickly,","reaching an answer that is good enough rather than the best."]},{"term":"Hyperbolic discounting","unit":2,"topic":"2.4 Critique of the maximizing behaviour of consumers and producers","hl":true,"p":["the tendency to prefer a smaller reward now over a bigger one later,","even when waiting would leave people better off."]},{"term":"Imperfect information","unit":2,"topic":"2.4 Critique of the maximizing behaviour of consumers and producers","hl":true,"p":["when buyers or sellers do not have full knowledge about what is being traded,","or one side knows more than the other."]},{"term":"Mandated choices","unit":2,"topic":"2.4 Critique of the maximizing behaviour of consumers and producers","hl":true,"p":["when people are forced to make an active decision","instead of having an option chosen for them by default."]},{"term":"Market share","unit":2,"topic":"2.4 Critique of the maximizing behaviour of consumers and producers","hl":true,"p":["the percentage of total sales in a market","that is made by one firm."]},{"term":"Mental models","unit":2,"topic":"2.4 Critique of the maximizing behaviour of consumers and producers","hl":true,"p":["the beliefs, assumptions and values that shape how people see the world","and so affect the choices they make."]},{"term":"Nudge theory","unit":2,"topic":"2.4 Critique of the maximizing behaviour of consumers and producers","hl":true,"p":["the idea that small changes to how choices are presented","can steer people towards better decisions without taking options away."]},{"term":"Perfect information","unit":2,"topic":"2.4 Critique of the maximizing behaviour of consumers and producers","hl":true,"p":["when all buyers and sellers have the same, full knowledge","about the prices and quality of what is being traded."]},{"term":"Profit maximisation","unit":2,"topic":"2.4 Critique of the maximizing behaviour of consumers and producers","hl":true,"p":["choosing the output that gives a firm its biggest possible profit,","which is where marginal cost equals marginal revenue."]},{"term":"Profit motive","unit":2,"topic":"2.4 Critique of the maximizing behaviour of consumers and producers","hl":true,"p":["the drive to earn the highest possible profit,","which economics assumes is the main goal of every firm."]},{"term":"Rational behaviour","unit":2,"topic":"2.4 Critique of the maximizing behaviour of consumers and producers","hl":true,"p":["making choices that give the greatest benefit to the decision-maker,","so consumers maximise utility and firms maximise profit."]},{"term":"Restricted choices","unit":2,"topic":"2.4 Critique of the maximizing behaviour of consumers and producers","hl":true,"p":["when the range of options open to people is limited","but they can still choose among the ones that remain."]},{"term":"Revenue maximisation","unit":2,"topic":"2.4 Critique of the maximizing behaviour of consumers and producers","hl":true,"p":["producing the output at which total revenue is highest,","which is where marginal revenue is zero."],"review":true},{"term":"Rules of thumb","unit":2,"topic":"2.4 Critique of the maximizing behaviour of consumers and producers","hl":true,"p":["simple, practical guides people follow to decide quickly,","which are usually good enough but not always right."]},{"term":"Satisficing","unit":2,"topic":"2.4 Critique of the maximizing behaviour of consumers and producers","hl":true,"p":["aiming for an outcome that is good enough","instead of trying to get the best possible outcome."]},{"term":"Social conformity","unit":2,"topic":"2.4 Critique of the maximizing behaviour of consumers and producers","hl":true,"p":["when people follow what others around them do or what society expects,","which shapes the choices they make."]},{"term":"(Price) elastic demand","unit":2,"topic":"2.5 Elasticity of demand","hl":false,"p":["when quantity demanded changes by a larger percentage than price does,","so PED is greater than one."]},{"term":"(Price) inelastic demand","unit":2,"topic":"2.5 Elasticity of demand","hl":false,"p":["when quantity demanded changes by a smaller percentage than price does,","so PED is less than one."]},{"term":"Commodity","unit":2,"topic":"2.5 Elasticity of demand","hl":false,"p":["a basic good, often a raw material,","that is traded in bulk and used as an input to make other goods."]},{"term":"Deindustrialisation","unit":2,"topic":"2.5 Elasticity of demand","hl":false,"p":["a fall in manufacturing's share","of a country's output and jobs."]},{"term":"Elasticity","unit":2,"topic":"2.5 Elasticity of demand","hl":false,"p":["a measure of how strongly one variable responds","when another variable that affects it changes."]},{"term":"Elasticity of demand","unit":2,"topic":"2.5 Elasticity of demand","hl":false,"p":["a measure of how strongly demand for a product reacts","when its price, people's incomes or the price of another good changes."]},{"term":"Engel curve","unit":2,"topic":"2.5 Elasticity of demand","hl":false,"p":["a graph showing how much of a good people buy","at different levels of income."]},{"term":"Income elastic demand","unit":2,"topic":"2.5 Elasticity of demand","hl":false,"p":["when quantity demanded changes by a larger percentage than income does,","so YED is greater than one."]},{"term":"Income elasticity of demand (YED)","unit":2,"topic":"2.5 Elasticity of demand","hl":false,"p":["a measure of how strongly demand for a product responds","to a change in people's income."]},{"term":"Income inelastic demand","unit":2,"topic":"2.5 Elasticity of demand","hl":false,"p":["when quantity demanded changes by a smaller percentage than income does,","so YED is between zero and one."]},{"term":"Industrialisation","unit":2,"topic":"2.5 Elasticity of demand","hl":false,"p":["the growth of manufacturing in an economy,","as people and resources move out of farming into factories and cities."]},{"term":"Manufactured goods","unit":2,"topic":"2.5 Elasticity of demand","hl":false,"p":["physical goods that are made by turning raw materials","into new products through a production process."]},{"term":"Necessity goods","unit":2,"topic":"2.5 Elasticity of demand","hl":false,"p":["normal goods whose demand rises as income rises,","but by a smaller percentage than income, so YED is between zero and one."]},{"term":"Perfectly elastic demand","unit":2,"topic":"2.5 Elasticity of demand","hl":false,"p":["when any rise in price makes quantity demanded fall to zero,","so PED is infinite and the demand curve is horizontal."]},{"term":"Perfectly income inelastic demand","unit":2,"topic":"2.5 Elasticity of demand","hl":false,"p":["when quantity demanded stays the same whatever happens to income,","so YED is zero."]},{"term":"Perfectly inelastic demand","unit":2,"topic":"2.5 Elasticity of demand","hl":false,"p":["when quantity demanded stays the same whatever happens to price,","so PED is zero and the demand curve is vertical."]},{"term":"Price elasticity of demand (PED)","unit":2,"topic":"2.5 Elasticity of demand","hl":false,"p":["a measure of how strongly quantity demanded responds","when the product's own price changes."]},{"term":"Price volatility","unit":2,"topic":"2.5 Elasticity of demand","hl":false,"p":["how often and how sharply a product's price","goes up and down over time."],"review":true},{"term":"Primary commodities","unit":2,"topic":"2.5 Elasticity of demand","hl":false,"p":["raw materials and food products","that come straight from the primary sector without being processed."]},{"term":"Primary sector","unit":2,"topic":"2.5 Elasticity of demand","hl":false,"p":["the part of the economy that takes natural resources from the earth,","through farming, fishing, forestry and mining."]},{"term":"Secondary sector","unit":2,"topic":"2.5 Elasticity of demand","hl":false,"p":["the industries that make physical goods","through manufacturing and construction."]},{"term":"Sectoral change","unit":2,"topic":"2.5 Elasticity of demand","hl":false,"p":["a shift in an economy's output and employment","from one of the primary, secondary and tertiary sectors to another."]},{"term":"Service sector","unit":2,"topic":"2.5 Elasticity of demand","hl":false,"p":["the industries that produce services for people and firms","instead of making physical goods."]},{"term":"Structural change","unit":2,"topic":"2.5 Elasticity of demand","hl":false,"p":["a large shift in what an economy produces,","as production moves from some industries to others."]},{"term":"Tertiary sector","unit":2,"topic":"2.5 Elasticity of demand","hl":false,"p":["the part of the economy that provides services","rather than physical goods."]},{"term":"Total revenue","unit":2,"topic":"2.5 Elasticity of demand","hl":false,"p":["all the money a firm takes in from its sales,","found by multiplying price by quantity sold."]},{"term":"Unitary elastic demand","unit":2,"topic":"2.5 Elasticity of demand","hl":false,"p":["when quantity demanded changes by the same percentage as price does,","so PED is equal to one."]},{"term":"(Price) elastic supply","unit":2,"topic":"2.6 Elasticity of supply","hl":false,"p":["when quantity supplied changes by a larger percentage than price does,","so PES is greater than one."]},{"term":"(Price) inelastic supply","unit":2,"topic":"2.6 Elasticity of supply","hl":false,"p":["when quantity supplied changes by a smaller percentage than price does,","so PES is less than one."]},{"term":"Perfect resource mobility","unit":2,"topic":"2.6 Elasticity of supply","hl":false,"p":["when factors of production can move freely and at no cost","between different uses and places."],"review":true},{"term":"Perfectly elastic supply","unit":2,"topic":"2.6 Elasticity of supply","hl":false,"p":["when producers will supply any amount at one price but nothing below it,","so PES is infinite and the supply curve is horizontal."]},{"term":"Perfectly inelastic supply","unit":2,"topic":"2.6 Elasticity of supply","hl":false,"p":["when quantity supplied stays the same whatever happens to price,","so PES is zero and supply is drawn as a vertical line."]},{"term":"Price elasticity of supply (PES)","unit":2,"topic":"2.6 Elasticity of supply","hl":false,"p":["a measure of how strongly quantity supplied responds","when the product's own price changes."]},{"term":"Unitary elastic supply","unit":2,"topic":"2.6 Elasticity of supply","hl":false,"p":["when quantity supplied changes by the same percentage as price does,","so PES is equal to one."]},{"term":"Ad valorem tax","unit":2,"topic":"2.7 Role of government in microeconomics","hl":false,"p":["an indirect tax charged as a percentage of a product's price,","so the tax per unit rises as the price rises."]},{"term":"Black market","unit":2,"topic":"2.7 Role of government in microeconomics","hl":false,"p":["an illegal market where goods are bought and sold in secret,","often to get round price controls or taxes."]},{"term":"Consumer nudges","unit":2,"topic":"2.7 Role of government in microeconomics","hl":true,"p":["small prompts or changes in how choices are presented","that steer consumers towards better decisions without limiting their options."]},{"term":"Direct provision","unit":2,"topic":"2.7 Role of government in microeconomics","hl":false,"p":["when the government supplies a good or service itself,","paying for it out of tax revenue."],"review":true},{"term":"Excise taxes","unit":2,"topic":"2.7 Role of government in microeconomics","hl":false,"p":["indirect taxes placed on specific goods,","usually to reduce how much of them people consume."]},{"term":"Goods and services tax (GST)","unit":2,"topic":"2.7 Role of government in microeconomics","hl":false,"p":["a tax added to the price of most things people buy,","charged on the value added at each stage of production."]},{"term":"Legislation","unit":2,"topic":"2.7 Role of government in microeconomics","hl":false,"p":["laws made by a parliament or government","that people and firms must obey."]},{"term":"Living wage","unit":2,"topic":"2.7 Role of government in microeconomics","hl":false,"p":["pay that is high enough for a worker","to afford a reasonable quality of life."]},{"term":"Minimum wage","unit":2,"topic":"2.7 Role of government in microeconomics","hl":false,"p":["the lowest wage that employers are allowed by law to pay,","which the government sets above the market equilibrium wage."]},{"term":"Non-price rationing","unit":2,"topic":"2.7 Role of government in microeconomics","hl":false,"p":["sharing out a product that is in short supply","without using price to decide who gets it."]},{"term":"Percentage tax","unit":2,"topic":"2.7 Role of government in microeconomics","hl":false,"p":["an indirect tax worked out as a share of the product's price","rather than a set sum per unit."]},{"term":"Price ceiling (maximum price)","unit":2,"topic":"2.7 Role of government in microeconomics","hl":false,"p":["a legal upper limit on a price,","set below the market equilibrium price."]},{"term":"Price controls","unit":2,"topic":"2.7 Role of government in microeconomics","hl":false,"p":["legal limits that the government places on prices,","either above or below the market equilibrium price."]},{"term":"Price floor (minimum price)","unit":2,"topic":"2.7 Role of government in microeconomics","hl":false,"p":["a legal lower limit on a price,","set above the market equilibrium price."]},{"term":"Price gouging","unit":2,"topic":"2.7 Role of government in microeconomics","hl":false,"p":["charging much higher prices than normal","to profit from a sudden surge in demand during a crisis."]},{"term":"Queuing","unit":2,"topic":"2.7 Role of government in microeconomics","hl":false,"p":["sharing out goods in short supply by order of arrival,","so those prepared to wait longest in line get them."],"review":true},{"term":"Regulation","unit":2,"topic":"2.7 Role of government in microeconomics","hl":false,"p":["rules set by the government or its agencies","that control how firms and markets operate."]},{"term":"Specific tax","unit":2,"topic":"2.7 Role of government in microeconomics","hl":false,"p":["an indirect tax of a fixed amount","charged on each unit sold."]},{"term":"Stakeholder","unit":2,"topic":"2.7 Role of government in microeconomics","hl":false,"p":["a person or group who is affected by an economic activity","or has an interest in how it turns out."]},{"term":"Tax incidence","unit":2,"topic":"2.7 Role of government in microeconomics","hl":false,"p":["how the burden of a tax is shared","between consumers and producers."]},{"term":"Value added tax (VAT)","unit":2,"topic":"2.7 Role of government in microeconomics","hl":false,"p":["an indirect tax on consumer spending,","collected on the value a firm adds at each stage of production."]},{"term":"Biocapacity","unit":2,"topic":"2.8 Market failure: externalities and common pool or common access resources","hl":false,"p":["the ability of the earth's land and sea","to produce renewable resources and absorb the waste people create."]},{"term":"Biodiversity","unit":2,"topic":"2.8 Market failure: externalities and common pool or common access resources","hl":false,"p":["the number and variety of living species","found in a habitat, a region or the whole planet."]},{"term":"Carbon tax","unit":2,"topic":"2.8 Market failure: externalities and common pool or common access resources","hl":false,"p":["a tax on fuels based on how much carbon they contain,","used to cut carbon dioxide emissions."]},{"term":"Coase theorem","unit":2,"topic":"2.8 Market failure: externalities and common pool or common access resources","hl":false,"p":["the idea that if property rights are clearly assigned and bargaining costs nothing,","the parties to an externality can negotiate an efficient outcome, whoever holds the rights."]},{"term":"Collective self-governance","unit":2,"topic":"2.8 Market failure: externalities and common pool or common access resources","hl":false,"p":["when the users of a shared resource","agree and enforce their own rules to manage it sustainably."]},{"term":"Common access resources","unit":2,"topic":"2.8 Market failure: externalities and common pool or common access resources","hl":false,"p":["natural resources that are open to everyone and so non-excludable,","but rivalrous because one person's use leaves less for others."]},{"term":"Demerit goods","unit":2,"topic":"2.8 Market failure: externalities and common pool or common access resources","hl":false,"p":["goods that do harm to those who consume them,","so a free market leads to too much being consumed."]},{"term":"Ecological Footprint (EF)","unit":2,"topic":"2.8 Market failure: externalities and common pool or common access resources","hl":false,"p":["a measure of the land and sea area needed","to supply what a population consumes and absorb its waste."]},{"term":"Excludable","unit":2,"topic":"2.8 Market failure: externalities and common pool or common access resources","hl":false,"p":["when people can be stopped from using a good or service,","if they have not paid for it."]},{"term":"Externalities","unit":2,"topic":"2.8 Market failure: externalities and common pool or common access resources","hl":false,"p":["costs or benefits of producing or consuming a good","that fall on third parties who are not part of the trade."]},{"term":"Greenhouse gas","unit":2,"topic":"2.8 Market failure: externalities and common pool or common access resources","hl":false,"p":["any gas that traps heat in the atmosphere","and so adds to global warming."]},{"term":"Inefficiency","unit":2,"topic":"2.8 Market failure: externalities and common pool or common access resources","hl":false,"p":["when resources are wasted or not put to their best use,","so output or welfare is lower than it could be."]},{"term":"Marginal social benefit (MSB)","unit":2,"topic":"2.8 Market failure: externalities and common pool or common access resources","hl":false,"p":["the additional benefit that society gains when one more unit is consumed,","made up of the private benefit plus any external benefit."]},{"term":"Marginal social cost (MSC)","unit":2,"topic":"2.8 Market failure: externalities and common pool or common access resources","hl":false,"p":["the additional cost that society bears when one more unit is produced,","made up of the private cost plus any external cost."]},{"term":"Market failure","unit":2,"topic":"2.8 Market failure: externalities and common pool or common access resources","hl":false,"p":["when a free market fails to allocate resources efficiently,","so too much or too little of a good gets made."]},{"term":"Merit goods","unit":2,"topic":"2.8 Market failure: externalities and common pool or common access resources","hl":false,"p":["goods that are good for the people who use them","but are under-consumed when left to the market."]},{"term":"Negative externalities of consumption","unit":2,"topic":"2.8 Market failure: externalities and common pool or common access resources","hl":false,"p":["harmful effects on third parties","caused by people consuming a product."]},{"term":"Negative externalities of production","unit":2,"topic":"2.8 Market failure: externalities and common pool or common access resources","hl":false,"p":["harmful effects on third parties","caused by firms producing a good or service."]},{"term":"Negative externality","unit":2,"topic":"2.8 Market failure: externalities and common pool or common access resources","hl":false,"p":["a cost imposed on third parties by producing or consuming a good","that they are not compensated for."]},{"term":"Non-excludable","unit":2,"topic":"2.8 Market failure: externalities and common pool or common access resources","hl":false,"p":["when people cannot be stopped from using a good or service,","even if they do not pay for it."]},{"term":"Pigouvian taxes","unit":2,"topic":"2.8 Market failure: externalities and common pool or common access resources","hl":false,"p":["indirect taxes placed on goods that create negative externalities,","set to make producers or consumers pay the external cost."]},{"term":"Porter hypothesis","unit":2,"topic":"2.8 Market failure: externalities and common pool or common access resources","hl":false,"p":["the idea that strict environmental regulation","can push firms to innovate and become more efficient and competitive."]},{"term":"Positive externalities","unit":2,"topic":"2.8 Market failure: externalities and common pool or common access resources","hl":false,"p":["a benefit to third parties from producing or consuming a good","that they do not pay for."]},{"term":"Positive externalities of consumption","unit":2,"topic":"2.8 Market failure: externalities and common pool or common access resources","hl":false,"p":["benefits to third parties","caused by people consuming a product."]},{"term":"Positive externalities of production","unit":2,"topic":"2.8 Market failure: externalities and common pool or common access resources","hl":false,"p":["benefits to third parties","caused by firms producing a good or service."]},{"term":"Property rights","unit":2,"topic":"2.8 Market failure: externalities and common pool or common access resources","hl":false,"p":["the legal ownership of a resource,","including the right to control its use and keep others out."]},{"term":"Rivalrous","unit":2,"topic":"2.8 Market failure: externalities and common pool or common access resources","hl":false,"p":["when one person's use of a good","leaves less of it for others to use."]},{"term":"Socially optimum output","unit":2,"topic":"2.8 Market failure: externalities and common pool or common access resources","hl":false,"p":["the quantity where marginal social benefit equals marginal social cost,","which makes community surplus as large as possible."]},{"term":"Tradable permits","unit":2,"topic":"2.8 Market failure: externalities and common pool or common access resources","hl":false,"p":["permits to pollute, with the total capped by the government,","that firms can buy and sell."]},{"term":"Tragedy of commons","unit":2,"topic":"2.8 Market failure: externalities and common pool or common access resources","hl":false,"p":["when people use a common access resource in their own interest,","so together they overuse and deplete it."]},{"term":"Unsustainable","unit":2,"topic":"2.8 Market failure: externalities and common pool or common access resources","hl":false,"p":["using natural resources faster than nature can renew them,","so less is left for future generations."]},{"term":"Welfare loss","unit":2,"topic":"2.8 Market failure: externalities and common pool or common access resources","hl":false,"p":["a fall in community surplus","that happens when output is not at the allocatively efficient level."]},{"term":"Club goods","unit":2,"topic":"2.9 Market failure: public goods","hl":false,"p":["goods that people can be stopped from using unless they pay,","but where one person's use does not reduce what is left for others."]},{"term":"Contracting out","unit":2,"topic":"2.9 Market failure: public goods","hl":false,"p":["when the government pays a private firm","to provide a good or service on its behalf."],"review":true},{"term":"Free rider problem","unit":2,"topic":"2.9 Market failure: public goods","hl":false,"p":["when people can benefit from a good without paying for it,","so the market under-provides it or does not provide it at all."]},{"term":"Non-rivalrous","unit":2,"topic":"2.9 Market failure: public goods","hl":false,"p":["when one person's use of a good","does not reduce how much is left for others."]},{"term":"Private goods","unit":2,"topic":"2.9 Market failure: public goods","hl":false,"p":["goods that are rivalrous, so one person's use leaves less for others,","and excludable, so people who do not pay can be kept out."]},{"term":"Public goods","unit":2,"topic":"2.9 Market failure: public goods","hl":false,"p":["goods that are non-rivalrous and non-excludable,","so the free market will not provide them."]},{"term":"Public/private partnerships","unit":2,"topic":"2.9 Market failure: public goods","hl":false,"p":["agreements between the government and private firms","to fund, build or run a project or service together."]},{"term":"Quasi-public goods","unit":2,"topic":"2.9 Market failure: public goods","hl":false,"p":["goods that are only partly non-rivalrous or non-excludable,","so they share only some features of public goods."]},{"term":"Adverse selection","unit":2,"topic":"2.10 Market failure: asymmetric information","hl":true,"p":["a problem where one side holds information the other side lacks before a deal is agreed,","so the deal is made on unequal terms."]},{"term":"Asymmetric information","unit":2,"topic":"2.10 Market failure: asymmetric information","hl":true,"p":["when the buyer and seller in a deal do not know the same things,","so one of them is better informed than the other."]},{"term":"Moral hazard","unit":2,"topic":"2.10 Market failure: asymmetric information","hl":true,"p":["when someone takes more risks after a deal is made","because someone else will bear the cost of those risks."]},{"term":"Principal-agent problem","unit":2,"topic":"2.10 Market failure: asymmetric information","hl":true,"p":["the conflict that arises when people hired to act for an owner","follow their own goals rather than the owner's."]},{"term":"Screening","unit":2,"topic":"2.10 Market failure: asymmetric information","hl":true,"p":["the steps the less-informed side of a deal takes to learn more about the other side,","which reduces asymmetric information and so reduces adverse selection."]},{"term":"Signalling","unit":2,"topic":"2.10 Market failure: asymmetric information","hl":true,"p":["when the better-informed side of a deal shows the other side useful information about itself,","reducing asymmetric information and adverse selection."]},{"term":"Warranties","unit":2,"topic":"2.10 Market failure: asymmetric information","hl":true,"p":["a seller's promise to repair or replace a product","if it fails within a set time after purchase."]},{"term":"Abnormal profit","unit":2,"topic":"2.11 Market failure: market power","hl":true,"p":["the amount by which total revenue is greater than total economic costs,","so the firm earns more than normal profit."]},{"term":"Average cost","unit":2,"topic":"2.11 Market failure: market power","hl":true,"p":["total cost divided by the quantity of output,","giving the cost of producing each unit."]},{"term":"Average revenue","unit":2,"topic":"2.11 Market failure: market power","hl":true,"p":["total revenue divided by the quantity sold,","which is the same as the price of each unit."]},{"term":"Barriers to entry","unit":2,"topic":"2.11 Market failure: market power","hl":true,"p":["anything that makes it hard for new firms to enter a market,","which protects the firms already in it from competition."],"review":true},{"term":"Branding","unit":2,"topic":"2.11 Market failure: market power","hl":true,"p":["giving a product a recognisable name, logo and image","so consumers see it as different from rivals' products."],"review":true},{"term":"Break even price","unit":2,"topic":"2.11 Market failure: market power","hl":true,"p":["the price that lets a firm's total revenue just cover its total costs,","so it earns only normal profit."],"review":true},{"term":"Breaking even","unit":2,"topic":"2.11 Market failure: market power","hl":true,"p":["when a firm's revenue exactly covers all its costs,","so it earns only normal profit."]},{"term":"Cartel","unit":2,"topic":"2.11 Market failure: market power","hl":true,"p":["a group of firms that formally agree on prices or output","so they can act like a monopoly and raise their profits."]},{"term":"Collusion","unit":2,"topic":"2.11 Market failure: market power","hl":true,"p":["when rival firms cooperate instead of competing,","agreeing on prices or output to raise their profits."]},{"term":"Collusive oligopoly","unit":2,"topic":"2.11 Market failure: market power","hl":true,"p":["an oligopoly where the few firms agree on prices or output","instead of competing with each other."]},{"term":"Concentration ratios","unit":2,"topic":"2.11 Market failure: market power","hl":true,"p":["the share of a market's output or sales held by its largest few firms,","shown as CRx, where x is the number of firms counted."]},{"term":"Constant returns to scale","unit":2,"topic":"2.11 Market failure: market power","hl":true,"p":["when a firm raises all its inputs in the same proportion","and output grows by that same proportion."],"review":true},{"term":"Contestable market","unit":2,"topic":"2.11 Market failure: market power","hl":true,"p":["a market where new firms can enter and leave easily,","so the threat of entry keeps existing firms' prices down."]},{"term":"Decreasing returns to scale","unit":2,"topic":"2.11 Market failure: market power","hl":true,"p":["when a firm raises all its inputs in the same proportion","but output grows by a smaller proportion."],"review":true},{"term":"Differentiated products","unit":2,"topic":"2.11 Market failure: market power","hl":true,"p":["products that are similar but not identical,","so buyers can tell one firm's version from another's."],"review":true},{"term":"Diseconomies of scale","unit":2,"topic":"2.11 Market failure: market power","hl":true,"p":["rises in average cost","that happen when a firm grows too large."],"review":true},{"term":"Economic costs","unit":2,"topic":"2.11 Market failure: market power","hl":true,"p":["explicit costs plus implicit costs,","so they count opportunity costs as well as money actually paid."]},{"term":"Economies of scale","unit":2,"topic":"2.11 Market failure: market power","hl":true,"p":["falls in average cost","that come from a firm growing larger."]},{"term":"Explicit costs","unit":2,"topic":"2.11 Market failure: market power","hl":true,"p":["costs a firm actually pays out in money","to buy or hire factors of production from others."]},{"term":"First degree price discrimination","unit":2,"topic":"2.11 Market failure: market power","hl":true,"p":["when a firm charges each consumer a different price","equal to the most that consumer is willing to pay."],"review":true},{"term":"Fixed costs","unit":2,"topic":"2.11 Market failure: market power","hl":true,"p":["costs that stay the same however much a firm produces,","and must be paid even if output is zero."]},{"term":"Formal collusion","unit":2,"topic":"2.11 Market failure: market power","hl":true,"p":["when firms make an explicit agreement with each other","to fix prices or share out the market."]},{"term":"Game theory","unit":2,"topic":"2.11 Market failure: market power","hl":true,"p":["a way of analysing decisions when each player's best choice","depends on what the other players choose."],"review":true},{"term":"Homogeneous products","unit":2,"topic":"2.11 Market failure: market power","hl":true,"p":["products that are identical whichever firm sells them,","so buyers have no reason to prefer one seller."]},{"term":"Imperfect competition","unit":2,"topic":"2.11 Market failure: market power","hl":true,"p":["a market structure that lacks at least one feature of perfect competition,","so firms have some control over the price they charge."]},{"term":"Imperfect market","unit":2,"topic":"2.11 Market failure: market power","hl":true,"p":["a market where firms have some power to set their price","and buyers cannot easily switch between sellers."]},{"term":"Implicit costs","unit":2,"topic":"2.11 Market failure: market power","hl":true,"p":["the opportunity cost of resources a firm already owns and uses,","for which no money is actually paid."]},{"term":"Increasing returns to scale","unit":2,"topic":"2.11 Market failure: market power","hl":true,"p":["when a firm raises all its inputs in the same proportion","and output grows by a larger proportion."],"review":true},{"term":"Indivisibilities","unit":2,"topic":"2.11 Market failure: market power","hl":true,"p":["inputs that cannot be split into smaller amounts,","so a firm must buy a whole one even if it needs only part."],"review":true},{"term":"Informal collusion","unit":2,"topic":"2.11 Market failure: market power","hl":true,"p":["when firms avoid competing on price","without making any explicit agreement with each other."]},{"term":"Intellectual property","unit":2,"topic":"2.11 Market failure: market power","hl":true,"p":["legal ownership of creations of the mind,","which lets the owner stop others copying or using them."]},{"term":"Kinked demand curve","unit":2,"topic":"2.11 Market failure: market power","hl":true,"p":["an oligopoly demand curve that is elastic above the current price and inelastic below it,","because rivals follow price cuts but ignore price rises."]},{"term":"Legal barriers","unit":2,"topic":"2.11 Market failure: market power","hl":true,"p":["barriers to entry set up by the government through the law,","which stop or limit new firms entering a market."],"review":true},{"term":"Long run","unit":2,"topic":"2.11 Market failure: market power","hl":true,"p":["the time a firm needs to change the amounts of all its inputs,","so none of its factors of production are fixed."]},{"term":"Loss","unit":2,"topic":"2.11 Market failure: market power","hl":true,"p":["when a firm's revenue is not enough to cover its costs,","so its profit is below zero."],"review":true},{"term":"Marginal revenue","unit":2,"topic":"2.11 Market failure: market power","hl":true,"p":["how much a firm's total revenue changes","when its sales rise by one unit."]},{"term":"Market power","unit":2,"topic":"2.11 Market failure: market power","hl":true,"p":["the ability of one firm, or firms acting together, to keep price","higher than it would be under perfect competition."]},{"term":"Market segment","unit":2,"topic":"2.11 Market failure: market power","hl":true,"p":["a group of consumers within a market","who have similar characteristics or needs."],"review":true},{"term":"Market structure","unit":2,"topic":"2.11 Market failure: market power","hl":true,"p":["the way a market is organised,","especially how many firms compete in it and how easily new firms can enter."]},{"term":"Monopolistic competition","unit":2,"topic":"2.11 Market failure: market power","hl":true,"p":["a market structure where many small firms sell slightly different products","and firms are free to enter or leave."]},{"term":"Monopoly","unit":2,"topic":"2.11 Market failure: market power","hl":true,"p":["a market where one firm is the only supplier","and buyers have no close substitutes to turn to."]},{"term":"Nationalisation","unit":2,"topic":"2.11 Market failure: market power","hl":true,"p":["when the government takes over a private firm or industry","so that it becomes publicly owned."]},{"term":"Natural monopoly","unit":2,"topic":"2.11 Market failure: market power","hl":true,"p":["a market where economies of scale are so large","that one firm can meet all of demand more cheaply than several firms sharing it."]},{"term":"Non-collusive oligopoly","unit":2,"topic":"2.11 Market failure: market power","hl":true,"p":["an oligopoly where firms compete with each other","without any agreement on prices or output."]},{"term":"Non-price competition","unit":2,"topic":"2.11 Market failure: market power","hl":true,"p":["rivalry between firms for customers","using methods other than lowering prices."]},{"term":"Normal profit","unit":2,"topic":"2.11 Market failure: market power","hl":true,"p":["the profit a firm needs to stay in its current industry,","earned when total revenue just equals total economic costs."]},{"term":"Oligopolistic market","unit":2,"topic":"2.11 Market failure: market power","hl":true,"p":["a market in which a few firms together hold most of the sales,","so each must watch how its rivals respond."]},{"term":"Oligopoly","unit":2,"topic":"2.11 Market failure: market power","hl":true,"p":["a market structure where a few large firms supply most of the output","and each firm's decisions affect its rivals."]},{"term":"Patent","unit":2,"topic":"2.11 Market failure: market power","hl":true,"p":["a legal right given to the inventor of a new product or process","that stops others copying it for a set number of years."]},{"term":"Perfect competition","unit":2,"topic":"2.11 Market failure: market power","hl":true,"p":["a market structure with very many small firms selling identical products, with perfect information and free entry and exit,","so no single firm can affect the market price."]},{"term":"Predatory pricing","unit":2,"topic":"2.11 Market failure: market power","hl":true,"p":["when a firm sets prices very low, even below cost,","to force rivals out of the market."]},{"term":"Price competition","unit":2,"topic":"2.11 Market failure: market power","hl":true,"p":["when firms compete for customers","by charging lower prices than their rivals."]},{"term":"Price discrimination","unit":2,"topic":"2.11 Market failure: market power","hl":true,"p":["when a firm sells the same product at different prices to different buyers,","where the price gap is not due to a difference in cost."],"review":true},{"term":"Price maker","unit":2,"topic":"2.11 Market failure: market power","hl":true,"p":["a firm with market power","that can set the price of its product."]},{"term":"Price rigidity","unit":2,"topic":"2.11 Market failure: market power","hl":true,"p":["when prices stay the same for long periods","even when demand or costs change."],"review":true},{"term":"Price taker","unit":2,"topic":"2.11 Market failure: market power","hl":true,"p":["a firm so small compared with the market","that it must accept the market price."]},{"term":"Price war","unit":2,"topic":"2.11 Market failure: market power","hl":true,"p":["when rival firms keep cutting their prices","to try to win customers from each other."]},{"term":"Productively efficient","unit":2,"topic":"2.11 Market failure: market power","hl":true,"p":["when a firm produces where its average cost is as low as it can be,","so it uses the fewest resources per unit of output."]},{"term":"Productively inefficient","unit":2,"topic":"2.11 Market failure: market power","hl":true,"p":["when a firm produces where its average cost is above the lowest level possible,","so it uses more resources per unit than it needs to."]},{"term":"Rent-seeking","unit":2,"topic":"2.11 Market failure: market power","hl":true,"p":["when firms try to raise their profits by influencing government policy","rather than by producing more or better goods."]},{"term":"Research and development","unit":2,"topic":"2.11 Market failure: market power","hl":true,"p":["spending by firms on discovering new ideas","to create new products or improve production methods."]},{"term":"Second degree price discrimination","unit":2,"topic":"2.11 Market failure: market power","hl":true,"p":["when a firm charges different prices","depending on the quantity a consumer buys."],"review":true},{"term":"Short run","unit":2,"topic":"2.11 Market failure: market power","hl":true,"p":["the time over which a firm can vary only some of its inputs,","because others take longer to change."]},{"term":"Shut down price","unit":2,"topic":"2.11 Market failure: market power","hl":true,"p":["the lowest price where a firm can just cover its average variable cost,","so below it the firm is better off stopping production in the short run."],"review":true},{"term":"State capture / regulatory capture","unit":2,"topic":"2.11 Market failure: market power","hl":true,"p":["when powerful private firms gain control over government decisions or regulators,","so policy serves their interests rather than the public's."]},{"term":"Tacit collusion","unit":2,"topic":"2.11 Market failure: market power","hl":true,"p":["when rival firms in an oligopoly copy each other's pricing to avoid competing,","even though nothing has been agreed."]},{"term":"Third degree price discrimination","unit":2,"topic":"2.11 Market failure: market power","hl":true,"p":["when a firm divides its customers into separate groups","and charges each group a different price for the same product."],"review":true},{"term":"Total cost","unit":2,"topic":"2.11 Market failure: market power","hl":true,"p":["the full cost of producing a given level of output,","equal to fixed costs plus variable costs."]},{"term":"Variable costs","unit":2,"topic":"2.11 Market failure: market power","hl":true,"p":["costs that rise and fall with the amount a firm produces,","and are zero when output is zero."]},{"term":"Distribution of income","unit":2,"topic":"2.12 The market’s inability to achieve equity","hl":true,"p":["the way a country's total income is shared out","between different groups of people or households."]},{"term":"Distributive justice","unit":2,"topic":"2.12 The market’s inability to achieve equity","hl":true,"p":["the idea of sharing out income, wealth and resources","in a way that society sees as fair."]},{"term":"Market imperfections","unit":2,"topic":"2.12 The market’s inability to achieve equity","hl":true,"p":["anything that stops supply and demand","from bringing a market to an efficient equilibrium."]},{"term":"Actual output","unit":3,"topic":"3.1 Measuring economic activity and illustrating its variations","hl":false,"p":["the real GDP an economy is producing now,","which may be below what it could produce with full employment."]},{"term":"Big Mac index","unit":3,"topic":"3.1 Measuring economic activity and illustrating its variations","hl":false,"p":["an informal comparison of Big Mac prices across countries,","used to test whether exchange rates match purchasing power parity."]},{"term":"Boom","unit":3,"topic":"3.1 Measuring economic activity and illustrating its variations","hl":false,"p":["the high point of the business cycle,","when output is growing fast and unemployment is low."]},{"term":"Business cycle","unit":3,"topic":"3.1 Measuring economic activity and illustrating its variations","hl":false,"p":["the pattern of rises and falls in real GDP over time","around its long-term growth trend."]},{"term":"Bust","unit":3,"topic":"3.1 Measuring economic activity and illustrating its variations","hl":false,"p":["the low point of the business cycle,","when output is stagnant or falling and unemployment is at its highest."]},{"term":"Cantril ladder","unit":3,"topic":"3.1 Measuring economic activity and illustrating its variations","hl":false,"p":["a survey scale for measuring subjective well-being,","where people place their own life on a ladder from 0 to 10."]},{"term":"Depression","unit":3,"topic":"3.1 Measuring economic activity and illustrating its variations","hl":false,"p":["a very deep and long-lasting recession,","with a large fall in real GDP and very high unemployment."]},{"term":"Downturn","unit":3,"topic":"3.1 Measuring economic activity and illustrating its variations","hl":false,"p":["a period when economic growth slows","and the economy may move towards recession."]},{"term":"GDP per capita","unit":3,"topic":"3.1 Measuring economic activity and illustrating its variations","hl":false,"p":["a country's GDP divided by the number of people in it,","used as a rough measure of average income."]},{"term":"Green GDP","unit":3,"topic":"3.1 Measuring economic activity and illustrating its variations","hl":false,"p":["GDP minus the value of the environmental damage","caused by producing that output."]},{"term":"Gross domestic product (GDP)","unit":3,"topic":"3.1 Measuring economic activity and illustrating its variations","hl":false,"p":["the total value of all final goods and services","produced within a country in a given period, usually a year."]},{"term":"Gross national income (GNI)","unit":3,"topic":"3.1 Measuring economic activity and illustrating its variations","hl":false,"p":["all the income that a country's residents earn,","equal to GDP plus net property income received from abroad."]},{"term":"Gross national product (GNP)","unit":3,"topic":"3.1 Measuring economic activity and illustrating its variations","hl":false,"p":["the value of output produced by a country's citizens and firms,","wherever in the world they produce it."]},{"term":"Happiness Index","unit":3,"topic":"3.1 Measuring economic activity and illustrating its variations","hl":false,"p":["a measure of how happy the people of a country feel","and how well they think their lives are going."]},{"term":"Happy Planet Index","unit":3,"topic":"3.1 Measuring economic activity and illustrating its variations","hl":false,"p":["an index of how well a country gives its people long, happy lives","compared with how much of the environment it uses up."]},{"term":"Informal market","unit":3,"topic":"3.1 Measuring economic activity and illustrating its variations","hl":false,"p":["the part of the economy that the government does not record or tax,","so it is missing from official GDP figures."]},{"term":"International dollar","unit":3,"topic":"3.1 Measuring economic activity and illustrating its variations","hl":false,"p":["an imaginary currency unit that buys as much as a US dollar buys in the US,","used to compare incomes between countries."]},{"term":"National expenditure","unit":3,"topic":"3.1 Measuring economic activity and illustrating its variations","hl":false,"p":["the total spent in a year on a country's final output","by households, firms, the government and foreigners."]},{"term":"National income","unit":3,"topic":"3.1 Measuring economic activity and illustratin tor","unit":3,"topic":"3.1 Measuring economic activity and illustrating its variations","hl":false,"p":["a price index that turns nominal figures into real ones","by removing the effect of inflation."]},{"term":"Purchasing power parity (PPP)","unit":3,"topic":"3.1 Measuring economic activity and illustrating its variations","hl":false,"p":["an exchange rate at which the same basket of goods","would cost the same in each country."]},{"term":"Real GDP","unit":3,"topic":"3.1 Measuring economic activity and illustrating its variations","hl":false,"p":["GDP adjusted for inflation,","so it measures changes in the quantity of output rather than in prices."]},{"term":"Real GDP per person (per capita)","unit":3,"topic":"3.1 Measuring economic activity and illustrating its variations","hl":false,"p":["average output per person adjusted for inflation,","found by dividing real GDP by the number of people."]},{"term":"Real GNI per person (per capita)","unit":3,"topic":"3.1 Measuring economic activity and illustrating its variations","hl":false,"p":["average income per person adjusted for inflation,","found by dividing real GNI by the number of people."]},{"term":"Real income","unit":3,"topic":"3.1 Measuring economic activity and illustrating its variations","hl":false,"p":["income adjusted for inflation,","showing how much it can actually buy."]},{"term":"Real value","unit":3,"topic":"3.1 Measuring economic activity and illustrating its variations","hl":false,"p":["a value with the effect of inflation removed,","so it can be compared fairly with other years."],"review":true},{"term":"Recession","unit":3,"topic":"3.1 Measuring economic activity and illustrating its variations","hl":false,"p":["a fall in real GDP","lasting for at least two quarters in a row."]},{"term":"Recovery","unit":3,"topic":"3.1 Measuring economic activity and illustrating its variations","hl":false,"p":["the stage of the business cycle after a recession","when real GDP starts to grow again and unemployment
