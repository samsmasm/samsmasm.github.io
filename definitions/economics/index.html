it":3,"topic":"3.2 Variations in economic activity: aggregate demand and aggregate supply","hl":false,"p":["how optimistic firms feel about the economy","and about their own future sales and profits."]},{"term":"Consumer confidence","unit":3,"topic":"3.2 Variations in economic activity: aggregate demand and aggregate supply","hl":false,"p":["how optimistic households feel about the economy","and about their own finances."]},{"term":"Consumption (C)","unit":3,"topic":"3.2 Variations in economic activity: aggregate demand and aggregate supply","hl":false,"p":["what households spend","on goods and services for their own use."]},{"term":"Deflationary/recessionary gap","unit":3,"topic":"3.2 Variations in economic activity: aggregate demand and aggregate supply","hl":false,"p":["the amount by which equilibrium output falls short of full employment output,","because aggregate demand is too low, which causes unemployment."]},{"term":"Demand side of the economy","unit":3,"topic":"3.2 Variations in economic activity: aggregate demand and aggregate supply","hl":false,"p":["the spending part of the economy,","made up of consumption, investment, government spending and net exports."]},{"term":"Exogenous shocks","unit":3,"topic":"3.2 Variations in economic activity: aggregate demand and aggregate supply","hl":false,"p":["unexpected events from outside the economy","that suddenly change aggregate demand or aggregate supply."]},{"term":"Financial investment","unit":3,"topic":"3.2 Variations in economic activity: aggregate demand and aggregate supply","hl":false,"p":["buying financial assets in the hope of a return,","rather than spending on new capital goods."]},{"term":"Fixed capital","unit":3,"topic":"3.2 Variations in economic activity: aggregate demand and aggregate supply","hl":false,"p":["capital goods that a firm keeps","and uses again and again over many years."]},{"term":"Full capacity","unit":3,"topic":"3.2 Variations in economic activity: aggregate demand and aggregate supply","hl":false,"p":["the highest output a firm or economy can keep up","using all of its existing resources."],"review":true},{"term":"Full employment","unit":3,"topic":"3.2 Variations in economic activity: aggregate demand and aggregate supply","hl":false,"p":["the situation where everyone who wants a job at the going wage has one,","so only natural unemployment is left."]},{"term":"Full employment level of output","unit":3,"topic":"3.2 Variations in economic activity: aggregate demand and aggregate supply","hl":false,"p":["the real GDP produced","when unemployment is at its natural rate."]},{"term":"Government spending (G)","unit":3,"topic":"3.2 Variations in economic activity: aggregate demand and aggregate supply","hl":false,"p":["what the government spends buying goods and services,","not counting transfer payments."]},{"term":"Indebtedness","unit":3,"topic":"3.2 Variations in economic activity: aggregate demand and aggregate supply","hl":false,"p":["the state of owing money","that must be repaid, often with interest."]},{"term":"Inflationary gap","unit":3,"topic":"3.2 Variations in economic activity: aggregate demand and aggregate supply","hl":false,"p":["the amount by which equilibrium output is above full employment output,","because aggregate demand is too high, which pushes up prices."]},{"term":"Investment (I)","unit":3,"topic":"3.2 Variations in economic activity: aggregate demand and aggregate supply","hl":false,"p":["what firms spend on new capital goods,","which adds to the stock of capital used to produce output."]},{"term":"Long run aggregate supply (LRAS)","unit":3,"topic":"3.2 Variations in economic activity: aggregate demand and aggregate supply","hl":false,"p":["the output an economy can make once all its resources are fully used,","which grows only when it gains more or better resources."]},{"term":"Macroeconomic equilibrium","unit":3,"topic":"3.2 Variations in economic activity: aggregate demand and aggregate supply","hl":false,"p":["the level of real GDP and the price level","at which aggregate demand equals aggregate supply."],"review":true},{"term":"Net exports (X-M)","unit":3,"topic":"3.2 Variations in economic activity: aggregate demand and aggregate supply","hl":false,"p":["a country's export revenue","minus its spending on imports."]},{"term":"Productive capacity","unit":3,"topic":"3.2 Variations in economic activity: aggregate demand and aggregate supply","hl":false,"p":["the most an economy can produce","with its current resources and technology."]},{"term":"Short-run aggregate supply (SRAS)","unit":3,"topic":"3.2 Variations in economic activity: aggregate demand and aggregate supply","hl":false,"p":["the total output firms plan to supply at each price level in the short run,","while wages and other input prices stay fixed."]},{"term":"Supply side","unit":3,"topic":"3.2 Variations in economic activity: aggregate demand and aggregate supply","hl":false,"p":["the productive part of the economy,","made up of the quantity and quality of its factors of production."]},{"term":"The interest rate effect","unit":3,"topic":"3.2 Variations in economic activity: aggregate demand and aggregate supply","hl":false,"p":["the fall in spending when a higher price level pushes up interest rates,","one reason the AD curve slopes downward."]},{"term":"The net balance effect","unit":3,"topic":"3.2 Variations in economic activity: aggregate demand and aggregate supply","hl":false,"p":["the fall in net exports when a country's price level rises,","because its goods become dearer compared with foreign goods."]},{"term":"The wealth effect","unit":3,"topic":"3.2 Variations in economic activity: aggregate demand and aggregate supply","hl":false,"p":["the change in consumer spending","caused by a change in the real value of people's wealth."]},{"term":"Wealth","unit":3,"topic":"3.2 Variations in economic activity: aggregate demand and aggregate supply","hl":false,"p":["the value of everything a person or organisation owns","minus what they owe."]},{"term":"Balanced budget","unit":3,"topic":"3.3 Macroeconomic objectives","hl":false,"p":["a government budget","where spending matches the revenue it takes in."],"review":true},{"term":"Bankruptcy","unit":3,"topic":"3.3 Macroeconomic objectives","hl":false,"p":["a legal process that starts","when a person or firm cannot pay back what it owes."]},{"term":"Budget deficit","unit":3,"topic":"3.3 Macroeconomic objectives","hl":false,"p":["the gap when government spending","is higher than government revenue in a year."]},{"term":"Budget surplus","unit":3,"topic":"3.3 Macroeconomic objectives","hl":false,"p":["the gap when government revenue","is higher than government spending in a year."]},{"term":"Consumer price index (CPI)","unit":3,"topic":"3.3 Macroeconomic objectives","hl":false,"p":["a weighted index of the prices of what a typical household buys,","used to measure inflation and changes in the cost of living."]},{"term":"Cost-push inflation","unit":3,"topic":"3.3 Macroeconomic objectives","hl":false,"p":["a general rise in prices caused by higher costs of production,","which reduce short-run aggregate supply."]},{"term":"Country's credit rating","unit":3,"topic":"3.3 Macroeconomic objectives","hl":true,"p":["a grade given to a country for how likely it is to repay its loans,","which affects how easily and cheaply it can borrow."]},{"term":"Cyclical (demand-deficient) unemployment","unit":3,"topic":"3.3 Macroeconomic objectives","hl":false,"p":["unemployment caused by too little aggregate demand,","when wages do not fall enough to clear the labour market."]},{"term":"Debt default","unit":3,"topic":"3.3 Macroeconomic objectives","hl":false,"p":["a failure by a borrower, often a government,","to make a debt or interest payment when it is due."]},{"term":"Debt service","unit":3,"topic":"3.3 Macroeconomic objectives","hl":true,"p":["the regular payments a borrower must make on a loan,","covering both the interest and repayment of the amount .3 Macroeconomic objectives","hl":false,"p":["storing up a good or resource","and keeping it off the market for own use or to sell later at a higher price."]},{"term":"Hyperinflation","unit":3,"topic":"3.3 Macroeconomic objectives","hl":false,"p":["extremely rapid inflation,","often taken as prices rising by 50% or more in a month."]},{"term":"Inflation","unit":3,"topic":"3.3 Macroeconomic objectives","hl":false,"p":["a continuing rise in the general level of prices,","so each unit of money buys less."]},{"term":"Inflation rate","unit":3,"topic":"3.3 Macroeconomic objectives","hl":false,"p":["the percentage change in a price index","from one period to the next, usually over a year."]},{"term":"Labour force","unit":3,"topic":"3.3 Macroeconomic objectives","hl":false,"p":["everyone of working age who is either in work","or unemployed and looking for a job."]},{"term":"Long-run Phillips curve","unit":3,"topic":"3.3 Macroeconomic objectives","hl":true,"p":["a vertical curve at the natural rate of unemployment,","showing that in the long run lower unemployment cannot be bought with higher inflation."]},{"term":"Natural rate of unemployment","unit":3,"topic":"3.3 Macroeconomic objectives","hl":false,"p":["the unemployment rate at which inflation stays stable,","leaving only frictional, structural and seasonal unemployment."]},{"term":"Phillips curve","unit":3,"topic":"3.3 Macroeconomic objectives","hl":true,"p":["a graph plotting inflation against unemployment","to show how the two move together."]},{"term":"Price stability","unit":3,"topic":"3.3 Macroeconomic objectives","hl":false,"p":["a situation where inflation is low and steady,","usually kept within a target band of around 2%."]},{"term":"Producer price index (PPI)","unit":3,"topic":"3.3 Macroeconomic objectives","hl":false,"p":["an index that tracks the average change in prices","that domestic firms are paid for what they produce."]},{"term":"Purchasing power","unit":3,"topic":"3.3 Macroeconomic objectives","hl":f ctives","hl":true,"p":["a price index in which each item counts","according to how much of their income consumers spend on it."]},{"term":"Working age","unit":3,"topic":"3.3 Macroeconomic objectives","hl":false,"p":["the range of ages","at which people are legally allowed to work in a country."]},{"term":"Absolute poverty","unit":3,"topic":"3.4 Economics of inequality and poverty","hl":false,"p":["having an income so low","that a person cannot afford the basic needs for staying alive."]},{"term":"Average tax rate","unit":3,"topic":"3.4 Economics of inequality and poverty","hl":false,"p":["the total tax a person pays","as a percentage of their total income."]},{"term":"Capital gains","unit":3,"topic":"3.4 Economics of inequality and poverty","hl":false,"p":["the profit made when an asset","is sold for more than it cost to buy."]},{"term":"Caste discrimination / discrimination based on work and descent (DWD)","unit":3,"topic":"3.4 Economics of inequality and poverty","hl":false,"p":["unfair treatment of people because of the ranked social group","they are born into."]},{"term":"Direct taxes","unit":3,"topic":"3.4 Economics of inequality and poverty","hl":false,"p":["taxes on income, profits or wealth","that are paid by the person or firm they fall on."]},{"term":"Economic inequality","unit":3,"topic":"3.4 Economics of inequality and poverty","hl":false,"p":["the differences in income and wealth","between people or groups in an economy."]},{"term":"Ethnic discrimination","unit":3,"topic":"3.4 Economics of inequality and poverty","hl":false,"p":["unfair treatment of people","because of their race, culture or origins."]},{"term":"Gender pay gap","unit":3,"topic":"3.4 Economics of inequality and poverty","hl":false,"p":["how much less women earn per hour than men on average,","given as a percentage of men's pay."]},{"term":"Gini coefficient (index)","unit":3,"topic":"3.4 Economics of inequality and poverty","hl":false,"p":["a measure of income inequality worked out from the Lorenz curve,","running from 0 (complete equality) to 1 (complete inequality)."]},{"term":"Human Opportunity Index (HOI)","unit":3,"topic":"3.4 Economics of inequality and poverty","hl":false,"p":["a World Bank index of children's access to basic services","and how much that access depends on circumstances they were born into."]},{"term":"Income inequality","unit":3,"topic":"3.4 Economics of inequality and poverty","hl":false,"p":["an uneven spread of income across a population,","with a large share going to a small group."]},{"term":"International poverty line","unit":3,"topic":"3.4 Economics of inequality and poverty","hl":false,"p":["the income per person per day set by the World Bank","below which someone counts as living in extreme poverty."],"review":true},{"term":"Lorenz curve","unit":3,"topic":"3.4 Economics of inequality and poverty","hl":false,"p":["a curve showing the cumulative percentage of income held by the cumulative percentage of people,","where the further it lies from the 45-degree line, the greater the inequality."]},{"term":"Marginal tax rate","unit":3,"topic":"3.4 Economics of inequality and poverty","hl":false,"p":["the percentage of tax paid","on the next dollar a person earns."]},{"term":"Minimum income standards","unit":3,"topic":"3.4 Economics of inequality and poverty","hl":false,"p":["the income needed for a minimum acceptable standard of living,","based on what the public agrees people need."],"review":true},{"term":"Multidimensional Poverty Index (MPI)","unit":3,"topic":"3.4 Economics of inequality and poverty","hl":false,"p":["an index of severe poverty in developing countries,","based on what people lack at once in health, schooling and basic living conditions."]},{"term":"Positive discrimination","unit":3,"topic":"3.4 Economics of inequality and poverty","hl":false,"p":["policies that favour groups who were disadvantaged in the past,","to help make up for that unfair treatment."]},{"term":"Poverty","unit":3,"topic":"3.4 Economics of inequality and poverty","hl":false,"p":["a lack of income or resources","to afford essentials and an acceptable standard of living."]},{"term":"Power asymmetry","unit":3,"topic":"3.4 Economics of inequality and poverty","hl":false,"p":["an imbalance where some stakeholders have much more power than others,","often because they have more money."]},{"term":"Progressive taxation","unit":3,"topic":"3.4 Economics of inequality and poverty","hl":false,"p":["a tax system where, as income rises,","the average tax rate goes up."]},{"term":"Proportional tax","unit":3,"topic":"3.4 Economics of inequality and poverty","hl":false,"p":["a tax where, as income rises,","the average tax rate stays the same."]},{"term":"Redistribution policies","unit":3,"topic":"3.4 Economics of inequality and poverty","hl":false,"p":["government policies that move income and wealth","from richer to poorer people to reduce inequality."]},{"term":"Regressive taxation","unit":3,"topic":"3.4 Economics of inequality and poverty","hl":false,"p":["a tax system where, as income rises,","the average tax rate falls."]},{"term":"Relative poverty","unit":3,"topic":"3.4 Economics of inequality and poverty","hl":false,"p":["having an income below a set share","of the typical income in your own country."]},{"term":"Social mobility","unit":3,"topic":"3.4 Economics of inequality and poverty","hl":false,"p":["how easily people can move up or down","the income and social ladder of a society."]},{"term":"Social safety net","unit":3,"topic":"3.4 Economics of inequality and poverty","hl":false,"p":["the support a state gives to people on low incomes","so that they do not fall into poverty."]},{"term":"Tax base","unit":3,"topic":"3.4 Economics of inequality and poverty","hl":false,"p":["the total income, spending or wealth","that a government is able to tax."]},{"term":"Tax break","unit":3,"topic":"3.4 Economics of inequality and poverty","hl":false,"p":["a reduction in tax","given to encourage a particular activity." licies): monetary policy","hl":false,"p":["the wish to hold money","to pay for unexpected costs or emergencies."]},{"term":"Quantitative easing","unit":3,"topic":"3.5 Demand management (demand side policies): monetary policy","hl":true,"p":["the central bank creating new money to buy large amounts of bonds and other financial assets,","to increase the money supply and boost the economy."]},{"term":"Quantitative tightening","unit":3,"topic":"3.5 Demand management (demand side policies): monetary policy","hl":true,"p":["the central bank selling, or no longer replacing, the bonds it bought","through quantitative easing, which reduces the money supply."]},{"term":"Real interest rates","unit":3,"topic":"3.5 Demand management (demand side policies): monetary policy","hl":false,"p":["interest rates after inflation is taken into account,","found as the nominal rate minus the inflation rate."]},{"term":"Run on the bank","unit":3,"topic":"3.5 Demand management (demand side policies): monetary policy","hl":false,"p":["a situation where many depositors take their money out of a bank at the same time","because they fear the bank will fail."]},{"term":"Shares","unit":3,"topic":"3.5 Demand management (demand side policies): monetary policy","hl":false,"p":["units of part ownership in a company","that are traded on the stock market."]},{"term":"Speculative motive","unit":3,"topic":"3.5 Demand management (demand side policies): monetary policy","hl":false,"p":["the wish to hold money instead of other assets","when those assets are expected to fall in value."]},{"term":"Stock market","unit":3,"topic":"3.5 Demand management (demand side policies): monetary policy","hl":false,"p":["the markets where companies issue new shares","and where existing shares are bought and sold."]},{"term":"Transaction account","unit":3,"topic":"3.5 Demand management (demand side policies): monetary policy","hl":false,"p":["a basic bank account used for holding money","and making and receiving payments."]}, false,"p":["laws that stop firms from gaining or abusing monopoly power,","so that markets stay competitive."]},{"term":"Deregulation","unit":3,"topic":"3.7 Supply-side policies","hl":false,"p":["cutting back the government rules that control how firms operate,","so that markets can work more freely."]},{"term":"Domestic wage restraint","unit":3,"topic":"3.7 Supply-side policies","hl":false,"p":["government action to hold down pay rises across the economy","so that firms' costs and inflation stay low."]},{"term":"Equilibrium wage rate","unit":3,"topic":"3.7 Supply-side policies","hl":false,"p":["the wage at which the quantity of labour that firms want to hire","equals the quantity of labour that workers offer."]},{"term":"Industrial policies","unit":3,"topic":"3.7 Supply-side policies","hl":false,"p":["government support aimed at chosen industries","to raise their productivity and make them drivers of growth and jobs."]},{"term":"Infrastructure","unit":3,"topic":"3.7 Supply-side policies","hl":false,"p":["the basic physical capital of a country, often built by the government,","that firms and households depend on to produce and trade."]},{"term":"Interventionist policies","unit":3,"topic":"3.7 Supply-side policies","hl":false,"p":["supply-side policies in which the government takes direct action","to give the economy more and better factors of production."]},{"term":"Labour market flexibility","unit":3,"topic":"3.7 Supply-side policies","hl":false,"p":["how easily and quickly the labour market adjusts","when conditions in the economy change."]},{"term":"Labour markets","unit":3,"topic":"3.7 Supply-side policies","hl":false,"p":["markets in which workers offer their labour to employers","in return for a wage."]},{"term":"Labour union","unit":3,"topic":"3.7 Supply-side policies","hl":false,"p":["a group that workers join so they can negotiate as one","with their employer over wages and conditions at work."]},{"term":"Market-based supply-side policies","unit":3,"topic":"3.7 Supply-side policies","hl":false,"p":["supply-side policies that reduce the government's role in the economy","so that markets work more freely and competition increases."]},{"term":"Privatisation","unit":3,"topic":"3.7 Supply-side policies","hl":false,"p":["the sale of firms or assets owned by the government","to private individuals or companies."]},{"term":"Retirement age","unit":3,"topic":"3.7 Supply-side policies","hl":false,"p":["the age at which people are expected to stop working","and can usually start to receive a state pension."]},{"term":"Social infrastructure","unit":3,"topic":"3.7 Supply-side policies","hl":false,"p":["the facilities and services that a community shares,","which support people's quality of life."]},{"term":"Supply-side policies","unit":3,"topic":"3.7 Supply-side policies","hl":false,"p":["government policies that aim to raise how much the economy can produce","by increasing long-run aggregate supply."]},{"term":"Trade liberalisation","unit":3,"topic":"3.7 Supply-side policies","hl":false,"p":["cutting or removing barriers to trade","so that goods and services move more freely between countries."]},{"term":"Vested interests","unit":3,"topic":"3.7 Supply-side policies","hl":false,"p":["a strong reason a firm or group has to support or oppose a policy,","because it stands to gain or lose from it."]},{"term":"Absolute advantage","unit":4,"topic":"4.1 Benefits of international trade","hl":true,"p":["the position of a country that needs fewer resources than another country","to make the same quantity of a good."]},{"term":"Comparative advantage","unit":4,"topic":"4.1 Benefits of international trade","hl":true,"p":["the position of a country whose opportunity cost of making a particular good","is lower than it is in another country."]},{"term":"Domestic market","unit":4,"topic":"4.1 Benefits of international trade","hl":false,"p":["the market for goods and services inside a country,","made up of its own buyers and sellers."]},{"term":"Export revenue","unit":4,"topic":"4.1 Benefits of international trade","hl":false,"p":["the money a country's producers earn","from selling goods and services to other countries."]},{"term":"Exports","unit":4,"topic":"4.1 Benefits of international trade","hl":false,"p":["goods and services made by a country's firms","and sold to buyers abroad."]},{"term":"Factor endowments","unit":4,"topic":"4.1 Benefits of international trade","hl":true,"p":["how much land, labour, capital and enterprise a country has,","and how good those resources are."]},{"term":"Free trade","unit":4,"topic":"4.1 Benefits of international trade","hl":false,"p":["buying and selling between countries","without any government barriers getting in the way."]},{"term":"Gains from trade","unit":4,"topic":"4.1 Benefits of international trade","hl":true,"p":["the increase in total output and consumption that countries enjoy","when they specialise in line with comparative advantage and then trade."],"review":true},{"term":"Globalisation","unit":4,"topic":"4.1 Benefits of international trade","hl":false,"p":["the process by which the world's economies become more closely linked","through growing flows of trade, investment, people and ideas."]},{"term":"Import expenditure","unit":4,"topic":"4.1 Benefits of international trade","hl":false,"p":["the total amount a country spends","on goods and services bought from other countries."]},{"term":"Imports","unit":4,"topic":"4.1 Benefits of international trade","hl":false,"p":["goods and services bought by people and firms in one country","that were made in a different country."]},{"term":"International trade","unit":4,"topic":"4.1 Benefits of international trade","hl":false,"p":["buying and selling goods and services across national borders."]},{"term":"Labour-intensive","unit":4,"topic":"4.1 Benefits of international trade","hl":false,"p":["a way of producing that relies mainly on labour","rather than on machinery and other capital."]},{"term":"Over-specialisation","unit":4,"topic":"4.1 Benefits of international trade","hl":true,"p":["depending on too narrow a range of products,","which leaves an economy exposed if demand or prices for them fall."],"review":true},{"term":"Resource endowment","unit":4,"topic":"4.1 Benefits of international trade","hl":true,"p":["the resources a country has","which it can use for production."],"review":true},{"term":"World price","unit":4,"topic":"4.1 Benefits of international trade","hl":false,"p":["what a good sells for on world markets,","set by global demand and supply."],"review":true},{"term":"Administrative barriers","unit":4,"topic":"4.2 Types of trade protection","hl":false,"p":["government rules and procedures that make importing slow or costly,","used as a hidden barrier to trade."]},{"term":"Buy National campaign","unit":4,"topic":"4.2 Types of trade protection","hl":false,"p":["a campaign that urges consumers to choose home-made goods over imports,","appealing to their loyalty to their own country."]},{"term":"Embargo","unit":4,"topic":"4.2 Types of trade protection","hl":false,"p":["a government ban on trade","with a particular country or in a particular product."]},{"term":"Product standards","unit":4,"topic":"4.2 Types of trade protection","hl":false,"p":["rules on the quality, health and safety of products that imports must meet,","which can be used to keep foreign goods out."]},{"term":"Quota","unit":4,"topic":"4.2 Types of trade protection","hl":false,"p":["a legal limit on how much of a good","is allowed into a country from abroad."]},{"term":"Subsidy (international)","unit":4,"topic":"4.2 Types of trade protection","hl":false,"p":["a payment from the government to domestic producers for each unit they make,","which lowers their costs and helps them compete with foreign firms."]},{"term":"Tariff","unit":4,"topic":"4.2 Types of trade protection","hl":false,"p":["a tax on imported goods","that protects domestic producers and raises money for the government."]},{"term":"Tariff escalation","unit":4,"topic":"4.2 Types of trade protection","hl":false,"p":["a pattern in which tariffs are higher on more processed goods,","so raw materials face the lowest rates and finished goods the highest."]},{"term":"Trade protection","unit":4,"topic":"4.2 Types of trade protection","hl":false,"p":["government action to limit imports or support exports","in order to shield domestic producers from foreign competition."]},{"term":"Trade war","unit":4,"topic":"4.2 Types of trade protection","hl":false,"p":["a conflict in which countries take turns putting new barriers on each other's goods,","with each round a response to the last."]},{"term":"Voluntary Export Restraint (VER)","unit":4,"topic":"4.2 Types of trade protection","hl":false,"p":["an agreement by an exporting country to limit the quantity of a good","that it sends to a particular importing country."]},{"term":"A beggar-thy-neighbour policy","unit":4,"topic":"4.3 Arguments for and against trade control/protection","hl":false,"p":["a policy that tries to help a country's own economy","at the expense of its trading partners."]},{"term":"Dumping","unit":4,"topic":"4.3 Arguments for and against trade control/protection","hl":false,"p":["selling exports for less","than they cost to make."]},{"term":"Economically least developed countries (ELDCs)","unit":4,"topic":"4.3 Arguments for and against trade control/protection","hl":false,"p":["the countries the United Nations lists as the poorest,","with deep structural problems that hold back their development and leave them vulnerable to shocks."]},{"term":"Infant industry","unit":4,"topic":"4.3 Arguments for and against trade control/protection","hl":false,"p":["a new industry that is still too small","to gain economies of scale and compete with foreign rivals."]},{"term":"Trade policies","unit":4,"topic":"4.3 Arguments for and against trade control/protection","hl":false,"p":["the rules and agreements a government uses","to shape its country's imports and exports."]},{"term":"Bilateral trade agreement","unit":4,"topic":"4.4 Economic integration","hl":false,"p":["a deal that cuts or removes trade barriers on some products","and is made between just two countries."]},{"term":"Common Agricultural Policy (CAP)","unit":4,"topic":"4.4 Economic integration","hl":false,"p":["the European Union's shared policy on farming,","which supports farmers with subsidies and other payments."]},{"term":"Common market","unit":4,"topic":"4.4 Economic integration","hl":false,"p":["a customs union where workers and capital can also move freely between members,","and members follow the same rules on products."]},{"term":"Complete economic integration","unit":4,"topic":"4.4 Economic integration","hl":false,"p":["the final stage of economic integration, going beyond a monetary union,","in which members also run a shared fiscal policy."]},{"term":"Convergence criteria","unit":4,"topic":"4.4 Economic integration","hl":false,"p":["the conditions a country must meet before it can adopt the euro,","which set limits on its inflation, interest rates, budget deficit, government debt and exchange rate swings."]},{"term":"Customs union","unit":4,"topic":"4.4 Economic integration","hl":false,"p":["a group of countries that remove trade barriers between themselves","and set the same tariffs on imports from all non-members."]},{"term":"Economic integration","unit":4,"topic":"4.4 Economic integration","hl":false,"p":["the process of countries linking their economies more closely","by cutting trade barriers between them and coordinating their policies."]},{"term":"Free trade agreement","unit":4,"topic":"4.4 Economic integration","hl":false,"p":["a deal in which countries remove trade barriers between themselves,","while each one keeps its own trade policy towards non-members."]},{"term":"Generalized System of Preferences (GSP)","unit":4,"topic":"4.4 Economic integration","hl":false,"p":["a scheme in which developed countries charge lower tariffs on goods from developing countries","without asking for anything in return."]},{"term":"Monetary union","unit":4,"topic":"4.4 Economic integration","hl":false,"p":["a group of countries that use a single currency","and have one central bank setting monetary policy for all of them."]},{"term":"Multilateral trade agreement","unit":4,"topic":"4.4 Economic integration","hl":false,"p":["a deal that cuts or removes trade barriers on some products","and is made among three or more countries."]},{"term":"Preferential trade agreement","unit":4,"topic":"4.4 Economic integration","hl":false,"p":["a deal that gives easier access to a market, usually through lower tariffs,","for certain products from chosen trading partners only."]},{"term":"Regional trade agreement (RTA)","unit":4,"topic":"4.4 Economic integration","hl":false,"p":["a deal that cuts or removes trade barriers on some products","among several countries in the same part of the world."]},{"term":"Trade creation","unit":4,"topic":"4.4 Economic integration","hl":true,"p":["a shift to buying imports from a cheaper producer instead of a higher-cost one,","which happens when a country joins a trading bloc."]},{"term":"Trade diversion","unit":4,"topic":"4.4 Economic integration","hl":true,"p":["a switch in imports from a cheaper producer outside a trading bloc","to a more expensive one inside it, after a country joins the bloc."]},{"term":"Trading bloc","unit":4,"topic":"4.4 Economic integration","hl":false,"p":["a group of countries that have signed an agreement","to lower trade barriers among themselves."]},{"term":"World Trade Organization (WTO)","unit":4,"topic":"4.4 Economic integration","hl":false,"p":["the international body that writes the rules of world trade and settles trade disputes,","and runs talks between countries on cutting trade barriers."]},{"term":"Appreciation","unit":4,"topic":"4.5 Exchange rates","hl":false,"p":["a rise in a currency's value against other currencies,","caused by changes in demand and supply under for a fixed amount of it."]},{"term":"Hard currencies","unit":4,"topic":"4.5 Exchange rates","hl":false,"p":["currencies of politically and economically stable countries","that are trusted to hold their value and are accepted around the world."]},{"term":"Hot money","unit":4,"topic":"4.5 Exchange rates","hl":false,"p":["money that is moved quickly between countries","to make a short-term gain from higher interest rates or expected exchange rate changes."]},{"term":"Managed exchange rate","unit":4,"topic":"4.5 Exchange rates","hl":false,"p":["an exchange rate that mostly floats,","but the central bank steps in from time to time to limit unwanted swings."]},{"term":"Overvalued currency","unit":4,"topic":"4.5 Exchange rates","hl":false,"p":["a currency whose exchange rate is held above","the level that demand and supply would set in a free market."]},{"term":"Peg","unit":4,"topic":"4.5 Exchange rates","hl":false,"p":["the set value at which a government ties its currency to another currency,","allowing it to move only within a narrow band."]},{"term":"Revaluation","unit":4,"topic":"4.5 Exchange rates","hl":false,"p":["a deliberate rise in a currency's value","made by the government or central bank under a fixed exchange rate."]},{"term":"Safe haven","unit":4,"topic":"4.5 Exchange rates","hl":false,"p":["an asset that investors trust to keep its value","even when the economy is in crisis."]},{"term":"Speculation","unit":4,"topic":"4.5 Exchange rates","hl":false,"p":["buying and selling currencies or other assets","to make a profit from expected changes in their value."]},{"term":"Undervalued currency","unit":4,"topic":"4.5 Exchange rates","hl":false,"p":["a currency whose exchange rate is held below","the level that demand and supply would set in a free market."]},{"term":"Balance of payments","unit":4,"topic":"4.6 Balance of payments","hl":false,"p":["a record of every payment between a country and other countries,","covering trade, income and deals in assets."]},{"term":"Balance of trade","unit":4,"topic":"4.6 Balance of payments","hl":false,"p":["what a country earns from all its exports","minus what it spends on all its imports."]},{"term":"Balance of trade in goods","unit":4,"topic":"4.6 Balance of payments","hl":false,"p":["what a country earns from exporting physical goods","minus what it spends on importing physical goods."]},{"term":"Balance of trade in services","unit":4,"topic":"4.6 Balance of payments","hl":false,"p":["what a country earns from exporting services","minus what it spends on importing services."]},{"term":"Capital account","unit":4,"topic":"4.6 Balance of payments","hl":false,"p":["the account that records a country's capital transfers","and the non-produced, non-financial assets it buys and sells."]},{"term":"Capital account surplus","unit":4,"topic":"4.6 Balance of payments","hl":false,"p":["a situation where money coming in on the capital account","is greater than money going out on it."]},{"term":"Capital controls","unit":4,"topic":"4.6 Balance of payments","hl":false,"p":["government limits on how much money","can enter or leave a country."]},{"term":"Capital transfers","unit":4,"topic":"4.6 Balance of payments","hl":false,"p":["transfers of wealth between countries with nothing given in return,","linked to fixed assets, debt forgiveness or migrants moving their assets."]},{"term":"Current account","unit":4,"topic":"4.6 Balance of payments","hl":false,"p":["the account that records a country's exports and imports","together with the income and transfers it pays and receives from abroad."]},{"term":"Current account deficit","unit":4,"topic":"4.6 Balance of payments","hl":false,"p":["a situation where money flowing in from exports, income and transfers","is smaller than money flowing out for imports, income and transfers."]},{"term":"Current account surplus","unit":4,"topic":"4.6 Balance of payments","hl":false,"p":["a situation where money flowing in from exports, income and transfers","is more than money flowing out for imports, income and transfers."]},{"term":"Current transfers","unit":4,"topic":"4.6 Balance of payments","hl":false,"p":["one-way payments between countries with nothing given in return","that appear in the current account rather than the capital account."]},{"term":"Debit","unit":4,"topic":"4.6 Balance of payments","hl":false,"p":["a balance of payments entry","for money that leaves the country."]},{"term":"Double-entry book-keeping","unit":4,"topic":"4.6 Balance of payments","hl":false,"p":["a way of recording in which every transaction is entered twice,","once as a credit and once as a debit of the same amount."]},{"term":"Elasticity of demand for exports","unit":4,"topic":"4.6 Balance of payments","hl":true,"p":["how strongly the quantity of exports demanded responds","when the price of exports changes."]},{"term":"Elasticity of demand for imports","unit":4,"topic":"4.6 Balance of payments","hl":true,"p":["how strongly the quantity of imports demanded responds","when the price of imports changes."]},{"term":"Expenditure reducing","unit":4,"topic":"4.6 Balance of payments","hl":true,"p":["government policies that lower total spending in the economy","so that spending on imports falls too."]},{"term":"Expenditure switching","unit":4,"topic":"4.6 Balance of payments","hl":true,"p":["government policies that shift people's spending away from imports","and onto goods and services made at home."]},{"term":"External balance","unit":4,"topic":"4.6 Balance of payments","hl":false,"p":["what a country earns from exporting goods and services","less what it spends on importing them."]},{"term":"Financial account","unit":4,"topic":"4.6 Balance of payments","hl":false,"p":["the account that records investment money entering and leaving a country,","along with changes in the central bank's reserve assets."]},{"term":"Financial account surplus","unit":4,"topic":"4.6 Balance of payments","hl":false,"p":["a situation where money coming in on the financial account","is greater than money going out on it."]},{"term":"Foreign direct investment (FDI)","unit":4,"topic":"4.6 Balance of payments","hl":false,"p":["investment by a firm into a business in another country","where the firm takes a long-term stake of at least 10%."]},{"term":"Inward foreign direct investment (IFDI)","unit":4,"topic":"4.6 Balance of payments","hl":false,"p":["long-term investment of at least 10% in a country's businesses","by firms based in other countries."]},{"term":"Inward portfolio investments","unit":4,"topic":"4.6 Balance of payments","hl":false,"p":["purchases of a country's shares, bonds and other financial assets","by investors based abroad."]},{"term":"J-curve","unit":4,"topic":"4.6 Balance of payments","hl":true,"p":["the pattern in which a country's current account first gets worse","after its currency falls, and then improves."]},{"term":"Marshall-Lerner condition","unit":4,"topic":"4.6 Balance of payments","hl":true,"p":["the rule that a fall in a currency's value improves the current account","only if the elasticities of export demand and import demand add up to more than one."]},{"term":"Money outflows","unit":4,"topic":"4.6 Balance of payments","hl":false,"p":["money that leaves a country","when its residents make payments to people or firms abroad."]},{"term":"Non-produced, non-financial assets","unit":4,"topic":"4.6 Balance of payments","hl":false,"p":["assets that are neither made by people nor financial,","whose sale between countries is recorded in the capital account."]},{"term":"Official borrowing","unit":4,"topic":"4.6 Balance of payments","hl":false,"p":["loans a government takes from abroad","to finance a current account deficit."]},{"term":"Outward foreign direct investment (OFDI)","unit":4,"topic":"4.6 Balance of payments","hl":false,"p":["long-term investment of at least 10% in businesses abroad","by firms based in the home country."]},{"term":"Outward portfolio investments","unit":4,"topic":"4.6 Balance of payments","hl":false,"p":["purchases of foreign shares, bonds and other financial assets","by investors based in the home country."]},{"term":"Portfolio investment","unit":4,"topic":"4.6 Balance of payments","hl":false,"p":["the purchase of shares, bonds and other financial assets","to earn a return, without gaining control of the business."]},{"term":"Profit repatriation","unit":4,"topic":"4.6 Balance of payments","hl":false,"p":["the transfer of profits earned by a firm abroad","back to the country where the firm is based."],"review":true},{"term":"Remittances","unit":4,"topic":"4.6 Balance of payments","hl":false,"p":["money sent by people working abroad","to family or others back home."]},{"term":"Reserve assets","unit":4,"topic":"4.6 Balance of payments","hl":false,"p":["foreign currency and gold that a central bank keeps,","which it can use to influence the exchange rate or pay debts abroad."]},{"term":"Terms of trade","unit":4,"topic":"4.6 Balance of payments","hl":false,"p":["the ratio of a country's export prices to its import prices,","shown as an index number."]},{"term":"Trade deficit","unit":4,"topic":"4.6 Balance of payments","hl":false,"p":["a situation where a country spends more on imports of goods","than it earns from exports of goods."]},{"term":"Trade surplus","unit":4,"topic":"4.6 Balance of payments","hl":false,"p":["a situation where a country earns more from exports of goods","than it spends on imports of goods."]},{"term":"Ecological resilience","unit":4,"topic":"4.7 Sustainable development","hl":false,"p":["how well an ecosystem can resist damage from a shock","and return to health afterwards."]},{"term":"Economic resilience","unit":4,"topic":"4.7 Sustainable development","hl":false,"p":["how well an economy can withstand sudden shocks","and keep working and recover afterwards."]},{"term":"Intergenerational equity","unit":4,"topic":"4.7 Sustainable development","hl":false,"p":["fairness between people living today and future generations,","so that today's choices do not leave the future worse off."]},{"term":"Resilience","unit":4,"topic":"4.7 Sustainable development","hl":false,"p":["how well a person, community or system copes with change","and keeps developing after a shock."]},{"term":"Social resilience","unit":4,"topic":"4.7 Sustainable development","hl":false,"p":["how well a community can cope with a social or environmental shock","and adapt so that it keeps doing well."]},{"term":"Sustainable development","unit":4,"topic":"4.7 Sustainable development","hl":false,"p":["development that meets people's needs today","without compromising the ability of future generations to meet their own needs."]},{"term":"UN sustainable development goals (SDGs)","unit":4,"topic":"4.7 Sustainable development","hl":false,"p":["the 17 goals agreed by the United Nations in 2015","to end poverty, reduce inequality and protect the planet by 2030."]},{"term":"Adult literacy rate","unit":4,"topic":"4.8 Measuring development","hl":false,"p":["the percentage of people aged 15 and over","who can read and write."]},{"term":"Composite indicator","unit":4,"topic":"4.8 Measuring development","hl":false,"p":["a measure of development that combines several single indicators","into one index number."]},{"term":"Development","unit":4,"topic":"4.8 Measuring development","hl":false,"p":["an improvement in people's well-being","through less poverty, better access to basic needs and fairer incomes."]},{"term":"Economic development","unit":4,"topic":"4.8 Measuring development","hl":false,"p":["a broad rise in living standards,","including less poverty, better health and education, and more freedom of choice."]},{"term":"Economic indicators","unit":4,"topic":"4.8 Measuring development","hl":false,"p":["measures of development based on economic data,","used to compare countries' levels of income and output."],"review":true},{"term":"Education indicators","unit":4,"topic":"4.8 Measuring development","hl":false,"p":["measures of development based on edu ate","unit":4,"topic":"4.8 Measuring development","hl":false,"p":["the number of babies who die before their first birthday","for every 1,000 live births in a year."]},{"term":"Kuznets curve","unit":4,"topic":"4.8 Measuring development","hl":false,"p":["a curve showing the idea that income inequality first rises as a country industrialises","and then falls as it develops further."]},{"term":"Life expectancy at birth","unit":4,"topic":"4.8 Measuring development","hl":false,"p":["how long, on average, a newborn baby can expect to live","if current death rates stay the same."]},{"term":"Mean years of schooling","unit":4,"topic":"4.8 Measuring development","hl":false,"p":["the average years of education completed","by adults aged 25 and over."]},{"term":"Net enrolment in primary education","unit":4,"topic":"4.8 Measuring development","hl":false,"p":["the share of children of official primary-school age","who are actually enrolled in it."],"review":true},{"term":"Single indicator","unit":4,"topic":"4.8 Measuring development","hl":false,"p":["a measure of development","that looks at just one variable."]},{"term":"Universal health coverage","unit":4,"topic":"4.8 Measuring development","hl":false,"p":["a situation where everyone in a country can get the health care they need","without suffering financial hardship."]},{"term":"Appropriate technology","unit":4,"topic":"4.9 Barriers to economic growth and/or economic development","hl":false,"p":["technology chosen to suit the people who will use it,","matching their skills, resources and environment."]},{"term":"Bureaucracy","unit":4,"topic":"4.9 Barriers to economic growth and/or economic development","hl":false,"p":["slow and overly complicated official procedures","that people and firms must go through to get things done."]},{"term":"Capital flight","unit":4,"topic":"4.9 Barriers to economic growth and/or economic development","hl":false,"p":["a large movement of money and assets away from a country","to places owners see a e,"p":["small loans, savings and other financial services for poor people","who cannot use ordinary banks."]},{"term":"Multilateral development assistance","unit":4,"topic":"4.10 Economic growth and/or economic development strategies","hl":false,"p":["development aid given by international organisations","that are funded by many countries together."]},{"term":"Multinational corporation (MNC)","unit":4,"topic":"4.10 Economic growth and/or economic development strategies","hl":false,"p":["a firm that produces in more than one country","and is run from a head office in its home country."]},{"term":"Non-government organisation (NGO)","unit":4,"topic":"4.10 Economic growth and/or economic development strategies","hl":false,"p":["a non-profit organisation that is independent of government","and works for development, humanitarian or environmental aims."]},{"term":"Official Development Assistance (ODA)","unit":4,"topic":"4.10 Economic growth and/or economic development strategies","hl":false,"p":["development aid that comes from governments","rather than private donors."]},{"term":"Official foreign aid","unit":4,"topic":"4.10 Economic growth and/or economic development strategies","hl":false,"p":["aid that comes from a foreign government or an international agency","rather than from private donors."]},{"term":"Patient capital","unit":4,"topic":"4.10 Economic growth and/or economic development strategies","hl":false,"p":["long-term investment in a business","where the investor accepts waiting years for a return."]},{"term":"Philanthropy","unit":4,"topic":"4.10 Economic growth and/or economic development strategies","hl":false,"p":["giving money, time or resources voluntarily","to improve other people's welfare."]},{"term":"Programme aid","unit":4,"topic":"4.10 Economic growth and/or economic development strategies","hl":false,"p":["aid that supports a whole sector of the economy","over the long term rather than a single project."]},{"term":"Project aid","unit":4,"topic":"4. const $ = id => document.getElementById(id);
const LENGTHS = [6, 12, 'All'];
const PER_BOARD = 3;
const state = {
  picks: new Set(), length: 6, pool: [],
  boards: [], b: 0, score: 0, scored: 0, missed: [],
  frags: [], placed: {}, sel: null, locked: false,
};

function shuffle(a) { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
const clean = s => s.replace(/[,.;:]\s*$/, '');
function esc(s) { return s.replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]); }
function fullHTML(d) {
  const rest = [d.p[0].charAt(0).toUpperCase() + d.p[0].slice(1), ...d.p.slice(1)];
  return `<strong>${esc(d.term)}</strong>${revTag(d)}: ${rest.map(esc).join(' <span class="sep">|</span> ')}`;
}
// ---------- review again ----------
// Terms a student marks to see again, kept in this browser per subject (a Google sign-in may replace this later:
// only loadAgain and saveAgain touch storage).
const SUBJECT = 'economics';
const AGAIN_KEY = 'dd-again-' + SUBJECT;
const keyOf = d => `${d.unit}|${d.term}`;
function loadAgain() { try { return new Set(JSON.parse(localStorage.getItem(AGAIN_KEY)) || []); } catch { return new Set(); } }
function saveAgain() { try { localStorage.setItem(AGAIN_KEY, JSON.stringify([...again])); } catch {} }
const again = loadAgain();
function againBtn(d) {
  const on = again.has(keyOf(d));
  return `<button type="button" class="again" data-k="${esc(keyOf(d))}" aria-pressed="${on}">${on ? '★' : '☆'} Review again</button>`;
}
document.addEventListener('click', e => {
  const b = e.target.closest('.again');
  if (!b) return;
  const k = b.dataset.k;
  again.has(k) ? again.delete(k) : again.add(k);
  saveAgain();
  for (const x of document.querySelectorAll('.again')) if (x.dataset.k === k) x.outerHTML = againBtn(DEFS.find(d => keyOf(d) === k));
  if (!$('setup').hidden) { renderAgain(); syncSetup(); }
});
// start page: Whole course plus one button per unit (no subtopics), and a fold-out list
function renderAgain() {
  const saved = DEFS.filter(d => again.has(keyOf(d)));
  $('againBlock').hidden = !saved.length;
  const wrap = $('againChips'), list = $('againList');
  wrap.innerHTML = '';
  if (!saved.length) { list.hidden = true; return; }
  const groups = [['Whole course', saved]];
  for (const u of [...new Set(saved.map(d => d.unit))].sort((a, b) => a - b)) groups.push([UNITS[u].split(':')[0], saved.filter(d => d.unit === u)]);
  for (const [name, g] of groups) {
    const b = chip('whole againpick', `${esc(name)}<span class="n">${g.length}</span>`, () => pickAll(g, !isFull(g)));
    b._g = g; wrap.append(b);
  }
  const fold = document.createElement('button'); fold.className = 'fold'; fold.setAttribute('aria-expanded', !list.hidden);
  fold.innerHTML = 'List <span class="chev" aria-hidden="true">▾</span>';
  fold.onclick = () => { list.hidden = !list.hidden; fold.setAttribute('aria-expanded', !list.hidden); };
  wrap.append(fold);
  list.innerHTML = saved.map(d => `<li>${fullHTML(d)}<br>${againBtn(d)}</li>`).join('');
}

// flagged in the bank for Sam to double-check: still played, with a small note for students
const revTag = d => d.review ? '<span class="rev" title="This definition is still being checked, so it may change.">subject to review</span>' : '';
// split a list of terms into boards of 3 (a leftover of 1 or 2 is spread over the last boards)
function chunk(list) {
  const n = Math.max(1, Math.floor(list.length / PER_BOARD));
  const out = Array.from({ length: n }, () => []);
  list.forEach((x, i) => out[i < n * PER_BOARD ? Math.floor(i / PER_BOARD) : n - 1 - (i - n * PER_BOARD) % n].push(x));
  return out;
}

// ---------- setup ----------
function topicsByUnit() {
  const m = new Map();
  for (const d of DEFS) {
    if (!m.has(d.unit)) m.set(d.unit, new Map());
    const t = m.get(d.unit); t.set(d.topic, (t.get(d.topic) || 0) + 1);
  }
  return [...m.entries()].sort((a, b) => a[0] - b[0]);
}
const HL_TOPICS = new Set([...new Set(DEFS.map(d => d.topic))].filter(t => DEFS.every(d => d.topic !== t || d.hl)));
// Picks are single terms, because some HL terms sit inside SL subtopics.
// A group (unit or subtopic) is "full" when every term is picked, "SL" when every SL term is picked and no HL one.
const isFull = g => g.every(d => state.picks.has(d));
const isSL = g => g.some(d => !d.hl) && g.every(d => state.picks.has(d) === !d.hl);
const pickAll = (g, on) => { for (const d of g) on ? state.picks.add(d) : state.picks.delete(d); };
state.level = {};   // per unit: 'SL' after Whole unit SL, so subtopics tapped after it add SL terms only
function chip(cls, html, onclick) {
  const b = document.createElement('button'); b.className = 'chip ' + cls; b.innerHTML = html;
  b.onclick = () => { onclick(); syncSetup(); }; return b;
}
function buildPicker() {
  const wrap = $('units'); wrap.innerHTML = '';
  for (const [u, topics] of topicsByUnit()) {
    const unit = DEFS.filter(d => d.unit === u), sl = unit.filter(d => !d.hl);
    const div = document.createElement('div'); div.className = 'unit'; div.dataset.u = u;
    div.innerHTML = `<h3>${esc(UNITS[u])}</h3><div class="wholes"></div><div class="chips" hidden></div>`;
    const wholes = div.querySelector('.wholes'), subs = div.querySelector('.chips');
    const mixed = sl.length < unit.length;   // no HL terms (Unit 1): one plain Whole unit button
    if (mixed) wholes.append(chip('whole sl', `Whole unit SL<span class="n">${sl.length}</span>`, () => {
      const on = isSL(unit); pickAll(unit, false); if (!on) pickAll(sl, true); state.level[u] = 'SL';
    }));
    wholes.append(chip('whole hl', `Whole unit${mixed ? ' HL' : ''}<span class="n">${unit.length}</span>`, () => {
      pickAll(unit, !isFull(unit)); state.level[u] = 'HL';
    }));
    const fold = document.createElement('button'); fold.className = 'fold'; fold.setAttribute('aria-expanded', 'false');
    fold.innerHTML = 'Subtopics <span class="chev" aria-hidden="true">▾</span>';
    fold.onclick = () => { const open = subs.hidden; subs.hidden = !open; fold.setAttribute('aria-expanded', open); };
    wholes.append(fold);
    for (const t of [...topics.keys()].sort((a, b) => a.localeCompare(b, undefined, { numeric: true }))) {
      const g = unit.filter(d => d.topic === t);
      const b = chip('sub', `${esc(t)}${HL_TOPICS.has(t) ? '<span class="hl">HL</span>' : ''}<span class="n"></span>`, () => {
        if (isFull(g) || isSL(g)) return pickAll(g, false);
        pickAll(state.level[u] === 'SL' && g.some(d => !d.hl) ? g.filter(d => !d.hl) : g, true);
      });
      b._g = g; subs.append(b);
    }
    div._unit = unit; wrap.append(div);
  }
}
function syncSetup() {
  for (const div of $('units').querySelectorAll('.unit')) {
    const unit = div._unit;
    div.querySelector('.whole.hl').setAttribute('aria-pressed', isFull(unit));
    div.querySelector('.whole.sl')?.setAttribute('aria-pressed', isSL(unit) && !isFull(unit));
    for (const b of div.querySelectorAll('.chip.sub')) {
      const on = isFull(b._g) || isSL(b._g);
      b.setAttribute('aria-pressed', on);
      b.querySelector('.n').textContent = on ? b._g.filter(d => state.picks.has(d)).length : b._g.length;
    }
  }
  for (const b of $('againChips').querySelectorAll('.chip')) b.setAttribute('aria-pressed', isFull(b._g));
  const picked = state.picks.size;
  $('picked').textContent = picked ? `${picked} term${picked === 1 ? '' : 's'} picked` : 'Pick a unit or some topics';
  $('start').disabled = picked === 0;
}
function renderSetup() {
  if (!$('units').firstChild) buildPicker();
  renderAgain();
  syncSetup();
  const seg = $('lengths'); seg.innerHTML = '';
  for (const L of LENGTHS) {
    const b = document.createElement('button'); b.textContent = L;
    b.setAttribute('aria-pressed', state.length === L);
    b.onclick = () => { state.length = L; renderSetup(); };
    seg.appendChild(b);
  }
}
function show(id) { for (const s of ['setup', 'play', 'end']) $(s).hidden = s !== id; window.scrollTo(0, 0); }

// items: [{d, extra}] ; extra terms fill a board but are not scored
function startRound(items) {
  state.boards = chunk(items); state.b = 0; state.score = 0; state.missed = [];
  state.scored = items.filter(x => !x.extra).length;
  show('play'); renderBoard();
}
$('start').onclick = () => {
  state.pool = DEFS.filter(d => state.picks.has(d));
  const list = shuffle(state.pool);
  const items = (state.length === 'All' ? list : list.slice(0, state.length)).map(d => ({ d }));
  startRound(padBoard(items));
};
// a board needs 3 terms: if too few were picked, borrow unscored ones from the same unit
function padBoard(items) {
  if (items.length >= PER_BOARD) return items;
  const units = new Set(items.map(x => x.d.unit)), have = new Set(items.map(x => x.d));
  const fill = shuffle(DEFS.filter(d => !have.has(d) && units.has(d.unit)));
  const out = items.slice();
  while (out.length < PER_BOARD && fill.length) out.push({ d: fill.pop(), extra: true });
  return shuffle(out);
}

// ---------- board ----------
function renderBoard() {
  const items = state.boards[state.b];
  state.frags = shuffle(items.flatMap((it, t) => it.d.p.map((p, part) => ({ t, part, text: clean(p) })))).map((f, id) => ({ ...f, id }));
  state.placed = {}; state.sel = null; state.locked = false;
  $('progress').textContent = `${state.b + 1} of ${state.boards.length}`;
  const topics = [...new Set(items.map(it => it.d.topic))];
  $('qtopic').textContent = topics.join(' · ');
  $('board').classList.remove('locked');
  $('check').hidden = false; $('next').hidden = true;
  $('terms').innerHTML = items.map((it, t) => `<div class="term" data-t="${t}"><div class="head"><h3>${esc(it.d.term)}${revTag(it.d)}</h3>${againBtn(it.d)}</div>${
    it.d.p.map((_, i) => `<button type="button" class="slot" data-slot="${t}-${i}" aria-label="${esc(it.d.term)}, piece ${i + 1}"></button>`).join('')
  }<p class="fix" hidden></p></div>`).join('');
  renderPieces();
}
function fragHTML(f) {
  return `<button type="button" class="frag" data-f="${f.id}"><span class="grip" aria-hidden="true">&#8942;&#8942;</span><span class="txt">${esc(f.text)}</span><span class="mark"></span></button>`;
}
const slotOf = fid => Object.keys(state.placed).find(k => state.placed[k] === fid);
function renderPieces() {
  document.querySelectorAll('#terms .slot').forEach(s => {
    const fid = state.placed[s.dataset.slot];
    s.innerHTML = fid === undefined ? '' : fragHTML(state.frags[fid]);
    s.classList.toggle('filled', fid !== undefined);
    s.classList.toggle('sel', state.sel === s.dataset.slot);
  });
  const loose = state.frags.filter(f => slotOf(f.id) === undefined);
  $('pool').innerHTML = loose.map(fragHTML).join('');
  if (typeof state.sel === 'number') document.querySelector(`.frag[data-f="${state.sel}"]`)?.classList.add('sel');
  $('left').textContent = loose.length ? `${loose.length} left` : '';
  $('score').textContent = `${state.score} right`;
  $('check').disabled = loose.length > 0 || state.locked;
}
// put piece fid into slot; whatever was there goes where fid came from
function place(fid, slot) {
  const from = slotOf(fid), occupant = state.placed[slot];
  if (from === slot) return;
  state.placed[slot] = fid;
  if (from !== undefined) { if (occupant !== undefined) state.placed[from] = occupant; else delete state.placed[from]; }
}
function unplace(fid) { const from = slotOf(fid); if (from !== undefined) delete state.placed[from]; }

// tap to select, tap to place (works in either order).
// Pointer taps on pieces are handled in endDrag; the click listener covers keyboard and taps on boxes and the pool.
let suppressClick = false, lastTap = { f: -1, t: 0 };
$('board').addEventListener('click', e => {
  if (state.locked) return;
  if (suppressClick) { suppressClick = false; return; }
  const f = e.target.closest('.frag');
  if (f && +f.dataset.f === lastTap.f && Date.now() - lastTap.t < 600) return; // already handled on pointerup
  tap(e.target);
});
function tap(target) {
  const fragEl = target.closest('.frag'), slotEl = target.closest('.slot');
  const sel = state.sel;
  if (fragEl) {
    const fid = +fragEl.dataset.f;
    const inSlot = slotEl ? slotEl.dataset.slot : null;
    if (typeof sel === 'string' && !inSlot) { place(fid, sel); state.sel = null; }
    else if (typeof sel === 'number' && sel !== fid && inSlot) { place(sel, inSlot); state.sel = null; }
    else if (typeof sel === 'number' && sel !== fid && !inSlot && slotOf(sel) !== undefined) {
      // a placed piece is selected and a loose one tapped: swap them
      place(fid, slotOf(sel)); state.sel = null;
    }
    else state.sel = sel === fid ? null : fid;
  } else if (slotEl) {
    const slot = slotEl.dataset.slot;
    if (typeof sel === 'number') { place(sel, slot); state.sel = null; }
    else state.sel = sel === slot ? null : slot;
  } else if (target.closest('.poolwrap') && typeof sel === 'number') {
    unplace(sel); state.sel = null;
  } else return;
  renderPieces();
}

// drag: mouse from anywhere on a piece, touch only from its grip (so the page still scrolls)
let drag = null;
$('board').addEventListener('pointerdown', e => {
  const fragEl = e.target.closest('.frag');
  if (!fragEl || state.locked || e.button > 0) return;
  if (e.pointerType !== 'mouse' && !e.target.closest('.grip')) return;
  drag = { fid: +fragEl.dataset.f, el: fragEl, x: e.clientX, y: e.clientY, id: e.pointerId, on: false, ghost: null, over: null };
  fragEl.setPointerCapture(e.pointerId);
});
function startDrag(e) {
  const r = drag.el.getBoundingClientRect();
  const g = drag.el.cloneNode(true); g.classList.add('ghost'); g.classList.remove('sel');
  g.style.width = r.width + 'px'; g.style.left = r.left + 'px'; g.style.top = r.top + 'px';
  drag.dx = e.clientX - r.left; drag.dy = e.clientY - r.top;
  document.body.appendChild(g);
  drag.ghost = g; drag.on = true; drag.el.classList.add('lifted');
  autoScroll();
}
function targetAt(x, y) {
  const el = document.elementFromPoint(x, y);
  if (!el) return null;
  return el.closest('.slot') || el.closest('.poolwrap');
}
document.addEventListener('pointermove', e => {
  if (!drag || e.pointerId !== drag.id) return;
  if (!drag.on) { if (Math.hypot(e.clientX - drag.x, e.clientY - drag.y) < 6) return; startDrag(e); }
  drag.lastY = e.clientY; drag.lastX = e.clientX;
  drag.ghost.style.left = (e.clientX - drag.dx) + 'px';
  drag.ghost.style.top = (e.clientY - drag.dy) + 'px';
  const t = targetAt(e.clientX, e.clientY);
  if (t !== drag.over) {
    drag.over?.classList.remove('over'); (t?.classList.contains('poolwrap') ? $('pool') : t)?.classList.add('over');
    $('pool').classList.toggle('over', !!t?.classList.contains('poolwrap'));
    drag.over = t;
  }
});
function endDrag(e, cancel) {
  if (!drag || e.pointerId !== drag.id) return;
  const d = drag; drag = null;
  if (!d.on) { if (!cancel) { lastTap = { f: d.fid, t: Date.now() }; tap(d.el); } return; }
  d.ghost.remove(); d.el.classList.remove('lifted');
  document.querySelectorAll('.over').forEach(x => x.classList.remove('over'));
  suppressClick = true; setTimeout(() => { suppressClick = false; }, 0);
  if (cancel) return renderPieces();
  const t = targetAt(e.clientX, e.clientY);
  if (t?.classList.contains('slot')) place(d.fid, t.dataset.slot);
  else if (t) unplace(d.fid);
  state.sel = null;
  renderPieces();
}
document.addEventListener('pointerup', e => endDrag(e, false));
document.addEventListener('pointercancel', e => endDrag(e, true));
// scroll the page while a piece is held near the top or bottom edge
function autoScroll() {
  if (!drag || !drag.on) return;
  const y = drag.lastY ?? drag.y, edge = 70;
  const v = y < edge ? -(edge - y) / 4 : y > innerHeight - edge ? (y - (innerHeight - edge)) / 4 : 0;
  if (v) window.scrollBy(0, v);
  requestAnimationFrame(autoScroll);
}

$('check').onclick = () => {
  const items = state.boards[state.b];
  state.locked = true; state.sel = null;
  renderPieces();
  $('board').classList.add('locked');
  items.forEach((it, t) => {
    let right = true;
    it.d.p.forEach((_, i) => {
      const slot = `${t}-${i}`, f = state.frags[state.placed[slot]];
      const ok = f.t === t && f.part === i;
      if (!ok) right = false;
      const el = document.querySelector(`.slot[data-slot="${slot}"] .frag`);
      el.classList.add(ok ? 'ok' : 'bad');
      el.querySelector('.mark').textContent = ok ? '✓' : '✗';
      el.querySelector('.mark').setAttribute('aria-label', ok ? 'Right' : 'Wrong');
    });
    const card = document.querySelector(`.term[data-t="${t}"]`);
    card.classList.add(right ? 'right' : 'wrong');
    if (!right) { const fx = card.querySelector('.fix'); fx.innerHTML = fullHTML(it.d); fx.hidden = false; }
    if (!it.extra) { if (right) state.score++; else state.missed.push(it.d); }
  });
  $('score').textContent = `${state.score} right`;
  $('check').hidden = true; $('next').hidden = false;
  $('next').textContent = state.b === state.boards.length - 1 ? 'See score' : 'Next';
  $('next').focus({ preventScroll: true });
};
$('next').onclick = () => {
  state.b++;
  if (state.b < state.boards.length) { renderBoard(); window.scrollTo(0, 0); } else renderEnd();
};

// ---------- end ----------
function renderEnd() {
  show('end');
  $('final').textContent = `${state.score} / ${state.scored}`;
  const m = state.missed;
  $('missedWrap').hidden = m.length === 0;
  $('retry').hidden = m.length === 0;
  $('missed').innerHTML = m.map(d => `<li>${fullHTML(d)}<br>${againBtn(d)}</li>`).join('');
}
// retry missed: if fewer than 3 were missed, other terms from the same topics fill the board (not scored)
$('retry').onclick = () => {
  startRound(padBoard(shuffle(state.missed).map(d => ({ d }))));
};
$('again').onclick = () => $('start').onclick();
$('change').onclick = () => { show('setup'); renderSetup(); };

renderSetup();
</script>
</body>
</html>
