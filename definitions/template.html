<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Definition Drill: {{SUBJECT}}</title>
<meta name="description" content="Rebuild IB style {{SUBJECT}} definitions piece by piece.">
<link rel="icon" href="/geocornsmall.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Fraunces:opsz,wght@9..144,500;9..144,700&display=swap" rel="stylesheet">
<style>
:root {
  --masthead: #1e2a4a; --masthead-ink: #fff; --masthead-sub: #c9d2ea;
  --amber: #f4a629; --amber-ink: #8a5a00; --amber-soft: #fdf0d8;
  --bg: #f7f6f2; --surface: #fffdf8; --surface-2: #efede6; --line: #e3e0d8;
  --ink: #1e2a4a; --muted: #5b6680; --bm: {{COLOUR}};
  --ok: #18634f; --ok-soft: #d9eee6; --bad: #8a1c1c; --bad-soft: #f8e1e1;
  --pale: #dcd8cc;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink);
  font: 18px/1.5 'Atkinson Hyperlegible', -apple-system, 'Segoe UI', sans-serif; }
h1, h2, h3 { font-family: 'Fraunces', Georgia, serif; font-weight: 600; font-variant-numeric: lining-nums; margin: 0; }
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 3px solid var(--amber); outline-offset: 2px; }

header { background: var(--masthead); color: var(--masthead-ink); border-bottom: 4px solid var(--amber); }
.mast { max-width: 1100px; margin: 0 auto; padding: 12px 16px; display: flex; align-items: center; gap: 12px; }
.mast img { width: 48px; height: 48px; }
.mast h1 { font-size: 1.5rem; line-height: 1.1; }
.mast a { color: inherit; text-decoration: none; }
.mast h1 a:hover, .mast a.sub:hover { text-decoration: underline; }
.mast img { display: block; }
.mast .sub { display: block; font-size: 0.72rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--masthead-sub); }
.mast nav { margin-left: auto; display: flex; gap: 16px; }
.mast nav a { color: var(--masthead-ink); font-size: 0.9rem; text-decoration: none; }
.mast nav a:hover { text-decoration: underline; }

main { max-width: 1100px; margin: 0 auto; padding: 20px 16px 40px; }
#setup, #end, #gloss { max-width: 760px; }
.label { font-size: 0.75rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); margin: 0 0 8px; }
.lede { margin: 0 0 20px; color: var(--muted); }
section.block { margin-bottom: 24px; }

.btn { border-radius: 10px; padding: 12px 20px; min-height: 48px; border: 1px solid var(--line); background: var(--surface); }
.btn.primary { background: var(--masthead); color: #fff; border-color: var(--masthead); font-weight: 700; }
.btn:disabled { opacity: 0.45; cursor: default; }
.row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }

/* topic picker */
.unit { margin-bottom: 22px; }
.unit h3 { font-size: 1.1rem; color: var(--bm); margin-bottom: 8px; }
.wholes { display: grid; grid-template-columns: repeat(2, minmax(0, 220px)) auto; justify-content: start; gap: 8px; }
@media (max-width: 560px) { .wholes { grid-template-columns: 1fr 1fr; } .wholes .fold { grid-column: 1 / -1; justify-self: start; } .chip.whole { padding: 10px; white-space: nowrap; } }
.chips { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 8px; margin-top: 8px; }
.chip { border-radius: 8px; padding: 10px 14px; min-height: 48px; border: 1px solid var(--line); background: var(--surface); text-align: left;
  display: flex; align-items: center; gap: 8px; }
.chip.whole { font-weight: 700; }
.chip .hl { font-size: 0.72rem; letter-spacing: 0.08em; color: var(--amber-ink); font-weight: 700; }
.chip .n { color: var(--muted); font-size: 0.85rem; margin-left: auto; padding-left: 6px; }
.chip[aria-pressed="true"] { background: var(--bm); border-color: var(--bm); color: #fff; }
.chip[aria-pressed="true"] .hl { color: var(--amber); }
.chip[aria-pressed="true"] .n { color: var(--masthead-sub); }
.fold { border: 0; background: none; color: var(--bm); min-height: 48px; padding: 10px 6px; display: flex; align-items: center; gap: 6px; }
.fold .chev { display: inline-block; transition: transform 0.15s; }
.fold[aria-expanded="true"] .chev { transform: rotate(180deg); }
.picked { color: var(--muted); }
.seg { display: flex; }
.seg button { border: 1px solid var(--line); background: var(--surface); padding: 10px 18px; min-height: 48px; min-width: 64px; margin-left: -1px; }
.seg button:first-child { border-radius: 10px 0 0 10px; margin-left: 0; }
.seg button:last-child { border-radius: 0 10px 10px 0; }
.seg button[aria-pressed="true"] { background: var(--masthead); border-color: var(--masthead); color: #fff; position: relative; }

/* board */
.top { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 4px; }
.top .score { font-weight: 700; }
.topic { color: var(--bm); margin: 0 0 14px; font-size: 0.9rem; }
.board { display: grid; gap: 20px; margin-bottom: 16px; }
@media (min-width: 900px) {
  .board { grid-template-columns: 1fr 1fr; align-items: start; }
  .poolwrap { position: sticky; top: 12px; }
}
.terms { display: flex; flex-direction: column; gap: 14px; }
.term { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px; }
.term h3 { font-size: 1.15rem; color: var(--bm); margin: 0 0 8px; }
.slot { display: block; width: 100%; min-height: 56px; border: 2px dashed var(--line); border-radius: 10px;
  background: var(--bg); margin-top: 8px; padding: 0; text-align: left; }
.slot:empty::after { content: ''; display: block; min-height: 52px; }
.slot.sel, .slot.over { border-color: var(--amber); background: var(--amber-soft); }
.slot.filled { border-style: solid; border-color: transparent; background: none; }
.fix { margin: 10px 0 0; font-size: 0.95rem; color: var(--ink); border-top: 1px solid var(--line); padding-top: 8px; }
.fix b { color: var(--ok); }
.term.right { border-color: var(--ok); }
.term.wrong { border-color: var(--bad); }

.poolwrap .label { display: flex; justify-content: space-between; }
.pool { display: flex; flex-direction: column; gap: 10px; min-height: 64px; border-radius: 12px; padding: 4px; }
.pool.over { background: var(--amber-soft); }
.pool:empty::after { content: 'All placed'; color: var(--muted); padding: 16px 8px; }

.frag { display: flex; width: 100%; align-items: stretch; gap: 0; text-align: left; background: #fff;
  border: 1px solid var(--line); border-radius: 10px; padding: 0; line-height: 1.4; user-select: none; -webkit-user-select: none; }
.frag .grip { flex: none; width: 34px; display: flex; align-items: center; justify-content: center; color: var(--muted);
  touch-action: none; cursor: grab; font-size: 1.1rem; border-right: 1px solid var(--line); border-radius: 10px 0 0 10px; background: var(--surface-2); }
.frag .txt { flex: 1; padding: 10px 12px; }
.frag .mark { flex: none; width: 30px; display: none; align-items: center; justify-content: center; font-weight: 700; }
.frag.sel { border-color: var(--amber); outline: 2px solid var(--amber); outline-offset: -2px; background: var(--amber-soft); }
.frag.lifted { opacity: 0.35; }
@media (pointer: fine) { .frag { cursor: grab; } }
.ghost { position: fixed; z-index: 50; pointer-events: none; margin: 0; border-color: var(--masthead); opacity: 0.95; }
.locked .frag { cursor: default; }
.locked .frag .grip { display: none; }
.locked .frag .mark { display: flex; }
.frag.ok { background: var(--ok-soft); border-color: var(--ok); }
.frag.ok .mark { color: var(--ok); }
.frag.bad { background: var(--bad-soft); border-color: var(--bad); }
.frag.bad .mark { color: var(--bad); }
.locked #pool .frag { opacity: 0.55; }

/* end */
.big { font-family: 'Fraunces', Georgia, serif; font-size: 3rem; font-weight: 700; line-height: 1; margin: 4px 0 16px; }
.missed { list-style: none; padding: 0; margin: 0 0 20px; }
.missed li { border-top: 1px solid var(--line); padding: 12px 0; }
.missed li:last-child { border-bottom: 1px solid var(--line); }
.sep { color: var(--amber-ink); font-weight: 700; padding: 0 2px; }
/* review again: per-student saved terms */
.head { display: flex; align-items: flex-start; gap: 8px; margin: 0 0 8px; }
.head h3 { margin: 0; flex: 1; }
.again { flex: none; border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 4px 10px; min-height: 36px;
  font-size: 0.82rem; color: var(--muted); white-space: nowrap; }
.again[aria-pressed="true"] { background: var(--amber-soft); border-color: var(--amber); color: var(--amber-ink); font-weight: 700; }
.missed li .again { margin-top: 6px; }
.againchips { display: flex; flex-wrap: wrap; gap: 8px; }
.againchips .chip { min-width: 150px; }
#againList { margin-top: 10px; }
.rev { display: inline-block; font-family: 'Atkinson Hyperlegible', sans-serif; font-size: 0.72rem; font-weight: 400; letter-spacing: 0.04em;
  color: var(--amber-ink); background: var(--amber-soft); border-radius: 4px; padding: 1px 6px; margin-left: 6px; vertical-align: middle; }

/* progress: each term's last result, right (subject colour), missed (amber) or not yet (pale); no numbers */
.chip.sub { position: relative; padding-bottom: 16px; }
.strip { position: absolute; left: 14px; right: 14px; bottom: 6px; height: 4px; display: flex; gap: 1px; }
.strip i { flex: 1; border-radius: 1px; background: var(--pale); }
.strip i.r { background: var(--bm); }
.strip i.m { background: var(--amber); }
.chip[aria-pressed="true"] .strip i { background: rgba(255, 255, 255, 0.3); }
.chip[aria-pressed="true"] .strip i.r { background: #fff; }
.chip[aria-pressed="true"] .strip i.m { background: var(--amber); }
.ubar { display: flex; height: 6px; max-width: 460px; border-radius: 3px; overflow: hidden; background: var(--pale); margin: 0 0 10px; }
.ubar i.r { background: var(--bm); }
.ubar i.m { background: var(--amber); }
.dot { flex: none; display: inline-block; width: 11px; height: 11px; border-radius: 50%; background: var(--pale); }
.dot.r { background: var(--bm); }
.dot.m { background: var(--amber); }
.tabs { margin-bottom: 20px; }

/* glossary */
.filters { margin-bottom: 20px; }
.filters button { display: inline-flex; align-items: center; gap: 8px; border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 8px 14px; min-height: 44px; }
.filters button[aria-pressed="true"] { border-color: var(--ink); outline: 1px solid var(--ink); font-weight: 700; }
.gunit { margin-bottom: 22px; }
.gunit h3 { font-size: 1.1rem; color: var(--bm); margin-bottom: 8px; }
.gloss summary { list-style: none; cursor: pointer; display: flex; align-items: center; gap: 10px; }
.gloss summary::-webkit-details-marker { display: none; }
.gtopic { border-top: 1px solid var(--line); }
.gtopic:last-child { border-bottom: 1px solid var(--line); }
.gtopic > summary { min-height: 48px; padding: 8px 2px; }
.gtopic > summary .strip { position: static; width: 110px; flex: none; margin-left: auto; }
.gtopic > summary .chev { color: var(--bm); transition: transform 0.15s; }
.gtopic[open] > summary .chev { transform: rotate(180deg); }
.gtopic ul { list-style: none; margin: 0 0 10px; padding: 0 0 0 4px; }
.gterm > summary { min-height: 40px; padding: 6px 0; }
.gdef { margin: 0 0 10px 21px; padding: 8px 12px; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; }
.gdef .again { margin-top: 8px; }
.none { color: var(--muted); }
.link { border: 0; background: none; padding: 6px 0; color: var(--muted); font-size: 0.8rem; text-decoration: underline; }
.confirm { background: var(--amber-soft); border: 1px solid var(--amber); border-radius: 10px; padding: 12px; margin-bottom: 20px; }
.confirm p { margin: 0 0 8px; }

/* report a definition: deliberately quiet */
.report { font-size: 0.8rem; color: var(--muted); }
.report .link { min-height: 32px; }
.rpanel { margin-top: 6px; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; font-size: 0.9rem; }
.rpanel p { margin: 0 0 6px; }
.rpick { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 8px; }
.rpick button { border: 1px solid var(--line); background: var(--bg); border-radius: 8px; padding: 6px 10px; min-height: 40px; font-size: 0.9rem; }
.rpick button[aria-pressed="true"] { border-color: var(--bm); outline: 1px solid var(--bm); font-weight: 700; }
.rpanel textarea { width: 100%; font: inherit; border: 1px solid var(--line); border-radius: 8px; padding: 6px 8px; margin-bottom: 8px; background: #fff; }
.rpanel .btn { min-height: 40px; padding: 6px 14px; }

footer { max-width: 1100px; margin: 0 auto; padding: 16px; font-size: 0.75rem; color: var(--muted); border-top: 1px solid var(--line); }
[hidden] { display: none !important; }
@media (max-width: 480px) {
  body { font-size: 17px; }
  .mast h1 { font-size: 1.25rem; }
  .mast img { width: 40px; height: 40px; }
}
</style>
</head>
<body>
<header>
  <div class="mast">
    <a href="/definitions/" aria-label="Definition Drill: choose a subject"><img src="/geocorn.png" alt=""></a>
    <div><h1><a href="/definitions/">Definition Drill</a></h1><a class="sub" href="./">IB {{SUBJECT}}</a></div>
    <nav><a href="/">unisam.nz</a></nav>
  </div>
</header>

<main>
  <div class="seg tabs" id="tabs"><button data-v="setup" aria-pressed="true">Practise</button><button data-v="gloss" aria-pressed="false">Glossary</button></div>
  <div id="setup">
    <p class="lede">{{LEDE}}</p>
    <section class="block" id="againBlock" hidden>
      <p class="label">Review again</p>
      <div class="againchips" id="againChips"></div>
    </section>
    <section class="block">
      <p class="label">Topics</p>
      <div id="units"></div>
    </section>
    <section class="block">
      <p class="label">Each board</p>
      <div class="seg" id="sizes"></div>
    </section>
    <section class="block">
      <p class="label">How many terms</p>
      <div class="seg" id="lengths"></div>
    </section>
    <div class="row"><button class="btn primary" id="start">Start</button><span class="picked"><span id="picked"></span> <span id="fresh"></span></span></div>
  </div>

  <div id="gloss" class="gloss" hidden>
    <div class="confirm" id="clearConfirm" hidden>
      <p>Clear all your progress and Review again marks for {{SUBJECT}} in this browser?</p>
      <button class="btn" id="clearYes">Yes, clear it</button>
    </div>
    <p class="label">Show only</p>
    <div class="row filters" id="filters"></div>
    <div id="gunits"></div>
    <button type="button" class="link" id="clearBtn">Clear my progress</button>
  </div>

  <div id="play" hidden>
    <div class="top"><span class="label" id="progress"></span><span class="score" id="score"></span></div>
    <p class="topic" id="qtopic"></p>
    <div class="board" id="board">
      <div class="terms" id="terms"></div>
      <div class="poolwrap"><p class="label"><span>Pieces</span><span id="left"></span></p><div class="pool" id="pool"></div></div>
    </div>
    <div class="row"><button class="btn primary" id="check" disabled>Check</button><button class="btn primary" id="next" hidden>Next</button></div>
  </div>

  <div id="end" hidden>
    <p class="label">Score</p>
    <div class="big" id="final"></div>
    <div id="missedWrap">
      <h2 style="font-size:1.2rem;margin-bottom:8px">To go over</h2>
      <ul class="missed" id="missed"></ul>
    </div>
    <div class="row">
      <button class="btn primary" id="retry">Retry missed</button>
      <button class="btn" id="again">Play again</button>
      <button class="btn" id="change">Change topics</button>
    </div>
  </div>
</main>
<footer>Built by Sam G · found a problem? tell Sam.</footer>

<script>
{{DATA}}

const $ = id => document.getElementById(id);
const LENGTHS = [6, 12, 18, 'All'];
// terms per board: 2 (6 pieces with the spares) or 3 (8 pieces); the student's last choice is remembered for both subjects
const SIZES = [2, 3];
function loadPer() { try { return +localStorage.getItem('dd-board') === 2 ? 2 : 3; } catch { return 3; } }
const state = {
  per: loadPer(), picks: new Set(), length: 6, pool: [],
  boards: [], b: 0, score: 0, scored: 0, missed: [],
  frags: [], placed: {}, sel: null, locked: false,
};

function shuffle(a) { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
const clean = s => s.replace(/[,.;:]\s*$/, '');
function esc(s) { return s.replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]); }
const defHTML = d => [d.p[0].charAt(0).toUpperCase() + d.p[0].slice(1), ...d.p.slice(1)].map(esc).join(' <span class="sep">|</span> ');
const fullHTML = d => `<strong>${esc(d.term)}</strong>${revTag(d)}: ${defHTML(d)}`;
// ---------- review again ----------
// Per-student lists kept in this browser per subject (a Google sign-in may replace this later:
// only loadSet and saveSet touch storage).
//   again: terms the student marked "Review again"
//   seen:  terms already asked this cycle, so every picked term comes up before any repeats
//   last:  each term's last result on a checked board, {key: 1 right | 0 missed} (drives the bars and glossary dots)
const SUBJECT = '{{SLUG}}';
const keyOf = d => `${d.unit}|${d.term}`;
function loadSet(name) { try { return new Set(JSON.parse(localStorage.getItem(`dd-${name}-${SUBJECT}`)) || []); } catch { return new Set(); } }
function saveSet(name, set) { try { localStorage.setItem(`dd-${name}-${SUBJECT}`, JSON.stringify([...set])); } catch {} }
function loadObj(name) { try { return JSON.parse(localStorage.getItem(`dd-${name}-${SUBJECT}`)) || {}; } catch { return {}; } }
function saveObj(name, o) { try { localStorage.setItem(`dd-${name}-${SUBJECT}`, JSON.stringify(o)); } catch {} }
const again = loadSet('again'), seen = loadSet('seen'), last = loadObj('last');
// progress state of a term: r right last time, m missed last time, n not yet
const st = d => { const v = last[keyOf(d)]; return v === 1 ? 'r' : v === 0 ? 'm' : 'n'; };
const ORDER = { r: 0, m: 1, n: 2 };
function tally(g) { const c = { r: 0, m: 0, n: 0 }; for (const d of g) c[st(d)]++; return c; }
const tallyText = c => `${c.r} right, ${c.m} missed, ${c.n} not tried yet`;   // screen readers only
// one segment per term, right first, then missed, then not yet
const stripHTML = g => g.map(st).sort((a, b) => ORDER[a] - ORDER[b]).map(s => `<i class="${s}"></i>`).join('');
function stripEl(g) { return `<span class="strip" role="img" aria-label="${tallyText(tally(g))}">${stripHTML(g)}</span>`; }
// a whole unit: one continuous bar
function fillBar(el, g) {
  const c = tally(g);
  el.innerHTML = ['r', 'm'].map(s => c[s] ? `<i class="${s}" style="width:${c[s] / g.length * 100}%"></i>` : '').join('');
  el.setAttribute('aria-label', tallyText(c));
}
const saveAgain = () => saveSet('again', again);
// n terms from the pick, never-asked first; once every picked term has been asked, those start a fresh cycle
function choose(pool, n) {
  const fresh = shuffle(pool.filter(d => !seen.has(keyOf(d))));
  if (fresh.length >= n) return fresh.slice(0, n);
  for (const d of pool) seen.delete(keyOf(d));
  saveSet('seen', seen);
  const rest = shuffle(pool.filter(d => !fresh.includes(d)));
  return shuffle([...fresh, ...rest.slice(0, n - fresh.length)]);
}
function againBtn(d) {
  const on = again.has(keyOf(d));
  return `<button type="button" class="again" data-k="${esc(keyOf(d))}" aria-pressed="${on}">${on ? '★' : '☆'} Review again</button>`;
}
document.addEventListener('click', e => {
  const b = e.target.closest('.again');
  if (!b) return;
  const k = b.dataset.k;
  again.has(k) ? again.delete(k) : again.add(k);
  saveAgain();
  for (const x of document.querySelectorAll('.again')) if (x.dataset.k === k) x.outerHTML = againBtn(DEFS.find(d => keyOf(d) === k));
  if (!$('setup').hidden) { renderAgain(); syncSetup(); }
});
// start page: Whole course plus one button per unit (no subtopics), and List (the glossary filtered to saved terms)
function renderAgain() {
  const saved = DEFS.filter(d => again.has(keyOf(d)));
  $('againBlock').hidden = !saved.length;
  const wrap = $('againChips');
  wrap.innerHTML = '';
  if (!saved.length) return;
  const groups = [['Whole course', saved]];
  for (const u of [...new Set(saved.map(d => d.unit))].sort((a, b) => a - b)) groups.push([UNITS[u].split(':')[0], saved.filter(d => d.unit === u)]);
  for (const [name, g] of groups) {
    const b = chip('whole againpick', `${esc(name)}<span class="n">${g.length}</span>`, () => pickAll(g, !isFull(g)));
    b._g = g; wrap.append(b);
  }
  const fold = document.createElement('button'); fold.className = 'fold';
  fold.innerHTML = 'List <span aria-hidden="true">→</span>';
  fold.onclick = () => { gfilter = 'a'; view('gloss'); };
  wrap.append(fold);
}

// ---------- glossary ----------
// every term by unit and subtopic, a dot for its last result, tap for the definition.
// Filters show only one state (or the saved Review again terms); tap the pressed one again to show all.
let gfilter = null;
const FILTERS = [['n', 'Not yet'], ['m', 'Missed'], ['r', 'Right'], ['a', '★ Review again']];
const gmatch = d => !gfilter || (gfilter === 'a' ? again.has(keyOf(d)) : st(d) === gfilter);
const byTopic = (a, b) => a.localeCompare(b, undefined, { numeric: true });
function renderGloss() {
  $('filters').innerHTML = FILTERS.map(([k, name]) =>
    `<button type="button" data-f="${k}" aria-pressed="${gfilter === k}">${k === 'a' ? '' : `<span class="dot ${k}"></span>`}${name}</button>`).join('');
  let html = '';
  for (const [u] of topicsByUnit()) {
    const unit = DEFS.filter(d => d.unit === u);
    let topics = '';
    for (const t of [...new Set(unit.map(d => d.topic))].sort(byTopic)) {
      const g = unit.filter(d => d.topic === t), shown = g.filter(gmatch);
      if (!shown.length) continue;
      topics += `<details class="gtopic"${gfilter ? ' open' : ''}><summary>${esc(t)}${HL_TOPICS.has(t) ? ' <span class="hl">HL</span>' : ''}${stripEl(g)}<span class="chev" aria-hidden="true">▾</span></summary><ul>${
        shown.map(d => `<li><details class="gterm"><summary><span class="dot ${st(d)}"></span><span>${esc(d.term)}${revTag(d)}</span></summary><div class="gdef">${defHTML(d)}<br>${againBtn(d)}</div></details></li>`).join('')
      }</ul></details>`;
    }
    if (topics) html += `<div class="gunit"><h3>${esc(UNITS[u])}</h3><div class="ubar" role="img" data-u="${u}"></div>${topics}</div>`;
  }
  $('gunits').innerHTML = html || '<p class="none">Nothing here yet.</p>';
  $('gunits').querySelectorAll('.ubar').forEach(el => fillBar(el, DEFS.filter(d => d.unit === +el.dataset.u)));
}
$('filters').addEventListener('click', e => {
  const b = e.target.closest('button[data-f]');
  if (!b) return;
  gfilter = gfilter === b.dataset.f ? null : b.dataset.f;
  renderGloss();
});
// Clear my progress: the first tap turns the button into "Keep my progress" and the real
// confirm appears at the top of the glossary, ignoring taps for half a second (double-click proof)
let clearArmed = 0;
function disarmClear() { clearArmed = 0; $('clearConfirm').hidden = true; $('clearBtn').textContent = 'Clear my progress'; }
$('clearBtn').onclick = () => {
  if (clearArmed) return disarmClear();
  clearArmed = Date.now(); $('clearConfirm').hidden = false; $('clearBtn').textContent = 'Keep my progress';
  window.scrollTo(0, 0);
};
$('clearYes').onclick = () => {
  if (!clearArmed || Date.now() - clearArmed < 500) return;
  again.clear(); seen.clear(); for (const k of Object.keys(last)) delete last[k];
  for (const n of ['again', 'seen', 'last']) try { localStorage.removeItem(`dd-${n}-${SUBJECT}`); } catch {}
  disarmClear(); gfilter = null; renderGloss();
};
// Practise | Glossary
function view(v) {
  disarmClear(); show(v);
  if (v === 'gloss') renderGloss(); else renderSetup();
}
$('tabs').addEventListener('click', e => { const b = e.target.closest('button[data-v]'); if (b) { if (b.dataset.v === 'gloss') gfilter = null; view(b.dataset.v); } });

// flagged in the bank for Sam to double-check: still played, with a small note for students
const revTag = d => d.review ? '<span class="rev" title="This definition is still being checked, so it may change.">subject to review</span>' : '';
// split a list of terms into boards of state.per (a leftover is spread over the last boards, never a board of 1)
function chunk(list) {
  const P = state.per, n = Math.max(1, Math.floor(list.length / P));
  const out = Array.from({ length: n }, () => []);
  list.forEach((x, i) => out[i < n * P ? Math.floor(i / P) : n - 1 - (i - n * P) % n].push(x));
  return out;
}

// ---------- setup ----------
function topicsByUnit() {
  const m = new Map();
  for (const d of DEFS) {
    if (!m.has(d.unit)) m.set(d.unit, new Map());
    const t = m.get(d.unit); t.set(d.topic, (t.get(d.topic) || 0) + 1);
  }
  return [...m.entries()].sort((a, b) => a[0] - b[0]);
}
const HL_TOPICS = new Set([...new Set(DEFS.map(d => d.topic))].filter(t => DEFS.every(d => d.topic !== t || d.hl)));
// Picks are single terms, because some HL terms sit inside SL subtopics.
// A group (unit or subtopic) is "full" when every term is picked, "SL" when every SL term is picked and no HL one.
const isFull = g => g.every(d => state.picks.has(d));
const isSL = g => g.some(d => !d.hl) && g.every(d => state.picks.has(d) === !d.hl);
const pickAll = (g, on) => { for (const d of g) on ? state.picks.add(d) : state.picks.delete(d); };
state.level = {};   // per unit: 'SL' after Whole unit SL, so subtopics tapped after it add SL terms only
function chip(cls, html, onclick) {
  const b = document.createElement('button'); b.className = 'chip ' + cls; b.innerHTML = html;
  b.onclick = () => { onclick(); syncSetup(); }; return b;
}
function buildPicker() {
  const wrap = $('units'); wrap.innerHTML = '';
  for (const [u, topics] of topicsByUnit()) {
    const unit = DEFS.filter(d => d.unit === u), sl = unit.filter(d => !d.hl);
    const div = document.createElement('div'); div.className = 'unit'; div.dataset.u = u;
    div.innerHTML = `<h3>${esc(UNITS[u])}</h3><div class="ubar" role="img"></div><div class="wholes"></div><div class="chips" hidden></div>`;
    const wholes = div.querySelector('.wholes'), subs = div.querySelector('.chips');
    const mixed = sl.length < unit.length;   // no HL terms (Unit 1): one plain Whole unit button
    if (mixed) wholes.append(chip('whole sl', `Whole unit SL<span class="n">${sl.length}</span>`, () => {
      const on = isSL(unit); pickAll(unit, false); if (!on) pickAll(sl, true); state.level[u] = 'SL';
    }));
    wholes.append(chip('whole hl', `Whole unit${mixed ? ' HL' : ''}<span class="n">${unit.length}</span>`, () => {
      pickAll(unit, !isFull(unit)); state.level[u] = 'HL';
    }));
    const fold = document.createElement('button'); fold.className = 'fold'; fold.setAttribute('aria-expanded', 'false');
    fold.innerHTML = 'Subtopics <span class="chev" aria-hidden="true">▾</span>';
    fold.onclick = () => { const open = subs.hidden; subs.hidden = !open; fold.setAttribute('aria-expanded', open); };
    wholes.append(fold);
    for (const t of [...topics.keys()].sort((a, b) => a.localeCompare(b, undefined, { numeric: true }))) {
      const g = unit.filter(d => d.topic === t);
      const b = chip('sub', `${esc(t)}${HL_TOPICS.has(t) ? '<span class="hl">HL</span>' : ''}<span class="n"></span><span class="strip" role="img"></span>`, () => {
        if (isFull(g) || isSL(g)) return pickAll(g, false);
        pickAll(state.level[u] === 'SL' && g.some(d => !d.hl) ? g.filter(d => !d.hl) : g, true);
      });
      b._g = g; subs.append(b);
    }
    div._unit = unit; wrap.append(div);
  }
}
function syncSetup() {
  for (const div of $('units').querySelectorAll('.unit')) {
    const unit = div._unit;
    div.querySelector('.whole.hl').setAttribute('aria-pressed', isFull(unit));
    div.querySelector('.whole.sl')?.setAttribute('aria-pressed', isSL(unit) && !isFull(unit));
    fillBar(div.querySelector('.ubar'), unit);
    for (const b of div.querySelectorAll('.chip.sub')) {
      const on = isFull(b._g) || isSL(b._g);
      b.setAttribute('aria-pressed', on);
      b.querySelector('.n').textContent = on ? b._g.filter(d => state.picks.has(d)).length : b._g.length;
      const s = b.querySelector('.strip');
      s.innerHTML = stripHTML(b._g); s.setAttribute('aria-label', tallyText(tally(b._g)));
    }
  }
  for (const b of $('againChips').querySelectorAll('.chip')) b.setAttribute('aria-pressed', isFull(b._g));
  const picked = state.picks.size;
  $('picked').textContent = picked ? `${picked} term${picked === 1 ? '' : 's'} picked` : 'Pick a unit or some topics';
  const fresh = [...state.picks].filter(d => !seen.has(keyOf(d))).length;
  $('fresh').textContent = !picked || fresh === picked ? '' : fresh ? `· ${fresh} not asked yet` : '· all asked, starting again';
  $('start').disabled = picked === 0;
}
function renderSetup() {
  if (!$('units').firstChild) buildPicker();
  renderAgain();
  syncSetup();
  const sizes = $('sizes'); sizes.innerHTML = '';
  for (const n of SIZES) {
    const b = document.createElement('button'); b.textContent = `${n} terms · ${n * 2 + 2} pieces`; b.dataset.n = n;
    b.setAttribute('aria-pressed', state.per === n);
    b.onclick = () => { state.per = n; try { localStorage.setItem('dd-board', n); } catch {} renderSetup(); };
    sizes.appendChild(b);
  }
  const seg = $('lengths'); seg.innerHTML = '';
  for (const L of LENGTHS) {
    const b = document.createElement('button'); b.textContent = L;
    b.setAttribute('aria-pressed', state.length === L);
    b.onclick = () => { state.length = L; renderSetup(); };
    seg.appendChild(b);
  }
}
function show(id) {
  for (const s of ['setup', 'gloss', 'play', 'end']) $(s).hidden = s !== id;
  $('tabs').hidden = id !== 'setup' && id !== 'gloss';
  for (const b of $('tabs').children) b.setAttribute('aria-pressed', b.dataset.v === id);
  window.scrollTo(0, 0);
}

// items: [{d, extra}] ; extra terms fill a board but are not scored
function startRound(items) {
  state.boards = chunk(items); state.b = 0; state.score = 0; state.missed = [];
  state.scored = items.filter(x => !x.extra).length;
  show('play'); renderBoard();
}
$('start').onclick = () => {
  state.pool = DEFS.filter(d => state.picks.has(d));
  const items = choose(state.pool, state.length === 'All' ? state.pool.length : state.length).map(d => ({ d }));
  startRound(padBoard(items));
};
// a board needs state.per terms: if too few were picked, borrow unscored ones from the same unit
function padBoard(items) {
  if (items.length >= state.per) return items;
  const units = new Set(items.map(x => x.d.unit)), have = new Set(items.map(x => x.d));
  const fill = shuffle(DEFS.filter(d => !have.has(d) && units.has(d.unit)));
  const out = items.slice();
  while (out.length < state.per && fill.length) out.push({ d: fill.pop(), extra: true });
  return shuffle(out);
}

// ---------- board ----------
function renderBoard() {
  const items = state.boards[state.b];
  const real = items.flatMap((it, t) => it.d.p.map((p, part) => ({ t, part, text: clean(p) })));
  state.frags = shuffle([...real, ...spares(items, real)]).map((f, id) => ({ ...f, id }));
  state.placed = {}; state.sel = null; state.locked = false;
  $('progress').textContent = `${state.b + 1} of ${state.boards.length}`;
  const topics = [...new Set(items.map(it => it.d.topic))];
  $('qtopic').textContent = topics.join(' · ');
  $('board').classList.remove('locked');
  $('check').hidden = false; $('next').hidden = true;
  $('terms').innerHTML = items.map((it, t) => `<div class="term" data-t="${t}"><div class="head"><h3>${esc(it.d.term)}${revTag(it.d)}</h3>${againBtn(it.d)}</div>${
    it.d.p.map((_, i) => `<button type="button" class="slot" data-slot="${t}-${i}" aria-label="${esc(it.d.term)}, piece ${i + 1}"></button>`).join('')
  }<p class="fix" hidden></p></div>`).join('') + reportHTML(items);
  renderPieces();
}
// ---------- report a definition ----------
// a quiet link under the terms; the student picks which term, adds an optional note, and it goes to Sam's feedback inbox
const FEEDBACK_URL = 'https://unisam.nz/feedback/api/report';
function reportHTML(items) {
  return `<div class="report" id="report"><button type="button" class="link" id="rlink">Report a definition</button>
<div class="rpanel" id="rpanel" hidden><p>Which one looks wrong?</p>
<div class="rpick">${items.map((it, t) => `<button type="button" data-rt="${t}" aria-pressed="false">${esc(it.d.term)}</button>`).join('')}</div>
<textarea id="rnote" rows="2" maxlength="1000" placeholder="What is wrong with it? (optional)" aria-label="What is wrong with it? (optional)"></textarea>
<div class="row"><button type="button" class="btn" id="rsend" disabled>Send to Sam</button><button type="button" class="link" id="rcancel">Cancel</button><span id="rmsg"></span></div>
<p style="margin:6px 0 0">Only the term and your note are sent.</p></div></div>`;
}
document.addEventListener('click', async e => {
  const t = e.target;
  if (t.closest('#rlink')) { $('rpanel').hidden = !$('rpanel').hidden; return; }
  if (t.closest('#rcancel')) { $('rpanel').hidden = true; return; }
  const pick = t.closest('[data-rt]');
  if (pick) {
    for (const b of document.querySelectorAll('[data-rt]')) b.setAttribute('aria-pressed', b === pick);
    $('rsend').disabled = false; return;
  }
  if (!t.closest('#rsend')) return;
  const sel = document.querySelector('[data-rt][aria-pressed="true"]');
  if (!sel) return;
  const d = state.boards[state.b][+sel.dataset.rt].d, note = $('rnote').value.trim();
  const payload = {
    app: 'definitions', type: 'bug', website: '',
    message: `{{SUBJECT}} definition: ${d.term} (${d.topic})${note ? '\n\n' + note : ''}`,
    diagram: JSON.stringify({ subject: SUBJECT, term: d.term, unit: d.unit, topic: d.topic, parts: d.p }),
    meta: { subject: SUBJECT, term: d.term, page: location.pathname },
  };
  $('rsend').disabled = true; $('rmsg').textContent = 'Sending…';
  let msg = '';
  try {
    const r = await fetch(FEEDBACK_URL, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });
    if (!r.ok) msg = r.status === 429 ? 'Too many reports from here. Try again later.' : 'Could not send it. Try again.';
  } catch { msg = 'Could not reach the server.'; }
  if (msg) { $('rsend').disabled = false; $('rmsg').textContent = msg; return; }
  $('rpanel').hidden = true; $('rlink').textContent = 'Thanks, sent. Report another?';
});
// SPARES distractor pieces per board: one piece each from other terms, nearest topic first (same subtopic, then unit, then any)
const SPARES = 2;
function spares(items, real) {
  const on = new Set(items.map(it => it.d)), texts = new Set(real.map(f => f.text));
  const topics = new Set(items.map(it => it.d.topic)), units = new Set(items.map(it => it.d.unit));
  const others = DEFS.filter(d => !on.has(d));
  const tiers = [others.filter(d => topics.has(d.topic)), others.filter(d => !topics.has(d.topic) && units.has(d.unit)), others.filter(d => !units.has(d.unit))];
  const out = [];
  for (const d of tiers.flatMap(shuffle)) {
    if (out.length === SPARES) break;
    const text = clean(d.p[Math.floor(Math.random() * d.p.length)]);
    if (texts.has(text)) continue;
    texts.add(text); out.push({ t: -1, part: -1, text });
  }
  return out;
}
function fragHTML(f) {
  return `<button type="button" class="frag" data-f="${f.id}"><span class="grip" aria-hidden="true">&#8942;&#8942;</span><span class="txt">${esc(f.text)}</span><span class="mark"></span></button>`;
}
const slotOf = fid => Object.keys(state.placed).find(k => state.placed[k] === fid);
function renderPieces() {
  document.querySelectorAll('#terms .slot').forEach(s => {
    const fid = state.placed[s.dataset.slot];
    s.innerHTML = fid === undefined ? '' : fragHTML(state.frags[fid]);
    s.classList.toggle('filled', fid !== undefined);
    s.classList.toggle('sel', state.sel === s.dataset.slot);
  });
  const loose = state.frags.filter(f => slotOf(f.id) === undefined);
  $('pool').innerHTML = loose.map(fragHTML).join('');
  if (typeof state.sel === 'number') document.querySelector(`.frag[data-f="${state.sel}"]`)?.classList.add('sel');
  const empty = document.querySelectorAll('#terms .slot:not(.filled)').length;
  $('left').textContent = empty ? `${empty} ${empty === 1 ? 'box' : 'boxes'} left` : `${loose.length} spare`;
  $('score').textContent = `${state.score} right`;
  $('check').disabled = empty > 0 || state.locked;
}
// put piece fid into slot; whatever was there goes where fid came from
function place(fid, slot) {
  const from = slotOf(fid), occupant = state.placed[slot];
  if (from === slot) return;
  state.placed[slot] = fid;
  if (from !== undefined) { if (occupant !== undefined) state.placed[from] = occupant; else delete state.placed[from]; }
}
function unplace(fid) { const from = slotOf(fid); if (from !== undefined) delete state.placed[from]; }

// tap to select, tap to place (works in either order).
// Pointer taps on pieces are handled in endDrag; the click listener covers keyboard and taps on boxes and the pool.
let suppressClick = false, lastTap = { f: -1, t: 0 };
$('board').addEventListener('click', e => {
  if (state.locked) return;
  if (suppressClick) { suppressClick = false; return; }
  const f = e.target.closest('.frag');
  if (f && +f.dataset.f === lastTap.f && Date.now() - lastTap.t < 600) return; // already handled on pointerup
  tap(e.target);
});
function tap(target) {
  const fragEl = target.closest('.frag'), slotEl = target.closest('.slot');
  const sel = state.sel;
  if (fragEl) {
    const fid = +fragEl.dataset.f;
    const inSlot = slotEl ? slotEl.dataset.slot : null;
    if (typeof sel === 'string' && !inSlot) { place(fid, sel); state.sel = null; }
    else if (typeof sel === 'number' && sel !== fid && inSlot) { place(sel, inSlot); state.sel = null; }
    else if (typeof sel === 'number' && sel !== fid && !inSlot && slotOf(sel) !== undefined) {
      // a placed piece is selected and a loose one tapped: swap them
      place(fid, slotOf(sel)); state.sel = null;
    }
    else state.sel = sel === fid ? null : fid;
  } else if (slotEl) {
    const slot = slotEl.dataset.slot;
    if (typeof sel === 'number') { place(sel, slot); state.sel = null; }
    else state.sel = sel === slot ? null : slot;
  } else if (target.closest('.poolwrap') && typeof sel === 'number') {
    unplace(sel); state.sel = null;
  } else return;
  renderPieces();
}

// drag: mouse from anywhere on a piece, touch only from its grip (so the page still scrolls)
let drag = null;
$('board').addEventListener('pointerdown', e => {
  const fragEl = e.target.closest('.frag');
  if (!fragEl || state.locked || e.button > 0) return;
  if (e.pointerType !== 'mouse' && !e.target.closest('.grip')) return;
  drag = { fid: +fragEl.dataset.f, el: fragEl, x: e.clientX, y: e.clientY, id: e.pointerId, on: false, ghost: null, over: null };
  fragEl.setPointerCapture(e.pointerId);
});
function startDrag(e) {
  const r = drag.el.getBoundingClientRect();
  const g = drag.el.cloneNode(true); g.classList.add('ghost'); g.classList.remove('sel');
  g.style.width = r.width + 'px'; g.style.left = r.left + 'px'; g.style.top = r.top + 'px';
  drag.dx = e.clientX - r.left; drag.dy = e.clientY - r.top;
  document.body.appendChild(g);
  drag.ghost = g; drag.on = true; drag.el.classList.add('lifted');
  autoScroll();
}
function targetAt(x, y) {
  const el = document.elementFromPoint(x, y);
  if (!el) return null;
  return el.closest('.slot') || el.closest('.poolwrap');
}
document.addEventListener('pointermove', e => {
  if (!drag || e.pointerId !== drag.id) return;
  if (!drag.on) { if (Math.hypot(e.clientX - drag.x, e.clientY - drag.y) < 6) return; startDrag(e); }
  drag.lastY = e.clientY; drag.lastX = e.clientX;
  drag.ghost.style.left = (e.clientX - drag.dx) + 'px';
  drag.ghost.style.top = (e.clientY - drag.dy) + 'px';
  const t = targetAt(e.clientX, e.clientY);
  if (t !== drag.over) {
    drag.over?.classList.remove('over'); (t?.classList.contains('poolwrap') ? $('pool') : t)?.classList.add('over');
    $('pool').classList.toggle('over', !!t?.classList.contains('poolwrap'));
    drag.over = t;
  }
});
function endDrag(e, cancel) {
  if (!drag || e.pointerId !== drag.id) return;
  const d = drag; drag = null;
  if (!d.on) { if (!cancel) { lastTap = { f: d.fid, t: Date.now() }; tap(d.el); } return; }
  d.ghost.remove(); d.el.classList.remove('lifted');
  document.querySelectorAll('.over').forEach(x => x.classList.remove('over'));
  suppressClick = true; setTimeout(() => { suppressClick = false; }, 0);
  if (cancel) return renderPieces();
  const t = targetAt(e.clientX, e.clientY);
  if (t?.classList.contains('slot')) place(d.fid, t.dataset.slot);
  else if (t) unplace(d.fid);
  state.sel = null;
  renderPieces();
}
document.addEventListener('pointerup', e => endDrag(e, false));
document.addEventListener('pointercancel', e => endDrag(e, true));
// scroll the page while a piece is held near the top or bottom edge
function autoScroll() {
  if (!drag || !drag.on) return;
  const y = drag.lastY ?? drag.y, edge = 70;
  const v = y < edge ? -(edge - y) / 4 : y > innerHeight - edge ? (y - (innerHeight - edge)) / 4 : 0;
  if (v) window.scrollBy(0, v);
  requestAnimationFrame(autoScroll);
}

$('check').onclick = () => {
  const items = state.boards[state.b];
  state.locked = true; state.sel = null;
  renderPieces();
  $('board').classList.add('locked');
  items.forEach((it, t) => {
    let right = true;
    it.d.p.forEach((_, i) => {
      const slot = `${t}-${i}`, f = state.frags[state.placed[slot]];
      const ok = f.t === t && f.part === i;
      if (!ok) right = false;
      const el = document.querySelector(`.slot[data-slot="${slot}"] .frag`);
      el.classList.add(ok ? 'ok' : 'bad');
      el.querySelector('.mark').textContent = ok ? '✓' : '✗';
      el.querySelector('.mark').setAttribute('aria-label', ok ? 'Right' : 'Wrong');
    });
    const card = document.querySelector(`.term[data-t="${t}"]`);
    card.classList.add(right ? 'right' : 'wrong');
    if (!right) { const fx = card.querySelector('.fix'); fx.innerHTML = fullHTML(it.d); fx.hidden = false; }
    if (!it.extra) { if (right) state.score++; else state.missed.push(it.d); }
    seen.add(keyOf(it.d));
    last[keyOf(it.d)] = right ? 1 : 0;
  });
  saveSet('seen', seen); saveObj('last', last);
  $('score').textContent = `${state.score} right`;
  $('check').hidden = true; $('next').hidden = false;
  $('next').textContent = state.b === state.boards.length - 1 ? 'See score' : 'Next';
  $('next').focus({ preventScroll: true });
};
$('next').onclick = () => {
  state.b++;
  if (state.b < state.boards.length) { renderBoard(); window.scrollTo(0, 0); } else renderEnd();
};

// ---------- end ----------
function renderEnd() {
  show('end');
  $('final').textContent = `${state.score} / ${state.scored}`;
  const m = state.missed;
  $('missedWrap').hidden = m.length === 0;
  $('retry').hidden = m.length === 0;
  $('missed').innerHTML = m.map(d => `<li>${fullHTML(d)}<br>${againBtn(d)}</li>`).join('');
}
// retry missed: if fewer than 3 were missed, other terms from the same topics fill the board (not scored)
$('retry').onclick = () => {
  startRound(padBoard(shuffle(state.missed).map(d => ({ d }))));
};
$('again').onclick = () => $('start').onclick();
$('change').onclick = () => { show('setup'); renderSetup(); };

renderSetup();
</script>
</body>
</html>
