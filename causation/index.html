<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="icon" type="image/png" href="/unisamicon2.png">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Explaining causation</title>
  <style>
    body {
      margin: 0;
      font-family: system-ui, sans-serif;
      background: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 2rem;
      box-sizing: border-box;
    }

    h1 {
      font-size: 1.5rem;
      font-weight: normal;
      margin-bottom: 0.4rem;
      text-align: center;
    }

    p {
      font-size: 0.95rem;
      color: #555;
      margin: 0 0 2.5rem;
      text-align: center;
    }

    .choices {
      display: flex;
      gap: 1.25rem;
      flex-wrap: wrap;
      justify-content: center;
    }

    a.choice {
      display: block;
      width: 220px;
      padding: 1.5rem 1.25rem;
      border: 1.5px solid #ddd;
      border-radius: 10px;
      text-decoration: none;
      color: #111;
      transition: border-color 0.15s, box-shadow 0.15s;
    }
    a.choice:hover {
      border-color: #999;
      box-shadow: 0 2px 8px rgba(0,0,0,0.07);
    }

    .choice-title {
      font-size: 1.05rem;
      font-weight: 600;
      margin-bottom: 0.4rem;
    }

    .choice-desc {
      font-size: 0.85rem;
      color: #666;
      line-height: 1.5;
    }
  </style>
</head>
<body>

  <h1>Explaining causation</h1>
  <p>How would you like to practise?</p>

  <div class="choices">
    <a class="choice" href="/causation/plain">
      <div class="choice-title">Just the questions</div>
      <div class="choice-desc">Random sentence pairs to explain out loud or in writing.</div>
    </a>
    <a class="choice" href="/causation2">
      <div class="choice-title">Help me check my answers</div>
      <div class="choice-desc">Type your explanation and get instant feedback on whether it connects both events.</div>
    </a>
  </div>

</body>
</html>
