<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="icon" type="image/png" href="/unisamicon2.png">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>Cat Type!</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="game-container">

    <!-- Sky decorations -->
    <div id="stars-layer"></div>
    <div id="sun">
      <div class="sun-core"></div>
    </div>
    <div id="moon"></div>
    <div class="cloud cloud-1"></div>
    <div class="cloud cloud-2"></div>
    <div class="cloud cloud-3"></div>
    <div class="cloud cloud-4"></div>

    <!-- Parallax hills -->
    <div class="parallax" id="hills-back">
      <svg class="tile" viewBox="0 0 800 200" preserveAspectRatio="none">
        <path d="M0 200 L0 110 Q100 40 220 110 Q320 165 430 90 Q540 25 660 100 Q730 150 800 110 L800 200 Z" fill="var(--hill-back)"/>
      </svg>
    </div>
    <div class="parallax" id="hills-front">
      <svg class="tile" viewBox="0 0 800 140" preserveAspectRatio="none">
        <path d="M0 140 L0 80 Q90 30 200 80 Q290 120 400 70 Q500 25 610 80 Q700 120 800 80 L800 140 Z" fill="var(--hill-front)"/>
      </svg>
    </div>

    <!-- Scrolling ground -->
    <div class="parallax" id="ground">
      <svg class="tile" viewBox="0 0 400 90" preserveAspectRatio="none">
        <rect x="0" y="14" width="400" height="76" fill="var(--dirt)"/>
        <rect x="0" y="0" width="400" height="22" rx="0" fill="var(--grass)"/>
        <path d="M30 2 q3 -10 6 0 M37 3 q3 -8 6 0" stroke="var(--grass)" stroke-width="3" fill="none" stroke-linecap="round"/>
        <path d="M150 2 q3 -10 6 0 M157 3 q3 -8 6 0" stroke="var(--grass)" stroke-width="3" fill="none" stroke-linecap="round"/>
        <path d="M300 2 q3 -10 6 0 M307 3 q3 -8 6 0" stroke="var(--grass)" stroke-width="3" fill="none" stroke-linecap="round"/>
        <circle cx="90" cy="-3" r="5" fill="#ff9ec4"/><circle cx="90" cy="-3" r="2" fill="#fff3b0"/>
        <circle cx="230" cy="-3" r="5" fill="#fff"/><circle cx="230" cy="-3" r="2" fill="#ffd166"/>
        <circle cx="350" cy="-3" r="5" fill="#ffd166"/><circle cx="350" cy="-3" r="2" fill="#ff8fab"/>
        <circle cx="60" cy="40" r="4" fill="rgba(0,0,0,0.08)"/>
        <circle cx="200" cy="58" r="5" fill="rgba(0,0,0,0.08)"/>
        <circle cx="330" cy="44" r="3.5" fill="rgba(0,0,0,0.08)"/>
      </svg>
      <svg class="tile" viewBox="0 0 400 90" preserveAspectRatio="none">
        <rect x="0" y="14" width="400" height="76" fill="var(--dirt)"/>
        <rect x="0" y="0" width="400" height="22" fill="var(--grass)"/>
        <path d="M70 2 q3 -10 6 0 M77 3 q3 -8 6 0" stroke="var(--grass)" stroke-width="3" fill="none" stroke-linecap="round"/>
        <path d="M210 2 q3 -10 6 0 M217 3 q3 -8 6 0" stroke="var(--grass)" stroke-width="3" fill="none" stroke-linecap="round"/>
        <path d="M340 2 q3 -10 6 0 M347 3 q3 -8 6 0" stroke="var(--grass)" stroke-width="3" fill="none" stroke-linecap="round"/>
        <circle cx="130" cy="-3" r="5" fill="#fff"/><circle cx="130" cy="-3" r="2" fill="#ff8fab"/>
        <circle cx="280" cy="-3" r="5" fill="#ff9ec4"/><circle cx="280" cy="-3" r="2" fill="#fff3b0"/>
        <circle cx="100" cy="50" r="4" fill="rgba(0,0,0,0.08)"/>
        <circle cx="250" cy="38" r="5" fill="rgba(0,0,0,0.08)"/>
        <circle cx="370" cy="60" r="3.5" fill="rgba(0,0,0,0.08)"/>
      </svg>
      <svg class="tile" viewBox="0 0 400 90" preserveAspectRatio="none">
        <rect x="0" y="14" width="400" height="76" fill="var(--dirt)"/>
        <rect x="0" y="0" width="400" height="22" fill="var(--grass)"/>
        <path d="M110 2 q3 -10 6 0 M117 3 q3 -8 6 0" stroke="var(--grass)" stroke-width="3" fill="none" stroke-linecap="round"/>
        <path d="M250 2 q3 -10 6 0 M257 3 q3 -8 6 0" stroke="var(--grass)" stroke-width="3" fill="none" stroke-linecap="round"/>
        <circle cx="40" cy="-3" r="5" fill="#ffd166"/><circle cx="40" cy="-3" r="2" fill="#fff"/>
        <circle cx="190" cy="-3" r="5" fill="#ff9ec4"/><circle cx="190" cy="-3" r="2" fill="#fff3b0"/>
        <circle cx="320" cy="-3" r="5" fill="#fff"/><circle cx="320" cy="-3" r="2" fill="#ffd166"/>
        <circle cx="160" cy="46" r="4" fill="rgba(0,0,0,0.08)"/>
        <circle cx="300" cy="56" r="5" fill="rgba(0,0,0,0.08)"/>
      </svg>
    </div>

    <!-- The cat -->
    <div id="cat">
      <svg id="cat-svg" viewBox="0 0 130 110">
        <!-- tail -->
        <path class="tail" d="M16 60 Q-4 54 4 36 Q8 26 18 30" stroke="#f4a259" stroke-width="11" fill="none" stroke-linecap="round"/>
        <!-- far legs -->
        <rect class="leg leg-bf" x="32" y="66" width="11" height="28" rx="5.5" fill="#e0883e"/>
        <rect class="leg leg-ff" x="74" y="66" width="11" height="28" rx="5.5" fill="#e0883e"/>
        <!-- body -->
        <ellipse cx="58" cy="60" rx="38" ry="27" fill="#f4a259"/>
        <ellipse cx="62" cy="70" rx="22" ry="14" fill="#ffe8c7"/>
        <!-- stripes -->
        <path d="M34 40 q5 9 0 17" stroke="#e07a3f" stroke-width="5" fill="none" stroke-linecap="round"/>
        <path d="M48 36 q5 9 0 17" stroke="#e07a3f" stroke-width="5" fill="none" stroke-linecap="round"/>
        <!-- near legs -->
        <rect class="leg leg-bn" x="42" y="68" width="12" height="30" rx="6" fill="#f4a259"/>
        <rect class="leg leg-fn" x="84" y="68" width="12" height="30" rx="6" fill="#f4a259"/>
        <!-- head -->
        <g id="head">
          <path d="M78 22 L84 2 L98 16 Z" fill="#f4a259"/>
          <path d="M118 22 L124 4 L106 14 Z" fill="#f4a259"/>
          <path d="M82 17 L85 8 L92 15 Z" fill="#ffb3c6"/>
          <path d="M116 18 L119 10 L110 14 Z" fill="#ffb3c6"/>
          <circle cx="99" cy="36" r="25" fill="#f4a259"/>
          <path d="M88 18 q5 8 0 15" stroke="#e07a3f" stroke-width="4" fill="none" stroke-linecap="round"/>
          <!-- normal face -->
          <g class="face-normal">
            <g class="eye"><circle cx="91" cy="33" r="4.6" fill="#3a2c20"/><circle cx="92.6" cy="31.4" r="1.6" fill="#fff"/></g>
            <g class="eye"><circle cx="108" cy="33" r="4.6" fill="#3a2c20"/><circle cx="109.6" cy="31.4" r="1.6" fill="#fff"/></g>
            <path d="M95 45 q4 4 8 0" stroke="#3a2c20" stroke-width="2.4" fill="none" stroke-linecap="round"/>
          </g>
          <!-- surprised face (shown on bump) -->
          <g class="face-oops">
            <path d="M87 30 l7 5 m0 -5 l-7 5" stroke="#3a2c20" stroke-width="2.6" stroke-linecap="round"/>
            <path d="M105 30 l7 5 m0 -5 l-7 5" stroke="#3a2c20" stroke-width="2.6" stroke-linecap="round"/>
            <ellipse cx="99" cy="46" rx="3.6" ry="4.6" fill="#3a2c20"/>
          </g>
          <path d="M97 40 L101 40 L99 43 Z" fill="#ff8fab"/>
          <circle cx="85" cy="41" r="4" fill="#ffb3c6" opacity="0.7"/>
          <circle cx="113" cy="41" r="4" fill="#ffb3c6" opacity="0.7"/>
          <path d="M76 38 L62 35 M76 42 L63 44" stroke="#e07a3f" stroke-width="1.8" stroke-linecap="round"/>
          <path d="M122 38 L130 36 M122 42 L130 44" stroke="#e07a3f" stroke-width="1.8" stroke-linecap="round"/>
        </g>
      </svg>
    </div>

    <!-- HUD -->
    <div id="hud">
      <div class="badge" id="progress">0/20</div>
      <div class="badge" id="fish-badge">🐟<span id="fish-count">0</span></div>
      <div class="badge" id="paws-badge"><span id="paws"></span></div>
      <button class="badge" id="home-btn" aria-label="Back to level picker">🏠</button>
      <button class="badge" id="sound-btn" aria-label="Sound on or off">🔊</button>
    </div>

    <!-- Level picker (start screen) -->
    <div class="overlay" id="picker-screen">
      <h1 id="title"></h1>
      <p class="hint">Type the letter or word to SMASH it! SPACE to jump.</p>
      <div class="settings-bar" id="settings-bar">
        <div class="set-group">
          <span class="set-label">If you slip</span>
          <button class="set-opt" data-set="mistake" data-val="keep">Keep going</button>
          <button class="set-opt" data-set="mistake" data-val="accuracy">Start word again</button>
        </div>
        <div class="set-group">
          <span class="set-label">Track</span>
          <button class="set-opt" data-set="track" data-val="12">Standard</button>
          <button class="set-opt" data-set="track" data-val="20">Long</button>
          <button class="set-opt" data-set="track" data-val="40">Longer</button>
        </div>
      </div>
      <div class="picker-card">
        <div class="lv-grid" id="lv-grid"></div>
      </div>
      <p class="total-stars" id="total-fish-start"></p>
    </div>

    <!-- Level failed screen -->
    <div class="overlay hidden" id="over-screen">
      <div class="card">
        <h2 id="over-title">Oops!</h2>
        <p class="big-time" id="over-progress"></p>
        <p class="over-fish" id="over-fish"></p>
        <div class="win-btns">
          <button class="big-btn" id="over-again-btn">Try again</button>
          <button class="big-btn alt" id="over-pick-btn">New level</button>
        </div>
      </div>
    </div>

    <!-- Level complete screen -->
    <div class="overlay hidden" id="win-screen">
      <div class="card">
        <h2 id="win-title">Level done!</h2>
        <p class="win-stars" id="win-stars"></p>
        <p class="best-line" id="win-line"></p>
        <p class="over-fish" id="win-fish"></p>
        <div class="win-btns">
          <button class="big-btn" id="again-btn">Play again</button>
          <button class="big-btn alt" id="pick-btn">New level</button>
        </div>
      </div>
    </div>

  </div>
  <script src="script.js"></script>
</body>
</html>
