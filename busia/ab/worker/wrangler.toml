# busia-ab worker (BUSIA A/B test). Deploy from this folder: npx wrangler deploy
name = "busia-ab"
main = "worker.js"
compatibility_date = "2026-10-01"
workers_dev = false
routes = [
  { pattern = "unisam.nz/busia-ab", zone_name = "unisam.nz" },
  { pattern = "unisam.nz/busia-ab/*", zone_name = "unisam.nz" }
]

[[d1_databases]]
binding = "DB"
database_name = "busia-ab"
database_id = "8a27f6b8-4bfb-4c5c-8063-495f94c37404"
