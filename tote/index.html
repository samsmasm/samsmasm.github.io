<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <meta name="referrer" content="no-referrer">
  <title>Tote</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --sidebar-width: 240px;
      --bg: #f5f5f0;
      --sidebar-bg: #1e1e1e;
      --sidebar-text: #ccc;
      --sidebar-hover: #2e2e2e;
      --sidebar-active: #3a3a3a;
      --accent: #e8a838;
      --text: #222;
      --border: #ddd;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--text);
      height: 100dvh;
      display: flex;
      overflow: hidden;
    }

    /* ── Sidebar ── */
    #sidebar {
      width: var(--sidebar-width);
      background: var(--sidebar-bg);
      color: var(--sidebar-text);
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
      height: 100dvh;
      z-index: 10;
    }

    #sidebar-header {
      padding: 16px 12px 10px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid #333;
    }

    #sidebar-header h2 {
      font-size: 14px;
      font-weight: 600;
      color: #fff;
      letter-spacing: 0.05em;
      text-transform: uppercase;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    #new-note-btn {
      background: var(--accent);
      border: none;
      color: #000;
      font-size: 20px;
      width: 28px;
      height: 28px;
      border-radius: 6px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      line-height: 1;
      font-weight: bold;
    }

    #new-note-btn:hover { opacity: 0.85; }

    #refresh-btn {
      background: none;
      border: none;
      color: var(--sidebar-text);
      font-size: 18px;
      width: 28px;
      height: 28px;
      border-radius: 6px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      line-height: 1;
    }

    #refresh-btn:hover { background: var(--sidebar-hover); color: #fff; }

    #refresh-btn.spinning { animation: spin 0.7s linear infinite; }

    body.locked .header-actions { visibility: hidden; }

    #note-list {
      flex: 1;
      overflow-y: auto;
      padding: 8px 0;
    }

    .note-item {
      padding: 10px 14px;
      cursor: pointer;
      font-size: 13px;
      color: var(--sidebar-text);
      border-left: 3px solid transparent;
      transition: background 0.1s;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .note-item:hover { background: var(--sidebar-hover); }
    .note-item.active { background: var(--sidebar-active); border-left-color: var(--accent); color: #fff; }

    .note-item .preview { flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    .note-item .delete-btn {
      opacity: 0;
      background: none;
      border: none;
      color: #888;
      cursor: pointer;
      font-size: 14px;
      padding: 2px 4px;
      border-radius: 3px;
      flex-shrink: 0;
    }

    .note-item:hover .delete-btn { opacity: 1; }
    .note-item .delete-btn:hover { color: #e55; }

    #empty-list {
      padding: 20px 14px;
      font-size: 12px;
      color: #555;
      font-style: italic;
    }

    #sidebar-footer {
      padding: 8px 14px;
      font-size: 11px;
      color: #444;
      border-top: 1px solid #2a2a2a;
      display: flex;
      flex-wrap: wrap;
      gap: 4px 12px;
      align-items: center;
    }

    #sidebar-footer span { flex: 1 1 100%; }

    .footer-link {
      background: none;
      border: none;
      color: #888;
      font-size: 11px;
      cursor: pointer;
      text-decoration: underline;
      padding: 0;
    }

    .footer-link:hover { color: #fff; }
    body.locked .footer-link.when-unlocked,
    body.signed-out .footer-link { display: none; }

    /* ── Main area ── */
    #main {
      flex: 1;
      display: flex;
      flex-direction: column;
      height: 100dvh;
      overflow: hidden;
    }

    #toolbar {
      padding: 12px 20px;
      border-bottom: 1px solid var(--border);
      background: #fff;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    #hamburger {
      display: none;
      background: none;
      border: none;
      cursor: pointer;
      font-size: 20px;
      padding: 2px 6px;
      border-radius: 4px;
      color: #555;
    }

    #hamburger:hover { background: #f0f0f0; }

    #note-title-display {
      font-size: 15px;
      font-weight: 600;
      color: #555;
      flex: 1;
    }

    #expires-label {
      font-size: 12px;
      color: #aaa;
    }

    #note-area {
      flex: 1;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    /* view mode */
    #note-view {
      flex: 1;
      padding: 28px 32px;
      overflow-y: auto;
      white-space: pre-wrap;
      font-size: 15px;
      line-height: 1.7;
      display: none;
    }

    /* edit mode */
    #note-editor {
      flex: 1;
      display: flex;
      flex-direction: column;
    }

    #note-textarea {
      flex: 1;
      width: 100%;
      border: none;
      outline: none;
      resize: none;
      padding: 28px 32px;
      font-size: 15px;
      line-height: 1.7;
      font-family: inherit;
      background: var(--bg);
    }

    #editor-actions {
      padding: 10px 20px;
      border-top: 1px solid var(--border);
      background: #fff;
      display: flex;
      gap: 8px;
      justify-content: flex-end;
    }

    .btn {
      padding: 7px 16px;
      border-radius: 6px;
      border: none;
      cursor: pointer;
      font-size: 13px;
      font-weight: 500;
    }

    .btn-primary { background: var(--accent); color: #000; }
    .btn-primary:hover { opacity: 0.85; }
    .btn-primary:disabled { opacity: 0.5; cursor: default; }
    .btn-ghost { background: #eee; color: #555; }
    .btn-ghost:hover { background: #e0e0e0; }

    /* empty state */
    #empty-state {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: #aaa;
      gap: 8px;
    }

    #empty-state p { font-size: 14px; }

    /* ── Sign-in / passphrase gate ── */
    #gate {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
      gap: 14px;
      text-align: center;
    }

    #gate-msg { font-size: 14px; color: #555; max-width: 340px; line-height: 1.5; }

    #pass-form {
      display: flex;
      flex-direction: column;
      gap: 8px;
      width: 100%;
      max-width: 300px;
    }

    #pass-form input[type=password] {
      font: inherit;
      font-size: 15px;
      padding: 9px 12px;
      border: 1px solid var(--border);
      border-radius: 6px;
      background: #fff;
    }

    #pass-form input[type=password]:focus { outline: 2px solid var(--accent); outline-offset: -1px; }

    #pass-error { font-size: 13px; color: #c33; min-height: 1em; }

    #forgot-btn {
      background: none;
      border: none;
      color: #999;
      font-size: 12px;
      text-decoration: underline;
      cursor: pointer;
      margin-top: 6px;
    }

    #forgot-btn:hover { color: #c33; }

    /* ── Mobile overlay ── */
    #sidebar-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.5);
      z-index: 9;
    }

    /* ── Mobile styles ── */
    @media (max-width: 600px) {
      #sidebar {
        position: fixed;
        left: 0; top: 0; bottom: 0;
        transform: translateX(-100%);
        transition: transform 0.25s ease;
      }

      #sidebar.open {
        transform: translateX(0);
        box-shadow: 4px 0 20px rgba(0,0,0,0.4);
      }

      #sidebar-overlay.visible { display: block; }

      #hamburger { display: flex; align-items: center; }

      #note-view { padding: 20px 16px; }
      #note-textarea { padding: 20px 16px; }
    }

    /* ── Loading spinner ── */
    #loading {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #aaa;
      font-size: 14px;
    }

    .spinner {
      width: 20px; height: 20px;
      border: 2px solid #ddd;
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      margin-right: 10px;
    }

    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body class="locked signed-out">

<!-- Sidebar overlay for mobile -->
<div id="sidebar-overlay"></div>

<!-- Sidebar -->
<nav id="sidebar">
  <div id="sidebar-header">
    <h2>Tote</h2>
    <div class="header-actions">
      <button id="refresh-btn" title="Refresh notes">&#8635;</button>
      <button id="new-note-btn" title="New note">+</button>
    </div>
  </div>
  <div id="note-list">
    <div id="empty-list">No notes yet.</div>
  </div>
  <div id="sidebar-footer">
    <span>Encrypted. Notes expire after 96 hours.</span>
    <button class="footer-link when-unlocked" id="lock-btn" title="Forget the passphrase on this device">Lock</button>
    <button class="footer-link" id="signout-btn">Sign out</button>
  </div>
</nav>

<!-- Main -->
<div id="main">
  <div id="toolbar">
    <button id="hamburger" aria-label="Toggle menu">&#9776;</button>
    <div id="note-title-display">Tote</div>
    <span id="expires-label"></span>
    <button class="btn btn-ghost" id="copy-btn" style="display:none" title="Copy note to clipboard">Copy</button>
    <button class="btn btn-ghost" id="renew-btn" style="display:none" title="Reset expiry to 96 hours">&#8635; Renew</button>
  </div>

  <div id="note-area">
    <div id="loading"><div class="spinner"></div> Loading…</div>

    <div id="gate" style="display:none">
      <p id="gate-msg"></p>
      <button class="btn btn-primary" id="signin-btn" style="display:none">Sign in with Google</button>
      <form id="pass-form" style="display:none" autocomplete="on">
        <input type="text" id="pass-user" name="username" autocomplete="username" hidden>
        <input type="password" id="pass" placeholder="Passphrase" autocomplete="current-password" required>
        <input type="password" id="pass2" placeholder="Type it again" autocomplete="new-password">
        <div id="pass-error"></div>
        <button class="btn btn-primary" type="submit" id="pass-btn">Unlock</button>
        <button type="button" id="forgot-btn">Forgot it? Wipe all notes and start again</button>
      </form>
    </div>

    <div id="empty-state" style="display:none">
      <p>No note selected.</p>
      <button class="btn btn-primary" id="empty-new-btn">+ New Note</button>
    </div>

    <div id="note-view"></div>

    <div id="note-editor" style="display:none">
      <textarea id="note-textarea" placeholder="Write your note…"></textarea>
      <div id="editor-actions">
        <button class="btn btn-ghost" id="cancel-btn">Cancel</button>
        <button class="btn btn-primary" id="save-btn">Save</button>
      </div>
    </div>
  </div>
</div>

<script type="module">
  import {
    EXPIRY_MS, onUser, signIn, signOut, forgetKey, getMeta, readyKey, unlock, setPassphrase, wipeAll,
    listNotes, putNote, renewNote as apiRenew, deleteNote as apiDelete, newId, encrypt, decrypt
  } from "./client.js";

  // ── State ──
  let notes = [];         // [{id, content, expires}]
  let activeId = null;
  let isEditing = false;
  let key = null;         // AES-GCM CryptoKey once unlocked
  let meta = null;        // {salt, check} from the server, null before a passphrase is set

  // ── DOM refs ──
  const noteList       = document.getElementById("note-list");
  const emptyList      = document.getElementById("empty-list");
  const loading        = document.getElementById("loading");
  const emptyState     = document.getElementById("empty-state");
  const noteView       = document.getElementById("note-view");
  const noteEditor     = document.getElementById("note-editor");
  const noteTextarea   = document.getElementById("note-textarea");
  const titleDisplay   = document.getElementById("note-title-display");
  const expiresLabel   = document.getElementById("expires-label");
  const renewBtn       = document.getElementById("renew-btn");
  const copyBtn        = document.getElementById("copy-btn");
  const sidebar        = document.getElementById("sidebar");
  const overlay        = document.getElementById("sidebar-overlay");
  const gate           = document.getElementById("gate");
  const gateMsg        = document.getElementById("gate-msg");
  const signinBtn      = document.getElementById("signin-btn");
  const passForm       = document.getElementById("pass-form");
  const passInput      = document.getElementById("pass");
  const pass2Input     = document.getElementById("pass2");
  const passError      = document.getElementById("pass-error");
  const passBtn        = document.getElementById("pass-btn");
  const forgotBtn      = document.getElementById("forgot-btn");

  // ── Helpers ──

  function preview(content) {
    const words = content.trim().split(/\s+/).slice(0, 8).join(" ");
    return words.length < content.trim().length ? words + "…" : words;
  }

  function expiryColor(expires) {
    const ratio = Math.max(0, Math.min(1, 1 - (expires - Date.now()) / EXPIRY_MS));
    const hue = Math.round(120 * (1 - ratio));
    return `hsl(${hue}, 70%, 42%)`;
  }

  function formatExpiry(expires) {
    const diff = expires - Date.now();
    if (diff <= 0) return "expired";
    const h = Math.floor(diff / 3600000);
    const m = Math.floor((diff % 3600000) / 60000);
    return `Expires in ${h}h ${m}m`;
  }

  function showPanel(panel) {
    loading.style.display    = "none";
    emptyState.style.display = "none";
    noteView.style.display   = "none";
    noteEditor.style.display = "none";
    gate.style.display       = "none";
    if (panel !== noteView) {
      renewBtn.style.display = "none";
      copyBtn.style.display  = "none";
    }
    if (panel) panel.style.display = "flex";
    if (panel === noteView) noteView.style.display = "block";
  }

  // ── Gate: sign in, then passphrase ──
  // mode: "signin" | "forbidden" | "unlock" | "setup" | "error"
  function showGate(mode, detail) {
    key = null;
    notes = [];
    activeId = null;
    isEditing = false;
    document.body.classList.add("locked");
    document.body.classList.toggle("signed-out", mode === "signin");
    renderList();
    titleDisplay.textContent = "Tote";
    expiresLabel.textContent = "";
    signinBtn.style.display = mode === "signin" ? "inline-block" : "none";
    passForm.style.display = (mode === "unlock" || mode === "setup") ? "flex" : "none";
    pass2Input.style.display = mode === "setup" ? "block" : "none";
    pass2Input.required = mode === "setup";
    forgotBtn.style.display = mode === "unlock" ? "inline" : "none";
    passBtn.textContent = mode === "setup" ? "Set passphrase" : "Unlock";
    passInput.autocomplete = mode === "setup" ? "new-password" : "current-password";
    passInput.value = pass2Input.value = "";
    passError.textContent = "";
    gateMsg.textContent = {
      signin: "Tote is private. Sign in to continue.",
      forbidden: `${detail} isn't allowed here.`,
      unlock: "Enter your passphrase. This device remembers it until you press Lock.",
      setup: "Choose a passphrase. Notes are encrypted with it before they leave this device, so nobody else, not even the server, can read them. If you forget it, the notes are gone.",
      error: "Couldn't reach Tote: " + detail,
    }[mode];
    showPanel(gate);
    if (mode === "unlock" || mode === "setup") passInput.focus();
  }

  async function opened() {
    document.body.classList.remove("locked", "signed-out");
    showPanel(loading);
    await loadNotes();
  }

  onUser(async user => {
    if (!user) { showGate("signin"); return; }
    document.getElementById("pass-user").value = user.email;
    document.body.classList.remove("signed-out");
    showPanel(loading);
    try {
      meta = await getMeta();
    } catch (err) {
      if (err.code === "tote-forbidden") showGate("forbidden", user.email);
      else showGate("error", err.message);
      return;
    }
    key = await readyKey(meta);
    if (key) await opened();
    else showGate(meta ? "unlock" : "setup");
  });

  signinBtn.addEventListener("click", () => {
    signIn().catch(err => { gateMsg.textContent = "Sign-in failed: " + (err.code || err.message); });
  });

  passForm.addEventListener("submit", async e => {
    e.preventDefault();
    const pass = passInput.value;
    passError.textContent = "";
    if (!meta) {
      if (pass.length < 8) { passError.textContent = "Use at least 8 characters."; return; }
      if (pass !== pass2Input.value) { passError.textContent = "Those don't match."; return; }
    }
    passBtn.disabled = true;
    const label = passBtn.textContent;
    passBtn.textContent = meta ? "Unlocking…" : "Setting up…";
    try {
      const k = meta ? await unlock(pass, meta) : await setPassphrase(pass);
      if (!k) { passError.textContent = "Wrong passphrase."; passInput.select(); return; }
      if (!meta) meta = await getMeta();
      key = k;
      passInput.value = pass2Input.value = "";
      await opened();
    } catch (err) {
      passError.textContent = "Failed: " + err.message;
    } finally {
      passBtn.disabled = false;
      passBtn.textContent = label;
    }
  });

  forgotBtn.addEventListener("click", async () => {
    if (!confirm("Delete every Tote note and the passphrase? Without the passphrase the notes can't be read, so they can't be recovered.")) return;
    try {
      await wipeAll();
      clearDraft();
      meta = null;
      showGate("setup");
    } catch (err) {
      alert("Failed to wipe: " + err.message);
    }
  });

  async function lockNow() {
    if (!(await leaveEdit())) return;
    await forgetKey();
    closeSidebar();
    showGate(meta ? "unlock" : "setup");
  }

  async function signOutNow() {
    if (!(await leaveEdit())) return;
    closeSidebar();
    await signOut(); // also forgets the key; onUser then shows the sign-in gate
  }

  // ── Render sidebar ──
  function renderList() {
    // Remove old items (keep emptyList)
    [...noteList.querySelectorAll(".note-item")].forEach(el => el.remove());

    if (notes.length === 0) {
      emptyList.style.display = key ? "block" : "none";
      return;
    }
    emptyList.style.display = "none";

    notes.forEach(note => {
      const item = document.createElement("div");
      item.className = "note-item" + (note.id === activeId ? " active" : "");
      item.dataset.id = note.id;
      item.style.borderLeftColor = expiryColor(note.expires);

      const prev = document.createElement("span");
      prev.className = "preview";
      prev.textContent = preview(note.content) || "(empty)";

      const del = document.createElement("button");
      del.className = "delete-btn";
      del.title = "Delete note";
      del.textContent = "✕";
      del.addEventListener("click", e => { e.stopPropagation(); deleteNote(note.id); });

      item.appendChild(prev);
      item.appendChild(del);
      item.addEventListener("click", async () => {
        if (!(await leaveEdit())) return;
        selectNote(note.id);
        closeSidebar();
      });
      noteList.appendChild(item);
    });
  }

  // ── Select note ──
  function selectNote(id) {
    activeId = id;
    isEditing = false;
    renderList();

    const note = notes.find(n => n.id === id);
    if (!note) return;

    noteView.textContent = note.content;
    titleDisplay.textContent = preview(note.content) || "(empty)";
    expiresLabel.textContent = formatExpiry(note.expires);
    renewBtn.style.display = "inline-flex";
    copyBtn.style.display  = "inline-flex";
    showPanel(noteView);

    // Single-click to edit
    noteView.onclick = () => startEdit(note);
  }

  // ── Edit ──
  function startEdit(note) {
    isEditing = true;
    noteTextarea.value = note ? note.content : "";
    showPanel(noteEditor);
    noteTextarea.focus();
  }

  function startNewNote() {
    if (!key) return;
    activeId = null;
    isEditing = true;
    noteTextarea.value = "";
    titleDisplay.textContent = "New note";
    expiresLabel.textContent = "";
    renderList();
    showPanel(noteEditor);
    noteTextarea.focus();
    closeSidebar();
  }

  // ── Save ──
  // Writes the editor contents to the server without changing the UI. Writes are
  // chained so overlapping saves (e.g. tab hidden mid-save) never create a note twice.
  let writeChain = Promise.resolve();
  function writeEdit() {
    const run = writeChain.then(doWrite);
    writeChain = run.catch(() => {});
    return run;
  }

  async function doWrite() {
    if (!key) return;
    const content = noteTextarea.value.trim();
    const existing = notes.find(n => n.id === activeId);
    if (!content || (existing && existing.content === content)) { clearDraft(content); return; }

    if (existing) {
      // Update existing note in place (saving also renews it)
      const expires = await putNote(key, activeId, content);
      notes = notes.map(n => n.id === activeId ? { ...n, content, expires } : n);
    } else {
      // New note
      const id = newId();
      const expires = await putNote(key, id, content);
      notes.unshift({ id, content, expires });
      activeId = id;
    }
    notes.sort((a, b) => b.expires - a.expires);
    clearDraft(content);
    renderList();
  }

  async function saveNote() {
    if (!noteTextarea.value.trim()) { cancelEdit(); return; }

    const saveBtn = document.getElementById("save-btn");
    saveBtn.disabled = true;
    saveBtn.textContent = "Saving…";

    try {
      await writeEdit();
      selectNote(activeId);
    } catch (err) {
      alert("Failed to save: " + err.message);
    } finally {
      saveBtn.disabled = false;
      saveBtn.textContent = "Save";
    }
  }

  // Autosave before leaving the editor for another note. Returns false if the
  // save failed, so the caller stays put and nothing is lost.
  async function leaveEdit() {
    if (!isEditing) return true;
    try {
      await writeEdit();
      isEditing = false;
      return true;
    } catch (err) {
      alert("Failed to save: " + err.message);
      return false;
    }
  }

  // ── Local draft (safety net if the tab closes before a save lands) ──
  // Stored encrypted with the same key, so the draft is no more readable than the notes.
  const DRAFT_KEY = "tote-draft";
  let draftSeq = 0;

  async function saveDraft() {
    if (!key) return;
    const seq = ++draftSeq;
    const box = await encrypt(key, "draft", JSON.stringify({ id: activeId, content: noteTextarea.value }));
    if (seq !== draftSeq) return; // a newer keystroke already won
    try { localStorage.setItem(DRAFT_KEY, JSON.stringify(box)); } catch {}
  }

  async function readDraft() {
    try {
      const box = JSON.parse(localStorage.getItem(DRAFT_KEY));
      if (box && !box.iv) { localStorage.removeItem(DRAFT_KEY); return null; } // plain-text draft from the old Tote
      if (!box || !key) return null;
      return JSON.parse(await decrypt(key, "draft", box));
    } catch { return null; }
  }

  async function clearDraft(savedContent) {
    if (savedContent === undefined) { draftSeq++; try { localStorage.removeItem(DRAFT_KEY); } catch {} return; }
    const seq = draftSeq;
    const d = await readDraft();
    if (seq === draftSeq && (!d || d.content.trim() === savedContent)) {
      try { localStorage.removeItem(DRAFT_KEY); } catch {}
    }
  }

  async function restoreDraft() {
    const d = await readDraft();
    if (!d || !d.content || !d.content.trim()) return false;
    const note = notes.find(n => n.id === d.id);
    if (note && note.content === d.content.trim()) { clearDraft(); return false; }

    activeId = note ? note.id : null;
    renderList();
    startEdit(null);
    noteTextarea.value = d.content;
    titleDisplay.textContent = "Unsaved draft restored";
    expiresLabel.textContent = "";
    return true;
  }

  // ── Copy ──
  async function copyNote() {
    const note = notes.find(n => n.id === activeId);
    if (!note) return;
    try {
      await navigator.clipboard.writeText(note.content);
      copyBtn.textContent = "Copied ✓";
    } catch {
      copyBtn.textContent = "Copy failed";
    }
    setTimeout(() => { copyBtn.textContent = "Copy"; }, 1500);
  }

  function cancelEdit() {
    isEditing = false;
    clearDraft();
    if (activeId) {
      selectNote(activeId);
    } else if (notes.length > 0) {
      selectNote(notes[0].id);
    } else {
      titleDisplay.textContent = "Select a note";
      expiresLabel.textContent = "";
      showPanel(emptyState);
    }
  }

  // ── Renew ──
  async function renewNote() {
    if (!activeId) return;
    try {
      const expires = await apiRenew(activeId);
      notes = notes.map(n => n.id === activeId ? { ...n, expires } : n);
      notes.sort((a, b) => b.expires - a.expires);
      expiresLabel.textContent = formatExpiry(expires);
      renderList();
    } catch (err) {
      alert("Failed to renew: " + err.message);
    }
  }

  // ── Delete ──
  async function deleteNote(id) {
    if (!confirm("Delete this note?")) return;
    if (id !== activeId && !(await leaveEdit())) return;
    try {
      await apiDelete(id);
      notes = notes.filter(n => n.id !== id);
      if (activeId === id) {
        activeId = null;
        titleDisplay.textContent = "Select a note";
        expiresLabel.textContent = "";
      }
      renderList();
      if (activeId) {
        selectNote(activeId);
      } else if (notes.length > 0) {
        selectNote(notes[0].id);
      } else {
        showPanel(emptyState);
      }
    } catch (err) {
      alert("Failed to delete: " + err.message);
    }
  }

  // ── Load ──
  async function loadNotes() {
    if (!key) return;
    try {
      const res = await listNotes(key);
      notes = res.notes;
      renderList();
      if (await restoreDraft()) {
        // reopened in the editor with the unsaved text
      } else if (notes.length > 0) {
        selectNote(notes[0].id);
      } else {
        titleDisplay.textContent = "Select a note";
        showPanel(emptyState);
      }
    } catch (err) {
      showPanel(loading);
      loading.innerHTML = "";
      const msg = document.createElement("span");
      msg.style.color = "#e55";
      msg.textContent = "Error loading notes: " + err.message;
      loading.appendChild(msg);
    }
  }

  // ── Mobile sidebar ──
  function openSidebar() {
    sidebar.classList.add("open");
    overlay.classList.add("visible");
  }

  function closeSidebar() {
    sidebar.classList.remove("open");
    overlay.classList.remove("visible");
  }

  // ── Event listeners ──
  async function newNoteClicked() {
    if (await leaveEdit()) startNewNote();
  }

  document.getElementById("new-note-btn").addEventListener("click", newNoteClicked);
  document.getElementById("refresh-btn").addEventListener("click", async (e) => {
    const btn = e.currentTarget;
    if (!key || !(await leaveEdit())) return;
    btn.classList.add("spinning");
    await loadNotes();
    btn.classList.remove("spinning");
  });
  document.getElementById("empty-new-btn").addEventListener("click", newNoteClicked);
  document.getElementById("save-btn").addEventListener("click", saveNote);
  document.getElementById("cancel-btn").addEventListener("click", cancelEdit);
  document.getElementById("lock-btn").addEventListener("click", lockNow);
  document.getElementById("signout-btn").addEventListener("click", signOutNow);
  document.getElementById("hamburger").addEventListener("click", openSidebar);
  renewBtn.addEventListener("click", renewNote);
  copyBtn.addEventListener("click", copyNote);
  noteTextarea.addEventListener("input", saveDraft);

  // Autosave when the tab is hidden (switching tabs, minimising, or closing).
  // Stays in the editor so you can carry on typing when you come back.
  const autosaveOnHide = () => { if (isEditing) writeEdit().catch(() => {}); };
  document.addEventListener("visibilitychange", () => { if (document.hidden) autosaveOnHide(); });
  window.addEventListener("pagehide", autosaveOnHide);
  overlay.addEventListener("click", closeSidebar);

  // Global keyboard shortcuts (not while typing, and not while locked)
  document.addEventListener("keydown", e => {
    if (isEditing || !key) return;
    if (e.target === noteTextarea || e.target.tagName === "INPUT" || e.target.tagName === "BUTTON") return;
    if (e.key === "Enter") {
      e.preventDefault();
      startNewNote();
    } else if (e.key === "ArrowUp" || e.key === "ArrowDown") {
      e.preventDefault();
      if (notes.length === 0) return;
      const idx = notes.findIndex(n => n.id === activeId);
      let next = e.key === "ArrowUp" ? idx - 1 : idx + 1;
      next = Math.max(0, Math.min(notes.length - 1, next));
      if (next !== idx) selectNote(notes[next].id);
    }
  });

  // Ctrl+Enter / Cmd+Enter to save
  noteTextarea.addEventListener("keydown", e => {
    if ((e.ctrlKey || e.metaKey) && e.key === "Enter") saveNote();
    if (e.key === "Escape") cancelEdit();
  });

  // Edit button in toolbar when viewing a note
  titleDisplay.style.cursor = "pointer";
  titleDisplay.title = "Click to edit";
  titleDisplay.addEventListener("click", () => {
    if (activeId && !isEditing) {
      const note = notes.find(n => n.id === activeId);
      if (note) startEdit(note);
    }
  });
</script>
</body>
</html>
