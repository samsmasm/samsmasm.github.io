# typeit Worker. Deploy with:  npx wrangler deploy   (from this directory)
#
# One-time setup:  npx wrangler login
#
# Secrets are NOT in this file and are NOT touched by `wrangler deploy`. They
# already exist on the deployed Worker:
#   SITE_PASSWORD   - the shared password
#   AUTH_SECRET     - random string signing the session cookie
#   GEMINI_API_KEY  - Google AI Studio key
# Only set them again if they are ever lost:  npx wrangler secret put NAME

name = "typeit"
main = "cloudflare-worker.js"
compatibility_date = "2026-06-16"

# Must own /typeit/* on the proxied unisam.nz zone (orange cloud).
[[routes]]
pattern = "unisam.nz/typeit/*"
zone_name = "unisam.nz"

[observability]
enabled = true
