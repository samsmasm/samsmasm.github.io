<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cluitar: a classical guitar practice path</title>
<link rel="icon" href="/unisamsq.png">
<script src="https://cdn.jsdelivr.net/npm/abcjs@6.4.4/dist/abcjs-basic-min.js"></script>
<style>
  :root{
    --accent:#7a1a4a;
    --accent-soft:#fff0f6;
    --accent-border:#f5b6d4;
    --ink:#2b2420;
    --muted:#5f574e;
    --light:#948c84;
    --hair:#f0e8ff;
    --ongoing:#a05a1a;
    --complete:#145c34;
    --serif:Georgia,'Iowan Old Style','Times New Roman',serif;
    --sans:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    background:#fff;
    color:var(--ink);
    font-family:var(--sans);
    font-size:17px;
    line-height:1.55;
    display:flex;
    flex-direction:column;
    overflow:hidden;
  }

  /* ---------- masthead ---------- */
  header.masthead{
    background:
      radial-gradient(ellipse at 12% 45%, #ffd6e7 0%, transparent 52%),
      radial-gradient(ellipse at 34% 18%, #ffe0f0 0%, transparent 46%),
      radial-gradient(ellipse at 58% 82%, #e8d6ff 0%, transparent 42%),
      radial-gradient(ellipse at 78% 28%, #d6f0ff 0%, transparent 44%),
      radial-gradient(ellipse at 92% 72%, #fff3d6 0%, transparent 40%),
      radial-gradient(ellipse at 48% 55%, #ffd6d6 0%, transparent 58%),
      #fff0f6;
    border-bottom:1px solid var(--accent-border);
    flex-shrink:0;
    display:flex;
    align-items:center;
    gap:0.9rem;
    padding:0.85rem 1.4rem;
  }
  .masthead img{
    width:56px;height:56px;
    border-radius:14px;
    background:rgba(255,255,255,0.55);
    flex-shrink:0;
  }
  .masthead h1{
    margin:0;
    font-family:var(--serif);
    font-size:1.7rem;
    font-weight:400;
    color:var(--accent);
  }
  .masthead .tagline{
    margin:0.1rem 0 0;
    font-size:13.5px;
    color:#5c5347;
  }
  .meta{
    margin-left:auto;
    text-align:right;
    font-size:13px;
    color:var(--light);
    display:flex;
    flex-direction:column;
    gap:0.2rem;
    align-items:flex-end;
  }
  .meta .tally{color:var(--muted);}
  .meta-row{display:flex;gap:0.8rem;align-items:baseline;}
  .linkish{
    background:none;border:none;padding:0;
    font:inherit;
    color:var(--accent);
    text-decoration:underline;
    text-decoration-color:var(--accent-border);
    text-underline-offset:3px;
    cursor:pointer;
  }
  .linkish:hover{text-decoration-color:var(--accent);}

  /* ---------- two-pane shell ---------- */
  .shell{flex:1;display:flex;min-height:0;}

  aside.sidebar{
    width:340px;
    flex-shrink:0;
    border-right:1px solid var(--hair);
    overflow-y:auto;
    padding:1.1rem 0 1.5rem;
    display:flex;
    flex-direction:column;
  }

  .today{
    margin:0 1.1rem 1.3rem;
    padding:0.9rem 1rem 1rem;
    background:var(--accent-soft);
    border:1.5px solid var(--accent-border);
    border-radius:10px;
  }
  .label{
    font-size:11px;
    font-weight:600;
    letter-spacing:0.13em;
    text-transform:uppercase;
    color:var(--accent);
  }
  .today-title{
    display:block;
    margin-top:0.4rem;
    font-family:var(--serif);
    font-size:18px;
    line-height:1.35;
    color:var(--accent);
    text-align:left;
    background:none;border:none;padding:0;
    cursor:pointer;
  }
  .today-title:hover{text-decoration:underline;text-underline-offset:3px;}
  .today .warmup{
    margin-top:0.7rem;
    padding-top:0.6rem;
    border-top:1px solid var(--accent-border);
    font-size:14px;
    color:#5c4450;
  }
  .today .warmup a{color:var(--accent);}

  nav#lesson-nav{padding:0 0.7rem;}
  .step-label{
    padding:0.5rem 0.4rem 0.45rem;
    margin-top:0.9rem;
    border-top:2px solid var(--accent-border);
    font-size:11px;
    font-weight:600;
    letter-spacing:0.13em;
    text-transform:uppercase;
    color:var(--accent);
  }
  .row{
    display:block;
    width:100%;
    text-align:left;
    background:none;
    border:none;
    border-radius:7px;
    padding:0.6rem 0.65rem;
    font-family:var(--serif);
    font-size:15.5px;
    line-height:1.4;
    color:var(--ink);
    cursor:pointer;
  }
  .row:hover{background:#fbf7fd;}
  .row.is-ongoing{color:var(--ongoing);}
  .row.is-complete{color:var(--light);}
  .row.is-selected{background:var(--accent-soft);color:var(--accent);}
  .row .today-flag{
    display:none;
    font-family:var(--sans);
    font-size:10px;
    font-weight:600;
    letter-spacing:0.12em;
    text-transform:uppercase;
    color:var(--accent);
    margin-left:0.5rem;
    white-space:nowrap;
  }
  .row.is-today .today-flag{display:inline;}

  .side-foot{
    margin-top:auto;
    padding:1.3rem 1.5rem 0;
    font-size:12px;
    color:#bbb;
  }
  .side-foot a{color:#bbb;}

  /* ---------- detail pane ---------- */
  section.detail{
    flex:1;
    overflow-y:auto;
    padding:2rem 2.4rem 4rem;
  }
  .detail-inner{max-width:880px;}
  .detail h2{
    margin:0.5rem 0 0;
    font-family:var(--serif);
    font-size:30px;
    font-weight:400;
    line-height:1.25;
    color:var(--accent);
  }
  .detail .desc{
    margin:0.7rem 0 0;
    max-width:720px;
    font-size:19px;
    line-height:1.6;
    color:var(--muted);
  }
  .detail .locked{
    margin-top:0.6rem;
    font-size:15px;
    color:var(--light);
    font-style:italic;
  }

  .toggle{
    margin-top:1.4rem;
    padding-top:1.1rem;
    border-top:1px solid var(--hair);
    display:flex;
    flex-wrap:wrap;
    align-items:baseline;
    font-size:16.5px;
  }
  .toggle button{
    background:none;border:none;
    font:inherit;
    color:var(--light);
    cursor:pointer;
    padding:0.35rem 0;
  }
  .toggle button:hover{color:var(--muted);}
  .toggle .sep{color:#d8d2ca;padding:0 0.6rem;}
  .toggle button.active{
    font-weight:600;
    border-bottom:2px solid currentColor;
  }
  .toggle button.active[data-status="not_started"]{color:var(--light);}
  .toggle button.active[data-status="ongoing"]{color:var(--ongoing);}
  .toggle button.active[data-status="complete"]{color:var(--complete);}

  .section-head{
    margin:2.2rem 0 0.8rem;
    font-size:11px;
    font-weight:600;
    letter-spacing:0.13em;
    text-transform:uppercase;
    color:var(--accent);
  }
  .notation{
    background:#fff;
    border:1px solid var(--hair);
    border-radius:8px;
    padding:0.8rem;
    overflow-x:auto;
  }
  .fingering{
    font-size:15px;
    color:var(--light);
    margin-top:0.5rem;
  }
  .terms{
    margin:1.3rem 0 0;
    max-width:720px;
    padding:0.9rem 1.1rem 1rem;
    background:var(--accent-soft);
    border:1px solid var(--accent-border);
    border-radius:8px;
  }
  .terms-head{
    font-size:11px;
    font-weight:600;
    letter-spacing:0.13em;
    text-transform:uppercase;
    color:var(--accent);
    margin-bottom:0.6rem;
  }
  .terms .term{
    font-size:16.5px;
    line-height:1.5;
    margin-top:0.45rem;
  }
  .terms .term:first-child{margin-top:0;}
  .terms dt{
    display:inline;
    font-weight:600;
    color:var(--ink);
  }
  .terms dt::after{content:': ';color:var(--light);font-weight:400;}
  .terms dd{
    display:inline;
    margin:0;
    color:var(--muted);
  }
  .blurb{
    max-width:720px;
    font-size:16px;
    line-height:1.5;
    color:var(--muted);
    margin:0.3rem 0 0.6rem;
  }
  .video{margin-bottom:1.8rem;}
  .video-title{font-size:16px;color:var(--muted);margin-bottom:0.25rem;}
  .video-title a{color:var(--muted);}
  .video-len{color:var(--light);}
  .video iframe{
    width:100%;
    aspect-ratio:16/9;
    border:1px solid var(--hair);
    border-radius:8px;
    display:block;
  }
  .links > div{margin-bottom:1.1rem;}
  .links > div:last-of-type{margin-bottom:0.4rem;}
  .links a{
    display:inline-block;
    font-size:17.5px;
    color:var(--accent);
  }
  .links .hint{
    font-size:13.5px;
    color:var(--light);
    margin-top:0.4rem;
  }

  @media (max-width:900px){
    body{overflow:auto;}
    .shell{flex-direction:column;}
    aside.sidebar{width:auto;border-right:none;border-bottom:1px solid var(--hair);overflow:visible;}
    section.detail{overflow:visible;padding:1.6rem 1.2rem 3rem;}
    .side-foot{display:none;}
  }
</style>
</head>
<body>

<header class="masthead">
  <img src="/unisamsq.png" alt="">
  <div>
    <h1>Cluitar</h1>
    <p class="tagline">A classical guitar practice path, for someone who already reads music</p>
  </div>
  <div class="meta">
    <span class="tally" id="tally">…</span>
    <div class="meta-row">
      <span id="sync">Working offline</span>
      <button class="linkish" id="auth-btn" hidden></button>
      <a class="linkish" href="https://unisam.nz">unisam.nz</a>
    </div>
  </div>
</header>

<div class="shell">
  <aside class="sidebar">
    <div class="today">
      <div class="label">Today</div>
      <button class="today-title" id="today-title">…</button>
      <div class="warmup" id="today-warmup"></div>
    </div>
    <nav id="lesson-nav"></nav>
    <div class="side-foot">
      Built by Sam G · all vibe coded · found a problem? <a href="https://unisam.nz">tell Sam</a>.
    </div>
  </aside>

  <section class="detail" id="detail"></section>
</div>

<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js';
import {
  getAuth, onAuthStateChanged, signInWithPopup, signInWithRedirect,

import {
  getFirestore, doc, getDoc, setDoc, onSnapshot
} from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js';

/* ------------------------------------------------------------------
   Firebase: shares the `cultivar-d3add` project. Progress lives in a
   single `cluitar` map field on users/{uid}, which the existing
   Firestore rules already permit and which cultivar's own code never
   reads or overwrites (it only ever updateDoc()s named fields).
   ------------------------------------------------------------------ */
const firebaseConfig = {
  apiKey: "AIzaSyBdT5SsKRuUFXvhf-8I_MJQWGSfzfuQ1eo",
  authDomain: "cultivar-d3add.firebaseapp.com",
  projectId: "cultivar-d3add",
  storageBucket: "cultivar-d3add.firebasestorage.app",
  messagingSenderId: "868864633895",
  appId: "1:868864633895:web:e2cee6294c8ea3ce637202"
};

const app = initializeApp(firebaseConfig, 'cluitar');
const auth = getAuth(app);
const db = getFirestore(app);
const provider = new GoogleAuthProvider();

const LOCAL_KEY = 'cluitar.progress.v1';
const STATUSES = ['not_started', 'ongoing', 'complete'];
const STATUS_LABEL = { not_started: 'Not started', ongoing: 'Ongoing', complete: 'Complete' };

let uid = null;
let progress = {};      // itemId -> { status, updatedAt (epoch ms) }
let unsubscribe = null;

// ---------- CURRICULUM DATA ----------
const curriculum = [
  {
    step: 1,
    title: "Step 1 · Technique foundation",
    items: [
      {
        id: "1.1",
        title: "Sitting position & footstool setup",
        desc: "Guitar on left leg, footstool under left foot, guitar angled ~45°, headstock roughly eye level.",
        prereqs: [],
        terms: [
          ["Headstock", "The end of the neck where the tuning pegs are."],
          ["Footstool", "A small adjustable step under your left foot that raises the left knee, so the guitar sits higher and you do not have to hunch."]
        ],
        videos: [{ id: "dYC9awwT_YQ", mins: 23, title: "Classical guitar position: how to sit, hold and position the guitar",
          blurb: "Bradford Werner walks through the whole setup from several camera angles: chair height, footstool, 45° tilt, headstock at eye level, and the points where the guitar touches your body." }],
        links: [{ url: "https://www.thisisclassicalguitar.com/basic-posture-and-sitting-position-guitar", label: "Classical guitar position lesson",
          blurb: "The written version of that video. Photos and diagrams plus a numbered checklist you can run through in about a minute before you play." }]
      },
      {
        id: "1.2",
        title: "Posture check (back, shoulders)",
        desc: "Spine straight, shoulders level and relaxed, sit toward the front of the chair.",
        prereqs: ["1.1"],
        terms: [
          ["X-Y axis", "Werner's phrase for sitting square: spine vertical, shoulders horizontal, no leaning to either side."]
        ],
        videos: [{ id: "U-ZV_3rsyiw", mins: 20, title: "6 common technique problems solved with a better guitar position",
          blurb: "Six things that feel like finger problems but are really position problems: wrist strain, reaching along the neck, reaching across strings, barre chords, hitting neighbouring strings, and guitar size." }],
        links: [{ url: "https://www.thisisclassicalguitar.com/basic-posture-and-sitting-position-guitar", label: "Basic posture and sitting position",
          blurb: "Same page as the last lesson. Reread just the posture steps at the top: spine, shoulders, and sitting toward the front edge of the chair." }]
      },
      {
        id: "1.3",
        title: "Right hand: free stroke (tirando), i-m alternation",
        desc: "Pluck one open string alternating i and m fingers, no follow-through onto the next string.",
        prereqs: ["1.1"],
        terms: [
          ["p i m a", "The four right-hand fingers, named from Spanish. p = pulgar (thumb), i = índice (index), m = medio (middle), a = anular (ring). The little finger is not used."],
          ["i-m alternation", "Play i, then m, then i, then m. Never the same finger twice in a row, which is what lets you play fast without the finger having to reset."],
          ["Free stroke (tirando)", "The finger plucks the string and carries on into the air, clearing the next string so it can keep ringing. Your default stroke, roughly 80% of playing."],
          ["Open string", "A string played with no left-hand finger on it."]
        ],
        videos: [{ id: "RDOqubQd9Jo", mins: 35, title: "Right hand position and technique lesson",
          blurb: "Ten principles for the plucking hand, each timestamped in the description so you can jump around. The essentials for now: forearm resting on the guitar edge, wrist straight, fingers curved, moving in toward the palm." }],
        links: [
          { url: "https://www.thisisclassicalguitar.com/right-hand-technique-for-classical-guitar/", label: "Right hand position and technique",
            blurb: "Those same ten principles written out with reference photos, so you can compare your hand against the picture without pausing a video." },
          { url: "https://richterguitar.com/rest-stroke-vs-free-stroke/", label: "Free stroke vs rest stroke guide",
            blurb: "The clearest short explanation of the two strokes and, more usefully, when to pick which: free stroke when you want several strings ringing together, rest stroke when one note needs to lead." }
        ],
        notation: "ex1",
        fingeringNote: "Play each note alternating i and m: i m i m i m i m"
      },
      {
        id: "1.4",
        title: "Right hand: rest stroke (apoyando), i-m alternation",
        desc: "Same alternation, but the finger follows through and rests on the next string.",
        prereqs: ["1.3"],
        terms: [
          ["Rest stroke (apoyando)", "The finger plucks and then lands on the next string, stopping there. Louder and rounder than free stroke, which is why it suits scales and melodies."],
          ["Soundboard", "The flat wooden face of the guitar. Rest stroke pushes the string slightly toward it, and that is where the fuller sound comes from."]
        ],
        videos: [{ id: "vi42Tlb_9VU", mins: 30, title: "Q&A lesson: rest and free stroke on classical guitar",
          blurb: "A question and answer session rather than a tutorial, so skim the timestamps. The first eight minutes cover the actual hand movement, which is the part you need now." }],
        links: [{ url: "https://www.classicalguitarcorner.com/l111-rest-stroke-on-the-classical-guitar", label: "Rest stroke on the classical guitar",
          blurb: "One page, two minutes. Why rest stroke is the easier stroke to get a good sound from as a beginner (the next string catches your finger like a net), and its one drawback: landing on a string silences it." }]
      },
      {
        id: "1.5",
        title: "Right hand: adding thumb (p)",
        desc: "Thumb (p) alternates with i/m, resting on the adjacent bass string between strokes.",
        prereqs: ["1.4"],
        terms: [
          ["p", "The thumb. It stays in front of the fingers, not tucked behind them, and generally handles the three bass strings."],
          ["Bass strings", "The three thick low strings: E, A and D, numbered 6, 5 and 4."],
          ["Chromatic", "Moving up one fret at a time, playing every note in order with no gaps. It is a warm-up pattern, not music."]
        ],
        videos: [{ id: "h5wimMaPvp8", mins: 4, title: "Chromatic warm-up routine (thumb and finger coordination)",
          blurb: "Four minutes, no talking around it. A one-fret-at-a-time exercise up and down the neck that gets both hands moving and coordinates the thumb with i and m." }],
        links: [{ url: "https://proflamenco.gumroad.com/l/wTghdy", label: "Chromatic warm-up PDF with tabs",
          blurb: "The same exercise as a downloadable PDF in both tab and standard notation, so you can put it on the music stand instead of replaying the video." }]
      },
      {
        id: "1.6",
        title: "Left hand: thumb & finger position, one finger per fret",

        prereqs: ["1.1"],
        terms: [
          ["1 2 3 4", "The left-hand fingers, numbered: 1 = index, 2 = middle, 3 = ring, 4 = little. Numbers for the fretting hand, letters (p i m a) for the plucking hand."],
          ["One finger per fret", "Each finger owns one fret and stays over it, so the hand does not shuffle sideways for every note."],
          ["Finger independence", "Being able to move one finger without the others following along. It is the thing the spider exercise below is training."]
        ],
        videos: [
          { id: "HTjwvwCZmRo", mins: 14, title: "Left hand position and technique lesson",
            blurb: "Five checkable rules: wrist straight and not bent out, knuckles parallel to the strings, thumb vertical behind the 2nd finger, fingers curved and on their tips, fingers close to the fret." },
          { id: "RHfzegyFTmI", mins: 5, title: "The spider: a left hand independence exercise",
            blurb: "A short demo of the spider, a crawling pattern from Scott Tennant's Pumping Nylon. It stretches the hand and exposes any finger that will not move on its own." }
        ],
        links: [
          { url: "https://thisisclassicalguitar.com/left-hand-technique-and-position", label: "Left hand position lesson",
            blurb: "High resolution photos of the arm, wrist and each finger from several angles. Useful as a mirror check: hold the pose and compare." },
          { url: "https://www.thisisclassicalguitar.com/lesson-the-spider-exercise/", label: "The spider exercise (with notation)",
            blurb: "The spider written out, with a note on where it comes from. Play it slowly, on the fingertips, without letting the wrist bend out." }
        ]
      }
    ]
  },
  {
    step: 2,
    title: "Step 2 · First position note-reading",
    items: [
      {
        id: "2.1",
        title: "Open strings on the staff",
        desc: "Learn E A D G B E as they appear on the treble clef staff.",
        prereqs: ["1.3", "1.6"],
        terms: [
          ["Staff", "The five lines sheet music sits on. Higher on the staff means a higher note."],
          ["Treble clef", "The curly symbol at the start of each line. Guitar music always uses it, and it fixes which line means which note."],
          ["E A D G B E", "Your six open strings, thickest to thinnest. String 6 is the low E, string 1 is the high E."],
          ["Sight reading", "Playing something straight off the page without having worked it out first."]
        ],
        videos: [{ id: "HjKpXSuRW9I", mins: 10, title: "First notes on 1st and 2nd strings (also covers staff basics)",

        links: [{ url: "https://www.thisisclassicalguitar.com/free-classical-guitar-method-book-pdf/", label: "Werner's free method book vol.1 (PDF)",

      {

      {

      {

      {

        prereqs: ["2.4"],
        terms: [

          blurb: "Nine minutes on a lute dance from 1568. Mostly about the chord shapes, which recur throughout, and keeping the melody singing above them." }],
        links: [{ url: "https://www.thisisclassicalguitar.com/lesson-la-tirantine-adrian-le-roy/", label: "La Tirantine lesson and score",
          blurb: "Lesson page with the score. Notes that the three-note chords make repeated right-hand fingers unavoidable, so alternation is a guide here and not a rule." }]
      },
      {
        id: "7.5",
        title: "One piece, start to finish, from memory",
        desc: "Self-assessed gate: pick whichever of the three sits best and play it through at tempo without the score. That is the end of the beginner path.",
        prereqs: ["7.3", "7.4"],
        terms: [
          ["At tempo", "At the speed the piece is meant to go, not the speed you practised it at."]
        ],
        videos: [],
        links: []
      }
    ]
  }
];

// Videos and links last verified 2026-09-06. Small teaching-channel videos go
// private or get re-uploaded fairly often. If an embed shows an error, the
// video title above it links out to YouTube so there is still a way through.
const warmup = { videoId: "h5wimMaPvp8", title: "5-minute chromatic warm-up" };

const notationExamples = {
  ex1: "X:1\nT:\nM:4/4\nL:1/4\nK:C\ne e e e | e e e e |",
  ex2: "X:2\nT:\nM:4/4\nL:1/4\nK:C\nC D E F | G A B c | B A G F | E D C |",
  // Two voices on one staff, the way guitar music writes melody over bass.
  ex3: "X:3\nT:\nM:4/4\nL:1/4\n%%score (V1 V2)\nV:V1 stem=up\nV:V2 stem=down\nK:C\n[V:V1] e e g g | a a g2 |\n[V:V2] C4 | F4 |",
  ex4: "X:4\nT:\nM:4/4\nL:1/8\nK:C\nC G c e C G c e | B, G d f B, G d f |",
  ex5: "X:5\nT:\nM:4/4\nL:1/4\nK:C\n(f g) (g f) | (f a) (a f) |",
ex3: "X:3\nT:\nM:4/4\nL:1/4\n%%score (V1 V2)\nV:V1 stem=up\nV:V2 stem=down\nK:C\n[V:V1] e e g g | a a g2 |\n[V:V2] C4 | F4 |",
ex4: "X:4\nT:\nM:4/4\nL:1/8\nK:C\nC G c e C G c e | B, G d f B, G d f |",
ex5: "X:5\nT:\nM:4/4\nL:1/4\nK:C\n(f g) (g f) | (f a) (a f) |"
};

const allItems = curriculum.flatMap(s => s.items);
const itemById = new Map(allItems.map(i => [i.id, i]));
const nodes = new Map();   // itemId -> { row }  (sidebar rows)

// ---------- STORAGE ----------
function normalise(raw) {
  const out = {};
  for (const [id, v] of Object.entries(raw || {})) {
    if (!itemById.has(id) || !v) continue;
    const status = STATUSES.includes(v.status) ? v.status : 'not_started';
    out[id] = { status, updatedAt: toMillis(v.updatedAt) };
  }
  return out;
}

function toMillis(val) {
  if (typeof val === 'number' && isFinite(val)) return val;
  if (typeof val === 'string') {
    const t = Date.parse(val);
    return isNaN(t) ? 0 : t;
  }
  if (val && typeof val.toMillis === 'function') return val.toMillis();
  return 0;
}

function loadLocal() {
  try {
    return normalise(JSON.parse(localStorage.getItem(LOCAL_KEY) || '{}'));
  } catch {
    return {};
  }
}

function saveLocal() {
  try {
    localStorage.setItem(LOCAL_KEY, JSON.stringify(progress));
  } catch { /* private browsing, quota, so progress just will not persist locally */ }
}

// Per item, the more recently touched record wins.
function merge(a, b) {
  const out = { ...a };
  for (const [id, rec] of Object.entries(b)) {
    if (!out[id] || rec.updatedAt >= out[id].updatedAt) out[id] = rec;
  }
  return out;
}

let savePending = null;
function saveRemote() {
  if (!uid) return;
  clearTimeout(savePending);
  savePending = setTimeout(() => {
    savePending = null;
    setDoc(doc(db, 'users', uid), { cluitar: progress }, { merge: true })
      .catch(err => {
        console.error('cluitar: save failed', err);
        setSync('Sync error, changes kept on this device');
      });
  }, 400);
}

// ---------- AUTH ----------
const authBtn = document.getElementById('auth-btn');
const syncEl = document.getElementById('sync');
function setSync(text) { syncEl.textContent = text; }

getRedirectResult(auth).catch(err => console.error('cluitar: redirect sign-in failed', err));

onAuthStateChanged(auth, async (user) => {
  if (unsubscribe) { unsubscribe(); unsubscribe = null; }

  if (!user) {
    uid = null;
    setSync('Not signed in, progress stays on this device');
    authBtn.textContent = 'Sign in to sync';
    authBtn.hidden = false;
    authBtn.onclick = signIn;
    return;
  }

  uid = user.uid;
  authBtn.textContent = 'Sign out';
  authBtn.hidden = false;
  authBtn.onclick = () => signOut(auth);
  setSync('Syncing…');

  // One-time merge of whatever this device has with whatever the account has.
  try {
    const snap = await getDoc(doc(db, 'users', uid));
    const remote = normalise(snap.exists() ? snap.data().cluitar : {});
    const merged = merge(remote, progress);
    const changed = JSON.stringify(merged) !== JSON.stringify(remote);
    progress = merged;
    saveLocal();
    refreshAll();
    if (changed) saveRemote();
  } catch (err) {
    console.error('cluitar: initial load failed', err);
    setSync('Sync error, changes kept on this device');
    return;
  }

  unsubscribe = onSnapshot(doc(db, 'users', uid), (snap) => {
    if (savePending) return;                    // our own write is still in flight
    const remote = normalise(snap.exists() ? snap.data().cluitar : {});
    progress = merge(progress, remote);
    saveLocal();
    refreshAll();
    setSync(user.displayName ? `Synced as ${user.displayName}` : 'Synced');
  }, (err) => {
    console.error('cluitar: snapshot failed', err);
    setSync('Sync error, changes kept on this device');
  });

  setSync(user.displayName ? `Synced as ${user.displayName}` : 'Synced');
});

async function signIn() {
  try {
    await signInWithPopup(auth, provider);
  } catch (err) {
    // Popups are blocked on plenty of mobile browsers, so fall back to redirect.
    if (err && /popup/i.test(err.code || '')) signInWithRedirect(auth, provider);
    else console.error('cluitar: sign-in failed', err);
  }
}

// ---------- STATE HELPERS ----------
function getStatus(id) {
  return (progress[id] && progress[id].status) || 'not_started';
}

function setStatus(id, status) {
  if (getStatus(id) === status) return;
  progress[id] = { status, updatedAt: Date.now() };
  saveLocal();
  saveRemote();
  refreshAll();
}

function daysSince(id) {
  const at = progress[id] && progress[id].updatedAt;
  if (!at) return Infinity;
  return (Date.now() - at) / 86400000;
}

function prereqsSatisfied(item) {
  return item.prereqs.every(id => getStatus(id) !== 'not_started');
}

function byId(a, b) {
  return a.id.localeCompare(b.id, undefined, { numeric: true });
}

// ---------- RECOMMENDATION ENGINE ----------
function computeSuggestion() {
  const actionable = allItems
    .filter(i => getStatus(i.id) !== 'complete')
    .filter(prereqsSatisfied);

  const pick = (fn) => actionable.filter(fn).sort(byId)[0];

  // Something started and then left alone deserves picking back up first.
  return pick(i => getStatus(i.id) === 'ongoing' && daysSince(i.id) > 3)
      || pick(i => getStatus(i.id) === 'not_started')
      || pick(i => getStatus(i.id) === 'ongoing')
      || null;
}

// ---------- RENDER ----------
const detailEl = document.getElementById('detail');
let selectedId = null;

function el(tag, cls, text) {
  const n = document.createElement(tag);
  if (cls) n.className = cls;
  if (text != null) n.textContent = text;
  return n;
}

function buildSidebar() {
  const nav = document.getElementById('lesson-nav');
  curriculum.forEach(step => {
    nav.appendChild(el('div', 'step-label', step.title));
    step.items.forEach(item => {
      const row = el('button', 'row');
      row.appendChild(el('span', 'row-label', item.title));
      row.appendChild(el('span', 'today-flag', 'today'));
      row.addEventListener('click', () => selectItem(item.id));
      nav.appendChild(row);
      nodes.set(item.id, { row });
    });
  });
}

function selectItem(id) {
  if (selectedId === id) return;
  selectedId = id;
  renderDetail();
  refreshSidebar();
  detailEl.scrollTop = 0;
}

// Builds the whole right pane. Only ever called when the selection actually
// changes. Rebuilding it on a status click would tear down and reload the
// video iframes mid-playback.
function renderDetail() {
  const item = itemById.get(selectedId);
  detailEl.innerHTML = '';
  if (!item) return;

  const wrap = el('div', 'detail-inner');

  const step = curriculum.find(s => s.items.includes(item));
  wrap.appendChild(el('div', 'label', step.title));
  wrap.appendChild(el('h2', null, item.title));
  wrap.appendChild(el('p', 'desc', item.desc));
  wrap.appendChild(el('div', 'locked'));

  if (item.terms && item.terms.length) {
    const box = el('dl', 'terms');
    box.appendChild(el('div', 'terms-head', 'In plain words'));
    item.terms.forEach(([term, meaning]) => {
      // dl > div > (dt, dd) is valid HTML5, and lets each pair run on one line.
      const pair = el('div', 'term');
      pair.appendChild(el('dt', null, term));
      pair.appendChild(el('dd', null, meaning));
      box.appendChild(pair);
    });
    wrap.appendChild(box);
  }

  const toggle = el('div', 'toggle');
  STATUSES.forEach((status, idx) => {
    if (idx) toggle.appendChild(el('span', 'sep', '·'));
    const btn = el('button', null, STATUS_LABEL[status]);
    btn.dataset.status = status;
    btn.addEventListener('click', () => setStatus(item.id, status));
    toggle.appendChild(btn);
  });
  wrap.appendChild(toggle);

  if (item.notation) {
    wrap.appendChild(el('div', 'section-head', 'Notation'));
    const box = el('div', 'notation');
    box.id = 'notation-' + item.id.replace(/\./g, '-');
    wrap.appendChild(box);
    if (item.fingeringNote) wrap.appendChild(el('div', 'fingering', item.fingeringNote));
  }

  if (item.videos.length) {
    wrap.appendChild(el('div', 'section-head', item.videos.length > 1 ? 'Videos' : 'Video'));
    item.videos.forEach(v => {
      const block = el('div', 'video');
      const cap = el('div', 'video-title');
      const capLink = document.createElement('a');
      capLink.href = `https://youtu.be/${encodeURIComponent(v.id)}`;
      capLink.target = '_blank';
      capLink.rel = 'noopener';
      capLink.textContent = v.title;
      cap.appendChild(capLink);
      if (v.mins) cap.appendChild(el('span', 'video-len', ' · ' + v.mins + ' min'));
      block.appendChild(cap);
      if (v.blurb) block.appendChild(el('div', 'blurb', v.blurb));

      const frame = document.createElement('iframe');
      frame.allowFullscreen = true;
      frame.src = `https://www.youtube.com/embed/${encodeURIComponent(v.id)}`;
      frame.title = v.title;
      block.appendChild(frame);
      wrap.appendChild(block);
    });
  }

  if (item.links.length) {
    wrap.appendChild(el('div', 'section-head', 'Read more'));
    const links = el('div', 'links');
    item.links.forEach(l => {
      const row = document.createElement('div');
      const a = document.createElement('a');
      a.href = l.url;
      a.target = '_blank';
      a.rel = 'noopener';
      a.textContent = l.label;
      row.appendChild(a);
      if (l.blurb) row.appendChild(el('div', 'blurb', l.blurb));
      links.appendChild(row);
    });
    // These sites send X-Frame-Options, so they cannot be shown in this pane.
    links.appendChild(el('div', 'hint', 'Opens in a new tab.'));
    wrap.appendChild(links);
  }

  detailEl.appendChild(wrap);

  if (item.notation && window.ABCJS) {
    ABCJS.renderAbc('notation-' + item.id.replace(/\./g, '-'), notationExamples[item.notation], { responsive: 'resize' });
  }

  refreshDetailStatus();
}

// Status-only update, so the iframes survive.
function refreshDetailStatus() {
  const item = itemById.get(selectedId);
  if (!item) return;
  const status = getStatus(item.id);

  detailEl.querySelectorAll('.toggle button').forEach(btn => {
    btn.classList.toggle('active', btn.dataset.status === status);
  });

  const locked = detailEl.querySelector('.locked');
  if (locked) {
    const blocked = item.prereqs.filter(p => getStatus(p) === 'not_started');
    locked.textContent = blocked.length
      ? `Comes after ${blocked.map(p => itemById.get(p).title).join(' and ')}.`
      : '';
  }
}

function refreshSidebar() {
  const suggestion = computeSuggestion();
  allItems.forEach(item => {
    const { row } = nodes.get(item.id);
    const status = getStatus(item.id);
    row.classList.toggle('is-ongoing', status === 'ongoing');
    row.classList.toggle('is-complete', status === 'complete');
    row.classList.toggle('is-selected', item.id === selectedId);
    row.classList.toggle('is-today', !!suggestion && suggestion.id === item.id);
  });
  renderToday(suggestion);
  renderTally();
}

function renderToday(s) {
  const btn = document.getElementById('today-title');
  if (s) {
    btn.textContent = s.title;
    btn.disabled = false;
    btn.onclick = () => selectItem(s.id);
  } else {
    btn.textContent = 'Everything here is done';
    btn.disabled = true;
    btn.onclick = null;
  }
  document.getElementById('today-warmup').innerHTML =
    `Warm up first: <a href="https://youtu.be/${warmup.videoId}" target="_blank" rel="noopener">${warmup.title}</a>`;
}

function renderTally() {
  const complete = allItems.filter(i => getStatus(i.id) === 'complete').length;
  const ongoing = allItems.filter(i => getStatus(i.id) === 'ongoing').length;
  const parts = [`${complete} of ${allItems.length} complete`];
  if (ongoing) parts.push(`${ongoing} on the go`);
  document.getElementById('tally').textContent = parts.join(' · ');
}

// Marking the open lesson complete moves the recommendation on, but must not
// yank the pane out from under a video that is still playing.
function refreshAll() {
  refreshSidebar();
  refreshDetailStatus();
}

// ---------- GO ----------
progress = loadLocal();
buildSidebar();
selectItem((computeSuggestion() || allItems[0]).id);
</script>
