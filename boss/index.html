<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>You're the Boss</title>
<link rel="icon" href="/geocornsmall.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Fraunces:opsz,wght@9..144,500;9..144,700&display=swap" rel="stylesheet">
<style>
  /* AESTHETIC.md Option B (paper and ink), BM blue as the section colour */
  :root { --masthead: #1e2a4a; --amber-rule: #f4a629; --bg: #f7f6f2; --surface: #fffdf8;
    --bm: #1a3a7a; --bm-bg: #fffdf8; --bm-b: #e3e0d8; --mid: #5b6680; --rule: #e3e0d8; --hover: #efede6;
    --good: #18634f; --good-bg: #d9eee6; --bad: #8a1c1c; --bad-bg: #f8e1e1; --amber: #8a5a00; --amber-bg: #fdf0d6;
    --serif: 'Fraunces', Georgia, serif; }
  * { box-sizing: border-box; }
  h1, h2, h3, .big, .nm { font-variant-numeric: lining-nums; }
  body { margin: 0; background: var(--bg); color: #1e2a4a;
    font-family: 'Atkinson Hyperlegible', -apple-system, 'Segoe UI', sans-serif; font-size: 16px; line-height: 1.5; }
  :focus-visible { outline: 3px solid var(--amber-rule); outline-offset: 2px; }
  header { display: flex; align-items: center; gap: 12px; padding: 8px 18px; flex-wrap: wrap;
    background: var(--masthead); border-bottom: 4px solid var(--amber-rule); }
  header img { width: 48px; height: 48px; }
  header h1 { font-family: var(--serif); font-weight: 700; font-size: 26px; margin: 0; color: #fff; }
  header .sub { font-size: 12px; color: #c9d2ea; letter-spacing: .08em; text-transform: uppercase; }
  header nav { margin-left: auto; display: flex; gap: 4px; align-items: center; }
  header nav button, header nav a { background: none; border: 0; border-bottom: 3px solid transparent; color: #dfe4f2; font-size: 15px;
    padding: 6px 10px; text-decoration: none; border-radius: 0; }
  header nav .on { color: #fff; border-bottom-color: var(--amber-rule); }
  main { max-width: 1120px; margin: 0 auto; padding: 16px 18px 40px; }
  .cols { display: grid; grid-template-columns: 290px 1fr; gap: 26px; align-items: start; }
  @media (max-width: 760px) { .cols { grid-template-columns: 1fr; gap: 14px; } }

  /* worker panel */
  .worker { border: 1.5px solid var(--bm-b); background: var(--bm-bg); border-radius: 12px; padding: 12px 14px; }
  .worker .top { text-align: center; }
  .worker svg.av { width: 180px; height: 180px; display: block; margin: 0 auto; }
  .worker .nm { font-family: var(--serif); font-size: 22px; color: var(--bm); margin-top: 2px; }
  .worker .job { font-size: 13px; color: var(--mid); }
  @media (max-width: 760px) {
    .worker .top { display: flex; align-items: center; gap: 12px; text-align: left; }
    .worker svg.av { width: 96px; height: 96px; margin: 0; }
  }
  .stats { margin: 10px 0 8px; display: grid; grid-template-columns: auto 1fr; gap: 4px 10px; align-items: center; font-size: 14px; }
  .dots { display: flex; flex-wrap: wrap; gap: 4px; align-items: center; }
  .dot { width: 14px; height: 14px; border-radius: 50%; background: var(--bm); }
  .dot.zero { background: none; border: 2px dashed var(--bad); }
  .warn { width: 22px; height: 20px; }
  .num { font-weight: 700; margin-left: 6px; color: var(--bm); font-size: 16px; }
  .warns .num { color: var(--bad); font-size: 13px; }
  .tools { display: flex; gap: 8px; }
  .tools button { flex: 1; }
  .bubble { margin-top: 10px; background: #fff; border: 1.5px solid var(--bm-b); border-radius: 12px; padding: 8px 10px; font-size: 15px; position: relative; }
  .bubble:before { content: ''; position: absolute; top: -9px; left: 40px; border: 8px solid transparent; border-top: 0; border-bottom-color: var(--bm-b); }
  .bubble.bad { border-color: #e7a9a9; }

  button { font: inherit; cursor: pointer; border-radius: 10px; }
  .btn { background: #fff; border: 1.5px solid var(--bm-b); color: var(--bm); padding: 8px 12px; font-size: 14px; }
  .btn:hover { background: var(--hover); }
  .btn.main { background: var(--masthead); color: #fff; border-color: var(--masthead); font-size: 18px; padding: 12px 26px; }
  .btn.main:hover { background: var(--bm); }
  .btn.urgent { border-color: #e7a9a9; color: var(--bad); }
  .btn:disabled { opacity: .45; cursor: default; }
  .btn.danger { border-color: #e7a9a9; color: var(--bad); }
  .btn.danger.arm { background: var(--bad); color: #fff; }

  /* hub */
  .tag { font-size: 12px; letter-spacing: .1em; text-transform: uppercase; color: var(--mid); }
  .tag .urg { color: var(--bad); font-weight: 700; margin-left: 8px; }
  .bar { height: 6px; background: var(--rule); border-radius: 3px; margin: 6px 0 12px; overflow: hidden; }
  .bar i { display: block; height: 100%; background: var(--amber-rule); }
  h2 { font-family: var(--serif); font-weight: 600; font-size: 30px; color: var(--bm); margin: 0 0 4px; }
  .scene { font-size: 18px; margin: 0 0 14px; }
  .opts { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  @media (max-width: 900px) { .opts { grid-template-columns: 1fr; } }
  .opt { text-align: left; background: var(--surface); border: 1.5px solid var(--bm-b); padding: 12px 14px; font-size: 16px; color: #1d2433; min-height: 56px; }
  .opt:hover { background: var(--hover); border-color: var(--bm); }
  .opt.on { background: #e4e9f5; border-color: var(--bm); border-width: 2.5px; }

  /* key word ? */
  .q { display: inline-block; width: 18px; height: 18px; line-height: 16px; margin-left: 3px; border-radius: 50%;
    border: 1.5px solid var(--mid); color: var(--mid); font-size: 11px; font-weight: 700; text-align: center;
    cursor: help; vertical-align: 2px; background: #fff; }
  .q:hover, .q:focus { background: var(--bm); color: #fff; border-color: var(--bm); outline: none; }

  /* result */
  .chips { display: flex; flex-wrap: wrap; gap: 10px; margin: 6px 0 14px; }
  .chip { font-size: 22px; font-weight: 700; padding: 8px 14px; border-radius: 10px; border: 1.5px solid; }
  .chip.up { color: var(--good); background: var(--good-bg); border-color: #a8dcbb; }
  .chip.down { color: var(--bad); background: var(--bad-bg); border-color: #e7a9a9; }
  .chip.flat { color: var(--mid); background: #fff; border-color: var(--bm-b); }
  .msgs { font-size: 18px; margin: 0 0 12px; }
  .msgs p { margin: 4px 0; }
  .fun { font-size: 18px; font-style: italic; color: #6a3fa0; margin: 0 0 12px; }
  .termline { font-size: 14px; color: var(--mid); margin-bottom: 14px; }
  details { margin: 12px 0; border-top: 1px solid var(--rule); padding-top: 8px; }
  summary { cursor: pointer; color: var(--mid); font-size: 14px; }
  details p { font-size: 15px; }
  .named { font-size: 18px; font-weight: 700; margin-bottom: 8px; }
  .named.ok { color: var(--good); } .named.no { color: var(--bad); }

  /* name-it and HR */
  .hr { border: 1.5px solid var(--bm-b); border-radius: 12px; padding: 14px 16px; background: var(--bm-bg); }
  .hr .who { font-size: 12px; letter-spacing: .1em; text-transform: uppercase; color: var(--mid); }
  .hr .ask { font-family: var(--serif); font-size: 24px; color: var(--bm); margin: 2px 0 12px; }
  .row { display: flex; flex-wrap: wrap; gap: 10px; }
  .quizopts { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  @media (max-width: 600px) { .quizopts { grid-template-columns: 1fr; } }
  .quizopts .opt { font-weight: 600; }

  /* pick */
  .pickhead { display: flex; flex-wrap: wrap; gap: 8px 24px; align-items: end; }
  .namebox label { display: block; font-size: 14px; color: var(--mid); }
  .namebox input[type=text] { font: inherit; font-size: 18px; padding: 8px 10px; border: 1.5px solid var(--bm-b); border-radius: 10px; width: 260px; max-width: 100%; }
  .namebox .small { font-size: 13px; color: var(--mid); display: block; margin-top: 4px; }
  .namemsg { color: var(--bad); font-size: 14px; min-height: 0; }
  .namewarn { background: var(--amber-bg); border: 1.5px solid #e3c47a; color: var(--amber); border-radius: 10px; padding: 6px 10px; margin-top: 6px; font-size: 14px; max-width: 520px; }
  .namewarn:empty { display: none; }
  .hires { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 12px; margin-top: 12px; }
  .hire { text-align: center; background: var(--bm-bg); border: 1.5px solid var(--bm-b); padding: 8px; }
  .hire:hover { border-color: var(--bm); transform: translateY(-2px); }
  .hire.cat { background: #fff6ea; border-color: #f2c48d; }
  .hire svg { width: 110px; height: 110px; }
  .hire .nm { font-family: var(--serif); font-size: 19px; color: var(--bm); }
  .hire .job { font-size: 13px; color: #33415e; min-height: 38px; }
  .hire .note { font-size: 12px; color: var(--mid); font-style: italic; margin-top: 2px; }
  .agenote { font-size: 14px; color: var(--mid); margin: 8px 0 0; }
  .hire .stats { justify-content: center; margin: 6px auto 0; width: max-content; font-size: 13px; text-align: left; }
  .hire .dot { width: 11px; height: 11px; }
  .lead { font-size: 18px; margin: 0; }
  .rules { max-width: 720px; }

  /* end */
  .endhead { display: flex; gap: 18px; align-items: center; flex-wrap: wrap; }
  .endhead svg { width: 150px; height: 150px; }
  .big { font-family: var(--serif); font-size: 40px; margin: 0; }
  .big.win { color: var(--good); } .big.lose { color: var(--bad); }
  .scoreline { font-size: 22px; margin: 4px 0 10px; }
  .scoreline b { font-size: 30px; color: var(--bm); }
  .breakdown { border-collapse: collapse; margin: 0 0 12px; font-size: 15px; }
  .breakdown td { padding: 3px 10px 3px 0; border-top: 1px solid var(--rule); }
  .breakdown td.n { text-align: right; color: var(--mid); }
  .breakdown td.n b { color: var(--ink, #1e2a4a); }
  .scorekey { display: flex; flex-wrap: wrap; gap: 4px 18px; align-items: baseline; margin: 12px 0 0; padding: 10px 14px;
    background: var(--surface); border: 1px solid var(--line, #e3e0d8); border-left: 4px solid var(--amber-rule); border-radius: 10px; font-size: 15px; }
  .scorekey b { width: 100%; font-family: var(--serif); color: var(--bm); font-size: 17px; }
  .scorekey em { font-style: normal; font-weight: 700; color: var(--good); }
  .scorekey .neg em { color: var(--bad); }
  .ptswhy { list-style: none; padding: 0; margin: -6px 0 12px; font-size: 15px; color: var(--mid); }
  .ptswhy b { color: var(--bm); display: inline-block; min-width: 38px; }
  .endgrid { display: grid; grid-template-columns: 1fr 340px; gap: 26px; align-items: start; margin-top: 14px; }
  @media (max-width: 860px) { .endgrid { grid-template-columns: 1fr; } }
  .log .it { display: grid; grid-template-columns: 160px 1fr; gap: 4px 14px; padding: 10px 0; border-top: 1px solid var(--rule); }
  @media (max-width: 640px) { .log .it { grid-template-columns: 1fr; } }
  .log .h { font-family: var(--serif); color: var(--bm); }
  .log .d { font-size: 14px; color: var(--mid); }
  .log .better { color: var(--good); font-size: 15px; }
  .log .deltas { font-weight: 700; font-size: 14px; }
  .log .deltas .u { color: var(--good); } .log .deltas .n { color: var(--bad); }
  .box { border: 1.5px solid; border-radius: 12px; padding: 10px 14px; margin: 12px 0; }
  .box.bad { border-color: #e7a9a9; background: var(--bad-bg); }
  .box.good { border-color: #a8dcbb; background: var(--good-bg); }
  .box b { display: block; margin-bottom: 2px; }

  /* leaderboard */
  h3 { font-family: var(--serif); font-weight: 600; color: var(--bm); font-size: 22px; margin: 0 0 6px; }
  ol.lb { list-style: none; margin: 8px 0; padding: 0; }
  ol.lb li { display: grid; grid-template-columns: 34px 38px 1fr auto; gap: 0 10px; align-items: center; padding: 6px 4px; border-top: 1px solid var(--rule); }
  ol.lb li.me { background: var(--amber-bg); }
  ol.lb li.gap { display: block; text-align: center; color: var(--mid); border: 0; }
  ol.lb .rk { width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; font-weight: 700; background: var(--bm-bg); color: var(--bm); font-size: 14px; }
  ol.lb .rk1 { background: #ffd95e; color: #5a3a00; } ol.lb .rk2 { background: #dde3ea; color: #33404d; } ol.lb .rk3 { background: #f0b98a; color: #5a2e0a; }
  ol.lb svg { width: 38px; height: 38px; }
  ol.lb .nm { font-weight: 600; overflow-wrap: anywhere; }
  ol.lb .meta { font-size: 13px; color: var(--mid); font-weight: normal; }
  ol.lb .sc { font-weight: 700; font-size: 20px; color: var(--bm); }
  .bigboard ol.lb li { font-size: 20px; padding: 10px 4px; }
  .bigboard ol.lb svg { width: 52px; height: 52px; }
  .bigboard ol.lb li { grid-template-columns: 40px 52px 1fr auto; }
  .adm { display: grid; grid-template-columns: 1fr auto; gap: 4px 10px; align-items: center; padding: 8px 0; border-top: 1px solid var(--rule); }
  .adm .meta { font-size: 13px; color: var(--mid); }
  .hint { color: var(--mid); font-size: 14px; }

  /* sort */
  .sortgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 14px; }
  @media (max-width: 600px) { .sortgrid { grid-template-columns: 1fr; } }

  dialog { border: 1.5px solid var(--bm-b); border-radius: 12px; max-width: min(560px, 92vw); padding: 18px 20px; color: #1d2433; }
  dialog::backdrop { background: rgba(26, 58, 122, .25); }
  dialog .card { padding: 8px 0; border-top: 1px solid var(--rule); }
  dialog .card b { color: var(--bm); }
  dialog .x { float: right; }
  .muted { color: var(--mid); }
  @media (prefers-reduced-motion: reduce) { .hire:hover { transform: none; } }
</style>
</head>
<body>
<header>
  <img src="/geocornsmall.png" alt="">
  <div><h1>You're the Boss</h1><div class="sub">Pick a path · BM 2.4 Motivation</div></div>
  <nav><button data-tab="play" class="on">Play</button><button data-tab="board">Leaderboard</button><button data-tab="teacher">Teacher</button><a href="/">unisam.nz</a></nav>
</header>
<main id="app"></main>
<dialog id="dlg"></dialog>

<script src="defs.js"></script>
<script src="engine.js"></script>
<script>
const $ = (s) => document.querySelector(s);
const esc = (t) => String(t).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);
const DEFS = window.BOSS_DEFS || {};
const hireOf = (id) => Boss.HIRES.find((h) => h.id === id);

// ---------- key words with a "?" ----------
const KW = [];
for (const [key, d] of Object.entries(DEFS)) {
  KW.push({ text: key, key });
  for (const a of d.also || []) KW.push({ text: a, key });
}
KW.sort((a, b) => b.text.length - a.text.length);
const KW_RE = KW.length ? new RegExp('(^|[^\\w-])(' + KW.map((k) => k.text.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')).join('|') + ")(s?)(?![\\w-])", 'gi') : null;
function keyFor(word) {
  const w = word.toLowerCase();
  const k = KW.find((k) => k.text.toLowerCase() === w);
  return k ? k.key : null;
}
// Adds a ? after the first mention of each key word
function rich(text) {
  const s = esc(text);
  if (!KW_RE) return s;
  const used = new Set();
  return s.replace(KW_RE, (m, pre, word, pl) => {
    const key = keyFor(word);
    if (!key || used.has(key)) return m;
    used.add(key);
    return pre + word + pl + qBtn(key);
  });
}
const qBtn = (key) => '<span class="q" role="button" tabindex="0" data-t="' + esc(key) + '" aria-label="What is ' + esc(key) + '?">?</span>';
function defOf(term) {
  const key = DEFS[term] ? term : keyFor(term);
  return key ? { key, def: DEFS[key].def || 'Definition coming soon.' } : null;
}
function showDef(term) {
  const d = defOf(term);
  if (!d) return;
  openDlg('<h3>' + esc(d.key) + '</h3><p>' + esc(d.def) + '</p>');
}
function openDlg(html, onClose) {
  const dlg = $('#dlg');
  dlg.innerHTML = '<button class="btn x" data-close>Close</button>' + html;
  dlg.onclose = () => { if (onClose) onClose(); };
  dlg.showModal();
}
document.addEventListener('click', (e) => {
  const q = e.target.closest('.q');
  if (q) { e.preventDefault(); e.stopPropagation(); showDef(q.dataset.t); return; }
  if (e.target.closest('[data-close]')) $('#dlg').close();
}, true);
document.addEventListener('keydown', (e) => {
  const q = e.target.closest && e.target.closest('.q');
  if (q && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); e.stopPropagation(); showDef(q.dataset.t); }
}, true);

// ---------- drawings ----------
function catAvatar(L, m, W, cls) {
  const eyes = m <= 1
    ? '<path d="M76 92 L92 94 M124 92 L108 94" stroke="#2a1d14" stroke-width="3.5" stroke-linecap="round"/>'
    : '<ellipse cx="84" cy="93" rx="7" ry="9" fill="#9ccc4a"/><ellipse cx="116" cy="93" rx="7" ry="9" fill="#9ccc4a"/>' +
      '<ellipse cx="84" cy="94" rx="2.4" ry="' + (m >= 4 ? 8 : 6) + '" fill="#111"/><ellipse cx="116" cy="94" rx="2.4" ry="' + (m >= 4 ? 8 : 6) + '" fill="#111"/>';
  const mouth = m >= 3 ? 'M90 116 Q95 122 100 115 Q105 122 110 116' : m === 2 ? 'M92 118 L108 118' : 'M90 122 Q100 112 110 122';
  const blush = m >= 4 ? '<circle cx="72" cy="108" r="6" fill="#f29b9b" opacity=".6"/><circle cx="128" cy="108" r="6" fill="#f29b9b" opacity=".6"/>' : '';
  const sweat = W >= 1 ? '<path d="M148 64 Q154 76 148 80 Q142 76 148 64Z" fill="#7cc4f0"/>' : '';
  return '<svg class="av ' + (cls || '') + '" viewBox="0 0 200 200" aria-hidden="true">' +
    '<path d="M150 196 Q190 180 178 140 Q172 124 160 132" stroke="' + L.fur + '" stroke-width="12" fill="none" stroke-linecap="round"/>' +
    '<path d="M44 200 Q44 140 100 138 Q156 140 156 200Z" fill="' + L.fur + '"/>' +
    '<path d="M60 74 L56 30 L94 56Z" fill="' + L.fur + '"/><path d="M140 74 L144 30 L106 56Z" fill="' + L.fur + '"/>' +
    '<path d="M64 64 L62 42 L82 56Z" fill="#f4a7b0"/><path d="M136 64 L138 42 L118 56Z" fill="#f4a7b0"/>' +
    '<ellipse cx="100" cy="96" rx="48" ry="42" fill="' + L.fur + '"/>' +
    '<path d="M100 56 V70 M88 58 L90 70 M112 58 L110 70" stroke="' + L.stripe + '" stroke-width="4" stroke-linecap="round"/>' +
    '<ellipse cx="100" cy="114" rx="20" ry="14" fill="#fbe3c8"/>' + eyes + blush +
    '<path d="M95 107 L105 107 L100 113Z" fill="#e57a8a"/>' +
    '<path d="' + mouth + '" stroke="#5a2a1a" stroke-width="3" fill="none" stroke-linecap="round"/>' +
    '<path d="M80 112 L48 106 M80 117 L48 120 M120 112 L152 106 M120 117 L152 120" stroke="#5a3a1a" stroke-width="1.6" stroke-linecap="round"/>' +
    '<path d="M64 136 Q100 150 136 136" stroke="' + L.collar + '" stroke-width="8" fill="none" stroke-linecap="round"/>' +
    '<circle cx="100" cy="150" r="7" fill="#f2c94c" stroke="#b8902a" stroke-width="2"/>' + sweat + '</svg>';
}
function avatar(h, M, W, cls) {
  const L = h.look, m = M == null ? 3 : M;
  if (L.style === 'cat') return catAvatar(L, m, W, cls);
  const mouth = m >= 3 ? 'M84 113 Q100 128 116 113' : m === 2 ? 'M88 117 L112 117' : 'M86 121 Q100 109 114 121';
  const brows = m <= 1 ? '<path d="M78 80 L92 84 M122 80 L108 84" stroke="#2a1d14" stroke-width="3" stroke-linecap="round"/>'
    : '<path d="M78 82 Q85 78 92 82 M108 82 Q115 78 122 82" stroke="#2a1d14" stroke-width="3" fill="none" stroke-linecap="round"/>';
  let back = '', front = '';
  const top = 'M58 90 Q56 44 100 44 Q144 44 142 90 Q134 64 100 63 Q66 64 58 90Z';
  if (L.style === 'pony') { back = '<ellipse cx="146" cy="96" rx="13" ry="26" fill="' + L.hair + '"/>'; front = top; }
  if (L.style === 'short') front = 'M58 86 Q54 40 100 42 Q148 40 142 86 Q138 60 112 58 Q90 66 64 62Z';
  if (L.style === 'bob') front = 'M54 116 Q46 44 100 42 Q154 44 146 116 L134 116 Q136 72 100 64 Q64 72 66 116Z';
  if (L.style === 'bun') { back = '<circle cx="100" cy="40" r="17" fill="' + L.hair + '"/>'; front = top; }
  let cap = '';
  if (L.style === 'cap') {
    front = 'M60 84 Q60 60 100 60 Q140 60 140 84Z';
    cap = '<path d="M58 78 Q58 38 100 38 Q142 38 142 78Z" fill="#2c5aa0"/><path d="M96 74 L164 80 L160 88 L96 82Z" fill="#234a85"/>';
  }
  const blush = m >= 4 ? '<circle cx="76" cy="104" r="7" fill="#f29b9b" opacity=".55"/><circle cx="124" cy="104" r="7" fill="#f29b9b" opacity=".55"/>' : '';
  const sweat = W >= 1 ? '<path d="M146 66 Q152 78 146 82 Q140 78 146 66Z" fill="#7cc4f0"/>' : '';
  const beard = L.beard ? '<path d="M62 100 Q64 136 100 136 Q136 136 138 100 Q132 122 116 124 Q100 116 84 124 Q68 122 62 100Z" fill="' + L.hair + '"/>' : '';
  const glasses = L.glasses ? '<g stroke="#5a3a1a" stroke-width="2.5" fill="none"><circle cx="85" cy="94" r="10"/><circle cx="115" cy="94" r="10"/><path d="M95 94 H105 M75 92 L60 88 M125 92 L140 88"/></g>' : '';
  return '<svg class="av ' + (cls || '') + '" viewBox="0 0 200 200" aria-hidden="true">' +
    '<path d="M36 200 Q36 142 100 140 Q164 142 164 200Z" fill="' + L.shirt + '"/>' +
    '<rect x="88" y="124" width="24" height="22" fill="' + L.skin + '"/>' + back +
    '<circle cx="100" cy="92" r="42" fill="' + L.skin + '"/>' +
    '<path d="' + front + '" fill="' + L.hair + '"/>' + cap + brows +
    '<circle cx="85" cy="94" r="4.5" fill="#1d1712"/><circle cx="115" cy="94" r="4.5" fill="#1d1712"/>' + glasses + blush + beard +
    '<path d="' + mouth + '" stroke="' + (L.beard ? '#f3d9c6' : '#5a2a1a') + '" stroke-width="3.5" fill="none" stroke-linecap="round"/>' + sweat + '</svg>';
}
// No ceiling: one dot per point up to 12, then the number carries on
const dots = (n) => '<span class="dots">' + (n ? Array.from({ length: Math.min(n, 12) }, () => '<span class="dot"></span>').join('') : '<span class="dot zero"></span>') +
  '<span class="num">' + n + '</span></span>';
const warnIcon = (on) => '<svg class="warn" viewBox="0 0 24 22"><path d="M12 2 L23 21 H1Z" fill="' + (on ? '#c0392b' : 'none') + '" stroke="#8a1c1c" stroke-width="2" stroke-linejoin="round"/>' + (on ? '<path d="M12 8 V14 M12 17 V18" stroke="#fff" stroke-width="2.4" stroke-linecap="round"/>' : '') + '</svg>';
const warns = (w) => '<span class="dots warns">' + warnIcon(w >= 1) + warnIcon(w >= 2) + '<span class="num">' + (w >= 1 ? 'One more and they quit' : '') + '</span></span>';

// ---------- game ----------
let tab = 'play';
let G = { view: 'pick' };
let player = { name: '', priv: false };

function render() {
  document.querySelectorAll('header nav button').forEach((b) => b.classList.toggle('on', b.dataset.tab === tab));
  const app = $('#app');
  if (tab === 'board') { boardView(); return; }
  if (tab === 'teacher') { teacherView(); return; }
  if (G.view === 'pick') { app.innerHTML = pickView(); pickWire(); return; }
  if (G.view === 'end') { app.innerHTML = endView(); window.scrollTo(0, 0); lbEnd(); return; }
  app.innerHTML = '<div class="cols">' + workerPanel() + '<section>' + mainView() + '</section></div>';
}
document.querySelectorAll('header nav button').forEach((b) => b.onclick = () => { tab = b.dataset.tab; render(); });

function pickView() {
  return '<div class="pickhead"><div><h2>Pick your hire</h2><p class="lead">Hire one, then make 15 calls. Keep them motivated, skilled and here.</p></div>' +
    '<div class="namebox"><label for="nm">Your name or team name</label><input id="nm" type="text" maxlength="24" value="' + esc(player.name) + '" placeholder="e.g. Team Herzberg">' +
    '<label class="small"><input type="checkbox" id="priv"' + (player.priv ? ' checked' : '') + '> Keep me off the class leaderboard</label>' +
    '<div class="namemsg" id="nmMsg"></div></div></div><div class="namewarn" id="nmWarn"></div>' +
    '<p class="agenote">Age discrimination' + qBtn('Age discrimination') + ' is illegal. But age can shape what people want, so ask, don\'t assume.</p>' +
    '<div class="hires">' + Boss.HIRES.map((h) =>
      '<button class="hire' + (h.id === 'cat' ? ' cat' : '') + '" data-h="' + h.id + '">' + avatar(h, 3, 0) +
      '<div class="nm">' + h.name + ', ' + h.age + '</div><div class="job">' + esc(h.job) + '</div>' +
      (h.note ? '<div class="note">' + esc(h.note) + '</div>' : '') +
      '<div class="stats"><span>Motivation</span>' + dots(h.M) + '<span>Skills</span>' + dots(h.S) + '</div></button>').join('') + '</div>' +
    scoreKey() +
    '<details class="rules"><summary>How it works</summary>' +
    '<p><b>Motivation</b> hits 0: they are demotivated. <b>Skills</b> hit 0: they cannot do the job. <b>Two warnings</b>: they quit. There is no top limit: keep growing them.</p>' +
    '<p>Every worker has a hidden need right now: security, belonging, esteem or growth. Rewards that match it work best. <b>Ask them</b> to find out (asking twice at one step annoys them). <b>Ask HR</b> for definitions.</p>' +
    '<p>Every few steps HR gives you a <b>pop quiz</b> on motivation theory (five in all). Right: motivation +1. Wrong: motivation -1.</p>' +
    '<p><b>Why these points?</b> Maslow says a reward only motivates if it meets the need someone has right now, so a matched reward scores most and a reward they are not ready for loses points. A best call means no other option would have left them better off. Keeping your worker is the whole point of rewards and training, so every step they stay scores, and the ending adds a bonus: Promoted mentor 150, Loyal veteran 100, Fragile survivor 50.</p></details>';
}
// The scoring rules, shown before the game starts
function scoreKey() {
  return '<div class="scorekey"><b>How you score</b>' +
    '<span><em>+30</em> reward matches their need right now</span><span><em>+20</em> quiz answer right</span>' +
    '<span><em>+10</em> best call</span><span><em>+10</em> each step they stay</span>' +
    '<span><em>+50 to 150</em> for how it ends</span><span class="neg"><em>-10</em> reward they are not ready for</span></div>';
}

// Names already on this week's leaderboard; a clash needs a second press
let taken = new Set(), okName = null;
function pickWire() {
  const nameKey = () => $('#nm').value.trim().slice(0, 24).toLowerCase();
  const warnName = () => {
    const k = nameKey(), clash = k && taken.has(k) && !$('#priv').checked;
    $('#nmWarn').innerHTML = clash ? 'Someone called <b>' + esc($('#nm').value.trim()) + '</b> is already on this week\'s leaderboard. If that is not you, change your name. If it is you, pick your hire again.' : '';
    return clash;
  };
  lbFetch().then((d) => { taken = new Set(Object.values(d).filter((o) => o && typeof o.n === 'string').map((o) => o.n.trim().slice(0, 24).toLowerCase())); if ($('#nm')) warnName(); }).catch(() => {});
  $('#nm').oninput = () => { $('#nmMsg').textContent = ''; okName = null; warnName(); };
  $('#priv').onchange = warnName;
  document.querySelectorAll('.hire').forEach((b) => b.onclick = () => {
    const name = $('#nm').value.trim();
    if (!name) { $('#nmMsg').textContent = 'Type your name or team name first.'; $('#nm').focus(); return; }
    if (warnName() && okName !== nameKey()) { okName = nameKey(); $('#nm').focus(); return; }
    player = { name: name.slice(0, 24), priv: $('#priv').checked };
    pick(b.dataset.h);
  });
}

function workerPanel() {
  const st = G.st, h = st.hire, hub = Boss.HUBS[st.hub];
  const urgent = hub && hub.urgent;
  return '<aside class="worker"><div class="top">' + avatar(h, st.M, st.W) +
    '<div><div class="nm">' + h.name + ', ' + esc(String(h.age).split(' ')[0]) + '</div><div class="job">' + esc(h.job) + '</div></div></div>' +
    '<div class="stats"><span>Motivation</span>' + dots(st.M) + '<span>Skills</span>' + dots(st.S) + '<span>Warnings</span>' + warns(st.W) +
    '<span>Score</span><span class="num" style="margin:0">' + Boss.score(st) + '</span></div>' +
    (G.view === 'hub' || G.view === 'router' || G.view === 'sort' ?
      '<div class="tools"><button class="btn" onclick="askThem()"' + (st.asked >= 2 ? ' disabled' : '') + '>' + (st.asked === 1 ? 'Ask them again' : 'Ask them') + '</button>' +
      '<button class="btn' + (urgent ? ' urgent' : '') + '" onclick="askHR()">' + (urgent ? 'Ask HR (costs a warning)' : 'Ask HR') + '</button></div>' : '') +
    (G.bubble ? '<div class="bubble' + (G.bubble.bad ? ' bad' : '') + '">' + G.bubble.html + '</div>' : '') + '</aside>';

function hubHead(hub) {
  const n = Math.min(15, +hub.id.slice(1));

    '<div class="bar"><i style="width:' + (n / 15 * 100) + '%"></i></div>' +

function mainView() {
  const st = G.st, hub = Boss.HUBS[st.hub];
  if (G.view === 'router') {
    return hubHead(hub) + '<div class="chips"><span class="chip flat">Motivation ' + st.M + '</span><span class="chip flat">Skills ' + st.S + '</span><span class="chip ' + (st.W ? 'down' : 'flat') + '">Warnings ' + st.W + '</span></div>' +
      '<p class="msgs">' + (st.S <= 1 ? 'Skills are low.' : st.M <= 1 ? 'Motivation is low.' : 'So far, so good.') + '</p>' +

  }
  if (G.view === 'sort') {
    const s = hub.sort;
    return hubHead(hub) + '<div class="hr"><div class="who">HR</div><div class="ask">Which complaints are hygiene factors' + qBtn('Hygiene factors') + '? Tap them all.</div>' +
      '<div class="sortgrid">' + s.items.map((i) => '<button class="opt' + (G.picks.has(i.id) ? ' on' : '') + '" onclick="togglePick(\'' + i.id + '\')">' + (G.picks.has(i.id) ? '✓ ' : '') + esc(i.label) + '</button>').join('') + '</div>' +
      '<button class="btn main" onclick="checkSort()">Check</button></div>';

      '<div class="hr"><div class="who">HR</div><div class="ask">' + rich(G.q.ask) + '</div><div class="quizopts">' +
      G.q.shown.map((c, i) => '<button class="opt" onclick="answer(' + i + ')">' + esc(c) + '</button>').join('') + '</div>' +
      '<p class="hint">Right: +20 points and motivation +1. Wrong: motivation -1.</p></div>';

      '<div class="chips">' + ptsChip(e) + (chip('Motivation', e.after.M - e.before.M) || '<span class="chip flat">Motivation 0</span>') + '</div>' + ptsWhy(e) +

    pre = G.sortOk ? '<div class="box good"><b>Correct sort.</b>What bothers ' + st.hire.name + ' most: ' + esc(what) + '.</div>'

function chip(label, d) {
  if (!d) return '';
  const good = label === 'Warnings' ? d < 0 : d > 0;
  return '<span class="chip ' + (good ? 'up' : 'down') + '">' + label + ' ' + (d > 0 ? '+' : '') + d + '</span>';
}
// Points earned by one action, with the reasons
const ptsChip = (e) => '<span class="chip pts ' + (e.pts < 0 ? 'down' : e.pts > 0 ? 'up' : 'flat') + '">' + (e.pts > 0 ? '+' : '') + e.pts + ' points</span>';
const ptsWhy = (e) => (e.why && e.why.length ? '<ul class="ptswhy">' + e.why.map((w) => '<li><b>' + (w.pts > 0 ? '+' : '') + w.pts + '</b> ' + esc(w.label) + '</li>').join('') + '</ul>' : '');
function resultView() {
  const st = G.st, e = st.log[st.log.length - 1];
  const dM = e.after.M - e.before.M, dS = e.after.S - e.before.S, dW = e.after.W - e.before.W;
  let chips = chip('Motivation', dM) + chip('Skills', dS) + chip('Warnings', dW);
  if (!chips) chips = '<span class="chip flat">No change</span>';
  const dead = st.dead;
  return '<div class="tag">' + esc(e.title) + '</div><h2>' + (dead ? Boss.DEATHS[dead.kind].title + '!' : 'Result') + '</h2>' +
    (e.fun ? '<p class="fun">' + esc(e.fun) + '</p>' : '') +
    '<div class="chips">' + ptsChip(e) + chips + '</div>' + ptsWhy(e) +
    '<div class="msgs">' + e.msgs.concat(dead ? [dead.why] : []).map((m) => '<p>' + esc(m) + '</p>').join('') + '</div>' +
    '<div class="termline">You chose: ' + rich(e.term) + '</div>' +
    '<button class="btn main" onclick="next()">' + (st.pendingQ ? 'Next: pop quiz' : Boss.over(st) ? 'See how it ended' : 'Next') + '</button>' +
    (e.debrief ? '<details><summary>Why?</summary><p>' + rich(e.debrief) + '</p></details>' : '');
}

function endView() {
  const st = G.st, h = st.hire;
  let head, body = '';
  if (st.dead) {
    const D = Boss.DEATHS[st.dead.kind];
    head = '<p class="big lose">' + D.title + '</p><p class="lead">' + esc(st.dead.why) + '</p>';
    body = '<div class="box bad"><b>Why</b>' + rich(D.theory) + '</div><div class="box good"><b>Better move</b>' + rich(D.better) + '</div>';
  } else {
    head = '<p class="big ' + (st.ending.id === 'fragile' ? 'lose' : 'win') + '">' + st.ending.title + '</p><p class="lead">' + esc(st.ending.text) + '</p>';
  }
  const better = st.log.filter((e) => e.better && !e.quiz).length;
  const rows = st.log.map((e) => {
    const d = ['M', 'S', 'W'].map((k) => {
      const v = e.after[k] - e.before[k];
      if (!v) return '';

      return '<span class="' + (good ? 'u' : 'n') + '">' + ({ M: 'Motivation', S: 'Skills', W: 'Warnings' })[k] + ' ' + (v > 0 ? '+' : '') + v + '</span>';
    }).filter(Boolean).join(' · ');
    return '<div class="it"><div class="h">' + esc(e.title) + '</div><div>' + esc(e.choice) +
      '<div class="d">' + (e.quiz ? (e.quiz.ok ? 'Right' : 'Wrong') : rich(e.term)) + (d ? ' · <span class="deltas">' + d + '</span>' : '') + '</div>' +
      (e.better ? '<div class="better">' + (e.quiz ? 'Answer: ' + rich(e.better) : 'Better: ' + esc(e.better) + ' (' + rich(e.betterTerm) + ')') + '</div>' : '') +
      (e.debrief ? '<details><summary>Why?</summary><p>' + rich(e.debrief) + '</p></details>' : '') + '</div></div>';
  }).join('');
  return '<div class="endhead">' + avatar(h, st.dead ? 0 : st.M, st.W) + '<div>' + head +
    '<p class="scoreline">Score <b>' + Boss.score(st) + '</b></p>' +
    '<table class="breakdown">' + Boss.breakdown(st).filter((r) => r.n).map((r) => '<tr><td>' + esc(r.label) + '</td><td class="n">' + (r.label.startsWith('Ending') ? '' : r.n + ' x ' + r.each) + '</td><td class="n"><b>' + (r.pts > 0 ? '+' : '') + r.pts + '</b></td></tr>').join('') + '</table>' +
    '<button class="btn main" onclick="restart()">Play again</button></div></div>' + body +
    '<div class="endgrid"><div><h3>Your choices</h3><p class="muted">' + st.log.filter((e) => !e.quiz).length + ' choices, ' + better + ' with a better option. Quiz: ' + st.quizRight + ' of ' + st.quizIds.length + ' right.</p><div class="log">' + rows + '</div></div>' +
    '<div><h3>Class leaderboard</h3><p class="hint">This week, best score per name.</p><div id="lbBox">Loading...</div></div></div>';
}

// ---------- actions ----------
function pick(id) { G = { view: 'hub', st: Boss.newState(id), bubble: null, q: null, sortOk: null, posted: false }; enterHub(); }
function restart() { G = { view: 'pick' }; render(); window.scrollTo(0, 0); }
function enterHub() {
  const hub = Boss.HUBS[G.st.hub];
  G.bubble = null;
  G.view = hub.router ? 'router' : hub.sort && !G.st.sorted ? 'sort' : 'hub';
  if (G.view === 'sort') G.picks = new Set();
  render();
}
function deathLog(choice) {
  const st = G.st, e = { M: st.M, S: st.S, W: st.W };
  st.log.push({ hub: st.hub, title: Boss.HUBS[st.hub].title, choice, term: 'Warning', msgs: [], before: e, after: e });
}
function afterRisk() { if (G.st.dead) G.view = 'end'; render(); }
function askThem() {
  const st = G.st, before = st.W;
  const words = Boss.askThem(st);
  G.bubble = { html: '"' + esc(words) + '"' + (st.W > before ? '<br><b>They feel interrogated. Warning!</b>' : ''), bad: st.W > before };
  if (st.dead) deathLog('Asked them twice');
  afterRisk();
}
function askHR() {
  const st = G.st, hub = Boss.HUBS[st.hub];
  const cost = Boss.askHR(st);
  if (st.dead) deathLog('Asked HR at an urgent moment');
  const cards = (hub.terms || []).map(defOf).filter(Boolean).map((d) =>
    '<div class="card"><b>' + esc(d.key) + '</b><br>' + esc(d.def) + '</div>').join('');
  openDlg('<h3>HR definitions</h3>' + (cost ? '<p style="color:#8a1c1c">This was urgent. Waiting cost you a warning.</p>' : '') + cards, afterRisk);
}
function routeOn() {
  Boss.route(G.st);
  if (G.st.dead) { deathLog('Month-one check'); G.view = 'end'; render(); return; }
  G.sortOk = null; enterHub();
}
function togglePick(id) { G.picks.has(id) ? G.picks.delete(id) : G.picks.add(id); render(); }
function checkSort() { G.sortOk = Boss.sortCheck(G.st, G.picks); if (G.st.dead) { G.view = 'end'; render(); return; } G.view = 'hub'; render(); }
function choose(id) {
  Boss.choose(G.st, id);
  G.bubble = null;
  G.view = 'result';
  render();
}
function answer(i) { Boss.answerQuiz(G.st, G.q.shown[i]); G.view = 'quizres'; render(); }
function next() {
  const q = G.st.pendingQ;
  if (q) { G.q = Object.assign({}, q, { shown: q.choices.slice().sort(() => Math.random() - 0.5) }); G.view = 'quiz'; render(); window.scrollTo(0, 0); return; }
  if (Boss.over(G.st)) { G.view = 'end'; render(); return; }
  G.sortOk = null; enterHub(); window.scrollTo(0, 0);
}

/* ---------- class leaderboard ----------
   Same Realtime Database as /stockshock (coldwar-d8109), under boss/scores, through the REST API.
   Each row stores the player's actions, and scores are always recomputed by replaying them.
   Push keys are time ordered, so "last 7 days" is a key range query and needs no index rule. */
const LB_URL = 'https://coldwar-d8109-default-rtdb.asia-southeast1.firebasedatabase.app/boss/scores';
const PUSH_CHARS = '-0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZ_abcdefghijklmnopqrstuvwxyz';
function pushPrefix(ms) { let s = ''; for (let i = 0; i < 8; i++) { s = PUSH_CHARS.charAt(ms % 64) + s; ms = Math.floor(ms / 64); } return s; }
async function lbFetch() {
  if (!window.fetch) throw new Error('offline');
  const r = await fetch(LB_URL + '.json?orderBy=%22$key%22&startAt=%22' + pushPrefix(Date.now() - 7 * 864e5) + '%22');
  if (!r.ok) throw new Error('load ' + r.status);
  return (await r.json()) || {};
}
function lbPost() {
  if (G.posted || player.priv || !player.name || !window.fetch) return Promise.resolve(null);
  G.posted = true;
  const body = { n: player.name, c: G.st.hire.id, a: G.st.acts.join(','), at: { '.sv': 'timestamp' } };
  return fetch(LB_URL + '.json', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) })
    .then((r) => { if (!r.ok) throw new Error('save ' + r.status); return true; });
}
function lbCheck(o) {
  if (!o || typeof o.n !== 'string' || !o.n.trim() || typeof o.c !== 'string' || typeof o.a !== 'string') return null;
  const st = Boss.replay(o.c, o.a.split(','));
  if (!st) return null;
  return { name: o.n.trim().slice(0, 24), hire: o.c, score: Boss.score(st), result: st.dead ? Boss.DEATHS[st.dead.kind].title : st.ending.title, at: o.at || 0 };
}
// Best score per name, with games played
function lbAggregate(rows) {
  const best = {};
  rows.forEach((r) => {
    const k = r.name.toLowerCase(), b = best[k];
    if (!b) best[k] = Object.assign({ games: 1 }, r);
    else { b.games++; if (r.score > b.score) Object.assign(b, r, { games: b.games }); }
  });
  return Object.values(best).sort((a, b) => b.score - a.score);
}
async function lbLoad() { return lbAggregate(Object.values(await lbFetch()).map(lbCheck).filter(Boolean)); }
const isMe = (r) => !player.priv && player.name && r.name.toLowerCase() === player.name.toLowerCase();
function lbList(rows, limit) {
  if (!rows.length) return '<p>No scores yet this week. Be the first!</p>';
  const li = (r, i) => '<li class="' + (isMe(r) ? 'me' : '') + '"><span class="rk' + (i < 3 ? ' rk' + (i + 1) : '') + '">' + (i + 1) + '</span>' + avatar(hireOf(r.hire), 3, 0) +
    '<span class="nm">' + esc(r.name) + (isMe(r) ? ' (you)' : '') + '<div class="meta">' + esc(hireOf(r.hire).name) + ': ' + esc(r.result) + ' · ' + r.games + ' game' + (r.games > 1 ? 's' : '') + '</div></span>' +
    '<span class="sc">' + r.score + '</span></li>';
  let out = rows.slice(0, limit).map(li).join('');
  const k = rows.findIndex(isMe);
  if (k >= limit) out += '<li class="gap">...</li>' + li(rows[k], k);
  return '<ol class="lb">' + out + '</ol>';
}
async function lbEnd() {
  const g = G, box = () => (G === g ? $('#lbBox') : null);
  let note = '';
  if (player.priv) note = '<p class="hint">You chose to stay off the leaderboard, so this game was not added.</p>';
  try { await lbPost(); } catch (e) { note = '<p class="hint">Could not save your score to the leaderboard.</p>'; }
  try { const rows = await lbLoad(); if (box()) box().innerHTML = note + lbList(rows, 10); }
  catch (e) { if (box()) box().innerHTML = note + '<p class="hint">The leaderboard needs an internet connection.</p>'; }
}
function boardView() {
  $('#app').innerHTML = '<div class="bigboard"><h2>Class leaderboard</h2><p class="hint">This week, best score per name. Updates every 15 seconds.</p><div id="lbBig">Loading...</div></div>';
  const load = () => lbLoad().then((rows) => { if (tab === 'board' && $('#lbBig')) $('#lbBig').innerHTML = lbList(rows, 30); })
    .catch(() => { if ($('#lbBig')) $('#lbBig').innerHTML = '<p class="hint">The leaderboard needs an internet connection.</p>'; });
  load();
  clearInterval(boardView.t);
  boardView.t = setInterval(() => { if (tab === 'board') load(); else clearInterval(boardView.t); }, 15000);
}

const TEACHER_CODE = '0987'; // low stakes: only unlocks deleting names, same code as /stockshock
let teacherOK = false;
function teacherView() {
  if (!teacherOK) {
    $('#app').innerHTML = '<h2>Teacher</h2><div class="namebox"><label for="tcode">Teacher code</label><input id="tcode" type="password" inputmode="numeric" maxlength="12" style="width:200px">' +
      ' <button class="btn main" id="tgo">Unlock</button><p class="hint" id="tmsg"></p></div>';
    const go = () => { if ($('#tcode').value.trim() === TEACHER_CODE) { teacherOK = true; teacherView(); } else $('#tmsg').textContent = 'That code is not right.'; };
    $('#tgo').onclick = go; $('#tcode').onkeydown = (e) => { if (e.key === 'Enter') go(); };
    return;
  }
  $('#app').innerHTML = '<h2>Manage the class leaderboard</h2><p class="hint">Every game saved in the last 7 days, newest first. Delete removes it for everyone (press twice to confirm).</p><div id="lbAdmin">Loading...</div>';
  lbAdmin();
}
async function lbAdmin() {
  const box = () => $('#lbAdmin');
  try {
    const data = await lbFetch(), keys = Object.keys(data).reverse();
    if (!box()) return;
    if (!keys.length) { box().innerHTML = '<p>No games saved in the last 7 days.</p>'; return; }
    box().innerHTML = keys.map((k) => {
      const o = data[k], row = lbCheck(o), when = o && o.at ? new Date(o.at).toLocaleString('en-GB', { weekday: 'short', hour: '2-digit', minute: '2-digit' }) : '';
      return '<div class="adm" data-k="' + esc(k) + '"><div><b>' + esc(o && typeof o.n === 'string' ? o.n : '(no name)') + '</b><div class="meta">' +
        (row ? esc(hireOf(row.hire).name) + ', ' + esc(row.result) + ', score ' + row.score : 'Unreadable entry') + (when ? ', ' + esc(when) : '') +
        '</div></div><button class="btn danger">Delete</button></div>';
    }).join('');
    box().querySelectorAll('.adm button').forEach((b) => b.onclick = async () => {
      if (!b.classList.contains('arm')) { b.classList.add('arm'); b.textContent = 'Confirm'; return; }
      const row = b.closest('.adm'), k = row.getAttribute('data-k');
      b.disabled = true; b.textContent = 'Deleting...';
      try { const r = await fetch(LB_URL + '/' + encodeURIComponent(k) + '.json', { method: 'DELETE' }); if (!r.ok) throw new Error(r.status); row.remove(); }
      catch (e) { b.disabled = false; b.textContent = 'Failed, try again'; }
    });
  } catch (e) { if (box()) box().innerHTML = '<p class="hint">The leaderboard needs an internet connection.</p>'; }
}
render();
</script>
