<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>Feedback inbox</title>
<style>
  :root {
    --bg: #f5f4f0; --panel: #fff; --border: #d8d6cf; --text: #1a1918; --muted: #6b6860;
    --accent: #4a1a7a; --bug: #c8380a; --idea: #1a7a4a; --other: #6b6860;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; background: var(--bg); color: var(--text); font-size: 14px; }
  header { padding: 18px 20px; border-bottom: 1px solid var(--border); background: var(--panel); display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
  header h1 { font-family: Georgia, serif; font-size: 20px; margin: 0; flex: 1; }
  main { max-width: 900px; margin: 0 auto; padding: 16px; }
  button, select, input { font: inherit; }
  button { border: 1px solid var(--border); background: var(--panel); border-radius: 6px; padding: 5px 10px; cursor: pointer; }
  button:hover { border-color: var(--accent); }
  button.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
  .row { background: var(--panel); border: 1px solid var(--border); border-radius: 8px; margin-bottom: 8px; }
  .row.done { opacity: 0.55; }
  .row-head { display: flex; gap: 10px; align-items: baseline; padding: 10px 12px; cursor: pointer; }
  .tag { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; color: #fff; border-radius: 4px; padding: 1px 6px; }
  .tag.bug { background: var(--bug); } .tag.idea { background: var(--idea); } .tag.other { background: var(--other); }
  .app { font-family: ui-monospace, monospace; font-size: 12px; color: var(--muted); }
  .excerpt { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .when { font-size: 12px; color: var(--muted); white-space: nowrap; }
  .icons { font-size: 12px; color: var(--muted); }
  .detail { border-top: 1px solid var(--border); padding: 12px; display: none; }
  .row.open .detail { display: block; }
  .msg { white-space: pre-wrap; margin: 0 0 12px; font-size: 15px; }
  .detail img { max-width: 100%; border: 1px solid var(--border); border-radius: 6px; display: block; margin: 10px 0; }
  table { border-collapse: collapse; font-size: 12px; margin: 8px 0; }
  td { padding: 2px 10px 2px 0; vertical-align: top; }
  td:first-child { color: var(--muted); white-space: nowrap; }
  .actions { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 10px; }
  .empty, .status { color: var(--muted); padding: 20px 0; text-align: center; }
  #login { max-width: 360px; margin: 60px auto; background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 20px; }
  #login input { width: 100%; padding: 8px; border: 1px solid var(--border); border-radius: 6px; margin: 10px 0; }
  @media (max-width: 600px) { .excerpt { white-space: normal; } .row-head { flex-wrap: wrap; } }
</style>
</head>
<body>
<header>
  <h1>Feedback inbox</h1>
  <select id="app-filter" onchange="render()"><option value="">All tools</option></select>
  <label><input type="checkbox" id="show-done" onchange="render()"> Show done</label>
  <button onclick="load()">Refresh</button>
  <button onclick="signOut()">Forget key</button>
</header>

<div id="login" style="display:none">
  <strong>Admin key</strong>
  <div style="font-size:12px;color:var(--muted);margin-top:4px">Stored in this browser only. On Sam's computer it is in <code>~/.config/unisam-feedback-admin-key</code>.</div>
  <input type="password" id="key-input" autocomplete="current-password" onkeydown="if(event.key==='Enter')saveKey()">
  <button class="primary" onclick="saveKey()">Open inbox</button>
  <div id="login-msg" style="color:var(--bug);font-size:12px;margin-top:8px"></div>
</div>

<main id="main" style="display:none">
  <div id="list"></div>
</main>

<script>
const API = 'https://unisam.nz/feedback/api';
const KEY_STORE = 'feedback_admin_key';
let reports = [];
const detailCache = {};

function getKey() { try { return localStorage.getItem(KEY_STORE) || ''; } catch (e) { return ''; } }
function esc(s) { return String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }

async function api(path, opts = {}) {
  const r = await fetch(API + path, { ...opts, headers: { ...(opts.headers || {}), Authorization: 'Bearer ' + getKey() } });
  if (r.status === 401) { showLogin('That key was not accepted.'); throw new Error('unauthorised'); }
  if (!r.ok) throw new Error('HTTP ' + r.status);
  return r.json();
}

function showLogin(msg) {
  document.getElementById('login').style.display = '';
  document.getElementById('main').style.display = 'none';
  document.getElementById('login-msg').textContent = msg || '';
}

function saveKey() {
  try { localStorage.setItem(KEY_STORE, document.getElementById('key-input').value.trim()); } catch (e) {}
  load();
}

function signOut() {
  try { localStorage.removeItem(KEY_STORE); } catch (e) {}
  showLogin();
}

async function load() {
  if (!getKey()) return showLogin();
  document.getElementById('login').style.display = 'none';
  document.getElementById('main').style.display = '';
  document.getElementById('list').innerHTML = '<div class="status">Loading…</div>';
  reports = [];
  let cursor = null;
  try {
    do {
      const d = await api('/reports' + (cursor ? '?cursor=' + encodeURIComponent(cursor) : ''));
      reports.push(...d.reports);
      cursor = d.cursor;
    } while (cursor && reports.length < 1000);
  } catch (e) {
    if (e.message !== 'unauthorised') document.getElementById('list').innerHTML = '<div class="status">Could not load: ' + esc(e.message) + '</div>';
    return;
  }
  const apps = [...new Set(reports.map(r => r.app))].sort();
  const sel = document.getElementById('app-filter');
  const keep = sel.value;
  sel.innerHTML = '<option value="">All tools</option>' + apps.map(a => `<option ${a === keep ? 'selected' : ''}>${esc(a)}</option>`).join('');
  render();
}

function render() {
  const app = document.getElementById('app-filter').value;
  const showDone = document.getElementById('show-done').checked;
  const rows = reports.filter(r => (!app || r.app === app) && (showDone || !r.done));
  const list = document.getElementById('list');
  if (!rows.length) { list.innerHTML = `<div class="empty">${reports.length ? 'Nothing open. Tick "Show done" to see finished reports.' : 'No reports yet.'}</div>`; return; }
  list.innerHTML = rows.map(r => `
    <div class="row ${r.done ? 'done' : ''}" id="row-${esc(r.id)}">
      <div class="row-head" onclick="toggle('${esc(r.id)}')">
        <span class="tag ${esc(r.type)}">${esc(r.type)}</span>
        <span class="app">${esc(r.app)}</span>
        <span class="excerpt">${esc(r.excerpt)}</span>
        <span class="icons">${r.hasImage ? '🖼' : ''}${r.hasDiagram ? ' 📈' : ''}</span>
        <span class="when">${esc(new Date(r.ts).toLocaleString(undefined, { day: 'numeric', month: 'short', hour: 'numeric', minute: '2-digit' }))}</span>
      </div>
      <div class="detail" id="detail-${esc(r.id)}"></div>
    </div>`).join('');
}

async function toggle(id) {
  const row = document.getElementById('row-' + id);
  row.classList.toggle('open');
  if (!row.classList.contains('open')) return;
  const box = document.getElementById('detail-' + id);
  if (!detailCache[id]) {
    box.innerHTML = '<div class="status">Loading…</div>';
    try { detailCache[id] = await api('/report/' + id); }
    catch (e) { box.innerHTML = '<div class="status">Could not load.</div>'; return; }
  }
  const r = detailCache[id];
  const meta = Object.entries(r.meta || {}).map(([k, v]) => `<tr><td>${esc(k)}</td><td>${esc(v)}</td></tr>`).join('');
  box.innerHTML = `
    <p class="msg">${esc(r.message)}</p>
    ${r.email ? `<div>Reply to: <a href="mailto:${esc(r.email)}">${esc(r.email)}</a></div>` : ''}
    ${r.image ? `<img src="${esc(r.image)}" alt="Screenshot sent with the report">` : ''}
    <table><tr><td>when</td><td>${esc(new Date(r.ts).toLocaleString())}</td></tr>
      <tr><td>country</td><td>${esc(r.country || '')}</td></tr>${meta}</table>
    ${r.diagram && !/^graphs/.test(r.app) ? `<details><summary>Attached data</summary><pre style="white-space:pre-wrap;font-size:12px">${esc(prettyJSON(r.diagram))}</pre></details>` : ''}
    <div class="actions">
      ${r.diagram && /^graphs/.test(r.app) ? `<button class="primary" onclick="openDiagram('${esc(id)}')">Open this diagram in ${esc(r.app)}</button>
        <button onclick="copyCode('${esc(id)}', this)">Copy save code</button>` : ''}
      <button onclick="markDone('${esc(id)}')">${r.done ? 'Mark not done' : 'Mark done'}</button>
      <button onclick="del('${esc(id)}')">Delete</button>
    </div>`;
}

// Hands the diagram to ShiftWork through localStorage (same origin on
// unisam.nz). ShiftWork picks up `sw2_open` on load and opens it, undoably.
function openDiagram(id) {
  const r = detailCache[id];
  try { localStorage.setItem('sw2_open', r.diagram); } catch (e) { alert('Could not hand over the diagram: ' + e.message); return; }
  window.open('/' + r.app + '/', '_blank');
}

// Other tools (e.g. grill) attach their own JSON; show it readably.
function prettyJSON(s) { try { return JSON.stringify(JSON.parse(s), null, 2); } catch (e) { return s; } }

function toSaveCode(json) { return btoa(unescape(encodeURIComponent(json))); }
function copyCode(id, btn) {
  navigator.clipboard.writeText(toSaveCode(detailCache[id].diagram)).then(() => {
    btn.textContent = 'Copied'; setTimeout(() => btn.textContent = 'Copy save code', 1500);
  });
}

async function markDone(id) {
  const d = await api('/report/' + id + '/done', { method: 'POST' });
  const r = reports.find(x => x.id === id); if (r) r.done = d.done;
  if (detailCache[id]) detailCache[id].done = d.done;
  render();
}

async function del(id) {
  if (!confirm('Delete this report for good?')) return;
  await api('/report/' + id, { method: 'DELETE' });
  reports = reports.filter(x => x.id !== id);
  delete detailCache[id];
  render();
}

load();
</script>
</body>
</html>
