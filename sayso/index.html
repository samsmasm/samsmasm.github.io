<!doctype html>
<!--
  GitHub Pages helper only. On the deployed Cloudflare Worker the app root IS the
  public/ folder, so this file is not part of the Worker (it serves ./public).
  On Pages the folder is literal, so /sayso/ needs to forward into public/.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Sayso</title>
    <script>
      location.replace("public/" + location.search + location.hash);
    </script>
  </head>
  <body>
    <p>Redirecting to <a href="public/">Sayso</a>…</p>
  </body>
</html>
