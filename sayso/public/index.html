<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0f1216" />
    <title>Sayso</title>
    <link rel="stylesheet" href="styles.css?v=8" />
  </head>
  <body>
    <!-- Diagnostic: surface any startup error on screen instead of a blank page. -->
    <script>
      (function () {
        function show(msg) {
          var d = document.getElementById("boot-error");
          if (!d) {
            d = document.createElement("div");
            d.id = "boot-error";
            d.style.cssText =
              "position:fixed;inset:0;z-index:99999;background:#1a0f12;color:#ffb4b4;" +
              "font:13px/1.5 ui-monospace,Menlo,Consolas,monospace;padding:20px;" +
              "white-space:pre-wrap;overflow:auto;";
            (document.body || document.documentElement).appendChild(d);
          }
          d.textContent += msg + "\n\n";
        }
        window.addEventListener("error", function (e) {
          show(
            "STARTUP ERROR:\n" +
              (e.message || (e.error && e.error.message) || "unknown") +
              (e.filename ? "\n  at " + e.filename + ":" + e.lineno + ":" + e.colno : "")
          );
        });
        window.addEventListener("unhandledrejection", function (e) {
          var r = e.reason;
          show("UNHANDLED PROMISE:\n" + (r && (r.stack || r.message)) || String(r));
        });
      })();
    </script>

    <!-- Login gate -->
    <div id="login" class="login" hidden>
      <form id="login-form" class="login-card">
        <h1>Sayso</h1>
        <p class="muted">Enter the password to continue.</p>
        <input id="password" type="password" placeholder="Password" autocomplete="current-password" />
        <button type="submit">Unlock</button>
        <p id="login-error" class="error" hidden></p>
      </form>
    </div>

    <!-- App -->
    <div id="app" class="app" hidden>
      <header class="topbar">
        <div class="tabs">
          <button class="tab" data-tab="live">Record</button>
          <button class="tab" data-tab="upload">Upload</button>
        </div>
        <button id="gear" class="icon-btn" aria-label="Settings">⚙</button>
      </header>

      <!-- LIVE -->
      <main id="tab-live" class="tab-panel">
        <div class="mode-switch">
          <button class="mode-btn" data-mode="hold">Hold</button>
          <button class="mode-btn" data-mode="auto">Auto</button>
        </div>

        <div class="record-stage">
          <div id="record-hint" class="hint">Press &amp; hold to record. Flick up to send.</div>
          <button id="record-btn" class="record-btn">
            <span id="record-label">Hold</span>
          </button>
          <button id="send-btn" class="send-btn" hidden>Send</button>
          <div id="level-meter" class="level-meter"><span id="level-fill"></span></div>
        </div>
      </main>

      <!-- UPLOAD -->
      <main id="tab-upload" class="tab-panel" hidden>
        <label id="drop" class="drop">
          <input id="file-input" type="file" accept=".m4a,.mp3,.wav,.mp4,.webm,.mpga,.mpeg,audio/*,video/mp4" hidden />
          <span class="drop-title">Drop an audio file or tap to choose</span>
          <span class="muted">m4a, mp3, wav, mp4, webm — split automatically if over 25MB</span>
        </label>
        <div id="upload-progress" class="upload-progress" hidden></div>
      </main>

      <!-- Shared transcript panel -->
      <section class="transcript">
        <div class="transcript-head">
          <div class="transcript-heading">
            <span class="transcript-title">Transcript</span>
            <span class="cost">
              <span id="cost-value" class="cost-value">≈ $0.000 · 0s</span>
              <button id="cost-reset" class="cost-reset" aria-label="Reset cost estimate">reset</button>
            </span>
          </div>
          <div class="transcript-actions">
            <button id="new-session" class="ghost-btn">New</button>
            <button id="copy-all" class="primary-btn">Copy all</button>
          </div>
        </div>
        <div id="segments" class="segments">
          <p id="empty-note" class="muted center">Nothing yet. Start recording or upload a file.</p>
        </div>
      </section>
    </div>

    <!-- Settings sheet -->
    <div id="settings" class="sheet" hidden>
      <div class="sheet-card">
        <div class="sheet-head">
          <h2>Settings</h2>
          <button id="settings-close" class="icon-btn" aria-label="Close">✕</button>
        </div>

        <label class="field">
          <span>Silence threshold (Auto mode)</span>
          <input id="silence-slider" type="range" min="2" max="15" step="1" />
          <span id="silence-value" class="field-value"></span>
        </label>

        <label class="field">
          <span>Retention (days)</span>
          <input id="retention-input" type="number" min="1" max="3650" />
          <span class="muted small">Applies to new sessions only.</span>
        </label>

        <label class="field-check">
          <input id="multi-speaker" type="checkbox" />
          <span>
            <span class="field-check-title">Multiple speakers</span>
            <span class="muted small">
              Labels Speaker 1 / Speaker 2 using a diarization model
              (~$0.006/min vs $0.0045/min). Leave off for solo marking.
            </span>
          </span>
        </label>

        <button id="logout-btn" class="ghost-btn wide">Log out</button>
        <p class="muted small">
          Audio is never stored. Only the text transcript is saved, and it expires
          after the retention period.
        </p>
      </div>
    </div>

    <div id="toast" class="toast" hidden></div>

    <script src="app.js?v=8" type="module"></script>
  </body>
</html>
