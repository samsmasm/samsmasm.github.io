<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>FNL Scheduler</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header class="topbar">
  <h1>Friday Night Live — Scheduler</h1>
  <nav>
    <a href="index.html" class="active">Tonight</a>
    <a href="history.html">History</a>
    <a href="tools/performers.html">Tidy names</a>
  </nav>
</header>

<main>
  <div id="printHeader">
    <h2 id="printDate"></h2>
    <div id="printMc"></div>
  </div>

  <div class="toolbar no-print">
    <div>
      <label for="nightDate">Night</label>
      <input type="date" id="nightDate">
    </div>
    <div>
      <label for="mcName">MC</label>
      <input type="text" id="mcName" placeholder="MC" autocomplete="fnl-no-suggest" autocorrect="off" autocapitalize="off" spellcheck="false">
    </div>
    <div>
      <label for="startTime">Start time</label>
      <input type="text" id="startTime" value="19:00" style="width:80px">
    </div>
    <div style="align-self:end; display:flex; gap:8px;">
      <button id="loadNightBtn" class="secondary">Load</button>
      <button id="autoArrangeBtn">Auto-arrange</button>
      <button id="saveBtn">Save</button>
      <button id="printBtn" class="secondary">Print</button>
    </div>
    <div style="align-self:end;"><span id="statusPill" class="pill draft">draft</span></div>
  </div>

  <div class="layout">
    <div>
      <div class="card entry-form-card no-print">
        <h2>Add performer</h2>
        <div class="entry-form">
          <div class="autocomplete-wrap">
            <label for="nameInput">Performer</label>
            <input type="text" id="nameInput" autocomplete="fnl-no-suggest" autocorrect="off" autocapitalize="off" spellcheck="false" placeholder="e.g. Roy & Joop">
            <div id="autocompleteList" class="autocomplete-list" hidden></div>
          </div>
          <div>
            <label>Pieces</label>
            <div class="stepper">
              <button type="button" id="piecesMinus">−</button>
              <span id="piecesVal">1</span>
              <button type="button" id="piecesPlus">+</button>
            </div>
          </div>
          <div>
            <label for="slotPref">Preference</label>
            <select id="slotPref">
              <option value="early">Early</option>
              <option value="mid" selected>Mid</option>
              <option value="late">Late</option>
            </select>
          </div>
          <div>
            <button type="button" id="addBtn">Add to schedule</button>
          </div>
        </div>
      </div>

      <div class="card">
        <h2>Schedule <span id="totalPieces" class="muted"></span></h2>
        <ul id="scheduleList"></ul>
        <p class="muted no-print" id="emptyMsg">No performers added yet — use the form above, or Auto-arrange once you've added a few.</p>
        <div class="no-print" style="margin-top:10px;">
          <button type="button" id="addBreakBtn" class="secondary">+ Add break</button>
        </div>
      </div>
    </div>

    <aside class="fairness-panel">
      <div class="card no-print">
        <h2>
          Recently played
          <button type="button" id="toggleFairness" class="secondary" style="float:right; padding:2px 8px;">Hide</button>
        </h2>
        <div id="fairnessBody">
          <p class="muted">Last 4 weeks</p>
          <div id="fairnessList"></div>
        </div>
      </div>
    </aside>
  </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.2/Sortable.min.js"></script>
<script type="module" src="js/app.js?v=3"></script>
</body>
</html>
