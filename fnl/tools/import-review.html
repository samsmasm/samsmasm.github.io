<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>FNL — One-off history import</title>
<link rel="stylesheet" href="../css/style.css">
<style>
  .night-block { margin-bottom: 22px; }
  .night-head { display: flex; gap: 14px; align-items: center; flex-wrap: wrap; margin-bottom: 8px; }
  .night-head input[type="text"] { width: auto; display: inline-block; }
  .night-head label { display: inline; text-transform: none; font-weight: 600; }
</style>
</head>
<body>
<header class="topbar">
  <h1>FNL — One-off history import</h1>
  <nav><a href="../index.html">Back to scheduler</a></nav>
</header>

<main>
  <div class="card">
    <h2>1. Choose the CSV file</h2>
    <p class="muted">This file is <strong>never uploaded or committed anywhere</strong> — it's read in your browser only and the parsed result is written straight to Firestore once you click Import. Nothing here touches git.</p>
    <input type="file" id="fileInput" accept=".csv">
  </div>

  <div id="reviewArea"></div>

  <div class="card no-print" id="importBar" style="display:none; position:sticky; bottom:0;">
    <button type="button" id="importAllBtn">Import checked nights to Firestore</button>
    <span id="importStatus" class="muted"></span>
  </div>
</main>

<script type="module" src="../js/import-review.js"></script>
</body>
</html>
