<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My classes - Checkin</title>
<link rel="stylesheet" href="css/style.css">
<link rel="icon" href="/unisamsq.png">
</head>
<body>

<div class="masthead">
  <div class="masthead-in">
    <img src="/unisamsq.png" alt="">
    <a class="wordmark" href="home.html">Checkin<span>unisam.nz</span></a>
    <div class="masthead-right" id="user-chip"></div>
  </div>
</div>

<div class="page narrow">
  <div id="page-error"></div>

  <!-- Asked once, on a first visit. It only decides what this page leads with. -->
  <div id="ask-role" class="hidden">
    <h1>Which are you, mostly?</h1>
    <p class="sub">This only decides what your home page leads with. Either way you can make a
      class and join a class, and you can change your mind later.</p>
    <div class="panel mt2">
      <div class="row">
        <button id="pick-teacher" class="btn-go btn-big">I teach</button>
        <button id="pick-student" class="btn-go btn-big">I am a student</button>
      </div>
    </div>
  </div>

  <div id="classes" class="hidden">
    <h1>My classes</h1>
    <p class="sub" id="home-sub"></p>

    <div id="primary"></div>
    <div id="secondary"></div>

    <p class="tiny mt2" id="role-switch"></p>
  </div>
</div>

<footer>Built by Sam G &middot; all vibe coded &middot; found a problem? tell Sam.</footer>

<script type="module" src="js/home.js"></script>
</body>
</html>
