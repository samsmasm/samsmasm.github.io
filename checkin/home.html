<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My classes - Checkin</title>
<link rel="stylesheet" href="css/style.css">
<link rel="icon" href="/unisamsq.png">
</head>
<body>

<div class="masthead">
  <div class="masthead-in">
    <img src="/unisamsq.png" alt="">
    <a class="wordmark" href="home.html">Checkin<span>unisam.nz</span></a>
    <div class="masthead-right" id="user-chip"></div>
  </div>
</div>

<div class="page narrow">
  <div id="page-error"></div>

  <h1>My classes</h1>
  <p class="sub">Classes you teach and classes you are in.</p>

  <p class="rule-label">Teaching</p>
  <div id="teaching"><p class="tiny">Loading.</p></div>

  <div class="panel-plain panel mt">
    <span class="label">Start a new class</span>
    <div class="row">
      <input type="text" id="new-class-name" class="grow" placeholder="Year 12 Economics" maxlength="80">
      <button id="new-class-go" class="btn-go">Create class</button>
    </div>
  </div>

  <p class="rule-label">Classes you are in</p>
  <div id="learning"><p class="tiny">Loading.</p></div>

  <div class="panel mt">
    <span class="label">Join a class</span>
    <div class="row">
      <input type="text" id="join-code" class="code-input" placeholder="ABC234" maxlength="6" autocomplete="off">
      <button id="join-go" class="btn-go">Join</button>
    </div>
    <p class="tiny mt" id="join-note">Your teacher will give you a six character code.</p>
  </div>
</div>

<footer>Built by Sam G &middot; all vibe coded &middot; found a problem? tell Sam.</footer>

<script type="module" src="js/home.js"></script>
</body>
</html>
