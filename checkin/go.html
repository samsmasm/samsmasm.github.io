<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Checkin</title>
<link rel="stylesheet" href="css/style.css?v=290b6c8-1909">
<script>try{document.documentElement.setAttribute("data-theme",localStorage.getItem("checkin_theme")||"light")}catch(e){}</script>
</head>
<body>

<div class="plain-page">
  <header class="plain-head">
    <span class="logo-text">Check<span class="logo-accent">in</span></span>
    <span class="tiny" id="who"></span>
  </header>

  <main class="plain-main">
    <div id="page-error"></div>

    <div id="step-code" class="hidden">
      <div class="page-header">
        <h1>Put in your code</h1>
        <p class="sub">Six letters and numbers, from the board or the sheet in front of you.
          No account needed.</p>
      </div>
      <div class="panel">
        <div class="row">
          <input type="text" id="code" class="code-input" maxlength="6" autocomplete="off"
            autocapitalize="characters" spellcheck="false" placeholder="ABC123">
          <button id="code-go" class="btn-go">Go</button>
        </div>
        <p class="tiny" id="code-note"></p>
      </div>
    </div>

    <div id="step-name" class="hidden">
      <div class="page-header">
        <h1 id="name-title">What is your name?</h1>
        <p class="sub">So your teacher knows whose answers these are. Put the name they know you
          by, not a nickname they will have to guess at.</p>
      </div>
      <div class="panel">
        <div class="row">
          <input type="text" id="name" class="grow" maxlength="60" autocomplete="name"
            placeholder="Your name">
          <button id="name-go" class="btn-go">Start</button>
        </div>
        <p class="tiny" id="name-note"></p>
      </div>
    </div>

    <div id="step-answer" class="hidden">
      <div class="page-header">
        <h1 id="set-title">Questions</h1>
        <p class="sub" id="set-sub"></p>
      </div>
      <div id="set-view"></div>
    </div>

    <div id="step-shut" class="hidden">
      <div class="page-header">
        <h1 id="shut-title">Not open</h1>
        <p class="sub" id="shut-sub"></p>
      </div>
    </div>
  </main>
</div>

<script type="module" src="js/go.js?v=290b6c8-1909"></script>
</body>
</html>
