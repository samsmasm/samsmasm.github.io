<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>One offs - Checkin</title>
<link rel="stylesheet" href="css/style.css?v=772c2f2-0736">
<script>try{document.documentElement.setAttribute("data-theme",localStorage.getItem("checkin_theme")||"light")}catch(e){}</script>
</head>
<body>

<div class="app-shell">
  <div id="sidebar"></div>

  <main class="main-content">
  <div id="page-error"></div>

  <div class="page-header">
    <h1>One off tests</h1>
    <p class="sub">For a room that is not one of your classes. Nobody signs in: they scan a code
      or type one in, put a name, and answer.</p>
  </div>

  <div class="panel">
    <span class="label">New one off test</span>
    <div class="row">
      <input type="text" id="new-name" class="grow" maxlength="80" placeholder="What is it called?">
      <button id="new-go" class="btn-go">Write the questions</button>
    </div>
    <p class="tiny mt">Or start from a set you already have:</p>
    <div class="row">
      <select id="copy-from" class="grow"><option value="">Loading your question sets.</option></select>
      <button id="copy-go">Copy it</button>
    </div>
    <p class="tiny" id="new-note"></p>
  </div>

  <p class="rule-label">Your one off tests</p>
  <div id="list"><p class="tiny">Loading.</p></div>
  </main>
</div>

<script type="module" src="js/checks.js?v=772c2f2-0736"></script>
</body>
</html>
