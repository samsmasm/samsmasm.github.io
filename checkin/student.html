<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Student results - Checkin</title>
<link rel="stylesheet" href="css/style.css?v=34ec0b0-2138">
<script>try{document.documentElement.setAttribute("data-theme",localStorage.getItem("checkin_theme")||"light")}catch(e){}</script>
</head>
<body>

<div class="app-shell">
  <div id="sidebar"></div>

  <main class="main-content">
    <div id="page-error"></div>

    <p class="tiny"><a id="back" href="home.html">Back to the class</a></p>

    <div class="page-header">
      <h1 id="who">Loading</h1>
      <p class="sub" id="sub"></p>
    </div>

    <div class="panel" id="chart-panel">
      <span class="label">Percentage on each set, oldest first</span>
      <div id="chart"><p class="tiny">Loading.</p></div>
      <div id="standing"></div>
    </div>

    <div id="flags-wrap" class="hidden">
      <p class="rule-label">Worth a look</p>
      <div id="flags"></div>
    </div>

    <p class="rule-label" id="lost-label">Where the marks went</p>
    <div id="lost"></div>

    <p class="rule-label">Every set</p>
    <p class="tiny">Open one to read the whole paper: what was asked, what they put,
      what was right, and anything you said about it.</p>
    <div id="sets"></div>
  </main>
</div>

<script type="module" src="js/student.js?v=34ec0b0-2138"></script>
</body>
</html>
