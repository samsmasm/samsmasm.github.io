<!DOCTYPE html>
<html lang="en">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Student results - Checkin</title>
<link rel="stylesheet" href="css/style.css">
<script>try{document.documentElement.setAttribute("data-theme",localStorage.getItem("checkin_theme")||"light")}catch(e){}</script>
</head>
<body>

<button class="mobile-menu-btn" id="menu-btn" aria-label="Menu">&#9776;</button>

<div class="app-shell">
  <div id="sidebar"></div>

  <main class="main-content">
    <div id="page-error"></div>

    <p class="tiny"><a id="back" href="home.html">Back to the class list</a></p>

    <div class="page-header">
      <h1 id="who">Loading</h1>
      <p class="sub" id="sub"></p>

    <div class="panel" id="chart-panel">
      <span class="label">Percentage on each set, oldest first</span>
      <div id="chart"><p class="tiny">Loading.</p></div>
    </div>

    <p class="rule-label">Every set</p>
    <div id="sets"></div>
  </main>
</div>

<script type="module" src="js/student.js?v=b3faad3-2027"></script>
