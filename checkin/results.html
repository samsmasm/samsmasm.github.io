<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Responses - Checkin</title>
<link rel="stylesheet" href="css/style.css?v=290b6c8-1909">
<script>try{document.documentElement.setAttribute("data-theme",localStorage.getItem("checkin_theme")||"light")}catch(e){}</script>
</head>
<body>

<div class="app-shell">
  <div id="sidebar"></div>

  <main class="main-content">
  <div id="page-error"></div>
  <p class="tiny"><a id="back" href="home.html">Back to the class</a></p>

  <div class="spread">
    <div>
      <h1 id="set-title">Loading</h1>
      <p class="sub" id="set-sub"></p>
    </div>
    <span class="row">
      <a class="btn btn-quiet" id="edit-link">Edit questions</a>
      <button id="export" class="btn-quiet">Download CSV</button>
    </span>
  </div>

  <div class="panel mt" id="controls"></div>

  <div class="tabs">
    <button class="tab active" data-view="scores">How they did</button>
    <button class="tab" data-view="answers">What they wrote</button>
  </div>

  <div id="body"><p class="tiny">Loading.</p></div>
  </main>
</div>

<script type="module" src="js/results.js?v=290b6c8-1909"></script>
</body>
</html>
