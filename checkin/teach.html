<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Class - Checkin</title>
<link rel="stylesheet" href="css/style.css">
<script>try{document.documentElement.setAttribute("data-theme",localStorage.getItem("checkin_theme")||"light")}catch(e){}</script>
</head>
<body>

<button class="mobile-menu-btn" id="menu-btn" aria-label="Menu">&#9776;</button>

<div class="app-shell">
  <div id="sidebar"></div>

  <main class="main-content">
  <div id="page-error"></div>

  <div class="spread">
    <div>
      <h1 id="class-name">Loading</h1>
      <p class="sub" id="class-sub"></p>
    </div>
    <a class="btn btn-go" id="new-set">New question set</a>
  </div>

  <div class="tabs">
    <button class="tab active" data-tab="sets">Question sets</button>
    <button class="tab" data-tab="students">Students</button>
    <button class="tab" data-tab="settings">Class settings</button>
  </div>

  <div id="tab-sets">
    <div id="sets"><p class="tiny">Loading.</p></div>
  </div>

  <div id="tab-students" class="hidden">
    <div class="panel">
      <span class="label">Join code</span>
      <div class="row">
        <span class="joincode" id="code">------</span>
        <button id="copy-link" class="btn-quiet">Copy invite link</button>
        <button id="rotate" class="btn-quiet">New code</button>
      </div>
      <p class="tiny mt">Anyone signed in with Google who has this code joins straight away.
        Remove someone below and they cannot rejoin with it.</p>
      <p class="tiny" id="code-note"></p>
    </div>
    <p class="rule-label">On the roll</p>
    <div id="members"><p class="tiny">Loading.</p></div>
    <div id="blocked-wrap" class="hidden">
      <p class="rule-label">Removed</p>
      <div id="blocked"></div>
    </div>
  </div>

  <div id="tab-settings" class="hidden">
    <div class="panel panel-plain">
      <span class="label">Class name</span>
      <div class="row">
        <input type="text" id="rename" class="grow" maxlength="80">
        <button id="rename-go">Save name</button>
      </div>
      <p class="tiny mt" id="rename-note"></p>
    </div>
  </div>
  </main>
</div>

<script type="module" src="js/teach.js?v=5b36f56-2014"></script>
</body>
</html>
