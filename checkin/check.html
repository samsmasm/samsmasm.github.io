<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>One off test - Checkin</title>
<link rel="stylesheet" href="css/style.css?v=290b6c8-1909">
<script>try{document.documentElement.setAttribute("data-theme",localStorage.getItem("checkin_theme")||"light")}catch(e){}</script>
</head>
<body>

<div class="app-shell">
  <div id="sidebar"></div>

  <main class="main-content">
  <div id="page-error"></div>

  <p class="tiny"><a href="checks.html">Back to one off tests</a></p>

  <div class="spread">
    <div>
      <h1 id="check-name">Loading</h1>
      <p class="sub" id="check-sub"></p>
    </div>
    <span class="row">
      <button id="run-again" class="btn-go">Start it again for a new group</button>
    </span>
  </div>

  <div id="current"></div>

  <p class="rule-label">Every run</p>
  <p class="tiny">Each run is its own group with its own code, so one group's answers are never
    mixed into another's.</p>
  <div id="runs"><p class="tiny">Loading.</p></div>

  <p class="rule-label">Settings</p>
  <div class="panel panel-plain">
    <span class="label">Name</span>
    <div class="row">
      <input type="text" id="rename" class="grow" maxlength="80">
      <button id="rename-go">Save name</button>
    </div>
    <p class="tiny mt" id="rename-note"></p>
  </div>
  <div class="panel panel-plain mt">
    <span class="label">Delete</span>
    <p class="tiny">Deletes the test, every run of it and everything anyone answered. There is no
      undo.</p>
    <div class="row"><button id="delete-go" class="btn-warn">Delete this one off test</button></div>
    <p class="tiny mt" id="delete-note"></p>
  </div>
  </main>
</div>

<script type="module" src="js/check.js?v=290b6c8-1909"></script>
</body>
</html>
