<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>QR code - Checkin</title>
<link rel="stylesheet" href="css/style.css">
<script>try{document.documentElement.setAttribute("data-theme",localStorage.getItem("checkin_theme")||"light")}catch(e){}</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
</head>
<body class="qr-body">

<button class="mobile-menu-btn qr-chrome" id="menu-btn" aria-label="Menu">&#9776;</button>

<div class="app-shell">
  <div id="sidebar"></div>

  <main class="main-content">
    <div class="qr-stage">
      <div id="page-error"></div>

      <p class="qr-kicker" id="kicker"></p>
      <p class="qr-question" id="question">Loading</p>

      <div class="qr-code" id="code"></div>

      <p class="qr-url mono" id="url"></p>

      <div class="qr-chrome" id="controls"></div>
      <div class="qr-chrome tiny" id="picker"></div>
    </div>
  </main>
</div>

<script type="module" src="js/qr.js?v=b3faad3-2027"></script>
</body>
</html>
