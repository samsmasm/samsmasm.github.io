<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>QR code - Checkin</title>
<link rel="stylesheet" href="css/style.css">
<link rel="icon" href="/unisamsq.png">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
</head>
<body class="qr-body">

<div class="masthead qr-chrome">
  <div class="masthead-in">
    <img src="/unisamsq.png" alt="">
    <a class="wordmark" href="home.html">Checkin<span>unisam.nz</span></a>
    <div class="masthead-right" id="user-chip"></div>
  </div>
</div>

<div class="qr-stage">
  <div id="page-error"></div>

  <p class="qr-kicker" id="kicker"></p>
  <p class="qr-question" id="question">Loading</p>

  <div class="qr-code" id="code"></div>

  <p class="qr-url mono" id="url"></p>

  <div class="qr-chrome" id="controls"></div>
  <div class="qr-chrome tiny" id="picker"></div>
</div>

<script type="module" src="js/qr.js"></script>
</body>
</html>
