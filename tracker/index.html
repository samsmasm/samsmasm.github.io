<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Projects</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; padding: 24px; background: #fff; color: #000; font: 16px/1.4 system-ui, sans-serif; }
  header { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 20px; }
  h1 { font-size: 20px; margin: 0; font-weight: 600; }
  button { font: inherit; background: #fff; color: #000; border: 1px solid #000; padding: 6px 14px; cursor: pointer; }
  button:hover { background: #000; color: #fff; }
  .quiet { border: 0; padding: 0; text-decoration: underline; font-size: 14px; }
  .quiet:hover { background: none; color: #000; }
  h2 { font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: .08em; color: #555; margin: 28px 0 8px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 12px; }
  .p { border: 1px solid #000; background: #fff; }
  .p > button { border: 0; width: 100%; min-height: 84px; padding: 12px; text-align: left;
       display: flex; flex-direction: column; justify-content: space-between; gap: 8px; }
  .p b { font-weight: 600; }
  .p > button i { font-style: normal; font-size: 13px; color: #555; align-self: flex-end; }
  .p > button:hover i { color: #fff; }
  .p.open { grid-column: 1 / -1; border-width: 2px; }
  .p.open > button { min-height: 0; flex-direction: row; align-items: baseline; }
  .more { padding: 0 12px 16px; max-width: 640px; }
  .more .meta { font-size: 13px; color: #555; margin-bottom: 12px; }
  .more h4 { font-size: 12px; text-transform: uppercase; letter-spacing: .08em; margin: 14px 0 4px; }
  .more p, .more ul { margin: 0; }
  .more ul { padding-left: 20px; }
  .more a { color: #000; }
  #msg { color: #555; }
  header nav { display: flex; gap: 16px; }
  #addform { border: 1px solid #000; padding: 12px; max-width: 640px; margin-bottom: 8px; }
  #addform label { display: block; font-size: 12px; text-transform: uppercase; letter-spacing: .08em; margin: 10px 0 4px; }
  #addform label:first-child { margin-top: 0; }
  #addform input, #addform select, #addform textarea { font: inherit; width: 100%; border: 1px solid #000; padding: 6px; background: #fff; color: #000; border-radius: 0; }
  #addform .row { display: flex; gap: 12px; margin-top: 14px; align-items: baseline; }
  #adderr { color: #000; font-weight: 600; }
  .more .del { margin-top: 18px; font-size: 13px; padding: 4px 10px; }
</style>
</head>
<body>
<header>
  <h1>Projects</h1>
  <nav><button id="add" class="quiet" hidden>Add project</button><button id="out" class="quiet" hidden>Sign out</button></nav>
</header>
<p id="msg">Loading.</p>
<button id="in" hidden>Sign in with Google</button>
<form id="addform" hidden>
  <label for="f-name">Name</label><input id="f-name" required maxlength="80">
  <label for="f-status">Status</label>
  <select id="f-status"><option value="idea">Idea</option><option value="needs-work">Needs work</option><option value="works">Works</option><option value="check">To check</option></select>
  <label for="f-url">Link (optional)</label><input id="f-url" maxlength="300" placeholder="/folder or https://...">
  <label for="f-summary">Summary (optional)</label><input id="f-summary" maxlength="600">
  <label for="f-features">Next features (optional, one per line)</label><textarea id="f-features" rows="3"></textarea>
  <div class="row"><button type="submit">Add</button><button type="button" id="f-cancel" class="quiet">Cancel</button><span id="adderr"></span></div>
</form>
<main id="wall"></main>

<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js';
import { getAuth, signInWithPopup, GoogleAuthProvider, signOut, onAuthStateChanged }
  from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js';

// Same Firebase project as Checkin; only its Google sign-in is used here.
const app = initializeApp({
  apiKey: "AIzaSyDMlxhx94WHh-nVOyLPDEfEIY-ohGX7KRY",
  authDomain: "coldwar-d8109.firebaseapp.com",
  projectId: "coldwar-d8109",
  appId: "1:329049097500:web:fd7184fb4c0ba011db66d9"
});
const auth = getAuth(app);
const provider = new GoogleAuthProvider();
provider.setCustomParameters({ prompt: 'select_account' });

const API = '/tracker/api/projects';
const GROUPS = [['needs-work', 'Needs work'], ['works', 'Works'], ['check', 'To check'], ['idea', 'Ideas']];
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const daysSince = t => t ? Math.max(0, Math.floor((Date.now() - Date.parse(t)) / 86400000)) : null;
let projects = [];
let openIdx = null; // the one panel shown expanded, if any

$('in').onclick = () => signInWithPopup(auth, provider).catch(e => { $('msg').textContent = 'Sign-in failed: ' + e.code; });
$('out').onclick = () => signOut(auth);

onAuthStateChanged(auth, async user => {
  $('wall').innerHTML = '';
  $('in').hidden = !!user;
  $('out').hidden = !user;
  $('add').hidden = !user;
  $('addform').hidden = true;
  if (!user) { $('msg').textContent = 'Private. Sign in to see your projects.'; return; }
  $('msg').textContent = 'Loading.';
  try {
    const res = await fetch(API, { headers: { Authorization: 'Bearer ' + await user.getIdToken() } });
    if (res.status === 401) { $('msg').textContent = 'This account (' + user.email + ') is not allowed.'; return; }
    if (!res.ok) throw new Error(res.status);
    projects = (await res.json()).projects || [];
    $('msg').textContent = projects.length ? '' : 'No projects published yet.';
    paint();
  } catch (e) {
    $('msg').textContent = 'Could not load the list (' + e.message + ').';
  }
});

function paint() {
  $('wall').innerHTML = GROUPS.map(([key, label]) => {
    const list = projects.map((p, i) => [p, i]).filter(([p]) => p.status === key);
    if (!list.length) return '';
    return `<h2>${label}</h2><div class="grid">` + list.map(([p, i]) => {
      const d = daysSince(p.touched);
      const open = i === openIdx;
      return `<div class="p${open ? ' open' : ''}"><button data-i="${i}" aria-expanded="${open}">` +
        `<b>${esc(p.name)}</b>${d != null ? `<i>${d}d</i>` : ''}</button>${open ? details(p) : ''}</div>`;
    }).join('') + '</div>';
  }).join('');
}

// Add and delete go straight to the Worker; publish.py later writes them into projects.md.
async function send(method, body) {
  const res = await fetch(API, { method, headers: {
    Authorization: 'Bearer ' + await auth.currentUser.getIdToken(), 'Content-Type': 'application/json' },
    body: JSON.stringify(body) });
  const out = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(out.error || res.status);
  projects = out.projects;
  $('msg').textContent = projects.length ? '' : 'No projects published yet.';
}

$('add').onclick = () => { $('addform').hidden = !$('addform').hidden; if (!$('addform').hidden) $('f-name').focus(); };
$('f-cancel').onclick = () => { $('addform').reset(); $('addform').hidden = true; $('adderr').textContent = ''; };
$('addform').onsubmit = async e => {
  e.preventDefault();
  $('adderr').textContent = 'Adding.';
  try {
    await send('POST', { project: { name: $('f-name').value, status: $('f-status').value, url: $('f-url').value,
      summary: $('f-summary').value, features: $('f-features').value } });
    $('f-cancel').onclick();
    openIdx = null;
    paint();
  } catch (err) { $('adderr').textContent = 'Not added: ' + err.message + '.'; }
};

// Click a name to open it across the row; click again (or another) to close.
$('wall').onclick = async e => {
  const del = e.target.closest('.del');
  if (del) {
    // Two clicks, no dialog: the first one asks, the second deletes.
    if (!del.dataset.sure) { del.dataset.sure = '1'; del.textContent = 'Click again to delete'; return; }
    del.textContent = 'Deleting.';
    try { await send('DELETE', { name: projects[openIdx].name }); openIdx = null; paint(); }
    catch (err) { del.textContent = 'Not deleted: ' + err.message; }
    return;
  }
  const b = e.target.closest('.p > button');
  if (!b) return;
  const i = Number(b.dataset.i);
  openIdx = openIdx === i ? null : i;
  paint();
  if (openIdx !== null) $('wall').querySelector('.p.open').scrollIntoView({ block: 'nearest' });
};

function details(p) {
  const link = p.url ? (p.url.startsWith('/') ? `<a href="${esc(p.url)}">${esc(p.url)}</a>` : esc(p.url)) : '';
  const feats = (p.features || []).length ? '<ul>' + p.features.map(f => `<li>${esc(f)}</li>`).join('') + '</ul>' : '<p>None listed.</p>';
  return `<div class="more">
    ${link ? `<div class="meta">${link}</div>` : ''}
    <p>${esc(p.summary)}</p>
    <h4>Last thing done</h4><p>${esc(p.last || 'Not recorded.')}</p>
    <h4>Needed to work at all</h4><p>${esc(p.functional || 'Not recorded.')}</p>
    <h4>Next features</h4>${feats}
    <button class="del" type="button">Delete</button></div>`;
}
</script>
</body>
</html>
