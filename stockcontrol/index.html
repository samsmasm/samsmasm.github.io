<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stock Shock: JIT vs JIC</title>
<style>
:root{
  --bg:#fbfaf6; --ink:#1d1b25; --muted:#5b5868; --card:#ffffff; --line:#dcd8e6;
  --purple:#5b3d99; --purple-bg:#efe9fb; --blue:#1f5fbf; --blue-bg:#e6effc;
  --red:#8c1d2c; --red-bg:#fbe9eb; --green:#1f7a45; --green-bg:#e4f4ea; --amber:#8a5a00; --amber-bg:#fdf1d8;
}
*{box-sizing:border-box}
body{margin:0;background:linear-gradient(#93d8ef 0,#cdeff3 420px,#eaf7ef 900px) fixed #eaf7ef;color:var(--ink);font-family:Verdana,Tahoma,"Segoe UI",sans-serif;font-size:16px;line-height:1.55;text-align:left}
header{background:transparent;color:#fff;padding:14px 20px 4px;display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between}
header h1{margin:0;font-size:26px;display:flex;align-items:center;gap:10px;text-shadow:0 3px 0 rgba(31,80,150,.35)}
nav button{background:#fff;border:0;color:var(--purple);padding:8px 16px;border-radius:999px;font:inherit;font-weight:bold;cursor:pointer;margin-left:6px;box-shadow:0 3px 0 rgba(31,80,150,.25)}
nav button.on{background:#ffd95e;color:#3a2a1a}
main{max-width:980px;margin:0 auto;padding:20px 16px 60px}
h2{font-size:22px;margin:0 0 10px;color:var(--purple)}
h3{font-size:17px;margin:0 0 8px;color:var(--purple)}
.card{background:var(--card);border:3px solid #fff;border-radius:22px;padding:18px 20px;margin-bottom:18px;box-shadow:0 6px 0 rgba(40,70,110,.10)}
.info{background:var(--purple-bg)}
.todo{background:var(--blue-bg)}
.shock{background:var(--red-bg);border:3px solid var(--red)}
.shock h2{color:var(--red)}
.calmcard{background:var(--green-bg);border:3px solid var(--green)}
.calmcard h2{color:var(--green)}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}
.stat{background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.stat .l{font-size:13px;color:var(--muted)}
.stat .v{font-size:22px;font-weight:bold}
.two{display:grid;gap:16px;grid-template-columns:1fr 1fr}
@media(max-width:760px){.two{grid-template-columns:1fr}}
label{display:block;font-weight:bold;margin:12px 0 4px}
input[type=range]{width:100%;-webkit-appearance:none;appearance:none;height:14px;border-radius:999px;background:#c9dcf5;margin:10px 0 6px;cursor:pointer}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:32px;height:32px;border-radius:50%;background:#fff;border:5px solid var(--blue);box-shadow:0 3px 0 rgba(0,0,0,.18)}
input[type=range]::-moz-range-thumb{width:24px;height:24px;border-radius:50%;background:#fff;border:5px solid var(--blue);box-shadow:0 3px 0 rgba(0,0,0,.18)}
input[type=range]::-moz-range-track{height:14px;border-radius:999px;background:#c9dcf5}
input[type=text],input[type=number],select,textarea{font:inherit;padding:8px 10px;border:2px solid var(--line);border-radius:8px;width:100%;background:#fff}
textarea{min-height:140px;font-family:monospace;font-size:13px}
.out{font-weight:bold;color:var(--blue)}
.opt{display:flex;gap:10px;align-items:flex-start;border:3px solid #fff;background:#fff;border-radius:16px;box-shadow:0 4px 0 rgba(31,95,191,.15);padding:10px 12px;margin:6px 0;cursor:pointer}
.opt.sel{border-color:var(--blue);background:#fffbe8}
.opt input{margin-top:5px}
button.primary{background:var(--blue);color:#fff;border:0;border-radius:16px;padding:14px 26px;font:inherit;font-weight:bold;cursor:pointer;font-size:18px;box-shadow:0 5px 0 #133f82;transition:transform .08s,box-shadow .08s}
button.primary:hover{background:#2468cf}
button.primary:active{transform:translateY(3px);box-shadow:0 2px 0 #133f82}
button.ghost{background:#fff;color:var(--blue);border:3px solid var(--blue);border-radius:14px;padding:9px 16px;font:inherit;font-weight:bold;cursor:pointer;box-shadow:0 3px 0 rgba(31,95,191,.25)}
button.ghost:active{transform:translateY(2px);box-shadow:none}
.chip{display:inline-block;background:#fff;border:2px solid var(--red);font-weight:bold;color:var(--red);border-radius:999px;padding:2px 10px;margin:2px 6px 2px 0;font-size:14px}
.chip.g{border-color:var(--green);color:var(--green)}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{border-bottom:1px solid var(--line);padding:6px 8px;text-align:right}
th:first-child,td:first-child,td.l,th.l{text-align:left}
th{background:var(--purple-bg);color:var(--purple)}
tr.tot td{font-weight:bold;border-top:2px solid var(--purple)}
.neg{color:var(--red)} .pos{color:var(--green)}
.warn{background:var(--amber-bg);border:1px solid #e3c47a;color:var(--amber);padding:8px 12px;border-radius:8px;margin:8px 0}
.bad{background:var(--red-bg);border:1px solid var(--red);color:var(--red);padding:8px 12px;border-radius:8px;margin:8px 0}
.good{background:var(--green-bg);border:1px solid var(--green);color:var(--green);padding:8px 12px;border-radius:8px;margin:8px 0}
.small{font-size:14px;color:var(--muted)}
.bar{height:14px;background:rgba(255,255,255,.7);border-radius:999px;overflow:hidden;margin:6px 0 12px;border:3px solid #fff}
.bar i{display:block;height:100%;background:linear-gradient(90deg,#ffc94a,#f2902e);border-radius:999px}
code.codebox{display:block;word-break:break-all;background:#fff;border:1px dashed var(--purple);padding:10px;border-radius:8px;font-size:12px;max-height:120px;overflow:auto}
ol.q li,ul.q li{margin-bottom:8px}
svg text{font-family:Verdana,Tahoma,sans-serif}
.hidden{display:none}
.mini{display:grid;gap:8px;grid-template-columns:repeat(auto-fit,minmax(118px,1fr));margin:8px 0}
.mini .stat{padding:6px 10px}

.scenebox svg{display:block}
label.inl{display:inline-flex;gap:8px;align-items:center;margin:0;font-weight:normal}

.rpctl select{width:auto;padding:5px 8px}

.lead{font-size:19px;margin:6px 0 10px}

.tiles{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));margin:12px 0}

.tile svg{flex:none}
.facts{display:flex;flex-wrap:wrap;gap:4px 16px;margin:8px 0;font-size:15px}
.facts b{font-size:17px}
.optrow{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.optrow .opt{margin:0}
.hint{font-size:14px;color:var(--muted)}
.forecast{background:#fff;border:3px solid #fff;border-radius:16px;box-shadow:0 4px 0 rgba(31,95,191,.12);padding:8px 12px;margin:14px 0;line-height:1.7}
.forecast .x,.ltime .x{color:var(--red);font-weight:bold}

.ltime.late{border-color:var(--red);background:var(--red-bg)}
.coach{background:#fffbe0;border:3px dashed #f2a33a;color:#7a4a00;border-radius:16px;padding:8px 12px;font-weight:bold}
details>summary{cursor:pointer;color:var(--blue);font-weight:bold;font-size:17px}
details[open]>summary{margin-bottom:10px}
.news h2{margin-bottom:6px}
.stage{padding:0 0 12px;overflow:hidden;background:#fff4e2}
.stage>:not(.scenebox){margin-left:16px;margin-right:16px}
.stage.solo{max-width:640px;margin-left:auto;margin-right:auto}
.verdict{display:flex;gap:14px;align-items:center}
.verdict svg{flex:none}
/* sky decoration behind the page */
.deco{position:fixed;inset:0;z-index:-1;pointer-events:none;overflow:hidden}
.deco .sun{position:absolute;top:28px;right:6%;width:84px;height:84px;border-radius:50%;background:radial-gradient(circle at 38% 35%,#fff6c8,#ffd95e 60%,#ffc233);box-shadow:0 0 50px 18px rgba(255,214,90,.5);animation:breathe 4s ease-in-out infinite}
.deco .cloud{position:absolute;width:130px;height:42px;border-radius:21px;background:rgba(255,255,255,.92);animation:drift linear infinite}
.deco .cloud::before,.deco .cloud::after{content:'';position:absolute;background:inherit;border-radius:50%}
.deco .cloud::before{width:56px;height:56px;top:-26px;left:22px}
.deco .cloud::after{width:40px;height:40px;top:-18px;right:24px}
.deco .c1{top:9%;animation-duration:70s}
.deco .c2{top:22%;transform:scale(.7);animation-duration:95s;animation-delay:-40s}
.deco .c3{top:4%;transform:scale(.55);animation-duration:120s;animation-delay:-80s}
@media(max-width:600px){.deco .sun{width:54px;height:54px;top:16px;right:5%}}
.deco .hills{position:absolute;left:0;bottom:0;width:100%;height:160px}
@keyframes drift{from{left:105%}to{left:-180px}}
@keyframes breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.07)}}
/* scene motion */
.bob{animation:bob 2.8s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-1.6px)}}
.tail{transform-box:fill-box;transform-origin:0% 100%;animation:swish 2.4s ease-in-out infinite}
@keyframes swish{0%,100%{transform:rotate(0)}50%{transform:rotate(-14deg)}}
.fx-heart{animation:heart 1.3s ease-out forwards}
@keyframes heart{0%{transform:translateY(4px) scale(.3);opacity:0}25%{transform:translateY(0) scale(1.15);opacity:1}100%{transform:translateY(-16px) scale(1);opacity:0}}
.drift{animation:sdrift 40s linear infinite}
@keyframes sdrift{from{transform:translateX(0)}to{transform:translateX(-470px)}}
.wheel{transform-box:fill-box;transform-origin:50% 50%}
ol.lb{list-style:none;margin:8px 0;padding:0}
ol.lb li{display:grid;grid-template-columns:40px 1fr auto;gap:2px 10px;align-items:center;background:#fff;border-radius:14px;padding:8px 12px;margin:6px 0;box-shadow:0 3px 0 rgba(91,61,153,.10)}
ol.lb li.me{background:#fffbe0;outline:3px solid #f2a33a}
ol.lb li.gap{display:block;background:none;box-shadow:none;text-align:center;color:var(--muted);padding:0}

ol.lb .rk1{background:#ffd95e;color:#5a3a00}
ol.lb .rk2{background:#dde3ea;color:#33404d}
ol.lb .rk3{background:#f0b98a;color:#5a2e0a}
ol.lb .nm{font-weight:bold;overflow-wrap:anywhere}
ol.lb .sc{font-weight:bold;font-size:18px;text-align:right;grid-row:span 2}
ol.lb .gm{font-size:13px;color:var(--muted)}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
</style>

<script>
const Engine = (function () {
  const CFG = {
    price: 20,
    cost: 12,
    baseDemand: 800,
    baseLead: 1,
    cap: 4000,
    startStock: 800,
    rounds: 10,
    hold: { storage: 0.4, insurance: 0.2, opportunity: 0.4 },
    dualFee: 500,
  };
  CFG.holdPerUnit = CFG.hold.storage + CFG.hold.insurance + CFG.hold.opportunity;

  const C = {
    calm: { id: 'calm', title: 'Quiet month', text: 'Orders arrive on time and demand is steady at about 800 units.', demand: 800, delay: 0, priceMult: 1, tag: 'calm' },
    quiet: { id: 'quiet', title: 'Slow sales month', text: 'Customers hold back spending. Demand falls to 650 units. Deliveries are normal.', demand: 650, delay: 0, priceMult: 1, tag: 'demand' },
    surge: { id: 'surge', title: 'Demand surge', text: 'A viral product review sends demand to 1,200 units. Deliveries are normal.', demand: 1200, delay: 0, priceMult: 1, tag: 'demand' },
    surge2: { id: 'surge2', title: 'Demand surge and port congestion', text: 'Demand rises to 1,100 units while congested ports add 1 week to any order placed now.', demand: 1100, delay: 1, priceMult: 1, tag: 'both' },
    licence: { id: 'licence', title: 'Export licence delays', text: 'Your rare earth supplier waits on a government export licence. Orders placed now arrive 2 weeks late and input prices rise 25% (single source).', demand: 800, delay: 2, priceMult: 1.25, tag: 'supply', link: 'Rare earths: licence delay and single-source dependence' },
    lane: { id: 'lane', title: 'Shipping lane closed', text: 'A key shipping lane closes. Orders placed now arrive 3 weeks late.', demand: 800, delay: 3, priceMult: 1, tag: 'supply' },
    lane2: { id: 'lane2', title: 'Shipping delays', text: 'Port strikes add 2 weeks to any order placed now.', demand: 800, delay: 2, priceMult: 1, tag: 'supply' },
    spike: { id: 'spike', title: 'Input price spike', text: 'Rare earth prices jump 40% as supply tightens. Orders placed now cost 40% more per unit (single source).', demand: 800, delay: 0, priceMult: 1.4, tag: 'price', link: 'Rare earths: price spike' },
    spike2: { id: 'spike2', title: 'Input price rise', text: 'Input prices rise 30% for orders placed now (single source).', demand: 800, delay: 0, priceMult: 1.3, tag: 'price' },
    licence1: { id: 'licence1', title: 'Paperwork hold-up', text: 'Customs paperwork adds 1 week to any order placed now.', demand: 800, delay: 1, priceMult: 1, tag: 'supply' },
  };

  const SEQ = {
    A: ['calm', 'calm', 'surge', 'calm', 'licence', 'lane', 'spike', 'quiet', 'calm', 'surge2'],
    B: ['calm', 'calm', 'calm', 'licence1', 'calm', 'calm', 'calm', 'quiet', 'calm', 'spike2'],
    C: ['calm', 'surge', 'lane2', 'lane', 'spike', 'surge2', 'calm', 'licence', 'surge', 'calm'],
  };
  const SEQ_NAMES = { A: 'Rare earth crunch', B: 'Calm waters', C: 'Cascade', R: 'Seeded random', S: 'Rare earth crunch, shuffled' };

  function rng(seed) {
    let a = seed >>> 0;
    return function () {
      a |= 0; a = (a + 0x6d2b79f5) | 0;
      let t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  function seqFor(mode, seed) {
    if (SEQ[mode]) return SEQ[mode].map((k) => C[k]);
    // S: the same ten events as A in a seeded random order, round 1 kept calm as a warm-up.
    if (mode === 'S') {
      const r = rng(seed), rest = SEQ.A.slice(1);
      for (let i = rest.length - 1; i > 0; i--) { const j = Math.floor(r() * (i + 1)); [rest[i], rest[j]] = [rest[j], rest[i]]; }
      return [SEQ.A[0]].concat(rest).map((k) => C[k]);
    }
    const r = rng(seed);
    const pool = ['calm', 'calm', 'calm', 'quiet', 'surge', 'surge2', 'licence', 'lane', 'lane2', 'spike', 'spike2', 'licence1'];
    const out = ['calm', 'calm'];
    while (out.length < CFG.rounds) out.push(pool[Math.floor(r() * pool.length)]);
    return out.map((k) => C[k]);
  }

  function newState() {
    return { round: 0, onHand: CFG.startStock, lots: [{ qty: CFG.startStock, cost: CFG.cost }], pipeline: [], total: 0, history: [] };
  }

  function reorderLevel(buffer) { return buffer + CFG.baseDemand * CFG.baseLead; }

  function play(s, lev, card) {
    s.round += 1;
    const r = s.round;
    const arrived = [];
    s.pipeline = s.pipeline.filter((o) => {
      if (o.arrive <= r) { s.lots.push({ qty: o.qty, cost: o.cost }); s.onHand += o.qty; arrived.push(o); return false; }
      return true;
    });
    const startStock = s.onHand;
    let ordered = null;
    if (startStock <= reorderLevel(lev.buffer) && s.pipeline.length === 0) {
      const qty = Math.min(lev.qty, CFG.cap - startStock);
      if (qty > 0) {
        const delay = lev.dual ? Math.min(card.delay, 1) : card.delay;
        const pm = lev.dual ? 1 + (card.priceMult - 1) / 2 : card.priceMult;
        const lead = CFG.baseLead + delay;
        ordered = { qty, cost: CFG.cost * pm, arrive: r + lead, lead, delay };
        s.pipeline.push(ordered);
      }
    }
    const demand = card.demand;
    const sold = Math.min(demand, s.onHand);
    const lost = demand - sold;
    let need = sold, cogs = 0;
    while (need > 0) {
      const lot = s.lots[0];
      const take = Math.min(lot.qty, need);
      cogs += take * lot.cost; lot.qty -= take; need -= take;
      if (lot.qty === 0) s.lots.shift();
    }
    s.onHand -= sold;
    const revenue = sold * CFG.price;
    const holding = s.onHand * CFG.holdPerUnit;
    const fee = lev.dual ? CFG.dualFee : 0;
    const profit = revenue - cogs - holding - fee;
    s.total += profit;
    const res = { round: r, card, lev: { ...lev }, startStock, ordered, arrivedQty: arrived.reduce((a, o) => a + o.qty, 0), demand, sold, lost, endStock: s.onHand, revenue, cogs, holding, fee, profit, total: s.total, lostProfit: lost * (CFG.price - CFG.cost), stockout: lost > 0 };
    s.history.push(res);
    return res;
  }

  function run(seq, levers) {
    const s = newState();
    seq.forEach((card, i) => play(s, typeof levers === 'function' ? levers(i, s) : levers, card));
    return s;
  }

  return { CFG, CARDS: C, SEQ, SEQ_NAMES, seqFor, newState, play, run, reorderLevel, rng };
})();
if (typeof module !== 'undefined') module.exports = Engine;

</script>
<script>
(function(){
const CFG = Engine.CFG, $ = (s)=>document.querySelector(s);
const app = $('#app');
const money = (n)=> (n<0?'-$':'$') + Math.abs(Math.round(n)).toLocaleString('en-US');
const units = (n)=> Math.round(n).toLocaleString('en-US');
const cls = (n)=> n<0?'neg':'pos';
let tab = 'play';
let G = null; // game
const defaultLev = { buffer: 800, qty: 1200, dual: false };

function esc(s){ return String(s).replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

let lbPrivate=false;
function startGame(name, mode, seed){
  G = { name: name||'Player', anon: !name, private: lbPrivate, posted: false, mode, seed, seq: Engine.seqFor(mode, seed), s: Engine.newState(), lev: {...defaultLev}, view: 'round', last: null, showTheory: true };
  render();
}

/* ---------- charts ---------- */
function stockChart(){
  const W=520,H=230,L=48,R=14,T=14,B=30, max=CFG.cap;
  const n=CFG.rounds, x=i=>L+(W-L-R)*i/n, y=v=>T+(H-T-B)*(1-v/max);
  const pts=[CFG.startStock].concat(G.s.history.map(h=>h.endStock));
  let svg=`<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Stock level chart">`;
  [0,1000,2000,3000,4000].forEach(v=>{svg+=`<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" stroke="#e6e2ef"/><text x="${L-6}" y="${y(v)+4}" font-size="11" text-anchor="end" fill="#5b5868">${v}</text>`;});
  for(let i=0;i<=n;i++) svg+=`<text x="${x(i)}" y="${H-10}" font-size="11" text-anchor="middle" fill="#5b5868">${i}</text>`;
  svg+=`<text x="${(W+L)/2}" y="${H-0}" font-size="11" text-anchor="middle" fill="#5b5868">Round</text>`;
  svg+=`<line x1="${L}" x2="${W-R}" y1="${y(CFG.cap)}" y2="${y(CFG.cap)}" stroke="#8c1d2c" stroke-width="2"/><text x="${W-R}" y="${y(CFG.cap)-3}" font-size="11" text-anchor="end" fill="#8c1d2c">Storage limit 4,000</text>`;
  const rl=Engine.reorderLevel(G.lev.buffer), bs=G.lev.buffer;
  svg+=`<line id="rlLine" x1="${L}" x2="${W-R}" y1="${y(rl)}" y2="${y(rl)}" stroke="#1f5fbf" stroke-width="2" stroke-dasharray="6 4"/><text id="rlText" x="${L+4}" y="${y(rl)-4}" font-size="11" fill="#1f5fbf">Reorder level ${units(rl)}</text>`;
  svg+=`<line id="bsLine" x1="${L}" x2="${W-R}" y1="${y(bs)}" y2="${y(bs)}" stroke="#1f7a45" stroke-width="2" stroke-dasharray="2 4"/><text id="bsText" x="${W-R}" y="${y(bs)-4}" font-size="11" text-anchor="end" fill="#1f7a45">Buffer ${units(bs)}</text>`;
  let d=''; pts.forEach((v,i)=>{d+=(i?'L':'M')+x(i)+' '+y(v)+' ';});
  svg+=`<path d="${d}" fill="none" stroke="#5b3d99" stroke-width="3"/>`;
  pts.forEach((v,i)=>{svg+=`<circle cx="${x(i)}" cy="${y(v)}" r="4" fill="#5b3d99"/>`;});
  svg+='</svg>';
  return svg;
}
function stockChartUpdate(){
  const W=520,H=230,L=48,R=14,T=14,B=30,max=CFG.cap, y=v=>T+(H-T-B)*(1-v/max);
  const rl=Engine.reorderLevel(G.lev.buffer), bs=G.lev.buffer;
  const a=$('#rlLine'); if(!a) return;
  a.setAttribute('y1',y(rl)); a.setAttribute('y2',y(rl));
  $('#rlText').setAttribute('y',y(rl)-4); $('#rlText').textContent='Reorder level '+units(rl);
  $('#bsLine').setAttribute('y1',y(bs)); $('#bsLine').setAttribute('y2',y(bs));
  $('#bsText').setAttribute('y',y(bs)-4); $('#bsText').textContent='Buffer '+units(bs);
}
function profitBars(hist, W=640, H=240){
  const L=56,R=10,T=16,B=34, vals=hist.map(h=>h.profit);
  const mx=Math.max(0,...vals), mn=Math.min(0,...vals), span=(mx-mn)||1;
  const y=v=>T+(H-T-B)*(1-(v-mn)/span), bw=(W-L-R)/hist.length;
  let s=`<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Profit by round">`;
  const step=Math.ceil(span/4/1000)*1000;
  for(let v=Math.ceil(mn/step)*step; v<=mx; v+=step) s+=`<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" stroke="#e6e2ef"/><text x="${L-6}" y="${y(v)+4}" font-size="11" text-anchor="end" fill="#5b5868">${money(v)}</text>`;
  hist.forEach((h,i)=>{
    const x0=L+i*bw+6, w=bw-12, yy=y(Math.max(h.profit,0)), hh=Math.abs(y(h.profit)-y(0));
    const col=h.stockout?'#8c1d2c':(h.profit>=0?'#5b3d99':'#8c1d2c');
    s+=`<rect x="${x0}" y="${yy}" width="${w}" height="${Math.max(hh,1)}" fill="${col}" rx="3"/>`;
    s+=`<text x="${x0+w/2}" y="${H-16}" font-size="11" text-anchor="middle" fill="#5b5868">${h.round}</text>`;
    if(h.stockout) s+=`<text x="${x0+w/2}" y="${yy-4}" font-size="11" text-anchor="middle" fill="#8c1d2c">stock-out</text>`;
  });
  s+=`<text x="${(W+L)/2}" y="${H-2}" font-size="11" text-anchor="middle" fill="#5b5868">Round (red = stock-out)</text></svg>`;
  return s;
}
function cumLines(players, W=720, H=280){
  const L=60,R=90,T=14,B=30, n=CFG.rounds;
  const all=players.flatMap(p=>p.cum); const mx=Math.max(1,...all), mn=Math.min(0,...all), span=(mx-mn)||1;
  const x=i=>L+(W-L-R)*i/n, y=v=>T+(H-T-B)*(1-(v-mn)/span);
  const cols=['#5b3d99','#1f5fbf','#1f7a45','#8c1d2c','#8a5a00'];
  let s=`<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Cumulative profit">`;
  const step=Math.ceil(span/5/5000)*5000;
  for(let v=Math.ceil(mn/step)*step; v<=mx; v+=step) s+=`<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" stroke="#e6e2ef"/><text x="${L-6}" y="${y(v)+4}" font-size="11" text-anchor="end" fill="#5b5868">${money(v)}</text>`;
  for(let i=0;i<=n;i++) s+=`<text x="${x(i)}" y="${H-10}" font-size="11" text-anchor="middle" fill="#5b5868">${i}</text>`;
  players.forEach((p,k)=>{
    let d=''; [0].concat(p.cum).forEach((v,i)=>{d+=(i?'L':'M')+x(i)+' '+y(v)+' ';});
    s+=`<path d="${d}" fill="none" stroke="${cols[k%5]}" stroke-width="3"/>`;
    s+=`<text x="${W-R+6}" y="${y(p.cum[p.cum.length-1])+4}" font-size="11" fill="${cols[k%5]}">${esc(p.name).slice(0,12)}</text>`;
  });
  return s+'</svg>';
}

const JAR=[[368,336],[380,336],[392,336],[374,322],[386,322]];
let fastMode=/[?&]fast\b/.test(location.search), anim=null;
const reduceMotion=()=>!!(window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches);
const skipAnim=()=>fastMode||!!window.__fast||reduceMotion();
const nCans=(u)=>Math.max(0,Math.min(40,Math.ceil(u/100)));
const nCats=(d)=>Math.ceil(d/100);
const sadCats=(h)=>h.lost>0?Math.min(nCats(h.demand)-(h.sold>0?1:0),Math.ceil(h.lost/100)):0;
const rowY=(n)=>SC.FLOOR-n*SC.RH;
const catXY=(j)=>[SC.CATX+j*SC.CATS,SC.CATY];
const HALO='stroke="#fff" stroke-width="4" stroke-linejoin="round" paint-order="stroke"';
function canPos(i){ return [SC.X0+(i%10)*SC.SW+3, rowY(Math.floor(i/10))-32]; }
// Stepped line with exactly k can slots below it (filled bottom left, row by row).
function stepPath(k){
  k=Math.max(0,Math.min(40,k)); const r=Math.floor(k/10), c=k%10, x1=SC.X0+10*SC.SW, y=rowY(r)-1;
  if(c===0) return {d:`M${SC.X0} ${y} H${x1}`, y};
  return {d:`M${SC.X0} ${rowY(r+1)-1} H${SC.X0+c*SC.SW} V${y} H${x1}`, y};
}
function canArt(){
  return `<rect x="1" y="1" width="20" height="3.5" rx="1.5" fill="#a9b1bc"/><rect x="1" y="26" width="20" height="3" rx="1.5" fill="#a9b1bc"/><rect x="0.5" y="9" width="21" height="13" fill="url(#gLab)"/><path d="M4 15.5 q4.5 -4.8 9.5 0 q-5 4.8 -9.5 0z M13.5 15.5 l4.2 -3.6 v7.2z" fill="#1f5fbf"/><circle cx="7" cy="14.8" r="1" fill="#fff"/><rect x="3.5" y="3" width="2.2" height="24" rx="1" fill="#fff" opacity=".55"/>`;
}
function canSVG(i,buf){
  const [x,y]=canPos(i), b=i<buf;
  return `<g data-can="${i}" transform="translate(${x},${y})"><rect class="cb" width="22" height="30" rx="4" fill="url(#gCan)" stroke="${b?'#1f7a45':'#6f7884'}" stroke-width="${b?2.5:1}"/>${canArt()}</g>`;
}
function catFace(mood,ink){
  const hi=ink==='#ffffff'?'#3a3440':'#fff';
  let eyes, mouth;
  if(mood==='happy'){
    eyes=`<path d="M-6.5 -0.5 q2.3 -4 4.6 0 M1.9 -0.5 q2.3 -4 4.6 0" fill="none" stroke="${ink}" stroke-width="1.8" stroke-linecap="round"/>`;
    mouth=`<path d="M-4 4.8 q2 3 4 0 q2 3 4 0" fill="none" stroke="${ink}" stroke-width="1.3" stroke-linecap="round"/>`;
  } else if(mood==='sad'){
    eyes=`<circle cx="-4.2" cy="0" r="2.1" fill="${ink}"/><circle cx="4.2" cy="0" r="2.1" fill="${ink}"/><circle cx="-3.6" cy="-.7" r=".7" fill="${hi}"/><circle cx="4.8" cy="-.7" r=".7" fill="${hi}"/><path d="M-7.5 -4 l5 -1.8 M7.5 -4 l-5 -1.8" stroke="${ink}" stroke-width="1.2" stroke-linecap="round"/><path d="M6 2.5 q-1.3 2.2 0 3.2 q1.3 -1 0 -3.2z" fill="#5aa7e8"/>`;
    mouth=`<path d="M-3.5 8 q3.5 -3.5 7 0" fill="none" stroke="${ink}" stroke-width="1.3" stroke-linecap="round"/>`;
  } else {
    eyes=`<circle cx="-4.2" cy="-1" r="2.3" fill="${ink}"/><circle cx="4.2" cy="-1" r="2.3" fill="${ink}"/><circle cx="-3.5" cy="-1.8" r=".8" fill="${hi}"/><circle cx="4.9" cy="-1.8" r=".8" fill="${hi}"/>`;
    mouth=`<path d="M-2.6 6.2 q1.3 1.2 2.6 0 q1.3 1.2 2.6 0" fill="none" stroke="${ink}" stroke-width="1.2" stroke-linecap="round"/>`;
  }
  return eyes+'<path d="M-1.8 2.4 h3.6 l-1.8 2z" fill="#e58a9a"/>'+mouth;
}

  el.setAttribute('data-mood',mood);

/* ---------- run animation ---------- */
function tween(el,from,to,ms,a){
  return new Promise(res=>{
    const t0=performance.now();
    const step=(now)=>{
      if(a.cancel) return res();
      const p=Math.min(1,(now-t0)/ms), e=p<.5?2*p*p:1-Math.pow(-2*p+2,2)/2;
      el.setAttribute('transform',`translate(${from[0]+(to[0]-from[0])*e},${from[1]+(to[1]-from[1])*e})`);
      if(p<1) requestAnimationFrame(step); else res();
    };
    requestAnimationFrame(step);
  });
}
function animView(h,crate){
  const late=(h.lev.dual?Math.min(h.card.delay,1):h.card.delay)>0;
  window.scrollTo(0,0);
  app.innerHTML=`
  <div class="bar"><i style="width:${(h.round-1)/CFG.rounds*100}%"></i></div>
  ${cardView(h.card,h.round)}
  <div class="card stage solo">
    <div class="scenebox">${sceneSVG({stock:h.startStock,buffer:h.lev.buffer,moods:Array(nCats(h.demand)).fill('neutral'),crate,hold:0,late})}</div>
    <p id="animMsg" class="lead" aria-live="polite" style="min-height:1.6em;font-weight:bold"></p>
    <p><button class="ghost" id="skip">Skip animation</button></p>
  </div>`;
}
// Driven only by the result object h from Engine.play.
async function runAnim(h,crate){
  animView(h,crate);
  const a=anim={cancel:false,done:false};
  const finish=()=>{ if(a.done) return; a.done=true; a.cancel=true; if(tab==='play'&&anim===a) render(); };
  $('#skip').onclick=finish;
  const STOP={}, wait=async(p)=>{ await p; if(a.cancel) throw STOP; };
  const sleep=(ms)=>new Promise(r=>setTimeout(r,ms));
  const msg=(t)=>{ $('#animMsg').textContent=t; };
  const sv=$('#scene'), cansG=$('#scCans'), fly=$('#scFly'), buf=h.lev.buffer/100;
  try{
    // 1. Order
    const due=G.s.pipeline.find(o=>o.arrive>h.round);
    if(h.ordered){
      setCrate(`Order ${units(h.ordered.qty)}: arrives round ${h.ordered.arrive}`);
      await wait(tween($('#scTruck'),[-120,0],[0,0],700,a));
      msg(`Hit the reorder level: ordering ${units(h.ordered.qty)}`);
      await wait(sleep(1100));
    } else {
      setCrate(due?crateText(0,due):null);
      msg(due?'Order already on the way':'Above the reorder level: no order');
      await wait(sleep(700));
    }
    // 2. Customers
    const cats=[...sv.querySelectorAll('[data-cat]')], nc=cats.length, sad=sadCats(h), happy=nc-sad, per=Math.min(300,2400/nc);
    msg(`Cats want ${units(h.demand)}`);
    for(let j=0;j<happy;j++){
      const el=cats[j], [cx,cy]=catXY(j), want=nCans(h.startStock-h.sold*(j+1)/happy), flights=[];
      await wait(tween(el,[cx,cy],[cx,cy-8],per*.3,a));
      while(cansG.children.length>want){
        const c=cansG.lastElementChild, [x,y]=canPos(+c.getAttribute('data-can'));
        c.removeAttribute('data-can'); fly.appendChild(c);
        flights.push(tween(c,[x,y],[cx-11,cy-62],per*.5,a).then(()=>c.remove()));
      }
      await wait(Promise.all(flights));
      setMood(el,'happy');
      await wait(tween(el,[cx,cy-8],[cx,cy],per*.2,a));
    }
    while(cansG.children.length>nCans(h.endStock)) cansG.lastElementChild.remove();
    if(sad){
      msg(`Shelves empty! ${units(h.lost)} sales lost`);
      const ps=[];
      for(let j=happy;j<nc;j++){ const el=cats[j], [cx,cy]=catXY(j); setMood(el,'sad'); ps.push(tween(el,[cx,cy],[cx+8,cy+4],600,a).then(()=>el.setAttribute('opacity','.55'))); }
      showLost(h);
      await wait(Promise.all(ps)); await wait(sleep(900));
    } else { msg(`All fed: ${units(h.sold)} sold`); await wait(sleep(500)); }
    // 3. Holding cost
    if(h.endStock>0){
      msg(`${units(h.endStock)} left over: -${money(h.holding)} storage costs`);
      const coins=$('#scCoins'), left=cansG.children.length, ps=[];
      COINS.forEach((t,k)=>{
        const [x,y]=canPos(Math.floor((k+.5)*left/COINS.length)), from=[x+11,y+15];
        coins.insertAdjacentHTML('beforeend',coinSVG(t,...from));
        const el=coins.lastElementChild;
        ps.push(sleep(k*160).then(()=>tween(el,from,JAR[k],700,a)));
      });
      await wait(Promise.all(ps));
      $('#scHoldT').textContent='Storage costs '+money(h.holding);
      await wait(sleep(1000));
    } else { msg('Nothing left over: no storage costs'); await wait(sleep(800)); }
    finish();
  }catch(e){ if(e!==STOP) { finish(); throw e; } }
}

function rpScale(kind,lines){

function rpDraw(t){
  if(rp.reduce) t=Math.floor(t);

    const {x,y}=rpScale(kind,rp.lines), labs=[];
    rp.lines.forEach(L=>{
      const show=!L.opt||rp.hyb, arr=L[kind], pts=arr.slice(0,n+1).map((v,i)=>[i,v]);
      if(f>0&&n<CFG.rounds) pts.push([n+f,arr[n]+(arr[n+1]-arr[n])*f]);
      const p=$(`#rp-${kind}-${L.key}`), lb=$(`#rp-${kind}-${L.key}-l`);
      p.setAttribute('d',pts.map((q,i)=>(i?'L':'M')+x(q[0]).toFixed(1)+' '+y(q[1]).toFixed(1)).join(' '));

      const last=pts[pts.length-1]; if(show) labs.push({lb,x:x(last[0])+7,y:y(last[1])+4});

function rpLoop(){
  const r=rp; if(r.raf) return;
  let last=null;
  const step=(now)=>{
    r.raf=null;
    if(rp!==r||!r.el.isConnected||!r.playing) return;
    if(last!=null) r.t=Math.min(CFG.rounds,r.t+(now-last)/1000*r.speed);
    last=now; rpDraw(r.t);
    if(r.t>=CFG.rounds){ r.playing=false; return; }
    r.raf=requestAnimationFrame(step);
  };
  r.raf=requestAnimationFrame(step);
}
function rpInit(lines){
  const still=reduceMotion()||fastMode||!!window.__fast;
  rp={lines,el:$('#replay'),t:still?CFG.rounds:0,n:-1,playing:!still,speed:1,hyb:false,reduce:reduceMotion(),raf:null};
  rpDraw(rp.t);
  const play=()=>{ if(rp.t>=CFG.rounds){ rp.t=0; } rp.playing=true; rpLoop(); };
  $('#rpPlay').onclick=play;
  $('#rpPause').onclick=()=>{ rp.playing=false; };
  $('#rpRestart').onclick=()=>{ rp.t=0; rpDraw(0); play(); };
  $('#rpSpeed').onchange=()=>{ rp.speed=+$('#rpSpeed').value; };
  $('#rpHyb').onchange=()=>{ rp.hyb=$('#rpHyb').checked; rp.n=-1; rpDraw(rp.t); };
  $('#rpScrub').oninput=()=>{ rp.playing=false; rp.t=+$('#rpScrub').value; rpDraw(rp.t); };
  $('#rpAgain').onclick=()=>startGame(G.name,G.mode,G.seed);
  if(rp.playing) rpLoop();
}

  if(c.demand!==CFG.baseDemand) chips.push(`<span class="chip">Demand ${units(c.demand)}</span>`);

function encode(g){
  const o={n:g.name,m:g.mode,d:g.seed,t:Math.round(g.s.total),h:g.s.history.map(h=>[h.lev.buffer,h.lev.qty,h.lev.dual?1:0])};
  return btoa(unescape(encodeURIComponent(JSON.stringify(o))));
}
function decode(code){
  try{
    const o=JSON.parse(decodeURIComponent(escape(atob(code.trim()))));
    const seq=Engine.seqFor(o.m,o.d); const st=Engine.run(seq,(i)=>({buffer:o.h[i][0],qty:o.h[i][1],dual:!!o.h[i][2]}));
    let c=0; const cum=st.history.map(h=>c+=h.profit);
    return {name:o.n,mode:o.m,seed:o.d,total:st.total,cum,stockouts:st.history.filter(h=>h.stockout).length,dualRounds:o.h.filter(x=>x[2]).length,avgBuf:o.h.reduce((a,x)=>a+x[0],0)/o.h.length,holding:st.history.reduce((a,h)=>a+h.holding,0),lost:st.history.reduce((a,h)=>a+h.lostProfit,0),claimed:o.t};
  }catch(e){ return null; }
}

function benchmarks(seq){
  const mk=(name,fn)=>{ const s=Engine.run(seq,fn); return {name,total:s.total,s}; };
  return [
    mk('Pure JIT: buffer 0, order 800, single supplier',{buffer:0,qty:800,dual:false}),
    mk('Pure JIC: buffer 3,200, order 2,400, single supplier',{buffer:3200,qty:2400,dual:false}),
    mk('Hybrid: buffer 800, order 1,200, dual supplier only on supply shock rounds',(i)=>({buffer:800,qty:1200,dual:seq[i].delay>0||seq[i].priceMult>1})),
  ];
}

/* ---------- class leaderboard ----------
   Optional and online only: the game itself works offline. Scores go to the Realtime Database
   used by /coldwar, under stockshock/scores, through its REST API (no Firebase library).
   Push keys are time ordered, so "last 7 days" is a key range query and needs no index rule.
   Totals are always recomputed from the levers, like the teacher tab. */
const LB_URL='https://coldwar-d8109-default-rtdb.asia-southeast1.firebasedatabase.app/stockshock/scores';
const PUSH_CHARS='-0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZ_abcdefghijklmnopqrstuvwxyz';
const setName=(m,d)=>Engine.SEQ_NAMES[m]+(m==='R'?' #'+d:'');
const boardSeed=(m,d)=>m==='R'?d:0; // shuffled (S) games all share one board
function pushPrefix(ms){ let s=''; for(let i=0;i<8;i++){ s=PUSH_CHARS.charAt(ms%64)+s; ms=Math.floor(ms/64); } return s; }
function lbPost(g){
  if(g.posted||g.private||g.anon||!window.fetch) return Promise.resolve(null);
  g.posted=true;
  const body={n:g.name.slice(0,24),m:g.mode,d:g.seed,t:Math.round(g.s.total),h:g.s.history.map(h=>[h.lev.buffer,h.lev.qty,h.lev.dual?1:0]),at:{'.sv':'timestamp'}};
  return fetch(LB_URL+'.json',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)})
    .then(r=>{ if(!r.ok) throw new Error('save '+r.status); return true; });
}
function lbCheck(o){
  try{
    if(!o||typeof o.n!=='string'||!o.n.trim()||!Engine.SEQ_NAMES[o.m]||!Array.isArray(o.h)||o.h.length!==CFG.rounds) return null;
    if(!o.h.every(x=>Array.isArray(x)&&x[0]>=0&&x[0]<=3200&&x[0]%200===0&&x[1]>=400&&x[1]<=4000&&x[1]%200===0&&(x[2]===0||x[2]===1))) return null;
    const seed=o.m==='R'||o.m==='S'?(Math.floor(+o.d)||1):0;
    const st=Engine.run(Engine.seqFor(o.m,seed),(i)=>({buffer:o.h[i][0],qty:o.h[i][1],dual:!!o.h[i][2]}));
    return {name:o.n.trim().slice(0,24),mode:o.m,seed:boardSeed(o.m,seed),total:st.total};
  }catch(e){ return null; }
}
// Best score per player and shock set over the last 7 days.
async function lbLoad(){
  if(!window.fetch) throw new Error('offline');
  const r=await fetch(`${LB_URL}.json?orderBy=%22$key%22&startAt=%22${pushPrefix(Date.now()-7*864e5)}%22`);
  if(!r.ok) throw new Error('load '+r.status);
  const data=(await r.json())||{}, best={};
  Object.values(data).forEach(o=>{
    const row=lbCheck(o); if(!row) return;
    const id=row.mode+'|'+row.seed+'|'+row.name.toLowerCase(), b=best[id];
    if(!b) best[id]={...row,games:1};
    else { b.games++; if(row.total>b.total){ b.total=row.total; b.name=row.name; } }
  });
  return Object.values(best).sort((a,b)=>b.total-a.total);
}
const lbSame=(r,g)=>!!g&&r.mode===g.mode&&r.seed===boardSeed(g.mode,g.seed)&&r.name.toLowerCase()===g.name.slice(0,24).trim().toLowerCase();
function lbList(rows,me,limit){
  if(!rows.length) return '<p>No scores yet this week. Be the first!</p>';
  const li=(r,i)=>{ const m=lbSame(r,me); return `<li class="${m?'me':''}"><span class="rk${i<3?' rk'+(i+1):''}">${i+1}</span><span class="nm">${esc(r.name)}${m?' (you)':''}</span><span class="sc ${cls(r.total)}">${money(r.total)}</span><span class="gm">${r.games} game${r.games>1?'s':''}</span></li>`; };
  let out=rows.slice(0,limit).map(li).join('');
  const k=me?rows.findIndex(r=>lbSame(r,me)):-1;
  if(k>=limit) out+='<li class="gap">...</li>'+li(rows[k],k);
  return `<ol class="lb">${out}</ol>`;
}
async function lbEnd(){
  const g=G, box=()=>(G===g?$('#lbBox'):null);
  let note='';
  if(g.private) note='<p class="hint">You chose to stay off the leaderboard, so this game was not added.</p>';
  else if(g.anon) note='<p class="hint">Add a name next time to join the leaderboard.</p>';
  try{ await lbPost(g); }catch(e){ note='<p class="hint">Could not save your score to the leaderboard.</p>'; }
  try{
    const rows=(await lbLoad()).filter(r=>r.mode===g.mode&&r.seed===boardSeed(g.mode,g.seed));
    if(box()) box().innerHTML=note+lbList(rows,g.private||g.anon?null:g,10);
  }catch(e){ if(box()) box().innerHTML=note+'<p class="hint">The leaderboard needs an internet connection.</p>'; }
}
function lbView(){
  const cur=G?(G.mode==='R'?'R'+G.seed:G.mode):'S', me=G&&!G.private&&!G.anon?G:null;
  app.innerHTML=`<div class="card info"><h2>Class leaderboard</h2>
    <p class="hint">Best score per player in the last 7 days. Pick a shock set to compare like with like.</p>
    <label for="lbSet">Shock set</label><select id="lbSet"><option value="${cur}">${esc(setName(cur[0],+cur.slice(1)||0))}</option></select>
    <div id="lbBox">Loading...</div></div>`;
  let rows=[];
  const draw=()=>{ const v=$('#lbSet').value, m=v[0], d=m==='R'?+v.slice(1):0;
    $('#lbBox').innerHTML=lbList(rows.filter(r=>r.mode===m&&r.seed===d),me,100); };
  $('#lbSet').onchange=draw;
  lbLoad().then(r=>{
    rows=r; if(!$('#lbSet')) return;
    const sets=['S','A','B','C'].concat([...new Set(r.filter(x=>x.mode==='R').map(x=>'R'+x.seed))]);
    if(!sets.includes(cur)) sets.push(cur);
    $('#lbSet').innerHTML=sets.map(v=>`<option value="${v}" ${v===cur?'selected':''}>${esc(setName(v[0],+v.slice(1)||0))}</option>`).join('');
    draw();
  }).catch(()=>{ if($('#lbBox')) $('#lbBox').innerHTML='<p class="hint">The leaderboard needs an internet connection.</p>'; });
}

function render(){
  document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.tab===tab));
  window.scrollTo(0,0);
  if(anim){ anim.cancel=true; anim=null; }
  if(tab==='teacher') return teacherView();
  if(tab==='lb') return lbView();
  if(!G) return setupView();
  if(G.view==='round') return roundView();
  if(G.view==='result') return resultView();
  return endView();
}
$('#tabPlay').onclick=()=>{tab='play';render();};
$('#tabTeacher').onclick=()=>{tab='teacher';render();};
$('#tabLb').onclick=()=>{tab='lb';render();};
render();
window.__G=()=>G; window.__start=startGame; window.__decode=decode;
})();
</script>
