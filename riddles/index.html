<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Riddles · unisam.nz</title>
<meta name="description" content="Probability riddles: guess first, watch a simulation, then see why.">
<link rel="icon" href="/geocornsmall.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Atkinson+Hyperlegible+Mono:wght@400;500;600&family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="riddles.css?v=20261112-210519">
<style>
.intro { font-family: var(--font-display); font-size: 24px; font-weight: 500; line-height: 1.3; text-wrap: balance; }
.how { display: flex; flex-wrap: wrap; gap: 4px 0; font-size: 14px; color: var(--muted); }
.how span + span::before { content: "\2192"; margin: 0 8px; color: var(--amber-ink); }
.group { display: flex; flex-direction: column; }
.group h2 { font-size: 13px; font-family: var(--font-body); font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); border-top: 3px solid var(--ink); padding-top: 8px; margin-bottom: 2px; }
.items { display: flex; flex-direction: column; }

/* Phone: a ruled list */
.item { display: grid; grid-template-columns: 56px 1fr auto; gap: 14px; align-items: center; padding: 12px 0; border-bottom: 1px solid var(--line); color: var(--ink); text-decoration: none; }
a.item:hover .name { text-decoration: underline; text-decoration-color: var(--amber); text-underline-offset: 4px; }
.item svg, .item .ph { width: 56px; height: 56px; display: block; }
.item .ph { border: 1px dashed var(--line); border-radius: 10px; }
.name { font-family: var(--font-display); font-size: 20px; font-weight: 600; line-height: 1.2; }
.hook { color: var(--muted); font-size: 15px; line-height: 1.35; }
.status { font-size: 13px; color: var(--muted); text-align: right; white-space: nowrap; }
.status.done { color: var(--amber-ink); font-weight: 700; }
.item.soon .name { font-weight: 500; color: var(--muted); }
.note { font-size: 14px; color: var(--muted); }
.note button { background: none; border: 0; padding: 0; color: var(--muted); text-decoration: underline; font-size: 14px; }

/* Tablet and laptop: tiles. The picture leads, then the name, the hook, and the state at the foot. */
@media (min-width: 720px) {
  main.index { max-width: 1060px; padding-left: 24px; padding-right: 24px; gap: 26px; }
  .intro { font-size: 30px; }
  .items { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 14px; margin-top: 12px; }
  .item {
    grid-template-columns: 1fr; grid-template-rows: auto 1fr auto; align-items: start; gap: 10px;
    padding: 16px; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); min-height: 228px;
  }
  a.item { transition: border-color 0.15s, transform 0.15s; }
  a.item:hover { border-color: var(--ink); transform: translateY(-2px); }
  a.item:hover .name { text-decoration: none; }
  .item svg { width: 92px; height: 92px; }
  .item .ph { display: none; }
  .item.soon { background: transparent; border-style: dashed; min-height: 0; grid-template-rows: auto auto; }
  .name { font-size: 22px; }
  .status { text-align: left; border-top: 1px solid var(--line); padding-top: 10px; font-weight: 700; color: var(--ink); }
  .status:not(.done)::after { content: " \2192"; color: var(--amber-ink); }
  .item.soon .status { display: none; }
}
footer.index { max-width: 1060px; }
</style>
</head>
<body>
<header class="masthead"><div class="masthead-inner">
  <a href="/"><img src="/geocornsmall.png" alt="unisam.nz home"></a>
  <div><span class="wordmark">Riddles</span><div class="msub">Probability, guess first</div></div>
  <a class="home" href="/">unisam.nz</a>
</div></header>

<main class="index" id="main">
  <p class="intro">Puzzles where your gut gives the wrong answer. Pick one.</p>
  <div class="how" aria-label="How each riddle works"><span>Guess</span><span>Watch</span><span>Say what you saw</span><span>See why</span></div>
  <div id="groups" style="display:flex;flex-direction:column;gap:26px"></div>
  <p class="note" id="note" hidden>Ticks are saved on this device only. <button type="button" id="clear">Clear them</button></p>
</main>
<footer class="index">Built by Sam G · all vibe coded · found a problem? tell Sam.</footer>

<script src="riddles.js?v=20261112-210519"></script>
<script>
(function () {
  /* small pictures, drawn on a 56 by 56 grid */
  function c(x, y, r, fill, extra) { return '<circle cx="' + x + '" cy="' + y + '" r="' + r + '" fill="' + fill + '"' + (extra || "") + "/>"; }
  var THUMB = {
    positive: function () {
      var s = "", k = 0;
      for (var y = 0; y < 7; y++) for (var x = 0; x < 7; x++, k++) {
        var col = k === 24 ? "var(--red)" : (k === 9 || k === 31 || k === 44) ? "var(--violet)" : "var(--dot)";
        s += c(7 + x * 7, 7 + y * 7, col === "var(--dot)" ? 1.8 : 2.8, col);
      }
      return s;
    },
    dna: function () {
      var s = "";
      for (var i = 0; i < 11; i++) s += c(8 + (i % 4) * 13, 10 + Math.floor(i / 4) * 16, 4.5, i === 5 ? "var(--red)" : "var(--violet)");
      return s;
    },
    montyhall: function () {
      return '<rect x="4" y="12" width="14" height="30" rx="3" fill="var(--surface-2)" stroke="var(--a)" stroke-width="2"/>' +
        '<rect x="21" y="12" width="14" height="30" rx="3" fill="var(--bg)" stroke="var(--line)" stroke-width="2" stroke-dasharray="3 2"/>' +
        '<rect x="38" y="12" width="14" height="30" rx="3" fill="var(--surface-2)" stroke="var(--b)" stroke-width="2"/>' +
        c(15, 28, 1.5, "var(--muted)") + c(49, 28, 1.5, "var(--muted)");
    },
    streak: function () {
      var s = "";
      for (var i = 0; i < 5; i++) s += c(8 + (i % 3) * 20, 14 + Math.floor(i / 3) * 22, 7.5, "var(--a)");
      return s + c(48, 36, 7.5, "none", ' stroke="var(--muted)" stroke-width="1.5" stroke-dasharray="3 2"') +
        '<text x="48" y="40" text-anchor="middle" font-size="11" font-weight="700" fill="var(--muted)" font-family="Fraunces, serif">?</text>';
    },
    birthday: function () {
      var s = c(28, 28, 17, "none", ' stroke="var(--line)" stroke-width="2"');
      [0.05, 0.19, 0.33, 0.47, 0.71, 0.86].forEach(function (f) { var a = f * 6.2832 - 1.5708; s += c(28 + Math.cos(a) * 22, 28 + Math.sin(a) * 22, 2.6, "var(--a)"); });
      var a = 0.6 * 6.2832 - 1.5708;
      return s + c(28 + Math.cos(a) * 22, 28 + Math.sin(a) * 22, 3, "var(--b)") + c(28 + Math.cos(a) * 27.5, 28 + Math.sin(a) * 27.5, 3, "var(--b)");
    },
    regression: function () {
      var s = '<line x1="6" y1="50" x2="50" y2="6" stroke="var(--muted)" stroke-dasharray="3 3"/>';
      [[12, 44], [18, 36], [22, 42], [28, 30], [30, 34], [34, 26], [38, 32]].forEach(function (p) { s += c(p[0], p[1], 2, "var(--dot)"); });
      [[44, 22], [48, 26], [46, 30]].forEach(function (p) { s += c(p[0], p[1], 2.6, "var(--amber-ink)"); });
      [[8, 40], [10, 36]].forEach(function (p) { s += c(p[0], p[1], 2.6, "var(--a)"); });
      return s;
    },
    galton: function () {
      var s = "";
      for (var r = 0; r < 4; r++) for (var k = 0; k <= r; k++) s += c(28 + (k - r / 2) * 8, 6 + r * 6, 1.3, "var(--muted)");
      [3, 7, 13, 17, 13, 7, 3].forEach(function (h, i) { s += '<rect x="' + (6 + i * 6.5) + '" y="' + (52 - h) + '" width="5" height="' + h + '" fill="var(--a)"/>'; });
      return s;
    },
    ruin: function () {
      return '<polyline points="4,30 10,26 16,32 22,24 28,30 34,22 40,28" fill="none" stroke="var(--a)" stroke-width="2"/>' +
        '<polyline points="4,30 10,36 16,32 22,40 28,46 32,50" fill="none" stroke="var(--red)" stroke-width="2"/>' +
        '<polyline points="4,30 10,34 16,40 20,50" fill="none" stroke="var(--red)" stroke-width="2"/>' +
        '<rect x="2" y="50" width="52" height="1.5" fill="var(--muted)"/>' + c(32, 50, 2.5, "var(--red)") + c(20, 50, 2.5, "var(--red)");
    },
    stpetersburg: function () {
      var s = "";
      [2, 4, 8, 16, 32].forEach(function (h, i) { s += '<rect x="' + (4 + i * 10) + '" y="' + (50 - h * 1.4) + '" width="7" height="' + (h * 1.4) + '" fill="var(--amber-ink)"/>'; });
      return s + '<rect x="2" y="50" width="52" height="1.5" fill="var(--muted)"/>';
    },
    twochildren: function () {
      var s = "", t = ["a", "a", "a", "b", "b", "a"];
      for (var i = 0; i < 3; i++) {
        s += c(16, 12 + i * 15, 5, "var(--" + t[i * 2] + ")") + c(30, 12 + i * 15, 5, "var(--" + t[i * 2 + 1] + ")");
      }
      return s;
    },
    sleepingbeauty: function () {
      return '<path d="M28 8 A20 20 0 1 0 46 38 A15 15 0 1 1 28 8 Z" fill="var(--masthead)"/>' +
        c(42, 14, 4, "var(--a)") + c(48, 26, 3, "var(--b)") + c(38, 26, 3, "var(--b)");
    },
    simpson: function () {
      return '<rect x="6" y="10" width="40" height="6" fill="var(--a)"/><rect x="6" y="18" width="36" height="6" fill="var(--b)"/>' +
        '<rect x="6" y="30" width="30" height="6" fill="var(--a)"/><rect x="6" y="38" width="26" height="6" fill="var(--b)"/>' +
        '<rect x="5" y="8" width="1.5" height="38" fill="var(--muted)"/>';
    }
  };

  var GROUPS = [
    { h: "Tests and evidence", items: [
      { slug: "positive", name: "The positive test", hook: "You tested positive. Should you worry?" },
      { slug: "dna", name: "The DNA match", hook: "A one in a million match. Guilty?" }
    ] },
    { h: "Games and gambling", items: [
      { slug: "montyhall", name: "Three doors", hook: "One car, two goats. Stay or switch?" },
      { slug: "streak", name: "Due a tails", hook: "Five heads in a row. What next?" },
      { slug: "ruin", name: "The fair game", hook: "A fair bet you still lose." },
      { slug: "stpetersburg", name: "Infinite money", hook: "A coin game. What does it pay on average?" }
    ] },
    { h: "Surprising numbers", items: [
      { slug: "birthday", name: "Shared birthdays", hook: "How many people until two match?" },
      { slug: "regression", name: "Top of the class", hook: "Why do top scorers slip back?" },
      { slug: "galton", name: "Falling balls", hook: "Where will 1,000 balls land?" },
      { slug: "twochildren", name: "Two children", hook: "One is a boy. Are both?" }
    ] },
    { h: "Paradoxes", items: [
      { slug: "simpson", name: "Better every time", hook: "Wins every group, loses overall?" },
      { slug: "sleepingbeauty", name: "Sleeping Beauty", hook: "Woken up. Heads or tails? Still argued." }
    ] }
  ];

  function esc(s) { return s.replace(/[&<>"]/g, function (ch) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[ch]; }); }
  document.getElementById("groups").innerHTML = GROUPS.map(function (g) {
    return '<section class="group"><h2>' + esc(g.h) + '</h2><div class="items">' + g.items.map(function (it) {
      var body = "<div><div class=\"name\">" + esc(it.name) + "</div><div class=\"hook\">" + esc(it.hook) + "</div></div>";
      if (!it.slug) return '<div class="item soon"><div class="ph"></div>' + body + '<div class="status">Soon</div></div>';
      return '<a class="item" href="' + it.slug + '/" data-slug="' + it.slug + '"><svg viewBox="0 0 56 56" aria-hidden="true">' + THUMB[it.slug]() + "</svg>" + body + '<div class="status"></div></a>';
    }).join("") + "</div></section>";
  }).join("");

  function paint() {
    var p = R.progress(), any = false;
    R.all("a.item").forEach(function (row) {
      var d = p[row.getAttribute("data-slug")], st = row.querySelector(".status");
      if (d) { any = true; st.className = "status done"; st.textContent = "✓ Done"; }
      else { st.className = "status"; st.textContent = "Play"; }
    });
    document.getElementById("note").hidden = !any;
  }
  document.getElementById("clear").addEventListener("click", function () {
    try { localStorage.removeItem("riddles.progress"); } catch (e) { /* ignore */ }
    paint();
  });
  paint();
})();
</script>
</body>
</html>
