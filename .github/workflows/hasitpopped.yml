name: Has it popped? daily data

on:
  schedule:
    - cron: '30 22 * * 1-5'  # 22:30 UTC Mon-Fri, after the US close (05:30 Vietnam next morning)
  workflow_dispatch:

jobs:
  fetch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Fetch prices and FRED series
        run: python hasitpopped/fetch.py

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add hasitpopped/data.json
          git diff --cached --quiet || git commit -m "hasitpopped: data $(date +%Y-%m-%d)"
          git pull --rebase
          git push
