    if(!box()) return;
    if(!keys.length){ box().innerHTML='<p>No games saved in the last 7 days.</p>'; return; }
    box().innerHTML=keys.map(k=>{ const o=data[k], row=lbCheck(o), when=o&&o.at?new Date(o.at).toLocaleString('en-GB',{weekday:'short',hour:'2-digit',minute:'2-digit'}):'';
      return `<div class="adm" data-k="${esc(k)}"><div><b>${esc(o&&typeof o.n==='string'?o.n:'(no name)')}</b><div class="meta">${row?esc(boardName(row.mode,row.hard))+', '+money(row.total):(o&&!o.v?'Old version entry':'Unreadable entry')}${when?', '+esc(when):''}</div></div><button class="danger">Delete</button></div>`; }).join('');
    box().querySelectorAll('.adm button').forEach(b=>b.onclick=async()=>{
      if(!b.classList.contains('arm')){ b.classList.add('arm'); b.textContent='Confirm'; return; }
      const row=b.closest('.adm'), k=row.getAttribute('data-k');
      b.disabled=true; b.textContent='Deleting...';
      try{ const r=await fetch(`${LB_URL}/${encodeURIComponent(k)}.json`,{method:'DELETE'}); if(!r.ok) throw new Error(r.status); row.remove(); }
      catch(e){ b.disabled=false; b.textContent='Failed, try again'; }
    });
  }catch(e){ if(box()) box().innerHTML='<p class="hint">The leaderboard needs an internet connection.</p>'; }
}

/* ---------- class leaderboard ----------
   Optional and online only: the game itself works offline. Scores go to the Realtime Database
   used by /coldwar, under stockshock/scores, through its REST API (no Firebase library).
   Push keys are time ordered, so "last 7 days" is a key range query and needs no index rule.
   Totals are always recomputed from the levers, like the teacher tab. */
const LB_URL='https://coldwar-d8109-default-rtdb.asia-southeast1.firebasedatabase.app/stockshock/scores';
const PUSH_CHARS='-0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZ_abcdefghijklmnopqrstuvwxyz';
const setName=(m)=>Engine.SEQ_NAMES[m];
const boardName=(m,hard)=>Engine.SEQ_NAMES[m]+(hard?', Hard':'');
let lbSortKey='total';
function pushPrefix(ms){ let s=''; for(let i=0;i<8;i++){ s=PUSH_CHARS.charAt(ms%64)+s; ms=Math.floor(ms/64); } return s; }
function lbPost(g){
  if(g.posted||g.private||g.anon||!window.fetch) return Promise.resolve(null);
  g.posted=true;
  const body={n:g.name.slice(0,24),m:g.mode,d:g.seed,t:Math.round(g.s.total),v:2,x:g.hard?1:0,h:g.s.history.map(h=>levCode(h.lev)),at:{'.sv':'timestamp'}};
  return fetch(LB_URL+'.json',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)})
    .then(r=>{ if(!r.ok) throw new Error('save '+r.status); return true; });
}
// Only games played under the current rules count. Totals are recomputed; vs = profit minus pure JIC on the same shocks.
function lbCheck(o){
  try{
    if(!o||o.v!==2||typeof o.n!=='string'||!o.n.trim()||!Engine.SEQ_NAMES[o.m]||!Array.isArray(o.h)||o.h.length!==CFG.rounds) return null;
    const hard=o.x===1, maxSup=hard?2:1;
    if(!o.h.every(x=>Array.isArray(x)&&x[0]>=0&&x[0]<=4000&&x[0]%200===0&&x[1]>=0&&x[1]<=4000&&x[1]%200===0&&Number.isInteger(x[2])&&x[2]>=0&&x[2]<=maxSup&&(x[3]===0||x[3]===1))) return null;
    if(o.h.filter(x=>x[3]===1).length>1) return null;
    if(!o.h.every((x,i)=>x[4]===undefined||x[4]===0||(x[4]===1&&[2,5,8].concat(hard?[4]:[]).includes(i+1)))) return null; // bonus only on question rounds
    const seed='ABC'.includes(o.m)?0:(Math.floor(+o.d)||1), seq=Engine.seqFor(o.m,seed);
    const st=codeRun({...o,d:seed}), jic=benchLevers(hard)[1];
    const jicTotal=Engine.run(seq,jic.lev,{v:2,hard}).total;
    return {name:o.n.trim().slice(0,24),mode:o.m,hard,total:st.total,vs:st.total-jicTotal,h:o.h,hist:st.history,at:o.at||0};
  }catch(e){ return null; }
}
async function lbFetch(){
  if(!window.fetch) throw new Error('offline');
  const r=await fetch(`${LB_URL}.json?orderBy=%22$key%22&startAt=%22${pushPrefix(Date.now()-7*864e5)}%22`);
  if(!r.ok) throw new Error('load '+r.status);
  return (await r.json())||{};
}
// One entry per player per board: best total, best "vs pure JIC", games played and every score (for the top-three popover).
function lbAggregate(rows){
  const best={};
  rows.forEach(row=>{
    const id=row.mode+'|'+(row.hard?1:0)+'|'+row.name.toLowerCase(), b=best[id], sc={total:row.total,vs:row.vs,at:row.at};
    if(!b) best[id]={name:row.name,mode:row.mode,hard:row.hard,total:row.total,vs:row.vs,games:1,scores:[sc]};
    else { b.games++; b.scores.push(sc); if(row.total>b.total){ b.total=row.total; b.name=row.name; } b.vs=Math.max(b.vs,row.vs); }
  });
  return Object.values(best);
}
async function lbLoad(){ return lbAggregate(Object.values(await lbFetch()).map(lbCheck).filter(Boolean)); }
function topThree(r,key){
  const v=(x)=>key==='vs'?(x.vs>=0?'+':'')+money(x.vs):money(x.total);
  const top=(r.scores||[r]).slice().sort((a,b)=>b[key]-a[key]).slice(0,3);
  return `<b>${esc(r.name)}: top ${top.length===1?'score':top.length+' scores'}</b><ol>${top.map(x=>`<li>${v(x)}${x.at?` <span class="small">(${esc(new Date(x.at).toLocaleDateString('en-GB',{weekday:'short',day:'numeric',month:'short'}))})</span>`:''}</li>`).join('')}</ol>`;
}
const lbSame=(r,g)=>!!g&&r.mode===g.mode&&r.hard===!!g.hard&&r.name.toLowerCase()===g.name.slice(0,24).trim().toLowerCase();
function lbList(rows,me,limit,key=lbSortKey){
  if(!rows.length) return '<p>No scores yet this week. Be the first!</p>';
  rows=rows.slice().sort((a,b)=>b[key]-a[key]);
  const val=(r)=>key==='vs'?(r.vs>=0?'+':'')+money(r.vs):money(r.total);
  const li=(r,i)=>{ const m=lbSame(r,me); return `<li class="${m?'me':''}"><span class="rk${i<3?' rk'+(i+1):''}">${i+1}</span><span class="nm"><span class="poptip" tabindex="0" data-pop="${esc(topThree(r,key))}">${esc(r.name)}</span>${m?' (you)':''}</span><span class="sc ${cls(r[key])}">${val(r)}</span><span class="gm">${r.games} game${r.games>1?'s':''}${key==='vs'?', vs pure JIC':''}</span></li>`; };
  let out=rows.slice(0,limit).map(li).join('');
  const k=me?rows.findIndex(r=>lbSame(r,me)):-1;
  if(k>=limit) out+='<li class="gap">...</li>'+li(rows[k],k);
  return `<ol class="lb">${out}</ol>`;
}
let lbCache=null;
async function lbEnd(redraw){
  const g=G, box=()=>(G===g?$('#lbBox'):null);
  if(redraw&&lbCache&&lbCache.g===g){ if(box()) box().innerHTML=lbCache.note+lbList(lbCache.rows,g.private||g.anon?null:g,10); return; }
  let note='';
  if(g.private) note='<p class="hint">You chose to stay off the leaderboard, so this game was not added.</p>';
  else if(g.anon) note='<p class="hint">Add a name next time to join the leaderboard.</p>';
  try{ await lbPost(g); }catch(e){ note='<p class="hint">Could not save your score to the leaderboard.</p>'; }
  try{
    const rows=(await lbLoad()).filter(r=>r.mode===g.mode&&r.hard===!!g.hard);
    lbCache={g,rows,note};
    if(box()) box().innerHTML=note+lbList(rows,g.private||g.anon?null:g,10);
  }catch(e){ if(box()) box().innerHTML=note+'<p class="hint">The leaderboard needs an internet connection.</p>'; }
}
function lbView(){
  const cur=G?G.mode:'S', me=G&&!G.private&&!G.anon?G:null;
  app.innerHTML=`<div class="card info"><h2>Class leaderboard</h2>
    <p class="hint">Best score per player in the last 7 days. "Beat pure JIC by" compares each game with pure JIC on the same shocks, so lucky or unlucky shock orders matter less.</p>
    <div class="ctl"><div><label for="lbSet">World</label><select id="lbSet">${['L','S','H','R'].map(v=>`<option value="${v}" ${v===cur?'selected':''}>${esc(setName(v))}</option>`).join('')}</select></div>
    <div><label for="lbLvl">Level</label><select id="lbLvl"><option value="0">Standard</option><option value="1" ${G&&G.hard?'selected':''}>Hard</option></select></div>
    <div><label>Order by</label><div class="seg" id="lbSort"><button data-k="total" class="${lbSortKey==='total'?'on':''}">Total profit</button><button data-k="vs" class="${lbSortKey==='vs'?'on':''}">Beat pure JIC by</button></div></div></div>
    <div id="lbBox">Loading...</div></div>`;
  let rows=null;
  const draw=()=>{ if(!rows) return; const m=$('#lbSet').value, hard=$('#lbLvl').value==='1';
    $('#lbBox').innerHTML=lbList(rows.filter(r=>r.mode===m&&r.hard===hard),me,100); };
  $('#lbSet').onchange=draw; $('#lbLvl').onchange=draw;
  document.querySelectorAll('#lbSort button').forEach(b=>b.onclick=()=>{ document.querySelectorAll('#lbSort button').forEach(o=>o.classList.toggle('on',o===b)); lbSortKey=b.dataset.k; draw(); });
  lbLoad().then(r=>{ rows=r; if($('#lbSet')) draw(); })
    .catch(()=>{ if($('#lbBox')) $('#lbBox').innerHTML='<p class="hint">The leaderboard needs an internet connection.</p>'; });
}

// Projector view for the teacher: big leaderboard plus what the class did, refreshed every 15 seconds.
let classTimer=null;
function classView(){
  if(!teacherOK){ tab='teacher'; return teacherView(); }
  const cur=G?G.mode:'S';
  app.innerHTML=`<div class="card info"><h2>Class view</h2>
    <div class="ctl"><div><label for="cvSet">World</label><select id="cvSet">${['L','S','H','R'].map(v=>`<option value="${v}" ${v===cur?'selected':''}>${esc(setName(v))}</option>`).join('')}</select></div>
    <div><label for="cvLvl">Level</label><select id="cvLvl"><option value="0">Standard</option><option value="1">Hard</option></select></div>
    <div><label>Order by</label><div class="seg" id="lbSort"><button data-k="total" class="${lbSortKey==='total'?'on':''}">Total profit</button><button data-k="vs" class="${lbSortKey==='vs'?'on':''}">Beat pure JIC by</button></div></div>
    <label class="small inl"><input type="checkbox" id="cvRecent" checked> This lesson only (last 60 minutes)</label>
    <button class="ghost" id="cvBack">Back to teacher tab</button></div>
    <p class="hint" id="cvMsg">Loading...</p></div>
  <div class="two"><div class="card bigboard"><h2>Leaderboard</h2><div id="cvBoard"></div></div>
  <div class="card"><h2>What the class did</h2><div id="cvChart"></div><p class="hint">Lines: average reorder level and reorder quantity each round. Bars: share of players with a stock-out that round.</p></div></div>`;
  let raw=null;
  const draw=()=>{
    if(!raw||!$('#cvBoard')) return;
    const m=$('#cvSet').value, hard=$('#cvLvl').value==='1', since=$('#cvRecent').checked?Date.now()-3600e3:0;
    const rows=Object.values(raw).map(lbCheck).filter(r=>r&&r.mode===m&&r.hard===hard&&(!since||r.at>=since));
    $('#cvBoard').innerHTML=lbList(lbAggregate(rows),null,15);
    $('#cvChart').innerHTML=classChart(rows);
    $('#cvMsg').textContent=`${rows.length} game${rows.length===1?'':'s'} shown. Updated ${new Date().toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit',second:'2-digit'})}.`;
  };
  const load=()=>lbFetch().then(d=>{ raw=d; draw(); }).catch(()=>{ if($('#cvMsg')) $('#cvMsg').textContent='The class view needs an internet connection.'; });
  ['cvSet','cvLvl','cvRecent'].forEach(k=>$('#'+k).onchange=draw);
  document.querySelectorAll('#lbSort button').forEach(b=>b.onclick=()=>{ document.querySelectorAll('#lbSort button').forEach(o=>o.classList.toggle('on',o===b)); lbSortKey=b.dataset.k; draw(); });
  $('#cvBack').onclick=()=>{ tab='teacher'; render(); };
  clearInterval(classTimer); load();
  classTimer=setInterval(()=>{ if(tab!=='class'||!$('#cvBoard')){ clearInterval(classTimer); return; } load(); },15000);
}
function classChart(rows){
  const W=520,H=260,L=50,R=14,T=16,B=32,n=CFG.rounds,x=i=>L+(W-L-R)*(i-0.5)/n,y=v=>T+(H-T-B)*(1-v/CFG.cap);
  let s=`<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Class averages by round">`;
  [0,1000,2000,3000,4000].forEach(v=>{ s+=`<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" stroke="#e6e2ef"/><text x="${L-6}" y="${y(v)+4}" font-size="11" text-anchor="end" fill="#5b5868">${units(v)}</text>`; });
  for(let i=1;i<=n;i++) s+=`<text x="${x(i)}" y="${H-15}" font-size="11" text-anchor="middle" fill="#5b5868">${i}</text>`;
  s+=`<text x="${(W+L)/2}" y="${H-2}" font-size="11" text-anchor="middle" fill="#5b5868">Round</text>`;
  if(!rows.length) return s+`<text x="${W/2}" y="${H/2}" font-size="14" text-anchor="middle" fill="#5b5868">No games yet</text></svg>`;
  const bw=(W-L-R)/n*0.6;
  for(let i=1;i<=n;i++){ const share=rows.filter(r=>r.hist[i-1].stockout).length/rows.length, hgt=(H-T-B)*share;
    s+=`<rect x="${x(i)-bw/2}" y="${H-B-hgt}" width="${bw}" height="${hgt}" fill="#f4c7cd"/>${share?`<text x="${x(i)}" y="${H-B-hgt-3}" font-size="10" text-anchor="middle" fill="#8c1d2c">${Math.round(share*100)}%</text>`:''}`; }
  const line=(k,col,dash,label)=>{ const pts=[]; for(let i=1;i<=n;i++) pts.push([x(i),y(rows.reduce((a,r)=>a+r.h[i-1][k],0)/rows.length)]);
    return `<path d="${pts.map((p,j)=>(j?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' ')}" fill="none" stroke="${col}" stroke-width="3" stroke-dasharray="${dash}"/><text x="${pts[n-1][0]}" y="${pts[n-1][1]-6}" font-size="11" font-weight="bold" text-anchor="end" fill="${col}">${label}</text>`; };
  s+=line(0,'#1f5fbf','6 4','Reorder level')+line(1,'#5b3d99','','Reorder quantity');
  return s+'</svg>';
}

function render(){
  document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.tab===tab));
  app.classList.toggle('wide',tab==='play'&&(!G||G.view==='round'));
  window.scrollTo(0,0);
  if(anim){ anim.cancel=true; anim=null; }
  if(tab==='teacher') return teacherView();
  if(tab==='lb') return lbView();
  if(tab==='class') return classView();
  if(!G) return setupView();
  if(G.view==='round') return roundView();
  if(G.view==='result') return resultView();
  return endView();
}
$('#tabPlay').onclick=()=>{tab='play';render();};
$('#tabTeacher').onclick=()=>{tab='teacher';render();};
$('#tabLb').onclick=()=>{tab='lb';render();};
$('#helpBtn').onclick=showHelp;
render();
window.__G=()=>G; window.__start=startGame; window.__opts=(o)=>{ gameOpts={...gameOpts,...o}; }; window.__decode=decode;
})();
</script>
