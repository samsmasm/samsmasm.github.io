<style>
:root{
  --bg:#fbfaf6; --ink:#1d1b25; --muted:#5b5868; --card:#ffffff; --line:#dcd8e6;
  --purple:#5b3d99; --purple-bg:#efe9fb; --blue:#1f5fbf; --blue-bg:#e6effc;
  --red:#8c1d2c; --red-bg:#fbe9eb; --green:#1f7a45; --green-bg:#e4f4ea; --amber:#8a5a00; --amber-bg:#fdf1d8;
}
*{box-sizing:border-box}
body{margin:0;background:linear-gradient(#93d8ef 0,#cdeff3 420px,#eaf7ef 900px) fixed #eaf7ef;color:var(--ink);font-family:Verdana,Tahoma,"Segoe UI",sans-serif;font-size:16px;line-height:1.55;text-align:left}
header{background:transparent;color:#fff;padding:14px 20px 4px;display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between}
header h1{margin:0;font-size:26px;display:flex;align-items:center;gap:10px;text-shadow:0 3px 0 rgba(31,80,150,.35)}
nav button{background:#fff;border:0;color:var(--purple);padding:8px 16px;border-radius:999px;font:inherit;font-weight:bold;cursor:pointer;margin-left:6px;box-shadow:0 3px 0 rgba(31,80,150,.25)}
nav button.on{background:#ffd95e;color:#3a2a1a}
main{max-width:980px;margin:0 auto;padding:20px 16px 60px}
h2{font-size:22px;margin:0 0 10px;color:var(--purple)}
h3{font-size:17px;margin:0 0 8px;color:var(--purple)}
.card{background:var(--card);border:3px solid #fff;border-radius:22px;padding:18px 20px;margin-bottom:18px;box-shadow:0 6px 0 rgba(40,70,110,.10)}
.info{background:var(--purple-bg)}
.todo{background:var(--blue-bg)}
.shock{background:var(--red-bg);border:3px solid var(--red)}
.shock h2{color:var(--red)}
.calmcard{background:var(--green-bg);border:3px solid var(--green)}
.calmcard h2{color:var(--green)}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}
.stat{background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.stat .l{font-size:13px;color:var(--muted)}
.stat .v{font-size:22px;font-weight:bold}
.two{display:grid;gap:16px;grid-template-columns:1fr 1fr}
@media(max-width:760px){.two{grid-template-columns:1fr}}
label{display:block;font-weight:bold;margin:12px 0 4px}
input[type=range]{width:100%;-webkit-appearance:none;appearance:none;height:14px;border-radius:999px;background:#c9dcf5;margin:10px 0 6px;cursor:pointer}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:32px;height:32px;border-radius:50%;background:#fff;border:5px solid var(--blue);box-shadow:0 3px 0 rgba(0,0,0,.18)}
input[type=range]::-moz-range-thumb{width:24px;height:24px;border-radius:50%;background:#fff;border:5px solid var(--blue);box-shadow:0 3px 0 rgba(0,0,0,.18)}
input[type=range]::-moz-range-track{height:14px;border-radius:999px;background:#c9dcf5}
input[type=text],input[type=number],select,textarea{font:inherit;padding:8px 10px;border:2px solid var(--line);border-radius:8px;width:100%;background:#fff}
textarea{min-height:140px;font-family:monospace;font-size:13px}
.out{font-weight:bold;color:var(--blue)}
.opt{display:flex;gap:10px;align-items:flex-start;border:3px solid #fff;background:#fff;border-radius:16px;box-shadow:0 4px 0 rgba(31,95,191,.15);padding:10px 12px;margin:6px 0;cursor:pointer}
.opt.sel{border-color:var(--blue);background:#fffbe8}
.opt input{margin-top:5px}
button.primary{background:var(--blue);color:#fff;border:0;border-radius:16px;padding:14px 26px;font:inherit;font-weight:bold;cursor:pointer;font-size:18px;box-shadow:0 5px 0 #133f82;transition:transform .08s,box-shadow .08s}
button.primary:hover{background:#2468cf}
button.primary:active{transform:translateY(3px);box-shadow:0 2px 0 #133f82}
button.ghost{background:#fff;color:var(--blue);border:3px solid var(--blue);border-radius:14px;padding:9px 16px;font:inherit;font-weight:bold;cursor:pointer;box-shadow:0 3px 0 rgba(31,95,191,.25)}
button.ghost:active{transform:translateY(2px);box-shadow:none}
.chip{display:inline-block;background:#fff;border:2px solid var(--red);font-weight:bold;color:var(--red);border-radius:999px;padding:2px 10px;margin:2px 6px 2px 0;font-size:14px}
.chip.g{border-color:var(--green);color:var(--green)}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{border-bottom:1px solid var(--line);padding:6px 8px;text-align:right}
th:first-child,td:first-child,td.l,th.l{text-align:left}
th{background:var(--purple-bg);color:var(--purple)}
tr.tot td{font-weight:bold;border-top:2px solid var(--purple)}
.neg{color:var(--red)} .pos{color:var(--green)}
.warn{background:var(--amber-bg);border:1px solid #e3c47a;color:var(--amber);padding:8px 12px;border-radius:8px;margin:8px 0}
.bad{background:var(--red-bg);border:1px solid var(--red);color:var(--red);padding:8px 12px;border-radius:8px;margin:8px 0}
.good{background:var(--green-bg);border:1px solid var(--green);color:var(--green);padding:8px 12px;border-radius:8px;margin:8px 0}
.small{font-size:14px;color:var(--muted)}
.bar{height:14px;background:rgba(255,255,255,.7);border-radius:999px;overflow:hidden;margin:6px 0 12px;border:3px solid #fff}
.bar i{display:block;height:100%;background:linear-gradient(90deg,#ffc94a,#f2902e);border-radius:999px}
code.codebox{display:block;word-break:break-all;background:#fff;border:1px dashed var(--purple);padding:10px;border-radius:8px;font-size:12px;max-height:120px;overflow:auto}
ol.q li,ul.q li{margin-bottom:8px}
svg text{font-family:Verdana,Tahoma,sans-serif}
.hidden{display:none}
.mini{display:grid;gap:8px;grid-template-columns:repeat(auto-fit,minmax(118px,1fr));margin:8px 0}

.scenebox svg{display:block}
label.inl{display:inline-flex;gap:8px;align-items:center;margin:0;font-weight:normal}
.runrow{display:flex;flex-wrap:wrap;gap:12px 18px;align-items:center}
.rpnews{margin:4px 0 10px}
.rpnews b{display:block;margin-bottom:4px}
.rplegend{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:14px;margin:6px 0 10px}
.rplegend span{display:inline-flex;align-items:center;gap:6px}
#replay svg[id^="rp-"]{display:block;max-width:760px}
.rpcap{background:var(--purple-bg);border-left:4px solid var(--purple);padding:8px 12px;border-radius:6px;min-height:3.2em}
.rpctl{display:flex;flex-wrap:wrap;gap:8px 10px;align-items:center;margin:8px 0}
.rpctl select{width:auto;padding:5px 8px}
.hud{display:flex;flex-wrap:wrap;gap:8px 10px;align-items:center;margin:0 0 14px;font-size:17px}
.pill{background:#fff;border-radius:999px;padding:6px 16px;box-shadow:0 3px 0 rgba(31,80,150,.15)}
.lead{font-size:19px;margin:6px 0 10px}
.big{font-size:34px;font-weight:bold;margin:4px 0}
.tiles{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));margin:12px 0}
.tile{display:flex;gap:12px;align-items:center;background:#fff;border:3px solid #fff;border-radius:16px;box-shadow:0 4px 0 rgba(91,61,153,.12);padding:10px 12px}
.tile svg{flex:none}
.facts{display:flex;flex-wrap:wrap;gap:4px 16px;margin:8px 0;font-size:15px}
.facts b{font-size:17px}
.optrow{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.optrow .opt{margin:0}
.hint{font-size:14px;color:var(--muted)}
.forecast{background:#fff;border:3px solid #fff;border-radius:16px;box-shadow:0 4px 0 rgba(31,95,191,.12);padding:8px 12px;margin:14px 0;line-height:1.7}
.forecast .x,.ltime .x{color:var(--red);font-weight:bold}
.ltime{display:flex;gap:10px;align-items:center;font-size:19px;background:#fff;border:3px solid var(--blue);border-radius:16px;padding:8px 12px;margin:14px 0 0}
.ltime.late{border-color:var(--red);background:var(--red-bg)}
.coach{background:#fffbe0;border:3px dashed #f2a33a;color:#7a4a00;border-radius:16px;padding:8px 12px;font-weight:bold}
details>summary{cursor:pointer;color:var(--blue);font-weight:bold;font-size:17px}
details[open]>summary{margin-bottom:10px}
.news h2{margin-bottom:6px}
.stage{padding:0 0 12px;overflow:hidden;background:#fff4e2}
.stage>:not(.scenebox){margin-left:16px;margin-right:16px}
.stage.solo{max-width:640px;margin-left:auto;margin-right:auto}
.verdict{display:flex;gap:14px;align-items:center}
.verdict svg{flex:none}
/* sky decoration behind the page */
.deco{position:fixed;inset:0;z-index:-1;pointer-events:none;overflow:hidden}
.deco .sun{position:absolute;top:28px;right:6%;width:84px;height:84px;border-radius:50%;background:radial-gradient(circle at 38% 35%,#fff6c8,#ffd95e 60%,#ffc233);box-shadow:0 0 50px 18px rgba(255,214,90,.5);animation:breathe 4s ease-in-out infinite}
.deco .cloud{position:absolute;width:130px;height:42px;border-radius:21px;background:rgba(255,255,255,.92);animation:drift linear infinite}
.deco .cloud::before,.deco .cloud::after{content:'';position:absolute;background:inherit;border-radius:50%}
.deco .cloud::before{width:56px;height:56px;top:-26px;left:22px}
.deco .cloud::after{width:40px;height:40px;top:-18px;right:24px}
.deco .c1{top:9%;animation-duration:70s}
.deco .c2{top:22%;transform:scale(.7);animation-duration:95s;animation-delay:-40s}
.deco .c3{top:4%;transform:scale(.55);animation-duration:120s;animation-delay:-80s}
@media(max-width:600px){.deco .sun{width:54px;height:54px;top:16px;right:5%}}
.deco .hills{position:absolute;left:0;bottom:0;width:100%;height:160px}
@keyframes drift{from{left:105%}to{left:-180px}}
@keyframes breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.07)}}
/* scene motion */
.bob{animation:bob 2.8s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-1.6px)}}
.tail{transform-box:fill-box;transform-origin:0% 100%;animation:swish 2.4s ease-in-out infinite}
@keyframes swish{0%,100%{transform:rotate(0)}50%{transform:rotate(-14deg)}}
.fx-heart{animation:heart 1.3s ease-out forwards}
@keyframes heart{0%{transform:translateY(4px) scale(.3);opacity:0}25%{transform:translateY(0) scale(1.15);opacity:1}100%{transform:translateY(-16px) scale(1);opacity:0}}
.drift{animation:sdrift 40s linear infinite}
@keyframes sdrift{from{transform:translateX(0)}to{transform:translateX(-470px)}}
.wheel{transform-box:fill-box;transform-origin:50% 50%}
ol.lb{list-style:none;margin:8px 0;padding:0}
ol.lb li{display:grid;grid-template-columns:40px 1fr auto;gap:2px 10px;align-items:center;background:#fff;border-radius:14px;padding:8px 12px;margin:6px 0;box-shadow:0 3px 0 rgba(91,61,153,.10)}
ol.lb li.me{background:#fffbe0;outline:3px solid #f2a33a}
ol.lb li.gap{display:block;background:none;box-shadow:none;text-align:center;color:var(--muted);padding:0}
ol.lb .rk{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-weight:bold;background:#ece8f4;color:var(--purple);grid-row:span 2}
ol.lb .rk1{background:#ffd95e;color:#5a3a00}
ol.lb .rk2{background:#dde3ea;color:#33404d}
ol.lb .rk3{background:#f0b98a;color:#5a2e0a}
ol.lb .nm{font-weight:bold;overflow-wrap:anywhere}
ol.lb .sc{font-weight:bold;font-size:18px;text-align:right;grid-row:span 2}
ol.lb .gm{font-size:13px;color:var(--muted)}
/* start screen: intro strip on top, then a big picture beside the start form, so Start round 1 needs no scrolling */
.setupgrid{display:grid;gap:14px;align-items:start;grid-template-columns:minmax(0,1fr)}
.setupgrid>.card{margin-bottom:0}
.setupgrid .setupscene{order:1}.setupgrid .start{order:2}.setupgrid .hero{order:3}
.start .lead{margin:0 0 4px;font-size:17px}
.hero .tiles{margin:10px 0 0;grid-template-columns:1fr}
.hero .tile{padding:6px 10px;font-size:14.5px;line-height:1.35}
.hero .tile svg{width:30px;height:38px}
.start .worlds{display:flex;flex-wrap:wrap;gap:6px;margin:2px 0 4px}
.start .world{padding:6px 14px;border-radius:999px;align-items:center;box-shadow:0 3px 0 rgba(31,95,191,.15)}
.start .world input,.start .world br,.start .world .small{display:none}
.start .world b{font-size:16px}
.start #pickInfo{margin:4px 0 6px;min-height:2.6em}
.start h2{margin-bottom:4px}
.start label{margin:6px 0 3px}
.start p{margin:8px 0 0}
.setupscene,.bigscene{padding:0}
.animgrid{display:grid;gap:16px;align-items:start;grid-template-columns:minmax(0,1fr)}
.animgrid>.card,.animside .card{margin-bottom:12px}
.animmsg{font-size:22px;font-weight:bold;min-height:2.8em;margin:0 0 6px;color:var(--purple)}
.qch{display:flex;flex-direction:column;gap:6px}
.qch button{text-align:left;padding:6px 12px;font-size:15px}
.qch button.right{border-color:var(--green);background:var(--green-bg);color:var(--green)}
.qch button.wrong{border-color:var(--red);background:var(--red-bg);color:var(--red)}
.qch button:disabled{opacity:1;cursor:default}
@media(min-width:900px){
  .setupgrid{grid-template-columns:auto minmax(340px,440px);justify-content:center}
  .setupgrid .setupscene{order:1}.setupgrid .start{order:2}.setupgrid .hero{order:3;grid-column:1 / -1}
  .hero .tiles{margin:0;grid-template-columns:repeat(3,minmax(0,1fr))}
  .bigscene{width:fit-content;max-width:100%;padding:0}
  .bigscene .scenebox svg{height:calc(100vh - 100px);min-height:380px;max-height:860px;width:auto;max-width:calc(100vw - 500px);margin:0 auto}
  .animgrid{grid-template-columns:auto minmax(300px,400px);justify-content:center}
}

.worlds{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));margin:8px 0 14px}
.world{display:flex;gap:10px;align-items:flex-start;border:3px solid #fff;background:#fff;border-radius:16px;padding:10px 12px;cursor:pointer;box-shadow:0 4px 0 rgba(31,95,191,.15)}
.world.sel{border-color:var(--blue);background:#fffbe8}
.world input{margin-top:5px}
.world b{font-size:17px}
.stratgrid{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(280px,1fr))}
.adm{display:grid;grid-template-columns:1fr auto;gap:4px 10px;align-items:center;background:#fff;border-radius:12px;padding:8px 12px;margin:6px 0}

button.danger{background:#fff;color:var(--red);border:3px solid var(--red);border-radius:12px;padding:6px 12px;font:inherit;font-weight:bold;cursor:pointer}
button.danger.arm{background:var(--red);color:#fff}
/* walking cat story (rounds 2, 4, 6, 8, 10) */
.walker{position:fixed;bottom:4px;left:0;width:120px;height:90px;z-index:5;pointer-events:none;will-change:transform}
.walker svg{width:120px;height:90px;overflow:visible}
.walker .leg{transform-box:fill-box;transform-origin:50% 0;animation:leg .32s ease-in-out infinite alternate}
.walker .leg.b{animation-delay:-.32s}
.walker .wbody{animation:wbob .32s ease-in-out infinite alternate}
.walker .wtail{transform-box:fill-box;transform-origin:0% 100%;animation:swish 1.1s ease-in-out infinite}
.walker.stop .leg,.walker.stop .wbody{animation:none}
.walker.eat .whead{transform-box:fill-box;transform-origin:20% 80%;animation:chomp .22s ease-in-out 6 alternate}
.walker .bubble{position:absolute;bottom:84px;left:40px;background:#fff;border-radius:14px;padding:4px 12px;font-weight:bold;font-size:15px;white-space:nowrap;box-shadow:0 3px 0 rgba(31,80,150,.18);opacity:0;transform:translateY(6px);transition:opacity .2s,transform .2s}
.walker.say .bubble{opacity:1;transform:none}
.walkmark{position:fixed;bottom:4px;z-index:4;pointer-events:none;transform:translateX(-50%)}
.walkmark .pop{animation:pop .45s ease-out}
.walker .wsvg{transform-box:fill-box;transform-origin:50% 100%}
.walker.flip .wsvg{transform:scaleX(-1)}
.walker.slip .wsvg{animation:slip .9s ease-in-out}
.walker.sniff .whead{transform-box:fill-box;transform-origin:20% 80%;animation:sniff .3s ease-in-out 5 alternate}
@keyframes slip{0%{transform:rotate(0)}20%{transform:translateY(-14px) rotate(-28deg)}45%{transform:translateY(-4px) rotate(22deg)}70%{transform:rotate(-10deg)}100%{transform:rotate(0)}}
@keyframes sniff{from{transform:translateY(0)}to{transform:translateY(5px)}}
@keyframes leg{from{transform:rotate(24deg)}to{transform:rotate(-24deg)}}
@keyframes wbob{from{transform:translateY(0)}to{transform:translateY(-2px)}}
@keyframes chomp{from{transform:rotate(0)}to{transform:rotate(16deg)}}
@keyframes pop{0%{transform:scale(0)}70%{transform:scale(1.2)}100%{transform:scale(1)}}
.bufout{font-size:15px;margin-top:4px}
.bufout:empty{display:none}

.seg{display:inline-flex;gap:6px;flex-wrap:wrap}

.ctl{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:end;margin:6px 0 10px}

.bigboard ol.lb li{font-size:20px}

<script>
const Engine = (function () {
  const CFG = {
    price: 20,
    cost: 12,
    baseDemand: 800,
    baseLead: 1,
    cap: 4000,
    startStock: 800,
    rounds: 10,
    hold: { storage: 0.4, insurance: 0.2, opportunity: 0.4 },
    dualFee: 500,
  };
  CFG.holdPerUnit = CFG.hold.storage + CFG.hold.insurance + CFG.hold.opportunity;

  const C = {
    calm: { id: 'calm', title: 'Purr-fectly normal week', text: 'Nothing to report. Orders arrive on time and demand is steady at about 800 units.', demand: 800, delay: 0, priceMult: 1, tag: 'calm' },
    quiet: { id: 'quiet', title: 'Cats on a diet', text: 'The vet says every cat in town is a bit chubby. Demand falls to 600 units. Deliveries are normal.', demand: 600, demandV1: 650, delay: 0, priceMult: 1, tag: 'demand' },
    surge: { id: 'surge', title: 'Viral cat video', text: 'A cat eating your food gets 10 million views. Demand jumps to 1,200 units. Deliveries are normal.', demand: 1200, delay: 0, priceMult: 1, tag: 'demand' },
    surge2: { id: 'surge2', title: 'Cat show season and a sleepy driver', text: 'Every cat in town is entering the cat show, so demand rises to 1,100 units. And the delivery driver took a cat nap: orders placed now arrive 1 week late.', demand: 1100, delay: 1, priceMult: 1, tag: 'both' },
    licence: { id: 'licence', title: 'The office cat sat on the import licence', text: 'Imported cat food now needs an import licence, and the office cat is sitting on it. Orders placed now arrive 2 weeks late and prices rise 25% (single source).', demand: 800, delay: 2, priceMult: 1.25, tag: 'supply' },
    lane: { id: 'lane', title: 'Giant hairball blocks the canal', text: 'A hairball the size of a whale blocks the shipping canal. Orders placed now arrive 3 weeks late.', demand: 800, delay: 3, priceMult: 1, tag: 'supply' },
    lane2: { id: 'lane2', title: 'Port workers strike for longer naps', text: 'The port workers want three naps a day. Orders placed now arrive 2 weeks late.', demand: 800, delay: 2, priceMult: 1, tag: 'supply' },
    spike: { id: 'spike', title: 'The tuna went on holiday', text: 'All the tuna swam off to a warmer sea. Fish is scarce, so orders placed now cost 40% more per unit (single source).', demand: 800, delay: 0, priceMult: 1.4, tag: 'price' },
    spike2: { id: 'spike2', title: 'Cat knocks over the tin factory', text: 'A cat pushed the tin factory\'s stock off a shelf, one tin at a time. Orders placed now cost 30% more per unit (single source).', demand: 800, delay: 0, priceMult: 1.3, tag: 'price' },
    licence1: { id: 'licence1', title: 'Cat burglar robs the supplier', text: 'A cat burglar raided your supplier\'s warehouse. Orders placed now arrive 1 week late.', demand: 800, delay: 1, priceMult: 1, tag: 'supply' },
  };

  const SEQ = {
    A: ['calm', 'calm', 'surge', 'calm', 'licence', 'lane', 'spike', 'quiet', 'calm', 'surge2'],
    B: ['calm', 'calm', 'calm', 'licence1', 'calm', 'calm', 'calm', 'quiet', 'calm', 'spike2'],
    C: ['calm', 'surge', 'lane2', 'lane', 'spike', 'surge2', 'calm', 'licence', 'surge', 'calm'],
  };
  const SEQ_NAMES = { A: 'Supply crunch', B: 'Calm waters', C: 'Cascade', R: 'Random', L: 'Stable world', S: 'Unsettled world', H: 'Chaotic world' };
  // Worlds: the ten events of a fixed set in a seeded random order, round 1 kept calm as a warm-up.
  const WORLD_DECK = { L: 'B', S: 'A', H: 'C' };

  function rng(seed) {
    let a = seed >>> 0;
    return function () {
      a |= 0; a = (a + 0x6d2b79f5) | 0;
      let t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  function seqFor(mode, seed) {
    if (SEQ[mode]) return SEQ[mode].map((k) => C[k]);
    if (WORLD_DECK[mode]) {
      const deck = SEQ[WORLD_DECK[mode]], r = rng(seed), rest = deck.slice(1);
      for (let i = rest.length - 1; i > 0; i--) { const j = Math.floor(r() * (i + 1)); [rest[i], rest[j]] = [rest[j], rest[i]]; }
      return [deck[0]].concat(rest).map((k) => C[k]);
    }
    const r = rng(seed);
    const pool = ['calm', 'calm', 'calm', 'quiet', 'surge', 'surge2', 'licence', 'lane', 'lane2', 'spike', 'spike2', 'licence1'];
    const out = ['calm', 'calm'];
    while (out.length < CFG.rounds) out.push(pool[Math.floor(r() * pool.length)]);
    return out.map((k) => C[k]);
  }

  function newState() {
    return { round: 0, onHand: CFG.startStock, lots: [{ qty: CFG.startStock, cost: CFG.cost }], pipeline: [], total: 0, history: [] };
  }

  function reorderLevel(buffer) { return buffer + CFG.baseDemand * CFG.baseLead; }

  function play(s, lev, card) {
    s.round += 1;
    const r = s.round;
    const arrived = [];
    s.pipeline = s.pipeline.filter((o) => {
      if (o.arrive <= r) { s.lots.push({ qty: o.qty, cost: o.cost }); s.onHand += o.qty; arrived.push(o); return false; }
      return true;
    });
    const startStock = s.onHand;
    let ordered = null;
    if (startStock <= reorderLevel(lev.buffer) && s.pipeline.length === 0) {
      const qty = Math.min(lev.qty, CFG.cap - startStock);
      if (qty > 0) {
        const delay = lev.dual ? Math.min(card.delay, 1) : card.delay;
        const pm = lev.dual ? 1 + (card.priceMult - 1) / 2 : card.priceMult;
        const lead = CFG.baseLead + delay;
        ordered = { qty, cost: CFG.cost * pm, arrive: r + lead, lead, delay };
        s.pipeline.push(ordered);
      }
    }
    const demand = card.demandV1 || card.demand; // original rules keep their numbers
    const sold = Math.min(demand, s.onHand);
    const lost = demand - sold;
    let need = sold, cogs = 0;
    while (need > 0) {
      const lot = s.lots[0];
      const take = Math.min(lot.qty, need);
      cogs += take * lot.cost; lot.qty -= take; need -= take;
      if (lot.qty === 0) s.lots.shift();
    }
    s.onHand -= sold;
    const revenue = sold * CFG.price;
    const holding = s.onHand * CFG.holdPerUnit;
    const fee = lev.dual ? CFG.dualFee : 0;
    const profit = revenue - cogs - holding - fee;
    s.total += profit;
    const res = { round: r, card, lev: { ...lev }, startStock, ordered, arrivedQty: arrived.reduce((a, o) => a + o.qty, 0), demand, sold, lost, endStock: s.onHand, revenue, cogs, holding, fee, profit, total: s.total, lostProfit: lost * (CFG.price - CFG.cost), stockout: lost > 0 };
    s.history.push(res);
    return res;
  }

  /* ---------- rules version 2 (added 2026-10-22) ----------
     Used when a rules object R = { v: 2, hard: bool } is passed; without R the original rules above run unchanged,
     so old score codes still give the same totals.
     Levers: { rl: reorder level, qty: reorder quantity, sup: supplier index, build: true on the round a canning line is built,
     bonus: true if that round's quick question was answered correctly (adds RULES.quizBonus) }.
     New for everyone: bulk discount on big orders, cans go off after a shelf life.
     Hard adds: lost sales cut next round's demand (goodwill), global/local suppliers, make your own (cost to make vs cost to buy),
     capacity utilisation and productivity of the canning line. */
  const RULES = {
    life: 4, bulkMin: 2000, bulkDisc: 0.05, goodwill: 0.25, quizBonus: 500,
    std: [
      { key: 'single', name: 'Single supplier', cost: 12, lead: 1, maxDelay: 99, priceShare: 1, fee: 0 },
      { key: 'dual', name: 'Dual supplier', cost: 12, lead: 1, maxDelay: 1, priceShare: 0.5, fee: 500 },
    ],
    hard: [
      { key: 'global', name: 'Global supplier', cost: 12, lead: 2, maxDelay: 99, priceShare: 1, fee: 0 },
      { key: 'local', name: 'Local supplier', cost: 13, lead: 1, maxDelay: 0, priceShare: 0.5, fee: 0 },
      { key: 'make', name: 'Make your own', cost: 8, lead: 1, maxDelay: 0, priceShare: 1, fee: 0, cap: 1000, fixed: 2000, workers: 4 },
    ],
  };
  const suppliers = (R) => (R && R.hard ? RULES.hard : RULES.std);

  function newState2() {
    return { round: 0, onHand: CFG.startStock, lots: [{ qty: CFG.startStock, cost: CFG.cost, r: 1 }], pipeline: [], total: 0, history: [], goodwill: 0, built: 0 };
  }

  function play2(s, lev, card, R) {
    s.round += 1;
    const r = s.round, sups = suppliers(R);
    const arrived = [];
    s.pipeline = s.pipeline.filter((o) => {
      if (o.arrive <= r) { s.lots.push({ qty: o.qty, cost: o.cost, r }); s.onHand += o.qty; arrived.push(o); return false; }
      return true;
    });
    if (R.hard && lev.build && !s.built) s.built = r;
    let si = sups[lev.sup] ? lev.sup : 0;
    if (sups[si].cap && !s.built) si = 0;
    const sup = sups[si];
    const startStock = s.onHand;
    let ordered = null, made = 0;
    if (startStock <= lev.rl && s.pipeline.length === 0) {
      let qty = Math.min(lev.qty, CFG.cap - startStock);
      if (sup.cap) qty = Math.min(qty, sup.cap);
      if (qty > 0) {
        const delay = Math.min(card.delay, sup.maxDelay);
        const pm = 1 + (card.priceMult - 1) * sup.priceShare;
        const bulk = !sup.cap && qty >= RULES.bulkMin;
        const cost = sup.cost * pm * (bulk ? 1 - RULES.bulkDisc : 1);
        const lead = sup.lead + delay;
        ordered = { qty, cost, arrive: r + lead, lead, delay, sup: si, bulk };
        s.pipeline.push(ordered);
        if (sup.cap) made = qty;
      }
    }
    const goodwillLoss = R.hard ? s.goodwill : 0;
    const demand = Math.max(0, card.demand - goodwillLoss);
    const sold = Math.min(demand, s.onHand);
    const lost = demand - sold;
    let need = sold, cogs = 0;
    while (need > 0) {
      const lot = s.lots[0];
      const take = Math.min(lot.qty, need);
      cogs += take * lot.cost; lot.qty -= take; need -= take;
      if (lot.qty === 0) s.lots.shift();
    }
    s.onHand -= sold;
    // Cans still on the shelf after `life` rounds go off and are thrown away.
    let spoiled = 0, spoilCost = 0;
    while (s.lots.length && r - s.lots[0].r + 1 >= RULES.life) { const lot = s.lots.shift(); spoiled += lot.qty; spoilCost += lot.qty * lot.cost; }
    s.onHand -= spoiled;
    const revenue = sold * CFG.price;
    const holding = s.onHand * CFG.holdPerUnit;
    const fee = sup.fee;
    const fixed = R.hard && s.built ? RULES.hard[2].fixed : 0;
    const bonus = lev.bonus ? RULES.quizBonus : 0; // right answer to that round's quick question
    const profit = revenue - cogs - holding - fee - fixed - spoilCost + bonus;
    s.total += profit;
    if (R.hard) s.goodwill = Math.round((lost * RULES.goodwill) / 100) * 100; // whole cats (1 cat = 100 units)
    const line = RULES.hard[2];
    const res = { round: r, card, lev: { ...lev, sup: si }, startStock, ordered, arrivedQty: arrived.reduce((a, o) => a + o.qty, 0), demand, cardDemand: card.demand, goodwillLoss, sold, lost, endStock: s.onHand, revenue, cogs, holding, fee, fixed, spoiled, spoilCost, bonus, profit, total: s.total, lostProfit: lost * (CFG.price - CFG.cost), stockout: lost > 0, built: s.built, made, util: s.built ? made / line.cap : null, productivity: s.built ? made / line.workers : null, nextGoodwill: R.hard ? s.goodwill : 0 };
    s.history.push(res);
    return res;
  }

  function run(seq, levers, R) {
    const s = R ? newState2() : newState();
    seq.forEach((card, i) => (R ? play2 : play)(s, typeof levers === 'function' ? levers(i, s) : levers, card, R));
    return s;
  }

  return { CFG, CARDS: C, SEQ, SEQ_NAMES, WORLD_DECK, RULES, suppliers, seqFor, newState, newState2, play, play2, run, reorderLevel, rng };
})();
if (typeof module !== 'undefined') module.exports = Engine;

</script>
<script>
(function(){
const CFG = Engine.CFG, $ = (s)=>document.querySelector(s);
const app = $('#app');
const money = (n)=> (n<0?'-$':'$') + Math.abs(Math.round(n)).toLocaleString('en-US');
const units = (n)=> Math.round(n).toLocaleString('en-US');
const cls = (n)=> n<0?'neg':'pos';
let tab = 'play';
let G = null; // game
const defaultLev = { buf: 800, rl: 1600, qty: 1200, sup: 0, build: false }; // rl is always worked out from buf (see expLead)
const USAGE = CFG.baseDemand; // expected usage per round for reorder level sums

function esc(s){ return String(s).replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

let lbPrivate=false, gameOpts={hard:false, quiz:true};
const WORLDS=[['L','Mostly calm, a few hiccups.'],['S','Surges, delays and price spikes.'],['H','Shock after shock.'],['R','New events every game.']];
function startGame(name, mode, seed){
  const old=document.getElementById('walkMark'); if(old) old.remove();
  const first=!helpSeen();
  G = { name: name||'Player', anon: !name, private: lbPrivate, posted: false, mode, seed, hard: !!gameOpts.hard, quiz: gameOpts.quiz!==false, quizLog: [], seq: Engine.seqFor(mode, seed), s: Engine.newState2(), lev: {...defaultLev}, view: 'round', last: null, showTheory: true };
  render();
  if(first) showHelp();
}
const rules=(g=G)=>({v:2,hard:!!g.hard});
const supsFor=(hard)=>Engine.suppliers({v:2,hard});
// Supplier actually used and this round's delivery time for a lever choice.
function leadFor(lev,card,hard,built){
  const sups=supsFor(hard); let si=sups[lev.sup]?lev.sup:0;
  if(sups[si].cap&&!built&&!lev.build) si=0;
  const sp=sups[si], delay=Math.min(card.delay,sp.maxDelay);
  return {sp,si,delay,lead:sp.lead+delay};
}
const bufferFor=(rl,lead)=>rl-USAGE*lead;
// Expected (normal) lead time of the chosen supplier: the reorder level is planned on this, as in the IB stock control model.
const expLead=(lev,hard,built)=>leadFor(lev,{delay:0},hard,built).lead;
const planRl=(lev,hard,built)=>lev.buf+USAGE*expLead(lev,hard,built);

/* ---------- How to play pop-up ----------
   Opens by itself the first time a game starts on this device (one "seen" flag in localStorage, nothing else is
   saved), and any time from the How to play button in the header. */
const HELP_KEY='stockshock-seen-help';
function helpSeen(){ try{ return localStorage.getItem(HELP_KEY)==='1'; }catch(e){ return false; } }
function showHelp(){
  if(document.getElementById('helpModal')) return;
  const hard=G?G.hard:gameOpts.hard, back=document.activeElement;
  const m=document.createElement('div'); m.id='helpModal'; m.className='modal';
  m.innerHTML=`<div class="modalbox" role="dialog" aria-modal="true" aria-labelledby="helpTitle">
    <button type="button" class="modalx" aria-label="Close">X</button>
    <div class="verdict">${bigCat(0,'happy')}<div><h2 id="helpTitle">How to play Stock Shock</h2><p class="lead">You run a cat food warehouse for ${CFG.rounds} rounds. Make the most profit.</p></div></div>
    <ol class="helpsteps">
      <li><b>Cats come to buy.</b> Each round about 8 cats arrive (1 cat = 1 can = 100 units, so about 800 units). The news card tells you how many this round, and any problems with deliveries or prices.</li>
      <li><b>Each can you sell earns ${money(CFG.price-CFG.cost)} profit.</b> But every can still on the shelf at the end of a round costs ${money(CFG.holdPerUnit)} to store, and if the shelves run empty, hungry cats leave and those sales are lost.</li>
      <li><b>Set your buffer stock.</b> This is the minimum you want left on the shelves when a delivery arrives: your safety cans (outlined in green). The game works out your reorder level for you: when stock falls to it, you order.</li>
      <li><b>Set your reorder quantity.</b> This is how many cans you order each time. Orders take time to arrive (usually 1 round), and shocks can make them late.</li>
      <li><b>Choose a supplier, then press Run.</b> Watch the cats buy, then see your profit. Repeat for ${CFG.rounds} rounds.</li>

    <p class="helptip"><b>Tip:</b> a big buffer means fewer empty shelves but higher storage costs. That is the JIT or JIC choice.</p>
    <p><button type="button" class="primary" id="helpGo">Let's play</button></p></div>`;
  document.body.appendChild(m);
  const close=()=>{ try{ localStorage.setItem(HELP_KEY,'1'); }catch(e){} m.remove(); document.removeEventListener('keydown',esc1); if(back&&back.focus) back.focus(); };
  const esc1=(e)=>{ if(e.key==='Escape') close(); };
  m.querySelector('#helpGo').onclick=close; m.querySelector('.modalx').onclick=close;

  document.addEventListener('keydown',esc1);

}

/* ---------- term help: "?" buttons with a definition and an equation ---------- */
const TERMS={
  reorder:['Reorder level','The stock level that triggers a new order. When stock falls to it, you order.','Reorder level = buffer stock + (usage x lead time)'],
  buffer:['Buffer stock (safety stock)','The minimum stock you plan to keep (green cans), as protection against late deliveries and demand surges. Late deliveries eat into it; stock cannot go below 0.','Buffer stock = reorder level - (usage x lead time)'],
  qty:['Reorder quantity','How many units you order each time you reorder.','Maximum stock = buffer stock + reorder quantity'],
  usage:['Usage rate','How much stock is sold in a week. Normally 800 cans here.','Weeks of stock left = stock / usage'],
  lead:['Lead time (delivery time)','The time between placing an order and receiving it. Shocks can make it longer.','Delivery round = order round + lead time'],
  max:['Maximum stock level','The most stock you plan to hold, just after a delivery arrives.','Maximum stock = buffer stock + reorder quantity'],
  holding:['Storage (holding) costs','The cost of keeping stock: storage space, insurance and security, and money tied up that could be used elsewhere.','Storage costs = units left over x $1 a round'],
  stockout:['Stock-out','Customers want more than you have, so sales are lost.','Profit lost = lost sales x $8 per unit'],
  bulk:['Bulk-buying discount','A lower price per unit for big orders (purchasing economies of scale). An advantage of JIC.','Cost = quantity x $12 x 0.95 (orders of 2,000 or more)'],
  supplier:['Single or dual supplier','A single supplier is cheapest. A dual (second) supplier costs $500 a round but spreads the risk of supply shocks.','Dual: delays capped at +1 week, price rises halved'],
  suppliers:['Global or local supplier','Global suppliers are cheaper but further away, so lead times are longer and more exposed to shocks. Local suppliers cost more but are quicker and more reliable.','Global: $12 a can, 2 weeks. Local: $13 a can, 1 week'],
  ctm:['Cost to make vs cost to buy','Making your own has fixed costs plus a low cost per unit. Buying has no fixed cost but a higher price per unit.','CTM = fixed costs + (variable cost x quantity). CTB = price x quantity'],
  cu:['Capacity utilisation rate','How much of the maximum possible output is actually being used.','Capacity utilisation = (actual output / maximum output) x 100'],
  prod:['Productivity rate','How much output each worker produces.','Productivity = total output / number of workers'],
  chart:['Stock control chart','Shows stock over time: it falls as you sell and jumps up when a delivery arrives. The gap between ordering and delivery is the lead time.','Reorder level = buffer + (usage x lead time). Maximum stock = buffer + reorder quantity'],
  profit:['Revenue, costs and profit','Revenue is money from sales. Costs here are the cans sold, storage, fees, and cans that went off.','Revenue = units sold x $20. Profit = revenue - total costs'],
  jit:['Just in time (JIT)','Hold little or no buffer stock. Order so deliveries arrive just as stock is needed. Low storage costs, but risky if supply is disrupted.','Buffer about 0, so reorder level = usage x lead time'],
  jic:['Just in case (JIC)','Hold large buffer stocks in case of disruption or demand surges. Safe, but storage costs are high and stock can go off.','Large buffer: reorder level well above usage x lead time'],
};

(function(){
  const box=document.createElement('div'); box.className='tipbox'; box.setAttribute('role','tooltip'); box.hidden=true; document.body.appendChild(box);

  s+=`<line${id('ccRl')} x1="${L}" x2="${W-R}" y1="${y(o.rl)}" y2="${y(o.rl)}" stroke="#1f5fbf" stroke-width="2" stroke-dasharray="6 4"/><text${id('ccRlT')} x="${L+4}" y="${y(o.rl)-4}" font-size="11" font-weight="bold" fill="#1f5fbf">Reorder level ${units(o.rl)}</text>`;

  const jump=(i,q,top)=>`<text x="${x(i)+4}" y="${y(top)+12}" font-size="10" font-weight="bold" fill="#5b3d99">+${units(q)}</text>`;
  hist.forEach((h,i)=>{ if(h.arrivedQty>0) s+=jump(i,h.arrivedQty,h.startStock); });
  if(o.nowStock!=null&&o.arrNow) s+=jump(hist.length,o.arrNow,o.nowStock);

  let k=0; hist.forEach(h=>{ if(!h.ordered) return; const x1=x(h.round-1), x2=x(Math.min(n,h.ordered.arrive-1)), by=10+(k++%2)*11;

/* ---------- run animation ---------- */
function tween(el,from,to,ms,a){
  return new Promise(res=>{
    const t0=performance.now();
    const step=(now)=>{
      if(a.cancel) return res();
      const p=Math.min(1,(now-t0)/ms), e=p<.5?2*p*p:1-Math.pow(-2*p+2,2)/2;
      el.setAttribute('transform',`translate(${from[0]+(to[0]-from[0])*e},${from[1]+(to[1]-from[1])*e})`);
      if(p<1) requestAnimationFrame(step); else res();
    };
    requestAnimationFrame(step);
  });
}
function animView(h,crate){
  const late=h.ordered?h.ordered.delay>0:leadFor(h.lev,h.card,G.hard,h.built).delay>0;
  window.scrollTo(0,0);
  app.innerHTML=`
  <div class="animgrid">
    <div class="card stage bigscene"><div class="scenebox">${sceneSVG({stock:h.startStock,rl:h.lev.rl,buffer:h.lev.buf!=null?h.lev.buf:bufferFor(h.lev.rl,expLead(h.lev,G.hard,h.built)),moods:Array(nCats(h.demand)).fill('neutral'),crate,hold:0,late})}</div></div>
    <div class="animside">
      <div class="bar"><i style="width:${(h.round-1)/CFG.rounds*100}%"></i></div>
      ${cardView(h.card,h.round)}
      <div class="card"><p id="animMsg" class="animmsg" aria-live="polite"></p>
      <p><button class="ghost" id="skip">Skip animation</button></p></div>
    </div>
  </div>`;
}
// Driven only by the result object h from Engine.play.
async function runAnim(h,crate){
  app.classList.add('wide');
  animView(h,crate);
  const a=anim={cancel:false,done:false};
  const finish=()=>{ if(a.done) return; a.done=true; a.cancel=true; if(tab==='play'&&anim===a) render(); };
  $('#skip').onclick=finish;
  const STOP={}, wait=async(p)=>{ await p; if(a.cancel) throw STOP; };
  const sleep=(ms)=>new Promise(r=>setTimeout(r,ms));
  const msg=(t)=>{ $('#animMsg').textContent=t; };
  const sv=$('#scene'), cansG=$('#scCans'), fly=$('#scFly');
  try{
    // 1. Order
    const due=G.s.pipeline.find(o=>o.arrive>h.round);
    if(h.ordered){
      setCrate(`Order ${units(h.ordered.qty)}: arrives round ${h.ordered.arrive}`);
      await wait(tween($('#scTruck'),[-120,0],[0,0],700,a));
      msg(`Hit the reorder level: ordering ${units(h.ordered.qty)}`);
      await wait(sleep(1100));
    } else {
      setCrate(due?crateText(0,due):null);
      msg(due?'Order already on the way':'Above the reorder level: no order');
      await wait(sleep(700));
    }
    // 2. Customers
    const cats=[...sv.querySelectorAll('[data-cat]')], nc=cats.length, sad=sadCats(h), happy=nc-sad, per=Math.min(300,2400/nc);
    msg(`Cats want ${units(h.demand)}`);
    for(let j=0;j<happy;j++){
      const el=cats[j], [cx,cy]=catXY(j), want=nCans(h.startStock-h.sold*(j+1)/happy), flights=[];
      await wait(tween(el,[cx,cy],[cx,cy-8],per*.3,a));
      while(cansG.children.length>want){
        const c=cansG.lastElementChild, [x,y]=canPos(+c.getAttribute('data-can'));
        c.removeAttribute('data-can'); fly.appendChild(c);
        flights.push(tween(c,[x,y],[cx-11,cy-62],per*.5,a).then(()=>c.remove()));
      }
      await wait(Promise.all(flights));
      setMood(el,'happy');
      await wait(tween(el,[cx,cy-8],[cx,cy],per*.2,a));
    }
    while(cansG.children.length>nCans(h.endStock+h.spoiled)) cansG.lastElementChild.remove();
    if(sad){
      msg(`Shelves empty! ${units(h.lost)} sales lost`);
      const ps=[];
      for(let j=happy;j<nc;j++){ const el=cats[j], [cx,cy]=catXY(j); setMood(el,'sad'); ps.push(tween(el,[cx,cy],[cx+8,cy+4],600,a).then(()=>el.setAttribute('opacity','.55'))); }
      showLost(h);
      await wait(Promise.all(ps)); await wait(sleep(900));
    } else { msg(`All fed: ${units(h.sold)} sold`); await wait(sleep(500)); }
    // 3. Cans past their shelf life are thrown away
    if(h.spoiled>0){
      msg(`${units(h.spoiled)} cans went off: -${money(h.spoilCost)}`);
      const gone=[]; while(cansG.children.length>nCans(h.endStock)) gone.push(cansG.firstElementChild&&cansG.removeChild(cansG.lastElementChild));
      await wait(sleep(1300));
    }
    // 4. Storage cost
    if(h.endStock>0){
      msg(`${units(h.endStock)} left over: -${money(h.holding)} storage costs`);
      const coins=$('#scCoins'), left=cansG.children.length, ps=[];
      COINS.forEach((t,k)=>{
        const [x,y]=canPos(Math.floor((k+.5)*left/COINS.length)), from=[x+11,y+15];
        coins.insertAdjacentHTML('beforeend',coinSVG(t,...from));
        const el=coins.lastElementChild;
        ps.push(sleep(k*160).then(()=>tween(el,from,JAR[k],700,a)));
      });
      await wait(Promise.all(ps));
      $('#scHoldT').textContent='Storage costs '+money(h.holding);
      await wait(sleep(1000));
    } else { msg('Nothing left over: no storage costs'); await wait(sleep(800)); }
    finish();
  }catch(e){ if(e!==STOP) { finish(); throw e; } }
}

const OTHER_STYLE=[['#e07b39','6 3'],['#2a9d8f','10 3 2 3'],['#d65db1','2 3']];
async function rpLoadOthers(g){
  try{
    const data=await lbFetch(), me=g.name.trim().slice(0,24).toLowerCase();
    const rows=Object.values(data).map(lbCheck).filter(r=>r&&r.mode===g.mode&&r.hard===!!g.hard&&r.name.toLowerCase()!==me).sort((a,b)=>b.at-a.at);
    const seen=new Set(), pick=[];
    for(const r of rows){ const k=r.name.toLowerCase(); if(seen.has(k)) continue; seen.add(k); pick.push(r); if(pick.length===3) break; }
    if(!pick.length||G!==g||!rp||!rp.el.isConnected) return;
    const others=pick.map((r,k)=>({key:'o'+k,name:r.name,who:r.name,h:r.hist,col:OTHER_STYLE[k][0],w:2.5,dash:OTHER_STYLE[k][1],other:true}))
      .map(L=>({...L,stock:[CFG.startStock].concat(L.h.map(h=>h.endStock)),cum:[0].concat(L.h.map(h=>h.total))}));
    const lines=rp.lines.filter(L=>!L.other).concat(others), keep={t:rp.t,playing:rp.playing,hyb:rp.hyb,speed:rp.speed};
    rp.playing=false; rp.el.outerHTML=replayCard(lines); rpInit(lines,keep);
  }catch(e){}
}
function rpLoop(){
  const r=rp; if(r.raf) return;
  let last=null;
  const step=(now)=>{
    r.raf=null;
    if(rp!==r||!r.el.isConnected||!r.playing) return;
    if(last!=null) r.t=Math.min(CFG.rounds,r.t+(now-last)/1000*r.speed);
    last=now; rpDraw(r.t);
    if(r.t>=CFG.rounds){ r.playing=false; return; }
    r.raf=requestAnimationFrame(step);
  };
  r.raf=requestAnimationFrame(step);
}
function rpInit(lines,keep){
  const still=reduceMotion()||fastMode||!!window.__fast;
  rp={lines,el:$('#replay'),t:still?CFG.rounds:0,n:-1,playing:!still,speed:1,hyb:false,reduce:reduceMotion(),raf:null,...(keep||{})};
  if(keep){ $('#rpHyb').checked=rp.hyb; $('#rpSpeed').value=String(rp.speed); }
  rpDraw(rp.t);
  const play=()=>{ if(rp.t>=CFG.rounds){ rp.t=0; } rp.playing=true; rpLoop(); };
  $('#rpPlay').onclick=play;
  $('#rpPause').onclick=()=>{ rp.playing=false; };
  $('#rpRestart').onclick=()=>{ rp.t=0; rpDraw(0); play(); };
  $('#rpSpeed').onchange=()=>{ rp.speed=+$('#rpSpeed').value; };
  $('#rpHyb').onchange=()=>{ rp.hyb=$('#rpHyb').checked; rp.n=-1; rpDraw(rp.t); };
  $('#rpScrub').oninput=()=>{ rp.playing=false; rp.t=+$('#rpScrub').value; rpDraw(rp.t); };
  $('#rpAgain').onclick=()=>startGame(G.name,G.mode,G.seed);
  if(rp.playing) rpLoop();
}

// Where the story happens: a free side margin on wide screens, otherwise near the bottom right.
function walkSpot(){ const W=innerWidth, main=$('#app').getBoundingClientRect(), right=W-main.right; return Math.max(220,(right>=150?Math.round(main.right+right/2):Math.round(W-170))-130); }
function walkMark(){
  let m=document.getElementById('walkMark');
  if(!G||!G.mark||skipAnim()){ if(m) m.remove(); return null; }
  if(!m){ m=document.createElement('div'); m.id='walkMark'; m.className='walkmark'; document.body.appendChild(m); }
  if(m.dataset.k!==G.mark){ m.dataset.k=G.mark; m.innerHTML=`<div class="pop">${G.mark==='flower'?flowerSVG():G.mark==='poo'?pooSVG():smearSVG()}</div>`; }
  m.style.left=walkSpot()+'px';

}
// One chapter per walk: eat the flower, poo, slip on the poo, sniff the smear and turn back, jump the smear.
function catWalk(n){
  if(skipAnim()||document.querySelector('.walker')) return;
  const el=document.createElement('div'); el.className='walker'; el.innerHTML=walkerSVG(n); document.body.appendChild(el);
  const W=innerWidth, spot=walkSpot(), sleep=(ms)=>new Promise(r=>setTimeout(r,ms)), pace=(d)=>Math.max(900,Math.abs(d)*6);
  const pos={x:-130,y:0}, put=()=>{ el.style.transform=`translate(${pos.x}px,${-pos.y}px)`; };
  const move=(x,ms=pace(x-pos.x),hop=0)=>new Promise(res=>{ const x0=pos.x, t0=performance.now(); const f=(now)=>{ const p=Math.min(1,(now-t0)/ms); pos.x=x0+(x-x0)*p; pos.y=hop*4*p*(1-p); put(); if(p<1) requestAnimationFrame(f); else res(); }; requestAnimationFrame(f); });
  const say=(t)=>{ el.querySelector('.bubble').textContent=t; el.classList.toggle('say',!!t); };
  const stop=(on)=>el.classList.toggle('stop',on);
  const mark=(k)=>{ G.mark=k; walkMark(); };
  put();
  (async()=>{
    if(n===1){ await move(spot-100); stop(true); say('Nom nom!'); el.classList.add('eat'); await sleep(900); mark(null); await sleep(600); el.classList.remove('eat'); }
    else if(n===2){ await move(spot-12); stop(true); say('Pardon me!'); await sleep(800); mark('poo'); await sleep(1000); }
    else if(n===3){ await move(spot-70); say('Whoa!'); el.classList.add('slip'); await sleep(450); mark('smear'); await sleep(500); el.classList.remove('slip'); say('...nobody saw that.'); await move(spot+40,700); }
    else if(n===4){ await move(spot-105); stop(true); say('Sniff...'); el.classList.add('sniff'); await sleep(1500); el.classList.remove('sniff'); say('Eww!'); await sleep(500); el.classList.add('flip'); await sleep(300); say(''); stop(false); await move(-140); el.remove(); return; }
    else { await move(spot-150); say('Hup!'); await move(spot+40,700,70); }
    say(''); stop(false);
    await move(W+40);
    el.remove();
  })();
}

    </ul>
  </div>
  <div class="card"><h2>Key terms</h2>
    <ul class="q">
      <li>Buffer stock (safety stock): the extra stock you try to keep in the warehouse as insurance, on top of what you expect to sell. It is what stops a late delivery or a demand spike from causing a stock-out. It costs ${money(CFG.holdPerUnit)} per unit each week while it sits there.</li>
      <li>Reorder level: when your stock falls to this level, you place a new order. Reorder level = buffer stock + usage x lead time. You choose the buffer; the game works out the reorder level from your supplier's normal lead time. With usage of ${units(CFG.baseDemand)} a week and a ${CFG.baseLead} week lead time, a buffer of 400 needs a reorder level of 1,200. If a delivery is late, the extra wait is taken from your buffer, and once the buffer is used up you have a stock-out.</li>
      <li>Bulk discount: orders of ${units(Engine.RULES.bulkMin)} or more get ${Math.round(Engine.RULES.bulkDisc*100)}% off. Shelf life: cans still on the shelf after ${Engine.RULES.life} rounds go off and are thrown away.</li>

      <li>Reorder quantity: how many units you order each time. To build a buffer, order more than weekly demand.</li>

    $('#go').textContent=clash&&okName===k?'Start with this name':'Start round 1'; return clash; };
  if(window.fetch) lbFetch().then(d=>{ taken=new Set(Object.values(d).filter(o=>o&&typeof o.n==='string').map(o=>o.n.trim().slice(0,24).toLowerCase())); if($('#nm')) warnName(); }).catch(()=>{});
  $('#nm').oninput=()=>{ $('#nmMsg').textContent=''; okName=null; warnName(); };
  $('#priv').addEventListener('change',warnName);
  $('#go').onclick=()=>{
    if(!$('#nm').value.trim()){ $('#nmMsg').textContent='Type your name or team name to start.'; $('#nm').focus(); return; }
    if(warnName()&&okName!==nameKey()){ okName=nameKey(); warnName(); $('#nm').focus(); return; }
    lbPrivate=$('#priv').checked; gameOpts={hard:$('.world.lvl.sel').dataset.h==='1',quiz:$('#quizOn').checked}; const m=$('.world.sel:not(.lvl)').dataset.m; startGame($('#nm').value.trim(), m, 'ABC'.includes(m)?0:Math.floor(Math.random()*1e6)+1); };
}

function cardView(c, rn=G.s.round+1){
  const kind=c.tag==='calm'?'calmcard':'shock';
  const chips=[];
  if(c.demand!==CFG.baseDemand) chips.push(`<span class="chip">Demand ${units(c.demand)}</span>`);
  const hard=G&&G.hard;
  if(c.delay>0) chips.push(`<span class="chip">New orders +${c.delay} week${c.delay>1?'s':''} late (${hard?'local and own line: no delay':'dual: +'+Math.min(c.delay,1)})</span>`);
  if(c.priceMult>1) chips.push(`<span class="chip">New orders +${Math.round((c.priceMult-1)*100)}% price (${hard?'local':'dual'}: +${Math.round((c.priceMult-1)*50)}%)</span>`);
  if(!chips.length) chips.push(`<span class="chip g">No disruption</span>`);
  return `<div class="card news ${kind}"><h2>Round ${rn}: ${esc(c.title)}</h2>${chips.join('')}${c.link?`<p class="small" style="margin:6px 0 0">Article link: ${esc(c.link)}</p>`:''}</div>`;
}

function roundView(){
  const s=G.s, r=s.round+1, card=G.seq[r-1], lev=G.lev, hard=G.hard;
  const arrNow=s.pipeline.filter(o=>o.arrive<=r).reduce((a,o)=>a+o.qty,0);
  const due=s.pipeline.filter(o=>o.arrive>r);
  const demand=Math.max(0,card.demand-(hard?s.goodwill:0)), stockNow=s.onHand+arrNow;
  const sups=supsFor(hard), canBuild=hard&&r>=4&&!s.built, q=G.quiz&&G.qDone!==r?makeQuestion(r):null;
  if(hard&&!s.built&&!lev.build&&lev.sup===2) lev.sup=0;
  if(lev.buf==null) lev.buf=Math.max(0,lev.rl-USAGE*expLead(lev,hard,s.built));
  const pct=(r-1)/CFG.rounds*100;
  const supOpt=(k)=>{ const sp=sups[k], off=sp.cap&&!s.built&&!lev.build, sub=hard?(k===0?`$${sp.cost}, ${sp.lead} weeks, shocks`:k===1?`$${sp.cost}, 1 week, no delays`:`$${sp.cost} + ${money(sp.fixed)}/round${tip('ctm')}`):(k===0?'Cheapest':'Shocks hit half as hard');
    return `<div class="opt ${lev.sup===k?'sel':''}${off?' off':''}" data-d="${k}"><input type="radio" name="sp" ${lev.sup===k?'checked':''} ${off?'disabled':''}><div><b>${hard?['Global','Local','Make'][k]:(k===0?'Single':'Dual: '+money(CFG.dualFee))}</b><br><span class="small">${sub}</span>${k===2&&canBuild?`<br><button class="ghost mini" id="buildBtn">${lev.build?'Cancel build':'Build line'}</button>`:''}</div></div>`; };
  app.innerHTML=`
  <div class="roundgrid">
   <div class="colA">
    <div class="bar"><i style="width:${pct}%"></i></div>
    <div class="hud"><span class="pill">Round <b>${r}</b> of ${CFG.rounds}</span><span class="pill">Profit <b class="${cls(s.total)}">${money(s.total)}</b></span><span class="pill small">${esc(G.name)}, ${esc(Engine.SEQ_NAMES[G.mode])}${hard?', Hard':''}</span></div>
    ${cardView(card)}
    ${r===1?'<p class="coach">Drag the sliders and watch the shelves change. Then press Run.</p>':''}
      ${q?`<div class="quiz card" id="quiz"><b class="q">Quick question: ${money(Engine.RULES.quizBonus)} bonus if right</b><div class="qt">${q.text}</div>
        ${q.choices?`<div class="qch">${q.choices.map((c,i)=>`<button class="ghost qopt" data-i="${i}">${esc(c)}</button>`).join('')}</div>`:`<div class="row"><input id="qa" type="text" inputmode="decimal" autocomplete="off" placeholder="Your answer"><button class="ghost" id="qcheck">Check</button></div>`}<div class="fb" id="qfb"></div></div>`:''}
   </div>
    <div class="card stage colB">
      <div class="scenebox">${sceneSVG({stock:stockNow,rl:lev.rl,buffer:0,moods:Array(nCats(demand)).fill('neutral'),crate:crateText(arrNow,due[0]),late:card.delay>0})}</div>
      <div class="facts"><span>In stock <b>${units(stockNow)}</b>${arrNow?` (${units(arrNow)} just delivered)`:''}</span><span>Cats want${tip('usage')} <b>${units(demand)}</b>${hard&&s.goodwill?` <span class="x">(down ${units(s.goodwill)}: unhappy cats from last round)</span>`:''}</span><span>On order <b>${due.length?units(due[0].qty)+' (round '+due[0].arrive+')':'none'}</b></span>${s.built?`<span>Canning line <b>built</b></span>`:''}</div>
      <p class="hint">1 can = 100 units. 1 cat wants 100. Cans go off after ${Engine.RULES.life} rounds on the shelf.</p>
      <label class="small inl"><input type="checkbox" id="th" ${G.showTheory?'checked':''}> Show charts</label>
      <div id="chartBox" class="${G.showTheory?'':'hidden'}"><h3 class="charth">Stock control chart${tip('chart')}</h3>${stockControlChart(s.history,{rl:lev.rl,buffer:0,qty:lev.qty,nowStock:stockNow,arrNow,live:true})}
        <h3 class="charth">Revenue, costs and profit each round${tip('profit')}</h3>${profitChart(s.history)}</div>
    </div>
    <div class="card todo levers">
      <label for="bf">Target buffer stock: <span class="out" id="bfv"></span>${tip('buffer')}</label>
      <input id="bf" type="range" min="0" max="3200" step="200" value="${lev.buf}">
      <div id="rlcalc" class="rlcalc"></div>
      <div id="bfo" class="bufout"></div>
      <label for="qy">Reorder quantity: <span class="out" id="qyo"></span>${tip('qty')}</label>
      <input id="qy" type="range" min="0" max="4000" step="200" value="${lev.qty}">
      <div class="hint">Cans per order. ${units(Engine.RULES.bulkMin)} or more: ${Math.round(Engine.RULES.bulkDisc*100)}% bulk discount.${tip('bulk')}</div>
      <label>Supplier${tip(hard?'suppliers':'supplier')}</label>
      <div class="optrow${hard?' three':''}">${sups.map((_,k)=>supOpt(k)).join('')}</div>
      <div id="prev" class="forecast"></div>
      <div class="runrow"><button class="primary" id="run" ${q?'disabled':''}>${q?'Answer the question first':'Run round '+r}</button><label class="small inl"><input type="checkbox" id="fast" ${fastMode?'checked':''}> Fast mode (no animation)</label></div>
    </div>
  </div>`;
  const upd=()=>{
    lev.buf=+$('#bf').value; lev.qty=+$('#qy').value;
    const L0=expLead(lev,hard,s.built), L=leadFor(lev,card,hard,s.built), buffer=lev.buf, wk=(n)=>n+' week'+(n>1?'s':'');
    lev.rl=planRl(lev,hard,s.built);
    $('#bfv').textContent=units(lev.buf); $('#qyo').textContent=units(lev.qty);
    $('#rlcalc').innerHTML=`Reorder level${tip('reorder')} <span class="eqn">= ${units(lev.buf)} + ${units(USAGE)} x ${wk(L0)} = ${units(lev.rl)}</span><div class="small">buffer + usage x lead time</div>`;
    // a delay this round: the extra wait eats into the buffer (stock never goes below 0)
    const extra=USAGE*(L.lead-L0), ordering=stockNow<=lev.rl&&!s.pipeline.some(o=>o.arrive>r)&&lev.qty>0;
    $('#bfo').className='bufout'+(ordering&&extra>buffer?' x':'');
    $('#bfo').innerHTML=extra<=0?'':!ordering?`Orders placed this round take ${wk(L.lead)}, not ${L0}, but you are not ordering this round.`:`Your order this round takes ${wk(L.lead)}, not ${L0}. You will sell ${units(extra)} more while you wait: `+(extra<=buffer?`that uses <b>${units(extra)}</b> of your ${units(buffer)} buffer.`:`your ${units(buffer)} buffer will be used up and you will be <b>${units(extra-buffer)} short</b>.`);
    const out=s.pipeline.filter(o=>o.arrive>r).length>0;
    const sold=Math.min(demand,stockNow), lostU=demand-sold;
    let t='';
    t+=lostU?`<span class="x">X Stock-out: sell ${units(sold)}, lose ${units(lostU)}</span>${tip('stockout')}<br>`:`Yes: all ${units(demand)} sold<br>`;
    if(out) t+='Order: one is already on the way';
    else if(stockNow<=lev.rl){
      let qq=Math.min(lev.qty,CFG.cap-stockNow); if(L.sp.cap) qq=Math.min(qq,L.sp.cap);
      const bulk=!L.sp.cap&&qq>=Engine.RULES.bulkMin;
      if(lev.qty===0) t+='Order: none (reorder quantity is 0)';
      else t+= qq>0 ? `Order: <b>${units(qq)}</b> now, arrives round <b>${r+L.lead}</b>${lev.qty>qq?(L.sp.cap&&qq===L.sp.cap?' (line capacity)':' (shelves full)'):''}${bulk?' with bulk discount':''}` : 'Order: none, shelves are full';
    } else t+=`Order: none (stock ${units(stockNow)} is above your reorder level ${units(lev.rl)})`;
    $('#prev').innerHTML=`<div class="ltime${L.delay?' late':''}" id="lt"><svg viewBox="0 0 22 20" width="22" height="20" aria-hidden="true"><rect width="22" height="20" rx="2" fill="#c89b5e" stroke="#6b4a22" stroke-width="1.5"/><path d="M1 1 L21 19 M21 1 L1 19" stroke="#6b4a22"/></svg><span>Delivery time${tip('lead')}: <b>${L.lead} round${L.lead>1?'s':''}</b>${L.delay?` <span class="x">(${L.delay} late)</span>`:''}</span></div>`+t;
    G.lev=lev; ccUpdate(lev.rl,buffer,lev.qty); sceneLevers(lev.rl,buffer);
  };
  $('#bf').oninput=upd; $('#qy').oninput=upd; upd();
  if(G.mark===undefined) G.mark='flower';
  walkMark();
  if(r%2===0&&!skipAnim()){ G.walks=G.walks||{}; if(!G.walks[r]){ G.walks[r]=1; setTimeout(()=>catWalk(r/2),900); } }
  if(arrNow>0&&!skipAnim()){
    const a={cancel:false}, from=nCans(s.onHand), to=nCans(stockNow), gap=Math.min(60,700/Math.max(1,to-from));
    tween($('#scTruck'),[-120,0],[0,0],600,a);
    for(let i=from;i<to;i++){
      const el=document.querySelector(`#scene [data-can="${i}"]`), [x,y]=canPos(i);
      el.setAttribute('transform',`translate(${x},${y-240})`);
      setTimeout(()=>tween(el,[x,y-240],[x,y],450,a),650+(i-from)*gap);
    }
  }
  document.querySelectorAll('.opt').forEach(el=>el.onclick=()=>{
    if(el.classList.contains('off')) return;
    lev.sup=+el.dataset.d;
    document.querySelectorAll('.opt').forEach(o=>{o.classList.toggle('sel',o===el);o.querySelector('input').checked=(o===el);});
    upd();
  });
  // Building the canning line (Hard, from round 4): the Make card's button unlocks and selects it.
  if(canBuild) $('#buildBtn').onclick=(e)=>{
    e.stopPropagation();
    lev.build=!lev.build; lev.sup=lev.build?2:0; G.lev=lev;
    const mk=document.querySelector('.opt[data-d="2"]'); mk.classList.toggle('off',!lev.build); mk.querySelector('input').disabled=!lev.build;
    document.querySelectorAll('.opt').forEach(o=>{ const on=+o.dataset.d===lev.sup; o.classList.toggle('sel',on); o.querySelector('input').checked=on; });
    $('#buildBtn').textContent=lev.build?'Cancel build':'Build line'; upd(); };
  if(q){
    const done=(ok)=>{ G.quizLog.push({r,ok}); G.qDone=r; G.qOk=ok?r:null; $('#run').disabled=false; $('#run').textContent='Run round '+r;
      document.querySelectorAll('#quiz input,#quiz button').forEach(el=>el.disabled=true);
      $('#qfb').className='fb '+(ok?'ok':'no'); $('#qfb').innerHTML=(ok?`Correct! +${money(Engine.RULES.quizBonus)} bonus. `:'Not quite. ')+q.working; };
    if(q.choices) document.querySelectorAll('.qopt').forEach(b=>b.onclick=()=>{ const i=+b.dataset.i;
      b.classList.add(i===q.answer?'right':'wrong'); document.querySelector(`.qopt[data-i="${q.answer}"]`).classList.add('right'); done(i===q.answer); });
    else {
      $('#qcheck').onclick=()=>{ const v=parseFloat($('#qa').value.replace(/[$,%\s]/g,'')); done(Math.abs(v-q.answer)<0.5); };
      $('#qa').onkeydown=(e)=>{ if(e.key==='Enter') $('#qcheck').click(); };
    }
    window.__qa=()=>q.answer; window.__qmc=()=>!!q.choices;
  } else { window.__qa=()=>null; window.__qmc=()=>false; }
  $('#th').onchange=()=>{G.showTheory=$('#th').checked; $('#chartBox').classList.toggle('hidden',!G.showTheory);};
  $('#fast').onchange=()=>{fastMode=$('#fast').checked;};
  $('#run').onclick=()=>{
    if($('#run').disabled) return;
    const crate=crateText(arrNow,due[0]);
    G.last=Engine.play2(G.s,{...G.lev,bonus:G.qOk===r},card,rules()); G.view='result';
    G.lev.build=false;
    if(skipAnim()) render(); else runAnim(G.last,crate);
  };
}
// Quick questions before some rounds (can be switched off at the start).
// Quick questions before rounds 2, 5 and 8 (and 4 on Hard). Each is picked at random from a bank, never repeating
// in a game. Numeric questions are typed; concept questions have two or three buttons.
function makeQuestion(r){
  const s=G.s, card=G.seq[r-1], lev=G.lev, sups=supsFor(G.hard), line=sups[2], disc=Engine.RULES.bulkDisc;
  const L=expLead({...lev,sup:G.hard?0:lev.sup},G.hard,s.built), wk=(n)=>n+' week'+(n>1?'s':'');
  const rnd=Engine.rng((G.seed||1)*97+r*13+G.quizLog.length), pick=(a)=>a[Math.floor(rnd()*a.length)];
  const num=(id,text,answer,working)=>({id,text,answer,working});
  const mcq=(id,text,choices,answer,working)=>({id,text,choices,answer,working});
  const bank=[
    ()=>{ const b=pick([400,800,1200]); return num('rl',`Usage is ${units(USAGE)} cans a week and the lead time is ${wk(L)}. You want ${units(b)} buffer stock left when each delivery arrives. At what stock level should you place an order (the reorder level)?`,b+USAGE*L,`Reorder level = buffer + usage x delivery time = ${units(b)} + ${units(USAGE)} x ${L} = ${units(b+USAGE*L)}.`); },
    ()=>{ const b=lev.buf, d=pick([1,2]), use=USAGE*d;
      if(use<=b) return num('use',`Your buffer stock is ${units(b)} and you sell ${units(USAGE)} a week. You ordered at your reorder level, so sales during the normal lead time are covered. The delivery arrives ${wk(d)} late. How much of your buffer do you use while you wait?`,use,`Extra wait x usage = ${d} x ${units(USAGE)} = ${units(use)}, taken from the ${units(b)} buffer (${units(b-use)} left).`);
      return num('short',`Your buffer stock is ${units(b)} and you sell ${units(USAGE)} a week. You ordered at your reorder level, so sales during the normal lead time are covered. The delivery arrives ${wk(d)} late. How many sales will you miss?`,use-b,`The late wait needs ${d} x ${units(USAGE)} = ${units(use)}. The buffer covers ${units(b)}, then stock hits 0: ${units(use)} - ${units(b)} = ${units(use-b)} sales missed. Stock never goes below 0.`); },
    ()=>{ const l=pick([1,2,3]); return num('arrive',`You place an order in round ${r} and the delivery time is ${wk(l)}. In which round does it arrive?`,r+l,`Round ${r} + ${l} = round ${r+l}.`); },
    ()=>{ const b=pick([400,800,1200]), q=pick([1200,1600,2000]); return num('max',`Your buffer stock is ${units(b)} and your reorder quantity is ${units(q)}. Each delivery arrives just as stock falls to the buffer. What is the maximum stock level?`,b+q,`Maximum stock = buffer + reorder quantity = ${units(b)} + ${units(q)} = ${units(b+q)}.`); },
    ()=>{ const n=pick([1200,1800,2600,3400]); return num('store',`${units(n)} units are left on the shelves at the end of a round. Storage costs ${money(CFG.holdPerUnit)} a unit. What is the storage cost?`,n*CFG.holdPerUnit,`${units(n)} x ${money(CFG.holdPerUnit)} = ${money(n*CFG.holdPerUnit)}.`); },
    ()=>{ const d=pick([1100,1200]), h=pick([600,800]), m=CFG.price-CFG.cost; return num('lost',`Cats want ${units(d)} cans but you only have ${units(h)}. Each sale earns $${m} profit. How much profit do you lose to the stock-out?`,(d-h)*m,`Lost sales = ${units(d)} - ${units(h)} = ${units(d-h)}. ${units(d-h)} x $${m} = ${money((d-h)*m)}.`); },
    ()=>{ const n=pick([1600,2400,3200]); return num('cover',`You have ${units(n)} cans and sell ${units(USAGE)} a week, with no deliveries arriving. How many weeks will they last?`,n/USAGE,`${units(n)} / ${units(USAGE)} = ${n/USAGE} weeks.`); },
    ()=>{ const q=pick([2000,2400,3200]), tot=q*CFG.cost*(1-disc); return num('bulk',`You order ${units(q)} cans at $${CFG.cost} each and get a ${Math.round(disc*100)}% bulk discount. What is the total cost?`,tot,`${units(q)} x $${CFG.cost} = ${money(q*CFG.cost)}. Minus ${Math.round(disc*100)}%: ${money(q*CFG.cost)} x ${1-disc} = ${money(tot)}.`); },
    ()=>{ const n=pick([600,800,1100]); return num('rev',`You sell ${units(n)} cans at ${money(CFG.price)} each. What is the revenue?`,n*CFG.price,`${units(n)} x ${money(CFG.price)} = ${money(n*CFG.price)}.`); },
    ()=>{ const rev=16000, cogs=9600, st=pick([400,1200,2000]); return num('profit',`This round: revenue ${money(rev)}, cost of cans sold ${money(cogs)}, storage costs ${money(st)}. There are no other costs. What is the profit?`,rev-cogs-st,`${money(rev)} - ${money(cogs)} - ${money(st)} = ${money(rev-cogs-st)}.`); },
    ()=>{ const a=1, b=pick([2,3]); return num('rise',`Usage is ${units(USAGE)} a week. The delivery time rises from ${a} week to ${b} weeks. How much higher should the reorder level be to keep the same buffer?`,USAGE*(b-a),`The extra wait is ${b-a} week${b-a>1?'s':''}: ${units(USAGE)} x ${b-a} = ${units(USAGE*(b-a))} more.`); },
    ()=>mcq('jit','Which approach keeps almost no buffer stock?',['Just in time (JIT)','Just in case (JIC)'],0,'JIT orders stock to arrive just as it is needed, so very little sits on the shelves.'),
    ()=>mcq('lane','A shipping lane closes and deliveries will be 3 weeks late. Which approach copes better?',['Just in time (JIT)','Just in case (JIC)'],1,'JIC holds a large buffer, so it can keep selling while deliveries are late.'),
    ()=>mcq('holdcost','Which of these is a cost of holding stock?',['Storage and insurance','Lost sales from a stock-out','The price customers pay'],0,'Holding stock costs money for storage, insurance and security, and ties up cash (opportunity cost).'),
    ()=>mcq('low','Your reorder level is lower than usage x lead time, and you order when stock falls to it. What will happen?',['You run out before the delivery arrives','You end up with too much stock','Nothing changes'],0,'You sell more while you wait than the reorder level covers, so the shelves empty before the delivery comes.'),
    ()=>mcq('lead','What does lead time mean?',['The wait between ordering stock and receiving it','How long stock sits on the shelf','How long a round lasts'],0,'Lead time is the time between placing an order and the delivery arriving.'),
    ()=>mcq('jitadv','Which is an advantage of JIT?',['Low storage costs','Bulk-buying discounts','Protection against supply delays'],0,'JIT holds little stock, so storage costs are low. Bulk discounts and protection from delays are JIC advantages.'),
    ()=>mcq('jicadv','Which is an advantage of JIC?',['Fewer stock-outs when demand surges','Less money tied up in stock','No cans going off'],0,'A big buffer means you can meet sudden demand. The downsides are cash tied up in stock and cans going off.'),
    ()=>mcq('buffer','What is buffer stock for?',['Covering late deliveries and demand surges','Getting a bulk discount','Lowering storage costs'],0,'Buffer (safety) stock is kept as insurance against delays and unexpected demand.'),
  ];
  const hardBank=[
    ()=>{ const q=pick([600,800,1000]); return num('ctm',`A canning line costs ${money(line.fixed)} a round plus $${line.cost} a can. What is the cost to make ${units(q)} cans in a round?`,line.fixed+line.cost*q,`Cost to make = fixed cost + variable cost x quantity = ${money(line.fixed)} + $${line.cost} x ${units(q)} = ${money(line.fixed+line.cost*q)}.`); },
    ()=>{ const q=pick([600,800,1000]); return num('ctb',`The local supplier charges $${sups[1].cost} a can. What is the cost to buy ${units(q)} cans locally?`,sups[1].cost*q,`Cost to buy = price x quantity = $${sups[1].cost} x ${units(q)} = ${money(sups[1].cost*q)}.`); },
    ()=>num('be',`Making costs ${money(line.fixed)} a round plus $${line.cost} a can. Buying from the global supplier costs $${sups[0].cost} a can. Above how many cans a round is making cheaper?`,line.fixed/(sups[0].cost-line.cost),`Each can made saves $${sups[0].cost} - $${line.cost} = $${sups[0].cost-line.cost}. ${money(line.fixed)} / $${sups[0].cost-line.cost} = ${units(line.fixed/(sups[0].cost-line.cost))} cans.`),
    ()=>mcq('local','Why might a local supplier suit JIT better than a global one?',['Shorter, more reliable delivery times','Lower prices per can','Bigger bulk discounts'],0,'JIT needs deliveries to arrive exactly when expected, and local suppliers are nearer and less exposed to shipping shocks.'),
  ];
  const lineBank=[
    ()=>{ const m=pick([600,800,900]); return num('cu',`Your canning line can make ${units(line.cap)} cans a round. This round it makes ${units(m)}. What is the capacity utilisation rate (%)?`,m/line.cap*100,`Capacity utilisation = actual output / maximum output x 100 = ${units(m)} / ${units(line.cap)} x 100 = ${m/line.cap*100}%.`); },
    ()=>{ const m=pick([600,800,1000]); return num('prod',`Your canning line made ${units(m)} cans this round with ${line.workers} workers. What is the productivity (cans per worker)?`,m/line.workers,`Productivity = output / number of workers = ${units(m)} / ${line.workers} = ${units(m/line.workers)}.`); },
  ];
  let pool=bank;
  if(G.hard&&r===4&&!s.built) pool=hardBank;
  else if(G.hard&&s.built&&r===8) pool=lineBank;
  else if(G.hard) pool=bank.concat(hardBank);
  if(!(r===2||r===5||r===8||(G.hard&&r===4))) return null;
  G.qUsed=G.qUsed||[];
  const fresh=pool.map(f=>f()).filter(q=>!G.qUsed.includes(q.id));
  const q=fresh.length?fresh[Math.floor(rnd()*fresh.length)]:pool[0]();
  G.qUsed.push(q.id);
  return q;
}

function resultView(){
  const h=G.last, last=h.round===CFG.rounds, pct=h.round/CFG.rounds*100;
  const due=G.s.pipeline.find(o=>o.arrive>h.round), L=leadFor(h.lev,h.card,G.hard,h.built), line=Engine.RULES.hard[2];
  app.innerHTML=`
  <div class="bar"><i style="width:${pct}%"></i></div>
  <div class="hud"><span class="pill">Round <b>${h.round}</b> of ${CFG.rounds}: ${esc(h.card.title)}</span></div>
  <div class="two">
  <div class="card ${h.stockout?'shock':'calmcard'}">

// Score code: base64 JSON. Rules version 2 adds v:2 and x (1 = Hard); h holds [reorder level, quantity, supplier, built this round].
// Codes without v use the original rules, with h as [buffer, quantity, dual].
const levCode=(l)=>[l.rl,l.qty,l.sup,l.build?1:0,l.bonus?1:0];
function encode(g){
  const o={n:g.name,m:g.mode,d:g.seed,t:Math.round(g.s.total),v:2,x:g.hard?1:0,h:g.s.history.map(h=>levCode(h.lev))};
  return btoa(unescape(encodeURIComponent(JSON.stringify(o))));
}
function codeRun(o){
  const seq=Engine.seqFor(o.m,o.d);
  if(o.v===2) return Engine.run(seq,(i)=>({rl:o.h[i][0],qty:o.h[i][1],sup:o.h[i][2],build:!!o.h[i][3],bonus:!!o.h[i][4]}),{v:2,hard:!!o.x});
  return Engine.run(seq,(i)=>({buffer:o.h[i][0],qty:o.h[i][1],dual:!!o.h[i][2]}));
}
function decode(code){
  try{
    const o=JSON.parse(decodeURIComponent(escape(atob(code.trim()))));
    const st=codeRun(o); let c=0; const cum=st.history.map(h=>c+=h.profit);
    const rlOf=(x)=>o.v===2?x[0]:Engine.reorderLevel(x[0]);
    return {name:o.n,mode:o.m,seed:o.d,hard:!!o.x,v:o.v||1,total:st.total,cum,stockouts:st.history.filter(h=>h.stockout).length,dualRounds:o.h.filter(x=>x[2]).length,avgRl:o.h.reduce((a,x)=>a+rlOf(x),0)/o.h.length,holding:st.history.reduce((a,h)=>a+h.holding,0),lost:st.history.reduce((a,h)=>a+h.lostProfit,0),claimed:o.t};
  }catch(e){ return null; }
}

const shockCard=(c)=>c.delay>0||c.priceMult>1;
// Fixed strategies for comparison. Hard: JIT relies on the local supplier, JIC on cheap global bulk orders.
function benchLevers(hard){
  return hard?[
    {name:'Pure JIT: reorder level 800, order 800, local supplier',lev:{rl:800,qty:800,sup:1},lead:1},
    {name:'Pure JIC: buffer 2,000 (reorder level 3,600), order 2,400, global supplier',lev:{rl:3600,qty:2400,sup:0},lead:2},
    {name:'Hybrid: reorder level 2,000, order 1,600, local supplier only on shock rounds',fn:(seq)=>(i)=>({rl:2000,qty:1600,sup:shockCard(seq[i])?1:0})},
  ]:[
    {name:'Pure JIT: reorder level 800, order 800, single supplier',lev:{rl:800,qty:800,sup:0},lead:1},
    {name:'Pure JIC: buffer 2,000 (reorder level 2,800), orders enough to fill the shelves, single supplier',lev:{rl:2800,qty:4000,sup:0},lead:1},
    {name:'Hybrid: reorder level 1,600, order 1,200, dual supplier only on shock rounds',fn:(seq)=>(i)=>({rl:1600,qty:1200,sup:shockCard(seq[i])?1:0})},
  ];
}
function benchmarks(seq,hard=G.hard){
  return benchLevers(hard).map(b=>{ const s=Engine.run(seq,b.fn?b.fn(seq):b.lev,{v:2,hard}); return {name:b.name,total:s.total,s,b}; });
}

function strategyCard(bm){
  const sum=(st)=>{ const H=st.history; return `<div class="facts"><span>Profit <b>${money(st.total)}</b></span><span>Stock-out rounds <b>${H.filter(h=>h.stockout).length}</b></span><span>Storage costs <b>${money(H.reduce((a,h)=>a+h.holding,0))}</b></span>${H.some(h=>h.spoiled)?`<span>Cans gone off <b>${units(H.reduce((a,h)=>a+h.spoiled,0))}</b></span>`:''}</div>`; };
  const chart=(b)=>stockControlChart(b.s.history,{rl:b.b.lev.rl,buffer:bufferFor(b.b.lev.rl,b.b.lead),qty:b.b.lev.qty});
  const jit=G.hard?`Reorder level 800, order 800, local supplier. With a 1-week delivery time that leaves no buffer: it orders exactly one week's demand every round, which arrives just in time and sells out. Nothing to store, but local cans cost more, and a demand surge empties the shelves.`
    :`Reorder level 800, order 800, single supplier. With a 1-week delivery time that leaves no buffer: it orders exactly one week's demand every round. It arrives just in time, sells out, and leaves nothing to store. Perfect in calm weeks, but any delay or demand surge empties the shelves.`;
  const jic=G.hard?`Buffer 2,000 (20 cans). With the global supplier's 2-week lead time, the reorder level is 2,000 + 800 x 2 = 3,600. It orders 2,400 at a time, buying cheap in bulk. Stock stays high, so it rarely runs out, but it pays to store a big pile and some cans go off.`
    :`Buffer 2,000 (20 cans), so the reorder level is 2,000 + 800 x 1 week = 2,800. When stock falls to it, it orders enough to fill the shelves (with the bulk discount), so stock swings between about 3,200 and 1,600. It rarely runs out, but pays to store a big pile every round, and old cans can go off.`;
  return `<div class="card"><h2>How JIT and JIC played your shocks</h2>
    <div class="stratgrid">
      <div><h3>Pure JIT (just in time)${tip('jit')}</h3>${chart(bm[0])}<p>${jit}</p>${sum(bm[0].s)}</div>
      <div><h3>Pure JIC (just in case)${tip('jic')}</h3>${chart(bm[1])}<p>${jic}</p>${sum(bm[1].s)}</div>
    </div></div>`;
}

async function lbAdmin(){
  const box=()=>$('#lbAdmin');
