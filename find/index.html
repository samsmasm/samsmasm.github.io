<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Answer a few questions and land on the right unisam.nz tool.">
<title>Find a tool · unisam.nz</title>
<link rel="icon" type="image/jpeg" href="/unisamicon.jpg">
<style>
  /* unisam.nz: Find sub-page (see AESTHETIC.md). Tools purple. */
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: #fff; color: #1a1a1a; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; min-height: 100vh; }
  a { color: inherit; text-decoration: none; }
  button { font: inherit; background: none; border: none; cursor: pointer; color: inherit; }

  .wrap { max-width: 1100px; margin: 0 auto; padding: 0 40px; }
  .narrow { max-width: 760px; }

  /* ── Header ── */
  .site-header {
    background:
      radial-gradient(ellipse at 8% 40%, #e8d6ff 0%, transparent 50%),
      radial-gradient(ellipse at 28% 85%, #d6ffe8 0%, transparent 45%),
      radial-gradient(ellipse at 52% 20%, #d6f0ff 0%, transparent 42%),
      radial-gradient(ellipse at 74% 70%, #fff3d6 0%, transparent 45%),
      radial-gradient(ellipse at 94% 30%, #ffd6e7 0%, transparent 40%),
      radial-gradient(ellipse at 50% 50%, #ece0ff 0%, transparent 60%),
      #f5f0ff;
  }
  .site-header .wrap { padding-top: 22px; padding-bottom: 18px; display: flex; align-items: center; justify-content: space-between; gap: 24px; }
  .logo { display: flex; align-items: center; gap: 14px; }
  .logo img { width: 60px; height: 60px; border-radius: 14px; object-fit: cover; flex-shrink: 0; background: rgba(255,255,255,0.55); border: 1.5px solid rgba(255,255,255,0.85); }
  .logo__name { font-family: Georgia, 'Times New Roman', serif; font-size: 25px; letter-spacing: -0.5px; color: #2d1a4a; line-height: 1.1; display: block; }
  .logo__tagline { font-size: 12.5px; color: #6b4d8a; margin-top: 3px; display: block; }
  .nav { display: flex; align-items: stretch; flex-wrap: wrap; }
  .nav a { padding: 0.7rem 1.05rem; font-size: 13px; font-weight: 500; color: #666; border-bottom: 3px solid transparent; white-space: nowrap; }
  .nav a:hover { color: #2d1a4a; }
  .nav a.is-active { color: #4a1a7a; border-bottom-color: #4a1a7a; }

  /* ── Main ── */
  .main { padding-top: 36px; padding-bottom: 64px; }
  .page-label { border-top: 3px solid #4a1a7a; padding-top: 8px; margin-bottom: 4px; font-size: 10px; font-weight: 600; letter-spacing: 0.16em; text-transform: uppercase; color: #4a1a7a; display: inline-block; }

  /* Breadcrumb trail of answers so far */
  .trail { font-size: 13px; color: #8a6fb0; line-height: 1.7; margin-top: 2px; min-height: 22px; }
  .trail a { color: #8a6fb0; text-decoration: underline; text-underline-offset: 3px; }
  .trail a:hover { color: #4a1a7a; }
  .trail .sep { color: #cbb8e3; margin: 0 6px; }
  .trail .here { color: #4a1a7a; }

  .question { font-family: Georgia, 'Times New Roman', serif; font-weight: normal; font-size: 30px; line-height: 1.2; color: #2d1a4a; margin: 14px 0 18px; }

  /* Options: ruled editorial rows, no boxes */
  .opt { display: grid; grid-template-columns: 1fr auto; gap: 2px 18px; align-items: baseline; padding: 14px 2px; border-bottom: 1px solid #f0e8ff; }
  .opt:first-child { border-top: 1px solid #f0e8ff; }
  .opt-label { font-family: Georgia, 'Times New Roman', serif; font-size: 19px; color: #4a1a7a; }
  .opt-hint { grid-column: 1; font-size: 13px; color: #7a7a7a; line-height: 1.45; }
  .opt-count { grid-row: 1; grid-column: 2; font-size: 12px; color: #b3a6c4; white-space: nowrap; }
  .opt:hover .opt-label { text-decoration: underline; text-underline-offset: 4px; }
  .opt:hover .opt-count { color: #4a1a7a; }

  .back-row { margin-top: 18px; display: flex; gap: 20px; flex-wrap: wrap; }
  .linkish { font-size: 13px; color: #8a6fb0; text-decoration: underline; text-underline-offset: 3px; white-space: nowrap; }
  .linkish:hover { color: #4a1a7a; }
  a:focus-visible, button:focus-visible, input:focus-visible { outline: 2px solid #b48be0; outline-offset: 2px; }

  /* Tool rows (end of a path, search results, reminders) */
  .tool-row { display: grid; grid-template-columns: 210px 1fr; gap: 4px 22px; padding: 13px 2px; border-bottom: 1px solid #f0e8ff; align-items: baseline; }
  .tool-row:first-child { border-top: 1px solid #f0e8ff; }
  .tool-name { font-family: Georgia, 'Times New Roman', serif; font-size: 18px; color: var(--c); }
  .tool-row:hover .tool-name { text-decoration: underline; text-underline-offset: 4px; }
  .tool-desc { font-size: 13.5px; line-height: 1.5; color: #6b6b6b; }
  .small .tool-name { font-size: 15px; }
  .small .tool-desc { font-size: 13px; }

  .section-head { margin-top: 44px; border-top: 3px solid #4a1a7a; padding-top: 8px; margin-bottom: 8px; font-size: 11px; font-weight: 600; letter-spacing: 0.14em; text-transform: uppercase; color: #4a1a7a; display: flex; justify-content: space-between; gap: 12px; align-items: baseline; }
  .section-head .linkish { text-transform: none; letter-spacing: 0; font-weight: 400; font-size: 12.5px; }

  .search { width: 100%; font: inherit; font-size: 16px; padding: 6px 2px; border: none; border-bottom: 1.5px solid #d0b6f5; outline: none; background: transparent; color: #1a1a1a; }
  .search::placeholder { color: #b3a6c4; }
  .empty { padding: 14px 2px; font-size: 14px; color: #6b6b6b; }

  .site-footer { border-top: 1px solid #f0e8ff; padding: 16px 0 22px; margin-top: 8px; }
  .site-footer .wrap { font-size: 11px; color: #bbb; }

  @media (max-width: 820px) {
    .wrap { padding: 0 16px; }
    .site-header .wrap { flex-direction: column; align-items: flex-start; gap: 14px; }
  }
  @media (max-width: 600px) {
    .question { font-size: 25px; }
    .tool-row { grid-template-columns: 1fr; gap: 3px; }
  }
</style>
</head>
<body>

  <header class="site-header">
    <div class="wrap">
      <a class="logo" href="/">
        <img src="/geocornsmall.png" alt="unisam logo">
        <span>
          <span class="logo__name">unisam.nz</span>
          <span class="logo__tagline">IB Economics &middot; Business Management &middot; Foundations of the Modern World</span>
        </span>
      </a>
      <nav class="nav">
        <a href="/">This week</a>
        <a href="/ibecon">Economics</a>
        <a href="/ibbm">Business</a>
        <a href="/tools">Tools</a>
        <a href="/experiments">Experiments</a>
        <a href="/find" class="is-active">Find</a>
      </nav>
    </div>
  </header>

  <main class="main">
    <div class="wrap narrow">
      <span class="page-label">Find a tool</span>
      <nav class="trail" id="trail" aria-label="Your answers so far"></nav>
      <div id="step" aria-live="polite"></div>

      <section id="remember" hidden>
        <h2 class="section-head"><span>Remember these?</span><button class="linkish" id="shuffle" type="button">Three more</button></h2>
        <div id="remember-list" class="small"></div>
      </section>

      <section>
        <h2 class="section-head"><span>Know what you want?</span></h2>
        <input class="search" id="search" type="search" placeholder="Search by name or word: quiz, poll, finance, pdf..." autocomplete="off" aria-label="Search tools">
        <div id="search-results" class="small"></div>
      </section>
    </div>
  </main>

  <footer class="site-footer">
    <div class="wrap">Built by Sam G &middot; all vibe coded (<a href="/ai">how I use AI</a>) &middot; found a problem? tell Sam.</div>
  </footer>

<script src="tools.js"></script>
<script src="tree.js"></script>
<script>
(function () {
  var COLOUR = { econ: "#145c34", bm: "#1a3a7a", hist: "#7a2d0a", maths: "#7a1a4a", any: "#4a1a7a" };
  var tools = window.TOOLS || [];
  var byUrl = {}; tools.forEach(function (t) { byUrl[t.url] = t; });
  var tree = window.TREE;

  // Per-viewer memory of what was opened from here, for "Remember these?".
  var OPENED_KEY = "find-opened";
  function readOpened() { try { return JSON.parse(localStorage.getItem(OPENED_KEY)) || {}; } catch (e) { return {}; } }
  function markOpened(url) {
    try { var o = readOpened(); o[url] = Date.now(); localStorage.setItem(OPENED_KEY, JSON.stringify(o)); } catch (e) {}
  }

  function el(tag, cls, text) { var e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }

  // Unique tools anywhere below an option, for the "n tools" hint.
  function countUnder(opt) {
    var seen = {};
    (function walk(o) {
      if (o.tools) o.tools.forEach(function (u) { seen[u] = 1; });
      else o.next.opts.forEach(walk);
    })(opt);
    return Object.keys(seen).length;
  }

  // The path lives in ?p=teaching/general/quiz so the browser back button and bookmarks work.
  function readPath() {
    try { var p = new URLSearchParams(location.search).get("p"); return p ? p.split("/").filter(Boolean) : []; }
    catch (e) { return []; }
  }
  function hrefFor(ids) { return ids.length ? "?p=" + ids.join("/") : location.pathname; }

  // Walk the tree along the ids; stop at the first id that doesn't match.
  function resolve(ids) {
    var node = tree, steps = [], leaf = null;
    for (var i = 0; i < ids.length && node; i++) {
      var opt = node.opts.filter(function (o) { return o.id === ids[i]; })[0];
      if (!opt) break;
      steps.push(opt);
      if (opt.tools) { leaf = opt; node = null; } else node = opt.next;
    }
    return { steps: steps, node: node, leaf: leaf };
  }

  function go(ids) {
    try { history.pushState(null, "", hrefFor(ids)); } catch (e) {}
    render();
    window.scrollTo({ top: 0 });
  }
  function navLink(cls, text, ids) {
    var a = el("a", cls, text); a.href = hrefFor(ids);
    a.addEventListener("click", function (e) {
      if (e.metaKey || e.ctrlKey || e.shiftKey) return;
      e.preventDefault(); go(ids);
    });
    return a;
  }

  function toolRow(t) {
    var a = el("a", "tool-row"); a.href = t.url;
    a.style.setProperty("--c", COLOUR[t.s] || COLOUR.any);
    a.appendChild(el("div", "tool-name", t.name));
    a.appendChild(el("div", "tool-desc", t.desc));
    a.addEventListener("click", function () { markOpened(t.url); });
    return a;
  }

  function render() {
    var ids = readPath();
    var r = resolve(ids);
    var at = r.steps.map(function (s) { return s.id; });

    // Trail: Start › Teaching › A general tool
    var trail = document.getElementById("trail"); trail.innerHTML = "";
    if (r.steps.length) {
      trail.appendChild(navLink("", "Start", []));
      r.steps.forEach(function (s, i) {
        trail.appendChild(el("span", "sep", "›"));
        if (i === r.steps.length - 1) trail.appendChild(el("span", "here", s.label));
        else trail.appendChild(navLink("", s.label, at.slice(0, i + 1)));
      });
    }

    var step = document.getElementById("step"); step.innerHTML = "";
    if (r.leaf) {
      var list = r.leaf.tools.map(function (u) { return byUrl[u]; }).filter(Boolean);
      step.appendChild(el("h1", "question", list.length === 1 ? "Try this one" : "Try one of these"));
      var box = el("div", "tools"); list.forEach(function (t) { box.appendChild(toolRow(t)); });
      step.appendChild(box);
    } else {
      step.appendChild(el("h1", "question", r.node.q));
      var opts = el("div", "opts");
      r.node.opts.forEach(function (o) {
        var a = navLink("opt", null, at.concat(o.id));
        a.appendChild(el("span", "opt-label", o.label));
        var n = countUnder(o);
        a.appendChild(el("span", "opt-count", n === 1 ? "1 tool" : n + " tools"));
        if (o.hint) a.appendChild(el("span", "opt-hint", o.hint));
        opts.appendChild(a);
      });
      step.appendChild(opts);
    }
    if (r.steps.length) {
      var back = el("div", "back-row");
      back.appendChild(navLink("linkish", "Back a step", at.slice(0, -1)));
      back.appendChild(navLink("linkish", "Start again", []));
      step.appendChild(back);
    }

    var rem = document.getElementById("remember");
    rem.hidden = r.steps.length > 0;
    if (!rem.hidden) renderRemember();

    document.title = (r.steps.length ? r.steps[r.steps.length - 1].label + " · " : "") + "Find a tool · unisam.nz";
  }

  var rememberPick = null;
  function renderRemember() {
    if (!rememberPick) {
      // Favour tools never opened from here, then the longest unopened. Shuffle within that.
      var opened = readOpened();
      var ranked = tools.map(function (t) { return { t: t, at: opened[t.url] || 0, r: Math.random() }; })
        .sort(function (a, b) { return (a.at - b.at) || (a.r - b.r); });
      var pool = ranked.slice(0, Math.max(9, Math.ceil(tools.length / 3)));
      pool.sort(function (a, b) { return a.r - b.r; });
      rememberPick = pool.slice(0, 3).map(function (x) { return x.t; });
    }
    var rl = document.getElementById("remember-list"); rl.innerHTML = "";
    rememberPick.forEach(function (t) { rl.appendChild(toolRow(t)); });
  }
  document.getElementById("shuffle").addEventListener("click", function () { rememberPick = null; renderRemember(); });

  // Search: every word must appear in the name, description or tags.
  var search = document.getElementById("search");
  search.addEventListener("input", function () {
    var q = search.value.trim().toLowerCase();
    var box = document.getElementById("search-results"); box.innerHTML = "";
    if (!q) return;
    var words = q.split(/\s+/);
    var hits = tools.filter(function (t) {
      var hay = (t.name + " " + t.desc + " " + (t.tags || "")).toLowerCase();
      return words.every(function (w) { return hay.indexOf(w) >= 0; });
    });
    if (!hits.length) box.appendChild(el("div", "empty", "Nothing matches that. Try a shorter word, or use the questions above."));
    hits.forEach(function (t) { box.appendChild(toolRow(t)); });
  });

  window.addEventListener("popstate", render);
  render();
})();
</script>
</body>
</html>
