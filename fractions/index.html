<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="icon" type="image/png" href="/unisamicon2.png">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>Pizza Fractions</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <!-- ============ PIZZERIA SCENE (backdrop) ============ -->
  <div id="scene">
    <!-- warm brick back wall -->
    <div id="wall"></div>

    <!-- PIZZA pennant string across the top (filled by JS) -->
    <div id="bunting"></div>

    <!-- wood-fired brick oven, back-right corner -->
    <div id="oven">
      <svg viewBox="0 0 240 210" preserveAspectRatio="xMidYMax meet">
        <!-- counter / stand -->
        <rect x="26" y="150" width="188" height="60" rx="7" fill="#9c6b45"/>
        <rect x="26" y="150" width="188" height="12" fill="#b5804f"/>
        <!-- dome -->
        <path d="M34 152 A86 80 0 0 1 206 152 Z" fill="#d69a68"/>
        <!-- dome brick lines -->
        <g fill="none" stroke="rgba(150,95,60,0.5)" stroke-width="2" stroke-linecap="round">
          <path d="M52 152 A68 63 0 0 1 188 152"/>
          <path d="M82 152 A40 38 0 0 1 158 152"/>
          <line x1="120" y1="72" x2="120" y2="90"/>
          <line x1="86" y1="100" x2="72" y2="152"/>
          <line x1="154" y1="100" x2="168" y2="152"/>
          <line x1="120" y1="112" x2="120" y2="152"/>
        </g>
        <!-- mouth -->
        <path d="M84 152 A36 34 0 0 1 156 152 Z" fill="#2e1c12"/>
        <!-- fire -->
        <ellipse cx="120" cy="150" rx="30" ry="12" fill="#ff8a3a" opacity="0.85"/>
        <ellipse cx="120" cy="150" rx="17" ry="8" fill="#ffd23a"/>
        <path class="flame" d="M110 150 q-4 -17 6 -23 q-2 12 6 6 q5 13 -4 17 Z" fill="#ff6a2a"/>
        <path class="flame flame2" d="M127 150 q-2 -12 5 -17 q-1 9 5 4 q3 9 -3 13 Z" fill="#ffb02a"/>
        <!-- chimney + smoke -->
        <rect x="150" y="50" width="22" height="36" rx="3" fill="#b5804f"/>
        <rect x="145" y="44" width="32" height="10" rx="3" fill="#9c6b45"/>
        <circle class="smoke" cx="161" cy="40" r="7" fill="rgba(255,255,255,0.5)"/>
      </svg>
    </div>

    <!-- red-and-cream checkered tablecloth counter -->
    <div id="ground"></div>

    <!-- Round Pizza Pete, the mascot -->
    <div id="mascot">
      <svg id="mascot-svg" viewBox="0 0 120 126">
        <!-- legs + feet (behind the disc) -->
        <rect x="42" y="96" width="10" height="18" rx="5" fill="#e0973f"/>
        <rect x="68" y="96" width="10" height="18" rx="5" fill="#e0973f"/>
        <ellipse cx="45" cy="116" rx="11" ry="6.5" fill="#fff"/>
        <ellipse cx="75" cy="116" rx="11" ry="6.5" fill="#fff"/>

        <g id="pizza-body">
          <!-- arms + mitten hands -->
          <path class="arm" d="M22 60 q-14 3 -18 14" stroke="#edb85a" stroke-width="8" fill="none" stroke-linecap="round"/>
          <path class="arm" d="M98 60 q14 3 18 14" stroke="#edb85a" stroke-width="8" fill="none" stroke-linecap="round"/>
          <circle cx="4" cy="78" r="7.5" fill="#fff"/>
          <circle cx="116" cy="78" r="7.5" fill="#fff"/>

          <!-- round pizza: crust + cheese -->
          <circle cx="60" cy="56" r="46" fill="#e0973f"/>
          <circle cx="60" cy="56" r="46" fill="none" stroke="#cf8b38" stroke-width="2"/>
          <circle cx="60" cy="56" r="40" fill="#f6c94e"/>

          <!-- faint slice lines (a cut pizza) -->
          <g stroke="rgba(120,74,30,0.16)" stroke-width="1.4" stroke-linecap="round">
            <line x1="60" y1="56" x2="60" y2="16"/>
            <line x1="60" y1="56" x2="95" y2="36"/>
            <line x1="60" y1="56" x2="95" y2="76"/>
            <line x1="60" y1="56" x2="60" y2="96"/>
            <line x1="60" y1="56" x2="25" y2="76"/>
            <line x1="60" y1="56" x2="25" y2="36"/>
          </g>

          <!-- pepperoni ring (around the face) -->
          <circle cx="60" cy="26" r="5.5" fill="#b8351f"/><circle cx="60" cy="26" r="3.3" fill="#d24a34"/>
          <circle cx="31" cy="43" r="5" fill="#b8351f"/><circle cx="31" cy="43" r="3" fill="#d24a34"/>
          <circle cx="89" cy="43" r="5" fill="#b8351f"/><circle cx="89" cy="43" r="3" fill="#d24a34"/>
          <circle cx="37" cy="82" r="5" fill="#b8351f"/><circle cx="37" cy="82" r="3" fill="#d24a34"/>
          <circle cx="83" cy="82" r="5" fill="#b8351f"/><circle cx="83" cy="82" r="3" fill="#d24a34"/>

          <!-- googly-eyed happy face (the bit you liked) -->
          <g class="eye"><circle cx="49" cy="54" r="9" fill="#fff"/><circle cx="51" cy="55" r="4.4" fill="#3a2c20"/><circle cx="52.6" cy="53.2" r="1.6" fill="#fff"/></g>
          <g class="eye"><circle cx="71" cy="54" r="9" fill="#fff"/><circle cx="73" cy="55" r="4.4" fill="#3a2c20"/><circle cx="74.6" cy="53.2" r="1.6" fill="#fff"/></g>
          <path d="M51 66 q9 9 18 0" stroke="#7a3a1a" stroke-width="2.6" fill="none" stroke-linecap="round"/>
          <circle cx="40" cy="64" r="3.6" fill="#ff8fab" opacity="0.55"/>
          <circle cx="80" cy="64" r="3.6" fill="#ff8fab" opacity="0.55"/>
        </g>
      </svg>
    </div>
  </div>

  <!-- floating mute toggle -->
  <button id="mute-btn" class="corner-btn" aria-label="Mute sound">🔊</button>

  <!-- ============ GAME UI ============ -->
  <div id="app">

    <!-- PICKER SCREEN -->
    <section id="picker-screen" class="screen">
      <h1 id="title"></h1>
      <p class="greeting">Mr. Pizza wants to play! Pick a game.</p>

      <div class="user-bar" id="user-bar"></div>

      <div class="picker-card">
        <p class="picker-label">How tricky?</p>
        <div class="pill-group" id="tier-group">
          <button class="pill-btn" data-tier="A">🟢 Easy</button>
          <button class="pill-btn" data-tier="B">🟡 Medium</button>
          <button class="pill-btn" data-tier="C">🔴 Challenge</button>
        </div>

        <p class="picker-label">Which game?</p>
        <div class="mode-group" id="mode-group">
          <button class="mode-card" data-mode="order">
            <span class="mode-emoji">🍕</span>
            <span class="mode-name">Order the Pizzas</span>
            <span class="mode-desc">Line up slices smallest to biggest.</span>
          </button>
          <button class="mode-card" data-mode="match">
            <span class="mode-emoji">🧩</span>
            <span class="mode-name">Match the Equivalents</span>
            <span class="mode-desc">Find two that are the same amount.</span>
          </button>
          <button class="mode-card" data-mode="build">
            <span class="mode-emoji">✏️</span>
            <span class="mode-name">Build the Fraction</span>
            <span class="mode-desc">Tap slices to shade the fraction.</span>
          </button>
        </div>
      </div>

      <button id="play-btn" class="big-btn">Let's Play!</button>
    </section>

    <!-- GAME SCREEN -->
    <section id="game-screen" class="screen hidden">
      <div class="game-header">
        <button id="back-btn" class="corner-btn" aria-label="Back to menu">↩</button>
        <span id="game-title" class="game-title"></span>
        <span id="star-count" class="star-count"></span>
      </div>

      <!-- Order the Pizzas -->
      <div id="order-board" class="mode-board hidden">
        <div class="fraction-container" id="fraction-container"></div>
        <div class="control-buttons">
          <button id="checkPizzasButton" class="mid-btn hidden">Check the Pizzas!</button>
          <button id="checkAnswersButton" class="mid-btn">Check the Order</button>
        </div>
        <div class="feed-row">
          <span class="feed-label">Pizza party:</span>
          <div id="progressRow" class="progress-row"></div>
        </div>
      </div>

      <!-- Match the Equivalents -->
      <div id="match-board" class="mode-board hidden">
        <p class="board-hint">Tap two cards that show the same amount of pizza!</p>
        <div id="match-grid" class="match-grid"></div>
      </div>

      <!-- Build the Fraction -->
      <div id="build-board" class="mode-board hidden">
        <p class="board-hint">Tap slices to shade <span id="build-target">this much</span> pizza!</p>
        <div class="build-pizza-wrap">
          <div id="build-pizza" class="build-pizza"></div>
        </div>
        <button id="checkBuildButton" class="mid-btn">Check My Pizza!</button>
      </div>

      <div id="message"></div>
    </section>

    <!-- WIN OVERLAY (transparent so Mr. Pizza dances behind it) -->
    <div class="overlay win-overlay hidden" id="win-screen">
      <div class="card">
        <h2>🎉 Great job!</h2>
        <p id="win-text"></p>
        <div class="win-btns">
          <button class="big-btn" id="win-again-btn">Play Again</button>
          <button class="big-btn alt" id="win-menu-btn">New Game</button>
        </div>
      </div>
    </div>

    <!-- ADD PLAYER DIALOG -->
    <div class="overlay dark-overlay hidden" id="user-dialog">
      <div class="card">
        <h2>New player</h2>
        <input id="user-name" type="text" maxlength="12" placeholder="Type your name" autocomplete="off">
        <p class="pick-icon-label">Pick your face</p>
        <div class="icon-grid" id="icon-grid"></div>
        <div class="win-btns">
          <button class="big-btn" id="user-save">Add me</button>
          <button class="big-btn alt" id="user-cancel">Cancel</button>
        </div>
      </div>
    </div>

  </div>

  <script src="script.js"></script>
</body>
</html>
